[workspace]
resolver = "2"
members = [
    "crates/rapidr-cli",
    "crates/rapidr-diagnostics",
    "crates/rapidr-ast",
    "crates/rapidr-lang",
    "crates/rapidr-lexer",
    "crates/rapidr-parser",
    "crates/rapidr-preprocessor",
    "crates/rapidr-runtime-core",
    "crates/rapidr-runtime-web",
    "crates/rapidr-codegen-rust",
    "crates/rapidr-buildserver",
    "crates/rapidr-value",
    "crates/rapidr-db",
    "crates/rapidr-ui-kernel",
    "crates/rapidr-ui-render",
    "crates/rapidr-ui-app",
    "crates/rapidr-ui-host-winit",
    "crates/rapidr-launcher",
    "crates/rapidr-editor",
    "crates/rapidr-project",
    "crates/rapidr-session",
    "crates/rapidr-icons",
    "crates/rapidr-langsvc",
    "crates/rapidr-studio",
    "crates/rapidr-designer",
    "crates/rapidr-lsp",
    "crates/rapidr-dap",
    "crates/rapidr-package",
    # (a spike, out of every regular build: docs/web-host-plan.md)
    "crates/rapidr-ui-host-web",
    "interpreter/rapidr-bytecode",
    "interpreter/rapidr-vm",
    "interpreter/rapidr-bcgen",
    "interpreter/rapidr-vm-host-native",
    "interpreter/rapidr-vm-host-web",
    "interpreter/rapidr-compiler-wasm",
    "interpreter/rapidr-webbundle",
    "interpreter/rapidr-runner-stub",
]

# The desktop host prototype keeps its own lockfile (see its Cargo.toml).
exclude = ["crates/rapidr-ui-proto"]

[workspace.package]
edition = "2021"
version = "2.117.0"
license = "MIT"

[workspace.dependencies]
rapidr-ast = { path = "crates/rapidr-ast" }
rapidr-lang = { path = "crates/rapidr-lang" }
rapidr-diagnostics = { path = "crates/rapidr-diagnostics" }
rapidr-lexer = { path = "crates/rapidr-lexer" }
rapidr-parser = { path = "crates/rapidr-parser" }
rapidr-preprocessor = { path = "crates/rapidr-preprocessor" }
rapidr-runtime-core = { path = "crates/rapidr-runtime-core" }
rapidr-runtime-web = { path = "crates/rapidr-runtime-web" }
rapidr-codegen-rust = { path = "crates/rapidr-codegen-rust" }
rapidr-value = { path = "crates/rapidr-value" }
rapidr-db = { path = "crates/rapidr-db" }
rapidr-ui-kernel = { path = "crates/rapidr-ui-kernel" }
rapidr-icons = { path = "crates/rapidr-icons" }
rapidr-ui-render = { path = "crates/rapidr-ui-render" }
rapidr-ui-app = { path = "crates/rapidr-ui-app" }
rapidr-ui-host-winit = { path = "crates/rapidr-ui-host-winit" }
rapidr-project = { path = "crates/rapidr-project" }
rapidr-session = { path = "crates/rapidr-session" }
rapidr-bytecode = { path = "interpreter/rapidr-bytecode" }
rapidr-vm = { path = "interpreter/rapidr-vm" }
rapidr-bcgen = { path = "interpreter/rapidr-bcgen" }
rapidr-vm-host-native = { path = "interpreter/rapidr-vm-host-native" }
rapidr-vm-host-web = { path = "interpreter/rapidr-vm-host-web" }
rapidr-compiler-wasm = { path = "interpreter/rapidr-compiler-wasm" }
rapidr-webbundle = { path = "interpreter/rapidr-webbundle" }
rapidr-langsvc = { path = "crates/rapidr-langsvc" }
rapidr-editor = { path = "crates/rapidr-editor" }
rapidr-studio = { path = "crates/rapidr-studio" }
rapidr-designer = { path = "crates/rapidr-designer" }
rapidr-lsp = { path = "crates/rapidr-lsp" }
rapidr-dap = { path = "crates/rapidr-dap" }
rapidr-package = { path = "crates/rapidr-package" }

# Crates.io crates RapidR replaces with its own. Every generated program's
# Cargo.toml gets the same section (rapidr-codegen-rust: PATCHES; an
# install's home too: tools/release/home.py).
[patch.crates-io]
# winit's KDE blur bindings: generated from LGPL-2.1-or-later protocol
# files upstream; RapidR's carry no KDE protocol (the crate's Cargo.toml).
wayland-protocols-plasma = { path = "crates/patches/wayland-protocols-plasma" }

# The interpreter runner every `rapidr build --interp` executable is made
# from: optimized like release, without symbols (64 MB → 43 MB).
[profile.runner]
inherits = "release"
strip = true
