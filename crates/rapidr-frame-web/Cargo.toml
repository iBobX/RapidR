[package]
name = "rapidr-frame-web"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
description = "RDATAFRAME's engine (rapidr-frame, polars) as a wasm module of its own: the web runtime loads it only for programs that use data frames (decision D7)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rapidr-frame = { workspace = true }
serde_json = "1"
wasm-bindgen = "0.2.129"

# (polars' hashing seeds itself from getrandom: in a browser, crypto's
# getRandomValues — getrandom 0.3 also needs
# RUSTFLAGS='--cfg getrandom_backend="wasm_js"', which only this module's
# build sets: tools/build_web_artifacts.sh)
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom2 = { package = "getrandom", version = "0.2", features = ["js"] }
