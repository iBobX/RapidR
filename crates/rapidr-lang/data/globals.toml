# The global objects: there in every program, never created (RapidQ's Screen, Application,
# Clipboard; FileRec, which DIR$ fills; Printer, a QPRINTER; RapidR's Mouse).

[[object]]
name = "Screen"
kind = "global"
doc = "The screen: its size and work area, the mouse's position, the monitors, the mouse cursor shown, and its density (`Scale`)."
properties = [
  { name = "ConsoleX", type = "int", access = "read" },
  { name = "ConsoleY", type = "int", access = "read" },
  { name = "Cursors", type = "int", indexed = 1, doc = "The cursor handles by cursor code: Cursors(i) = a handle from LoadCursorFromFile or LoadCursor (Windows) makes Cursor = i show it; 0 puts the standard cursor back. Reading gives the handle in use (Windows; 0 on other systems, which have no cursor handles)." },
  { name = "Height", type = "int", access = "read" },
  { name = "MouseX", type = "int", access = "read" },
  { name = "MouseY", type = "int", access = "read" },
  { name = "Width", type = "int", access = "read" },
  { name = "Cursor", type = "enum", values = ["crDefault", "crNone", "crArrow", "crCross", "crIBeam", "crSize", "crSizeNESW", "crSizeNS", "crSizeNWSE", "crSizeWE", "crUpArrow", "crHourGlass", "crDrag", "crNoDrop", "crHSplit", "crVSplit", "crMultiDrag", "crSQLWait", "crNo", "crAppStart", "crHelp", "crHandPoint"] },
  { name = "ClientHeight", type = "int", access = "read", from = "RAPIDQ2.INC" },
  { name = "ClientWidth", type = "int", access = "read", from = "RAPIDQ2.INC" },
  { name = "Monitors", type = "int", access = "read", from = "RAPIDQ2.INC" },
  { name = "MouseButtons", type = "int", access = "read", from = "RAPIDQ2.INC" },
  { name = "MousePresent", type = "int", access = "read", from = "RAPIDQ2.INC" },
  { name = "MouseSwap", type = "int", access = "read", from = "RAPIDQ2.INC" },
  { name = "PixelsPerInch", type = "int", access = "read", origin = "rapidr" },
  { name = "Scale", type = "float", access = "read", origin = "rapidr" },
]
methods = [
  { name = "GetPixelDepth", from = "RAPIDQ2.INC" },
]
events = []

[[object]]
name = "Application"
kind = "global"
doc = "The running program: its file and folder, title, icon, hint settings, RapidR's Theme (and OnThemeChange when the look changes), RapidR's Language (and OnLanguageChange), and Terminate to end it."
properties = [
  { name = "ExeName", type = "string", access = "read" },
  { name = "Handle", type = "int", access = "read" },
  { name = "HelpFile", type = "string", kind = "file:any" },
  { name = "HintColor", type = "color" },
  { name = "HintHidePause", type = "int" },
  { name = "HintPause", type = "int" },
  { name = "HintShortPause", type = "int" },
  { name = "Icon", type = "picture" },
  { name = "IcoHandle", type = "resource", access = "write" },
  { name = "ShowHint", type = "bool" },
  { name = "Title", type = "string" },
  { name = "Path", type = "string", access = "read" },
  { name = "Theme", type = "string", origin = "rapidr", doc = "The look the program is drawn in now, by name: `rapidr light`, `rapidr dark`, `rapidr high contrast` or `classic`. Setting it takes any name `$THEME` takes (`rapidr`: RapidR's look as the system is)." },
  { name = "Language", type = "string", origin = "rapidr", doc = "The language the program speaks, as a language tag (`es`, `es-AR`, `pt-BR`, `zh-Hans`): the system's until the program sets it. `TR$` and `TRN$` translate into it from the program's `lang` folder (`es-AR`: `lang/es-AR.po`, then `lang/es.po`, then the program's own text). Setting it reads the catalogs again; \"\" goes back to the system's language. Any spelling is taken (`es_ar` reads back as `es-AR`)." },
  { name = "ReducedMotion", type = "bool", access = "read", origin = "rapidr", doc = "True when the user asked the system for reduced motion (macOS' Reduce Motion, Windows' animations turned off, the browser's prefers-reduced-motion): a program's own animations — a pulse, a slide — then stay still or end at once, as RapidR's own do. Read it each time an animation starts." },
  { name = "KeysPending", type = "int", access = "read", origin = "rapidr", doc = "How many keystrokes sent with SendKeys are still waiting to reach the program's windows." },
]
methods = [
  { name = "HelpCommand", params = "Command AS WORD, Data AS LONG", missing = true },
  { name = "HelpContext", params = "Context AS LONG", missing = true },
  { name = "HelpJump", params = "JumpID AS STRING", missing = true },
  { name = "Minimize" },
  { name = "Terminate" },
  { name = "ThemeColor", params = "Name AS STRING", returns = "LONG", value = true, origin = "rapidr", effects = ["none"], doc = "A colour of the current theme by name, as a colour value (&HBBGGRR): the theme's own (\"face\", \"window\", \"accent\" …) and an IDE's (\"toolbar\", \"statusbar\", \"statusbar.running\", \"page.link\", \"editor.keyword\", the debugger's \"debug.number\", \"debug.string\", \"debug.changed\" …); -1 for a name no theme has. The colour of the look now: read it again in OnThemeChange, when the look changes." },
  { name = "SendKeys", params = "Keys AS STRING", returns = "INTEGER", origin = "rapidr", doc = "Sends keystrokes to the program's own frontmost window, as if typed: one per turn of the event loop, through the same keyboard path as the user's keys (focus, shortcuts, OnKeyDown / OnKeyPress). The classic SendKeys notation: + Shift, ^ Ctrl, % Alt (for the next key or a group in parentheses), ~ Enter, {TAB}, {ENTER}, {BS}, {DEL}, {ESC}, {UP}, {DOWN}, {LEFT}, {RIGHT}, {HOME}, {END}, {PGUP}, {PGDN}, {INS}, {F1} to {F16}, {+} {^} {%} {~} {(} {)} {{} {}} for those characters, {KEY n} for n presses. False, and nothing sent, when Keys is malformed." },
  { name = "Announce", params = "Text AS STRING, [Assertive AS INTEGER]", origin = "rapidr", effects = ["ui"], example = "Application.Announce \"3 rows found\"", doc = "Has the system's screen reader say Text without moving the focus: politely, when they have finished what they are saying — or at once, interrupting, when Assertive is True (keep that for what can't wait: an error, a lost connection). For news the person didn't ask for: a search's result, a new card in a feed, a finished download. The same text said again is said again. On the desktop through the focused window's live regions (AccessKit), on the web through the page's aria-live region; with no screen reader on, nothing happens." },
  { name = "GetPriority", missing = true },
  { name = "SetPriority", params = "Priority AS LONG", returns = "VARIANT", missing = true },
]
events = [
  { name = "OnError", params = "Message AS STRING, File AS STRING, Line AS INTEGER", origin = "rapidr", doc = "A run-time error ended one of the program's event handlers (a click's, a timer's …) and the program goes on, as it does after such an error: the error's message (\"Division by zero\", \"Cannot create file icons/a.svg.\"), the file and the line it happened on (\"\" and 0 when not known). For a program that keeps its user's work safe: say what happened, write it to a log, save what's unsaved. Fires after the error, at the next turn of the event loop, once per error — not for an error in this handler itself. Without a handler the error is only written to the program's error output. An error in the main program's own code (not a handler) still ends the program. `SUB Failed(Message AS STRING, File AS STRING, Line AS INTEGER)` … `Application.OnError = Failed`. A native build says no file or line (\"\" and 0)." },
  { name = "OnLanguageChange", origin = "rapidr", doc = "The program's language changed (it set Language to another one): fires once per change, at the next turn of the event loop, from the moment the handler is bound. Text the program made with TR$ or TRN$ is a value, not a link: make it again here (`Label1.Caption = TR$(\"Save file\")`). Language says the language now." },
  { name = "OnThemeChange", origin = "rapidr", doc = "The look the program is drawn in changed: the program set Theme to another look, or the system switched between light, dark and high contrast while the program follows it (RapidR's look, `$THEME rapidr`, the default). Fires once per change, after it, from the moment the handler is bound. Colours the program read with ThemeColor are values, not links: read them again here and assign them (`Label1.Font.Color = Application.ThemeColor(\"page.text\")`); Windows' system colours (clBtnFace, clWindowText …) and components' own colours follow the look by themselves. Theme says the look now." },
]

[[object]]
name = "Clipboard"
kind = "global"
doc = "The clipboard: its text and the formats on it (the system's clipboard on the desktop)."
properties = [
  { name = "Format", type = "int", indexed = 1 },
  { name = "FormatCount", type = "int", access = "read" },
  { name = "Text", type = "string" },
]
methods = [
  { name = "Clear" },
  { name = "Close" },
  { name = "GetAsHandle", params = "Format AS WORD", returns = "LONG", missing = true },
  { name = "GetAsText", params = "length AS INTEGER", returns = "STRING" },
  { name = "HasFormat", params = "Format AS WORD", returns = "SHORT" },
  { name = "Open" },
  { name = "SetAsHandle", params = "Format AS WORD, Handle AS LONG", missing = true },
  { name = "SetAsText", params = "Text AS STRING" },
]
events = []

[[object]]
name = "Mouse"
kind = "global"
origin = "rapidr"
doc = "The mouse pointer's position on the screen (X, Y). RapidR's own."
properties = [
  { name = "X", type = "int", access = "read" },
  { name = "Y", type = "int", access = "read" },
]
methods = []
events = []

[[object]]
name = "FileRec"
kind = "global"
doc = "What the last DIR$ found: the file's name, short name, date, time and size."
properties = [
  { name = "FileName", type = "string", access = "read", kind = "file:any" },
  { name = "ShortName", type = "string", access = "read" },
  { name = "Date", type = "string", access = "read" },
  { name = "Time", type = "string", access = "read" },
  { name = "Size", type = "int", access = "read" },
  { name = "FileTime", type = "int", access = "read" },
]
methods = []
events = []

[[object]]
name = "Printer"
kind = "global"
instance_of = "RPRINTER"
doc = "The printer, ready to use (an RPrinter): each document becomes a PDF sent to the system's printer, or the browser's print dialog on the web."
properties = []
methods = []
events = []
