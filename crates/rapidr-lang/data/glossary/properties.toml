# Docs and categories of properties by name (any component that has one
# and gives it no doc of its own). Written in RapidR's own words.

[property]
Aborted = { category = "Misc", doc = "Non-zero when the current print job was cancelled with `Abort`; read-only." }
Absoluteindex = { category = "Data", doc = "On a tree node (`Item(i).AbsoluteIndex`), its position counting every node from the top, from 0; the same as `Index`." }
Accept = { category = "Network", doc = "The content types the browser accepts (the request's `HTTP_ACCEPT`); read-only." }
Accuracy = { category = "Data", doc = "How precise the last reported position is, in metres." }
ActiveOnly = { category = "Behavior", doc = "When true, the timer pauses while the application isn't the active one." }
Align = { category = "Layout", doc = "Where the control docks in its parent: one of the `alXXX` constants. `alNone` keeps its own place; `alClient` fills what the other docked controls leave." }
Alignment = { category = "Appearance", doc = "How the text lines up inside the control: `taLeftJustify`, `taCenter` or `taRightJustify`; on a popup menu, which side of the point it opens on." }
AllowAllUp = { category = "Behavior", doc = "With a `GroupIndex`, lets every button of the group be up at once; otherwise one always stays down." }
AllowInPlace = { category = "Behavior", doc = "Whether the OLE object may be edited inside the container rather than in its own application's window." }
AllowStretch = { category = "Drawing", doc = "Whether the back buffer is stretched to fill the control when their sizes differ." }
AltAlign = { category = "Layout", doc = "The edge (an `alXXX` value) the dock form's alternative docking place sits at." }
AltDock = { category = "Layout", doc = "1 while the docked form sits at its alternative place, 0 at its home; read-only." }
Angle = { category = "Appearance", doc = "The rotation of the label's text, in degrees counter-clockwise; it needs a TrueType font." }
AudioOff = { category = "Media", doc = "True mutes the video's sound track." }
AudioOpen = { category = "Media", doc = "True while the CD audio device is open; read-only." }
AuthType = { category = "Network", doc = "How the request was authenticated (the request's `AUTH_TYPE`, e.g. `Basic`); read-only." }
AutoConvert = { category = "Network", doc = "1 (the default) decodes form values in `Parse`: `%xx` becomes its character and `+` a space; 0 keeps them as sent." }
AutoPlay = { category = "Media", doc = "Starts the audio or video playing as soon as it can (the element's `autoplay`)." }
AutoPopup = { category = "Behavior", doc = "When true, a right click on a control the menu is attached to opens it; false leaves that to the program's `Popup`." }
AutoScroll = { category = "Layout", doc = "Shows scroll bars by itself when the controls inside reach past the visible area." }
AutoShow = { category = "Behavior", doc = "Whether the OLE object is shown as soon as it's loaded." }
AutoSize = { category = "Layout", doc = "Makes the control fit its content: a label its text, an image its picture, an edit its font's height; a DirectX screen's buffer follows the control's size." }
AutoUpdate = { category = "Media", doc = "Keeps the sound's buffer filled by itself while it streams." }
Average = { category = "Data", doc = "The mean of the array's values; the same as `Avg`." }
Avg = { category = "Data", doc = "The mean of the array's values; the same as `Average`." }
BackColor = { category = "Appearance", doc = "The colour of the gauge's unfilled part, as &HBBGGRR." }
BaudRate = { category = "Network", doc = "The serial line's speed: a `brXXX` constant (`br9600` …) or the rate itself in bits per second." }
Beveled = { category = "Appearance", doc = "Draws the splitter bar with a raised 3-D edge." }
BevelInner = { category = "Appearance", doc = "The inner bevel: `bvNone`, `bvLowered` or `bvRaised`." }
BevelOuter = { category = "Appearance", doc = "The outer bevel: `bvNone`, `bvLowered` or `bvRaised`." }
BevelWidth = { category = "Appearance", doc = "The width of each bevel, in pixels." }
BitCount = { category = "Drawing", doc = "The colour depth of the full-screen display mode, in bits per pixel (8, 16, 24 or 32)." }
Bits = { category = "Media", doc = "Bits per sample of a new recording (8 or 16)." }
BkColor = { category = "Appearance", doc = "The colour the images are drawn on; `clNone` (the default) draws them transparent." }
BlendColor = { category = "Appearance", doc = "The colour blended over images drawn focused or selected; `clNone` by default." }
BMP = { category = "Appearance", doc = "The picture shown, from a .BMP file name; on a button, its glyph." }
BMPClosed = { category = "Appearance", doc = "The picture (a .BMP file name) drawn beside a closed outline node; write-only." }
BMPHandle = { category = "Appearance", doc = "Sets the picture from a resource handle (`$RESOURCE`) instead of a file; write-only." }
BMPHandleClosed = { category = "Appearance", doc = "Sets the closed-node picture from a resource handle; write-only." }
BMPHandleLeaf = { category = "Appearance", doc = "Sets the leaf-node picture from a resource handle; write-only." }
BMPHandleMinus = { category = "Appearance", doc = "Sets the collapse-button picture from a resource handle; write-only." }
BMPHandleOpen = { category = "Appearance", doc = "Sets the open-node picture from a resource handle; write-only." }
BMPHandlePlus = { category = "Appearance", doc = "Sets the expand-button picture from a resource handle; write-only." }
BMPLeaf = { category = "Appearance", doc = "The picture (a .BMP file name) drawn beside an outline node without children; write-only." }
BMPMinus = { category = "Appearance", doc = "The picture (a .BMP file name) of the button that collapses an outline node; write-only." }
BMPOpen = { category = "Appearance", doc = "The picture (a .BMP file name) drawn beside an expanded outline node; write-only." }
BMPPlus = { category = "Appearance", doc = "The picture (a .BMP file name) of the button that expands an outline node; write-only." }
Body = { category = "Misc", doc = "The text shown under the notification's title." }
Bold = { category = "Font", doc = "True for a bold font." }
BorderStyle = { category = "Appearance", doc = "The border: one of the `bsXXX` constants. On a form, `bsSizeable` lets the user resize it, `bsDialog` doesn't, `bsNone` has no title bar." }
Bottom = { category = "Layout", doc = "The rectangle's bottom edge, in pixels." }
BrushColor = { category = "Drawing", doc = "The fill colour the drawing methods use, as &HBBGGRR (RapidR's shortcut for the brush)." }
BufferLength = { category = "Media", doc = "The length of the sound's streaming buffer, in milliseconds." }
Buttons = { category = "Data", doc = "The joystick buttons held down, one bit each: bit n − 1 for button n." }
ButtonStyle = { category = "Appearance", doc = "Draws the tabs as push buttons instead of tabs." }
BytesNotRead = { category = "Network", doc = "Bytes received but not yet read, as the last read or write saw them; read-only." }
BytesNotWritten = { category = "Network", doc = "Bytes still waiting to be sent, as the last read or write saw them; read-only." }
Cancel = { category = "Behavior", doc = "Makes this the button the Esc key presses on its form." }
CanClose = { category = "Behavior", doc = "Shows a close button on the dock form's title so the user can close it." }
Canvas = { category = "Drawing", doc = "The canvas the dock form's frame and title are drawn on." }
Caption = { category = "Appearance", doc = "The text shown on the control, or a window's or dialog's title; an `&` before a letter underlines it as the keyboard shortcut." }
cbSize = { category = "Misc", doc = "The structure's size in bytes, filled in for you; read-only." }
Cell = { category = "Data", doc = "A cell's text, `Cell(col, row)`, both from 0 with the fixed rows and columns counted." }
Cells = { category = "Data", doc = "The same as `Cell(col, row)`: a cell's text." }
Center = { category = "Layout", doc = "Centres the picture in the control instead of placing it at the top left." }
CharCase = { category = "Behavior", doc = "Turns typed text to `ecUpperCase` or `ecLowerCase`; `ecNormal` leaves it as typed." }
Charset = { category = "Font", doc = "The character set the font is made for (`DEFAULT_CHARSET` …)." }
CheckBoxes = { category = "Appearance", doc = "Shows a check box beside each item." }
Checked = { category = "Data", doc = "True when the check box, radio button or menu item is checked." }
ChildCaption = { category = "Window", doc = "The active MDI child window's title." }
ChildCount = { category = "Window", doc = "The number of MDI child windows open; read-only." }
ChildHandle = { category = "Window", doc = "The handle of the active MDI child window; read-only." }
ChildHeight = { category = "Window", doc = "The active MDI child window's height, in pixels." }
ChildIcon = { category = "Window", doc = "The icon shown on the MDI child windows' title bars." }
ChildLeft = { category = "Window", doc = "The active MDI child window's left edge inside the client area, in pixels." }
ChildMax = { category = "Window", doc = "The most MDI child windows the form takes (1024)." }
ChildResult = { category = "Window", doc = "Set it to False in `OnChildClose` to keep the child window open." }
ChildState = { category = "Window", doc = "The active MDI child window's state: 0 normal, 1 minimized, 2 maximized." }
ChildTop = { category = "Window", doc = "The active MDI child window's top edge inside the client area, in pixels." }
ChildWidth = { category = "Window", doc = "The active MDI child window's width, in pixels." }
Client = { category = "Layout", doc = "The panel inside the dock form that holds the program's own controls; parent them to it." }
ClientCount = { category = "Network", doc = "The number of clients connected to the server now." }
ClientHeight = { category = "Layout", doc = "The height of the area inside the borders (and a form's title bar and menu), in pixels; on `Screen`, the work area's, without the task bar." }
ClientWidth = { category = "Layout", doc = "The width of the area inside the borders, in pixels; on `Screen`, the work area's, without the task bar." }
Closed = { category = "Window", doc = "True when the dock form has been closed (hidden); `Dock` brings it back; read-only." }
Col = { category = "Data", doc = "The column of the grid's selected cell, from 0." }
ColCount = { category = "Data", doc = "The number of columns: of a grid (fixed ones included), of a query's result, of a data frame." }
Color = { category = "Appearance", doc = "The background colour, as &HBBGGRR or a `clXXX` system colour; on a colour or font dialog, the colour picked." }
ColorHighLight = { category = "Appearance", doc = "The colour of the oval button's lit edge, as &HBBGGRR." }
Colors = { category = "Data", doc = "The custom colours the colour dialog offers, `Colors(1)` to `Colors(16)`." }
ColorShadow = { category = "Appearance", doc = "The colour of the oval button's shaded edge, as &HBBGGRR." }
Cols = { category = "Data", doc = "RapidR's name for a grid's `ColCount`." }
Column = { category = "Data", doc = "A list view column, `Column(i)` from 0, with its own `Caption`, `Width` and `Alignment`." }
ColumnClick = { category = "Behavior", doc = "Makes the column headers act as buttons that fire `OnColumnClick`." }
ColumnList = { category = "Data", doc = "The choices a `gcsList` grid column drops down, `ColumnList(col)`." }
Columns = { category = "Layout", doc = "On a list box, how many columns the items flow into (0: one, scrolling down); on a list view, the column count; on a data frame, the column names, comma-separated." }
ColumnsCount = { category = "Data", doc = "The number of list view columns." }
ColumnStyle = { category = "Behavior", doc = "How a grid column edits, `ColumnStyle(col)`: `gcsNone` as text, `gcsList` with a drop-down of `ColumnList`, `gcsEllipsis` with a … button." }
ColWidth = { category = "Layout", doc = "RapidR's name for a grid's `DefaultColWidth`." }
ColWidths = { category = "Layout", doc = "A grid column's width in pixels, `ColWidths(col)` from 0." }
Command = { category = "Misc", doc = "The menu item's command number, as the system identifies it; read-only." }
CompCount = { category = "Data", doc = "The number of components on the design surface." }
ComponentIndex = { category = "Window", doc = "The index the active MDI child was added with (`AddChild`'s third argument); read-only." }
Connected = { category = "Network", doc = "Non-zero while the connection (database, serial port, socket) is open, or while the joystick is plugged in." }
ConsoleX = { category = "Misc", doc = "The console's width in characters (80); read-only." }
ConsoleY = { category = "Misc", doc = "The console's height in lines (25); read-only." }
ContentLength = { category = "Network", doc = "The length in bytes of the request's body (`CONTENT_LENGTH`); read-only." }
ContentType = { category = "Network", doc = "The type of the request's body (`CONTENT_TYPE`); read-only." }
Controls = { category = "Media", doc = "Shows the browser's play, pause and volume controls on the audio or video." }
Cookie = { category = "Network", doc = "The cookies sent with the request (`HTTP_COOKIE`); read-only." }
Copies = { category = "Misc", doc = "How many copies to print." }
CopyMode = { category = "Drawing", doc = "How `Draw` and `CopyRect` combine the source with what's there: one of the `cmXXX` raster operations (`cmSrcCopy` copies)." }
Count = { category = "Data", doc = "How many items it holds: list items, tree nodes, strings, menu items, images, JSON entries or designed components." }
CssClass = { category = "Appearance", doc = "The element's CSS class names (its `class` attribute)." }
CssStyle = { category = "Appearance", doc = "The element's inline CSS (its `style` attribute); its place and size stay the runtime's." }
CurrentFrame = { category = "Media", doc = "The frame (video) or position (MIDI) playing now; setting it seeks there." }
CurrentKey = { category = "Data", doc = "The handle of the registry key open now; read-only." }
CurrentPath = { category = "Data", doc = "The path of the registry key open now, under `RootKey`; read-only." }
CurrentPos = { category = "Media", doc = "The position in the wave, in milliseconds; setting it seeks there." }
CurrentTime = { category = "Media", doc = "The audio's or video's position, in seconds; setting it seeks there." }
CurrentTrack = { category = "Media", doc = "The CD track playing or selected, from 1; setting it moves there." }
Cursor = { category = "Appearance", doc = "The mouse pointer shown over the control: one of the `crXXX` constants." }
Cursors = { category = "Appearance", doc = "A mouse pointer's handle, `Cursors(i)` by its `crXXX` number; read-only." }
Data = { category = "Data", doc = "The array's values as text, comma-separated (`1,2,3`); setting it fills the array." }
Database = { category = "Data", doc = "The database in use: an SQLite file, or a MySQL database's name." }
DataBits = { category = "Network", doc = "Bits per character on the serial line (5 to 8)." }
Date = { category = "Data", doc = "The date picked in the date-time picker, or a file's date (`FileRec`), as text." }
dB = { category = "Data", doc = "A database's name, `dB(i)` from 0, as the server lists them." }
DBCount = { category = "Data", doc = "The number of databases the server lists." }
DcbFlags = { category = "Network", doc = "The serial port's flow-control flag bits, read at `Open`: 20625 none, 24725 hardware, 21393 XON / XOFF." }
Default = { category = "Behavior", doc = "Makes this the button the Enter key presses on its form." }
DefaultColWidth = { category = "Layout", doc = "The width of grid columns not given their own, in pixels." }
DefaultExt = { category = "Behavior", doc = "The extension added to a file name typed without one (`txt`, no dot)." }
DefaultRowHeight = { category = "Layout", doc = "The height of grid rows not given their own, in pixels." }
DeviceType = { category = "Media", doc = "The device type the wave opens with (`waveaudio`)." }
Directory = { category = "Data", doc = "The folder shown by the file list, directory tree or directory list view." }
Display = { category = "Data", doc = "The text the digital display shows: digits, and the few letters and signs segments can form." }
dlw_PopupMenu = { category = "Behavior", doc = "The popup menu the directory list view opens on a right click." }
Docked = { category = "Layout", doc = "True while the dock form is docked, false while it floats in its own window; read-only." }
DockStyle = { category = "Appearance", doc = "How the dock form's frame and title look while it's docked: a style number." }
Down = { category = "Data", doc = "True while the button is pressed in; with a `GroupIndex` it stays down." }
Dpi = { category = "Drawing", doc = "The dots per inch the plot is rendered at." }
DragCursor = { category = "Appearance", doc = "The mouse pointer (a `crXXX` number) shown where the dock form can be dragged from." }
DrawingStyle = { category = "Drawing", doc = "How the images are drawn: `dsNormal`, `dsTransparent`, or blended with `BlendColor` (`dsFocused`, `dsSelected`)." }
Drive = { category = "Data", doc = "The drive the file list shows (`C:`)." }
DropDownCount = { category = "Appearance", doc = "How many items the drop-down list shows before it scrolls." }
DType = { category = "Data", doc = "The array's element type: `float64`." }
Duplicates = { category = "Behavior", doc = "What a sorted string list does with a string it already has: `dupIgnore` drops it, `dupAccept` adds it, `dupError` raises an error." }
Duration = { category = "Media", doc = "The audio's or video's length, in seconds; read-only." }
DVX = { category = "Drawing", doc = "The vector's X component." }
DVY = { category = "Drawing", doc = "The vector's Y component." }
DVZ = { category = "Drawing", doc = "The vector's Z component." }
EditorMode = { category = "Behavior", doc = "True while the grid's selected cell is being edited (or cells are always editable)." }
EditText = { category = "Data", doc = "The edit's text as shown, with the input mask's literal characters." }
Empty = { category = "Data", doc = "Non-zero when the data frame has no rows, or the bitmap holds no picture; read-only." }
Enabled = { category = "Behavior", doc = "Whether the control answers the mouse and keyboard (a disabled one is greyed); on a timer, whether it ticks." }
EOF = { category = "Data", doc = "Non-zero when the read position is at the end of the stream; read-only." }
Error = { category = "Media", doc = "The device's error text after an `Open` that failed; empty otherwise; read-only." }
ExeName = { category = "Misc", doc = "The program's executable file name; read-only." }
Expanded = { category = "Data", doc = "On a tree node (`Item(i).Expanded`), whether its children are shown; setting it opens or closes the node." }
ExtendedSelect = { category = "Behavior", doc = "With `MultiSelect`, lets Shift and Ctrl clicks select a range or add items." }
ExtensionsList = { category = "Data", doc = "A string list of the file extensions the directory list view shows." }
FaceCount = { category = "Data", doc = "The number of faces in the mesh; read-only." }
Family = { category = "Network", doc = "The socket's address family, one of the `AF_XXX` constants (`AF_INET`)." }
FastLoad = { category = "Behavior", doc = "Reads a folder's subfolders only when it's opened, so big trees show sooner." }
FieldCount = { category = "Data", doc = "The number of fields (columns) in the last query's result." }
File = { category = "Network", doc = "The path of the file to download on the server (`/dir/file.zip`)." }
FileName = { category = "Data", doc = "The file chosen in a dialog (with its folder), or the file the object reads or writes." }
FileOpen = { category = "Media", doc = "True while a file is open on the device; read-only." }
Files = { category = "Data", doc = "With `MultiSelect`, the files picked: `Files(0)` is the folder, `Files(1)` on the names." }
FileTime = { category = "Data", doc = "The file's date and time as one packed number; read-only." }
FileTitle = { category = "Data", doc = "The chosen file's name without its folder; read-only." }
Filter = { category = "Behavior", doc = "The file types offered, as description|patterns pairs (`Text|*.txt|All Files|*.*`), patterns split by `;`." }
FilterIndex = { category = "Behavior", doc = "Which filter is selected, from 1." }
FixedColor = { category = "Appearance", doc = "The background colour of the grid's fixed rows and columns." }
FixedCols = { category = "Layout", doc = "How many columns at the grid's left stay fixed as headers." }
FixedRows = { category = "Layout", doc = "How many rows at the grid's top stay fixed as headers." }
Flat = { category = "Appearance", doc = "Draws the button without a border until the mouse is over it." }
FlatButtons = { category = "Appearance", doc = "With `ButtonStyle`, draws the tab buttons flat." }
Flatseparators = { category = "Appearance", doc = "RapidR's spelling of `FlatSeperators`." }
FlatSeperators = { category = "Appearance", doc = "With flat tab buttons, draws separators between them (RapidQ's spelling)." }
FocusButtons = { category = "Behavior", doc = "Lets the tab buttons take the keyboard focus." }
FogColor = { category = "Drawing", doc = "The colour of the frame's fog." }
FogMode = { category = "Drawing", doc = "How the fog thickens with distance: linear, exponential or exponential squared." }
Font = { category = "Font", doc = "The font of the text, an RFont; assigning one copies it." }
FontColor = { category = "Font", doc = "RapidR's shortcut for `Font.Color`: the text colour, as &HBBGGRR." }
FontCount = { category = "Font", doc = "The number of fonts installed; read-only." }
FontName = { category = "Font", doc = "On a font dialog or RFont, an installed font's name, `FontName(i)` from 0; elsewhere RapidR's shortcut for `Font.Name`." }
Fonts = { category = "Font", doc = "A printer font's name, `Fonts(i)` from 0; read-only." }
FontsCount = { category = "Font", doc = "The number of printer fonts; read-only." }
FontSize = { category = "Font", doc = "RapidR's shortcut for `Font.Size`, in points." }
ForeColor = { category = "Appearance", doc = "The colour of the gauge's filled part, as &HBBGGRR." }
Format = { category = "Data", doc = "A format the clipboard holds, `Format(i)` from 0." }
FormatCount = { category = "Data", doc = "The number of formats the clipboard holds; read-only." }
FormCaption = { category = "Data", doc = "The caption of the form being designed." }
FormStyle = { category = "Window", doc = "`fsNormal`, `fsStayOnTop` (above other windows), or an MDI parent or child (`fsMDIForm`, `fsMDIChild`)." }
FrameRate = { category = "Drawing", doc = "How many times the timer fired in the last whole second; read-only." }
Frequence = { category = "Media", doc = "Samples per second of a new recording (11025, 22050, 44100 …); RapidQ's spelling." }
Frequency = { category = "Media", doc = "On a DirectX sound, the playback rate in samples per second; on a track bar, the step between tick marks." }
FullScreen = { category = "Drawing", doc = "Takes the whole screen in the display mode `BitCount` and the size give." }
GatewayInterface = { category = "Network", doc = "The CGI version the web server speaks (`GATEWAY_INTERFACE`, `CGI/1.1`); read-only." }
GetBMP = { category = "Data", doc = "An image of the list as a bitmap, `GetBMP(i)` from 0; read-only." }
GetICO = { category = "Data", doc = "An image of the list as an icon, `GetICO(i)` from 0; read-only." }
GetSubList = { category = "Data", doc = "The names of the SUBs and FUNCTIONs declared in the text, in order." }
Grid = { category = "Appearance", doc = "Non-zero draws grid lines on the plot." }
GridHeight = { category = "Layout", doc = "The height of all the grid's rows together, in pixels." }
GridLines = { category = "Appearance", doc = "Draws lines between the rows and columns." }
GridLineWidth = { category = "Appearance", doc = "The width of the lines between cells, in pixels." }
GridWidth = { category = "Layout", doc = "The width of all the grid's columns together, in pixels." }
GroupIndex = { category = "Behavior", doc = "Buttons with the same non-zero number act as a group: pressing one raises the others." }
Handle = { category = "Misc", doc = "The window (or other system object's) handle, for API calls and for components that take one." }
HasChildren = { category = "Data", doc = "On a tree node (`Item(i).HasChildren`), whether it has child nodes; setting it shows a button before any are added." }
Hash = { category = "Data", doc = "The same as Route: the address's `#hash` without the `#`." }
HasSubKeys = { category = "Data", doc = "Non-zero when the open registry key has subkeys; read-only." }
Height = { category = "Layout", doc = "The height, in pixels; on `Screen`, the screen's." }
HelpFile = { category = "Help", doc = "The help file the program opens for F1." }
hIcon = { category = "Appearance", doc = "The handle of the icon the tray shows (`Application.Icon`, or an image's)." }
HideScrollBars = { category = "Appearance", doc = "Hides scroll bars until the text needs them, instead of showing them disabled." }
HideSelection = { category = "Appearance", doc = "Hides the selection's highlight while the control doesn't have the focus." }
Hint = { category = "Help", doc = "The tooltip shown when the mouse rests on the control (with `ShowHint`)." }
HintColor = { category = "Help", doc = "The background colour of tooltips, as &HBBGGRR." }
HintHidePause = { category = "Help", doc = "How long a tooltip stays up, in milliseconds (2500)." }
HintPause = { category = "Help", doc = "How long the mouse must rest before a tooltip shows, in milliseconds (500)." }
HintShortPause = { category = "Help", doc = "The delay before the next tooltip when the mouse moves on to another control, in milliseconds (50)." }
HorzIncrement = { category = "Layout", doc = "How far a click on the horizontal scroll bar's arrow scrolls, in pixels." }
HorzMargin = { category = "Layout", doc = "Room kept past the right-most control when the box scrolls, in pixels." }
HorzPosition = { category = "Layout", doc = "How far the box is scrolled to the right, in pixels." }
HorzRange = { category = "Layout", doc = "The width the box scrolls over, in pixels (0: what its controls need)." }
HorzTracking = { category = "Behavior", doc = "Scrolls the content while the horizontal thumb is dragged, not only when it's let go." }
HorzVisible = { category = "Layout", doc = "Shows the horizontal scroll bar when it's needed." }
Host = { category = "Network", doc = "The server's host name or address." }
HotTrack = { category = "Appearance", doc = "Highlights the item, tab or header section under the mouse." }
Html = { category = "Data", doc = "The HTML the web view shows as its page, or the element holds." }
hWnd = { category = "Misc", doc = "The window that gets the tray icon's messages." }
ICOHandle = { category = "Appearance", doc = "Sets the icon from a resource handle (`$RESOURCE`); write-only." }
Icon = { category = "Appearance", doc = "The icon (an .ICO file name) of the window, the application or the image." }
ImageIndex = { category = "Appearance", doc = "On a tree node (`Item(i).ImageIndex`), the picture from `Images` drawn beside it." }
Images = { category = "Appearance", doc = "The image list the tree draws its nodes' pictures from." }
ImageType = { category = "Drawing", doc = "Whether the images are drawn as pictures (`itImage`) or as their masks (`itMask`)." }
ImgHeight = { category = "Media", doc = "The video picture's height, in pixels; read-only." }
ImgWidth = { category = "Media", doc = "The video picture's width, in pixels; read-only." }
