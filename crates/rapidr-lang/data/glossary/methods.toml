MoveColumn = { doc = "Moves a column to another position; those between shift over. Same as `MoveCol`." }
MoveKey = { doc = "Moves registry key `OldKey` to `NewKey`; with `Delete` false the old key is kept as a copy." }
MoveRow = { doc = "Moves a row to another position; those between shift over." }
