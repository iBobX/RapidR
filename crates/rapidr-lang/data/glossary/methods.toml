New = { doc = "Starts anew, empty: a blank recording for a wave; on the web, a data-science object." }
NewPage = { doc = "Ends the current page and starts a new one." }
Next = { doc = "Activates a QFORMMDI's next child window (ActiveNextChild). A QFORM has no MDI children — RapidQ's forms are fsNormal only — so nothing happens there." }
Nonzero = { doc = "Replaces the array with the indexes of its non-zero elements. Same as `Where`." }
Norm = { doc = "Returns the array's length as a vector (its L2 norm)." }
Normal = { doc = "Fills the array with `n` random values from a normal distribution (mean and standard deviation optional). Same as `RandN`." }
Normalize = { doc = "Scales the elements so the array's L2 norm is 1 (in place)." }
Open = { doc = "Opens what the component works with: a media file or device, a file stream in a mode, a serial port, the clipboard, or a listening socket on a port." }
OpenKey = { doc = "Opens registry key `Key`, creating it when `CanCreate` is true; returns true on success." }
Paint = { doc = "Flood-fills from (`x`, `y`) with color `c` up to the border color `borderc`." }
Parse = { doc = "Splits text into parts: a string list splits `Source` at `Delim` into its items and returns how many; a CGI reads the request's variables." }
PasteFromClipboard = { doc = "Inserts the clipboard's text at the caret, replacing the selection." }
Pause = { doc = "Pauses playback; `Play` goes on from there." }
Peek = { doc = "Returns up to `NumBytes` bytes waiting on socket `Socket`, leaving them to be read." }
Percent = { doc = "Returns how far a transfer is, as a whole percentage of the total." }
PickFile = { doc = "Opens the browser's file picker and reads the chosen file into the stream; an optional filter such as `.txt` limits the choice." }
Play = { doc = "Starts playing from the current position." }
Poll = { doc = "Handles what is waiting on the server: new clients, messages and disconnections, each as its event." }
Popup = { doc = "Shows the popup menu at screen point (`X`, `Y`)." }
Post = { doc = "Sends form data to a URL in an HTTP POST and returns the response body." }
Pow = { doc = "Raises each element to a power (in place). Same as `Power`." }
Previous = { doc = "Activates a QFORMMDI's previous child window (ActivePreviousChild). A QFORM has no MDI children — RapidQ's forms are fsNormal only — so nothing happens there." }
Print = { doc = "Prints the contents to the console and returns them as text. Same as `Show`." }
Pset = { doc = "Sets the pixel at (`x`, `y`) to color `c`." }
PurgeIn = { doc = "Discards the data waiting in the serial port's receive buffer." }
PurgeOut = { doc = "Discards the data still waiting to be sent from the serial port." }
Push = { doc = "Appends a value to the end of the array." }
Push_row = { doc = "Appends a row made of the values given. Same as `AddRow`." }
Put = { doc = "Writes pixel data onto the canvas; the counterpart of `Get`." }
QuerySelector = { doc = "Returns the id of the first page element matching a CSS selector, or null." }
Random = { doc = "Fills the array with `n` random values from 0 up to 1. Same as `Rand`." }
Random_normal = { doc = "Fills the array with `n` random values from a normal distribution. Same as `RandN`." }
Random_uniform = { doc = "Fills the array with `n` random values between a low and a high value. Same as `Uniform`." }
Read = { doc = "Reads data: up to `NumBytes` from a socket (returned), `Count` bytes from a serial port into a stream, or a variable's worth from a stream into it." }
Read_csv = { doc = "Loads a CSV file into the DataFrame. Same as `ReadCSV`." }
Read_json = { doc = "Loads a JSON file into the DataFrame. Same as `LoadFromJSON`." }
ReadAll = { doc = "Returns the rest of the stream as text." }
ReadBinary = { doc = "Reads the named binary value of the open key." }
ReadBinStr = { doc = "Reads `n` bytes from the stream and returns them as a string." }
ReadByte = { doc = "Reads one byte from the socket or stream." }
ReadFloat = { doc = "Reads the named value of the open key as a floating-point number." }
ReadInteger = { doc = "Reads the named value of the open key as an integer." }
ReadLine = { doc = "Reads one line of text, without its line end." }
Readln = { doc = "Reads one line of text, without its line end. Same as `ReadLine`." }
ReadNum = { doc = "Reads a number stored in binary as the type given (`Num_Byte`, `Num_Long`, `Num_Double` …)." }
ReadStr = { doc = "Reads `n` characters from the stream." }
ReadString = { doc = "Reads a string: `Count` characters from the serial port, or the named string value of the open registry key." }
ReadUDT = { doc = "Reads a user-defined type variable from the stream, field by field." }
RealConnect = { doc = "Connects to a MySQL server with host, user, password, database, port, socket and flags; returns true on success." }
Receive = { doc = "Returns the next message received on the WebSocket. Same as `Read`." }
Reciprocal = { doc = "Replaces each element with 1 divided by it (in place)." }
Record = { doc = "Starts recording sound from the input device." }
RecreateBuf = { doc = "Makes the sound buffer again after the device lost it." }
Rect = { doc = "Draws the outline of a rectangle. Same as `Rectangle`." }
Rectangle = { doc = "Draws the outline of the rectangle (`x1`, `y1`)–(`x2`, `y2`) in color `c`." }
Refresh = { doc = "Redraws the component at once; MySQL's flushes the server's tables or caches that `RefreshFlags` names." }
RegistryConnect = { doc = "Connects to the registry of the network computer `CompName`; returns true on success." }
Release = { doc = "Gives back the DirectX surfaces; RapidR has nothing to free." }
Reload = { doc = "Reads the folders from disk again." }
Remove = { doc = "Removes something: a list's string by index, the element from the page, or a stored value by key." }
RemoveClass = { doc = "Removes a CSS class from the element." }
RemoveComponent = { doc = "Removes the component at the index given from the design surface." }
RemoveItem = { doc = "Removes the item at the index given." }
RemoveTab = { doc = "Removes the tab at the index given." }
Rename_column = { doc = "Renames a column. Same as `Rename`." }
RenameValue = { doc = "Renames a value of the open key." }
Render = { doc = "Draws the scene: a DirectX screen draws its 3D view; on the web a chart is drawn (as `SaveFig`)." }
Repaint = { doc = "Redraws the component." }
RequestPermission = { doc = "Asks the user's permission to show notifications." }
Reshape = { doc = "Changes the array's shape; RapidR's arrays are one-dimensional, so it leaves it as it is." }
RestoreChild = { doc = "Gives every MDI child window its normal size and place again." }
Resume = { doc = "Lets a suspended thread run again." }
Reverse = { doc = "Reverses the order of the elements (in place). Same as `Flip`." }
Rotate = { doc = "Rotates the picture by `Angle` degrees around (`xOrigin`, `yOrigin`)." }
RoundRect = { doc = "Draws a rectangle (`x1`, `y1`)–(`x2`, `y2`) with corners rounded by an ellipse `x3` wide and `y3` high, in color `c`." }
RowBlob = { doc = "Returns `Bytes` bytes of the binary field in row `Row`." }
RowCount = { doc = "How many rows the frame has." }
Rows = { doc = "Returns the number of rows." }
RowSeek = { doc = "Moves to row `Row` of the query's result, the next one `FetchRow` reads." }
Save = { doc = "Saves to a file: the chart as an image, or the recording as a WAV file." }
SaveArray = { doc = "Writes an array's elements to the stream." }
SaveBlob = { doc = "Writes binary data (a BLOB) for a query." }
SaveToFile = { doc = "Saves the component's contents to a file: text, items, grid cells, tree nodes or a picture." }
SaveToStream = { doc = "Writes the component's contents to an open stream." }
SaveUdtArray = { doc = "Writes an array of user-defined types to the stream." }
Scale = { doc = "Scales the mesh by `X`, `Y`, `Z`." }
Seek = { doc = "Moves the current position: a stream's to `Position` from its start, current place or end; a player's to a time in seconds." }
SelectAll = { doc = "Selects all the text." }
SelectComp = { doc = "Selects the component at the index given on the design surface (-1: none)." }
SelectDB = { doc = "Makes database `DB` the current one; returns true on success." }
Send = { doc = "Sends text over the WebSocket. Same as `Write`." }
SendTo = { doc = "Sends a line of text to one client, by its address." }
Series = { doc = "Adds a data series to the chart. Same as `AddSeries`." }
Set = { doc = "Stores a value: an array's element at an index, or a value under a key in the browser's storage." }
Set_column = { doc = "Adds a column of values under a name, replacing a column of that name. Same as `AddColumn`." }
Set_title = { doc = "Sets the chart's title. Same as `SetTitle`." }
Set_xlabel = { doc = "Sets the label of the x axis. Same as `SetXLabel`." }
Set_ylabel = { doc = "Sets the label of the y axis. Same as `SetYLabel`." }
SetAsHandle = { doc = "Puts the data behind handle `Handle` on the clipboard in format `Format`." }
SetAsText = { doc = "Puts text on the clipboard." }
SetAttribute = { doc = "Sets the element's HTML attribute of that name to a value." }
SetBackgroundImage = { doc = "Uses a texture as the 3D scene's background." }
SetBackgroundRGB = { doc = "Sets the 3D scene's background color from `R`, `G`, `B` (0 to 1)." }
SetCameraOrientation = { doc = "Points the camera along (`DX`, `DY`, `DZ`) with (`UX`, `UY`, `UZ`) as its up direction." }
SetCameraPosition = { doc = "Moves the camera to (`X`, `Y`, `Z`)." }
SetCell = { doc = "Sets the text of the cell at a column and row." }
SetColCount = { doc = "Sets the number of columns, adding or removing them at the end." }
SetColorRGB = { doc = "Sets the color from `R`, `G`, `B` (0 to 1)." }
SetColorRGBA = { doc = "Sets the colour and its opacity from red, green, blue and alpha parts (0 to 1). Same as SetRGBA." }
SetCompBounds = { doc = "Moves and sizes a component on the design surface: `SetCompBounds(Index, X, Y, W, H)`." }
SetDeskBar = { doc = "Sets up the MDI form's bar for its child windows; RapidR accepts it and does nothing." }
SetFocus = { doc = "Gives the component the keyboard focus." }
SetFogParams = { doc = "Sets where the fog starts and ends, and its density." }
SetFont = { doc = "Sets the font: a font dialog starts from font `F`; a drawing area takes a font name and size." }
SetHorzChild = { doc = "Tiles the MDI child windows one above another." }
SetHTML = { doc = "Shows the HTML given in the web view." }
SetItem = { doc = "Sets the element at an index. Same as `Set`." }
SetLightRGB = { doc = "Sets the light's type and its color from `R`, `G`, `B` (0 to 1)." }
SetName = { doc = "Renames the component at an index on the design surface." }
SetOrientation = { doc = "Points the frame along (`DX`, `DY`, `DZ`) with (`UX`, `UY`, `UZ`) as its up direction." }
SetPenUmbra = { doc = "Sets the angle of the spotlight's penumbra, the soft edge of its cone." }
SetPixel = { doc = "Sets one pixel to a color. Same as `Pset`." }
SetPosition = { doc = "Moves the frame to (`X`, `Y`, `Z`)." }
SetPriority = { doc = "Sets the program's process priority." }
SetProp = { doc = "Sets a property of the component at an index on the design surface: `SetProp(Index, Name, Value)`." }
SetQuality = { doc = "Sets how the mesh is drawn: points, wireframe, flat or smooth shading." }
SetRange = { doc = "Sets how far the light reaches." }
SetRenderMode = { doc = "Sets the 3D view's rendering mode flags." }
SetRGB = { doc = "Sets the mesh's color from `R`, `G`, `B` (0 to 1)." }
SetRGBA = { doc = "Sets the mesh's color from `R`, `G`, `B` and its opacity `A` (0 to 1)." }
SetRotation = { doc = "Sets the frame spinning around the axis (`X`, `Y`, `Z`), `Theta` radians each time step of `Move`." }
SetRowCount = { doc = "Sets the number of rows, adding or removing them at the end." }
SetSize = { doc = "Sets the stream's size in bytes, cutting or growing it." }
SetSuggestions = { doc = "Sets the suggestions offered while a cell is edited, one per line." }
SetTexture = { doc = "Puts texture `Tex` on the frame or mesh." }
SetTextureQuality = { doc = "Sets how textures are filtered when drawn." }
SetTick = { doc = "Puts a tick mark at position `Pos`." }
SetTitle = { doc = "Sets the chart's title." }
SetUmbra = { doc = "Sets the angle of the spotlight's cone of full brightness." }
SetValue = { doc = "Sets the element at an index. Same as `Set`." }
SetVelocity = { doc = "Sets the velocity (`X`, `Y`, `Z`) a frame moves by each time step of `Move`; a DirectX screen sets its camera's." }
SetVertChild = { doc = "Tiles the MDI child windows side by side." }
SetXLabel = { doc = "Sets the label of the x axis." }
SetYLabel = { doc = "Sets the label of the y axis." }
Shape = { doc = "The array's or frame's dimensions as text: an array's length, a frame's rows and columns." }
ShapeForm = { doc = "Gives the form the outline of a bitmap's pixels that aren't TransparentColor (a BMP file, or a $RESOURCE): the bitmap's pixel (x, y) is the window's (x, y) from its top left corner, frame included; what's outside — and outside the bitmap — is cut away, and the mouse reaches what's behind there. Width, Height and BorderStyle don't change; the outline stays when the form is resized. (Wayland gives no program a way to cut its window: it keeps its rectangle there.)" }
Show = { doc = "Shows the component or form; a data-science object prints its contents." }
ShowModal = { doc = "Shows the form and waits until it closes; returns its modal result." }
ShowTitleBar = { doc = "Puts back the title bar HideTitleBar took away: the form gets taller by it, its client area the same." }
Shuffle = { doc = "Puts the elements in random order (in place)." }
Sign = { doc = "Replaces each element with its sign: -1, 0 or 1 (in place)." }
Sin = { doc = "Replaces each element with its sine (in place)." }
Sort = { doc = "Sorts the items, nodes or elements in ascending order." }
Speed = { doc = "Returns a transfer's speed in bytes a second, from two `TIME$` values and the bytes moved." }
Sqrt = { doc = "Replaces each element with its square root (in place)." }
Square = { doc = "Replaces each element with its square (in place)." }
Start = { doc = "Starts the server listening on its `Host` and `Port`; returns false when the port can't be opened." }
StartDrag = { doc = "Moves the control with the mouse while a button is held — call it from OnMouseDown: it returns when the button is let go, Left and Top where the user put it, and no OnMouseUp or OnClick follows (Windows' own move of a window, which RapidQ's is). Escape puts it back; with no button held nothing happens." }
Std = { doc = "Returns the standard deviation of the values." }
Stop = { doc = "Stops what is running: playback (back to the start), recording, or the server." }
StretchDraw = { doc = "Draws a bitmap scaled to fill rectangle `Rect`." }
String = { doc = "Returns the string at the index given. Same as `Item`." }
Strings = { doc = "Returns the string at the index given. Same as `Item`." }
Sub = { doc = "Subtracts a number or another array's matching element from each element (in place). Same as `Subtract`." }
Suspend = { doc = "Pauses the thread until `Resume`." }
SwapCols = { doc = "Swaps columns `Col1` and `Col2`." }
SwapItem = { doc = "Swaps the items at `Index1` and `Index2`." }
SwapRows = { doc = "Swaps rows `Row1` and `Row2`." }
T = { doc = "Swaps rows and columns. Same as `Transpose`." }
Tabs = { doc = "Returns the caption of the tab at an index, or sets it when a second value follows." }
Tan = { doc = "Replaces each element with its tangent (in place)." }
Terminate = { doc = "Ends it: stops the thread, or ends the program." }
TextHeight = { doc = "Returns the height in pixels of the text in the current font." }
TextOut = { doc = "Writes text `S` at (`x`, `y`) in color `fc` on background `bc` (-1: transparent), in the current font." }
TextRect = { doc = "Writes text `S` at (`x`, `y`), clipped to rectangle `Rect`, in color `fc` on background `bc`." }
TextWidth = { doc = "Returns the width in pixels of the text in the current font." }
Tile = { doc = "Tiles a QFORMMDI's child windows by TileMode: one above another (SetHorzChild), or side by side (SetVertChild). A QFORM has no MDI children — RapidQ's forms are fsNormal only — so nothing happens there." }
To_csv = { doc = "Saves the DataFrame to a CSV file. Same as `SaveToCSV`." }
To_grid = { doc = "Fills an RStringGrid with the DataFrame's column names and rows. Same as `ToGrid`." }
To_json = { doc = "Saves the DataFrame to a JSON file. Same as `SaveToJSON`." }
ToggleClass = { doc = "Adds a CSS class to the element, or removes it when it has it." }
ToList = { doc = "Returns the elements as text, comma-separated." }
ToString = { doc = "Returns the contents as text." }
Translate = { doc = "Moves the mesh's vertices by (`TX`, `TY`, `TZ`)." }
Unique = { doc = "Replaces the array with its distinct values, sorted." }
Update = { doc = "Brings the component up to date: redraws it, lists its files again, or reads its device's state again." }
ValueExists = { doc = "Returns true when the open key has a value named `ValueName`." }
ValueItem = { doc = "Returns the name of value number `Index` of the open key." }
Variance = { doc = "Returns the variance of the elements. Same as `Var`." }
WaitForLastIO = { doc = "Waits until the serial port's last read or write has finished." }
WatchPosition = { doc = "Starts following the device's position: Latitude, Longitude and Accuracy update and OnChange fires at each change, until ClearWatch." }
Where = { doc = "Replaces the array with the indexes of its non-zero elements. Same as `Nonzero`." }
Write = { doc = "Writes data: `NumBytes` of a message to a socket, `Count` bytes of a stream to a serial port, or a variable to a stream." }
WriteBinary = { doc = "Writes a binary value under a name in the open key." }
WriteBinStr = { doc = "Writes `bytes` bytes of the string to the stream." }
WriteByte = { doc = "Writes one byte to the socket or stream." }
WriteCSV = { doc = "Saves the DataFrame to a CSV file. Same as `SaveToCSV`." }
WriteFloat = { doc = "Writes a floating-point value under a name in the open key." }
WriteInteger = { doc = "Writes an integer value under a name in the open key." }
WriteLine = { doc = "Writes text followed by a line end." }
Writeln = { doc = "Writes text followed by a line end. Same as `WriteLine`." }
WriteNum = { doc = "Writes a number in binary, `bytes` bytes long." }
WriteStr = { doc = "Writes `bytes` characters of the string to the stream." }
WriteString = { doc = "Writes a string: to the serial port (waiting when `Wait` is true), or as a named value of the open registry key." }
WriteUDT = { doc = "Writes a user-defined type variable to the stream, field by field." }
