IsServerReady = { doc = "Returns true when socket `Sock` has data from the server to read." }
Join = { doc = "Joins another DataFrame on a common column. Same as `Merge`." }
KeyExists = { doc = "Returns true when registry key `Key` exists." }
KeyItem = { doc = "Returns the name of subkey number `Index` of the open key." }
Keys = { doc = "Returns the keys in the storage." }
LeechFile = { doc = "Downloads the file the properties name from the server, to a file, a variable or memory; returns true on success." }
Len = { doc = "Returns the number of rows. Same as `Rows`." }
Line = { doc = "Draws a line from (`x1`, `y1`) to (`x2`, `y2`) in color `c`." }
Lines = { doc = "Reads a line of the text by index, or sets it when a second value follows." }
Listen = { doc = "Starts the server listening on its `Host` and `Port`. Same as `Start`." }
Ln = { doc = "Replaces each element with its natural logarithm (in place). Same as `Log`." }
