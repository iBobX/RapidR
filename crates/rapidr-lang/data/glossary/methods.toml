LoadFromPlot = { doc = "Shows an RPlot's chart as the image." }
LoadFromResource = { doc = "Loads images from a bitmap resource." }
LoadFromStream = { doc = "Loads the component's contents from an open stream." }
LoadFromUrl = { doc = "Fetches a URL's text into the stream; an event fires when it has arrived." }
LoadTexture = { doc = "Loads an image file as a texture: onto the mesh builder, or into texture `Tex`." }
LoadUdtArray = { doc = "Reads an array of user-defined types from the stream." }
Log = { doc = "Replaces each element with its natural logarithm (in place). Same as `Ln`." }
Log10 = { doc = "Replaces each element with its base-10 logarithm (in place)." }
Log2 = { doc = "Replaces each element with its base-2 logarithm (in place)." }
LookAt = { doc = "Turns the frame to face frame `F`; `Constraint` limits the axes it may turn on." }
Max = { doc = "Returns the largest element." }
MaximizeAllChild = { doc = "Maximizes every MDI child window." }
MemCopyFrom = { doc = "Copies `Bytes` bytes from memory address `Address` into the stream." }
MemCopyTo = { doc = "Copies `Bytes` bytes of the stream to memory address `Address`." }
Min = { doc = "Returns the smallest element." }
Minimize = { doc = "Minimizes the program's windows." }
MinimizeAllChild = { doc = "Minimizes every MDI child window and lines up their icons." }
Move = { doc = "Moves the 3D scene on by `D` time steps: every frame moves and turns by its velocity and rotation." }
