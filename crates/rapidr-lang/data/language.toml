[[statement]]
name = "GLOBAL"
syntax = "GLOBAL name AS type (also PUBLIC / PRIVATE before a declaration)"
group = "Declarations"
origin = "rapidr"
doc = ""

[[statement]]
name = "TYPE"
syntax = "TYPE name [EXTENDS type] … END TYPE (also STRUCT … END STRUCT)"
group = "Types and objects"
doc = ""

[[statement]]
name = "EXTENDS"
syntax = "TYPE name EXTENDS QOBJECT | component"
group = "Types and objects"
doc = ""

[[statement]]
name = "PROPERTY SET"
syntax = "PROPERTY SET name(value AS type)"
group = "Types and objects"
doc = ""

[[statement]]
name = "EVENT"
syntax = "EVENT(member) … END EVENT"
group = "Types and objects"
doc = ""

[[statement]]
name = "CONSTRUCTOR"
syntax = "CONSTRUCTOR … END CONSTRUCTOR"
group = "Types and objects"
doc = ""

[[statement]]
name = "PUBLIC"
syntax = "PUBLIC: / PRIVATE: in a TYPE"
group = "Types and objects"
doc = ""

[[statement]]
name = "CREATE"
syntax = "CREATE name AS type … END CREATE"
group = "Types and objects"
doc = ""

[[statement]]
name = "WITH"
syntax = "WITH object … END WITH"
group = "Types and objects"
doc = ""

[[statement]]
name = "SUB"
syntax = "SUB name[(params)] … END SUB"
group = "Routines"
doc = ""

[[statement]]
name = "FUNCTION"
syntax = "FUNCTION name[(params)] AS type … END FUNCTION"
group = "Routines"
doc = ""

[[statement]]
name = "SUBI"
syntax = "SUBI name(…) … END SUBI"
group = "Routines"
doc = ""

[[statement]]
name = "FUNCTIONI"
syntax = "FUNCTIONI name(…) AS type … END FUNCTIONI"
group = "Routines"
doc = ""

[[statement]]
name = "DECLARE"
syntax = "DECLARE SUB|FUNCTION name [LIB \"file\" [ALIAS \"name\"]] [(params)] [AS type]"
group = "Routines"
doc = ""

[[statement]]
name = "CALL"
syntax = "CALL name[(args)]"
group = "Routines"
doc = ""

[[statement]]
name = "BIND"
syntax = "BIND pointer TO routine"
group = "Routines"
doc = ""

[[statement]]
name = "EXIT"
syntax = "EXIT FOR | DO | WHILE | SUB | FUNCTION"
group = "Flow"
doc = ""

[[statement]]
name = "IF"
syntax = "IF condition THEN … [ELSEIF condition THEN …] [ELSE …] END IF"
group = "Flow"
doc = ""

[[statement]]
name = "SELECT CASE"
syntax = "SELECT CASE expression … CASE values … CASE ELSE … END SELECT"
group = "Flow"
doc = ""

[[statement]]
name = "FOR"
syntax = "FOR variable = start TO end [STEP step] … NEXT [variable]"
group = "Flow"
doc = ""

[[statement]]
name = "WHILE"
syntax = "WHILE condition … WEND"
group = "Flow"
doc = ""

[[statement]]
name = "DO"
syntax = "DO [WHILE|UNTIL condition] … LOOP [WHILE|UNTIL condition]"
group = "Flow"
doc = ""

[[statement]]
name = "GOTO"
syntax = "GOTO label"
group = "Flow"
doc = ""

[[statement]]
name = "GOSUB"
syntax = "GOSUB label … RETURN"
group = "Flow"
doc = ""

[[statement]]
name = "RETURN"
syntax = "RETURN"
group = "Flow"
doc = ""

[[statement]]
name = "END"
syntax = "END"
group = "Flow"
doc = ""

[[statement]]
name = "ON ERROR"
syntax = "ON ERROR RESUME NEXT | GOTO label"
group = "Flow"
origin = "rapidr"
doc = ""

[[statement]]
name = "PRINT"
syntax = "PRINT [expression][; | ,] …"
group = "Console"
doc = ""

[[statement]]
name = "LPRINT"
syntax = "LPRINT [expression][; | ,] …"
group = "Console"
doc = ""

[[statement]]
name = "INPUT"
syntax = "INPUT [\"prompt\";] variable"
group = "Console"
doc = ""

[[statement]]
name = "LINE INPUT"
syntax = "LINE INPUT #n, variable"
group = "Files"
origin = "rapidr"
doc = ""

[[statement]]
name = "OPEN"
syntax = "OPEN file FOR INPUT|OUTPUT|APPEND|BINARY|RANDOM AS #n"
