# The statements the parser accepts (keywords that start a statement).

[[statement]]
name = "DIM"
syntax = "DIM name[(bounds)] [AS type] [= value] [, …]"
group = "Declarations"
doc = ""

[[statement]]
name = "REDIM"
syntax = "REDIM [PRESERVE] name(bounds) [AS type]"
group = "Declarations"
doc = ""

[[statement]]
name = "STATIC"
syntax = "STATIC name[(bounds)] AS type"
group = "Declarations"
doc = ""

[[statement]]
name = "CONST"
syntax = "CONST name = expression [, …]"
group = "Declarations"
doc = ""

