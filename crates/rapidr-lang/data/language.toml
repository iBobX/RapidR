origin = "rapidr"
doc = ""

[[statement]]
name = "CLOSE"
syntax = "CLOSE [#n]"
group = "Files"
origin = "rapidr"
doc = ""

[[statement]]
name = "PRINT #"
syntax = "PRINT #n, expression [; …]"
group = "Files"
origin = "rapidr"
doc = ""

[[statement]]
name = "WRITE #"
syntax = "WRITE #n, expression [, …]"
group = "Files"
origin = "rapidr"
doc = ""

[[statement]]
name = "INPUT #"
syntax = "INPUT #n, variable [, …]"
group = "Files"
origin = "rapidr"
doc = ""

[[statement]]
name = "SEEK"
syntax = "SEEK #n, position"
group = "Files"
origin = "rapidr"
doc = ""

[[statement]]
name = "DATA"
syntax = "DATA value [, …]"
