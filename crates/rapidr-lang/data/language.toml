doc = ""

[[statement]]
name = "QUICKSORT"
syntax = "QUICKSORT(array(first), array(last), ascending [, …])"
group = "Data"
doc = ""

[[statement]]
name = "REM"
syntax = "REM comment (also ' comment)"
group = "Other"
doc = ""

[[statement]]
name = "IMPORT"
syntax = "IMPORT \"file\""
group = "Other"
origin = "rapidr"
doc = ""

[[statement]]
name = "RUSTSTART"
syntax = "RUSTSTART … RUSTEND (Rust code, native builds)"
group = "Other"
origin = "rapidr"
doc = ""

