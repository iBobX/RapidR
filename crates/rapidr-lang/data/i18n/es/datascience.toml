"RDBGRID" = "Una cuadrícula que muestra un conjunto de datos directamente desde su tabla (un RDataSource, un RDataFrame, un RCSV, un RJSON, o la última consulta de un RSQLite o de un RMySQL, con las filas de una consulta en segundo plano a medida que llegan) y dibuja solo las filas que están en pantalla, de modo que un millón de filas se desplazan con fluidez. Un clic o las flechas mueven la fila actual (los cuadros de texto vinculados la siguen); Ctrl+C la copia. Un clic en un encabezado ordena la vista por esa columna (otra vez: de forma descendente; una tercera vez: vuelve al orden original), sin cambiar los datos; las filas de una base de datos las ordena el programa: en OnTitleClick vuelve a preguntar con ORDER BY, y SortColumn y SortDescending indican en qué se hizo clic. Propio de RapidR."
