# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/components/web.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"RDOM" = "Un elemento HTML propio del programa: su HTML, sus clases CSS, su estilo y sus atributos. Solo para la web."
"RDOM.ACCESSIBLEDESCRIPTION" = "Una descripción más larga que un lector de pantalla da después del nombre (qué hace el control, un atajo)."
"RDOM.ACCESSIBLEHIDDEN" = "True: el control es decoración —un punto parpadeante, un adorno— y un lector de pantalla lo omite (sigue en la ventana, para los ojos). Nunca lo establezcas en nada que una persona pueda usar o necesite leer."
"RDOM.ACCESSIBLENAME" = "Cómo llama un lector de pantalla al control, cuando su título o texto no basta (un botón de imagen, un campo de edición sin etiqueta)."
"RDOM.ADDCLASS" = "Añade una clase CSS al elemento."
"RDOM.ALIGN" = "Dónde se acopla el control en su contenedor: una de las constantes `alXXX`. `alNone` conserva su propio lugar; `alClient` llena lo que dejan los demás controles acoplados."
"RDOM.ANCHORS" = "Los bordes de su contenedor a los que el control mantiene su distancia cuando el contenedor cambia de tamaño: akLeft + akTop (el valor predeterminado) no se mueve; añade akRight / akBottom para estirarlo."
"RDOM.APPENDTO" = "Mueve el elemento dentro del elemento de la página que tiene el id indicado."
"RDOM.CREATE" = "Inicia el objeto vacío y listo para usar (es el nombre en la web; igual que `New` e `Init`)."
"RDOM.CSSCLASS" = "Los nombres de las clases CSS del elemento (su atributo `class`)."
"RDOM.CSSSTYLE" = "El CSS en línea del elemento (su atributo `style`); su lugar y su tamaño los sigue fijando el entorno de ejecución."
"RDOM.GETATTRIBUTE" = "Devuelve el valor del atributo HTML del elemento con ese nombre."
"RDOM.HEIGHT" = "La altura, en píxeles; en `Screen`, la de la pantalla."
"RDOM.HINT" = "La sugerencia que se muestra cuando el mouse se detiene sobre el control (con `ShowHint`)."
"RDOM.HTML" = "El HTML que muestra la vista web como su página, o que contiene el elemento."
"RDOM.INNERHTML" = "El contenido del elemento como HTML."
"RDOM.INNERTEXT" = "El contenido del elemento como texto sin formato."
"RDOM.LEFT" = "La distancia al borde izquierdo del contenedor (en un formulario: el de la pantalla), en píxeles."
"RDOM.MAXHEIGHT" = "La altura máxima del control, en píxeles; 0 para no tener límite. También `Constraints.MaxHeight`."
"RDOM.MAXWIDTH" = "El ancho máximo del control, en píxeles; 0 para no tener límite. También `Constraints.MaxWidth`."
"RDOM.MINHEIGHT" = "La altura mínima del control, en píxeles; 0 para no tener límite. También `Constraints.MinHeight`."
"RDOM.MINWIDTH" = "El ancho mínimo del control, en píxeles, sea quien sea que lo cambie de tamaño (el programa, Align, Anchors, el usuario); 0 para no tener límite. También `Constraints.MinWidth`."
"RDOM.ONBLUR" = "Se produce cuando el elemento pierde el foco del teclado (el blur del navegador)."
"RDOM.ONCHANGE" = "Se produce cuando cambia el valor del control: el texto de un campo de edición, la selección de una lista, un árbol o una pestaña, la posición de una barra de desplazamiento o de un control deslizante, la fecha de un selector, el estado de un objeto multimedia."
"RDOM.ONCLICK" = "Se produce cuando el usuario hace clic en el control (o presiona su atajo, o Space o Enter en un botón con el foco)."
"RDOM.ONDBLCLICK" = "Se produce cuando el usuario hace doble clic en el control (en una superficie de diseño: el componente diseñado Index)."
"RDOM.ONFOCUS" = "Se produce cuando el elemento recibe el foco del teclado (el focus del navegador)."
"RDOM.ONMOUSEDOWN" = "Se produce cuando se presiona un botón del mouse sobre el control (Button: `mbLeft`, `mbRight` o `mbMiddle`; X, Y: dentro del control; Shift: el estado de las teclas)."
"RDOM.ONMOUSEMOVE" = "Se produce cuando el mouse se mueve sobre el control (X, Y: dentro del control; Shift: los botones y teclas presionados)."
"RDOM.ONMOUSEUP" = "Se produce cuando se suelta un botón del mouse sobre el control (Button: `mbLeft`, `mbRight` o `mbMiddle`; X, Y: dentro del control; Shift: el estado de las teclas)."
"RDOM.ONSCROLL" = "Se produce cuando el usuario se desplaza: en una barra de desplazamiento (ScrollCode: el tipo de movimiento; ScrollPos: la nueva posición), o en el contenido de un elemento web."
"RDOM.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RDOM.PARENTID" = "El id del elemento de la página en el que se coloca el componente."
"RDOM.QUERYSELECTOR" = "Devuelve el id del primer elemento de la página que coincide con un selector CSS, o null."
"RDOM.REMOVE" = "Quita algo: una cadena de una lista por índice, el elemento de la página o un valor almacenado por clave."
"RDOM.REMOVECLASS" = "Quita una clase CSS del elemento."
"RDOM.SETATTRIBUTE" = "Establece en un valor el atributo HTML del elemento con ese nombre."
"RDOM.TAGNAME" = "La etiqueta HTML del elemento (`div`, `span` …); al cambiarla, el elemento se vuelve a crear con la etiqueta nueva."
"RDOM.TOGGLECLASS" = "Añade una clase CSS al elemento, o la quita cuando ya la tiene."
"RDOM.TOOLTIP" = "La sugerencia del elemento (su `title`)."
"RDOM.TOP" = "La distancia al borde superior del contenedor (en un formulario: el de la pantalla), en píxeles."
"RDOM.VISIBLE" = "Si el control o formulario se muestra."
"RDOM.WIDTH" = "El ancho, en píxeles; en `Screen`, el de la pantalla."
"RJAVASCRIPT" = "Ejecuta JavaScript en la página: un fragmento de código con Eval o una función con Call. Solo para la web."
"RJAVASCRIPT.CALL" = "Llama a una función global de JavaScript por su nombre, con los demás argumentos, y devuelve su resultado."
"RJAVASCRIPT.EVAL" = "Ejecuta un fragmento de JavaScript y devuelve su resultado."
"RROUTER" = "Rutas con hash para aplicaciones web de una sola página: Navigate, Back, Forward y OnRouteChange. Solo para la web."
"RROUTER.BACK" = "Retrocede un paso en el historial del navegador."
"RROUTER.FORWARD" = "Avanza un paso en el historial del navegador."
"RROUTER.HASH" = "Igual que Route: el `#hash` de la dirección sin el `#`."
"RROUTER.NAVIGATE" = "Va a una dirección: una vista web carga una URL; un enrutador cambia la ruta `#` de la página."
"RROUTER.ONROUTECHANGE" = "Se produce cuando cambia la ruta de la página (la parte # de la URL), por Navigate, Back, Forward o por el navegador."
"RROUTER.ROUTE" = "La ruta actual: el `#hash` de la dirección sin el `#`."
