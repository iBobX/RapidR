# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/language.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"$APPTYPE" = "El tipo de programa: `CONSOLE`, `GUI` o `CGI` (y `WEB`, de RapidR). Si no se indica, un programa que crea componentes es un programa GUI."
"$DEFINE" = "Define un nombre para `$IFDEF` y, si se da un texto, reemplaza el nombre por ese texto en las líneas siguientes."
"$ELSE" = "Inicia las líneas que se compilan cuando falla la prueba de `$IFDEF` / `$IFNDEF`."
"$ENDIF" = "Termina un bloque `$IFDEF` / `$IFNDEF`."
"$ESCAPECHARS" = "`ON`: las cadenas de texto de este archivo entienden secuencias de escape (`\n`, `\\t`, `\\\"`, `\\\\`, `\\x41`); `OFF` (el predeterminado) las lee tal como están escritas."
"$IFDEF" = "Compila las líneas hasta `$ELSE` o `$ENDIF` solo cuando el nombre está definido."
"$IFNDEF" = "Compila las líneas hasta `$ELSE` o `$ENDIF` solo cuando el nombre no está definido."
"$INCLUDE" = "Incluye otro archivo fuente en este punto. Funcionan las carpetas de inclusión y las rutas con `\\`; `RAPIDQ.INC` ya viene incorporado."
"$MACRO" = "Define una macro con parámetros: cada uso se reemplaza por el texto, y sus parámetros por los argumentos."
"$OPTIMIZE" = "La opción del optimizador; se acepta, pero RapidR no tiene nada que cambiar."
"$OPTION" = "Opciones del programa: `ICON \"file\"` el ícono del programa (el del ejecutable y el de sus ventanas; un archivo que no existe es un error de compilación; gana el último `ICON`; un archivo .ico, .icns, .png o .svg), `DECIMAL` el carácter decimal de VAL, `BYREF` parámetros por referencia, `EXPLICIT` como `$TYPECHECK ON`, `INKEY$ TRAPALL`, `DIM type`."
"$RESOURCE" = "Incorpora un archivo al programa como recurso, para `RESOURCE(n)`, `EXTRACTRESOURCE`, `PLAYWAV` e imágenes."
"$THEME" = "El aspecto con el que se dibujan las ventanas del programa. `RapidR` (el predeterminado, también sin `$THEME`): el aspecto propio de RapidR, como lo tiene RapidR Studio — claro, oscuro o de contraste alto según la configuración del sistema, con Inter como fuente predeterminada; `RapidR Light`, `RapidR Dark` y `RapidR High Contrast` eligen uno. `Classic`: el aspecto clásico de Windows, exacto. Los nombres anteriores se conservan: `Modern`, `Dark` y `HighContrast` son los aspectos claro, oscuro y de contraste alto de RapidR; `System`, `Light`, `Windows`, `Win95`, `Win98` y `Win2K` el clásico. Un tema cambia cómo se dibujan las cosas, nunca un tamaño ni un lugar; los colores que establece un programa se dibujan como los estableció, y los colores del sistema (`clBtnFace` …) son los del tema."
"$TYPECHECK" = "`ON`: a partir de aquí, guardar un valor en una variable que nunca se declaró (DIM, CONST, un parámetro) es un error de compilación; `OFF` desactiva la comprobación."
"$UNDEF" = "Quita un nombre definido con `$DEFINE`."
"ALIAS" = "En DECLARE … LIB: el nombre de la rutina en la biblioteca, cuando el programa la llama con otro."
"AND" = "AND bit a bit de dos enteros de 32 bits (`7 AND 3` es 3); con comparaciones, ambas deben ser verdaderas."
"AS" = "Indica un tipo: `DIM x AS INTEGER`, el de un parámetro, el resultado de una FUNCTION; también `CREATE name AS type`, `OPEN … AS #n`, `$RESOURCE name AS \"file\"`."
"BIND" = "Guarda en una variable la dirección de una SUB o una FUNCTION, para `CALLFUNC`."
"BYREF" = "Un parámetro pasado por referencia: los cambios de la rutina llegan a la variable del código que la llama."
"BYTE" = "Entero sin signo de 8 bits, de 0 a 255; al guardar un valor fuera de rango este da la vuelta (`300` guarda 44). Sufijo `?`."
"BYVAL" = "Un parámetro pasado por valor: la rutina recibe una copia (lo predeterminado, salvo con `$OPTION BYREF`)."
"CALL" = "Llama a una SUB (con los argumentos entre paréntesis); llamarla solo por su nombre hace lo mismo."
"CASE" = "En SELECT CASE: los valores para los que se ejecutan las instrucciones siguientes; `CASE ELSE` para cualquier otro."
"CONST" = "Da nombre a un valor fijo para todo el programa: `CONST MaxItems = 3`, `CONST Limit AS LONG = 100`. Una constante por cada CONST: una lista (`CONST a = 1, b = 2`) es un error, así que escribe una CONST para cada una."
"CONSTRUCTOR" = "En un TYPE: código que se ejecuta cuando se crea una variable del tipo, para dar sus primeros valores a los campos."
"CREATE" = "Crea un componente (u objeto) y establece sus propiedades y eventos en el bloque; los componentes creados dentro de él lo tienen como contenedor."
"CURRENCY" = "Un número para cantidades de dinero; RapidR lo guarda como un número de punto flotante de 64 bits."
"DATA" = "Lista valores en el programa para que `READ` los lea, en orden."
"DEC" = "Resta `amount` (1 si no se da) a una variable."
"DECLARE" = "Declara una SUB o una FUNCTION antes de su cuerpo, o una de una biblioteca compartida (`LIB`), que se puede llamar en las compilaciones nativas; las bibliotecas de la API de Windows se rechazan y se indica una alternativa portable."
"DEFBYTE" = "Declara variables o arreglos BYTE, opcionalmente con valores iniciales."
"DEFCUR" = "Declara variables o arreglos CURRENCY, opcionalmente con valores iniciales."
"DEFDBL" = "Declara variables o arreglos DOUBLE, opcionalmente con valores iniciales."
"DEFDWORD" = "Declara variables o arreglos DWORD, opcionalmente con valores iniciales."
"DEFINT" = "Declara variables o arreglos INTEGER (de 32 bits), opcionalmente con valores iniciales (`DEFINT k(1 TO 3) = {7, 8, 9}`)."
"DEFLNG" = "Declara variables o arreglos LONG, opcionalmente con valores iniciales."
"DEFLONG" = "Igual que DEFLNG, con el nombre más largo."
"DEFSHORT" = "Declara variables o arreglos SHORT, opcionalmente con valores iniciales."
"DEFSNG" = "Declara variables o arreglos SINGLE, opcionalmente con valores iniciales."
"DEFSTR" = "Declara variables o arreglos STRING, opcionalmente con valores iniciales."
"DEFWORD" = "Declara variables o arreglos WORD, opcionalmente con valores iniciales."
"DIM" = "Declara variables o arreglos, con un tipo y opcionalmente un valor inicial; dentro de una SUB o una FUNCTION, locales. `DIM m` sin tipo es un DOUBLE."
"DO" = "Un ciclo: con la condición al principio (`DO WHILE` / `DO UNTIL`), al final (`LOOP WHILE` / `LOOP UNTIL`), o sin condición (se sale con `EXIT DO`)."
"DOUBLE" = "Número de punto flotante de 64 bits, con unos 15 dígitos significativos. Sufijo `#`."
"DWORD" = "Entero de 32 bits, con signo (de -2 147 483 648 a 2 147 483 647). Sufijo `???`."
"ELSE" = "En IF: las instrucciones que se ejecutan cuando ninguna condición fue verdadera; `CASE ELSE` en SELECT CASE."
"ELSEIF" = "En IF: otra condición, que se prueba cuando las anteriores fueron falsas."
"END" = "Termina el programa de inmediato; los archivos que escribió se conservan. `END n` lo termina con el código de salida n, que es un número o una expresión numérica guardada como LONG, para que una herramienta de consola pueda hacer fallar una compilación: `IF failures > 0 THEN END 1`. Un nombre suelto debe ser uno que el programa haya declarado (`END code` después de `DIM code AS INTEGER = 5`); `END SUBB`, un error de escritura del final de un bloque, y un nombre no declarado son errores de sintaxis. 0 significa éxito, y un `END` simple termina con 0. La línea de comandos lo lee con `echo $?` (macOS, Linux) o `echo %ERRORLEVEL%` (Windows); macOS y Linux conservan los 8 bits bajos. En una página web no hay código de salida: el programa termina y el número se ignora. `END IF`, `END SUB` y similares cierran bloques."
"EVENT" = "En un TYPE que extiende un componente: el código que se ejecuta cuando ocurre el evento del componente (`EVENT OnClick … END EVENT`)."
"EXIT" = "Sale de inmediato del ciclo FOR, DO o WHILE más interno, o de la SUB o la FUNCTION."
"EXTENDS" = "Hace que un TYPE herede los miembros de otro TYPE, o lo convierte en un componente propio construido sobre un componente (`EXTENDS RButton`)."
"FOR" = "Ejecuta el cuerpo para cada valor de un contador desde `start` hasta `end`, sumando `step` (1 si no se da) cada vez. `FOR i AS INTEGER = 1 TO n` también declara el contador donde aún no está declarado — una variable local en una SUB o una FUNCTION; un contador ya declarado con el mismo tipo es esa variable, y uno de otro tipo es un error."
"FUNCTION" = "Define una rutina que devuelve un valor: se asigna al nombre de la función (o a `Result`) dentro del cuerpo."
"FUNCTIONI" = "Define una FUNCTION que recibe cualquier cantidad de argumentos, que se leen dentro con `PARAMVAL`, `PARAMSTR$`, `PARAMVALCOUNT` y `PARAMSTRCOUNT`."
"GLOBAL" = "Las palabras de ámbito de VB, que se aceptan para que esos programas se compilen: `GLOBAL` / `PUBLIC` / `PRIVATE` antes de una declaración, SUB o FUNCTION la declaran igual que sin ellas."
"GOSUB" = "Salta a una etiqueta; el `RETURN` que hay allí vuelve a la instrucción posterior al GOSUB."
"GOTO" = "Continúa el programa en una etiqueta o un número de línea."
"IF" = "Ejecuta instrucciones cuando una condición es verdadera (distinta de cero), y otras con ELSEIF o ELSE; en una sola línea, `IF c THEN … ELSE …` no necesita END IF."
"IMPORT" = "Nombra un módulo; se acepta y no tiene efecto (los elementos integrados y los componentes de RapidR no necesitan importarse)."
"INC" = "Suma `amount` (1 si no se da) a una variable."
"INPUT" = "Muestra el mensaje, lee una línea escrita en la consola y la guarda en la variable (como número si es numérica)."
"INPUT #" = "Lee valores separados por comas de un archivo abierto para INPUT y los guarda en variables."
"INT64" = "Entero con signo de 64 bits, de -9 223 372 036 854 775 808 a 9 223 372 036 854 775 807."
"INTEGER" = "Entero con signo de 32 bits, de -2 147 483 648 a 2 147 483 647, igual que LONG; al guardar un valor con fracción, esta se trunca."
"IS" = "En `CASE IS > n` (y las demás comparaciones): compara la expresión de SELECT CASE."
"LIB" = "En DECLARE: la biblioteca compartida en la que está una rutina."
"LINE INPUT" = "Lee una línea completa, con las comas incluidas, de un archivo abierto para INPUT y la guarda en una variable de cadena de texto."
"LONG" = "Entero con signo de 32 bits, de -2 147 483 648 a 2 147 483 647; al guardar un valor con fracción, esta se trunca. Sufijo `&`."
"LOOP" = "Termina un ciclo DO, opcionalmente con su condición `WHILE` o `UNTIL`."
"MOD" = "El resto de una división entera; antes se redondean sus operandos, con las mitades al entero par (`7 MOD 3` es 1)."
"NEXT" = "Termina un ciclo FOR; el nombre del contador a continuación es opcional."
"NOT" = "NOT bit a bit de un entero de 32 bits (`NOT 0` es -1); tiene menos precedencia que las comparaciones."
"ON ERROR" = "La captura de errores de VB, que se acepta para que esos programas se compilen y se ignora: un error de ejecución sigue terminando el programa."
"OR" = "OR bit a bit de dos enteros de 32 bits; con comparaciones, basta con que una sea verdadera."
"PRESERVE" = "En REDIM, la palabra de VB para conservar los valores de un arreglo; el REDIM de RapidR los conserva de todos modos."
"PRINT" = "Escribe valores en la consola y termina la línea, a menos que el último vaya seguido de `;` o `,` (sin zonas de impresión). `?` es la forma corta de PRINT."
"PRINT #" = "Escribe valores en un archivo abierto para OUTPUT o APPEND, como PRINT los escribe en la consola."
"PRIVATE" = "En un TYPE, `PRIVATE:` inicia una sección de miembros (el acceso no se aplica); antes de una declaración, la palabra de ámbito de VB, que se acepta."
"PROPERTY SET" = "En un TYPE: la rutina que se ejecuta cuando un programa asigna un valor a la propiedad `name`, y que recibe el valor asignado."
"PROTECTED" = "En un TYPE, `PROTECTED:` inicia una sección de miembros, como hacen PRIVATE: y PUBLIC: (el acceso no se aplica)."
"PUBLIC" = "En un TYPE: `PUBLIC:` y `PRIVATE:` inician secciones de miembros; se aceptan, y el acceso no se aplica."
"QOBJECT" = "El tipo base de los objetos: `TYPE name EXTENDS RObject` crea un TYPE con métodos, un constructor y herencia."
"QUICKSORT" = "Ordena en su lugar los elementos de un arreglo desde `first` hasta `last`, los números por valor y las cadenas de texto por sus caracteres; ASCEND (0) ordena de menor a mayor, DESCEND (1) de mayor a menor."
"READ" = "Guarda en variables los siguientes valores de las listas `DATA` del programa."
"REDIM" = "Cambia el tamaño de un arreglo que existe (o lo crea); los elementos cuyos índices siguen dentro de los nuevos límites conservan sus valores."
"REM" = "Un comentario: el resto de la línea se ignora. `'` hace lo mismo, también después de una instrucción."
"RESTORE" = "Hace que el siguiente `READ` vuelva a empezar desde el primer valor de `DATA`, o desde el primero después de una etiqueta."
"RETURN" = "Vuelve a la instrucción posterior al último `GOSUB`."
"ROBJECT" = "El nombre que da RapidR a QOBJECT, el tipo base de los objetos: `TYPE name EXTENDS ROBJECT`."
"RUSTEND" = "Termina un bloque `RUSTSTART` de código Rust."
"RUSTSTART" = "Pone código Rust en el programa, hasta `RUSTEND`; solo en las compilaciones nativas (el intérprete y la web lo rechazan)."
"SELECT CASE" = "Ejecuta el primer CASE cuyos valores coinciden con la expresión: valores sueltos, rangos `a TO b`, comparaciones `IS > n`, listas de ellos; CASE ELSE cuando ninguno coincide."
"SET" = "En `PROPERTY SET`: la rutina que se ejecuta cuando se asigna la propiedad."
"SHORT" = "Entero con signo de 16 bits, de -32 768 a 32 767; al guardar un valor fuera de rango este da la vuelta. Sufijo `%`."
"SINGLE" = "Número de punto flotante de 32 bits, con unos 7 dígitos significativos. Sufijo `!`."
"STATIC" = "Dentro de una SUB o una FUNCTION, declara una variable local que conserva su valor de una llamada a la siguiente."
"STEP" = "En FOR: la cantidad que se suma al contador en cada vuelta (negativa para contar hacia atrás)."
"STRING" = "Texto de cualquier longitud, contado en caracteres; `STRING * n` siempre tiene n caracteres. Sufijo `$`."
"STRUCT" = "Otro nombre de TYPE: `STRUCT … END STRUCT` define un tipo de registro."
"SUB" = "Define una rutina que no devuelve ningún valor; se llama por su nombre, con los argumentos sin paréntesis (`Greet \"you\"`)."
"SUBI" = "Define una SUB que recibe cualquier cantidad de argumentos, que se leen dentro con `PARAMVAL`, `PARAMSTR$`, `PARAMVALCOUNT` y `PARAMSTRCOUNT`."
"SUPER" = "Dentro de un TYPE que extiende a otro: los miembros del tipo padre, como en `Super.Method`."
"SWAP" = "Intercambia los valores de dos variables o de dos elementos de un arreglo."
"THEN" = "Termina la condición de un IF o un ELSEIF; lo que sigue en la misma línea es un IF de una línea."
"THIS" = "Dentro de los métodos de un TYPE: la instancia sobre la que se llamó al método (`This.Count`)."
"TO" = "Un rango: `FOR i = 1 TO 10`, los límites de un arreglo `DIM a(1 TO 5)`, `CASE 1 TO 9`; también `BIND p TO routine`."
"TYPE" = "Define un tipo de registro: campos y, opcionalmente, métodos, un CONSTRUCTOR, eventos y un tipo padre del que heredar (`EXTENDS`). `STRUCT` es otro nombre para él."
"UNTIL" = "En DO … LOOP: repite hasta que la condición se vuelve verdadera."
"VARIANT" = "Contiene lo que se guarde en él: un número, un texto o un objeto. Una variable sin declarar es de este tipo."
"WEND" = "Termina un ciclo WHILE."
"WHILE" = "Ejecuta el cuerpo mientras la condición sea verdadera, y la prueba antes de cada vuelta."
"WITH" = "Dentro del bloque, `.Member` se refiere a un miembro del objeto nombrado: `WITH Form … .Caption = \"Hi\" … END WITH`."
"WORD" = "Entero sin signo de 16 bits, de 0 a 65 535; al guardar un valor fuera de rango este da la vuelta. Sufijo `??`."
"WRITE #" = "Escribe valores en un archivo separados por comas, con las cadenas de texto entre comillas, para que `INPUT #` pueda leerlos de nuevo."
"XOR" = "OR exclusivo bit a bit de dos enteros de 32 bits; con comparaciones, exactamente una es verdadera."
