# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/components/libraries.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"QDIRLISTVIEW" = "Una vista de lista que muestra las subcarpetas y los archivos de una carpeta con su tamaño, tipo y fecha, para que la persona los explore. Implementación propia de RapidR, escrita en BASIC."
"QDIRLISTVIEW.ADDCOLUMNS" = "Añade columnas al final de la vista de lista, una por cada texto dado."
"QDIRLISTVIEW.ADDITEMS" = "Añade al final una o más cadenas de texto (elementos, líneas o nodos) al componente, en el orden indicado."
"QDIRLISTVIEW.ADDSUBITEM" = "Añade el texto de subelemento `String` (la columna siguiente) al elemento de `Index`."
"QDIRLISTVIEW.ALIGN" = "Dónde se acopla el control en su contenedor: una de las constantes `alXXX`. `alNone` conserva su propio lugar; `alClient` llena lo que dejan los demás controles acoplados."
"QDIRLISTVIEW.BORDERSTYLE" = "El borde: una de las constantes `bsXXX`. En un formulario, `bsSizeable` permite a la persona cambiar su tamaño, `bsDialog` no, `bsNone` no tiene barra de título."
"QDIRLISTVIEW.CHANGEDIRUP" = "Muestra la carpeta superior de la carpeta actual."
"QDIRLISTVIEW.CHECKBOXES" = "Muestra una casilla junto a cada elemento."
