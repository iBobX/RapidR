"QDIRLISTVIEW.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"QDIRLISTVIEW.POPUPMENU" = "El menú emergente que se muestra cuando la persona hace clic derecho en el control."
"QDIRLISTVIEW.READONLY" = "Impide que la persona cambie el texto o los elementos; aun así puede seleccionar y copiar."
"QDIRLISTVIEW.REFRESH" = "Vuelve a dibujar el componente de inmediato; en MySQL, vacía las tablas o cachés del servidor que indica `RefreshFlags`."
"QDIRLISTVIEW.ROWSELECT" = "Resalta toda la fila del elemento seleccionado, no solo su primera columna."
"QDIRLISTVIEW.SELCOUNT" = "Cuántos elementos (o archivos) están seleccionados."
"QDIRLISTVIEW.SELECTED" = "Si el elemento i está seleccionado, `Selected(i)`; al establecerlo se selecciona o se quita la selección."
"QDIRLISTVIEW.SHOWCOLUMNHEADERS" = "Muestra los encabezados de columna en la vista `vsReport`."
"QDIRLISTVIEW.SHOWHINT" = "Muestra la sugerencia `Hint` cuando el mouse se detiene sobre el control; en `Application`, activa o desactiva todas las sugerencias."
"QDIRLISTVIEW.SHOWROOT" = "Dibuja líneas y botones también para los nodos de nivel superior."
"QDIRLISTVIEW.SMALLIMAGELIST" = "La lista de imágenes de los íconos que se muestran en las vistas `vsSmallIcon`, `vsList` y `vsReport`."
"QDIRLISTVIEW.SMALLIMAGES" = "La lista de imágenes de los íconos que se muestran en las vistas `vsSmallIcon`, `vsList` y `vsReport`; solo escritura."
