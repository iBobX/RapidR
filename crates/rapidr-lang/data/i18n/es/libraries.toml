"QDIRLISTVIEW.STATEIMAGES" = "La lista de imágenes de estado (marcas de verificación …) que se dibujan junto a los elementos; solo escritura."
"QDIRLISTVIEW.SUBITEM" = "El texto de un elemento de la vista de lista en otra columna, `SubItem(i, n)`, ambos desde 0."
"QDIRLISTVIEW.SWAPITEM" = "Intercambia los elementos de `Index1` y `Index2`."
"QDIRLISTVIEW.TABORDER" = "El lugar del control en el orden de la tecla Tab entre los controles de su contenedor, desde 0."
"QDIRLISTVIEW.TAG" = "Un número para uso propio del programa; RapidR nunca lo lee."
"QDIRLISTVIEW.TOP" = "La distancia al borde superior del contenedor (en un formulario: el de la pantalla), en píxeles."
"QDIRLISTVIEW.VIEWSTYLE" = "Cómo se muestran los elementos: `vsIcon`, `vsSmallIcon`, `vsList` o `vsReport` (filas con columnas)."
"QDIRLISTVIEW.VISIBLE" = "Si el control o formulario se muestra."
"QDIRLISTVIEW.WIDTH" = "El ancho, en píxeles; en `Screen`, el de la pantalla."
"QDOCKFORM" = "Un panel acoplado a un borde de su formulario que la persona puede separar en una ventana propia y volver a acoplar. Implementación propia de RapidR, escrita en BASIC."
