"QDIRLISTVIEW.CLEARCOLUMNS" = "Quita todas las columnas de la vista de lista."
"QDIRLISTVIEW.COLOR" = "El color de fondo, como &HBBGGRR o un color de sistema `clXXX`; en un cuadro de diálogo de color o de fuente, el color elegido."
"QDIRLISTVIEW.COLUMN" = "Una columna de la vista de lista, `Column(i)` desde 0, con sus propios `Caption`, `Width` y `Alignment`."
"QDIRLISTVIEW.COLUMNCLICK" = "Hace que los encabezados de las columnas actúen como botones que producen el evento `OnColumnClick`."
"QDIRLISTVIEW.COLUMNSCOUNT" = "El número de columnas de la vista de lista."
"QDIRLISTVIEW.CURSOR" = "El puntero del mouse que se muestra sobre el control: una de las constantes `crXXX`."
"QDIRLISTVIEW.DELITEMS" = "Quita los elementos de los índices indicados."
"QDIRLISTVIEW.DELSUBITEM" = "Quita el subelemento `SubIndex` del elemento de `Index`."
