"QDIRLISTVIEW.FILENAME" = "El archivo elegido en un cuadro de diálogo (con su carpeta), o el archivo que el objeto lee o escribe."
"QDIRLISTVIEW.FONT" = "La fuente del texto, un RFont; al asignar una, se copia."
"QDIRLISTVIEW.GRIDLINES" = "Dibuja líneas entre las filas y las columnas."
"QDIRLISTVIEW.HANDLE" = "El identificador de la ventana (o de otro objeto del sistema), para llamadas a la API y para componentes que lo reciben."
"QDIRLISTVIEW.HEIGHT" = "La altura, en píxeles; en `Screen`, la de la pantalla."
"QDIRLISTVIEW.HIDESELECTION" = "Oculta el resaltado de la selección mientras el control no tiene el foco."
