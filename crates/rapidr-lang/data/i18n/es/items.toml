# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/items.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"HEADERSECTION" = "Una sección de un RHeader (`Header.Sections(i)`, desde 0): su texto, sus límites de ancho, su alineación y si se puede hacer clic en ella."
"HEADERSECTION.ALIGNMENT" = "Cómo se ubica el texto en la sección."
"HEADERSECTION.ALLOWCLICK" = "Si la sección actúa como un botón (OnSectionClick)."
"HEADERSECTION.CAPTION" = "El texto de la sección."
"HEADERSECTION.LEFT" = "Dónde empieza la sección, en píxeles desde el borde izquierdo del encabezado."
"HEADERSECTION.MAXWIDTH" = "El ancho máximo al que se puede arrastrar la sección; 0 si no hay límite."
"HEADERSECTION.MINWIDTH" = "El ancho mínimo al que se puede arrastrar la sección."
"HEADERSECTION.RIGHT" = "Dónde termina la sección, en píxeles desde el borde izquierdo del encabezado."
"HEADERSECTION.STYLE" = "hsText dibuja el texto; hsOwnerDraw deja el dibujo a OnDrawSection."
"HEADERSECTION.TEXT" = "Lo mismo que Caption."
"HEADERSECTION.WIDTH" = "El ancho de la sección en píxeles."
"LISTCOLUMN" = "Una columna de un RListView en la vista de informe (`ListView.Column(i)`, desde 0)."
"LISTCOLUMN.CAPTION" = "El encabezado de la columna."
"LISTCOLUMN.WIDTH" = "El ancho de la columna en píxeles."
"LISTITEM" = "Una fila de un RListView (`ListView.Item(i)`, desde 0): su texto, su casilla y sus imágenes; sus otras columnas son SubItem(i, j)."
"LISTITEM.CAPTION" = "La primera columna de la fila."
"LISTITEM.CHECKED" = "Si la casilla de la fila está marcada (con CheckBoxes)."
"LISTITEM.IMAGEINDEX" = "La imagen (de las imágenes de la lista) que se muestra en la fila."
"LISTITEM.INDEX" = "La posición de la fila, desde 0 (-1 si no existe esa fila)."
"LISTITEM.SELECTED" = "Si la fila está seleccionada."
"LISTITEM.STATEINDEX" = "Una imagen de estado adicional que se muestra a la izquierda de la fila; -1 si no hay ninguna."
"PARAATTRIBUTES" = "(De RapidR) El formato de los párrafos de un RRichEdit (`RichEdit.Paragraph`): los de la selección al establecerlo, el del primero al leerlo."
"PARAATTRIBUTES.ALIGNMENT" = "Cómo se alinean las líneas del párrafo."
"PARAATTRIBUTES.FIRSTINDENT" = "Cuánto más adentro empieza su primera línea, en píxeles (menos de 0: las otras líneas quedan más adentro, una sangría francesa)."
"PARAATTRIBUTES.LEFTINDENT" = "A qué distancia del borde izquierdo empiezan las líneas del párrafo, en píxeles."
"PARAATTRIBUTES.NUMBERING" = "1: una viñeta antes del párrafo (con sangría de un cuarto de pulgada si no tenía sangría); 0: ninguna."
"PARAATTRIBUTES.RIGHTINDENT" = "A qué distancia del borde derecho terminan las líneas del párrafo, en píxeles."
"STATUSPANEL" = "Un panel de un RStatusBar (`StatusBar.Panel(i)`, desde 0)."
"STATUSPANEL.CAPTION" = "El texto del panel."
"STATUSPANEL.WIDTH" = "El ancho del panel en píxeles (el último panel ocupa lo que queda)."
"TREENODE" = "Un nodo de un RTreeView (`Tree.Item(i)`, contado desde 0 en el orden en que se muestran): su texto, imágenes, estado y lugar en el árbol."
"TREENODE.ABSOLUTEINDEX" = "La posición del nodo en todo el árbol, desde 0."
"TREENODE.BADGE" = "Una pequeña insignia en forma de píldora en el extremo derecho de la fila del nodo, con este texto (cuántos resultados tiene un archivo); \"\" si no hay ninguna."
"TREENODE.BOLD" = "El texto del nodo en negrita (el encabezado de un grupo)."
"TREENODE.CHANGED" = "El valor del nodo cambió desde la última vez que se detuvo el programa: un nodo de valor (SetItemValue) se resalta y se marca con un pequeño triángulo, y los lectores de pantalla anuncian \"changed\"."
"TREENODE.COLUMN" = "Texto atenuado en una columna propia antes del texto del nodo, tan ancha como la más ancha de las que se muestran (la línea y la columna de un resultado de búsqueda: `12:5`); \"\" si no hay ninguno."
"TREENODE.COUNT" = "Cuántos hijos tiene el nodo."
"TREENODE.DETAIL" = "Texto atenuado después del texto del nodo (la carpeta de un archivo, por ejemplo); se corta primero cuando la fila es demasiado estrecha."
"TREENODE.EXPANDED" = "Si se muestran los hijos del nodo."
"TREENODE.HANDLE" = "Un número que identifica al nodo."
"TREENODE.HASCHILDREN" = "Si el nodo muestra un botón de expansión, incluso antes de tener hijos."
"TREENODE.ICON" = "Un ícono del conjunto propio de RapidR junto al nodo, por su nombre (`files/rr`, `kinds/form`), o `file:` y la ruta de un archivo para el ícono que el panel Proyecto de RapidR Studio da a ese archivo (según su tipo); \"\" (el valor predeterminado) si no hay ninguno —entonces se usa la imagen de la lista Images, si la hay—."
"TREENODE.IMAGEINDEX" = "La imagen (de la lista Images del árbol) que se muestra junto al nodo; -1 si no hay ninguna."
"TREENODE.INDEX" = "La posición del nodo entre los hijos de su nodo padre, desde 0."
"TREENODE.ISVISIBLE" = "Si el nodo se puede ver (todos sus padres expandidos)."
"TREENODE.LEVEL" = "Qué tan profundo está el nodo: 0 para un nodo raíz."
"TREENODE.MARKLENGTH" = "Cuántos caracteres del texto del nodo están marcados, desde MarkStart; 0 (el valor predeterminado) no marca ninguno. `Tree.Item(i).MarkStart = 4: Tree.Item(i).MarkLength = 5` marca del quinto al noveno."
"TREENODE.MARKSTART" = "Dónde empieza una parte marcada del texto del nodo —la coincidencia de una búsqueda en su línea, por ejemplo—, contada en caracteres desde 0; MarkLength indica cuánto mide. La parte se dibuja sobre el color de coincidencia del tema, con el texto encima sin cambios."
"TREENODE.PARENT" = "El índice del nodo padre; -1 para un nodo raíz."
"TREENODE.SELECTED" = "Si el nodo es el seleccionado; al establecerlo se selecciona."
"TREENODE.SELECTEDINDEX" = "La imagen que se muestra mientras el nodo está seleccionado."
"TREENODE.STATEINDEX" = "Una imagen de estado adicional (de StateImages) a la izquierda del nodo; -1 si no hay ninguna."
"TREENODE.TEXT" = "El texto del nodo."
"TREENODE.TEXTCOLOR" = "El color del texto del nodo; -1 (el valor predeterminado) para el propio del árbol."
"TREENODE.TOP" = "Dónde empieza la fila del nodo, en píxeles desde el borde superior del árbol (desplazado con TopIndex: negativo para las filas por encima de las que se muestran); -1 cuando no se puede ver. Un menú bajo el nodo: `Menu.PopupAt Tree, 40, Tree.Item(i).Top + Tree.ItemHeight`."
"TREENODE.VALUEKIND" = "El tipo que SetItemValue dio al nodo (`Integer`, `String`, `Locals` …); vacío para un nodo simple."
