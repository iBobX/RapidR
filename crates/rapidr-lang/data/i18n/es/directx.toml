# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/components/directx.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"RDXIMAGELIST" = "Una biblioteca de imágenes para una pantalla DirectX, cargada desde listas de imágenes `.DXG` de DelphiX y dibujada con su transparencia."
"RDXIMAGELIST.DRAW" = "Dibuja un mapa de bits con su esquina superior izquierda en (`x`, `y`); una lista de imágenes DirectX dibuja allí su imagen `Item`."
"RDXIMAGELIST.LOADFROMFILE" = "Carga el contenido del componente desde un archivo: texto, elementos, celdas de la cuadrícula, nodos del árbol o una imagen."
"RDXIMAGELIST.LOADFROMRESOURCE" = "Carga imágenes desde un recurso de mapa de bits."
"RDXIMAGELIST.LOADFROMSTREAM" = "Carga el contenido del componente desde un flujo abierto."
"RDXIMAGELIST.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RDXJOYSTICK" = "Un joystick o gamepad: Update lee su estado en IsLeft, IsUp, `Button(n)` …; RapidR añade los ejes, la cruceta POV y cuál gamepad es (Index)."
"RDXJOYSTICK.BUTTON" = "Indica si un botón del joystick está presionado."
"RDXJOYSTICK.BUTTONS" = "Los botones del joystick que están presionados, un bit cada uno: el bit n − 1 para el botón n."
"RDXJOYSTICK.CONNECTED" = "Distinto de cero mientras la conexión (base de datos, puerto serial, socket) está abierta, o mientras el joystick está conectado."
"RDXJOYSTICK.INDEX" = "En un joystick, cuál lee (0 el primero); en un nodo de árbol (`Item(i).Index`), su posición desde 0."
"RDXJOYSTICK.ISDOWN" = "Es True mientras el joystick está empujado hacia abajo (hacia quien juega), según lo leyó el último `Update`."
"RDXJOYSTICK.ISLEFT" = "Es True mientras el joystick está empujado hacia la izquierda, según lo leyó el último `Update`."
"RDXJOYSTICK.ISRIGHT" = "Es True mientras el joystick está empujado hacia la derecha, según lo leyó el último `Update`."
"RDXJOYSTICK.ISUP" = "Es True mientras el joystick está empujado hacia arriba (lejos de quien juega), según lo leyó el último `Update`."
"RDXJOYSTICK.NAME" = "El nombre de la fuente (`Arial`); en un joystick, el nombre del dispositivo."
"RDXJOYSTICK.ONBUTTONDOWN" = "Se produce cuando se presiona un botón del joystick; Button es su número, desde 1 (propio de RapidR, se busca en cada tick del joystick)."
"RDXJOYSTICK.ONBUTTONUP" = "Se produce cuando se suelta un botón del joystick; Button es su número, desde 1."
"RDXJOYSTICK.ONMOVE" = "Se produce cuando cambia la posición del joystick (X, Y y los demás ejes leen los valores nuevos)."
"RDXJOYSTICK.POV" = "La dirección de la cruceta del joystick, en centésimas de grado en sentido horario desde el frente; -1 cuando está centrada."
"RDXJOYSTICK.R" = "El cuarto eje del joystick (timón), de 0 a 65535, 32767 en reposo."
"RDXJOYSTICK.U" = "El quinto eje del joystick, de 0 a 65535, 32767 en reposo."
"RDXJOYSTICK.UPDATE" = "Pone al día el componente: lo vuelve a dibujar, vuelve a listar sus archivos o vuelve a leer el estado de su dispositivo."
"RDXJOYSTICK.V" = "El sexto eje del joystick, de 0 a 65535, 32767 en reposo."
"RDXJOYSTICK.X" = "Una X: el componente del vector, el primer eje del joystick (de 0 a 65535, 32767 en reposo) o la del puntero del mouse en la pantalla."
"RDXJOYSTICK.Y" = "Una Y: el componente del vector, el segundo eje del joystick (de 0 a 65535, 32767 en reposo, y crece hacia abajo) o la del puntero del mouse en la pantalla."
"RDXJOYSTICK.Z" = "Una Z: el componente del vector, o el tercer eje del joystick (de 0 a 65535, 32767 en reposo)."
"RDXSCREEN" = "Una superficie de dibujo DirectX en un formulario, para juegos y animación: dibujar el siguiente fotograma fuera de pantalla y luego usar Flip para mostrarlo. También contiene la escena y la cámara de Direct3D."
"RDXSCREEN.ACCESSIBLEDESCRIPTION" = "Una descripción más larga que un lector de pantalla da después del nombre (qué hace el control, un atajo)."
"RDXSCREEN.ACCESSIBLEHIDDEN" = "True: el control es decoración —un punto parpadeante, un adorno— y un lector de pantalla lo omite (sigue en la ventana, para los ojos). Nunca lo establezcas en nada que una persona pueda usar o necesite leer."
"RDXSCREEN.ACCESSIBLENAME" = "Cómo llama un lector de pantalla al control, cuando su título o texto no basta (un botón de imagen, un campo de edición sin etiqueta)."
"RDXSCREEN.ADDLIGHT" = "Añade una luz al marco o a la escena 3D."
"RDXSCREEN.ALIGN" = "Dónde se acopla el control en su contenedor: una de las constantes `alXXX`. `alNone` conserva su propio lugar; `alClient` llena lo que dejan los demás controles acoplados."
"RDXSCREEN.ALLOWSTRETCH" = "Si el búfer posterior se estira para llenar el control cuando sus tamaños difieren."
"RDXSCREEN.ANCHORS" = "Los bordes de su contenedor a los que el control mantiene su distancia cuando el contenedor cambia de tamaño: akLeft + akTop (el valor predeterminado) no se mueve; añade akRight / akBottom para estirarlo."
"RDXSCREEN.AUTOSIZE" = "Hace que el control se ajuste a su contenido: una etiqueta a su texto, un control de imagen a su imagen, un campo de edición a la altura de su fuente; el búfer de una pantalla DirectX sigue el tamaño del control."
"RDXSCREEN.BITCOUNT" = "La profundidad de color del modo de pantalla completa, en bits por píxel (8, 16, 24 o 32)."
"RDXSCREEN.BRUSHCOLOR" = "El color de relleno que usan los métodos de dibujo, como &HBBGGRR (el atajo de RapidR para el pincel)."
"RDXSCREEN.CAMERALOOKAT" = "Gira la cámara para que mire hacia el marco `F`; `Constraint` limita los ejes en los que puede girar."
"RDXSCREEN.CIRCLE" = "Dibuja una elipse en el recuadro (`x1`, `y1`)–(`x2`, `y2`), con el contorno del color `c` y el relleno del color `fill`."
"RDXSCREEN.COLOR" = "El color de fondo, como &HBBGGRR o un color de sistema `clXXX`; en un cuadro de diálogo de color o de fuente, el color elegido."
"RDXSCREEN.COPYRECT" = "Copia el rectángulo `S` de otra imagen o lienzo en el rectángulo `D` de esta, escalándolo para que encaje."
"RDXSCREEN.CREATEANIMATION" = "Toma un objeto de animación de Direct3D. Un objeto así todavía no tiene nada que hacer (no tiene claves ni hay nada que lo reproduzca), así que esto no hace nada."
"RDXSCREEN.CREATEANIMATIONSET" = "Toma un conjunto de animaciones de Direct3D. Un objeto así todavía no tiene nada que hacer (no hay animaciones que añadir ni nada que lo reproduzca), así que esto no hace nada."
"RDXSCREEN.CREATEFACE" = "Crea una cara nueva y vacía en la variable `Face`."
"RDXSCREEN.CREATEFRAME" = "Crea un marco nuevo en la variable `Frame`, secundario de este marco o de la escena."
"RDXSCREEN.CREATELIGHTRGB" = "Crea una luz de tipo `LightType` de color `R`, `G`, `B` (de 0 a 1) en la variable `Light`."
"RDXSCREEN.CREATEMESHBUILDER" = "Crea un constructor de mallas vacío en la variable `MB`."
"RDXSCREEN.CREATESHADOW" = "Crea en `V` la sombra de `MB` proyectada por `Light` sobre el plano que pasa por (`px`, `py`, `pz`) con normal (`nx`, `ny`, `nz`)."
"RDXSCREEN.CREATEWRAP" = "Crea en `W` una envoltura de textura de tipo `WrapType` (plana, cilindro, esfera, cromo) a partir de un origen, una dirección, un vector hacia arriba, un desfase y una escala."
"RDXSCREEN.CURSOR" = "El puntero del mouse que se muestra sobre el control: una de las constantes `crXXX`."
"RDXSCREEN.DRAW" = "Dibuja un mapa de bits con su esquina superior izquierda en (`x`, `y`); una lista de imágenes DirectX dibuja allí su imagen `Item`."
"RDXSCREEN.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RDXSCREEN.FASTPSET" = "Establece el píxel del búfer posterior en (`X1`, `Y1`) a `C`, un valor de píxel del dispositivo."
"RDXSCREEN.FILL" = "Rellena todo el búfer posterior con el color `Color`."
"RDXSCREEN.FILLRECT" = "Rellena el rectángulo (`x1`, `y1`)–(`x2`, `y2`) con el color `c`."
"RDXSCREEN.FLIP" = "En una pantalla DirectX, muestra lo que se dibujó en el búfer posterior; en un arreglo, invierte los elementos (igual que `Reverse`)."
"RDXSCREEN.FONT" = "La fuente del texto, un RFont; al asignar una, se copia."
"RDXSCREEN.FONTCOLOR" = "El atajo de RapidR para `Font.Color`: el color del texto, como &HBBGGRR."
"RDXSCREEN.FONTNAME" = "En un cuadro de diálogo de fuente o en un RFont, el nombre de una fuente instalada, `FontName(i)` desde 0; en los demás, el atajo de RapidR para `Font.Name`."
"RDXSCREEN.FONTSIZE" = "El atajo de RapidR para `Font.Size`, en puntos."
"RDXSCREEN.FORCEUPDATE" = "Marca el rectángulo (`X1`, `Y1`)–(`X2`, `Y2`) de la vista 3D para dibujarlo otra vez; RapidR dibuja toda la vista en cada `Render`."
"RDXSCREEN.FULLSCREEN" = "Ocupa toda la pantalla en el modo de pantalla `BitCount` y con el tamaño indicado."
"RDXSCREEN.HEIGHT" = "La altura, en píxeles; en `Screen`, la de la pantalla."
"RDXSCREEN.HINT" = "La sugerencia que se muestra cuando el mouse se detiene sobre el control (con `ShowHint`)."
"RDXSCREEN.INIT" = "Prepara el objeto: una pantalla DirectX crea su superficie de dibujo de `Width` × `Height`; en la web un objeto de ciencia de datos empieza vacío."
"RDXSCREEN.LEFT" = "La distancia al borde izquierdo del contenedor (en un formulario: el de la pantalla), en píxeles."
"RDXSCREEN.LINE" = "Dibuja una línea desde (`x1`, `y1`) hasta (`x2`, `y2`) con el color `c`."
"RDXSCREEN.LOADTEXTURE" = "Carga un archivo de imagen como textura: en el constructor de mallas, o en la textura `Tex`."
"RDXSCREEN.MAXHEIGHT" = "La altura máxima del control, en píxeles; 0 para no tener límite. También `Constraints.MaxHeight`."
"RDXSCREEN.MAXWIDTH" = "El ancho máximo del control, en píxeles; 0 para no tener límite. También `Constraints.MaxWidth`."
"RDXSCREEN.MINHEIGHT" = "La altura mínima del control, en píxeles; 0 para no tener límite. También `Constraints.MinHeight`."
"RDXSCREEN.MINWIDTH" = "El ancho mínimo del control, en píxeles, sea quien sea que lo cambie de tamaño (el programa, Align, Anchors, la persona); 0 para no tener límite. También `Constraints.MinWidth`."
"RDXSCREEN.MOVE" = "Avanza la escena 3D `D` pasos de tiempo: cada marco se mueve y gira según su velocidad y su rotación."
"RDXSCREEN.ONCLICK" = "Se produce cuando la persona hace clic en el control (o presiona su atajo, o Space o Enter en un botón con el foco)."
"RDXSCREEN.ONDBLCLICK" = "Se produce cuando la persona hace doble clic en el control (en una superficie de diseño: el componente diseñado Index)."
"RDXSCREEN.ONINITIALIZE" = "Se produce una vez cuando la pantalla DirectX está preparada en su formulario ya creado, antes de OnInitializeSurface."
"RDXSCREEN.ONINITIALIZESURFACE" = "Se produce una vez cuando la superficie de dibujo de la pantalla DirectX está lista: el lugar para cargar imágenes y construir una escena 3D."
"RDXSCREEN.ONKEYDOWN" = "Se produce cuando se presiona una tecla mientras el control tiene el foco (Key: el código de tecla virtual; Shift: el estado de Shift, Ctrl y Alt)."
"RDXSCREEN.ONKEYPRESS" = "Se produce cuando al presionar una tecla se escribe un carácter mientras el control tiene el foco (Key: el código del carácter)."
"RDXSCREEN.ONMOUSEDOWN" = "Se produce cuando se presiona un botón del mouse sobre el control (Button: `mbLeft`, `mbRight` o `mbMiddle`; X, Y: dentro del control; Shift: el estado de las teclas)."
"RDXSCREEN.ONMOUSEMOVE" = "Se produce cuando el mouse se mueve sobre el control (X, Y: dentro del control; Shift: los botones y teclas presionados)."
"RDXSCREEN.ONMOUSEUP" = "Se produce cuando se suelta un botón del mouse sobre el control (Button: `mbLeft`, `mbRight` o `mbMiddle`; X, Y: dentro del control; Shift: el estado de las teclas)."
"RDXSCREEN.PAINT" = "Rellena un área a partir de (`x`, `y`) con el color `c` hasta el color de borde `borderc`."
"RDXSCREEN.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RDXSCREEN.PENCOLOR" = "El color de línea que usan los métodos de dibujo, como &HBBGGRR (el atajo de RapidR para el lápiz)."
"RDXSCREEN.PIXEL" = "El color de un píxel, `Pixel(x, y)`, como &HBBGGRR."
"RDXSCREEN.PSET" = "Pinta el píxel en (`x`, `y`) con el color `c`."
"RDXSCREEN.RECTANGLE" = "Dibuja el contorno del rectángulo (`x1`, `y1`)–(`x2`, `y2`) con el color `c`."
"RDXSCREEN.RELEASE" = "Libera las superficies DirectX; RapidR no tiene nada que liberar."
"RDXSCREEN.RENDER" = "Dibuja la escena: una pantalla DirectX dibuja su vista 3D; en la web se dibuja un gráfico (como `SaveFig`)."
"RDXSCREEN.ROTATE" = "Gira la imagen `Angle` grados alrededor de (`xOrigin`, `yOrigin`)."
"RDXSCREEN.ROUNDRECT" = "Dibuja un rectángulo (`x1`, `y1`)–(`x2`, `y2`) con las esquinas redondeadas por una elipse de `x3` de ancho y `y3` de alto, con el color `c`."
"RDXSCREEN.SETBACKGROUNDIMAGE" = "Usa una textura como fondo de la escena 3D."
"RDXSCREEN.SETCAMERAORIENTATION" = "Apunta la cámara a lo largo de (`DX`, `DY`, `DZ`) con (`UX`, `UY`, `UZ`) como su dirección hacia arriba."
"RDXSCREEN.SETCAMERAPOSITION" = "Mueve la cámara a (`X`, `Y`, `Z`)."
"RDXSCREEN.SETRENDERMODE" = "Establece los indicadores del modo de renderizado de la vista 3D."
"RDXSCREEN.SETTEXTUREQUALITY" = "Establece cómo se filtran las texturas al dibujarlas."
"RDXSCREEN.SETVELOCITY" = "Establece la velocidad (`X`, `Y`, `Z`) con la que se mueve un marco en cada paso de tiempo de `Move`; una pantalla DirectX establece la de su cámara."
"RDXSCREEN.SHOWHINT" = "Muestra la sugerencia `Hint` cuando el mouse se detiene sobre el control; en `Application`, activa o desactiva todas las sugerencias."
"RDXSCREEN.STRETCHDRAW" = "Dibuja un mapa de bits escalado para llenar el rectángulo `Rect`."
"RDXSCREEN.TEXTHEIGHT" = "Devuelve la altura en píxeles del texto con la fuente actual."
"RDXSCREEN.TEXTOUT" = "Escribe el texto `S` en (`x`, `y`) con el color `fc` sobre el fondo `bc` (-1: transparente), con la fuente actual."
"RDXSCREEN.TEXTRECT" = "Escribe el texto `S` en (`x`, `y`), recortado al rectángulo `Rect`, en color `fc` sobre el fondo `bc`."
"RDXSCREEN.TEXTWIDTH" = "Devuelve el ancho en píxeles del texto con la fuente actual."
"RDXSCREEN.TOP" = "La distancia al borde superior del contenedor (en un formulario: el de la pantalla), en píxeles."
"RDXSCREEN.USE3D" = "Prepara la pantalla DirectX para dibujar con Direct3D."
"RDXSCREEN.USEHARDWARE" = "Usa la aceleración de la tarjeta gráfica cuando puede."
"RDXSCREEN.VISIBLE" = "Si el control o formulario se muestra."
"RDXSCREEN.WIDTH" = "El ancho, en píxeles; en `Screen`, el de la pantalla."
"RDXSOUND" = "Un sonido WAV reproducido a la manera de DirectSound: con su Frequency, Volume y Pan, una vez o en ciclo."
"RDXSOUND.AUTOUPDATE" = "Mantiene lleno el búfer del sonido por sí solo mientras se transmite."
"RDXSOUND.BUFFERLENGTH" = "La longitud del búfer de transmisión del sonido, en milisegundos."
"RDXSOUND.FILENAME" = "El archivo elegido en un cuadro de diálogo (con su carpeta), o el archivo que el objeto lee o escribe."
"RDXSOUND.FREQUENCY" = "En un sonido DirectX, la frecuencia de reproducción en muestras por segundo; en una barra deslizante, el paso entre marcas de graduación."
"RDXSOUND.LOOPED" = "Reproduce el sonido una y otra vez hasta que se detiene."
"RDXSOUND.PAN" = "El balance izquierda-derecha, de -100 (derecha silenciada) a 100 (izquierda silenciada); 0 centrado."
"RDXSOUND.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RDXSOUND.PLAY" = "Inicia la reproducción desde la posición actual."
"RDXSOUND.PLAYING" = "Es True mientras el sonido, el audio o el video se reproduce; solo lectura."
"RDXSOUND.POSITION" = "Dónde está ahora: el valor de una barra de progreso, de desplazamiento o deslizante, la posición de un flujo en bytes, o la posición de reproducción de un sonido o de un objeto multimedia."
"RDXSOUND.RECREATEBUF" = "Vuelve a crear el búfer del sonido después de que DirectSound lo perdió. El sonido de RapidR nunca pierde su búfer, así que esto no hace nada."
"RDXSOUND.SIZE" = "Un tamaño: de una fuente, en puntos; de un archivo, flujo, sonido o descarga, en bytes; de un arreglo, su número de valores."
"RDXSOUND.STICKYFOCUS" = "Mantiene el sonido audible mientras otra aplicación tiene el foco."
"RDXSOUND.STOP" = "Detiene lo que está en marcha: la reproducción (vuelve al inicio), la grabación o el servidor."
"RDXSOUND.TAG" = "Un número para uso propio del programa; RapidR nunca lo lee."
"RDXSOUND.UPDATE" = "Pone al día el componente: lo vuelve a dibujar, vuelve a listar sus archivos o vuelve a leer el estado de su dispositivo."
"RDXSOUND.VOLUME" = "El volumen: de 0 a 100 en objetos multimedia y sonidos de DirectX; de 0 a 1 en audio y video web."
"RDXTIMER" = "Un temporizador de fotogramas para animación DirectX: OnTimer se produce según FrameRate (Interval 0: una vez por fotograma), opcionalmente solo mientras el programa está activo."
"RDXTIMER.ACTIVEONLY" = "Cuando es true, el temporizador se pausa mientras la aplicación no es la activa."
"RDXTIMER.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RDXTIMER.FRAMERATE" = "Cuántas veces se produjo el temporizador en el último segundo completo; solo lectura."
"RDXTIMER.INTERVAL" = "Los milisegundos entre los tics de un temporizador; en un objeto multimedia, entre las actualizaciones de su posición."
"RDXTIMER.ONTIMER" = "Se produce cada vez que pasan Interval milisegundos mientras el temporizador está Enabled (Sender: el temporizador). Los temporizadores siguen avanzando mientras el programa espera."
