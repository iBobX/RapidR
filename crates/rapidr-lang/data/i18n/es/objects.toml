"RMEMORYSTREAM.READALL" = "Devuelve el resto del flujo como texto."
"RMEMORYSTREAM.READALLTEXT" = "Devuelve el resto del flujo como texto: UTF-8 (sin la marca de orden de bytes) cuando lo es y, si no, Windows-1252, el texto ANSI de los programas más antiguos. `ReadAll` y `ReadStr` devuelven bytes, un carácter cada uno, como en los programas más antiguos."
