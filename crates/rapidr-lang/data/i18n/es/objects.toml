"RSECRETS" = "Guarda contraseñas, tokens y claves en el llavero del sistema operativo (el Llavero de macOS, el Administrador de credenciales de Windows, el Secret Service en Linux), por servicio y nombre: nunca en el programa, en un archivo ni en la configuración. Cada programa tiene sus propias entradas (guardadas como rapidr-app:<program>:<service>, donde <program> es el nombre de su archivo y una huella de dónde está el archivo, o el identificador de paquete de una aplicación de macOS compilada), así que ningún programa llega a las de otro ni a las de RapidR Studio — ni siquiera uno con el mismo nombre en otra carpeta. Lo que lee y guarda nunca se muestra: el depurador muestra ••••, nunca se le da a una IA y Error nunca lo dice. Un navegador no tiene llavero: en la web Available es False y cada llamada falla (Error lo dice); no se guarda nada en el almacenamiento de la página. Para pruebas, RAPIDR_AI_KEYSTORE=memory guarda todo en la memoria del programa. Propio de RapidR."
"RSECRETS.AVAILABLE" = "True donde se pueden guardar secretos: hay un llavero que RapidR puede usar (o el almacén de prueba). False en un navegador y en un Linux sin Secret Service."
"RSECRETS.DELETE" = "Quita del llavero `Name` de `Service`. True cuando había uno; False cuando no lo había o no se pudo (Error dice por qué)."
"RSECRETS.ERROR" = "Por qué falló la última llamada (\"\" cuando funcionó): no hay llavero aquí, el llavero lo rechazó, un servicio o un nombre vacío, un valor de más de 1024 caracteres. Nunca el valor."
"RSECRETS.EXISTS" = "True cuando hay algo guardado como `Name` de `Service`."
"RSECRETS.PROGRAM" = "La identidad bajo la que se guardan las entradas de este programa: el nombre de su archivo en minúsculas y una huella de la ruta completa del archivo (\"dbstudio~1a2b3c4d5e6f7081\": dos programas llamados main.rr en dos carpetas son dos programas; si se mueve a otra carpeta, un programa empieza sin sus secretos), o el identificador de paquete de una aplicación de macOS compilada (\"com.example.dbstudio\", esté donde esté la aplicación)."
"RSECRETS.READ" = "Lo que hay guardado como `Name` de `Service`: \"\" cuando no hay nada (Exists distingue ambos casos) o cuando no se puede leer el llavero (Error dice por qué). El valor es una credencial: el depurador muestra ••••."
"RSECRETS.SAVE" = "Guarda `Value` en el llavero como `Name` de `Service` (ambos son palabras tuyas: \"MySQL\", \"office\"), reemplazando lo que había guardado. True cuando se guardó; False cuando no (Error dice por qué). `Value` es una credencial: nunca se muestra."
"RSECRETS.STORE" = "Dónde se guardan los secretos aquí, en palabras: \"the macOS Keychain\", \"Windows Credential Manager\", \"the Secret Service (GNOME Keyring or KWallet)\"; con el almacén de prueba, memory."
"RSTRINGLIST" = "Una lista de cadenas de texto en memoria: añadirlas, insertarlas, eliminarlas, ordenarlas y buscarlas, cargarlas y guardarlas como texto."
"RSTRINGLIST.ADD" = "Añade al final una entrada: una línea de texto a un editor o a una lista de cadenas de texto, o un elemento a un menú."
"RSTRINGLIST.ADDITEM" = "Añade al final un elemento (una entrada de lista, una línea, un nodo o un elemento de menú) al componente."
"RSTRINGLIST.ADDITEMS" = "Añade al final una o más cadenas de texto (elementos, líneas o nodos) al componente, en el orden indicado."
"RSTRINGLIST.ADDLIST" = "Añade al final todas las cadenas de otra lista de cadenas de texto."
"RSTRINGLIST.ADDSTRING" = "Añade al final una cadena de texto como un elemento o una línea nueva."
"RSTRINGLIST.BUILD" = "Devuelve las cadenas desde `Start` hasta `End` unidas en una sola, separadas por `Delim`."
"RSTRINGLIST.CLEAR" = "Vacía el componente: quita sus elementos, líneas, texto o datos, o borra su dibujo."
"RSTRINGLIST.COUNT" = "Cuántos elementos contiene: elementos de lista, nodos de árbol, cadenas de texto, elementos de menú, imágenes, entradas JSON o componentes diseñados."
"RSTRINGLIST.DELETE" = "Quita una parte del contenido: la cadena o la imagen de una lista en un índice, o las muestras de una grabación desde `Pos1` hasta `Pos2`."
"RSTRINGLIST.DELETEITEM" = "Quita el elemento del índice indicado."
"RSTRINGLIST.DELETEITEMS" = "Quita los elementos de los índices indicados."
"RSTRINGLIST.DELITEMS" = "Quita los elementos de los índices indicados."
"RSTRINGLIST.DUPLICATES" = "Qué hace una lista de cadenas ordenada con una cadena que ya tiene: `dupIgnore` la descarta, `dupAccept` la añade, `dupError` provoca un error."
"RSTRINGLIST.EXCHANGE" = "Intercambia las cadenas que están en `Index1` y `Index2`."
"RSTRINGLIST.FIND" = "Busca una cadena de texto en los elementos y devuelve el índice de la coincidencia (-1 si no hay ninguna)."
"RSTRINGLIST.GET" = "Lee por clave o índice: un elemento de un arreglo, una cadena de una lista, un valor almacenado o una variable CGI; un cliente HTTP solicita una URL y devuelve el cuerpo de la respuesta."
"RSTRINGLIST.INDEXOF" = "Devuelve el índice de la primera cadena igual a `String`, o -1."
"RSTRINGLIST.INSERT" = "Inserta en una posición: un nodo o una cadena de texto antes del índice `Index`, o el elemento de menú `Item` en la posición `I`."
"RSTRINGLIST.INSERTITEM" = "Inserta un elemento con el texto `String` antes de la posición `Index`."
"RSTRINGLIST.ITEM" = "Un elemento, `Item(i)` desde 0: la cadena de texto de una lista, un campo del resultado de una base de datos, o un nodo de un árbol o de una vista de lista con sus propias propiedades."
"RSTRINGLIST.ITEMCOUNT" = "El número de elementos: cadenas de texto de una lista, nodos de un árbol, filas de una vista de lista o elementos de un menú."
"RSTRINGLIST.ITEMS" = "De RapidR: los elementos como texto, uno por línea; `Items(i)` es `Item(i)`."
"RSTRINGLIST.LISTCOUNT" = "El nombre de RapidR para `ItemCount`."
"RSTRINGLIST.LISTINDEX" = "El nombre de RapidR para `ItemIndex`."
"RSTRINGLIST.LOADFROMFILE" = "Carga el contenido del componente desde un archivo: texto, elementos, celdas de la cuadrícula, nodos del árbol o una imagen."
"RSTRINGLIST.LOADFROMSTREAM" = "Reemplaza los elementos por el texto del flujo desde su posición hasta su final, una línea por elemento (las líneas terminan en CR LF, LF o CR); el flujo queda al final."
"RSTRINGLIST.PARSE" = "Divide un texto en partes: una lista de cadenas divide `Source` en cada `Delim` en sus elementos y devuelve cuántos son; un CGI lee las variables de la solicitud."
"RSTRINGLIST.REFRESH" = "Vuelve a dibujar el componente de inmediato; en MySQL, vacía las tablas o cachés del servidor que indica `RefreshFlags`."
"RSTRINGLIST.REMOVE" = "Quita algo: una cadena de una lista por índice, el elemento de la página o un valor almacenado por clave."
"RSTRINGLIST.REMOVEITEM" = "Quita el elemento del índice indicado."
"RSTRINGLIST.SAVETOFILE" = "Guarda el contenido del componente en un archivo: texto, elementos, celdas de la tabla, nodos del árbol o una imagen."
"RSTRINGLIST.SAVETOSTREAM" = "Lee la lista desde el flujo, exactamente como lo hace LoadFromStream, y no escribe nada (borra la lista). Para escribir los elementos en un flujo, usa `Stream.WriteStr(List.Text, LEN(List.Text))`."
"RSTRINGLIST.SORT" = "Ordena los elementos o los nodos en orden ascendente."
"RSTRINGLIST.SORTED" = "Mantiene los elementos en orden alfabético."
"RSTRINGLIST.STRING" = "Devuelve la cadena del índice indicado. Igual que `Item`."
"RSTRINGLIST.STRINGS" = "Devuelve la cadena del índice indicado. Igual que `Item`."
"RSTRINGLIST.TEXT" = "El texto: el contenido de un cuadro de texto o de un memo, el texto editable de una lista desplegable, los elementos de una lista uno por línea, el texto de un nodo de árbol o el contenido de un flujo."
"RTIMER" = "Ejecuta su controlador OnTimer cada Interval milisegundos mientras Enabled es true."
"RTIMER.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RTIMER.INTERVAL" = "Los milisegundos entre los tics de un temporizador; en un objeto multimedia, entre las actualizaciones de su posición."
"RTIMER.ONTIMER" = "Se produce cada vez que pasan Interval milisegundos mientras el temporizador está Enabled (Sender: el temporizador). Los temporizadores siguen avanzando mientras el programa espera."
"RTIMER.TAG" = "Un número para uso propio del programa; RapidR nunca lo lee."
"RSYSTEMINFO" = "Lo que tiene esta computadora —su sistema, procesador, memoria, gráficos, disco y batería— leído en esta computadora. RapidR nunca envía estos datos a ninguna parte. Si tu programa lo hace (a un servidor, en un registro, en un informe), avisa antes a las personas que lo usan y envía solo lo que necesites (`Class`, no todos los datos): juntos permiten reconocer una computadora entre todas las demás, y un programa infantil no debería enviarlos en absoluto. Un programa se adapta a la computadora: `Class` dice el tamaño de la computadora en palabras sencillas (small, medium, large), `FreeMemory`, cuánta memoria puede tener un programa ahora. Los tamaños de memoria y de disco están en megabytes. En una página web el navegador dice solo un poco (sus núcleos, más o menos su memoria, el sistema): `Unknown` nombra lo que no se puede saber allí, y esas propiedades dan 0 o \"\". La comprobación que hace RapidR Studio de los modelos de IA en esta computadora lee los mismos datos. Propio de RapidR."
"RSYSTEMINFO.ARCHITECTURE" = "El tipo de procesador: \"arm64\", \"x86_64\" o \"x86\"; \"\" en la web."
"RSYSTEMINFO.BATTERYLEVEL" = "La carga de la batería, de 0 a 100; -1 si no hay batería o no se sabe."
"RSYSTEMINFO.BROWSER" = "True en una página web: los datos son los del navegador, y son menos."
"RSYSTEMINFO.CLASS" = "El tamaño de la computadora en palabras sencillas: \"small\" (menos de 8 GB de memoria, o menos de 4 núcleos), \"large\" (32 GB o más y 8 núcleos o más), y en los demás casos \"medium\"."
"RSYSTEMINFO.CORES" = "Cuántas cosas hace el procesador a la vez (núcleos lógicos)."
"RSYSTEMINFO.CPU" = "El nombre del procesador (\"Apple M4 Max\", \"Intel(R) Core(TM) i5-8250U CPU @ 1.60GHz\"); \"\" cuando el sistema no lo dice, y en la web."
"RSYSTEMINFO.DISKFREE" = "Lo que queda libre en ese disco, en megabytes; 0 en la web."
"RSYSTEMINFO.DISKTOTAL" = "El tamaño del disco en el que están tus archivos (el de la carpeta personal), en megabytes; 0 en la web."
"RSYSTEMINFO.FREEMEMORY" = "La memoria que un programa puede tener ahora, en megabytes: la que está libre y la que el sistema devuelve de inmediato (cachés). Se lee de nuevo cada vez. 0 en la web."
"RSYSTEMINFO.GPU" = "El nombre del procesador gráfico (en Apple silicon, el del chip: \"Apple M4 Max\"); \"\" cuando no se sabe, y en la web."
"RSYSTEMINFO.GPUMEMORY" = "La memoria que puede usar el procesador gráfico, en megabytes: la suya propia o, donde la memoria es compartida (UnifiedMemory), la parte que puede tomar, alrededor de tres cuartas partes de ella. 0 cuando no se sabe."
"RSYSTEMINFO.HASBATTERY" = "True cuando la computadora tiene batería (una computadora portátil). False en la web, donde no se sabe."
"RSYSTEMINFO.ONBATTERY" = "True cuando funciona con su batería ahora (desenchufada): un programa puede hacer menos para ahorrarla."
"RSYSTEMINFO.OS" = "El sistema operativo: \"macOS\", \"Windows\", \"Linux\" (en una página web: el sistema en el que el navegador dice que se ejecuta)."
"RSYSTEMINFO.OSVERSION" = "La versión del sistema, tal como el propio sistema la indica: \"27.2\", \"11 24H2 (26100)\", \"Ubuntu 24.04 LTS\"; \"\" en la web."
"RSYSTEMINFO.REFRESH" = "Vuelve a leer todo (la batería, un disco que se llenó). FreeMemory siempre se lee en el momento; el resto se lee una vez, la primera vez que se pide."
"RSYSTEMINFO.SUMMARY" = "Una frase para personas: \"macOS 27.2 on Apple M4 Max (16 cores), 48 GB of memory (31 GB free), 410 GB free on the disk, plugged in.\""
"RSYSTEMINFO.TOTALMEMORY" = "Toda la memoria, en megabytes (`\\ 1024` da gigabytes). En la web, donde el navegador la indica, redondeada y de 8 GB como máximo; en los demás casos, 0."
"RSYSTEMINFO.UNIFIEDMEMORY" = "True cuando el procesador y los gráficos comparten una sola memoria (Apple silicon): un modelo de IA grande puede usar la mayor parte de ella."
"RSYSTEMINFO.UNKNOWN" = "Las propiedades que esta computadora o este navegador no pueden decir, por su nombre, separadas por \", \" (\"FreeMemory, GPU, DiskFree, …\" en la web); \"\" cuando se sabe todo."
