"RIMAGELIST.DRAW" = "Dibuja la imagen `Index` con su esquina superior izquierda en (`X`, `Y`) sobre `Target`, que puede ser RBitmap, RImage, RCanvas o RDXScreen (su búfer posterior). Si `Index` está fuera de rango, no se dibuja nada; los píxeles del color de máscara se omiten."
"RIMAGELIST.DRAWINGSTYLE" = "Cómo se dibujan las imágenes: `dsNormal`, `dsTransparent`, o mezcladas con `BlendColor` (`dsFocused`, `dsSelected`)."
"RIMAGELIST.GETBMP" = "Una imagen de la lista como mapa de bits, `GetBMP(i)` desde 0; solo lectura."
"RIMAGELIST.GETICO" = "Una imagen de la lista como ícono, `GetICO(i)` desde 0; solo lectura."
"RIMAGELIST.HANDLE" = "El identificador de la ventana (o de otro objeto del sistema), para llamadas a la API y para componentes que lo reciben."
"RIMAGELIST.HEIGHT" = "La altura, en píxeles; en `Screen`, la de la pantalla."
"RIMAGELIST.IMAGETYPE" = "Si las imágenes se dibujan como imágenes (`itImage`) o como sus máscaras (`itMask`)."
"RIMAGELIST.INSERTBMPFILE" = "Carga un archivo de mapa de bits e inserta su imagen en la posición `Index`, con `Mask` como su color transparente."
