"RMEMORYSTREAM.TEXT" = "El texto: el contenido de un cuadro de texto o de un memo, el texto editable de una lista desplegable, los elementos de una lista uno por línea, el texto de un nodo de árbol o el contenido de un flujo."
"RMEMORYSTREAM.WRITE" = "Escribe datos: `NumBytes` de un mensaje en un socket, `Count` bytes de un flujo en un puerto serial, o una variable en un flujo."
"RMEMORYSTREAM.WRITEBINSTR" = "Escribe `bytes` bytes de la cadena de texto en el flujo."
"RMEMORYSTREAM.WRITELINE" = "Escribe texto seguido de un fin de línea. Una cadena de texto se escribe como la escribe `WriteStr`: en bytes, o en UTF-8 cuando tiene un carácter por encima de 255."
