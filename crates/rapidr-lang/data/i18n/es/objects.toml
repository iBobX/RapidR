# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/components/objects.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"RARCHIVE" = "Abre archivos zip, 7z, tar, tar.gz, .gz, .xz y .zst — el formato se reconoce por sus primeros bytes, no por su nombre —, muestra lo que contienen y lo descomprime: los bytes de un archivo en una cadena de texto o en un flujo, en un archivo, o todo en una carpeta. Crea archivos zip, tar, tar.gz y .gz. Un archivo comprimido no es confiable: MaxSize y MaxRatio detienen una bomba zip, ExtractAll nunca escribe fuera de su carpeta (un nombre con `..`, una ruta absoluta o una unidad lo detiene antes de escribir nada; los enlaces nunca se extraen), y las entradas cifradas se rechazan. Los archivos RAR se rechazan: es un formato cerrado y propietario. Cada llamada deja Error en \"\" cuando funcionó y, si no, dice por qué. Igual en el escritorio, en las compilaciones nativas y en la web (donde los archivos son los de la página). Propio de RapidR."
"RARCHIVE.ADDDATA" = "Añade una cadena de bytes como un archivo, un carácter por byte (lo que devuelve Extract)."
"RARCHIVE.ADDFILE" = "Añade un archivo (o el identificador de un recurso `$RESOURCE`) con su propio nombre, sin carpetas, o con `NameInArchive` (\"roms/game.z80\": las carpetas se escriben con `/`). Una entrada que ya tiene ese nombre se reemplaza."
"RARCHIVE.ADDFOLDER" = "Añade una carpeta del disco y todo lo que contiene, con su propio nombre o con `NameInArchive` (\"\" o \".\": su contenido en el nivel superior). No se siguen los enlaces. No disponible en un navegador (no hay carpetas allí): añade cada archivo."
"RARCHIVE.ADDSTREAM" = "Añade todos los bytes de un flujo como un archivo (esté donde esté su Position)."
"RARCHIVE.ADDTEXT" = "Añade texto como un archivo, en UTF-8 (se conservan las letras de todos los idiomas)."
"RARCHIVE.CASESENSITIVE" = "Si Find y una entrada nombrada en Extract distinguen \"Game.Z80\" de \"game.z80\" (False de forma predeterminada: ambas formas la encuentran)."
"RARCHIVE.CLOSE" = "Escribe el archivo comprimido que iniciaron Create o CreateStream (en su archivo o flujo) y libera uno abierto. True cuando funcionó."
"RARCHIVE.COMPRESSEDSIZE" = "El tamaño comprimido de una entrada, en bytes (las entradas de un .tar.gz comparten un solo flujo: su tamaño)."
"RARCHIVE.COUNT" = "Cuántas entradas (archivos y carpetas) contiene el archivo comprimido abierto, o el que se está creando; 0 si no hay ninguno."
"RARCHIVE.CREATE" = "Empieza un archivo comprimido nuevo, que se escribe en el archivo al ejecutar Close: su formato es la extensión del archivo (.zip, .tar, .tar.gz o .tgz, .gz) o el parámetro `Format` (\"zip\", \"tar\", \"tar.gz\", \"gzip\"). Las entradas se añaden con AddFile, AddText, AddData, AddStream y AddFolder; un .gz contiene un solo archivo."
"RARCHIVE.CREATESTREAM" = "Empieza un archivo comprimido nuevo (un zip, salvo que el parámetro `Format` indique otro) que se escribe en un flujo al ejecutar Close, en su Position."
"RARCHIVE.DATETIME" = "Cuándo se cambió por última vez la entrada, en hora local, como \"2026-10-29 14:05:00\" (se ordena como texto); \"\" cuando el archivo comprimido no lo indica."
"RARCHIVE.ERROR" = "Por qué falló la última llamada, en palabras sencillas (no es un archivo comprimido, una bomba zip, un nombre fuera de la carpeta, cifrado, dañado); \"\" cuando funcionó."
"RARCHIVE.EXTRACT" = "Los bytes de una entrada como una cadena de texto, un carácter por byte (LEN es su tamaño; ASC(MID$(…)) un byte; el WriteBinStr de un flujo la vuelve a escribir). \"\" con Error establecido cuando no puede: una carpeta da \"\" y ningún error."
"RARCHIVE.EXTRACTALL" = "Descomprime todo en una carpeta (que se crea si hace falta; los archivos que ya estén allí se reemplazan). Primero se comprueba cada nombre y se descomprime todo, así que un nombre que saldría de la carpeta (`..`, una ruta absoluta, una unidad, un dispositivo), una entrada cifrada o una bomba zip no escribe nada; los enlaces y los dispositivos nunca se extraen, y nunca se escribe a través de un enlace que ya esté en la carpeta. True cuando funcionó."
"RARCHIVE.EXTRACTTEXT" = "Una entrada como texto: UTF-8 (sin la marca de orden de bytes) cuando lo es y, si no, un carácter por byte."
"RARCHIVE.EXTRACTTOFILE" = "Escribe una entrada en el archivo que indiques (reemplazando uno que ya esté allí); el archivo se escribe solo cuando toda la entrada está descomprimida y comprobada. True cuando funcionó."
"RARCHIVE.EXTRACTTOSTREAM" = "Escribe los bytes de una entrada en un flujo, en su Position (como hace WriteBinStr), y deja Position después de ellos. True cuando funcionó."
"RARCHIVE.FILENAME" = "El archivo que abrió Open o que crea Create; \"\" para un flujo, unos datos o un recurso."
"RARCHIVE.FIND" = "El índice (0 el primero) de la entrada con este nombre (las carpetas con `/` o `\\`; \"Roms/Game.z80\" encuentra \"roms/game.z80\" salvo que CaseSensitive sea True); -1 cuando no hay ninguna."
"RARCHIVE.FORMAT" = "El formato del archivo comprimido abierto, según sus primeros bytes: \"zip\", \"7z\", \"tar\", \"tar.gz\", \"gzip\" (un archivo), \"tar.xz\", \"xz\", \"tar.zst\", \"zstd\"; o el del que se está creando; \"\" si no hay ninguno."
"RARCHIVE.FORMATOF" = "Qué es un archivo, según sus primeros bytes, sin abrirlo: \"zip\", \"7z\", \"tar\", \"gzip\", \"xz\", \"zstd\", \"rar\", \"bzip2\" …, o \"\" cuando no es un archivo comprimido (una instantánea .z80, una imagen, un texto). Así un programa trata igual un .z80 que un archivo comprimido que contiene uno."
"RARCHIVE.ISENCRYPTED" = "Es True cuando la entrada está protegida con una contraseña: RArchive la muestra en la lista pero no la descomprime."
"RARCHIVE.ISFOLDER" = "Es True cuando la entrada es una carpeta."
"RARCHIVE.LEVEL" = "Cuánto comprime Create: 0 solo almacena (lo más rápido), 9 da el tamaño más pequeño; 6 de forma predeterminada."
"RARCHIVE.MAXRATIO" = "Lo máximo que puede crecer una entrada de más de 1 MB al descomprimirse (tamaño descomprimido ÷ tamaño comprimido): los archivos reales rara vez pasan de 100, una bomba zip llega a miles. 0: sin comprobación de proporción (MaxSize sigue valiendo)."
"RARCHIVE.MAXSIZE" = "Lo máximo a lo que puede descomprimirse un archivo comprimido: una entrada, todo lo de ExtractAll, un .tar.gz completo en Open; también lo máximo que puede contener un archivo comprimido que se está creando. 1 GB de forma predeterminada (256 MB en un navegador). Pasarse es un error, no una memoria llena: una bomba zip se detiene aquí."
"RARCHIVE.NAME" = "El nombre de una entrada, con las carpetas que la preceden separadas por `/` (\"roms/game.z80\"); \"\" para un índice fuera de 0 … Count - 1. Una entrada se indica por su índice o por su nombre, aquí y en los demás métodos de entradas."
"RARCHIVE.OPEN" = "Abre un archivo comprimido (o un recurso `$RESOURCE` incluido en el programa: su identificador), diga lo que diga su extensión. True cuando se abrió; False cuando no es un archivo comprimido que RapidR lea, está dañado o cifrado (Error dice cuál). Un .gz, .xz o .zst que contiene un archivo es un archivo comprimido de una sola entrada."
"RARCHIVE.OPENDATA" = "Abre el archivo comprimido que está en una cadena de bytes (un carácter por byte: lo que da una descarga o ReadBinStr)."
"RARCHIVE.OPENSTREAM" = "Abre el archivo comprimido que contiene un flujo (todo, esté donde esté su Position): uno descargado en un flujo de memoria, o el de un flujo de archivo."
"RARCHIVE.SIZE" = "El tamaño descomprimido de una entrada, en bytes, según indica el archivo comprimido (Extract comprueba el real)."
"RBITMAP" = "Una imagen en memoria para dibujar en ella y con ella: carga y guarda imágenes, dibuja con los métodos del lienzo."
"RBITMAP.BMP" = "La imagen que se muestra, a partir del nombre de un archivo .BMP; en un botón, su glifo."
"RBITMAP.BMPHANDLE" = "Establece la imagen a partir de un identificador de recurso (`$RESOURCE`) en lugar de un archivo; solo escritura."
"RBITMAP.BRUSHCOLOR" = "El color de relleno que usan los métodos de dibujo, como &HBBGGRR (el atajo de RapidR para el pincel)."
"RBITMAP.CIRCLE" = "Dibuja la elipse que cabe en el recuadro de (`x1`, `y1`) a (`x2`, `y2`), sin contar los bordes derecho e inferior: su contorno en el color `c` y su interior en el color `fill`."
"RBITMAP.COPYMODE" = "Cómo `Draw` y `CopyRect` combinan el origen con lo que ya hay: una de las operaciones de trama `cmXXX` (`cmSrcCopy` copia)."
"RBITMAP.COPYRECT" = "Copia el rectángulo `S` de otra imagen o lienzo en el rectángulo `D` de esta, escalándolo para que encaje."
"RBITMAP.DRAW" = "Dibuja un mapa de bits con su esquina superior izquierda en (`x`, `y`); una lista de imágenes DirectX dibuja allí su imagen `Item`."
"RBITMAP.EMPTY" = "Distinto de cero cuando la tabla de datos no tiene filas, o el mapa de bits no contiene ninguna imagen; solo lectura."
"RBITMAP.FILLRECT" = "Rellena el rectángulo (`x1`, `y1`)–(`x2`, `y2`) con el color `c`."
"RBITMAP.FONT" = "La fuente del texto, un RFont; al asignar una, se copia."
"RBITMAP.FONTCOLOR" = "El atajo de RapidR para `Font.Color`: el color del texto, como &HBBGGRR."
"RBITMAP.FONTNAME" = "En un cuadro de diálogo de fuente o en un RFont, el nombre de una fuente instalada, `FontName(i)` desde 0; en los demás, el atajo de RapidR para `Font.Name`."
"RBITMAP.FONTSIZE" = "El atajo de RapidR para `Font.Size`, en puntos."
"RBITMAP.GETPIXELS" = "Lee un bloque de la imagen en un arreglo con una sola llamada: los `Width` x `Height` píxeles con la esquina superior izquierda en (`X`, `Y`), fila por fila, en los primeros `Width * Height` elementos de `Pixels` (un arreglo INTEGER o LONG: los colores necesitan 24 bits). Con `SetPixels` sirve para hacer un filtro de imagen: leer, cambiar los números, volver a ponerlos. El bloque debe quedar dentro de la imagen."
"RBITMAP.HANDLE" = "El identificador de la ventana (o de otro objeto del sistema), para llamadas a la API y para componentes que lo reciben."
"RBITMAP.HEIGHT" = "La altura, en píxeles; en `Screen`, la de la pantalla."
"RBITMAP.LINE" = "Dibuja una línea desde (`x1`, `y1`) hasta (`x2`, `y2`) con el color `c`."
"RBITMAP.LOADFROMFILE" = "Carga el contenido del componente desde un archivo: texto, elementos, celdas de la cuadrícula, nodos del árbol o una imagen."
"RBITMAP.LOADFROMSTREAM" = "Carga el contenido del componente desde un flujo abierto."
"RBITMAP.LOADICON" = "Carga uno de los íconos propios de RapidR (un nombre de ícono como \"run\", un tipo de componente, un id de comando), de Size píxeles de lado (16 si se omite), con los colores del tema actual o los de Theme; nítido en cualquier escala de pantalla."
"RBITMAP.MONOCHROME" = "Distinto de cero para un mapa de bits en blanco y negro."
"RBITMAP.PAINT" = "Rellena el área alrededor de (`x`, `y`) con el color `c`, hasta el color `borderc` que la limita."
"RBITMAP.PENCOLOR" = "El color de línea que usan los métodos de dibujo, como &HBBGGRR (el atajo de RapidR para el lápiz)."
"RBITMAP.PIXEL" = "El color de un píxel, `Pixel(x, y)`, como &HBBGGRR."
"RBITMAP.PIXELFORMAT" = "Los bits por píxel del mapa de bits (`pf1bit` … `pf32bit`); `pfDevice` sigue a la pantalla."
"RBITMAP.PSET" = "Pinta el píxel en (`x`, `y`) con el color `c`."
"RBITMAP.RECTANGLE" = "Dibuja el contorno del rectángulo de (`x1`, `y1`) a (`x2`, `y2`) en el color `c`, sin incluir los bordes derecho e inferior (los últimos píxeles dibujados son `x2 - 1`, `y2 - 1`); su interior queda como estaba. El método `FillRect` rellena uno."
"RBITMAP.ROTATE" = "Gira toda la imagen `Angle` grados en sentido antihorario alrededor del píxel (`xOrigin`, `yOrigin`), conservando su tamaño: cada píxel toma el más cercano que gira hasta él, y los píxeles a los que no llega ninguno toman el color que tenía antes el píxel de la esquina superior izquierda."
"RBITMAP.ROUNDRECT" = "Dibuja el rectángulo de (`x1`, `y1`) a (`x2`, `y2`), sin incluir los bordes derecho e inferior, con las esquinas redondeadas por una elipse de `x3` de ancho y `y3` de alto, relleno en el color `c`."
"RBITMAP.SAVETOFILE" = "Guarda el contenido del componente en un archivo: texto, elementos, celdas de la tabla, nodos del árbol o una imagen."
"RBITMAP.SAVETOSTREAM" = "Escribe el contenido del componente en un flujo abierto."
"RBITMAP.SETPIXELS" = "Pone en la imagen un bloque entero de colores con una sola llamada, desde un arreglo: los `Width` x `Height` colores de `Pixels`, fila por fila desde su primer elemento (en un arreglo de una dimensión, el elemento `y * Width + x` es el píxel (x, y); un arreglo de dos dimensiones `(Height - 1, Width - 1)` es `Pixels(y, x)`), con la esquina superior izquierda del bloque en (`X`, `Y`), o en 0, 0 si se omite. Los colores son los números que toma `Pset` (`RGB(r, g, b)`, con el rojo en el byte bajo). Es la forma rápida de dibujar una imagen a partir de datos —la memoria de video de un emulador, un filtro de imagen, un mapa de calor, un juego de la vida—: una sola llamada hace el trabajo de `Width * Height` llamadas a `Pset` (una pantalla de 256 x 192 en mucho menos de un milisegundo, no en 70). El bloque debe quedar dentro de la imagen y `Pixels` debe tener suficientes valores; si no, el programa se detiene con un mensaje que dice cuál de las dos cosas ocurrió."
"RBITMAP.SETPIXELS8" = "Como `SetPixels`, pero el arreglo contiene números de paleta: cada uno de los `Width` x `Height` elementos de `Indexes` (de 0 a 255, un arreglo BYTE) elige un color de `Palette` (un arreglo de colores, `RGB(r, g, b)`; su primer elemento es el color 0): una búsqueda por píxel, en Rust, como funcionan la memoria de pantalla y la paleta de una máquina retro. La esquina superior izquierda del bloque está en (`X`, `Y`), o en 0, 0 si se omite. Un índice que la paleta no tiene detiene el programa con un mensaje que nombra el píxel."
"RBITMAP.SMOOTH" = "Si `StretchDraw` y `CopyRect` mezclan los colores al escalar. False (el valor predeterminado, y como siempre se ha dibujado una copia escalada) toma el píxel más cercano: bordes nítidos, adecuado para pixel art, la pantalla de un emulador, un código QR. True mezcla los cuatro píxeles que rodean a cada uno (bilineal): suave, adecuado para fotografías."
"RBITMAP.STRETCHDRAW" = "Dibuja el mapa de bits `BMP` escalado para llenar el rectángulo `Rect` (sin sus bordes derecho e inferior). RapidR también acepta el rectángulo como cuatro números: `StretchDraw x, y, w, h, BMP` lo dibuja en (`x`, `y`), con `w` de ancho y `h` de alto. Cada píxel del resultado toma el píxel más cercano de `BMP`: nítido, como lo quieren el pixel art y la pantalla de un emulador, y en una sola pasada rápida por las filas (una imagen de 256 x 192 al doble de su tamaño en una fracción de milisegundo). Con `Smooth` en True se mezclan en su lugar los cuatro píxeles que lo rodean."
"RBITMAP.TEXTHEIGHT" = "Devuelve la altura en píxeles del texto con la fuente actual."
"RBITMAP.TEXTOUT" = "Escribe `S` con su esquina superior izquierda en (`x`, `y`), en el color `fc` sobre un fondo del color `bc`."
"RBITMAP.TEXTRECT" = "Escribe el texto `S` en (`x`, `y`) con el color `fc` como lo hace TextOut, pero solo se muestra la parte que queda dentro de `Rect` (sin sus bordes derecho e inferior); un color de fondo `bc` rellena primero todo `Rect`, y -1 deja lo que hay."
"RBITMAP.TEXTWIDTH" = "Devuelve el ancho en píxeles del texto con la fuente actual."
"RBITMAP.TOP" = "La distancia al borde superior del contenedor (en un formulario: el de la pantalla), en píxeles."
"RBITMAP.TRANSPARENT" = "Deja que lo que está detrás se vea a través del fondo (en una imagen, de los píxeles de `TransparentColor`)."
"RBITMAP.TRANSPARENTCOLOR" = "El color que se dibuja transparente, como &HBBGGRR."
"RBITMAP.TRANSPARENTMODE" = "0 toma el color transparente del píxel inferior izquierdo del mapa de bits; 1 usa `TransparentColor`."
"RBITMAP.WIDTH" = "El ancho, en píxeles; en `Screen`, el de la pantalla."
"RFILESTREAM" = "Un archivo abierto para leer y escribir: líneas, números, cadenas de texto, arreglos y UDT, en una Position que mueve Seek."
"RFILESTREAM.CLOSE" = "Cierra lo que el componente tiene abierto: un formulario, un archivo, un puerto, un dispositivo, una conexión o una base de datos."
"RFILESTREAM.COPYFROM" = "Copia `Bytes` bytes de otro flujo en este."
"RFILESTREAM.DOWNLOAD" = "Guarda el texto del flujo en la computadora de quien usa el programa como una descarga del navegador, con el nombre que indica `FileName`."
"RFILESTREAM.EOF" = "Distinto de cero cuando la posición de lectura está al final del flujo; solo lectura."
"RFILESTREAM.EXTRACTRES" = "Escribe en el flujo el recurso incrustado número `Resource` del programa."
"RFILESTREAM.FILENAME" = "El archivo elegido en un cuadro de diálogo (con su carpeta), o el archivo que el objeto lee o escribe."
"RFILESTREAM.HANDLE" = "El identificador de la ventana (o de otro objeto del sistema), para llamadas a la API y para componentes que lo reciben."
"RFILESTREAM.LINECOUNT" = "El número de líneas de texto (en un árbol, de nodos)."
"RFILESTREAM.LOADARRAY" = "Lee del flujo los elementos de un arreglo."
"RFILESTREAM.LOADFROMURL" = "Obtiene el texto de una URL y lo pone en el flujo; se produce un evento cuando ha llegado."
"RFILESTREAM.LOADUDTARRAY" = "Lee todos los elementos de un campo de arreglo de un TYPE (`Mem.LoadUDTArray(t.Items)`) desde Position, dispuestos como están en la memoria los campos del TYPE; el flujo debe contenerlos todos."
"RFILESTREAM.OPEN" = "Abre aquello con lo que trabaja el componente: un archivo o dispositivo multimedia, un flujo de archivo en un modo, un puerto serial, el portapapeles o un socket que escucha en un puerto."
"RFILESTREAM.PICKFILE" = "Abre el selector de archivos del navegador y lee el archivo elegido en el flujo; un filtro opcional como `.txt` limita la elección."
"RFILESTREAM.POSITION" = "Dónde está ahora: el valor de una barra de progreso, de desplazamiento o deslizante, la posición de un flujo en bytes, o la posición de reproducción de un sonido o de un objeto multimedia."
"RFILESTREAM.READ" = "Lee datos: hasta `NumBytes` de un socket (se devuelven), `Count` bytes de un puerto serial a un flujo, o la cantidad que ocupa una variable, de un flujo a la variable."
"RFILESTREAM.READALL" = "Devuelve el resto del flujo como texto."
"RFILESTREAM.READALLTEXT" = "Devuelve el resto del flujo como texto: UTF-8 (sin la marca de orden de bytes) cuando lo es y, si no, Windows-1252, el texto ANSI de los programas más antiguos. `ReadAll` y `ReadStr` devuelven bytes, un carácter cada uno, como en los programas más antiguos."
"RFILESTREAM.READBINSTR" = "Lee `n` bytes del flujo y los devuelve como una cadena de texto."
"RFILESTREAM.READBYTE" = "Lee un byte en Position (26, la marca de fin de archivo de DOS, pasado el final)."
"RFILESTREAM.READLINE" = "Lee una línea de texto, sin su fin de línea."
"RFILESTREAM.READLN" = "Lee una línea de texto, sin su fin de línea. Igual que `ReadLine`."
"RFILESTREAM.READNUM" = "Lee un número guardado en binario según el tipo indicado (`Num_Byte`, `Num_Long`, `Num_Double` …)."
"RFILESTREAM.READSTR" = "Lee `n` caracteres del flujo."
"RFILESTREAM.READUDT" = "Lee del flujo una variable de un tipo propio (UDT), campo por campo."
"RFILESTREAM.SAVEARRAY" = "Escribe en el flujo los elementos de un arreglo."
"RFILESTREAM.SAVEUDTARRAY" = "Escribe todos los elementos de un campo de arreglo de un TYPE (`Mem.SaveUDTArray(t.Items)`) en Position, dispuestos como están en la memoria los campos del TYPE."
"RFILESTREAM.SEEK" = "Mueve la posición actual: la de un flujo a `Position` desde su inicio, su lugar actual o su final; la de un reproductor a un tiempo en segundos."
"RFILESTREAM.SIZE" = "Un tamaño: de una fuente, en puntos; de un archivo, flujo, sonido o descarga, en bytes; de un arreglo, su número de valores."
"RFILESTREAM.TEXT" = "El texto: el contenido de un cuadro de texto o de un memo, el texto editable de una lista desplegable, los elementos de una lista uno por línea, el texto de un nodo de árbol o el contenido de un flujo."
"RFILESTREAM.WRITE" = "Escribe datos: `NumBytes` de un mensaje en un socket, `Count` bytes de un flujo en un puerto serial, o una variable en un flujo."
"RFILESTREAM.WRITEBINSTR" = "Escribe `bytes` bytes de la cadena de texto en el flujo."
"RFILESTREAM.WRITEBYTE" = "Escribe un byte (los 8 bits bajos del valor) en Position."
"RFILESTREAM.WRITELINE" = "Escribe texto seguido de un fin de línea. Una cadena de texto se escribe como la escribe `WriteStr`: en bytes, o en UTF-8 cuando tiene un carácter por encima de 255."
"RFILESTREAM.WRITELN" = "Escribe texto seguido de un fin de línea. Igual que `WriteLine`."
"RFILESTREAM.WRITENUM" = "Escribe un número en binario, de `bytes` bytes de longitud."
"RFILESTREAM.WRITESTR" = "Escribe `bytes` caracteres de la cadena de texto en el flujo (`WriteStr(S, LEN(S))` escribe todo S). Una cadena de caracteres de hasta 255 se escribe como bytes, uno por carácter, como en los programas más antiguos; una cadena con cualquier otro carácter (chino, emoji …) se escribe completa como UTF-8. Usa `WriteText` para escribir UTF-8 sea lo que sea que contenga la cadena."
"RFILESTREAM.WRITETEXT" = "Escribe la cadena de texto como texto UTF-8, sea lo que sea que contenga (acentos, chino, emoji). `WriteStr` escribe una cadena de caracteres de hasta 255 como bytes, como en los programas más antiguos, y una con cualquier otro carácter como su UTF-8."
"RFILESTREAM.WRITEUDT" = "Escribe en el flujo una variable de un tipo propio (UDT), campo por campo."
"RFONT" = "Una fuente (nombre, tamaño, color, negrita, cursiva …) para dar a los componentes y al dibujo."
"RFONT.ADDSTYLES" = "Activa los estilos de fuente indicados (negrita, cursiva, subrayado, tachado)."
"RFONT.BOLD" = "True para una fuente en negrita."
"RFONT.CHARSET" = "El juego de caracteres para el que está hecha la fuente (`DEFAULT_CHARSET` …)."
"RFONT.COLOR" = "El color de fondo, como &HBBGGRR o un color de sistema `clXXX`; en un cuadro de diálogo de color o de fuente, el color elegido."
"RFONT.DELSTYLES" = "Desactiva los estilos de fuente indicados."
"RFONT.FONTCOUNT" = "El número de fuentes instaladas; solo lectura."
"RFONT.FONTNAME" = "En un cuadro de diálogo de fuente o en un RFont, el nombre de una fuente instalada, `FontName(i)` desde 0; en los demás, el atajo de RapidR para `Font.Name`."
"RFONT.HANDLE" = "El identificador de la ventana (o de otro objeto del sistema), para llamadas a la API y para componentes que lo reciben."
"RFONT.ITALIC" = "True para una fuente en cursiva."
"RFONT.NAME" = "El nombre de la fuente (`Arial`); en un joystick, el nombre del dispositivo."
"RFONT.PITCH" = "`fpFixed` para una fuente monoespaciada, `fpVariable` para una proporcional, `fpDefault` para cualquiera de las dos."
"RFONT.SIZE" = "Un tamaño: de una fuente, en puntos; de un archivo, flujo, sonido o descarga, en bytes; de un arreglo, su número de valores."
"RFONT.STRIKEOUT" = "True para una fuente tachada."
