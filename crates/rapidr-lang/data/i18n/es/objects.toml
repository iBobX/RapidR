"RIMAGELIST.WIDTH" = "El ancho, en píxeles; en `Screen`, el de la pantalla."
"RJSON" = "Analiza y construye JSON: obtiene y establece valores por ruta con puntos, lista claves, da formato legible, carga y guarda archivos. Los registros de su documento ([{…}, …], JSON Lines o columnas) son también una fuente de datos: el Source de un RDataFrame, o el conjunto de datos de un RDBGrid o de un RDataSource. Propio de RapidR."
