"RMEMORYSTREAM.MEMCOPYTO" = "Copia Bytes bytes desde Position hasta Address (el VARPTR de una variable, de un elemento o de un TYPE); Position avanza Bytes."
"RMEMORYSTREAM.POINTER" = "La dirección de la memoria del flujo; solo lectura."
"RMEMORYSTREAM.POSITION" = "Dónde está ahora: el valor de una barra de progreso, de desplazamiento o deslizante, la posición de un flujo en bytes, o la posición de reproducción de un sonido o de un objeto multimedia."
