"RPROGRESSBAR.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RPROGRESSBAR.POPUPMENU" = "El menú emergente que se muestra cuando la persona hace clic derecho en el control."
