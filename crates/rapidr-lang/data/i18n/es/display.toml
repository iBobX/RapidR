"RIMAGE.ICON" = "El ícono (el nombre de un archivo .ICO) de la ventana, de la aplicación o de la imagen."
"RIMAGE.INCREMENTALDISPLAY" = "Muestra una imagen grande poco a poco mientras se carga."
"RIMAGE.LEFT" = "La distancia al borde izquierdo del contenedor (en un formulario: el de la pantalla), en píxeles."
"RIMAGE.LINE" = "Dibuja una línea desde (`x1`, `y1`) hasta (`x2`, `y2`) con el color `c`."
"RIMAGE.LOAD" = "Carga un archivo de imagen (BMP, PNG, JPEG, ICO, SVG), o una imagen incluida en el programa con `$RESOURCE` (su nombre: `Image.Load MY_ICON`). Un SVG dibujado con los tokens de color de íconos de RapidR o con `currentColor` toma los colores del tema y los sigue cuando este cambia. Igual que `LoadFromFile`."
"RIMAGE.LOADFROMFILE" = "Carga un archivo de imagen (BMP, PNG, JPEG, ICO, SVG), o un recurso `$RESOURCE` por su nombre; un SVG con los tokens de color de RapidR o con `currentColor` sigue el tema (ver Load)."
"RIMAGE.LOADFROMPLOT" = "Muestra como imagen el gráfico de un RPlot."
"RIMAGE.MAXHEIGHT" = "La altura máxima del control, en píxeles; 0 para no tener límite. También `Constraints.MaxHeight`."
"RIMAGE.MAXWIDTH" = "El ancho máximo del control, en píxeles; 0 para no tener límite. También `Constraints.MaxWidth`."
"RIMAGE.MINHEIGHT" = "La altura mínima del control, en píxeles; 0 para no tener límite. También `Constraints.MinHeight`."
"RIMAGE.MINWIDTH" = "El ancho mínimo del control, en píxeles, sea quien sea que lo cambie de tamaño (el programa, Align, Anchors, la persona); 0 para no tener límite. También `Constraints.MinWidth`."
"RIMAGE.ONCLICK" = "Se produce cuando la persona hace clic en el control (o presiona su atajo, o Space o Enter en un botón con el foco)."
"RIMAGE.ONDBLCLICK" = "Se produce cuando la persona hace doble clic en el control (en una superficie de diseño: el componente diseñado Index)."
"RIMAGE.ONMOUSEDOWN" = "Se produce cuando se presiona un botón del mouse sobre el control (Button: `mbLeft`, `mbRight` o `mbMiddle`; X, Y: dentro del control; Shift: el estado de las teclas)."
"RIMAGE.ONMOUSEMOVE" = "Se produce cuando el mouse se mueve sobre el control (X, Y: dentro del control; Shift: los botones y teclas presionados)."
"RIMAGE.ONMOUSEUP" = "Se produce cuando se suelta un botón del mouse sobre el control (Button: `mbLeft`, `mbRight` o `mbMiddle`; X, Y: dentro del control; Shift: el estado de las teclas)."
"RIMAGE.PAINT" = "Rellena un área a partir de (`x`, `y`) con el color `c` hasta el color de borde `borderc`."
"RIMAGE.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RIMAGE.PENCOLOR" = "El color de línea que usan los métodos de dibujo, como &HBBGGRR (el atajo de RapidR para el lápiz)."
"RIMAGE.PIXEL" = "El color de un píxel, `Pixel(x, y)`, como &HBBGGRR."
"RIMAGE.POPUPMENU" = "El menú emergente que se muestra cuando la persona hace clic derecho en el control."
"RIMAGE.PSET" = "Pinta el píxel en (`x`, `y`) con el color `c`."
"RIMAGE.RECTANGLE" = "Dibuja el contorno del rectángulo (`x1`, `y1`)–(`x2`, `y2`) con el color `c`."
"RIMAGE.REPAINT" = "Vuelve a mostrar la imagen."
"RIMAGE.ROTATE" = "Gira toda la imagen `Angle` grados en sentido antihorario alrededor del píxel (`xOrigin`, `yOrigin`), conservando su tamaño: cada píxel toma el más cercano que gira hasta él, y los píxeles a los que no llega ninguno toman el color que tenía antes el píxel de la esquina superior izquierda."
"RIMAGE.ROUNDRECT" = "Dibuja un rectángulo (`x1`, `y1`)–(`x2`, `y2`) con las esquinas redondeadas por una elipse de `x3` de ancho y `y3` de alto, con el color `c`."
"RIMAGE.SAVETOFILE" = "Guarda el contenido del componente en un archivo: texto, elementos, celdas de la tabla, nodos del árbol o una imagen."
"RIMAGE.SETPIXELS" = "Pone en la imagen un bloque entero de colores con una sola llamada, desde un arreglo: los `Width` x `Height` colores de `Pixels`, fila por fila desde su primer elemento (en un arreglo de una dimensión, el elemento `y * Width + x` es el píxel (x, y); un arreglo de dos dimensiones `(Height - 1, Width - 1)` es `Pixels(y, x)`), con la esquina superior izquierda del bloque en (`X`, `Y`), o en 0, 0 si se omite. Los colores son los números que toma `Pset` (`RGB(r, g, b)`, con el rojo en el byte bajo). Es la forma rápida de dibujar una imagen a partir de datos —la memoria de video de un emulador, un filtro de imagen, un mapa de calor, un juego de la vida—: una sola llamada hace el trabajo de `Width * Height` llamadas a `Pset` (una pantalla de 256 x 192 en mucho menos de un milisegundo, no en 70). El bloque debe quedar dentro de la imagen y `Pixels` debe tener suficientes valores; si no, el programa se detiene con un mensaje que dice cuál de las dos cosas ocurrió."
"RIMAGE.SETPIXELS8" = "Como `SetPixels`, pero el arreglo contiene números de paleta: cada uno de los `Width` x `Height` elementos de `Indexes` (de 0 a 255, un arreglo BYTE) elige un color de `Palette` (un arreglo de colores, `RGB(r, g, b)`; su primer elemento es el color 0): una búsqueda por píxel, en Rust, como funcionan la memoria de pantalla y la paleta de una máquina retro. La esquina superior izquierda del bloque está en (`X`, `Y`), o en 0, 0 si se omite. Un índice que la paleta no tiene detiene el programa con un mensaje que nombra el píxel."
"RIMAGE.SHOWHINT" = "Muestra la sugerencia `Hint` cuando el mouse se detiene sobre el control; en `Application`, activa o desactiva todas las sugerencias."
"RIMAGE.SMOOTH" = "Si `StretchDraw` y `CopyRect` mezclan los colores al escalar. False (el valor predeterminado, y como siempre se ha dibujado una copia escalada) toma el píxel más cercano: bordes nítidos, adecuado para pixel art, la pantalla de un emulador, un código QR. True mezcla los cuatro píxeles que rodean a cada uno (bilineal): suave, adecuado para fotografías."
"RIMAGE.STRETCH" = "Estira la imagen para llenar el control."
"RIMAGE.STRETCHDRAW" = "Dibuja el mapa de bits `BMP` escalado para llenar el rectángulo `Rect` (sin sus bordes derecho e inferior). RapidR también acepta el rectángulo como cuatro números: `StretchDraw x, y, w, h, BMP` lo dibuja en (`x`, `y`), con `w` de ancho y `h` de alto. Cada píxel del resultado toma el píxel más cercano de `BMP`: nítido, como lo quieren el pixel art y la pantalla de un emulador, y en una sola pasada rápida por las filas (una imagen de 256 x 192 al doble de su tamaño en una fracción de milisegundo). Con `Smooth` en True se mezclan en su lugar los cuatro píxeles que lo rodean."
"RIMAGE.TAG" = "Un número para uso propio del programa; RapidR nunca lo lee."
"RIMAGE.TEXTHEIGHT" = "Devuelve la altura en píxeles del texto con la fuente actual."
"RIMAGE.TEXTOUT" = "Escribe el texto `S` en (`x`, `y`) con el color `fc` sobre el fondo `bc` (-1: transparente), con la fuente actual."
"RIMAGE.TEXTRECT" = "Escribe el texto `S` en (`x`, `y`) con el color `fc` como lo hace TextOut, pero solo se muestra la parte que queda dentro de `Rect` (sin sus bordes derecho e inferior); un color de fondo `bc` rellena primero todo `Rect`, y -1 deja lo que hay."
