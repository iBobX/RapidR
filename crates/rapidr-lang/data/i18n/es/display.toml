"RIMAGE.FONTSIZE" = "El atajo de RapidR para `Font.Size`, en puntos."
"RIMAGE.GETPIXELS" = "Lee un bloque de la imagen en un arreglo con una sola llamada: los `Width` x `Height` píxeles con la esquina superior izquierda en (`X`, `Y`), fila por fila, en los primeros `Width * Height` elementos de `Pixels` (un arreglo INTEGER o LONG: los colores necesitan 24 bits). Con `SetPixels` sirve para hacer un filtro de imagen: leer, cambiar los números, volver a ponerlos. El bloque debe quedar dentro de la imagen."
