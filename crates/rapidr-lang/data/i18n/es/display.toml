# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/components/display.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"RCANVAS" = "Una superficie para dibujar: líneas, formas, texto e imágenes, que por lo general se vuelven a dibujar en su controlador de eventos OnPaint."
"RCANVAS.ACCESSIBLEDESCRIPTION" = "Una descripción más larga que un lector de pantalla da después del nombre (qué hace el control, un atajo)."
"RCANVAS.ACCESSIBLEHIDDEN" = "True: el control es decoración —un punto parpadeante, un adorno— y un lector de pantalla lo omite (sigue en la ventana, para los ojos). Nunca lo establezcas en nada que una persona pueda usar o necesite leer."
"RCANVAS.ACCESSIBLENAME" = "Cómo llama un lector de pantalla al control, cuando su título o texto no basta (un botón de imagen, un campo de edición sin etiqueta)."
"RCANVAS.ALIGN" = "Dónde se acopla el control en su contenedor: una de las constantes `alXXX`. `alNone` conserva su propio lugar; `alClient` llena lo que dejan los demás controles acoplados."
"RCANVAS.ANCHORS" = "Los bordes de su contenedor a los que el control mantiene su distancia cuando el contenedor cambia de tamaño: akLeft + akTop (el valor predeterminado) no se mueve; añade akRight / akBottom para estirarlo."
"RCANVAS.BRUSHCOLOR" = "El color de relleno que usan los métodos de dibujo, como &HBBGGRR (el atajo de RapidR para el pincel)."
"RCANVAS.CIRCLE" = "Dibuja la elipse que cabe en el cuadro de (`x1`, `y1`) a (`x2`, `y2`), sin incluir los bordes derecho e inferior: su contorno en el color `c` y su interior en el color `fill`. `Circle(cx, cy, r [, c])` (con tres o cuatro argumentos) dibuja el contorno de un círculo alrededor de un centro."
"RCANVAS.CLIENTHEIGHT" = "La altura del área dentro de los bordes (y de la barra de título y el menú de un formulario), en píxeles; en `Screen`, la del área de trabajo, sin la barra de tareas."
"RCANVAS.CLIENTWIDTH" = "El ancho del área dentro de los bordes, en píxeles; en `Screen`, el del área de trabajo, sin la barra de tareas."
"RCANVAS.CLS" = "Borra el lienzo usando el Color actual."
"RCANVAS.COLOR" = "El color de fondo, como &HBBGGRR o un color de sistema `clXXX`; en un cuadro de diálogo de color o de fuente, el color elegido."
"RCANVAS.COPYMODE" = "Cómo `Draw` y `CopyRect` combinan el origen con lo que ya hay: una de las operaciones de trama `cmXXX` (`cmSrcCopy` copia)."
"RCANVAS.COPYRECT" = "Copia el rectángulo `S` de otra imagen o lienzo en el rectángulo `D` de esta, escalándolo para que encaje."
"RCANVAS.CURSOR" = "El puntero del mouse que se muestra sobre el control: una de las constantes `crXXX`."
"RCANVAS.DRAW" = "Dibuja un mapa de bits con su esquina superior izquierda en (`x`, `y`); una lista de imágenes DirectX dibuja allí su imagen `Item`."
"RCANVAS.DRAWTEXT" = "Dibuja texto en (x, y). Argumento de color opcional (entero RGB)."
"RCANVAS.ELLIPSE" = "Dibuja una elipse en el recuadro (`x1`, `y1`)–(`x2`, `y2`) de un color, con relleno cuando sigue un color de relleno."
"RCANVAS.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RCANVAS.FILLCIRCLE" = "Dibuja un círculo relleno."
"RCANVAS.FILLRECT" = "Rellena un rectángulo de (x1,y1) a (x2,y2). Color de relleno opcional."
"RCANVAS.FONT" = "La fuente del texto, un RFont; al asignar una, se copia."
"RCANVAS.FONTCOLOR" = "El atajo de RapidR para `Font.Color`: el color del texto, como &HBBGGRR."
"RCANVAS.FONTNAME" = "En un cuadro de diálogo de fuente o en un RFont, el nombre de una fuente instalada, `FontName(i)` desde 0; en los demás, el atajo de RapidR para `Font.Name`."
"RCANVAS.FONTSIZE" = "El atajo de RapidR para `Font.Size`, en puntos."
"RCANVAS.GET" = "No toma nada, no dibuja ni guarda nada, y devuelve 0; un Put posterior no recupera los píxeles."
"RCANVAS.GETPIXELS" = "Lee un bloque de la imagen en un arreglo con una sola llamada: los `Width` x `Height` píxeles con la esquina superior izquierda en (`X`, `Y`), fila por fila, en los primeros `Width * Height` elementos de `Pixels` (un arreglo INTEGER o LONG: los colores necesitan 24 bits). Con `SetPixels` sirve para hacer un filtro de imagen: leer, cambiar los números, volver a ponerlos. El bloque debe quedar dentro de la imagen."
"RCANVAS.HANDLE" = "El identificador de la ventana (o de otro objeto del sistema), para llamadas a la API y para componentes que lo reciben."
"RCANVAS.HEIGHT" = "La altura, en píxeles; en `Screen`, la de la pantalla."
"RCANVAS.HIDE" = "Hace invisible el componente o formulario; sigue cargado."
"RCANVAS.HINT" = "La sugerencia que se muestra cuando el mouse se detiene sobre el control (con `ShowHint`)."
"RCANVAS.LEFT" = "La distancia al borde izquierdo del contenedor (en un formulario: el de la pantalla), en píxeles."
"RCANVAS.LINE" = "Dibuja una línea."
"RCANVAS.MAXHEIGHT" = "La altura máxima del control, en píxeles; 0 para no tener límite. También `Constraints.MaxHeight`."
"RCANVAS.MAXWIDTH" = "El ancho máximo del control, en píxeles; 0 para no tener límite. También `Constraints.MaxWidth`."
"RCANVAS.MINHEIGHT" = "La altura mínima del control, en píxeles; 0 para no tener límite. También `Constraints.MinHeight`."
"RCANVAS.MINWIDTH" = "El ancho mínimo del control, en píxeles, sea quien sea que lo cambie de tamaño (el programa, Align, Anchors, la persona); 0 para no tener límite. También `Constraints.MinWidth`."
"RCANVAS.ONCLICK" = "Se produce cuando la persona hace clic en el control (o presiona su atajo, o Space o Enter en un botón con el foco)."
"RCANVAS.ONDBLCLICK" = "Se produce cuando la persona hace doble clic en el control (en una superficie de diseño: el componente diseñado Index)."
"RCANVAS.ONMOUSEDOWN" = "Se produce cuando se presiona un botón del mouse sobre el control (Button: `mbLeft`, `mbRight` o `mbMiddle`; X, Y: dentro del control; Shift: el estado de las teclas)."
"RCANVAS.ONMOUSEMOVE" = "Se produce cuando el mouse se mueve sobre el control (X, Y: dentro del control; Shift: los botones y teclas presionados)."
"RCANVAS.ONMOUSEUP" = "Se produce cuando se suelta un botón del mouse sobre el control (Button: `mbLeft`, `mbRight` o `mbMiddle`; X, Y: dentro del control; Shift: el estado de las teclas)."
"RCANVAS.ONPAINT" = "Se produce cuando hay que volver a dibujar el control; lo que se dibuja aquí sobrevive a que lo cubran, a los cambios de tamaño y a los cambios de tema."
"RCANVAS.PAINT" = "Rellena un área a partir de (`x`, `y`) con el color `c` hasta el color de borde `borderc`."
"RCANVAS.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RCANVAS.PENCOLOR" = "El color de línea que usan los métodos de dibujo, como &HBBGGRR (el atajo de RapidR para el lápiz)."
"RCANVAS.PENWIDTH" = "El ancho de las líneas que dibujan los métodos de dibujo, en píxeles."
"RCANVAS.PIXEL" = "El color de un píxel, `Pixel(x, y)`, como &HBBGGRR."
"RCANVAS.POPUPMENU" = "El menú emergente que se muestra cuando la persona hace clic derecho en el control."
"RCANVAS.PSET" = "Pinta el píxel en (`x`, `y`) con el color `c`."
"RCANVAS.PUT" = "No toma nada, no dibuja nada y devuelve 0."
"RCANVAS.RECT" = "Dibuja el contorno de un rectángulo. Igual que `Rectangle`."
"RCANVAS.RECTANGLE" = "Dibuja el contorno del rectángulo de (`x1`, `y1`) a (`x2`, `y2`) en el color `c`, sin incluir los bordes derecho e inferior (los últimos píxeles dibujados son `x2 - 1`, `y2 - 1`); su interior queda como estaba. El método `FillRect` rellena uno."
"RCANVAS.REFRESH" = "Vuelve a dibujar el componente de inmediato; en MySQL, vacía las tablas o cachés del servidor que indica `RefreshFlags`."
"RCANVAS.REPAINT" = "Vuelve a dibujar el componente."
"RCANVAS.ROTATE" = "Gira toda la imagen `Angle` grados en sentido antihorario alrededor del píxel (`xOrigin`, `yOrigin`), conservando su tamaño: cada píxel toma el más cercano que gira hasta él, y los píxeles a los que no llega ninguno toman el color que tenía antes el píxel de la esquina superior izquierda."
"RCANVAS.ROUNDRECT" = "Dibuja el rectángulo de (`x1`, `y1`) a (`x2`, `y2`), sin incluir los bordes derecho e inferior, con las esquinas redondeadas por una elipse de `x3` de ancho y `y3` de alto, relleno en el color `c`."
"RCANVAS.SETFONT" = "Establece la fuente que usan las llamadas posteriores a DrawText. En el entorno de ejecución web equivale a ctx.font = \"<size>px <family>\". Tamaño predeterminado: 12."
"RCANVAS.SETPIXEL" = "Pone un píxel de un color. Igual que `Pset`."
"RCANVAS.SETPIXELS" = "Pone en la imagen un bloque entero de colores con una sola llamada, desde un arreglo: los `Width` x `Height` colores de `Pixels`, fila por fila desde su primer elemento (en un arreglo de una dimensión, el elemento `y * Width + x` es el píxel (x, y); un arreglo de dos dimensiones `(Height - 1, Width - 1)` es `Pixels(y, x)`), con la esquina superior izquierda del bloque en (`X`, `Y`), o en 0, 0 si se omite. Los colores son los números que toma `Pset` (`RGB(r, g, b)`, con el rojo en el byte bajo). Es la forma rápida de dibujar una imagen a partir de datos —la memoria de video de un emulador, un filtro de imagen, un mapa de calor, un juego de la vida—: una sola llamada hace el trabajo de `Width * Height` llamadas a `Pset` (una pantalla de 256 x 192 en mucho menos de un milisegundo, no en 70). El bloque debe quedar dentro de la imagen y `Pixels` debe tener suficientes valores; si no, el programa se detiene con un mensaje que dice cuál de las dos cosas ocurrió."
"RCANVAS.SETPIXELS8" = "Como `SetPixels`, pero el arreglo contiene números de paleta: cada uno de los `Width` x `Height` elementos de `Indexes` (de 0 a 255, un arreglo BYTE) elige un color de `Palette` (un arreglo de colores, `RGB(r, g, b)`; su primer elemento es el color 0): una búsqueda por píxel, en Rust, como funcionan la memoria de pantalla y la paleta de una máquina retro. La esquina superior izquierda del bloque está en (`X`, `Y`), o en 0, 0 si se omite. Un índice que la paleta no tiene detiene el programa con un mensaje que nombra el píxel."
"RCANVAS.SHOW" = "Muestra el componente o formulario; un objeto de ciencia de datos imprime su contenido."
"RCANVAS.SHOWHINT" = "Muestra la sugerencia `Hint` cuando el mouse se detiene sobre el control; en `Application`, activa o desactiva todas las sugerencias."
"RCANVAS.SMOOTH" = "Si `StretchDraw` y `CopyRect` mezclan los colores al escalar. False (el valor predeterminado, y como siempre se ha dibujado una copia escalada) toma el píxel más cercano: bordes nítidos, adecuado para pixel art, la pantalla de un emulador, un código QR. True mezcla los cuatro píxeles que rodean a cada uno (bilineal): suave, adecuado para fotografías."
"RCANVAS.STRETCHDRAW" = "Dibuja el mapa de bits `BMP` escalado para llenar el rectángulo `Rect` (sin sus bordes derecho e inferior). RapidR también acepta el rectángulo como cuatro números: `StretchDraw x, y, w, h, BMP` lo dibuja en (`x`, `y`), con `w` de ancho y `h` de alto. Cada píxel del resultado toma el píxel más cercano de `BMP`: nítido, como lo quieren el pixel art y la pantalla de un emulador, y en una sola pasada rápida por las filas (una imagen de 256 x 192 al doble de su tamaño en una fracción de milisegundo). Con `Smooth` en True se mezclan en su lugar los cuatro píxeles que lo rodean."
"RCANVAS.TAG" = "Un número para uso propio del programa; RapidR nunca lo lee."
"RCANVAS.TEXTHEIGHT" = "Devuelve la altura en píxeles del texto con la fuente actual."
"RCANVAS.TEXTOUT" = "Escribe el texto `S` en (`x`, `y`) con el color `fc` sobre el fondo `bc` (-1: transparente), con la fuente actual."
"RCANVAS.TEXTRECT" = "Escribe el texto `S` en (`x`, `y`) con el color `fc` como lo hace TextOut, pero solo se muestra la parte que queda dentro de `Rect` (sin sus bordes derecho e inferior); un color de fondo `bc` rellena primero todo `Rect`, y -1 deja lo que hay."
"RCANVAS.TEXTWIDTH" = "Devuelve el ancho en píxeles del texto con la fuente actual."
"RCANVAS.TOP" = "La distancia al borde superior del contenedor (en un formulario: el de la pantalla), en píxeles."
"RCANVAS.UPDATE" = "Pone al día el componente: lo vuelve a dibujar, vuelve a listar sus archivos o vuelve a leer el estado de su dispositivo."
"RCANVAS.VISIBLE" = "Si el control o formulario se muestra."
"RCANVAS.WIDTH" = "El ancho, en píxeles; en `Screen`, el de la pantalla."
"RDESIGNSURFACE" = "El diseñador de formularios de RapidR: coloca componentes en una cuadrícula, permite seleccionarlos, moverlos y cambiarles el tamaño, y conserva sus propiedades. El IDE está construido sobre él."
"RDESIGNSURFACE.ACCESSIBLEDESCRIPTION" = "Una descripción más larga que un lector de pantalla da después del nombre (qué hace el control, un atajo)."
"RDESIGNSURFACE.ACCESSIBLEHIDDEN" = "True: el control es decoración —un punto parpadeante, un adorno— y un lector de pantalla lo omite (sigue en la ventana, para los ojos). Nunca lo establezcas en nada que una persona pueda usar o necesite leer."
"RDESIGNSURFACE.ACCESSIBLENAME" = "Cómo llama un lector de pantalla al control, cuando su título o texto no basta (un botón de imagen, un campo de edición sin etiqueta)."
"RDESIGNSURFACE.ADDCOMPONENT" = "Añade un componente nuevo de Type en (X, Y) del interior del formulario, dentro del panel, el cuadro de grupo o el cuadro de desplazamiento que haya allí, con su tamaño predeterminado, con un nombre formado por el tipo y un número (Button1, Button2 …), y lo escribe en Source como un bloque CREATE. X e Y con -1 lo ponen en un lugar libre del contenedor seleccionado (Enter sobre un elemento de la caja de herramientas). Devuelve su índice, o -1 cuando no puede ir allí. (AddComponent(Type, Name, X, Y, W, H), la forma anterior, añade a un diseñador sin código fuente.)"
"RDESIGNSURFACE.ADDFORM" = "Añade un formulario a un archivo que no tiene ninguno (o que ya tiene otro): CREATE Name AS QFORM con un Caption y el tamaño inicial habitual, y la línea que lo muestra (Name.ShowModal), escritos al final del código como un solo paso de deshacer; después el diseñador lo diseña. Name \"\" toma Form1, Form2 … el que el archivo no use. Devuelve el nombre del formulario (\"\": no se pudo añadir)."
"RDESIGNSURFACE.ADDMDICHILD" = "Una ventana secundaria para el RFormMDI que se diseña (sus hijos son componentes que muestra en ventanas secundarias): un panel en el formulario MDI con nombre de formulario (Form2), y `Main.AddChild(Form2.Handle, \"Form2\", 0, 0, 0, 0, 0, 1)` escrito después del formulario, un solo paso de deshacer. Su nombre; \"\" cuando el formulario no es una ventana principal MDI."
"RDESIGNSURFACE.ALIGNSELECTION" = "Alinea los componentes seleccionados con el primero seleccionado: \"left\", \"center\", \"right\", \"top\", \"middle\" o \"bottom\" (un solo paso de deshacer)."
"RDESIGNSURFACE.ANCHORS" = "Los bordes de su contenedor a los que el control mantiene su distancia cuando el contenedor cambia de tamaño: akLeft + akTop (el valor predeterminado) no se mueve; añade akRight / akBottom para estirarlo."
"RDESIGNSURFACE.ARRANGE" = "El menú Formato aplicado a la selección, un solo paso de deshacer: \"left\", \"center\", \"right\", \"top\", \"middle\", \"bottom\" (con respecto al primero seleccionado), \"samewidth\", \"sameheight\", \"samesize\", \"spaceh\", \"spacev\" (espacios iguales), \"centerh\", \"centerv\" (en su contenedor), \"front\", \"back\"."
"RDESIGNSURFACE.CANREDO" = "Si Redo tiene un cambio que volver a hacer."
"RDESIGNSURFACE.CANUNDO" = "Si Undo tiene un cambio que deshacer."
"RDESIGNSURFACE.CLEARALL" = "Quita todos los componentes de la superficie de diseño."
"RDESIGNSURFACE.COMPCOUNT" = "El número de componentes de la superficie de diseño."
"RDESIGNSURFACE.COPYSELECTION" = "Guarda los componentes seleccionados para Paste y devuelve sus bloques CREATE como texto, para el portapapeles."
"RDESIGNSURFACE.COUNT" = "Cuántos elementos contiene: elementos de lista, nodos de árbol, cadenas de texto, elementos de menú, imágenes, entradas JSON o componentes diseñados."
"RDESIGNSURFACE.CREATEHANDLER" = "La SUB que atiende el Event del componente Name (\"\": su evento predeterminado): la que nombra su bloque CREATE o, si no, una nueva escrita con los parámetros del evento y conectada (un solo paso de deshacer). Devuelve el nombre de la SUB; HandlerLine dice dónde está."
"RDESIGNSURFACE.CUTSELECTION" = "CopySelection y después DeleteSelection."
"RDESIGNSURFACE.DELETESELECTION" = "Elimina los componentes seleccionados (un solo paso de deshacer)."
"RDESIGNSURFACE.DRAGCOMPONENT" = "Empieza a arrastrar un componente nuevo de Type que viene de otro lugar, al presionar el mouse en una caja de herramientas: mientras el botón sigue presionado, cualquier superficie de diseño sobre la que pase el mouse muestra dónde iría, y al soltarlo allí se añade (como AddComponent). Soltarlo en cualquier otro lugar no hace nada."
"RDESIGNSURFACE.DUPLICATE" = "Copia los componentes seleccionados junto a ellos mismos, a un paso de cuadrícula de distancia."
"RDESIGNSURFACE.EDITCAPTION" = "Edita en su lugar el Caption (o Text) del componente seleccionado, sobre el componente; F2 o un segundo clic, más lento, sobre él hace lo mismo (un doble clic crea su controlador de eventos). Enter lo escribe en el código (un solo paso de deshacer), Escape sale de la edición. En un elemento de menú el editor tiene un segundo campo, su ShortCut (Tab pasa a él; las teclas que presiones allí son el atajo). True si la selección tiene un texto que editar."
"RDESIGNSURFACE.EDITING" = "Si se está editando un texto en su lugar (EditCaption, F2, un clic lento, el Escribir aquí del editor de menús)."
"RDESIGNSURFACE.EDITMENU" = "El editor de menús: selecciona el menú principal del formulario —añadiendo un QMAINMENU cuando no tiene ninguno— para que su barra muestre Escribir aquí, donde un clic (o escribir) añade un elemento directamente."
"RDESIGNSURFACE.FORMCAPTION" = "El título del formulario que se diseña."
"RDESIGNSURFACE.FORMNAME" = "El nombre del formulario que se diseña (\"\" cuando el código fuente no crea ninguno). Al establecerlo, se diseña en su lugar ese formulario del código fuente."
"RDESIGNSURFACE.FORMNAMES" = "Los formularios que el código fuente crea en su nivel superior, uno por línea y en orden: un archivo puede crear varios (`CREATE Form AS RForm`, `CREATE NewForm AS RForm` …). Establece FormName para diseñar otro, o usa SelectName con uno de sus nombres."
"RDESIGNSURFACE.FORMTYPE" = "El tipo del formulario diseñado tal como lo escribe su CREATE (`RForm`, `QFORMMDI` …); \"\" cuando no hay formulario."
"RDESIGNSURFACE.GETCOMPH" = "Devuelve la altura del componente que está en el índice indicado en la superficie de diseño."
"RDESIGNSURFACE.GETCOMPW" = "Devuelve el ancho del componente que está en el índice indicado en la superficie de diseño."
"RDESIGNSURFACE.GETCOMPX" = "Devuelve la posición izquierda del componente que está en el índice indicado en la superficie de diseño."
"RDESIGNSURFACE.GETCOMPY" = "Devuelve la posición superior del componente que está en el índice indicado en la superficie de diseño."
"RDESIGNSURFACE.GETNAME" = "Devuelve el nombre del componente que está en el índice indicado en la superficie de diseño."
"RDESIGNSURFACE.GETPROP" = "Devuelve el valor de una propiedad del componente que está en un índice de la superficie de diseño: `GetProp(Index, Name)`."
"RDESIGNSURFACE.GETTYPE" = "Devuelve el tipo del componente que está en el índice indicado en la superficie de diseño."
"RDESIGNSURFACE.GRIDSIZE" = "El paso de la cuadrícula, en píxeles."
"RDESIGNSURFACE.GUIDES" = "Las guías inteligentes que se ven mientras se arrastra un componente, en palabras: el tipo de cada una (edge, centre, baseline, margin, spacing N), su eje (x para una línea vertical, y para una horizontal) y dónde está, separadas por comas (\"edge x 112, baseline y 30\"); vacío cuando no se ve ninguna."
"RDESIGNSURFACE.HANDLERLINE" = "La línea (desde 0) de la SUB que dio el último CreateHandler: adonde va el cursor del editor de código."
"RDESIGNSURFACE.HEIGHT" = "La altura, en píxeles; en `Screen`, la de la pantalla."
"RDESIGNSURFACE.HIDE" = "Hace invisible el componente o formulario; sigue cargado."
"RDESIGNSURFACE.LEFT" = "La distancia al borde izquierdo del contenedor (en un formulario: el de la pantalla), en píxeles."
"RDESIGNSURFACE.MAXHEIGHT" = "La altura máxima del control, en píxeles; 0 para no tener límite. También `Constraints.MaxHeight`."
"RDESIGNSURFACE.MAXWIDTH" = "El ancho máximo del control, en píxeles; 0 para no tener límite. También `Constraints.MaxWidth`."
"RDESIGNSURFACE.MINHEIGHT" = "La altura mínima del control, en píxeles; 0 para no tener límite. También `Constraints.MinHeight`."
"RDESIGNSURFACE.MINWIDTH" = "El ancho mínimo del control, en píxeles, sea quien sea que lo cambie de tamaño (el programa, Align, Anchors, la persona); 0 para no tener límite. También `Constraints.MinWidth`."
"RDESIGNSURFACE.ONBGCLICK" = "Se produce cuando se presiona el fondo vacío de la superficie de diseño (X, Y: dónde); después no queda nada seleccionado."
"RDESIGNSURFACE.ONCHANGE" = "El formulario diseñado cambió (después de sus eventos OnSourceEdit)."
"RDESIGNSURFACE.ONDBLCLICK" = "Se produce cuando la persona hace doble clic en el control (en una superficie de diseño: el componente diseñado Index)."
"RDESIGNSURFACE.ONMOVE" = "Se produce cuando se movió o se cambió el tamaño de un componente diseñado en la superficie de diseño (Index, y sus nuevos X, Y, W, H)."
"RDESIGNSURFACE.ONSELECT" = "Se seleccionó un componente (al presionarlo, con Tab, al añadirlo); -1: nada, el propio formulario."
"RDESIGNSURFACE.ONSOURCEEDIT" = "El diseñador cambió Source: el texto de (StartLine, StartCol) a (EndLine, EndCol) se reemplaza por Text (líneas y columnas desde 0, columnas en caracteres). Las ediciones de un cambio llegan en orden, cada una sobre el texto tal como lo dejaron las anteriores: aplicadas en el editor de código una por una, este vuelve a contener Source."
"RDESIGNSURFACE.ONSOURCESTEP" = "Siguen los eventos OnSourceEdit de un cambio: un paso del historial de deshacer del archivo o, si Continues es True, parte del paso anterior (un texto escrito justo después de añadir el componente). Un editor de código que lleva el historial los agrupa así."
"RDESIGNSURFACE.ONUNDO" = "Con SharedUndo, se pidió Undo (Redo False) o Redo (True) en el diseñador: deshazlo en el editor que lleva el historial del archivo y luego establece Source de nuevo."
"RDESIGNSURFACE.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
