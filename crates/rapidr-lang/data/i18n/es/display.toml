"RPROGRESS.TAG" = "Un número para uso propio del programa; RapidR nunca lo lee."
"RPROGRESS.TOP" = "La distancia al borde superior del contenedor (en un formulario: el de la pantalla), en píxeles."
"RPROGRESS.VISIBLE" = "Si el control o formulario se muestra."
"RPROGRESS.WIDTH" = "El ancho, en píxeles; en `Screen`, el de la pantalla."
"RPROGRESSBAR" = "El indicador: muestra el progreso entre Min y Max según Position como una barra, un gráfico circular, una aguja o el porcentaje."
"RPROGRESSBAR.ACCESSIBLEDESCRIPTION" = "Una descripción más larga que un lector de pantalla da después del nombre (qué hace el control, un atajo)."
"RPROGRESSBAR.ACCESSIBLEHIDDEN" = "True: el control es decoración —un punto parpadeante, un adorno— y un lector de pantalla lo omite (sigue en la ventana, para los ojos). Nunca lo establezcas en nada que una persona pueda usar o necesite leer."
"RPROGRESSBAR.ACCESSIBLENAME" = "Cómo llama un lector de pantalla al control, cuando su título o texto no basta (un botón de imagen, un campo de edición sin etiqueta)."
"RPROGRESSBAR.ALIGN" = "Dónde se acopla el control en su contenedor: una de las constantes `alXXX`. `alNone` conserva su propio lugar; `alClient` llena lo que dejan los demás controles acoplados."
"RPROGRESSBAR.ANCHORS" = "Los bordes de su contenedor a los que el control mantiene su distancia cuando el contenedor cambia de tamaño: akLeft + akTop (el valor predeterminado) no se mueve; añade akRight / akBottom para estirarlo."
"RPROGRESSBAR.BACKCOLOR" = "El color de la parte sin llenar del indicador, como &HBBGGRR."
"RPROGRESSBAR.BORDERSTYLE" = "El borde: una de las constantes `bsXXX`. En un formulario, `bsSizeable` permite a la persona cambiar su tamaño, `bsDialog` no, `bsNone` no tiene barra de título."
"RPROGRESSBAR.COLOR" = "El color de fondo, como &HBBGGRR o un color de sistema `clXXX`; en un cuadro de diálogo de color o de fuente, el color elegido."
"RPROGRESSBAR.CURSOR" = "El puntero del mouse que se muestra sobre el control: una de las constantes `crXXX`."
"RPROGRESSBAR.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RPROGRESSBAR.FONT" = "La fuente del texto, un RFont; al asignar una, se copia."
"RPROGRESSBAR.FORECOLOR" = "El color de la parte llena del indicador, como &HBBGGRR."
"RPROGRESSBAR.HEIGHT" = "La altura, en píxeles; en `Screen`, la de la pantalla."
"RPROGRESSBAR.HINT" = "La sugerencia que se muestra cuando el mouse se detiene sobre el control (con `ShowHint`)."
"RPROGRESSBAR.KIND" = "Qué es: la forma de un indicador (`gkHorizontalBar`, `gkPie` …), el tipo predefinido de un botón (`bkOK` da el texto, el glifo y ModalResult), la dirección de una barra de desplazamiento."
"RPROGRESSBAR.LEFT" = "La distancia al borde izquierdo del contenedor (en un formulario: el de la pantalla), en píxeles."
