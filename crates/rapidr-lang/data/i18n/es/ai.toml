# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/components/ai.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"RAI" = "Una conversación con un proveedor de IA: Anthropic (Claude), OpenAI, DeepSeek o cualquier servidor compatible con OpenAI, como Ollama o LM Studio en la propia computadora de la persona. El método Ask envía una pregunta; la respuesta llega poco a poco (OnToken), luego OnMessage y OnDone; Cancel la detiene. ReplyLanguage = \"auto\" mantiene las respuestas en el idioma de la persona; una solicitud que no llegó al proveedor (sin red por un momento) se intenta una vez más por sí sola. El modelo es uno de los que da la lista del propio proveedor (RefreshModels, Models, OnModelsLoaded): no se elige ninguno por ti. La clave de API nunca está en el programa: APIKeySource dice dónde se guarda (\"keychain:NAME\" en el llavero del sistema operativo, \"env:VARIABLE\" o \"ask\": el programa se la pide a la persona, OnKeyNeeded, y establece APIKey); una página web la guarda solo para la pestaña. Cada respuesta tiene un límite (MaxTokens); una conversación larga se resume para que cueste poco; InputTokens, OutputTokens y Usage la miden. El asistente de RapidR Studio también es un componente RAI, con las herramientas del proyecto conectadas (AttachComponent)."
"RAI.ACTIVITY" = "Lo que está haciendo ahora, en palabras, mientras Busy es True: \"Thinking\", \"Writing the answer\", lo que hace una herramienta conectada (\"Reading main.rr\", \"Reading the help of RListBox\", \"Writing server.rr (+318 lines)\", \"Checking (compiling)\", \"Searching the manual\"), \"Fixing 2 problems\" después de que una comprobación los encontró, \"Continuing (part 2)\" después de que una respuesta llegó a su límite de longitud, \"Compacting the conversation\" o \"Summarising the chat to keep it short\"; \"\" cuando está inactivo. OnUpdate se produce cuando cambia."
"RAI.ANSWER" = "El texto de la última respuesta."
"RAI.APIKEY" = "La clave de API, establecida en tiempo de ejecución (escrita por la persona, leída de tu propio almacén): se guarda solo en la memoria, nunca se muestra ni se lee de vuelta (KeyHint da sus últimos cuatro caracteres); RememberKey la guarda en el llavero. Si se escribe en el inspector de RapidR Studio, se guarda en tu llavero y APIKeySource la nombra: la clave misma nunca se escribe en el programa."
"RAI.APIKEYSOURCE" = "De dónde viene la clave cuando APIKey no está establecida: \"keychain:NAME\" (la entrada NAME del llavero del sistema operativo; en la web, la sesión de la pestaña o el dispositivo), \"env:VARIABLE\" (una variable de entorno; no en la web), \"ask\" (OnKeyNeeded: el programa se la pide a la persona); varias separadas por | se prueban en orden (\"keychain:MyApp/OpenAI|env:OPENAI_API_KEY|ask\"). Las entradas del llavero de cada programa son propias (se guardan bajo el servicio de llavero propio del programa, rapidr-app:<program>:RAI): un programa nunca lee las claves de RapidR Studio (\"RapidR Studio/…\"; Error lo dice) ni las de otro programa."
"RAI.ASK" = "Envía Text, con la conversación hasta ahora, al Model de Provider y vuelve de inmediato: la respuesta llega poco a poco (OnToken), luego OnMessage con toda ella y OnDone. False si no puede preguntar (sin proveedor, clave o modelo: Error dice cuál; sin clave se produce OnKeyNeeded)."
"RAI.ATTACHCOMPONENT" = "Da al modelo las herramientas de un componente del tipo Kind (el \"project\" de un RAIProjectTools: el asistente de RapidR Studio). True si se conectó; Error dice por qué no."
"RAI.AUDIT" = "True: cada solicitud, llamada a una herramienta y decisión se escribe en el registro de auditoría local (AuditLog lo lee; nunca una clave ni el contenido de un archivo)."
"RAI.AUDITLOCATION" = "Dónde se guarda el registro de auditoría (un archivo en la carpeta de configuración del usuario; en la web, el almacenamiento del navegador para la página)."
"RAI.AUDITLOG" = "Las últimas Count líneas del registro de auditoría (50 por defecto), la más antigua primero, separadas por tabulaciones: la hora, qué pasó, su objetivo y la decisión o el resultado."
"RAI.BASEURL" = "Dónde está la API del proveedor: al leerla da la del propio proveedor, a menos que se haya establecido otra; establécela para un servidor compatible con OpenAI (\"http://localhost:11434/v1\" para Ollama, \"http://localhost:1234/v1\" para LM Studio) o para un proxy que guarda la clave en un servidor."
"RAI.BUSY" = "True mientras se ejecuta una solicitud (una respuesta, la lista de modelos)."
"RAI.CACHEDTOKENS" = "De InputTokens, los que el proveedor leyó de su caché (se cobran mucho menos)."
"RAI.CANCEL" = "Detiene la respuesta que se está escribiendo (lo que llegó hasta ahora se queda) o la lista de modelos que se está obteniendo: OnDone(\"cancelled\")."
"RAI.CHATSTATE" = "La conversación como JSON — sus mensajes, su transcripción, sus preguntas, el razonamiento de las respuestas, el idioma de la persona — para guardarla (en un archivo, en una base de datos) y restablecerla más tarde, en esta ejecución o en la siguiente: al establecerla se reemplaza la conversación (una respuesta que se está escribiendo se detiene). Las claves de API y los tokens que contenga se quitan (\"[key removed]\"), igual que los secretos del programa. RapidR Studio guarda sus chats así."
"RAI.CODEBLOCK" = "El texto del bloque de código Index (desde 1) de las respuestas, en el orden en que Transcript los numera (sus enlaces Copy e Insert, rai:copy/Index y rai:insert/Index): un programa lo pide para copiarlo o insertarlo. \"\" si no existe ese bloque."
"RAI.COMPACT" = "Resume la conversación ahora, en una sola solicitud corta; las siguientes preguntas parten del resumen (un chat largo cuesta menos). Status dice entonces cuánto se redujo; las preguntas anteriores ya no se pueden editar. False si no puede (respondiendo, un chat corto: Error dice por qué)."
"RAI.CONTEXTLIMIT" = "Dónde se compacta la conversación por sí sola: SummaryAt, o el 70% de la ventana de contexto del modelo si es menos."
"RAI.CONTEXTTOKENS" = "El tamaño de la conversación en tokens tal como lo enviaría la siguiente pregunta (las instrucciones, las herramientas, los mensajes y la última respuesta): el de la última solicitud según lo contó el proveedor, si no una estimación. Con ContextLimit, un medidor de contexto."
"RAI.CONTEXTWINDOW" = "La ventana de contexto del modelo en tokens, cuando la lista de modelos del proveedor la indica (0 si no)."
"RAI.COST" = "El costo de la sesión, estimado a partir de PriceIn y PriceOut (\"$0.0123\"; \"\" sin precios)."
"RAI.EDITABLE" = "True: Transcript tiene un enlace Edit bajo cada pregunta (rai:edit/N) y Retry bajo la última respuesta (rai:retry), para el OnLinkClick de un RMarkdownView: el programa llama a Rewind y vuelve a preguntar. El chat de RapidR Studio."
"RAI.EFFORT" = "Cuánto piensa el modelo antes de responder: \"\" (el valor predeterminado) como suele hacerlo el modelo; \"low\", \"medium\" o \"high\" piden más razonamiento donde el proveedor lo ofrece — el pensamiento adaptativo de Anthropic con ese esfuerzo (un presupuesto de pensamiento en modelos más antiguos), un reasoning_effort en los servidores compatibles con OpenAI; los modelos de DeepSeek eligen por sí mismos. Pensar más tarda más y cuesta más: cada respuesta puede usar hasta 16,384 tokens más con \"high\". El razonamiento de la respuesta, cuando el proveedor lo muestra, está en Transcript como \"Thought for N s\" (ToggleThought lo muestra). Un modelo que no admite ninguno lo dice una vez y responde como siempre (EffortSupported)."
"RAI.EFFORTSUPPORTED" = "True si Provider y Model admiten un Effort (False para DeepSeek, y para un modelo que rechazó uno)."
"RAI.ELAPSED" = "Segundos desde que empezó la respuesta (o Compact); 0 si está inactivo. Un temporizador lo muestra avanzando."
"RAI.ERROR" = "Por qué falló la última solicitud o llamada, en palabras sencillas y con qué hacer (\"\" si funcionó)."
"RAI.FORGETKEY" = "Elimina la clave guardada bajo el NAME del llavero de APIKeySource, y la de APIKey."
"RAI.HASKEY" = "True si hay una clave: la de APIKey, o una que APIKeySource encuentra."
"RAI.INPUTTOKENS" = "Los tokens enviados en esta sesión (preguntas, instrucciones, lo que leen las herramientas)."
"RAI.KEYENV" = "La variable de entorno en la que suele estar la clave del proveedor (\"OPENAI_API_KEY\"), para APIKeySource."
"RAI.KEYHINT" = "Los últimos cuatro caracteres de la clave (\"…abcd\"): lo único que se muestra de ella."
"RAI.KEYOWNER" = "Propio de RapidR Studio: el archivo de programa cuyas claves lee y guarda este RAI (el diseñador de Studio guarda una clave escrita en la fila APIKey para el programa que se diseña). Un programa no puede establecerlo — sus claves son siempre suyas — y intentarlo solo establece Error."
"RAI.KEYSOURCE" = "De dónde viene la clave ahora: \"program\" (APIKey), \"stored\" (el llavero; en la web, este dispositivo), \"session\", \"environment\" o \"\"."
"RAI.KEYSTORE" = "Dónde está la clave en uso, en palabras (\"the macOS Keychain\", \"this browser tab, until it closes\", \"this program's memory, until it ends\"); sin clave, dónde la guarda el método RememberKey."
"RAI.KEYSURL" = "Dónde se crea una clave en el proveedor."
"RAI.LASTREQUEST" = "Lo último que se envió: el método, la URL, los encabezados (la clave nunca se muestra) y el cuerpo JSON."
"RAI.LITE" = "True cuando la última solicitud fue a un modelo de ventana pequeña (menos de 16,384 tokens): las herramientas conectadas enviaron sus instrucciones y herramientas lite, para que un modelo local pequeño pueda empezar."
"RAI.MAXPARTS" = "En cuántas partes puede venir una respuesta (5): la primera y cuatro continuaciones. Pasadas esas, RAI se detiene y lo dice, con una forma de seguir en pasos más pequeños."
"RAI.MAXTOKENS" = "Lo más larga que puede ser una respuesta, en tokens: el proveedor se detiene ahí (el límite de costo de cada respuesta). Nunca más de lo que deja la ventana de contexto del modelo: cuando la lista de modelos del proveedor da la ventana (los servidores locales lo hacen), una respuesta recibe como máximo una cuarta parte de ella, y como máximo 4,096 tokens de un servidor en esta computadora; en un servidor compatible con OpenAI que no la da, 4,096."
"RAI.MODEL" = "El modelo que responde, como lo nombra el proveedor — uno de Models (RefreshModels lista los del proveedor: no se elige ningún modelo por ti). En el diseñador de RapidR Studio la lista llega sola en cuanto el proveedor tiene una clave."
"RAI.MODELCOUNT" = "Cuántos modelos lista Models."
"RAI.MODELNAME" = "El id del modelo Index en Models (desde 0), para la elección de una lista."
"RAI.MODELS" = "Los modelos que RefreshModels encontró, uno por línea: el id, su nombre y una pista tomada de las palabras de su nombre (\"fast · low cost\" para los pequeños, \"costs more\" para los más grandes), separados por tabulaciones; los rápidos y baratos primero."
"RAI.NEEDSKEY" = "True cuando Provider necesita una clave de API (un servidor local no)."
"RAI.NEWCHAT" = "Inicia una conversación nueva: los mensajes y la transcripción se van (el uso se queda)."
"RAI.ONDONE" = "Una solicitud terminó: \"ok\", \"error\" (Error dice por qué) o \"cancelled\"."
"RAI.ONERROR" = "Una solicitud falló: Message dice por qué y qué hacer."
"RAI.ONKEYNEEDED" = "Todavía no hay clave (APIKeySource no encontró ninguna, o dice \"ask\"): pídele una a la persona y establece APIKey, luego vuelve a preguntar."
"RAI.ONMESSAGE" = "El mensaje del modelo está completo (una respuesta; antes de usar una herramienta, lo que dijo)."
"RAI.ONMODELSLOADED" = "RefreshModels encontró Count modelos: están en Models."
"RAI.ONTOKEN" = "Llegó más de la respuesta (unas pocas palabras a la vez): añádelo a lo que se muestra."
"RAI.ONUPDATE" = "Transcript cambió: una respuesta que llega, una herramienta usada, una decisión registrada."
"RAI.OUTPUTTOKENS" = "Los tokens recibidos en esta sesión."
"RAI.PART" = "En qué parte de su respuesta está RAI: 1, luego 2 … cuando una respuesta llegó a su límite de longitud y RAI siguió por sí solo (como máximo MaxParts)."
"RAI.PRESETS" = "URL base para un servidor compatible con OpenAI, una por línea: una etiqueta y la URL, separadas por una tabulación."
"RAI.PRICEIN" = "Lo que cobra el proveedor por un millón de tokens enviados (consulta sus precios: PricingURL), para Cost; 0 para no estimar."
"RAI.PRICEOUT" = "Lo que cobra el proveedor por un millón de tokens recibidos, para Cost."
"RAI.PRICINGURL" = "Los precios del proveedor (\"\" para un servidor compatible)."
"RAI.PROVIDER" = "Quién responde: \"anthropic\" (Claude), \"openai\", \"deepseek\" o \"compatible\" (un servidor compatible con OpenAI en BaseURL: Ollama, LM Studio, xAI, OpenRouter …); \"\" para ninguno. Al cambiarlo se olvidan los modelos listados y la clave que estableció el programa."
"RAI.PROVIDERS" = "Los proveedores, uno por línea: el id, el nombre y un nombre corto, separados por tabulaciones."
"RAI.QUESTIONCOUNT" = "Cuántas preguntas tiene la conversación (QuestionText y Rewind las numeran desde 1)."
"RAI.QUESTIONTEXT" = "El texto de la pregunta Question (desde 1), tal como la hizo la persona."
"RAI.QUIET" = "Segundos desde que el proveedor envió algo por última vez mientras se ejecuta una respuesta (0 si está inactivo): pasados 30, di \"No hay respuesta del modelo desde hace 30 s: espera, o presiona Detener\"."
"RAI.REFRESHMODELS" = "Le pregunta a Provider qué modelos puede usar la clave (solo los modelos de chat de OpenAI): OnModelsLoaded(Count) cuando Models los tiene, OnError cuando no — una clave rechazada, ninguna respuesta en 30 segundos (10 para conectar) … en palabras sencillas. Un Model que la lista ya no tiene se borra: elige de nuevo. Si se pide otra vez, la solicitud más nueva reemplaza a la que está en camino; cambiar Provider, BaseURL, WorkspaceID, APIKey o APIKeySource también la descarta (OnDone(\"cancelled\")). True si empezó."
"RAI.REMEMBERKEY" = "Guarda APIKey en el llavero bajo el NAME del llavero de APIKeySource, para las próximas ejecuciones. En la web se guarda para la pestaña, y también en este dispositivo cuando OnThisDevice es True (el almacenamiento de la página: cualquiera que use este perfil del navegador podría leerla). True si se guardó."
"RAI.REPLYLANGUAGE" = "El idioma en que se dan las respuestas: \"\" (el predeterminado) no dice nada al respecto — el modelo elige, como necesita un traductor; \"auto\" sigue el idioma del último mensaje de la persona (se conserva mientras un mensaje dice demasiado poco para saberlo, como \"ok\"; antes del primero, el Application.Language del programa o, si no, el del sistema), el valor del asistente de RapidR Studio; el nombre en inglés de un idioma (\"Spanish\") fija siempre ese. Cada solicitud termina diciéndolo, y el resumen de una conversación larga se escribe en ese idioma, para que un modelo nunca derive a otro."
"RAI.REWIND" = "Saca la pregunta Question (desde 1) y todo lo que sigue de la conversación y de la transcripción, y devuelve su texto — para editarlo y preguntar de nuevo, o para Retry de la última. \"\" si no puede (respondiendo; una pregunta de antes de que se compactara la conversación): Error dice por qué. Guarda antes ChatState para conservar lo que se saca."
"RAI.STATUS" = "Una frase sobre lo que está haciendo o hizo, para una línea de estado que anuncia un lector de pantalla."
"RAI.STEPS" = "Lo que hicieron las herramientas conectadas en la respuesta actual (o la última), una línea cada una (\"Read main.rr (40 lines)\"): una lista de progreso mientras trabaja."
"RAI.SUMMARYAT" = "Cuando una pregunta envía más tokens que esto, la conversación hasta ahora se resume en una sola solicitud corta (tu solicitud se conserva palabra por palabra) y las siguientes preguntas parten del resumen. 0 (el valor predeterminado): el 70% de la ventana de contexto del modelo (40,000 cuando no se conoce la ventana)."
"RAI.SYSTEM" = "Las instrucciones del programa para el modelo (su papel, su tono, lo que no debe hacer), enviadas antes de la conversación."
"RAI.TOGGLESTEPS" = "Muestra u oculta los pasos de la respuesta Index en Transcript (rai:steps/Index, el enlace \"✓ 6 steps\" bajo una respuesta terminada)."
"RAI.TOGGLETHOUGHT" = "Muestra u oculta el razonamiento de la respuesta Index en Transcript (rai:thought/Index, el enlace \"Thought for N s\")."
"RAI.TOOLCALLS" = "Cuántas llamadas a herramientas hizo la última respuesta (como máximo 25)."
"RAI.TRANSCRIPT" = "La conversación como Markdown, para un RMarkdownView: las preguntas, las respuestas a medida que llegan, los hechos que informan las herramientas conectadas como tarjetas (un pequeño encabezado cada una: un programa creado, un cambio propuesto), una línea atenuada en lugar de una respuesta que afirmó un cambio antes de que alguna herramienta lo hiciera, una línea atenuada \"Answer was long: continuing (part 2 of up to 5)\" donde una respuesta llegó a su límite de longitud y RAI siguió por sí solo (un enlace \"Continue in smaller steps\", rai:continue, si al final se detuvo), un enlace \"✓ 6 steps · show\" bajo una respuesta terminada (rai:steps/N) y, bajo cada bloque de código cerrado, enlaces \"Copy · Insert\" (rai:copy/N, rai:insert/N; Insert para código de RapidR, que se colorea como lo colorea el editor de código; se incluye un bloque sin lenguaje que parece de RapidR)."
"RAI.TURNCACHEDTOKENS" = "De TurnInputTokens, los que el proveedor leyó de su caché (se cobran mucho menos), hasta ahora en la respuesta actual (o la última)."
"RAI.TURNINPUTTOKENS" = "Los tokens enviados hasta ahora en la respuesta actual (o la última), con todas sus solicitudes: el conteo del proveedor, actualizado mientras la respuesta llega."
"RAI.TURNOUTPUTTOKENS" = "Los tokens recibidos hasta ahora en la respuesta actual (o la última): el conteo del proveedor o, mientras informa poco antes del final, una estimación a partir de los caracteres que llegaron, para que un contador junto a la respuesta avance mientras se escribe."
"RAI.USAGE" = "Los tokens de la sesión en palabras, con la estimación de Cost cuando PriceIn / PriceOut están establecidos."
"RAI.USERLANGUAGE" = "El idioma del último mensaje de la persona, como lo lee RAI (\"English\", \"Spanish\" …; se conserva mientras un mensaje dice demasiado poco para saberlo); \"\" antes de poder saberlo."
"RAI.WORKSPACEID" = "Anthropic: el espacio de trabajo en el que funciona una clave que no se creó dentro de uno (se envía como anthropic-workspace-id); \"\" para ninguno (ANTHROPIC_WORKSPACE_ID cuando está establecido)."
"RAPPHANDS" = "Las propias manos del programa: clics, escritura, teclas, arrastres y la rueda del mouse reproducidos en sus propias ventanas como lo haría una persona — por el mismo enrutamiento, así que sus controladores de eventos se ejecutan como para una persona — con un puntero visible que se desliza hasta lo que presiona (un anillo marca cada clic; con el movimiento reducido del sistema, salta). Los componentes se nombran como los encuentra una persona: su nombre, lo que muestran (\"OK\", \"7\": el Caption de un botón) o la etiqueta junto a un campo de edición (\"label:Name\"); fuerza uno con `name:`, `caption:` o `label:`. Cada llamada pone la acción en cola y devuelve su número de inmediato; OnDone(Id, Ok, Text) dice cómo salió en una frase — o lo que hay en su lugar (\"No button shows \\\"Go\\\". Buttons now: Start, Reset.\"). Solo las ventanas propias del programa: nunca se toca el mouse ni el teclado del sistema, nada fuera del programa puede serlo, y no hace falta el permiso de Accesibilidad. Úsalo para recorridos guiados y demostraciones, un botón \"muéstrame\" en la ayuda, autopruebas o macros. Un programa que se maneja solo actúa como la persona que lo usa: todo lo que hacen sus botones puede ocurrir. Las imágenes y los clics de un programa muestran y hacen lo que son los datos y los botones de las personas que lo usan: dile a las personas qué se captura, y nunca grabes ni automatices sin que lo sepan. Propio de RapidR."
"RAPPHANDS.BUSY" = "True mientras hay acciones en espera o en ejecución."
"RAPPHANDS.CANCEL" = "Descarta las acciones que aún esperan (la que se está ejecutando termina): devuelve cuántas se descartaron."
"RAPPHANDS.CLICK" = "Hace clic en Target — el nombre de un componente, lo que muestra (el Caption de un botón) o la etiqueta junto a él — como lo haría una persona: el puntero se desliza hasta ahí, presiona y suelta. Devuelve el número de la acción (OnDone dice cómo salió)."
"RAPPHANDS.CLICKAT" = "Hace clic en (X, Y) del interior de Window (el nombre o el título de un formulario; \"\" la ventana del frente), en píxeles del programa: lo que muestra un lienzo o una imagen."
"RAPPHANDS.DOUBLECLICK" = "Hace doble clic en Target (el elemento de una lista, el nombre de un archivo)."
"RAPPHANDS.DRAG" = "Presiona en Target, se mueve a (ToX, ToY) del interior de la misma ventana y suelta ahí (el marcador de un control deslizante, un divisor, algo que StartDrag mueve)."
"RAPPHANDS.ERROR" = "Por qué falló la última acción (\"\" si funcionó): qué buscaba y qué hay en su lugar."
"RAPPHANDS.HOVER" = "Mueve el puntero sobre Target y se queda un momento (su sugerencia, su aspecto al pasar el mouse)."
"RAPPHANDS.LASTRESULT" = "La frase de la última acción (lo que OnDone dijo por última vez)."
"RAPPHANDS.ONDONE" = "La acción Id terminó: Ok es True si se hizo, Text dice en una frase qué se hizo — o, cuando Ok es False, qué buscaba y qué hay en su lugar, o por qué no pudo (un botón deshabilitado, una ventana al frente que espera una respuesta)."
"RAPPHANDS.PENDING" = "Cuántas acciones esperan o se ejecutan."
"RAPPHANDS.PRESSKEYS" = "Presiona teclas — \"Enter\", \"Ctrl+S\", \"Shift+Tab\", \"Alt+F4\", \"Escape\", \"F5\", varias separadas por espacios (\"Tab Tab Enter\") — en Target (recibe el teclado) o en lo que tiene el teclado. Ctrl es la tecla de atajo en todos los sistemas (en una Mac, los atajos de Command)."
"RAPPHANDS.RIGHTCLICK" = "Hace clic derecho en Target: se abre su menú emergente, como si lo hiciera una persona."
"RAPPHANDS.SCROLL" = "Gira la rueda del mouse sobre Target: Notches muescas hacia abajo (3 si no se da ninguna), hacia arriba si es negativo."
"RAPPHANDS.SHOWCURSOR" = "El puntero que muestra lo que hace se dibuja sobre la ventana (una flecha con un punto en el color de acento del tema; un anillo en cada clic). False: las acciones ocurren de inmediato, sin verse."
"RAPPHANDS.SPEED" = "Qué tan rápido se desliza el puntero y se escribe el texto: 1 al ritmo de una persona, 2 el doble de rápido, 0 de inmediato."
"RAPPHANDS.TYPETEXT" = "Hace clic en Target (\"\": lo que tiene el teclado) y escribe Text en él, una tecla a la vez (un salto de línea es Enter); los caracteres que ninguna tecla escribe (é, 中) llegan como los da el método de entrada del sistema."
"RAPPHANDS.WAIT" = "Deja que el programa siga por su cuenta ese tiempo antes de la siguiente acción (sus temporizadores, su trabajo)."
"RWINDOWCAPTURE" = "Los propios ojos del programa: una imagen de sus ventanas tal como se ven ahora — una ventana o todas una junto a otra — guardada como PNG (un BMP cuando el nombre termina en .bmp), con la barra de título de cada ventana dibujada o sin ella, a la escala de la pantalla (nítida en una pantalla de alta resolución) o a 1× (un píxel de imagen por cada píxel del programa); y un informe de disposición de sus formularios tal como están dispuestos ahora — el nombre, el tipo, el título, el texto, la posición y el tamaño de cada componente, si se ve, si está habilitado y si tiene el teclado — con lo que una persona vería mal: un título cortado, dos controles uno encima de otro, un control que pasa el borde de su ventana. Solo las ventanas propias del programa, siempre: nunca la pantalla, el escritorio ni otro programa, así que no necesita el permiso de Grabación de pantalla. Úsalo para un comando \"guardar como imagen\", un informe de error con una imagen, páginas de ayuda hechas con el propio programa, o una autocomprobación (Problems) después de un cambio de disposición. Las herramientas de IA de RapidR Studio miran un programa en ejecución de la misma manera (app_screenshot, app_layout). Grabar un video de las ventanas llegará más adelante. Las imágenes y los clics de un programa muestran y hacen lo que son los datos y los botones de las personas que lo usan: dile a las personas qué se captura, y nunca grabes ni automatices sin que lo sepan. Propio de RapidR."
"RWINDOWCAPTURE.ERROR" = "Por qué falló la última llamada (\"\" si funcionó): no existe esa ventana (el mensaje lista las ventanas del programa), no se mostró nada, un archivo que no se puede escribir."
"RWINDOWCAPTURE.FRAME" = "Cada ventana dibujada con su marco y su barra de título (como RapidR dibuja la de una ventana en la web y en el diseñador de formularios): su título indica de qué ventana se trata. False: solo su interior (lo que guarda Form.SaveImage)."
"RWINDOWCAPTURE.HEIGHT" = "La altura de la última imagen en píxeles."
"RWINDOWCAPTURE.LAYOUTJSON" = "El mismo informe como JSON: {\"windows\": [{name, type, title, x, y, width, height, front, modal, components: [{name, type, caption, text, x, y, width, height, visible, enabled, focused, parent}], problems: […]}]} — para un programa que lo lee (RJson)."
"RWINDOWCAPTURE.LAYOUTREPORT" = "Los formularios que se muestran (o solo Window) en palabras, una línea por componente: `b7 (RButton) \"7\" at 8,60 size 56×36`, con posiciones dentro de la ventana; luego los problemas que vería una persona, o que no hay ninguno."
"RWINDOWCAPTURE.PROBLEMS" = "Solo lo que parece estar mal, un problema por línea (\"\" si nada lo parece): un título cortado, controles uno encima de otro, un control que pasa el borde de su ventana o queda fuera de ella — cada uno con sus números y qué hacer."
"RWINDOWCAPTURE.SAVETOFILE" = "Guarda una imagen de Window — el nombre de un formulario o su título — o, cuando no se da ninguno (o \"all\"), de todas las ventanas que se muestran, una junto a otra desde la de atrás hasta la del frente: un archivo PNG, un BMP cuando FileName termina en .bmp. True si se guardó; False si no (Error dice por qué). Solo las ventanas propias del programa."
"RWINDOWCAPTURE.SCALE" = "Qué tan grandes son las imágenes: 0 (el valor predeterminado) a la escala de la pantalla — nítida en una pantalla de alta resolución, el doble de los píxeles del programa en una Retina —, 1 un píxel de imagen por píxel del programa, 2 el doble …"
"RWINDOWCAPTURE.WIDTH" = "El ancho de la última imagen en píxeles."
"RWINDOWCAPTURE.WINDOWS" = "Las ventanas del programa que se muestran ahora, de atrás hacia adelante, una por línea: el nombre del formulario y su título, con un TAB en medio."
