# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/components/input.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"RBUTTON" = "Un botón: al hacer clic en él se ejecuta su controlador de eventos OnClick. Puede mostrar una imagen y ser el botón Default o Cancel del formulario."
"RBUTTON.ACCESSIBLEDESCRIPTION" = "Una descripción más larga que un lector de pantalla da después del nombre (qué hace el control, un atajo)."
"RBUTTON.ACCESSIBLEHIDDEN" = "True: el control es decoración —un punto parpadeante, un adorno— y un lector de pantalla lo omite (sigue en la ventana, para los ojos). Nunca lo establezcas en nada que una persona pueda usar o necesite leer."
"RBUTTON.ACCESSIBLENAME" = "Cómo llama un lector de pantalla al control, cuando su título o texto no basta (un botón de imagen, un campo de edición sin etiqueta)."
"RBUTTON.ALIGN" = "Dónde se acopla el control en su contenedor: una de las constantes `alXXX`. `alNone` conserva su propio lugar; `alClient` llena lo que dejan los demás controles acoplados."
"RBUTTON.ANCHORS" = "Los bordes de su contenedor a los que el control mantiene su distancia cuando el contenedor cambia de tamaño: akLeft + akTop (el valor predeterminado) no se mueve; añade akRight / akBottom para estirarlo."
"RBUTTON.BMP" = "La imagen que se muestra, a partir del nombre de un archivo .BMP; en un botón, su glifo."
"RBUTTON.BMPHANDLE" = "Establece la imagen a partir de un identificador de recurso (`$RESOURCE`) en lugar de un archivo; solo escritura."
"RBUTTON.CANCEL" = "Hace que este sea el botón que presiona la tecla Esc en su formulario."
"RBUTTON.CAPTION" = "El texto que muestra el control, o el título de una ventana o un diálogo; un `&` antes de una letra la subraya como atajo de teclado."
"RBUTTON.COLOR" = "El color de fondo, como &HBBGGRR o un color de sistema `clXXX`; en un cuadro de diálogo de color o de fuente, el color elegido."
"RBUTTON.CURSOR" = "El puntero del mouse que se muestra sobre el control: una de las constantes `crXXX`."
"RBUTTON.DEFAULT" = "Hace que este sea el botón que presiona la tecla Enter en su formulario."
"RBUTTON.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RBUTTON.FONT" = "La fuente del texto, un RFont; al asignar una, se copia."
"RBUTTON.FONTCOLOR" = "El atajo de RapidR para `Font.Color`: el color del texto, como &HBBGGRR."
"RBUTTON.FONTSIZE" = "El atajo de RapidR para `Font.Size`, en puntos."
"RBUTTON.HANDLE" = "El identificador de la ventana (o de otro objeto del sistema), para llamadas a la API y para componentes que lo reciben."
"RBUTTON.HEIGHT" = "La altura, en píxeles; en `Screen`, la de la pantalla."
"RBUTTON.HINT" = "La sugerencia que se muestra cuando el mouse se detiene sobre el control (con `ShowHint`)."
"RBUTTON.KIND" = "Qué es: la forma de un indicador (`gkHorizontalBar`, `gkPie` …), el tipo predefinido de un botón (`bkOK` da el texto, el glifo y ModalResult), la dirección de una barra de desplazamiento."
"RBUTTON.LAYOUT" = "Dónde está la imagen junto al texto: `blBMPLeft`, `blBMPRight`, `blBMPTop` o `blBMPBottom`."
"RBUTTON.LEFT" = "La distancia al borde izquierdo del contenedor (en un formulario: el de la pantalla), en píxeles."
"RBUTTON.MAXHEIGHT" = "La altura máxima del control, en píxeles; 0 para no tener límite. También `Constraints.MaxHeight`."
"RBUTTON.MAXWIDTH" = "El ancho máximo del control, en píxeles; 0 para no tener límite. También `Constraints.MaxWidth`."
"RBUTTON.MINHEIGHT" = "La altura mínima del control, en píxeles; 0 para no tener límite. También `Constraints.MinHeight`."
"RBUTTON.MINWIDTH" = "El ancho mínimo del control, en píxeles, sea quien sea que lo cambie de tamaño (el programa, Align, Anchors, la persona); 0 para no tener límite. También `Constraints.MinWidth`."
"RBUTTON.MODALRESULT" = "Lo que devuelve `ShowModal` (`mrOk` …): al establecerlo en un formulario, este se cierra; un botón lo establece en su formulario cuando se hace clic en él."
"RBUTTON.NUMBMPS" = "Cuántos glifos contiene la imagen del botón, uno junto a otro (sin presionar, deshabilitado, presionado, mantenido presionado)."
"RBUTTON.ONCLICK" = "Se produce cuando la persona hace clic en el control (o presiona su atajo, o Space o Enter en un botón con el foco)."
"RBUTTON.ONENDDRAG" = "Se produce cuando termina el arrastre que inició OnStartDrag: se soltó el mouse (en lugar de OnMouseUp y OnClick) o se presionó Escape. Sin argumentos."
"RBUTTON.ONENTER" = "Se produce cuando el componente recibe el foco del teclado: Tab o Shift+Tab, un clic, SetFocus, el atajo de su etiqueta y, en el caso del primero, cuando se muestra su formulario. Llega después del OnExit del componente que tenía el foco y antes de lo que hace un clic en él (su OnMouseDown, OnClick). Cambiar a otra ventana o aplicación y volver no lo produce."
"RBUTTON.ONEXIT" = "Se produce cuando el componente pierde el foco del teclado en favor de otro componente de su formulario (Tab, un clic, SetFocus), antes del OnEnter de ese otro: el lugar para comprobar lo que se escribió. Cambiar a otra ventana o aplicación no lo produce, ni tampoco ocultar o deshabilitar el componente."
"RBUTTON.ONKEYDOWN" = "Se produce cuando se presiona una tecla mientras el control tiene el foco (Key: el código de tecla virtual; Shift: el estado de Shift, Ctrl y Alt)."
"RBUTTON.ONKEYPRESS" = "Se produce cuando al presionar una tecla se escribe un carácter mientras el control tiene el foco (Key: el código del carácter)."
"RBUTTON.ONKEYUP" = "Se produce cuando se suelta una tecla mientras el control tiene el foco (Key: el código de tecla virtual; Shift: el estado de Shift, Ctrl y Alt)."
"RBUTTON.ONMOUSEDOWN" = "Se produce cuando se presiona un botón del mouse sobre el control (Button: `mbLeft`, `mbRight` o `mbMiddle`; X, Y: dentro del control; Shift: el estado de las teclas)."
"RBUTTON.ONMOUSEMOVE" = "Se produce cuando el mouse se mueve sobre el control (X, Y: dentro del control; Shift: los botones y teclas presionados)."
"RBUTTON.ONMOUSEUP" = "Se produce cuando se suelta un botón del mouse sobre el control (Button: `mbLeft`, `mbRight` o `mbMiddle`; X, Y: dentro del control; Shift: el estado de las teclas)."
"RBUTTON.ONSTARTDRAG" = "Al asignarle un controlador, el botón se convierte en origen de arrastre: presionar el botón izquierdo sobre él inicia un arrastre — esto se produce en lugar de OnMouseDown, y el mouse muestra el puntero de “no soltar” (nada acepta lo que se suelta) — hasta que se suelta o se presiona Escape, que producen OnEndDrag. Sin argumentos."
"RBUTTON.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RBUTTON.POPUPMENU" = "El menú emergente que se muestra cuando la persona hace clic derecho en el control."
"RBUTTON.REFRESH" = "Vuelve a dibujar el componente de inmediato; en MySQL, vacía las tablas o cachés del servidor que indica `RefreshFlags`."
"RBUTTON.REPAINT" = "Vuelve a dibujar el componente."
"RBUTTON.SETFOCUS" = "Da el foco del teclado al componente."
"RBUTTON.SHOWHINT" = "Muestra la sugerencia `Hint` cuando el mouse se detiene sobre el control; en `Application`, activa o desactiva todas las sugerencias."
"RBUTTON.SPACING" = "El espacio entre la imagen del botón y su texto, en píxeles."
"RBUTTON.STARTDRAG" = "Mueve el control con el mouse mientras se mantiene presionado un botón — llámalo desde OnMouseDown: vuelve cuando se suelta el botón, con Left y Top donde la persona lo dejó, y no sigue ningún OnMouseUp ni OnClick (el movimiento propio de una ventana en Windows). Escape lo devuelve a su lugar; sin ningún botón presionado no pasa nada."
"RBUTTON.TABORDER" = "El lugar del control en el orden de la tecla Tab entre los controles de su contenedor, desde 0."
"RBUTTON.TAG" = "Un número para uso propio del programa; RapidR nunca lo lee."
"RBUTTON.TOP" = "La distancia al borde superior del contenedor (en un formulario: el de la pantalla), en píxeles."
"RBUTTON.VISIBLE" = "Si el control o formulario se muestra."
"RBUTTON.WIDTH" = "El ancho, en píxeles; en `Screen`, el de la pantalla."
"RBUTTON.WNDPROC" = "Un controlador de mensajes de Windows (Hwnd, Msg, wParam, lParam). El de un formulario recibe los mensajes de su ventana en Windows, y los de su ícono de la bandeja del sistema en otros sistemas; el de un control se acepta y nunca se llama (los de un RButton, REdit, RPanel, RLabel, RComboBox y RListBox no reciben ningún mensaje; asignar el de un RCheckBox, RRadioButton o ROvalBtn detiene el programa)."
"RCHECKBOX" = "Una casilla con un texto que la persona marca o desmarca (Checked)."
