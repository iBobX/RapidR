"RCODEEDITOR" = "El editor de código de RapidR Studio: colores de sintaxis a partir de una definición de lenguaje (BASIC por defecto; SQL, JSON, HTML … o la tuya), números de línea, plegado, varios cursores, buscar y reemplazar, ajuste de línea, un minimapa, marcadores, problemas y ayuda del lenguaje (autocompletado, información al pasar el mouse, firmas) del servicio de lenguaje de RapidR donde el entorno de ejecución lo incluye, o del programa mediante sus eventos de solicitud. Lo que siempre respondió cuenta las líneas desde 0 (Line, GotoLine, WhereX, WhereY); lo nuevo cuenta líneas y columnas desde 1."
"RCODEEDITOR.ACCESSIBLEDESCRIPTION" = "Una descripción más larga que un lector de pantalla da después del nombre (qué hace el control, un atajo)."
"RCODEEDITOR.ACCESSIBLEHIDDEN" = "True: el control es decoración —un punto parpadeante, un adorno— y un lector de pantalla lo omite (sigue en la ventana, para los ojos). Nunca lo establezcas en nada que una persona pueda usar o necesite leer."
"RCODEEDITOR.ACCESSIBLENAME" = "Cómo llama un lector de pantalla al control, cuando su título o texto no basta (un botón de imagen, un campo de edición sin etiqueta)."
"RCODEEDITOR.ADD" = "Añade al final una entrada: una línea de texto a un editor o a una lista de cadenas de texto, o un elemento a un menú."
"RCODEEDITOR.ADDCURSOR" = "Otro cursor en una línea y columna (desde 1)."
"RCODEEDITOR.ADDITEMS" = "Añade al final una o más cadenas de texto (elementos, líneas o nodos) al componente, en el orden indicado."
"RCODEEDITOR.ADDLINES" = "Añade al final líneas de texto, una por argumento; en una vista de árbol, los espacios iniciales de cada línea fijan su profundidad."
"RCODEEDITOR.ADDMARKER" = "Un marcador en el margen de una línea (desde 1) que la sigue durante las ediciones. Tipos: \"breakpoint\" (un punto), \"breakpoint.conditional\" (un punto con un signo igual), \"breakpoint.hitcount\" (un punto con un signo de número), \"breakpoint.log\" (un rombo), \"breakpoint.disabled\" (un anillo), \"breakpoint.unverified\" (un anillo discontinuo: aún no vinculado al código), \"current\" (la línea del depurador: una flecha, la línea teñida), \"frame\" (la línea de un llamador: una flecha gris, un tinte más tenue), \"exception\" (una flecha y la línea en el color de error), \"bookmark\", \"error\", \"warning\" o un tipo del programa. Note se muestra como una etiqueta después del final de la línea (el mensaje de un error de ejecución); una línea muestra una nota, la más reciente."
"RCODEEDITOR.ADDSTRING" = "Añade al final una cadena de texto como un elemento o una línea nueva."
"RCODEEDITOR.ADDSTRINGS" = "Añade las cadenas dadas, cada una como una línea nueva."
"RCODEEDITOR.ANCHORS" = "Los bordes de su contenedor a los que el control mantiene su distancia cuando el contenedor cambia de tamaño: akLeft + akTop (el valor predeterminado) no se mueve; añade akRight / akBottom para estirarlo."
"RCODEEDITOR.APPLYEDITS" = "Varias ediciones como un solo paso de deshacer: una lista JSON de {\"line\", \"column\", \"endLine\", \"endColumn\", \"text\"} (o posiciones de carácter \"start\" / \"end\"). False, y no se hace nada, cuando dos se superponen."
"RCODEEDITOR.APPLYPATCHES" = "Aplica los parches de un cambio como un solo paso de deshacer: los eventos OnSourceEdit del componente RDESIGNSURFACE recibidos entre su OnSourceStep y su OnChange. Un parche por línea, con su StartLine, StartCol, EndLine, EndCol y Text separados por tabulaciones; líneas desde 0, columnas contadas en caracteres, cada parche en el texto que dejaron los anteriores; en Text, \n es un salto de línea, \\t una tabulación y \\\\ una barra invertida. Con Continues en True el paso se une al anterior (el Continues de OnSourceStep). Los cursores conservan su lugar en el texto que los rodea, y OnChange se produce una sola vez. False, y nada cambia, cuando un rango no está en el texto."
"RCODEEDITOR.AUTOCLOSE" = "Al escribir un paréntesis, un corchete o una comilla de apertura, escribe también el de cierre."
"RCODEEDITOR.AUTOINDENT" = "Una línea nueva conserva la sangría, un nivel más después de SUB, IF … THEN, FOR …"
"RCODEEDITOR.BEGINUPDATE" = "Vienen muchos cambios: la vista espera a EndUpdate."
"RCODEEDITOR.BORDERSTYLE" = "El borde: una de las constantes `bsXXX`. En un formulario, `bsSizeable` permite a la persona cambiar su tamaño, `bsDialog` no, `bsNone` no tiene barra de título."
"RCODEEDITOR.CANREDO" = "Rehacer tiene algo que volver a hacer."
"RCODEEDITOR.CANUNDO" = "Deshacer tiene algo que deshacer."
"RCODEEDITOR.CARETCOLUMN" = "La columna del cursor (un carácter de la línea), desde 1."
"RCODEEDITOR.CARETLINE" = "La línea del cursor, desde 1; al establecerla, el cursor se mueve ahí."
"RCODEEDITOR.CHANGEAT" = "Qué cambió en una línea (desde 1) desde ChangeBase: \"added\", \"changed\", \"removed\" (se quitaron líneas después de ella) o \"\"."
"RCODEEDITOR.CHANGEBASE" = "El texto con el que se comparan las marcas de cambio del margen: el archivo como lo tiene su última versión (RRepository.FileAt). Al establecerlo, las marcas muestran lo que cambió desde entonces — líneas añadidas, cambiadas, quitadas —, guardado o no; un clic en una marca muestra cómo eran las líneas, con Undo This Change. \"\" para un archivo que la última versión no tenía (todas las líneas añadidas)."
"RCODEEDITOR.CHANGECOUNT" = "Cuántos tramos de líneas difieren de ChangeBase (0 si no hay ninguno)."
"RCODEEDITOR.CHANGEPEEK" = "La línea (desde 1) bajo la que se muestra un cambio (se hizo clic en su marca, ShowChange); 0 si no hay ninguno."
"RCODEEDITOR.CHANGESSINCE" = "Con qué se comparan las marcas de cambio del margen: \"save\" (el valor predeterminado: el texto como se guardó o cargó por última vez) o \"version\" (ChangeBase, una vez establecido). Al establecer \"save\" se olvida ChangeBase."
"RCODEEDITOR.CHANGETEXT" = "Lo que eran en ChangeBase las líneas del cambio que hay en una línea (\"\" para líneas añadidas)."
"RCODEEDITOR.CHARCASE" = "Convierte el texto escrito a `ecUpperCase` o `ecLowerCase`; `ecNormal` lo deja tal como se escribió."
"RCODEEDITOR.CLEAR" = "Vacía el componente: quita sus elementos, líneas, texto o datos, o borra su dibujo."
"RCODEEDITOR.CLEARCURSORS" = "Vuelve al único cursor principal."
"RCODEEDITOR.CLEARDIAGNOSTICS" = "Quita los problemas que se muestran."
"RCODEEDITOR.CLEARMARKERS" = "Quita todos los marcadores de Kind (todos si está vacío)."
"RCODEEDITOR.CLEARSELECTION" = "Elimina el texto seleccionado."
"RCODEEDITOR.COLOR" = "El color de fondo, como &HBBGGRR o un color de sistema `clXXX`; en un cuadro de diálogo de color o de fuente, el color elegido."
"RCODEEDITOR.COLORSCHEME" = "\"auto\" (el del tema) o el nombre de un esquema de colores: \"classic\", \"modern\", \"dark\", \"highcontrast\"."
"RCODEEDITOR.COMPLETIONITEMS" = "La lista de autocompletado tal como se muestra ahora, una etiqueta por línea, la mejor coincidencia primero (vacía mientras está cerrada)."
"RCODEEDITOR.COMPLETIONSELECTED" = "La etiqueta seleccionada de la lista de autocompletado (lo que insertaría Tab o Enter); vacía mientras está cerrada."
"RCODEEDITOR.COMPLETIONTRIGGER" = "Caracteres que abren el autocompletado por sí solos (\".\")."
"RCODEEDITOR.COPYTEXT" = "Lo que Copiar pondría en el portapapeles (las selecciones, o la línea del cursor)."
"RCODEEDITOR.COPYTOCLIPBOARD" = "Copia el texto seleccionado al portapapeles."
"RCODEEDITOR.CURRENTSTATEMENT" = "Lo que ejecuta Ctrl+Enter: la selección o, si no, la instrucción SQL en la que está el cursor (hasta su ; o una línea en blanco) — en otro lenguaje: la línea del cursor. Léelo para un botón Ejecutar: `DB.QueryAsync Editor.CurrentStatement`."
"RCODEEDITOR.CURSOR" = "El puntero del mouse que se muestra sobre el control: una de las constantes `crXXX`."
"RCODEEDITOR.CURSORCOUNT" = "Cuántos cursores hay."
"RCODEEDITOR.CUTTOCLIPBOARD" = "Mueve el texto seleccionado al portapapeles."
"RCODEEDITOR.DATATIPTEXT" = "La sugerencia de datos que se muestra ahora, como texto: una fila por línea, una tabulación por nivel, nombre = valor (la fila de una tabla: sus celdas); vacío si no hay ninguna."
"RCODEEDITOR.DEBUGHOVER" = "Mientras es True (un depurador en pausa), un mouse que se detiene sobre una palabra le pregunta primero al programa: OnHoverRequest, respondido con ShowHover — antes que el servicio de lenguaje."
"RCODEEDITOR.DIAGNOSTICCOUNT" = "Cuántos problemas muestra."
"RCODEEDITOR.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RCODEEDITOR.ENCODING" = "Cómo se almacenó el archivo: \"UTF-8\", \"UTF-8 BOM\" o \"Latin-1\" (SaveToFile lo escribe de vuelta igual)."
"RCODEEDITOR.ENDUPDATE" = "Los cambios terminaron: la vista los muestra."
"RCODEEDITOR.FILENAME" = "El archivo del que se cargó o en el que se guardó (el servicio de lenguaje lo conoce por este nombre)."
"RCODEEDITOR.FIND" = "Selecciona la siguiente aparición de Text después de la selección; Options: \"case\", \"word\", \"regex\" (separadas por comas). True si la encontró."
