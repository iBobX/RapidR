"RCODEEDITOR.TOGGLECOMMENT" = "Comenta las líneas del cursor o les quita el comentario (Ctrl+/)."
"RCODEEDITOR.TOP" = "La distancia al borde superior del contenedor (en un formulario: el de la pantalla), en píxeles."
"RCODEEDITOR.TRIGGERCOMPLETION" = "Abre el autocompletado en el cursor, como lo hace Ctrl+Space."
