"RCODEEDITOR.HELPERS" = "Cuánto muestran los ayudantes del código (docs/code-helpers-plan.md): \"quiet\" una marca tras cada valor que conoce (la muestra de un color, la miniatura de una imagen o una marca roja cuando falta el archivo, la muestra de una fuente, el ▶ de un sonido); \"helpful\" también, al final de la línea del cursor, su ayuda de una línea, el nombre del parámetro antes de un argumento literal en una llamada con varios, y los valores de un programa en pausa (ShowLineValues); \"everything\" también el nombre de cada argumento y un ▾ tras cada opción y enlace; \"off\" ninguno. Mantener Ctrl un momento muestra el nombre de cada argumento. Un clic en una marca, o Ctrl+. (Cmd+.) sobre un valor, abre su editor; lo que elige se escribe de vuelta como un solo paso de deshacer en la forma propia del código."
"RCODEEDITOR.HELPERSOFF" = "Ayudantes desactivados uno por uno, separados por comas: color, font, file, choice, link, names (los nombres de los argumentos), note (la ayuda de la línea), values (los de un programa en pausa)."
"RCODEEDITOR.HELPERTEXT" = "La línea del cursor leída con sus ayudantes, como la dice Ctrl+K H: la línea, luego qué es cada valor (\"orange, 255 130 20\", \"picture logo.png, missing\") y la ayuda de la línea."
