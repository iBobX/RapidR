"RCODEEDITOR.KEYWORDCASE" = "Las mayúsculas y minúsculas de las palabras del lenguaje mientras escribes: \"upper\" (DIM x AS INTEGER), \"lower\", \"proper\" o \"preserve\"."
"RCODEEDITOR.LANGUAGE" = "El lenguaje que siguen sus colores, sus paréntesis, su sangría y su plegado: un id (\"rapidr-basic\", \"sql\", \"json\", \"html\", \"css\", \"javascript\", \"markdown\", \"toml\", \"rust\", \"csv\", \"plaintext\"), un nombre de archivo cuya extensión lo indica, o un archivo de definición de lenguaje (.toml). SQL completa sus palabras y las tablas del programa (SetSchema), pliega cada instrucción, y Ctrl+Enter ejecuta una (OnRunStatement)."
"RCODEEDITOR.LANGUAGESERVICE" = "El servicio de lenguaje de RapidR responde el autocompletado, la información al pasar el mouse, las firmas y los problemas (donde el entorno de ejecución lo incluye: rapidr run, RapidR Studio); si está desactivado, el programa responde a los eventos de solicitud."
"RCODEEDITOR.LEFT" = "La distancia al borde izquierdo del contenedor (en un formulario: el de la pantalla), en píxeles."
