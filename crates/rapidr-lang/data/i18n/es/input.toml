"RCODEEDITOR.IDENTIFIERCASE" = "Los nombres propios del programa mientras escribes: \"preserve\" (como se escribieron) o \"declaration\" (como se declararon — form.caption pasa a ser Form.Caption — y los miembros de los componentes como se escriben en el registro)."
