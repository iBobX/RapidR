"RCODEEDITOR.ONEXIT" = "Se produce cuando el componente pierde el foco del teclado en favor de otro componente de su formulario (Tab, un clic, SetFocus), antes del OnEnter de ese otro: el lugar para comprobar lo que se escribió. Cambiar a otra ventana o aplicación no lo produce, ni tampoco ocultar o deshabilitar el componente."
