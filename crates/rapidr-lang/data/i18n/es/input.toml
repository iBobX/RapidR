"RCODEEDITOR.TRIGGERSIGNATURE" = "Abre la ayuda de firma en el cursor, como lo hace Ctrl+Shift+Space."
"RCODEEDITOR.UNDO" = "Deshace el último paso, el que deshace Ctrl+Z (Cmd+Z): al escribir, una palabra o una pausa a la vez; un comando o ApplyPatches, completos. Después se produce OnChange."
"RCODEEDITOR.UNFOLD" = "Despliega el bloque de una línea (desde 1)."
"RCODEEDITOR.UNFOLDALL" = "Despliega todos los bloques (Ctrl+K Ctrl+J)."
"RCODEEDITOR.VISIBLE" = "Si el control o formulario se muestra."
