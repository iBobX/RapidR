"RCODEEDITOR.SETFOCUS" = "Da el foco del teclado al componente."
"RCODEEDITOR.SETSCHEMA" = "Las tablas, vistas y columnas que ofrece el autocompletado de SQL (Language \"sql\"): JSON — {\"tables\": [{\"name\": \"people\", \"kind\": \"table\", \"columns\": [{\"name\": \"id\", \"type\": \"INTEGER\"}, …]}, …]}, una lista de tablas así, o la forma corta {\"people\": [\"id\", \"name\"], \"orders\": {\"id\": \"INTEGER\"}}. Después de `name.` el autocompletado ofrece las columnas de esa tabla (o de su alias: FROM people p … p.); después de FROM, JOIN, INTO, UPDATE, las tablas; en otros lugares, las columnas de las tablas nombradas, las tablas y luego las palabras del dialecto. \"\" lo borra. True si se leyó el JSON."
"RCODEEDITOR.SHOWCHANGE" = "Muestra el cambio de una línea debajo de sus líneas, como lo hace un clic en su marca: cómo eran, Deshacer este cambio y Cerrar (Escape también lo cierra). False si no cambió nada allí."
"RCODEEDITOR.SHOWCOMPLETION" = "Muestra una lista de autocompletado en el cursor: líneas con etiqueta, tipo, detalle y texto por insertar separados por tabulaciones (una cadena de texto o un QSTRINGLIST), o JSON. Es la respuesta a OnCompletionRequest."
"RCODEEDITOR.SHOWDATATIP" = "Una sugerencia de datos del depurador donde la pidió OnHoverRequest: un valor como un árbol que se abre a cualquier profundidad. Una fila por línea, con sus campos separados por tabulaciones: profundidad (0 la de arriba), indicadores (e: se abre, o: abierta, c: su valor cambió — marcada —, t: fila de una tabla, h: encabezado de una tabla), su id (lo que devuelven OnDataTipExpand y OnDataTipAction), nombre, valor, tipo, y las celdas de una fila de tabla (CHR$(31) entre ellas), lo que el registro sabe de ella (el Hint de TreeView.SetItemValue: color, handle, const:alClient) y la cantidad de sus hijos — cada valor se dibuja como lo hacen los paneles del depurador: el ícono de su tipo, la muestra de un color, un valor cambiado resaltado. Si se muestra de nuevo en el mismo lugar, conserva su posición de desplazamiento; si Rows está vacío, se oculta."
"RCODEEDITOR.SHOWFOLDING" = "El margen tiene flechas de plegado (SUB … END SUB, CREATE … END CREATE …)."
"RCODEEDITOR.SHOWHINT" = "Muestra la sugerencia `Hint` cuando el mouse se detiene sobre el control; en `Application`, activa o desactiva todas las sugerencias."
"RCODEEDITOR.SHOWHOVER" = "Muestra la información emergente donde la pidió OnHoverRequest (un bloque delimitado con ``` se muestra como código)."
"RCODEEDITOR.SHOWLINENUMBERS" = "El margen numera las líneas."
"RCODEEDITOR.SHOWLINEVALUES" = "Los valores de un programa en pausa al final de las líneas de FromLine a ToLine (desde 1; las de la rutina en pausa, hasta la línea en pausa) que los usan: Rows, una fila por línea, con nombre, valor y tipo separados por tabulaciones, como los escribe el depurador (\"Score\\t42\\tInteger\"). Se dibujan como los dibuja Variables (la muestra de un color, \"\" para un texto vacío)."
"RCODEEDITOR.SHOWMINIMAP" = "Una imagen pequeña de todo el texto a la derecha, con la parte que se ve marcada; haz clic en ella o arrástrala para desplazar el texto."
"RCODEEDITOR.SHOWSIGNATURE" = "Muestra la ayuda de firma sobre el cursor, con el parámetro ActiveParam (desde 0) marcado."
"RCODEEDITOR.SHOWWHITESPACE" = "Los espacios se muestran como puntos y las tabulaciones como flechas."
"RCODEEDITOR.SIGNATURETEXT" = "La ayuda de firma que se muestra ahora (la firma de la llamada); vacía si no hay ninguna."
