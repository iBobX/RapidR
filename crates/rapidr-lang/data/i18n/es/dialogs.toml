# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/components/dialogs.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"RCOLORDIALOG" = "Un selector de color: Execute lo muestra y devuelve 1 cuando se elige un color, que queda entonces en Color; Colors guarda los 16 colores personalizados."
"RCOLORDIALOG.CAPTION" = "El texto que muestra el control, o el título de una ventana o un diálogo; un `&` antes de una letra la subraya como atajo de teclado."
"RCOLORDIALOG.COLOR" = "El color de fondo, como &HBBGGRR o un color de sistema `clXXX`; en un cuadro de diálogo de color o de fuente, el color elegido."
"RCOLORDIALOG.COLORS" = "Los colores personalizados que ofrece el cuadro de diálogo de color, de `Colors(1)` a `Colors(16)`."
"RCOLORDIALOG.EXECUTE" = "Abre el selector de color. Devuelve 1 si se seleccionó un color, 0 si se canceló. El valor seleccionado queda en .Color."
"RCOLORDIALOG.LEFT" = "La distancia al borde izquierdo del contenedor (en un formulario: el de la pantalla), en píxeles."
"RCOLORDIALOG.STYLE" = "Una variante del componente: el `csXXX` de una lista desplegable (desplegable, simple, solo lista, dibujada por el programa), el `lbXXX` de un cuadro de lista, las opciones de un cuadro de diálogo de color, el modo de lugar alternativo de un formulario acoplable."
"RCOLORDIALOG.TOP" = "La distancia al borde superior del contenedor (en un formulario: el de la pantalla), en píxeles."
"RFILEDIALOG" = "Un cuadro de diálogo de archivos: un componente para abrir y guardar (Mode), con varios archivos a la vez (Files, SelCount) y una advertencia al sobrescribir."
"RFILEDIALOG.CAPTION" = "El texto que muestra el control, o el título de una ventana o un diálogo; un `&` antes de una letra la subraya como atajo de teclado."
"RFILEDIALOG.DEFAULTEXT" = "La extensión que se añade a un nombre de archivo escrito sin ella (`txt`, sin punto)."
"RFILEDIALOG.EXECUTE" = "Ejecuta la acción del componente: un cuadro de diálogo se muestra, espera y devuelve true cuando se confirma."
"RFILEDIALOG.FILENAME" = "El archivo elegido en un cuadro de diálogo (con su carpeta), o el archivo que el objeto lee o escribe."
"RFILEDIALOG.FILES" = "Con `MultiSelect`, los archivos elegidos: `Files(0)` es la carpeta, y de `Files(1)` en adelante están los nombres."
"RFILEDIALOG.FILETITLE" = "El nombre del archivo elegido sin su carpeta; solo lectura."
"RFILEDIALOG.FILTER" = "Los tipos de archivo que se ofrecen, como pares descripción|patrones (`Text|*.txt|All Files|*.*`), con los patrones separados por `;`."
"RFILEDIALOG.FILTERINDEX" = "Qué filtro está seleccionado, contando desde 1."
"RFILEDIALOG.INITIALDIR" = "La carpeta en la que empieza el cuadro de diálogo o el árbol."
"RFILEDIALOG.MODE" = "En un cuadro de diálogo de archivos, 0 para abrir o 1 para guardar; en un RWave, los canales de una grabación nueva (1 mono, 2 estéreo)."
"RFILEDIALOG.MULTISELECT" = "Permite seleccionar más de un elemento o archivo."
"RFILEDIALOG.NOCHANGEDIR" = "Vuelve a poner la carpeta actual como estaba al cerrarse el cuadro de diálogo."
"RFILEDIALOG.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RFILEDIALOG.SELCOUNT" = "Cuántos elementos (o archivos) están seleccionados."
"RFILEDIALOG.TITLE" = "El título de un cuadro de diálogo, de la aplicación (barra de tareas), de un trabajo de impresión, de una notificación o de un gráfico."
"RFILEDIALOG.WARNIFOVERWRITE" = "Pregunta antes de guardar sobre un archivo que ya existe."
"RFONTDIALOG" = "Un selector de fuente: Execute lo muestra y devuelve 1 cuando se elige una fuente, que queda en Name, Size, Color y los estilos; GetFont y SetFont la intercambian con un RFont."
"RFONTDIALOG.ADDOPTIONS" = "Activa los indicadores de opción dados."
"RFONTDIALOG.ADDSTYLES" = "Activa los estilos de fuente indicados (negrita, cursiva, subrayado, tachado)."
"RFONTDIALOG.COLOR" = "El color de fondo, como &HBBGGRR o un color de sistema `clXXX`; en un cuadro de diálogo de color o de fuente, el color elegido."
"RFONTDIALOG.DELOPTIONS" = "Desactiva los indicadores de opción dados."
"RFONTDIALOG.DELSTYLES" = "Desactiva los estilos de fuente indicados."
"RFONTDIALOG.EXECUTE" = "Abre el cuadro de diálogo de fuente. Devuelve 1 si se eligió una fuente, 0 si se canceló. Lee .FontName / .FontSize / .FontColor / .FontStyle para obtener el resultado."
"RFONTDIALOG.FONTCOLOR" = "El atajo de RapidR para `Font.Color`: el color del texto, como &HBBGGRR."
"RFONTDIALOG.FONTCOUNT" = "El número de fuentes instaladas; solo lectura."
"RFONTDIALOG.FONTNAME" = "En un cuadro de diálogo de fuente o en un RFont, el nombre de una fuente instalada, `FontName(i)` desde 0; en los demás, el atajo de RapidR para `Font.Name`."
"RFONTDIALOG.FONTSIZE" = "El atajo de RapidR para `Font.Size`, en puntos."
"RFONTDIALOG.GETFONT" = "Toma el nombre, el tamaño, el color y los estilos de la fuente `F` y los pone en el cuadro de diálogo (lo que muestra primero cuando Execute lo abre); SetFont devuelve los del cuadro a un RFont. La fuente de un componente también sirve aquí (`GetFont(Label.Font)`)."
"RFONTDIALOG.MAXFONTSIZE" = "El tamaño más grande que ofrece el cuadro de diálogo de fuente (0: sin límite)."
"RFONTDIALOG.MINFONTSIZE" = "El tamaño más pequeño que ofrece el cuadro de diálogo de fuente (0: sin límite)."
"RFONTDIALOG.NAME" = "El nombre de la fuente (`Arial`); en un joystick, el nombre del dispositivo."
"RFONTDIALOG.ONAPPLY" = "Se produce cuando se presiona el botón Aplicar del cuadro de diálogo de fuente; las propiedades de fuente del cuadro ya contienen la fuente que se muestra."
"RFONTDIALOG.SETFONT" = "Da a la fuente `F` el nombre, el tamaño, el color y los estilos del cuadro de diálogo (después de Execute). La fuente de un componente también sirve aquí (`SetFont(Label.Font)` cambia la etiqueta)."
"RFONTDIALOG.SIZE" = "Un tamaño: de una fuente, en puntos; de un archivo, flujo, sonido o descarga, en bytes; de un arreglo, su número de valores."
"ROPENDIALOG" = "El cuadro de diálogo Abrir del sistema: Execute lo muestra y devuelve si se eligió un archivo, cuyo nombre queda en FileName. Filter limita los archivos que se listan."
"ROPENDIALOG.CAPTION" = "El texto que muestra el control, o el título de una ventana o un diálogo; un `&` antes de una letra la subraya como atajo de teclado."
"ROPENDIALOG.DEFAULTEXT" = "La extensión que se añade a un nombre de archivo escrito sin ella (`txt`, sin punto)."
"ROPENDIALOG.EXECUTE" = "Ejecuta la acción del componente: un cuadro de diálogo se muestra, espera y devuelve true cuando se confirma."
"ROPENDIALOG.FILENAME" = "El archivo elegido en un cuadro de diálogo (con su carpeta), o el archivo que el objeto lee o escribe."
"ROPENDIALOG.FILTER" = "Los tipos de archivo que se ofrecen, como pares descripción|patrones (`Text|*.txt|All Files|*.*`), con los patrones separados por `;`."
"ROPENDIALOG.FILTERINDEX" = "Qué filtro está seleccionado, contando desde 1."
"ROPENDIALOG.INITIALDIR" = "La carpeta en la que empieza el cuadro de diálogo o el árbol."
"ROPENDIALOG.PICKFOLDER" = "Execute elige una carpeta en lugar de un archivo; FileName es la carpeta (en la web se leen sus archivos, y al guardar una carpeta se vuelve a escribir)."
"ROPENDIALOG.TITLE" = "El título de un cuadro de diálogo, de la aplicación (barra de tareas), de un trabajo de impresión, de una notificación o de un gráfico."
"RSAVEDIALOG" = "El cuadro de diálogo Guardar del sistema: Execute lo muestra y devuelve si se eligió un nombre, que queda en FileName."
"RSAVEDIALOG.CAPTION" = "El texto que muestra el control, o el título de una ventana o un diálogo; un `&` antes de una letra la subraya como atajo de teclado."
"RSAVEDIALOG.DEFAULTEXT" = "La extensión que se añade a un nombre de archivo escrito sin ella (`txt`, sin punto)."
"RSAVEDIALOG.EXECUTE" = "Ejecuta la acción del componente: un cuadro de diálogo se muestra, espera y devuelve true cuando se confirma."
"RSAVEDIALOG.FILENAME" = "El archivo elegido en un cuadro de diálogo (con su carpeta), o el archivo que el objeto lee o escribe."
"RSAVEDIALOG.FILTER" = "Los tipos de archivo que se ofrecen, como pares descripción|patrones (`Text|*.txt|All Files|*.*`), con los patrones separados por `;`."
"RSAVEDIALOG.FILTERINDEX" = "Qué filtro está seleccionado, contando desde 1."
"RSAVEDIALOG.INITIALDIR" = "La carpeta en la que empieza el cuadro de diálogo o el árbol."
"RSAVEDIALOG.TITLE" = "El título de un cuadro de diálogo, de la aplicación (barra de tareas), de un trabajo de impresión, de una notificación o de un gráfico."
