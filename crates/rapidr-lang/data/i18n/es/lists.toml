"RSTRINGGRID.ROWHEIGHTS" = "La altura de una fila de la cuadrícula en píxeles, `RowHeights(row)` desde 0."
"RSTRINGGRID.ROWS" = "El nombre de RapidR para la propiedad `RowCount` de una cuadrícula."
"RSTRINGGRID.SAVETOFILE" = "Guarda el contenido del componente en un archivo: texto, elementos, celdas de la tabla, nodos del árbol o una imagen."
"RSTRINGGRID.SAVETOSTREAM" = "Escribe el contenido del componente en un flujo abierto."
"RSTRINGGRID.SCROLLBARS" = "Qué barras de desplazamiento se muestran: `ssNone`, `ssHorizontal`, `ssVertical` o `ssBoth`."
"RSTRINGGRID.SELECTEDCOL" = "El nombre de RapidR para la propiedad `Col` de una cuadrícula."
"RSTRINGGRID.SELECTEDROW" = "El nombre de RapidR para la propiedad `Row` de una cuadrícula."
"RSTRINGGRID.SEPARATOR" = "El texto entre las celdas cuando la cuadrícula guarda o carga filas (`,`)."
"RSTRINGGRID.SETCELL" = "Establece el texto de la celda en una columna y una fila."
