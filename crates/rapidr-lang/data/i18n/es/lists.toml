"RDIRTREE.MINHEIGHT" = "La altura mínima del control, en píxeles; 0 para no tener límite. También `Constraints.MinHeight`."
"RDIRTREE.MINWIDTH" = "El ancho mínimo del control, en píxeles, sea quien sea que lo cambie de tamaño (el programa, Align, Anchors, la persona); 0 para no tener límite. También `Constraints.MinWidth`."
"RDIRTREE.ONCHANGE" = "Se produce cuando cambia el valor del control: el texto de un campo de edición, la selección de una lista, un árbol o una pestaña, la posición de una barra de desplazamiento o de un control deslizante, la fecha de un selector, el estado de un objeto multimedia."
"RDIRTREE.ONENTER" = "Se produce cuando el componente recibe el foco del teclado: Tab o Shift+Tab, un clic, SetFocus, el atajo de su etiqueta y, en el caso del primero, cuando se muestra su formulario. Llega después del OnExit del componente que tenía el foco y antes de lo que hace un clic en él (su OnMouseDown, OnClick). Cambiar a otra ventana o aplicación y volver no lo produce."
