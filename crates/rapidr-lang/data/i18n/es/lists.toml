"RSTRINGGRID.ONSETEDITTEXT" = "Se produce cuando la persona editó directamente la celda (Col, Row) de la cuadrícula; Value es el texto nuevo."
"RSTRINGGRID.PAINT" = "Rellena de color desde (`x`, `y`) con `c` hasta el color de borde `borderc` en OnDrawCell: sobre la celda tal como la dibujó la cuadrícula y lo que el controlador de eventos ha dibujado hasta ahora."
