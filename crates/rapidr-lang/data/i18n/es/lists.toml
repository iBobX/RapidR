"RSTRINGGRID.MOVECOLUMN" = "Mueve una columna a otra posición; las que quedan en medio se corren. Igual que `MoveCol`."
"RSTRINGGRID.MOVEROW" = "Mueve una fila a otra posición; las que quedan en medio se corren."
"RSTRINGGRID.ONCHANGE" = "Se produce cuando cambia el valor del control: el texto de un campo de edición, la selección de una lista, un árbol o una pestaña, la posición de una barra de desplazamiento o de un control deslizante, la fecha de un selector, el estado de un objeto multimedia."
