"RSTRINGGRID.SETFOCUS" = "Da el foco del teclado al componente."
"RSTRINGGRID.SETROWCOUNT" = "Establece el número de filas, añadiéndolas o quitándolas al final."
"RSTRINGGRID.SETSUGGESTIONS" = "Establece las sugerencias que se ofrecen mientras se edita una celda, una por línea."
"RSTRINGGRID.SHOWHINT" = "Muestra la sugerencia `Hint` cuando el mouse se detiene sobre el control; en `Application`, activa o desactiva todas las sugerencias."
"RSTRINGGRID.STRETCHDRAW" = "Dibuja un mapa de bits escalado para llenar el rectángulo `Rect`."
"RSTRINGGRID.SWAPCOLS" = "Intercambia las columnas `Col1` y `Col2`."
"RSTRINGGRID.SWAPROWS" = "Intercambia las filas `Row1` y `Row2`."
"RSTRINGGRID.TABORDER" = "El lugar del control en el orden de la tecla Tab entre los controles de su contenedor, desde 0."
