"RDIRTREE.POPUPMENU" = "El menú emergente que se muestra cuando la persona hace clic derecho en el control."
"RDIRTREE.READONLY" = "Impide que la persona cambie el texto o los elementos; aun así puede seleccionar y copiar."
"RDIRTREE.READONSTART" = "Lee el árbol de carpetas cuando se inicia el programa en lugar de cuando se muestra por primera vez."
"RDIRTREE.REFRESH" = "Vuelve a dibujar el componente de inmediato; en MySQL, vacía las tablas o cachés del servidor que indica `RefreshFlags`."
"RDIRTREE.RELOAD" = "Vuelve a leer las carpetas del disco."
"RDIRTREE.REPAINT" = "Vuelve a dibujar el componente."
