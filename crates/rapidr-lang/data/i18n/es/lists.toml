# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/components/lists.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"RDIRTREE" = "Un árbol de unidades y carpetas para elegir una carpeta (Directory)."
"RDIRTREE.ACCESSIBLEDESCRIPTION" = "Una descripción más larga que un lector de pantalla da después del nombre (qué hace el control, un atajo)."
"RDIRTREE.ACCESSIBLEHIDDEN" = "True: el control es decoración —un punto parpadeante, un adorno— y un lector de pantalla lo omite (sigue en la ventana, para los ojos). Nunca lo establezcas en nada que una persona pueda usar o necesite leer."
"RDIRTREE.ACCESSIBLENAME" = "Cómo llama un lector de pantalla al control, cuando su título o texto no basta (un botón de imagen, un campo de edición sin etiqueta)."
"RDIRTREE.ADDDIRTYPES" = "Añade tipos de carpetas, por atributo, a los que lista el árbol."
"RDIRTREE.ADDDRIVETYPES" = "Añade tipos de unidades (fija, extraíble, de red, CD …) a las que lista el árbol."
"RDIRTREE.ALIGN" = "Dónde se acopla el control en su contenedor: una de las constantes `alXXX`. `alNone` conserva su propio lugar; `alClient` llena lo que dejan los demás controles acoplados."
"RDIRTREE.ANCHORS" = "Los bordes de su contenedor a los que el control mantiene su distancia cuando el contenedor cambia de tamaño: akLeft + akTop (el valor predeterminado) no se mueve; añade akRight / akBottom para estirarlo."
"RDIRTREE.BORDERSTYLE" = "El borde: una de las constantes `bsXXX`. En un formulario, `bsSizeable` permite a la persona cambiar su tamaño, `bsDialog` no, `bsNone` no tiene barra de título."
"RDIRTREE.COLOR" = "El color de fondo, como &HBBGGRR o un color de sistema `clXXX`; en un cuadro de diálogo de color o de fuente, el color elegido."
"RDIRTREE.CURSOR" = "El puntero del mouse que se muestra sobre el control: una de las constantes `crXXX`."
"RDIRTREE.DELDIRTYPES" = "Quita tipos de carpetas, por atributo, de los que lista el árbol."
"RDIRTREE.DELDRIVETYPES" = "Quita tipos de unidades de las que lista el árbol."
"RDIRTREE.DIRECTORY" = "La carpeta que muestra la lista de archivos, el árbol de carpetas o la vista de lista de carpetas."
"RDIRTREE.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RDIRTREE.FASTLOAD" = "Lee las subcarpetas de una carpeta solo cuando se abre, para que los árboles grandes se muestren antes."
