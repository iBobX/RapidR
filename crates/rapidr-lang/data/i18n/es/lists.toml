"RTREEVIEW.SELECTEDITEM" = "El texto del nodo seleccionado del árbol."
"RTREEVIEW.SETFOCUS" = "Da el foco del teclado al árbol: sus teclas mueven la selección, F2 edita, Enter y las flechas abren y cierran."
"RTREEVIEW.SETITEMVALUE" = "Muestra el nodo Index como un valor, como lo hacen los paneles Variables y Observar de un depurador: el ícono de su tipo, luego `Name = Value` con el valor con el estilo de su tipo (números, texto, True/False, constantes), un texto vacío como un discreto `\"\"`, un color como una muestra y su nombre, un arreglo con su cantidad de elementos. Kind es la palabra del depurador para él (`Integer`, `Double`, `String`, `Boolean`, `Array`, `Empty`, el nombre de un TYPE o de un componente, `Include`, `Components`, `More`) o la de un encabezado (`Locals`, `Globals`, `Components` sin Value, `Watch`, `CallStack`, `Frame`, `CurrentFrame`: se dibuja como un título con su ícono; `Breakpoint`, con su estado en Hint —`on`, `off`, `unverified`, `conditional`, `hitcount`, `log`—, se dibuja con el ícono correspondiente del margen). Count es cuántos hijos tiene (los elementos de un arreglo); Hint dice qué más se sabe, separado por comas: `color`, `handle`, `bool` (una propiedad True / False guardada como número: \"on\" u \"off\" después), `const:alClient`, `choices:alNone|alTop|…`, `result`, `readonly`. El Text del nodo pasa a ser `Name = Value`; los lectores de pantalla leen una frase (\"FontColor, colour clWindowText\"). Un Kind y un Value vacíos lo convierten de nuevo en un nodo simple, con Name como su texto."
"RTREEVIEW.SHOW" = "Muestra el componente o formulario; un objeto de ciencia de datos imprime su contenido."
"RTREEVIEW.SHOWBUTTONS" = "Muestra botones + / - junto a los nodos que tienen hijos."
"RTREEVIEW.SHOWHINT" = "Muestra la sugerencia `Hint` cuando el mouse se detiene sobre el control; en `Application`, activa o desactiva todas las sugerencias."
"RTREEVIEW.SHOWLINES" = "Dibuja líneas que unen los nodos con sus padres."
"RTREEVIEW.SHOWROOT" = "Dibuja líneas y botones también para los nodos de nivel superior."
"RTREEVIEW.SORT" = "Ordena los elementos o los nodos en orden ascendente."
"RTREEVIEW.SORTTYPE" = "`stText` ordena los elementos por su texto; `stNone` los deja como se añadieron."
"RTREEVIEW.STATEIMAGES" = "La lista de imágenes de estado (marcas de verificación …) que se dibujan junto a los elementos; solo escritura."
"RTREEVIEW.TABORDER" = "El lugar del control en el orden de la tecla Tab entre los controles de su contenedor, desde 0."
"RTREEVIEW.TAG" = "Un número para uso propio del programa; RapidR nunca lo lee."
"RTREEVIEW.TEXT" = "Todos los nodos como texto: una línea cada uno, con una tabulación por nivel antes (lo que lee LoadFromFile)."
"RTREEVIEW.TOP" = "La distancia al borde superior del contenedor (en un formulario: el de la pantalla), en píxeles."
"RTREEVIEW.TOPINDEX" = "El elemento que se muestra en la parte superior de la lista, desde 0. Al establecerlo, la lista se desplaza para que ese elemento sea la primera fila (hasta donde llega la lista: con el último elemento se muestra su última página); al leerlo da la primera fila que se muestra."
"RTREEVIEW.TOPITEM" = "El nodo que se muestra en la parte superior del árbol."
"RTREEVIEW.VISIBLE" = "Si el control o formulario se muestra."
"RTREEVIEW.WIDTH" = "El ancho, en píxeles; en `Screen`, el de la pantalla."
