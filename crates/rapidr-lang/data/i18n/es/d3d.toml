# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/components/d3d.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"RD3DANIMATION" = "La animación por fotogramas clave de Direct3D: un identificador con un Parent y ningún otro miembro. Por ahora nada crea ni reproduce una."
"RD3DANIMATION.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RD3DANIMATIONSET" = "El conjunto de animaciones de Direct3D: un identificador con un Parent y ningún otro miembro. Por ahora nada crea ni reproduce uno."
"RD3DANIMATIONSET.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RD3DFACE" = "Un polígono de una malla 3D: sus vértices y su color, que se añaden a un constructor de mallas."
"RD3DFACE.ADDVERTEX" = "Añade un vértice en `X`, `Y`, `Z`."
"RD3DFACE.GETVERTEX" = "Lee el vértice `Index` de la cara: su posición y su normal."
"RD3DFACE.SETCOLORRGB" = "Establece el color a partir de `R`, `G`, `B` (de 0 a 1)."
"RD3DFACE.SETCOLORRGBA" = "Establece el color y su opacidad a partir de las partes roja, verde, azul y alfa (de 0 a 1). Igual que SetRGBA."
"RD3DFACE.SETRGB" = "Establece el color de la malla a partir de `R`, `G`, `B` (de 0 a 1)."
"RD3DFACE.SETRGBA" = "Establece el color de la malla a partir de `R`, `G`, `B` y su opacidad `A` (de 0 a 1)."
"RD3DFACE.VERTEXCOUNT" = "El número de vértices de la cara; solo lectura."
"RD3DFRAME" = "Un nodo de una escena de Direct3D en modo retenido: tiene posición, orientación y movimiento, y contiene mallas, luces y marcos secundarios. RapidR dibuja la escena con su propio renderizador."
"RD3DFRAME.ADDFRAME" = "Hace que el marco `Frame` sea secundario de este marco, así que se mueve con él."
"RD3DFRAME.ADDLIGHT" = "Añade una luz al marco o a la escena 3D."
"RD3DFRAME.ADDSCALE" = "Escala el marco por `X`, `Y`, `Z`; `CombineType` reemplaza su transformación (0) o aplica la escala antes (1) o después (2) de ella."
