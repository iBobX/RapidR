"RTOOLBOX.CONTEXTKIND" = "A qué se refiere el último menú contextual: \"item\" un componente (un clic derecho lo selecciona antes: Selected lo nombra), \"group\" el encabezado de un grupo, \"\" nada (la parte vacía). Léelo en OnContextMenu."
"ROUTPUTCONSOLE.PLACEFILE" = "El archivo que nombra la línea Index (desde 0) de la página mostrada —su primer lugar `archivo:línea`, o el del problema en la página Problemas—, como lo abre un clic en ella (OnLinkClick); \"\" si la línea no nombra ninguno. Con ClickedLine: el \"Ir a main.rr, línea 12\" de un menú contextual."
"ROUTPUTCONSOLE.PLACELINE" = "El número de línea que nombra la línea Index de la página mostrada (ver PlaceFile); 0 si ninguno (el encabezado de un archivo en la página Problemas)."
"RMARKDOWNVIEW.CONTEXTCODE" = "El bloque de código sobre el que fue el último clic derecho, todo su texto (\"\" si no fue sobre uno): para el Copiar el código o el Probarlo de un menú contextual. Léelo en OnContextMenu."
"RCOMMANDPALETTE.SHOWAT" = "Como Show, pero bajo un botón en lugar de arriba del formulario: el borde derecho de la paleta en Right y su borde superior en Top (en píxeles del formulario), siempre dentro del formulario. Una lista abierta desde un botón (las pestañas abiertas, los archivos que nombra un mensaje) cuelga de él."
"RPROPERTYINSPECTOR.BRINGTOFRONT" = "Pone el componente por encima de todos los demás componentes del mismo contenedor: se dibuja encima de ellos y recibe los clics del mouse donde los cubre (un panel cajón abierto sobre el área de trabajo). Sus propios componentes vienen con él. Tab, cuando ningún TabOrder dice otra cosa, y los lectores de pantalla lo alcanzan después de sus hermanos. El último traído al frente queda arriba."
"RPROPERTYINSPECTOR.SENDTOBACK" = "Pone el componente por debajo de todos los demás componentes del mismo contenedor: se dibujan sobre él y reciben el mouse donde lo cubren (un cajón cerrado detrás del área de trabajo). Sus propios componentes van con él. Tab, cuando ningún TabOrder dice otra cosa, y los lectores de pantalla lo alcanzan antes que a sus hermanos. El último enviado atrás queda abajo de todo."
