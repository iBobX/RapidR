"RTOOLBOX.CONTEXTKIND" = "A qué se refiere el último menú contextual: \"item\" un componente (un clic derecho lo selecciona antes: Selected lo nombra), \"group\" el encabezado de un grupo, \"\" nada (la parte vacía). Léelo en OnContextMenu."
"ROUTPUTCONSOLE.PLACEFILE" = "El archivo que nombra la línea Index (desde 0) de la página mostrada —su primer lugar `archivo:línea`, o el del problema en la página Problemas—, como lo abre un clic en ella (OnLinkClick); \"\" si la línea no nombra ninguno. Con ClickedLine: el \"Ir a main.rr, línea 12\" de un menú contextual."
"ROUTPUTCONSOLE.PLACELINE" = "El número de línea que nombra la línea Index de la página mostrada (ver PlaceFile); 0 si ninguno (el encabezado de un archivo en la página Problemas)."
"RMARKDOWNVIEW.CONTEXTCODE" = "El bloque de código sobre el que fue el último clic derecho, todo su texto (\"\" si no fue sobre uno): para el Copiar el código o el Probarlo de un menú contextual. Léelo en OnContextMenu."
