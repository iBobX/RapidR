# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md).

[docs]
"RPROPERTYINSPECTOR.MARKNONCLASSIC" = "Marca, en un proyecto que se mantiene compatible con el lenguaje clásico, las filas que un programa clásico no tiene (una pequeña nota \"no está en los programas clásicos\", con una sugerencia y para un lector de pantalla); False (el valor predeterminado) no marca nada. RapidR Studio lo establece a partir de la configuración del proyecto."
"RPROPERTYINSPECTOR.ONCONTEXTMENU" = "De RapidR: la persona pidió el menú contextual de este componente: un clic derecho soltado sobre él, Mayús+F10 o la tecla de menú mientras tiene el teclado, el «mostrar menú» de un lector de pantalla, o el botón Más de una fila. X, Y son dónde va el menú, en sus propios píxeles (debajo de su elemento con el foco cuando lo pidió el teclado); Key dice cómo: 0 el mouse, 1 el teclado, 3 un lector de pantalla, 4 el botón Más de una fila (X, Y su esquina inferior derecha: un menú alineado a la derecha allí). Muestra un menú con `Menu.PopupAt Sender, X, Y`. Una lista, un árbol o un inspector dicen antes de qué elemento se trata (ContextIndex, la fila seleccionada). Sin este evento, el PopupMenu de un componente se abre solo, en un programa de RapidR también desde el teclado."
