# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/constants.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"ADDRESS FAMILIES" = "Familias de direcciones para el Family de un socket (AF_INET para IPv4 y otras)."
"ALIGNMENT IN THE PARENT" = "El Align de un control: dónde se acopla en su contenedor (arriba, abajo, izquierda, derecha, toda el área de cliente) cuando este cambia de tamaño."
"ANCHORS" = "Los indicadores Anchors de RapidR, combinados: los lados de su contenedor a los que un control mantiene su distancia cuando el contenedor cambia de tamaño."
"BAUD RATES" = "Velocidades del puerto serial para el BaudRate de un RComPort."
"BEVEL PANELS" = "Los estilos de borde de un panel: ninguno o simple."
"BEVELS" = "Los biseles de un panel o de un bisel (BevelInner, BevelOuter): ninguno, hundido o elevado."
"BORDER ICONS" = "Los botones de la barra de título de un formulario (menú del sistema, minimizar, maximizar, ayuda), para su BorderIcons."
"BORDER STYLES" = "El BorderStyle de un formulario o un control: sin borde, uno fijo, uno redimensionable, el de un diálogo o el de una ventana de herramientas."
"BUTTON GLYPH LAYOUT" = "Dónde se coloca la imagen de un botón respecto a su texto (Layout)."
"BUTTON KINDS" = "El Kind de un botón: un botón personalizado, o uno estándar (OK, Cancel, Help, Yes, No, …) con su texto y su imagen."
"CD AUDIO STATES" = "Comandos y estados de la biblioteca de audio de CD (qcdaudio.inc): cerrar, reproducir, pausar, detener."
"CGI LIMITS" = "Tamaños de la biblioteca CGI (qcgi.inc): cuánta entrada de la solicitud lee y cuántos pares nombre/valor conserva."
"CHARACTER SETS" = "Conjuntos de caracteres para la propiedad Charset de una fuente, que eligen de qué escritura se dibujan los caracteres de la fuente."
"CLOSE ACTIONS" = "Qué ocurre cuando se cierra un formulario, establecido en su evento OnClose: nada, ocultarlo, liberarlo o minimizarlo."
"COLOURS" = "Valores de color (el azul en el byte alto) para Color, Font.Color y los métodos de dibujo. RAPIDQ.INC (y todo programa .rr, donde viene incorporado) también da `QBColor(0 TO 15)`, un arreglo INTEGER de los 16 colores de QBasic en la misma forma (`QBColor(12)` es rojo brillante)."
"COMBO BOX STYLES" = "El Style de una lista desplegable: desplegable con edición, simple, lista desplegable o dibujada por el programa."
"COPY MODES" = "Operaciones ráster para CopyMode: cómo se combinan los píxeles de una imagen dibujada con los que ya hay."
"CURSORS" = "Formas del puntero del mouse para la propiedad Cursor de un control y para Screen.Cursor."
"DIRECTORY TYPES" = "Tipos de carpeta que se listan, por atributo: solo lectura, ocultas, del sistema, normales o todas."
"DRAW STATES" = "El DrawingStyle de una lista de imágenes: cómo se dibujan sus imágenes (con foco, seleccionada, normal, transparente)."
"DRIVE TYPES" = "Tipos de unidad: extraíble, fija, de red, CD-ROM, disco RAM o desconocida."
"DUPLICATES" = "Qué hace una lista de cadenas ordenada con un elemento que ya tiene (Duplicates): ignorarlo, aceptarlo o provocar un error."
"EDIT CHARACTER CASE" = "El CharCase de un cuadro de texto: el texto se conserva como se escribió, o se pasa a mayúsculas o a minúsculas."
"FILE ATTRIBUTES" = "Atributos de archivo para `DIR$` y las búsquedas de archivos; faAnyFile coincide con todos los archivos."
"FILE STREAM MODES" = "Cómo abre su archivo un RFileStream: crearlo, o abrirlo para leer, para escribir o para ambas cosas."
"FILE TYPES" = "Tipos de archivo que se listan, por atributo: solo lectura, oculto, del sistema, etiqueta de volumen, carpeta, archivo o normal."
"FLOAT FORMATS" = "Formatos para `STRF$`: general, científico, decimales fijos, o fijos con separadores de miles."
"FONT DIALOG OPTIONS" = "Opciones del diálogo de fuente, combinadas en su Options."
"FONT PITCH" = "El Pitch de una fuente: el predeterminado de la fuente, proporcional o de ancho fijo."
"FONT STYLES" = "Estilos de fuente (negrita, cursiva, subrayado, tachado), combinados en el Style de una fuente."
"FORM STYLES" = "El FormStyle de un formulario: normal, ventana hija o principal MDI, o siempre encima."
"GAUGE KINDS" = "El Kind de una barra de progreso: texto, una barra horizontal o vertical, un gráfico circular o una aguja."
"GRID COLUMN STYLES" = "El ColumnStyle de una columna de una cuadrícula de cadenas: una lista desplegable, un botón de puntos suspensivos, o ninguno."
"GRID OPTIONS" = "Las Options de una cuadrícula de cadenas: líneas de la cuadrícula, selección, cambio de tamaño y movimiento de filas y columnas, edición y más, combinadas."
"HEADER SECTION STYLES" = "El Style de una sección de encabezado: texto, o dibujada por el programa."
"IMAGE TYPES" = "El ImageType de una lista de imágenes: dibujar la imagen o su máscara."
"IP PROTOCOLS" = "Protocolos de internet para el Protocol de un socket."
"KEY STATES" = "La tecla Alt presionada, tal como la dan los eventos del teclado y del mouse."
"LABEL STYLES" = "El LabelStyle de una etiqueta: texto plano, elevado o hundido."
"LIST BOX STYLES" = "El Style de un cuadro de lista: estándar, o dibujado por el programa con alturas de elemento fijas o variables."
"LIST VIEW CHANGE KINDS" = "Qué cambió en un elemento, el `Change` que recibe el OnChange de un RListView: su texto editado (ctText), una imagen (ctImage), su casilla o imagen de estado (ctState). Solo está incorporado en un programa de RapidR (`.rr`): un programa `.bas` lee los nombres como variables que valen 0."
"LIST VIEW STYLES" = "El ViewStyle de una vista de lista: íconos grandes, íconos pequeños, una lista o un informe con columnas."
"MESSAGE BOX BUTTONS AND ICONS" = "Indicadores para `MESSAGEBOX`: qué botones muestra, sumados al ícono que muestra."
"MESSAGE BOX RESULTS" = "Lo que devuelve `MESSAGEBOX`: el botón que eligió la persona."
"MESSAGE DIALOG BUTTONS" = "Botones para `MESSAGEDLG`, que se suman cuando son más de uno."
"MESSAGE DIALOG TYPES" = "El tipo de mensaje que muestra `MESSAGEDLG`, que determina su título y su ícono."
"MIDI PLAYER STATES" = "Comandos y estados de la biblioteca del reproductor MIDI (qmidi.inc): cerrar, reproducir, pausar, detener."
"MODAL RESULTS" = "Resultados de un formulario mostrado con ShowModal, el ModalResult de un botón que cierra el formulario con él, y la respuesta que da `MESSAGEDLG` (su `DefaultButton` nombra uno)."
"MOUSE BUTTONS" = "A qué botón del mouse corresponde un evento OnMouseDown u OnMouseUp."
"NUMBER TYPES" = "El tipo con el que ReadNum y WriteNum de un flujo leen o escriben un número."
"OLE STATES" = "El State del objeto de un contenedor OLE: vacío, cargado, en ejecución, abierto o activo en su lugar."
"OUTLINE OPTIONS" = "Opciones de dibujo de esquema: dibujar la raíz del árbol, el rectángulo de foco, mapas de bits estirados."
"OUTLINE STYLES" = "El OutlineStyle de una vista de árbol: cuáles de estos elementos muestra: texto, botones de más y menos, imágenes y líneas del árbol."
"PARITY" = "Paridad del puerto serial para el Parity de un RComPort: ninguna, impar, par, marca o espacio."
"PIXEL FORMATS" = "El PixelFormat de un mapa de bits: el número de bits que ocupa cada píxel."
"PLAYWAV OPTIONS" = "Opciones de `PLAYWAV`, que se suman: esperar a que termine el sonido (SND_SYNC) o reproducirlo en segundo plano (SND_ASYNC), repetirlo, reproducirlo desde la memoria, ningún sonido predeterminado cuando falta el archivo, no detener un sonido que se está reproduciendo."
"PRINTER ORIENTATION" = "El Orientation de la impresora: vertical u horizontal."
"SCROLL BAR KINDS" = "El Kind de una barra de desplazamiento: horizontal o vertical."
"SCROLL BARS" = "Qué barras de desplazamiento muestra un memo, un cuadro de texto enriquecido, una cuadrícula o una vista de árbol (ScrollBars)."
"SCROLL CODES" = "Lo que informa el evento OnScroll de una barra de desplazamiento que se hizo: un paso de una línea o de una página, un arrastre del cuadro de desplazamiento, los extremos o el fin del desplazamiento."
"SEEK ORIGINS" = "Desde dónde cuenta Seek de un flujo: el inicio, la posición actual o el final."
"SHIFT STATES" = "Cuáles de Shift, Ctrl y Alt están presionadas, tal como las dan los eventos del teclado y del mouse."
"SOCKET TYPES" = "Tipos de socket: un flujo (TCP), datagramas (UDP), sin procesar (raw) y otros."
"SORT TYPES" = "El SortType de una vista de lista o de árbol: sin ordenar, o por el texto de los elementos."
"SPECIAL COLOURS" = "Colores que significan ningún color, o el color predeterminado del control."
"STOP BITS" = "Bits de parada del puerto serial para el StopBits de un RComPort: uno, uno y medio o dos."
"STRETCH MODES" = "Cómo ajusta un contenedor OLE el tamaño de su objeto (SizeMode): recortar, centrar, escalar, estirar o adaptarse al objeto."
"SYSTEM COLOURS" = "Los colores del sistema para las partes de la interfaz de usuario; un control que usa uno sigue el tema."
"TEXT ALIGNMENT" = "Alineación horizontal del texto de un control (Alignment): izquierda, derecha o centrada."
"TEXT LAYOUT" = "Posición vertical del texto de un control (Layout): arriba, centro o abajo."
"TICK MARKS" = "En qué lado dibuja sus marcas un control deslizante (TickMarks): abajo o derecha, arriba o izquierda, o ambos."
"TICK STYLES" = "El TickStyle de un control deslizante: sin marcas, marcas en cada paso, o solo las que establece el programa."
"TRACK BAR ORIENTATION" = "El Orientation de un control deslizante (o de un divisor, o de una impresora): horizontal o vertical."
"TRANSPARENT MODES" = "Cómo elige un mapa de bits su color transparente: automáticamente o el que se establece."
"TRUTH VALUES" = "El valor falso (false), para indicadores y comparaciones."
"VIDEO PLAYER STATES" = "Comandos y estados de la biblioteca del reproductor de video (qvideo.inc): cerrar, reproducir, pausar, detener."
"VIRTUAL KEY CODES" = "Códigos de las teclas del teclado, tal como los dan los eventos OnKeyDown y OnKeyUp."
"WAVE AUDIO" = "Comandos y estados de la biblioteca de audio wave (qwave.inc) —reproducir, pausar, detener, grabar— y formatos de grabación: canales, bits por muestra, frecuencias de muestreo."
"WINDOW STATES" = "El WindowState de un formulario: normal, minimizado o maximizado."
