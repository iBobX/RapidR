"RTABCONTROL.LEFT" = "La distancia al borde izquierdo del contenedor (en un formulario: el de la pantalla), en píxeles."
"RTABCONTROL.MAXHEIGHT" = "La altura máxima del control, en píxeles; 0 para no tener límite. También `Constraints.MaxHeight`."
"RTABCONTROL.MAXWIDTH" = "El ancho máximo del control, en píxeles; 0 para no tener límite. También `Constraints.MaxWidth`."
"RTABCONTROL.MINHEIGHT" = "La altura mínima del control, en píxeles; 0 para no tener límite. También `Constraints.MinHeight`."
"RTABCONTROL.MINWIDTH" = "El ancho mínimo del control, en píxeles, sea quien sea que lo cambie de tamaño (el programa, Align, Anchors, el usuario); 0 para no tener límite. También `Constraints.MinWidth`."
"RTABCONTROL.MULTILINE" = "Reparte las pestañas en más filas en lugar de desplazarlas."
"RTABCONTROL.ONCHANGE" = "Se produce cuando cambia el valor del control: el texto de un campo de edición, la selección de una lista, un árbol o una pestaña, la posición de una barra de desplazamiento o de un control deslizante, la fecha de un selector, el estado de un objeto multimedia."
"RTABCONTROL.ONCLICK" = "Se produce cuando el usuario hace clic en el control (o presiona su atajo, o Space o Enter en un botón con el foco)."
"RTABCONTROL.ONENTER" = "Se produce cuando el componente recibe el foco del teclado: Tab o Shift+Tab, un clic, SetFocus, el atajo de su etiqueta y, en el caso del primero, cuando se muestra su formulario. Llega después del OnExit del componente que tenía el foco y antes de lo que hace un clic en él (su OnMouseDown, OnClick). Cambiar a otra ventana o aplicación y volver no lo produce."
"RTABCONTROL.ONEXIT" = "Se produce cuando el componente pierde el foco del teclado en favor de otro componente de su formulario (Tab, un clic, SetFocus), antes del OnEnter de ese otro: el lugar para comprobar lo que se escribió. Cambiar a otra ventana o aplicación no lo produce, ni tampoco ocultar o deshabilitar el componente."
"RTABCONTROL.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RTABCONTROL.POPUPMENU" = "El menú emergente que se muestra cuando el usuario hace clic derecho en el control."
"RTABCONTROL.REFRESH" = "Vuelve a dibujar el componente de inmediato; en MySQL, vacía las tablas o cachés del servidor que indica `RefreshFlags`."
"RTABCONTROL.REMOVETAB" = "Quita la pestaña del índice indicado."
"RTABCONTROL.REPAINT" = "Vuelve a dibujar el componente."
"RTABCONTROL.SCROLLOPPOSITE" = "Mueve al lado opuesto las filas de pestañas que no están seleccionadas."
"RTABCONTROL.SHOWHINT" = "Muestra la sugerencia `Hint` cuando el mouse se detiene sobre el control; en `Application`, activa o desactiva todas las sugerencias."
