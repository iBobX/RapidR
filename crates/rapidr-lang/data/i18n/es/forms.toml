"RGLASSFRAME.HINT" = "La sugerencia que se muestra cuando el mouse se detiene sobre el control (con `ShowHint`)."
"RGLASSFRAME.LEFT" = "La distancia al borde izquierdo del contenedor (en un formulario: el de la pantalla), en píxeles."
"RGLASSFRAME.MOVEABLE" = "Permite al usuario arrastrar el marco."
"RGLASSFRAME.ONCLICK" = "Se produce cuando el usuario hace clic en el control (o presiona su atajo, o Space o Enter en un botón con el foco)."
"RGLASSFRAME.ONDBLCLICK" = "Se produce cuando el usuario hace doble clic en el control (en una superficie de diseño: el componente diseñado Index)."
"RGLASSFRAME.ONMOUSEDOWN" = "Se produce cuando se presiona un botón del mouse sobre el control (Button: `mbLeft`, `mbRight` o `mbMiddle`; X, Y: dentro del control; Shift: el estado de las teclas)."
"RGLASSFRAME.ONMOUSEMOVE" = "Se produce cuando el mouse se mueve sobre el control (X, Y: dentro del control; Shift: los botones y teclas presionados)."
"RGLASSFRAME.ONMOUSEUP" = "Se produce cuando se suelta un botón del mouse sobre el control (Button: `mbLeft`, `mbRight` o `mbMiddle`; X, Y: dentro del control; Shift: el estado de las teclas)."
"RGLASSFRAME.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RGLASSFRAME.POPUPMENU" = "El menú emergente que se muestra cuando el usuario hace clic derecho en el control."
"RGLASSFRAME.SHOWHINT" = "Muestra la sugerencia `Hint` cuando el mouse se detiene sobre el control; en `Application`, activa o desactiva todas las sugerencias."
"RGLASSFRAME.TOP" = "La distancia al borde superior del contenedor (en un formulario: el de la pantalla), en píxeles."
"RGLASSFRAME.TRANSPARENCY" = "Qué tan transparente es el marco, en porcentaje (60)."
"RGLASSFRAME.TRANSPARENTCOLOR" = "El color que se dibuja transparente, como &HBBGGRR."
"RGLASSFRAME.VISIBLE" = "Si el control o formulario se muestra."
"RGLASSFRAME.WIDTH" = "El ancho, en píxeles; en `Screen`, el de la pantalla."
