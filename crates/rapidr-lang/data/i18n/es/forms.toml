"RTOOLBAR.ALIGN" = "Dónde se acopla el control en su contenedor: una de las constantes `alXXX`. `alNone` conserva su propio lugar; `alClient` llena lo que dejan los demás controles acoplados."
"RTOOLBAR.ANCHORS" = "Los bordes de su contenedor a los que el control mantiene su distancia cuando el contenedor cambia de tamaño: akLeft + akTop (el valor predeterminado) no se mueve; añade akRight / akBottom para estirarlo."
