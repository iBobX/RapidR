"RTOOLBAR.BUTTONVISIBLE" = "Si un botón se muestra; con On, lo establece."
"RTOOLBAR.CLEAR" = "Quita todos los botones."
"RTOOLBAR.CLICKEDBUTTON" = "El nombre del botón en el que se hizo el último clic, para que lo lea OnClick (vacío cuando el clic fue en la franja misma)."
"RTOOLBAR.COLOR" = "El color de fondo, como &HBBGGRR o un color de sistema `clXXX`; en un cuadro de diálogo de color o de fuente, el color elegido."
"RTOOLBAR.CURSOR" = "El puntero del mouse que se muestra sobre el control: una de las constantes `crXXX`."
"RTOOLBAR.CUSTOMIZABLE" = "El usuario puede elegir qué botones se muestran, desde el menú de la barra de herramientas (su botón de desbordamiento)."
"RTOOLBAR.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RTOOLBAR.FONT" = "La fuente del texto, un RFont; al asignar una, se copia."
"RTOOLBAR.HEIGHT" = "La altura, en píxeles; en `Screen`, la de la pantalla."
