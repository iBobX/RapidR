"RTABCONTROL.FOCUSBUTTONS" = "Permite que los botones de las pestañas reciban el foco del teclado."
"RTABCONTROL.FONT" = "La fuente del texto, un RFont; al asignar una, se copia."
"RTABCONTROL.FONTCOLOR" = "El atajo de RapidR para `Font.Color`: el color del texto, como &HBBGGRR."
