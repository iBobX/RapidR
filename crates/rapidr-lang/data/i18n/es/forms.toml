# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/components/forms.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"RBEVEL" = "Un cuadro con bordes 3D en relieve o hundidos (QBevel.inc), para enmarcar o agrupar componentes."
"RBEVEL.ACCESSIBLEDESCRIPTION" = "Una descripción más larga que un lector de pantalla da después del nombre (qué hace el control, un atajo)."
"RBEVEL.ACCESSIBLEHIDDEN" = "True: el control es decoración —un punto parpadeante, un adorno— y un lector de pantalla lo omite (sigue en la ventana, para los ojos). Nunca lo establezcas en nada que una persona pueda usar o necesite leer."
"RBEVEL.ACCESSIBLENAME" = "Cómo llama un lector de pantalla al control, cuando su título o texto no basta (un botón de imagen, un campo de edición sin etiqueta)."
"RBEVEL.ALIGN" = "Dónde se acopla el control en su contenedor: una de las constantes `alXXX`. `alNone` conserva su propio lugar; `alClient` llena lo que dejan los demás controles acoplados."
"RBEVEL.ALIGNMENT" = "Cómo se alinea el texto dentro del control: `taLeftJustify`, `taCenter` o `taRightJustify`; en un menú emergente, a qué lado del punto se abre."
"RBEVEL.ANCHORS" = "Los bordes de su contenedor a los que el control mantiene su distancia cuando el contenedor cambia de tamaño: akLeft + akTop (el valor predeterminado) no se mueve; añade akRight / akBottom para estirarlo."
"RBEVEL.BEVELINNER" = "El bisel interior: `bvNone`, `bvLowered` o `bvRaised`."
"RBEVEL.BEVELOUTER" = "El bisel exterior: `bvNone`, `bvLowered` o `bvRaised`."
"RBEVEL.BEVELWIDTH" = "El ancho de cada bisel, en píxeles."
"RBEVEL.BORDERSTYLE" = "El borde: una de las constantes `bsXXX`. En un formulario, `bsSizeable` permite al usuario cambiar su tamaño, `bsDialog` no, `bsNone` no tiene barra de título."
"RBEVEL.CAPTION" = "El texto que muestra el control, o el título de una ventana o un diálogo; un `&` antes de una letra la subraya como atajo de teclado."
"RBEVEL.CLIENTHEIGHT" = "La altura del área dentro de los bordes (y de la barra de título y el menú de un formulario), en píxeles; en `Screen`, la del área de trabajo, sin la barra de tareas."
"RBEVEL.CLIENTWIDTH" = "El ancho del área dentro de los bordes, en píxeles; en `Screen`, el del área de trabajo, sin la barra de tareas."
"RBEVEL.COLOR" = "El color de fondo, como &HBBGGRR o un color de sistema `clXXX`; en un cuadro de diálogo de color o de fuente, el color elegido."
"RBEVEL.CURSOR" = "El puntero del mouse que se muestra sobre el control: una de las constantes `crXXX`."
"RBEVEL.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RBEVEL.FONT" = "La fuente del texto, un RFont; al asignar una, se copia."
"RBEVEL.HEIGHT" = "La altura, en píxeles; en `Screen`, la de la pantalla."
"RBEVEL.HINT" = "La sugerencia que se muestra cuando el mouse se detiene sobre el control (con `ShowHint`)."
"RBEVEL.LEFT" = "La distancia al borde izquierdo del contenedor (en un formulario: el de la pantalla), en píxeles."
"RBEVEL.MAXHEIGHT" = "La altura máxima del control, en píxeles; 0 para no tener límite. También `Constraints.MaxHeight`."
"RBEVEL.MAXWIDTH" = "El ancho máximo del control, en píxeles; 0 para no tener límite. También `Constraints.MaxWidth`."
"RBEVEL.MINHEIGHT" = "La altura mínima del control, en píxeles; 0 para no tener límite. También `Constraints.MinHeight`."
"RBEVEL.MINWIDTH" = "El ancho mínimo del control, en píxeles, sea quien sea que lo cambie de tamaño (el programa, Align, Anchors, el usuario); 0 para no tener límite. También `Constraints.MinWidth`."
"RBEVEL.ONCLICK" = "Se produce cuando el usuario hace clic en el control (o presiona su atajo, o Space o Enter en un botón con el foco)."
"RBEVEL.ONDBLCLICK" = "Se produce cuando el usuario hace doble clic en el control (en una superficie de diseño: el componente diseñado Index)."
"RBEVEL.ONMOUSEDOWN" = "Se produce cuando se presiona un botón del mouse sobre el control (Button: `mbLeft`, `mbRight` o `mbMiddle`; X, Y: dentro del control; Shift: el estado de las teclas)."
"RBEVEL.ONMOUSEMOVE" = "Se produce cuando el mouse se mueve sobre el control (X, Y: dentro del control; Shift: los botones y teclas presionados)."
"RBEVEL.ONMOUSEUP" = "Se produce cuando se suelta un botón del mouse sobre el control (Button: `mbLeft`, `mbRight` o `mbMiddle`; X, Y: dentro del control; Shift: el estado de las teclas)."
"RBEVEL.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RBEVEL.REPAINT" = "Vuelve a dibujar el componente."
"RBEVEL.SHOWHINT" = "Muestra la sugerencia `Hint` cuando el mouse se detiene sobre el control; en `Application`, activa o desactiva todas las sugerencias."
"RBEVEL.TABORDER" = "El lugar del control en el orden de la tecla Tab entre los controles de su contenedor, desde 0."
"RBEVEL.TAG" = "Un número para uso propio del programa; RapidR nunca lo lee."
"RBEVEL.TOP" = "La distancia al borde superior del contenedor (en un formulario: el de la pantalla), en píxeles."
"RBEVEL.VISIBLE" = "Si el control o formulario se muestra."
"RBEVEL.WIDTH" = "El ancho, en píxeles; en `Screen`, el de la pantalla."
"RDOCKMANAGER" = "El área de acoplamiento de RapidR (RapidR Studio está hecho con ella): paneles acoplados en sus bordes, agrupados en pestañas, ocultos automáticamente o flotantes, alrededor de un área de documentos de ventanas MDI o pestañas. Los documentos en pestañas se pueden dividir en grupos arrastrando una pestaña hacia un lado, reordenar arrastrándolas a lo largo de la franja y dotar de vistas (un conmutador Diseño | Código). El usuario arrastra los paneles con una brújula de acoplamiento o los mueve con el teclado; la disposición se guarda como texto y se carga de nuevo."
"RDOCKMANAGER.ACCESSIBLEDESCRIPTION" = "Una descripción más larga que un lector de pantalla da después del nombre (qué hace el control, un atajo)."
"RDOCKMANAGER.ACCESSIBLEHIDDEN" = "True: el control es decoración —un punto parpadeante, un adorno— y un lector de pantalla lo omite (sigue en la ventana, para los ojos). Nunca lo establezcas en nada que una persona pueda usar o necesite leer."
"RDOCKMANAGER.ACCESSIBLENAME" = "Cómo llama un lector de pantalla al control, cuando su título o texto no basta (un botón de imagen, un campo de edición sin etiqueta)."
"RDOCKMANAGER.ACTIVEDOCUMENT" = "El nombre del documento activo; al establecerlo se activa ese documento."
"RDOCKMANAGER.ACTIVEPANE" = "El nombre del panel activo; al establecerlo se muestra ese panel y se le da el foco."
"RDOCKMANAGER.ADDPANE" = "Añade un componente como panel, con título, acoplado donde indica Where (\"left\", \"right\", \"top\", \"bottom\", \"documents\", \"float\", \"tab:<pane>\", \"<side>:<pane>\", \"autohide:<side>\"), con el nombre de un ícono incorporado o \"\". True si se colocó."
"RDOCKMANAGER.ADDVIEW" = "Documentos en pestañas: hace que Component sea una de las vistas de un documento, con el texto Caption. Un documento con dos vistas o más recibe un conmutador a la derecha de su franja de pestañas (un segmento por vista, y luego lado a lado) y muestra una vista a la vez, o las dos primeras lado a lado con un divisor entre ellas. Añade también como vista el componente del propio documento."
"RDOCKMANAGER.ALIGN" = "Dónde se acopla el control en su contenedor: una de las constantes `alXXX`. `alNone` conserva su propio lugar; `alClient` llena lo que dejan los demás controles acoplados."
"RDOCKMANAGER.ANCHORS" = "Los bordes de su contenedor a los que el control mantiene su distancia cuando el contenedor cambia de tamaño: akLeft + akTop (el valor predeterminado) no se mueve; añade akRight / akBottom para estirarlo."
"RDOCKMANAGER.ARRANGEICONS" = "Alinea las ventanas hijas minimizadas de un RFormMDI a lo largo de su parte inferior (IconArrangeChild). Un RForm no tiene ventanas hijas MDI (solo es fsNormal), así que allí no ocurre nada."
"RDOCKMANAGER.AUTOHIDE" = "Fija un panel a la franja de ocultación automática de su borde (con On en False: lo acopla de nuevo)."
"RDOCKMANAGER.CASCADE" = "Coloca en cascada las ventanas de los documentos."
"RDOCKMANAGER.CLOSEPANE" = "Cierra un documento (OnDocumentClose puede cancelarlo) u oculta un panel de herramientas."
"RDOCKMANAGER.DOCKPANE" = "Acopla un panel donde indica Where (los lugares de AddPane)."
"RDOCKMANAGER.DOCUMENT" = "El nombre del documento Index (desde 0)."
"RDOCKMANAGER.DOCUMENTBAR" = "Documentos en pestañas: una franja en la parte superior de un documento, sobre sus vistas (para una pregunta sobre él: el aviso \"main.rr cambió fuera de Studio\" de RapidR Studio, con sus botones): Component (un panel, por su nombre) se coloca allí, con la altura que indica su Height, y las vistas del documento ocupan el resto; \"\" la quita. Un componente es la barra de un solo documento a la vez; se muestra mientras se muestra su documento. Sin Component, la barra del documento (\"\" ninguna)."
"RDOCKMANAGER.DOCUMENTCOUNT" = "Cuántos documentos hay abiertos."
"RDOCKMANAGER.DOCUMENTGROUPCOUNT" = "Documentos en pestañas: en cuántos grupos de pestañas se divide el área de documentos (0 sin documentos)."
"RDOCKMANAGER.DOCUMENTMODE" = "Cómo se muestran los documentos: \"mdi\" (ventanas en el área de documentos, el valor predeterminado) o \"tabs\"."
"RDOCKMANAGER.DOCUMENTMODIFIED" = "Documentos en pestañas: si la pestaña de un documento muestra el punto de un cambio sin guardar; con Modified, lo establece."
"RDOCKMANAGER.DOCUMENTSTATE" = "El estado de la ventana de un documento MDI: 0 normal, 1 minimizada, 2 maximizada (-1: no es un documento MDI); con State, pasa a ese estado."
"RDOCKMANAGER.DOCUMENTVIEW" = "Documentos en pestañas: el texto de la vista que muestra un documento (\"Split\" cuando sus dos primeras vistas están lado a lado); con View, muestra esa vista (un texto, o \"Split\")."
"RDOCKMANAGER.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RDOCKMANAGER.FLOATPANE" = "Hace flotar un panel en su propia ventana."
"RDOCKMANAGER.FOCUSPANE" = "Muestra un panel, lo hace el activo y le da el foco del teclado."
"RDOCKMANAGER.FOCUSSPLITTER" = "Da el teclado a un divisor: el que está junto al panel indicado (si no, junto al panel o documento activo; si no, el primero). Las flechas lo mueven 10 píxeles, Shift+flechas 50, Home y End lo llevan hasta donde llega en cada sentido, Tab y Shift+Tab pasan al divisor siguiente y al anterior, Enter o Escape devuelven el teclado. Un lector de pantalla lo anuncia como un separador cuyo valor es un porcentaje. True si había un divisor."
"RDOCKMANAGER.HEIGHT" = "La altura, en píxeles; en `Screen`, la de la pantalla."
"RDOCKMANAGER.HIDEPANE" = "Oculta un panel; ShowPane lo devuelve a donde estaba."
"RDOCKMANAGER.HINT" = "La sugerencia que se muestra cuando el mouse se detiene sobre el control (con `ShowHint`)."
"RDOCKMANAGER.LAYOUT" = "Toda la disposición como texto: leerla es SaveLayout, establecerla es LoadLayout."
"RDOCKMANAGER.LEFT" = "La distancia al borde izquierdo del contenedor (en un formulario: el de la pantalla), en píxeles."
"RDOCKMANAGER.LOADLAYOUT" = "Restaura una disposición que dio SaveLayout; True si se pudo leer."
"RDOCKMANAGER.MAXHEIGHT" = "La altura máxima del control, en píxeles; 0 para no tener límite. También `Constraints.MaxHeight`."
"RDOCKMANAGER.MAXWIDTH" = "El ancho máximo del control, en píxeles; 0 para no tener límite. También `Constraints.MaxWidth`."
"RDOCKMANAGER.MINHEIGHT" = "La altura mínima del control, en píxeles; 0 para no tener límite. También `Constraints.MinHeight`."
"RDOCKMANAGER.MINWIDTH" = "El ancho mínimo del control, en píxeles, sea quien sea que lo cambie de tamaño (el programa, Align, Anchors, el usuario); 0 para no tener límite. También `Constraints.MinWidth`."
"RDOCKMANAGER.MOVEPANE" = "Empieza a mover un panel con el teclado usando la brújula de acoplamiento."
"RDOCKMANAGER.NEXTDOCUMENT" = "Activa el documento siguiente (Ctrl+Tab)."
"RDOCKMANAGER.ONDOCUMENTACTIVATE" = "Un documento pasó a ser el activo."
"RDOCKMANAGER.ONDOCUMENTCLOSE" = "Un documento está por cerrarse; establece Cancel para mantenerlo abierto."
"RDOCKMANAGER.ONDOCUMENTVIEW" = "Documentos en pestañas: un documento ahora muestra otra vista (su texto, o \"Split\" si están lado a lado)."
"RDOCKMANAGER.ONLAYOUTCHANGE" = "La disposición cambió (el usuario o el programa movieron, acoplaron, hicieron flotar u ocultaron un panel)."
"RDOCKMANAGER.ONPANECHANGE" = "Un panel pasó a ser el activo."
"RDOCKMANAGER.PANE" = "El nombre del panel Index (desde 0)."
"RDOCKMANAGER.PANECOUNT" = "Cuántos paneles tiene el administrador (incluidos los documentos)."
"RDOCKMANAGER.PANEEXTENT" = "El ancho (Direction \"width\") o el alto (\"height\") de un panel acoplado, en píxeles: en la división más cercana que dispone los paneles de ese modo, la parte que lo contiene (el alto de un panel de abajo es el de todo el panel inferior). Con Extent, esa parte toma ese tamaño y su vecina cede o toma el espacio, cada una sin bajar de su mínimo. 0 si el panel no está acoplado en una división así."
"RDOCKMANAGER.PANESTATE" = "Dónde está un panel: \"docked\", \"tabbed\", \"autohide\", \"floating\", \"document\" o \"hidden\"."
"RDOCKMANAGER.PANETITLE" = "El título de un panel; con Title, lo establece."
"RDOCKMANAGER.PANEVISIBLE" = "True cuando el panel está colocado y se muestra (no oculto ni detrás de otra pestaña)."
"RDOCKMANAGER.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RDOCKMANAGER.PREVIOUSDOCUMENT" = "Activa el documento anterior (Ctrl+Shift+Tab)."
"RDOCKMANAGER.RESETLAYOUT" = "Devuelve cada panel a donde lo colocó AddPane."
"RDOCKMANAGER.SAVELAYOUT" = "La disposición como texto, para LoadLayout."
"RDOCKMANAGER.SHOWPANE" = "Muestra un panel donde estuvo por última vez (o desliza hacia fuera uno oculto automáticamente)."
"RDOCKMANAGER.SPLITDOCUMENT" = "Documentos en pestañas: mueve un documento a un nuevo grupo de pestañas en un lado (\"left\", \"right\", \"top\" o \"bottom\") de su grupo, como lo hace arrastrar allí su pestaña."
"RDOCKMANAGER.TILEHORIZONTAL" = "Coloca en mosaico las ventanas de los documentos, una sobre otra."
"RDOCKMANAGER.TILEVERTICAL" = "Coloca en mosaico las ventanas de los documentos, una junto a otra."
"RDOCKMANAGER.TOP" = "La distancia al borde superior del contenedor (en un formulario: el de la pantalla), en píxeles."
"RDOCKMANAGER.VISIBLE" = "Si el control o formulario se muestra."
"RDOCKMANAGER.WIDTH" = "El ancho, en píxeles; en `Screen`, el de la pantalla."
"RFORM" = "Una ventana: el contenedor de nivel superior de los componentes de un programa, con su título, borde, menú y eventos. Show la muestra; ShowModal la muestra y espera hasta que se cierre."
"RFORM.ACCESSIBLEDESCRIPTION" = "Una descripción más larga que un lector de pantalla da después del nombre (qué hace el control, un atajo)."
"RFORM.ACCESSIBLEHIDDEN" = "True: el control es decoración —un punto parpadeante, un adorno— y un lector de pantalla lo omite (sigue en la ventana, para los ojos). Nunca lo establezcas en nada que una persona pueda usar o necesite leer."
"RFORM.ACCESSIBLENAME" = "Cómo llama un lector de pantalla al control, cuando su título o texto no basta (un botón de imagen, un campo de edición sin etiqueta)."
"RFORM.ADDBORDERICONS" = "Añade los íconos de borde indicados (menú del sistema, minimizar, maximizar, ayuda) a la barra de título del formulario."
"RFORM.ANCHORS" = "Los bordes de su contenedor a los que el control mantiene su distancia cuando el contenedor cambia de tamaño: akLeft + akTop (el valor predeterminado) no se mueve; añade akRight / akBottom para estirarlo."
"RFORM.ARRANGEICONS" = "Alinea las ventanas hijas minimizadas de un RFormMDI a lo largo de su parte inferior (IconArrangeChild). Un RForm no tiene ventanas hijas MDI (solo es fsNormal), así que allí no ocurre nada."
"RFORM.AUTOSCROLL" = "Muestra por sí solo barras de desplazamiento cuando los controles de su interior pasan del área visible."
"RFORM.AUTOSIZE" = "Hace que el control se ajuste a su contenido: una etiqueta a su texto, un control de imagen a su imagen, un campo de edición a la altura de su fuente; el búfer de una pantalla DirectX sigue el tamaño del control."
"RFORM.BORDERSTYLE" = "El borde: una de las constantes `bsXXX`. En un formulario, `bsSizeable` permite al usuario cambiar su tamaño, `bsDialog` no, `bsNone` no tiene barra de título."
"RFORM.BRUSHCOLOR" = "El color de relleno que usan los métodos de dibujo, como &HBBGGRR (el atajo de RapidR para el pincel)."
"RFORM.CAPTION" = "El texto que muestra el control, o el título de una ventana o un diálogo; un `&` antes de una letra la subraya como atajo de teclado."
"RFORM.CASCADE" = "Organiza las ventanas hijas de un RFormMDI en una cascada superpuesta (CascadeChild). Un RForm no tiene ventanas hijas MDI (solo es fsNormal), así que allí no ocurre nada."
"RFORM.CENTER" = "Mueve el formulario al centro de la pantalla."
"RFORM.CIRCLE" = "Dibuja una elipse en el recuadro (`x1`, `y1`)–(`x2`, `y2`), con el contorno del color `c` y el relleno del color `fill`."
"RFORM.CLIENTHEIGHT" = "La altura del área dentro de los bordes (y de la barra de título y el menú de un formulario), en píxeles; en `Screen`, la del área de trabajo, sin la barra de tareas."
"RFORM.CLIENTWIDTH" = "El ancho del área dentro de los bordes, en píxeles; en `Screen`, el del área de trabajo, sin la barra de tareas."
"RFORM.CLOSE" = "Cierra lo que el componente tiene abierto: un formulario, un archivo, un puerto, un dispositivo, una conexión o una base de datos."
"RFORM.CLS" = "Borra el área de dibujo con su color de fondo."
"RFORM.COLOR" = "El color de fondo, como &HBBGGRR o un color de sistema `clXXX`; en un cuadro de diálogo de color o de fuente, el color elegido."
"RFORM.COPYMODE" = "Cómo `Draw` y `CopyRect` combinan el origen con lo que ya hay: una de las operaciones de trama `cmXXX` (`cmSrcCopy` copia)."
"RFORM.COPYRECT" = "Copia el rectángulo `S` de otra imagen o lienzo en el rectángulo `D` de esta, escalándolo para que encaje."
"RFORM.CURSOR" = "El puntero del mouse que se muestra sobre el control: una de las constantes `crXXX`."
"RFORM.DELBORDERICONS" = "Quita los íconos de borde indicados de la barra de título del formulario."
"RFORM.DRAW" = "Dibuja un mapa de bits con su esquina superior izquierda en (`x`, `y`); una lista de imágenes DirectX dibuja allí su imagen `Item`."
"RFORM.DRAWTEXT" = "Dibuja texto en un punto con la fuente actual: `DrawText(text, x, y [, color [, size]])`, con el tamaño en píxeles."
"RFORM.ELLIPSE" = "Dibuja una elipse en el recuadro (`x1`, `y1`)–(`x2`, `y2`) de un color, con relleno cuando sigue un color de relleno."
"RFORM.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RFORM.FILLCIRCLE" = "Dibuja un círculo relleno de radio `r` alrededor de (`cx`, `cy`), con el color del pincel o el color indicado."
"RFORM.FILLRECT" = "Rellena el rectángulo (`x1`, `y1`)–(`x2`, `y2`) con el color `c`."
"RFORM.FONT" = "La fuente del texto, un RFont; al asignar una, se copia."
"RFORM.FONTCOLOR" = "El atajo de RapidR para `Font.Color`: el color del texto, como &HBBGGRR."
"RFORM.FONTNAME" = "En un cuadro de diálogo de fuente o en un RFont, el nombre de una fuente instalada, `FontName(i)` desde 0; en los demás, el atajo de RapidR para `Font.Name`."
"RFORM.FONTSIZE" = "El atajo de RapidR para `Font.Size`, en puntos."
"RFORM.FORMSTYLE" = "`fsNormal`, `fsStayOnTop` (por encima de otras ventanas), o una ventana MDI principal o hija (`fsMDIForm`, `fsMDIChild`)."
"RFORM.HANDLE" = "El identificador de la ventana (o de otro objeto del sistema), para llamadas a la API y para componentes que lo reciben."
"RFORM.HEIGHT" = "La altura, en píxeles; en `Screen`, la de la pantalla."
"RFORM.HELPFILE" = "El archivo de ayuda que el programa abre con F1."
"RFORM.HIDE" = "Hace invisible el componente o formulario; sigue cargado."
"RFORM.HIDETITLEBAR" = "Quita la barra de título del formulario y deja su borde: el área de cliente conserva su tamaño y el formulario se acorta lo que mide la barra de título (Height). ShowTitleBar, o un nuevo BorderStyle, la devuelve. Un formulario sin marco (bsNone) no tiene ninguna que ocultar."
"RFORM.HINT" = "La sugerencia que se muestra cuando el mouse se detiene sobre el control (con `ShowHint`)."
"RFORM.ICOHANDLE" = "Establece el ícono a partir de un identificador de recurso (`$RESOURCE`); solo escritura."
"RFORM.ICON" = "El ícono (el nombre de un archivo .ICO) de la ventana, de la aplicación o de la imagen."
"RFORM.KEYPREVIEW" = "Da al formulario los eventos de teclado antes que al control que tiene el foco."
"RFORM.LEFT" = "La distancia al borde izquierdo del contenedor (en un formulario: el de la pantalla), en píxeles."
"RFORM.LINE" = "Dibuja una línea desde (`x1`, `y1`) hasta (`x2`, `y2`) con el color `c`."
"RFORM.MAXHEIGHT" = "La altura máxima del control, en píxeles; 0 para no tener límite. También `Constraints.MaxHeight`."
"RFORM.MAXWIDTH" = "El ancho máximo del control, en píxeles; 0 para no tener límite. También `Constraints.MaxWidth`."
"RFORM.MDICHILDCOUNT" = "El número de ventanas hijas MDI: el ChildCount de un RFormMDI; 0 en un RForm (solo es fsNormal)."
"RFORM.MINHEIGHT" = "La altura mínima del control, en píxeles; 0 para no tener límite. También `Constraints.MinHeight`."
"RFORM.MINWIDTH" = "El ancho mínimo del control, en píxeles, sea quien sea que lo cambie de tamaño (el programa, Align, Anchors, el usuario); 0 para no tener límite. También `Constraints.MinWidth`."
"RFORM.MODALRESULT" = "Lo que devuelve `ShowModal` (`mrOk` …): al establecerlo en un formulario, este se cierra; un botón lo establece en su formulario cuando se hace clic en él."
"RFORM.MODIFIED" = "True mientras lo que muestra la ventana tiene cambios sin guardar: macOS dibuja un punto en su botón de cierre y, en un navegador, salir de la página (cerrar la pestaña, recargarla) pregunta antes, con la pregunta propia del navegador. Ponlo en True cuando un documento cambie y en False otra vez cuando se guarde."
"RFORM.NEXT" = "Activa la ventana hija siguiente de un RFormMDI (ActiveNextChild). Un RForm no tiene ventanas hijas MDI (solo es fsNormal), así que allí no ocurre nada."
"RFORM.ONCLICK" = "Se produce cuando el usuario hace clic en el control (o presiona su atajo, o Space o Enter en un botón con el foco)."
"RFORM.ONCLOSE" = "Se produce cuando se cierra el formulario, el puerto o el formulario de acoplamiento. El controlador de eventos de un formulario puede poner su parámetro BYREF Action en `caNone` (0) para mantener abierto el formulario."
"RFORM.ONDBLCLICK" = "Se produce cuando el usuario hace doble clic en el control (en una superficie de diseño: el componente diseñado Index)."
"RFORM.ONDROPFILES" = "Se arrastraron archivos desde la computadora (Finder, File Explorer, un administrador de archivos) y se soltaron en la ventana. Files contiene sus rutas, una por línea (CHR$(10) entre ellas); abre cada una como cualquier archivo. En un navegador, un archivo soltado se lee y pasa a los archivos propios del programa con su mismo nombre, así que Files contiene nombres (\"sales.csv\") que el programa abre de la misma manera. Un formulario sin este controlador de eventos los ignora."
"RFORM.ONHINT" = "Cambió la sugerencia del programa: el mouse llegó a un componente cuya sugerencia no es la última — Hint es la parte posterior a `|` de su Hint (toda si no lo tiene), si no la de su contenedor, y así hasta la del formulario; \"\" sobre ninguno o fuera de las ventanas. Se produce diga lo que diga ShowHint, y la sugerencia se muestra como de costumbre. Un solo controlador de eventos recibe las sugerencias de todos los formularios: el que se asignó último."
"RFORM.ONKEYDOWN" = "Se produce cuando se presiona una tecla mientras el control tiene el foco (Key: el código de tecla virtual; Shift: el estado de Shift, Ctrl y Alt)."
"RFORM.ONKEYPRESS" = "Se produce cuando al presionar una tecla se escribe un carácter mientras el control tiene el foco (Key: el código del carácter)."
"RFORM.ONKEYUP" = "Se produce cuando se suelta una tecla mientras el control tiene el foco (Key: el código de tecla virtual; Shift: el estado de Shift, Ctrl y Alt)."
"RFORM.ONLOAD" = "Se produce cuando se ha cargado el contenido: la página de la vista web, un archivo leído en el navegador."
"RFORM.ONMESSAGE" = "Otro nombre para WndProc (de RapidR): `OnMessage = MySub` en su CREATE (o `Form.OnMessage = MySub`). Es el mismo evento, con los mismos cuatro parámetros, entregado de la misma manera y en los mismos lugares: en Windows, todos los mensajes que Windows envía o deja en la cola de la ventana del formulario; en macOS, Linux y la web, solo los del ícono de la bandeja del sistema del formulario (RNotifyIconData y Shell_NotifyIcon). Si ambos están asignados, el asignado en último lugar recibe los mensajes."
"RFORM.ONMOUSEDOWN" = "Se produce cuando se presiona un botón del mouse sobre el control (Button: `mbLeft`, `mbRight` o `mbMiddle`; X, Y: dentro del control; Shift: el estado de las teclas)."
"RFORM.ONMOUSEMOVE" = "Se produce cuando el mouse se mueve sobre el control (X, Y: dentro del control; Shift: los botones y teclas presionados)."
"RFORM.ONMOUSEUP" = "Se produce cuando se suelta un botón del mouse sobre el control (Button: `mbLeft`, `mbRight` o `mbMiddle`; X, Y: dentro del control; Shift: el estado de las teclas)."
"RFORM.ONPAINT" = "Se produce cuando hay que volver a dibujar el control; lo que se dibuja aquí sobrevive a que lo cubran, a los cambios de tamaño y a los cambios de tema."
"RFORM.ONRESIZE" = "Se produce cuando cambia el tamaño del control, por el usuario, por el programa o por su alineación."
"RFORM.ONSHOW" = "Se produce cuando se muestra el formulario, con Show, ShowModal o `Visible = True`."
"RFORM.ONTIMER" = "Se produce cada vez que pasan Interval milisegundos mientras el temporizador está Enabled (Sender: el temporizador). Los temporizadores siguen avanzando mientras el programa espera."
"RFORM.PAINT" = "Rellena un área a partir de (`x`, `y`) con el color `c` hasta el color de borde `borderc`."
"RFORM.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RFORM.PENCOLOR" = "El color de línea que usan los métodos de dibujo, como &HBBGGRR (el atajo de RapidR para el lápiz)."
"RFORM.PIXEL" = "El color de un píxel, `Pixel(x, y)`, como &HBBGGRR."
"RFORM.POPUPMENU" = "El menú emergente que se muestra cuando el usuario hace clic derecho en el control."
"RFORM.PREVIOUS" = "Activa la ventana hija anterior de un RFormMDI (ActivePreviousChild). Un RForm no tiene ventanas hijas MDI (solo es fsNormal), así que allí no ocurre nada."
"RFORM.PSET" = "Pinta el píxel en (`x`, `y`) con el color `c`."
"RFORM.RECT" = "Dibuja el contorno de un rectángulo. Igual que `Rectangle`."
"RFORM.RECTANGLE" = "Dibuja el contorno del rectángulo (`x1`, `y1`)–(`x2`, `y2`) con el color `c`."
"RFORM.REFRESH" = "Vuelve a dibujar el componente de inmediato; en MySQL, vacía las tablas o cachés del servidor que indica `RefreshFlags`."
"RFORM.REPAINT" = "Vuelve a dibujar el componente."
"RFORM.ROUNDRECT" = "Dibuja un rectángulo (`x1`, `y1`)–(`x2`, `y2`) con las esquinas redondeadas por una elipse de `x3` de ancho y `y3` de alto, con el color `c`."
"RFORM.SAVEIMAGE" = "Guarda lo que muestra el formulario ahora —sus controles tal como están dibujados, a la escala de la pantalla— como una imagen: un archivo PNG (un BMP cuando el nombre termina en .bmp). True si se guardó; False si el formulario no se muestra o no se puede escribir el archivo. Solo las ventanas propias del programa: nunca la pantalla ni las de otro programa. Por ahora, solo en el escritorio."
"RFORM.SETFOCUS" = "Da el foco del teclado al componente."
"RFORM.SETPIXEL" = "Pone un píxel de un color. Igual que `Pset`."
"RFORM.SHAPEFORM" = "Da al formulario el contorno de los píxeles de un mapa de bits que no son TransparentColor (un archivo BMP, o un recurso $RESOURCE): el píxel (x, y) del mapa de bits es el (x, y) de la ventana desde su esquina superior izquierda, con el marco incluido; lo que queda fuera —y fuera del mapa de bits— se recorta, y el mouse alcanza lo que hay detrás. Width, Height y BorderStyle no cambian; el contorno se mantiene cuando se cambia el tamaño del formulario. (Wayland no da a ningún programa una forma de recortar su ventana: allí conserva su rectángulo.)"
"RFORM.SHOW" = "Muestra el componente o formulario; un objeto de ciencia de datos imprime su contenido."
"RFORM.SHOWHINT" = "Muestra la sugerencia `Hint` cuando el mouse se detiene sobre el control; en `Application`, activa o desactiva todas las sugerencias."
"RFORM.SHOWMODAL" = "Muestra el formulario y espera hasta que se cierre; devuelve su resultado modal."
"RFORM.SHOWTITLEBAR" = "Devuelve la barra de título que quitó HideTitleBar: el formulario crece lo que mide esa barra, y su área de cliente queda igual."
"RFORM.STRETCHDRAW" = "Dibuja un mapa de bits escalado para llenar el rectángulo `Rect`."
"RFORM.TEXTHEIGHT" = "Devuelve la altura en píxeles del texto con la fuente actual."
"RFORM.TEXTOUT" = "Escribe el texto `S` en (`x`, `y`) con el color `fc` sobre el fondo `bc` (-1: transparente), con la fuente actual."
"RFORM.TEXTRECT" = "Escribe el texto `S` en (`x`, `y`) con el color `fc` como lo hace TextOut, pero solo se muestra la parte que queda dentro de `Rect` (sin sus bordes derecho e inferior); un color de fondo `bc` rellena primero todo `Rect`, y -1 deja lo que hay."
"RFORM.TEXTWIDTH" = "Devuelve el ancho en píxeles del texto con la fuente actual."
"RFORM.TILE" = "Coloca en mosaico las ventanas hijas de un RFormMDI según TileMode: una sobre otra (SetHorzChild), o una junto a otra (SetVertChild). Un RForm no tiene ventanas hijas MDI (solo es fsNormal), así que allí no ocurre nada."
"RFORM.TILEMODE" = "Cómo dispone Tile las ventanas hijas de un RFormMDI: 0 (tbHorizontal) una sobre otra, 1 (tbVertical) una junto a otra."
"RFORM.TOP" = "La distancia al borde superior del contenedor (en un formulario: el de la pantalla), en píxeles."
"RFORM.UPDATE" = "Pone al día el componente: lo vuelve a dibujar, vuelve a listar sus archivos o vuelve a leer el estado de su dispositivo."
"RFORM.VISIBLE" = "Si el control o formulario se muestra."
"RFORM.WIDTH" = "El ancho, en píxeles; en `Screen`, el de la pantalla."
"RFORM.WINDOWSTATE" = "`wsNormal`, `wsMinimized` o `wsMaximized`."
"RFORM.WNDPROC" = "Los mensajes de Windows al formulario (Hwnd, Msg, wParam, lParam): `WndProc = MySub` en su CREATE (o `Form.WndProc = MySub`). En Windows, todos los mensajes que Windows envía o deja en la cola de la ventana del formulario: los del sistema (WM_SIZE, WM_ACTIVATE, el mouse y las teclas …) y los que envía un programa o un controlador de dispositivo (`PostMessageA(Form.Handle, WM_USER + 1, …)`, MM_MIM_DATA de winmm desde una entrada MIDI abierta con CALLBACK_WINDOW), desde el momento en que se muestra su ventana. Hwnd es el Handle del formulario; Msg, wParam y lParam son números de 32 bits. El controlador de eventos se ejecuta justo después de que Windows haya procesado el mensaje, en el orden en que llegaron los mensajes; lo que devuelve se ignora. En macOS, Linux y la web no hay mensajes de Windows: solo recibe los del ícono de la bandeja del sistema del formulario (RNotifyIconData y Shell_NotifyIcon), de modo que un programa recibe los clics de su ícono."
"RFORMMDI" = "Una ventana MDI principal: un formulario dentro del cual sus ventanas hijas se abren, se acomodan en mosaico o en cascada y se minimizan (AddChild, CascadeChild …)."
"RFORMMDI.ACTIVECHILD" = "Trae al frente la ventana hija MDI de índice `Index`, restaurándola si está minimizada."
"RFORMMDI.ACTIVENEXTCHILD" = "Activa la siguiente ventana hija MDI: la que está al fondo pasa al frente. No ocurre nada con menos de dos."
"RFORMMDI.ACTIVEPREVIOUSCHILD" = "Activa la ventana hija MDI anterior: la activa pasa al fondo. No ocurre nada con menos de dos."
"RFORMMDI.ADDCHILD" = "Añade un hijo: un formulario MDI muestra el formulario con el identificador `handle` como ventana hija (título, índice y lugar); una vista de árbol añade un nodo con el texto `String` bajo el nodo de `Index`."
"RFORMMDI.BRUSHCOLOR" = "El color de relleno que usan los métodos de dibujo, como &HBBGGRR (el atajo de RapidR para el pincel)."
"RFORMMDI.CASCADECHILD" = "Organiza las ventanas hijas MDI en una cascada superpuesta."
"RFORMMDI.CHILDCAPTION" = "El título de la ventana hija MDI activa."
"RFORMMDI.CHILDCOUNT" = "El número de ventanas hijas MDI abiertas; solo lectura."
"RFORMMDI.CHILDEXIST" = "Devuelve true cuando hay abierta una ventana hija MDI con el título indicado."
"RFORMMDI.CHILDHANDLE" = "El identificador de la ventana hija MDI activa; solo lectura."
"RFORMMDI.CHILDHEIGHT" = "La altura de la ventana hija MDI activa, en píxeles."
"RFORMMDI.CHILDICON" = "El ícono que se muestra en las barras de título de las ventanas hijas MDI."
"RFORMMDI.CHILDLEFT" = "El borde izquierdo de la ventana hija MDI activa dentro del área de cliente, en píxeles."
"RFORMMDI.CHILDMAX" = "El máximo de ventanas hijas MDI que admite el formulario (1024)."
"RFORMMDI.CHILDRESULT" = "Ponlo en False en `OnChildClose` para mantener abierta la ventana hija."
"RFORMMDI.CHILDSTATE" = "El estado de la ventana hija MDI activa: 0 normal, 1 minimizada, 2 maximizada."
"RFORMMDI.CHILDTOP" = "El borde superior de la ventana hija MDI activa dentro del área de cliente, en píxeles."
"RFORMMDI.CHILDWIDTH" = "El ancho de la ventana hija MDI activa, en píxeles."
"RFORMMDI.CLOSEALLCHILD" = "Cierra todas las ventanas hijas MDI."
"RFORMMDI.CLOSECHILD" = "Cierra la ventana hija MDI activa."
"RFORMMDI.CLS" = "Borra el área de dibujo con su color de fondo."
"RFORMMDI.COMPONENTINDEX" = "El índice con el que se añadió la ventana hija MDI activa (el tercer argumento de `AddChild`); solo lectura."
"RFORMMDI.DRAWTEXT" = "Dibuja texto en un punto con la fuente actual: `DrawText(text, x, y [, color [, size]])`, con el tamaño en píxeles."
"RFORMMDI.ELLIPSE" = "Dibuja una elipse en el recuadro (`x1`, `y1`)–(`x2`, `y2`) de un color, con relleno cuando sigue un color de relleno."
"RFORMMDI.FILLCIRCLE" = "Dibuja un círculo relleno de radio `r` alrededor de (`cx`, `cy`), con el color del pincel o el color indicado."
"RFORMMDI.FONTCOLOR" = "El atajo de RapidR para `Font.Color`: el color del texto, como &HBBGGRR."
"RFORMMDI.FONTNAME" = "En un cuadro de diálogo de fuente o en un RFont, el nombre de una fuente instalada, `FontName(i)` desde 0; en los demás, el atajo de RapidR para `Font.Name`."
"RFORMMDI.FONTSIZE" = "El atajo de RapidR para `Font.Size`, en puntos."
"RFORMMDI.FREECHILD" = "Devuelve true cuando el formulario con el identificador `handle` no se muestra como ventana hija MDI, de modo que se puede añadir."
"RFORMMDI.GETCHILD" = "Devuelve el índice de la ventana hija MDI con el título indicado, o -1."
"RFORMMDI.ICONARRANGECHILD" = "Alinea los íconos de las ventanas hijas MDI minimizadas."
"RFORMMDI.MAXIMIZEALLCHILD" = "Maximiza todas las ventanas hijas MDI."
"RFORMMDI.MDIMENU" = "El menú que lista las ventanas hijas MDI."
"RFORMMDI.MINIMIZEALLCHILD" = "Minimiza todas las ventanas hijas MDI y alinea sus íconos."
"RFORMMDI.ONCHILDACTIVE" = "Se produce cuando una ventana hija MDI pasa a ser la activa (handleChild: su identificador, index: su número, titleChild: su título)."
"RFORMMDI.ONCHILDCLOSE" = "Se produce cuando se cierra una ventana hija MDI (handleChild: su identificador, index: su número, titleChild: su título)."
"RFORMMDI.ONCHILDRESIZE" = "Se produce cuando se cambia el tamaño de una ventana hija MDI, se maximiza o se restaura (handleChild: su identificador, index: su número, titleChild: su título)."
"RFORMMDI.PENCOLOR" = "El color de línea que usan los métodos de dibujo, como &HBBGGRR (el atajo de RapidR para el lápiz)."
"RFORMMDI.RECT" = "Dibuja el contorno de un rectángulo. Igual que `Rectangle`."
"RFORMMDI.RESTORECHILD" = "Devuelve a todas las ventanas hijas MDI su tamaño y posición normales."
"RFORMMDI.SETDESKBAR" = "Configura la barra del formulario MDI para sus ventanas hijas; RapidR lo acepta y no hace nada."
"RFORMMDI.SETHORZCHILD" = "Coloca en mosaico las ventanas hijas MDI, una sobre otra."
"RFORMMDI.SETPIXEL" = "Pone un píxel de un color. Igual que `Pset`."
"RFORMMDI.SETVERTCHILD" = "Coloca en mosaico las ventanas hijas MDI, una junto a otra."
"RGLASSFRAME" = "Un área de vidrio tintado (el Glassy Form de UtilMind): tiñe lo que hay debajo con su color según Transparency, y arrastra su formulario cuando Moveable lo permite."
"RGLASSFRAME.ALIGN" = "Dónde se acopla el control en su contenedor: una de las constantes `alXXX`. `alNone` conserva su propio lugar; `alClient` llena lo que dejan los demás controles acoplados."
"RGLASSFRAME.CLIENTHEIGHT" = "La altura del área dentro de los bordes (y de la barra de título y el menú de un formulario), en píxeles; en `Screen`, la del área de trabajo, sin la barra de tareas."
"RGLASSFRAME.CLIENTWIDTH" = "El ancho del área dentro de los bordes, en píxeles; en `Screen`, el del área de trabajo, sin la barra de tareas."
