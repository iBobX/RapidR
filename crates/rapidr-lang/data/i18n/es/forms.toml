"RTABCONTROL.HEIGHT" = "La altura, en píxeles; en `Screen`, la de la pantalla."
"RTABCONTROL.HINT" = "La sugerencia que se muestra cuando el mouse se detiene sobre el control (con `ShowHint`)."
"RTABCONTROL.HOTTRACK" = "Resalta el elemento, la pestaña o la sección de encabezado que está bajo el mouse."
