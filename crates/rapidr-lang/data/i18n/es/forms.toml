"RTABCONTROL.ADDTABS" = "Añade pestañas al final, una por cada texto indicado."
"RTABCONTROL.ALIGN" = "Dónde se acopla el control en su contenedor: una de las constantes `alXXX`. `alNone` conserva su propio lugar; `alClient` llena lo que dejan los demás controles acoplados."
"RTABCONTROL.ANCHORS" = "Los bordes de su contenedor a los que el control mantiene su distancia cuando el contenedor cambia de tamaño: akLeft + akTop (el valor predeterminado) no se mueve; añade akRight / akBottom para estirarlo."
"RTABCONTROL.BUTTONSTYLE" = "Dibuja las pestañas como botones en lugar de pestañas."
"RTABCONTROL.CLIENTHEIGHT" = "La altura del área dentro de los bordes (y de la barra de título y el menú de un formulario), en píxeles; en `Screen`, la del área de trabajo, sin la barra de tareas."
"RTABCONTROL.CLIENTWIDTH" = "El ancho del área dentro de los bordes, en píxeles; en `Screen`, el del área de trabajo, sin la barra de tareas."
"RTABCONTROL.COLOR" = "El color de fondo, como &HBBGGRR o un color de sistema `clXXX`; en un cuadro de diálogo de color o de fuente, el color elegido."
"RTABCONTROL.CURSOR" = "El puntero del mouse que se muestra sobre el control: una de las constantes `crXXX`."
"RTABCONTROL.DELTAB" = "Quita la pestaña del índice indicado."
"RTABCONTROL.DELTABS" = "Quita las pestañas de los índices indicados."
"RTABCONTROL.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RTABCONTROL.FLATBUTTONS" = "Con `ButtonStyle`, dibuja planos los botones de las pestañas."
"RTABCONTROL.FLATSEPARATORS" = "La forma de RapidR de escribir `FlatSeperators`."
