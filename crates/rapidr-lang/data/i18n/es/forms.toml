"RTABCONTROL.TABWIDTH" = "En un control de pestañas, el ancho de cada pestaña en píxeles (0: se ajusta al texto); en un cuadro de lista, la distancia entre las tabulaciones de sus elementos."
"RTABCONTROL.TAG" = "Un número para uso propio del programa; RapidR nunca lo lee."
"RTABCONTROL.TOP" = "La distancia al borde superior del contenedor (en un formulario: el de la pantalla), en píxeles."
"RTABCONTROL.VERTICALTABS" = "Coloca las pestañas a un lado en lugar de a lo largo de la parte superior."
