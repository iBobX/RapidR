"RTABCONTROL.WIDTH" = "El ancho, en píxeles; en `Screen`, el de la pantalla."
"RTOOLBAR" = "Una franja de botones de herramientas, normalmente en la parte superior de un formulario: botones con ícono (los íconos de RapidR o las imágenes del programa) con sugerencias, separadores, botones de alternancia y un menú para los botones que no caben. Con Customizable, el usuario elige qué botones se muestran. Propio de RapidR; los componentes colocados en ella van después de sus botones, como en cualquier contenedor."
"RTOOLBAR.ACCESSIBLEDESCRIPTION" = "Una descripción más larga que un lector de pantalla da después del nombre (qué hace el control, un atajo)."
"RTOOLBAR.ACCESSIBLEHIDDEN" = "True: el control es decoración —un punto parpadeante, un adorno— y un lector de pantalla lo omite (sigue en la ventana, para los ojos). Nunca lo establezcas en nada que una persona pueda usar o necesite leer."
