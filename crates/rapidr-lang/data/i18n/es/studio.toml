"RPROJECT.CRASHPATH" = "El archivo de un informe de fallo (\"\" cuando no está)."
"RPROJECT.CRASHPENDING" = "Los informes de fallo de RapidR, escritos solo en esta computadora: el informe más reciente de un RapidR Studio que terminó de forma inesperada —un fallo, un desbordamiento de pila o un bloqueo del que nunca volvió—, que aún no se ha visto (CrashSeen), de un Studio que ya no se ejecuta: su nombre. \"\" cuando no hay ninguno, y en la web."
"RPROJECT.CRASHSAVE" = "Escribe una copia de un informe de fallo en Path. True cuando se escribió; Error dice por qué no."
"RPROJECT.CRASHSEEN" = "Anota un informe de fallo como visto: CrashPending ya no lo da."
"RPROJECT.CRASHTEST" = "El fallo de las pruebas (\"panic\", \"hang\", \"overflow\", \"abort\"), solo con los ganchos de prueba de la GUI; en otro caso no pasa nada y es False."
