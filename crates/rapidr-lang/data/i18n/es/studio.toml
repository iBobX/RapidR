"RPROJECT.CRASHWATCH" = "Inicia el vigilante de bloqueos de RapidR Studio: cuando el hilo de la ventana no ha respondido en Seconds (5), se escribe un informe de bloqueo y una ventana pequeña propia pregunta con Title / Body y los botones Esperar y Salir (Guardar copias y salir), en Theme y Language. Al llamarlo de nuevo: palabras nuevas. True cuando se ejecuta (el escritorio)."
"RPROJECT.DESIGNERGRID" = "El paso de la cuadrícula del diseñador de formularios en píxeles (`[designer] grid`, 8 si el proyecto no dice otra cosa): a lo que se ajusta Snap. Asígnalo y luego Save."
