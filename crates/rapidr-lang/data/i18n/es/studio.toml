"RPROJECT.FOLDER" = "La carpeta del proyecto: las rutas de sus archivos son relativas a ella."
"RPROJECT.FOLLOWCODE" = "Los tipos de los archivos como los dice ahora su código (los formularios vienen del código: un archivo fuente o incluido que crea un formulario en su nivel superior es un archivo de formulario, y uno que ya no lo hace vuelve a ser un módulo o un incluido), leídos de los archivos como están guardados; no se escribe hasta Save. Los archivos cuyo tipo cambió, uno por línea: la ruta y su nuevo tipo, separados por una tabulación (\"\" cuando ninguno cambió)."
"RPROJECT.FULLPATH" = "La ruta del archivo Index para abrirlo (la de la carpeta y la suya propia)."
