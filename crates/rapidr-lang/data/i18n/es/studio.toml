"RPROGRAMSESSION.ONAPP" = "La respuesta de App(Id): Ok es True cuando se hizo, Text lo que se vio o se hizo en una frase (el informe de la disposición en palabras para una disposición) —o lo que hay en su lugar, o por qué no (en pausa, una ventana al frente que espera una respuesta, el programa ocupado o terminado)—. Picture: el PNG de una captura de pantalla, un archivo en la carpeta temporal que solo tú puedes leer (quítalo una vez usado), una URL data: en la web; \"\" cuando no hay ninguna."
