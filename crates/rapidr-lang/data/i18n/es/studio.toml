"RPROGRAMSESSION.REFRESHSHELLPATH" = "Vuelve a leer ahora el PATH de tu shell de inicio de sesión (después de cambiar los archivos de inicio de tu shell): el nuevo ShellPath."
"RPROGRAMSESSION.RUNINBROWSER" = "La compilación web de Program servida en esta computadora (127.0.0.1, una dirección que nadie puede adivinar) y abierta en el navegador predeterminado (el del escritorio; en la web, Error dice que se ejecute aquí). Sus líneas llegan como OnOutput; BrowserURL dice dónde está."
"RPROGRAMSESSION.RUNTOCURSOR" = "El programa se detiene una vez en esa línea (uno en pausa continúa hasta ella; uno detenido se detiene ahí una vez iniciado)."
"RPROGRAMSESSION.SETBREAKPOINT" = "Un punto de interrupción en una línea (desde 1) de un archivo, o sus reglas cambiadas. Condition: solo se detiene cuando eso es verdadero. HitCount: solo en esa vez (3), o >= 3, > 3, <= 3, < 3, % 3 (cada tercera). LogMessage: un punto de registro, que imprime el mensaje ({expression} muestra su valor) y continúa."
"RPROGRAMSESSION.SETNEXTSTATEMENT" = "Establecer la siguiente instrucción: el programa en pausa continúa desde esa línea (una línea sin código: la siguiente que tenga) —dentro de la SUB o FUNCTION en que está en pausa. OnEvaluate(Id, \"\") luego OnStopped(\"goto\", File, Line); OnEvaluate(Id, \"error: …\") cuando no puede. En pausa por un error de ejecución, el programa entonces continúa en lugar de fallar (corrige un valor, vuelve a ejecutar la línea u omítela)."
"RPROGRAMSESSION.SETVARIABLE" = "Una variable del marco seleccionado se establece al valor de una expresión: OnEvaluate(Id, NewValue), luego los valores otra vez (OnVariables(0))."
"RPROGRAMSESSION.SHELLPATH" = "El PATH que reciben los programas que se ejecutan desde aquí, y sus llamadas SHELL y RUN: en macOS y Linux, el de tu shell de inicio de sesión (una aplicación iniciada desde el Dock o Finder tiene uno corto, así que php, curl o las herramientas de Homebrew no se encontrarían), leído una vez (ReadShellPath) con tres segundos para responder; cuando no puede decirlo, el PATH de este proceso y las carpetas habituales que existen (las de Homebrew, /usr/local/bin, ~/.cargo/bin …). \"\" donde el PATH no se cambia: Windows (sus aplicaciones tienen el completo) y la web. Solo se lee: los archivos de tu shell nunca se escriben."
"RPROGRAMSESSION.SHELLPATHSOURCE" = "De dónde vino ShellPath, en palabras: tu shell de inicio de sesión, o por qué no pudo decirlo y se añadieron las carpetas habituales."
"RPROGRAMSESSION.SHOWPROGRAM" = "Trae al frente las ventanas del programa en ejecución o en pausa y lo convierte en la aplicación activa (el Mostrar la ventana del programa de un IDE; RapidR Studio lo hace también en Continue): en el escritorio el IDE da el primer plano a su proceso en la medida en que el sistema lo permite (no en Wayland), en la web su marco recibe el teclado. Las ventanas de un programa en pausa se muestran, se mueven y pasan al frente, pero no reciben clics ni teclas hasta que continúa. False cuando no se ejecuta nada o no pudo."
"RPROGRAMSESSION.STACKTRACE" = "La pila de llamadas como la obtuvo la última parada, la más interna primero: una línea cada una, con su nombre, archivo y línea separados por tabulaciones."
"RPROGRAMSESSION.START" = "Ejecuta Program. True cuando se inició; Error dice por qué no."
"RPROGRAMSESSION.STATE" = "\"stopped\", \"running\" o \"paused\"."
"RPROGRAMSESSION.STEPIN" = "Ejecuta una instrucción, entrando en la SUB o FUNCTION a la que llama."
"RPROGRAMSESSION.STEPINTARGET" = "Entrar en la llamada específica: en la llamada a esa SUB o FUNCTION (un id de OnStepInTargets) que hace la línea en pausa; una línea que no la hace se pasa por encima."
"RPROGRAMSESSION.STEPINTARGETS" = "Las opciones de Entrar en la llamada específica: las SUB y FUNCTION a las que la línea en pausa todavía llama, en el orden en que las llama — OnStepInTargets(Targets)."
"RPROGRAMSESSION.STEPOUT" = "Ejecuta hasta el final de la SUB o FUNCTION y se detiene después de su llamada."
"RPROGRAMSESSION.STEPOVER" = "Ejecuta una instrucción, una llamada completa."
"RPROGRAMSESSION.STOP" = "Termina el programa de inmediato."
"RPROGRAMSESSION.STOPBROWSER" = "Termina lo que sirve RunInBrowser."
"RPROGRAMSESSION.STOPMESSAGE" = "El mensaje de un error de ejecución, cuando esa es la razón de la pausa."
"RPROGRAMSESSION.STOPONENTRY" = "Se detiene en la primera instrucción del programa cuando este inicia."
"RPROGRAMSESSION.STOPREASON" = "Por qué se pausó: \"breakpoint\", \"step\", \"pause\", \"entry\" o \"exception\"."
"RPROGRAMSESSION.THEME" = "El aspecto con que se dibuja el programa cuando no nombra ninguno (cualquier nombre que acepta `$THEME`; \"\" su valor predeterminado, el aspecto de RapidR): `classic` lo muestra en vista previa con el aspecto clásico."
"RPROGRAMSESSION.VARIABLES" = "Los valores de Ref tal como se obtuvieron (LocalsRef, GlobalsRef, los hijos de un valor después de Expand): una línea cada uno, separados por tabulaciones: su nombre, valor, tipo, referencia de sus hijos (0: ninguno) y cantidad, la expresión que lo nombra (a(2).Name, Form1.Caption), 1 cuando su valor cambió desde la última parada, las columnas de una tabla y las celdas de una fila de tabla (de un RDataFrame; CHR$(31) entre ellas), y lo que el registro sabe de una propiedad (`color`, `handle`, `bool`, `const:alClient`, `choices:alNone|alTop|…`, `readonly`, separados por comas: el Hint de TreeView.SetItemValue)."
"RPROGRAMSESSION.WATCHES" = "Las expresiones de observación, una por línea: se evalúan en cada parada (WatchValues)."
"RPROGRAMSESSION.WATCHVALUES" = "Cada expresión de observación con su valor en esta parada: una línea cada una, su expresión, valor, tipo, referencia de sus hijos, 1 cuando su valor cambió desde la última parada, y cuántos hijos tiene, separados por tabulaciones."
"RPROJECT" = "Un proyecto de RapidR: un archivo .rrproj (formato 2, o los proyectos v1 del IDE web), o un archivo fuente (.rr, .bas, .rqw, .rqb, .rq) con los archivos que incluye con $INCLUDE. Lista los archivos del proyecto y sus tipos, añade y quita archivos, guarda el archivo del proyecto y crea proyectos nuevos a partir de plantillas. RapidR Studio se basa en él."
"RPROJECT.ADDFILE" = "Añade un archivo (su tipo según su nombre y su código —un archivo que crea un formulario es un archivo de formulario—, o Kind: module, form, include, resource, asset, data). True cuando se añadió."
"RPROJECT.APPLYBEGIN" = "Empieza una aplicación de cambios (la de RAI: todo o nada): todavía no se escribió nada que ApplyUndo deba quitar."
"RPROJECT.APPLYUNDO" = "Quita los archivos y las carpetas que WriteNewFile hizo desde ApplyBegin (las carpetas que ya estaban se quedan): una aplicación de cambios que no pudo terminar deja el proyecto como estaba. Las rutas quitadas, una por línea."
"RPROJECT.APPNAME" = "El nombre de la aplicación, como lo muestran Finder, el Explorador de archivos y el menú de aplicaciones; \"\" para el Name del proyecto."
"RPROJECT.BUILD" = "Hace del programa una aplicación para el sistema de esta computadora con rapidr build —una compilación de lanzamiento, optimizada— en OutputFolder: Name.app en macOS, el .exe con su ícono y su versión en Windows, Name.AppDir en Linux. Kind es \"native\" o \"interpreted\" (si no, BuildKind). Se ejecuta en segundo plano: OnBuildOutput da sus líneas, OnBuildDone su final. True cuando se inició; Error dice por qué no (en la web no hay nada que lo ejecute)."
"RPROJECT.BUILDING" = "True mientras se ejecuta Build."
"RPROJECT.BUILDKIND" = "Cómo hace Build el programa: \"native\" (compilado con Rust) o \"interpreted\" (el ejecutor de RapidR y el bytecode del programa; no se necesita Rust)."
"RPROJECT.BUILTPATH" = "Lo que hizo la última Build: el .app, el .exe o el AppDir (\"\" hasta que una tenga éxito)."
"RPROJECT.BUNDLEID" = "El identificador de DNS inverso de la aplicación (com.example.notepad); \"\" para dev.rapidr.app.<name>."
"RPROJECT.CANWRITENEWFILE" = "Si se puede escribir un archivo nuevo en Path: todavía no hay nada ahí, y su carpeta existe o se puede crear (la carpeta más cercana por encima que existe es una carpeta, no un archivo, y se puede escribir en ella). Error dice por qué no. No se escribe nada."
"RPROJECT.CHANGEDONDISK" = "True cuando el archivo del disco en Path ya no es lo que el programa leyó o escribió por última vez (Watch): cambiado o eliminado fuera de él. RapidR Studio pregunta antes de que un Guardar lo sobrescriba."
"RPROJECT.CLOSE" = "Ya no hay ningún proyecto abierto."
"RPROJECT.COMPANY" = "Quién hace la aplicación (el nombre de la empresa en Windows, la línea de derechos de autor)."
"RPROJECT.COMPATMODE" = "\"rapidq\" para un proyecto que se mantiene compatible con el lenguaje clásico (se informan las extensiones de RapidR), si no, \"\"."
"RPROJECT.COPYEXAMPLEAGAIN" = "Copia el ejemplo de nuevo sobre la copia de la persona (Path: la copia, o el ejemplo): su programa y sus archivos incluidos y de datos tal como vienen con RapidR reemplazan los de la copia; los archivos que añadió la persona se quedan. El archivo principal de la copia; \"\" cuando no puede (Error dice por qué)."
"RPROJECT.CRASHCALL" = "Anota una llamada de IA o de MCP solo por su nombre (\"MCP: run_program\") para un informe de fallo (las últimas 12, solo en memoria)."
"RPROJECT.CRASHDOING" = "Anota lo que Studio está haciendo (el id de un comando) para un informe de fallo o de bloqueo (solo en memoria)."
"RPROJECT.CRASHFIELD" = "Una línea de la cabecera de un informe de fallo: Kind (crash, thread-panic, stack-overflow, fatal, hang), App, Message, Where (el archivo, la línea, la SUB y el evento del programa de RapidR), RapidR code, Doing, File, Thread, Outcome, When, RapidR, System, Process — o Headline, su primera frase."
"RPROJECT.CRASHFOLDER" = "La carpeta de fallos de RapidR: ~/Library/Application Support/RapidR/crashes (macOS), %APPDATA%\\RapidR\\crashes (Windows), ~/.local/share/rapidr/crashes (Linux); RAPIDR_CRASH_DIR, o crashes en RAPIDR_STUDIO_DATA, cuando están definidas. Los informes de más de 30 días, y los que pasan de los 20 más recientes, se quitan. \"\" en la web."
"RPROJECT.CRASHFORPROGRAM" = "El informe de fallo que escribió RapidR cuando detuvo una ejecución de File (el archivo principal de un programa) iniciada en Since (CrashMark) —un fallo en el propio código de RapidR, un desbordamiento de pila—: su nombre; \"\" cuando no hay ninguno."
"RPROJECT.CRASHISSUEURL" = "La página de nueva incidencia de RapidR en GitHub rellenada a partir de un informe de fallo: un título y un cuerpo breve, con el informe completo cuando la dirección sigue siendo lo bastante corta (CrashIssueWhole), si no, pidiendo pegar el informe copiado. Abrirla no envía nada: la persona la lee en GitHub (se necesita una cuenta) y decide."
