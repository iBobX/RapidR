"RPROJECT.INCLUDEFOLDERS" = "Las carpetas de inclusión, una por línea: donde $INCLUDE busca después de la carpeta del propio programa para cada programa que Open, Run, Build e ImportRapidQ compilan — Configuración > Carpetas de inclusión de RapidR Studio. Los programas que se ejecutan desde aquí también las reciben."
"RPROJECT.INCLUDEREMOVEEDIT" = "La línea `$INCLUDE` del programa principal para el archivo de proyecto Path, quitada (el archivo sale del proyecto), como una línea de RCODEEDITOR.ApplyPatches; \"\" cuando MainText no lo incluye."
