"RMARKDOWNVIEW.OPENLINK" = "Abre un enlace web (http, https, mailto) en el navegador, como lo hace un clic en uno del texto: para una etiqueta de enlace junto a la vista. True cuando era un enlace web."
"RMARKDOWNVIEW.OPENLINKS" = "Un clic en un enlace web (http, https, mailto) lo abre en el navegador. Cada enlace en que se hace clic produce OnLinkClick de todos modos."
"RMARKDOWNVIEW.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RMARKDOWNVIEW.PLAINTEXT" = "El texto como se muestra, sin las marcas de Markdown: una línea por párrafo, elemento de lista o encabezado; las celdas de una tabla separadas por tabulaciones."
"RMARKDOWNVIEW.SCROLLTO" = "Desplaza un encabezado hasta arriba, nombrado por su ancla (\"#getting-started\") o por su texto —o el párrafo con un enlace a ese destino, como está escrito—: True cuando hay uno."
"RMARKDOWNVIEW.SELECTALL" = "Selecciona todo el texto."
"RMARKDOWNVIEW.SELTEXT" = "El texto que seleccionó la persona, como lo tiene PlainText."
"RMARKDOWNVIEW.SETFOCUS" = "Da a la vista el foco del teclado: sus teclas la desplazan, Tab recorre sus enlaces."
"RMARKDOWNVIEW.TEXT" = "El texto Markdown que se muestra (CommonMark, con las tablas de GitHub y ~~tachado~~)."
"RMARKDOWNVIEW.TOP" = "La distancia al borde superior del contenedor (en un formulario: el de la pantalla), en píxeles."
