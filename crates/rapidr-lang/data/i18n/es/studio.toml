"RPROJECT.EXAMPLETOOPEN" = "El archivo que se abre para Path: cuando es uno de los ejemplos de RapidR (en la carpeta Examples) donde RapidR está instalado (la aplicación de macOS, /usr/lib/rapidr, Program Files: un Home con su release.toml) o donde no se puede cambiar, la copia de la persona en Documents/RapidR/Examples/<su nombre>/ —hecha ahora con sus archivos incluidos y de datos (los archivos que toma `rapidr examples copy`), o la copia que ya estaba, nunca sobrescrita (ExampleCopy dice cuál)—; si no, el propio Path. \"\" cuando no se puede hacer la copia (Error dice por qué). En la web, el propio Path: el almacén de la página guarda lo que guarda la persona."
"RPROJECT.EXTERNALCHANGES" = "Los archivos vigilados que cambiaron en el disco desde la última revisión, uno por línea: lo que pasó (\"changed\", \"deleted\", o \"back\": otra vez ahí después de eliminarse), una tabulación, la ruta; cada cambio se dice una vez, todos los de una revisión juntos (doce archivos que un agente de IA o git reescribió llegan a la vez). Tocar un archivo sin cambiar sus bytes no es un cambio. \"\" cuando nada cambió, y siempre en la web."
