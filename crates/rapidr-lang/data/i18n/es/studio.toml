"RPROGRAMSESSION" = "Una ejecución de un programa en desarrollo, como la ejecuta un IDE: en su propio proceso en el escritorio (sus formularios son ventanas reales), en un marco aislado (sandbox) en la web. Iniciar, detener, pausar, avanzar paso a paso, puntos de interrupción (con condiciones, número de veces y mensajes de registro), la pila de llamadas, las variables, las expresiones de observación y la evaluación; su salida y sus paradas llegan como eventos. Lo que muestra el depurador se obtiene en cada parada antes de OnStopped, así que se puede leer de inmediato."
"RPROGRAMSESSION.APP" = "Los ojos y las manos sobre el programa en ejecución, como JSON: un vistazo —{\"do\":\"screenshot\"} (\"window\", \"scale\": \"screen\" o \"1x\", \"frame\"), {\"do\":\"layout\"}— o una entrada reproducida en sus propias ventanas como la de una persona —{\"do\":\"click\",\"caption\":\"7\"} (o \"name\", \"label\", \"window\" con \"x\" e \"y\"; \"double\", \"button\"), \"type\" (\"text\"), \"key\" (\"keys\": \"Ctrl+S\"), \"drag\" (\"to_x\", \"to_y\"), \"scroll\" (\"dy\"), \"wait\" (\"ms\", \"idle\")— con el puntero virtual que la muestra. Devuelve de inmediato el Id de la solicitud; OnApp(Id, Ok, Text, Picture) la responde: un vistazo, de inmediato, con el programa en pausa o no; la entrada, una vez que se ejecutaron los controladores que inició, y se rechaza mientras el programa está en pausa. Solo las ventanas del propio programa: nunca el mouse, el teclado ni la pantalla del sistema."
"RPROGRAMSESSION.ARGS" = "Sus argumentos de línea de comandos, como los lee COMMAND$ (los espacios los separan, las comillas conservan los espacios)."
"RPROGRAMSESSION.BREAKONERROR" = "Se detiene en la instrucción de un error de ejecución (StopReason \"exception\", StopMessage el error)."
"RPROGRAMSESSION.BROWSERURL" = "Dónde sirve RunInBrowser el programa (solo en esta computadora), una vez que lo hace."
"RPROGRAMSESSION.CLEARBREAKPOINT" = "Quita un punto de interrupción."
"RPROGRAMSESSION.CLEARBREAKPOINTS" = "Quita los puntos de interrupción de un archivo (los de todos los archivos si no se da ninguno)."
"RPROGRAMSESSION.COMPONENTSREF" = "Los componentes del programa que ningún otro contiene (sus formularios, marcos, temporizadores …) como un ámbito para Variables: cada uno se abre a sus propiedades y a los componentes que contiene."
"RPROGRAMSESSION.CONTINUE" = "Deja que un programa en pausa continúe."
"RPROGRAMSESSION.CURRENTFILE" = "Dónde está en pausa el programa: su archivo."
"RPROGRAMSESSION.CURRENTLINE" = "Dónde está en pausa el programa: su línea (desde 1; 0 cuando no está en pausa)."
"RPROGRAMSESSION.DEBUG" = "Ejecuta bajo el depurador: los puntos de interrupción lo detienen y el paso a paso funciona."
"RPROGRAMSESSION.ERROR" = "Por qué falló el último Start (u otra solicitud)."
"RPROGRAMSESSION.EVALUATE" = "Evalúa en el marco seleccionado del programa en pausa: su respuesta llega como OnEvaluate(Id, Result, Kind, Ref, Count, Columns) con el Id devuelto (Ref: sus hijos, para Expand). Context \"repl\" (el de la ventana Inmediato): \"? expression\" da su valor, una instrucción se ejecuta; \"clipboard\": el valor completo, como texto sin formato (una cadena larga sin cortar); \"hover\": el de una sugerencia de datos, rechazado cuando llamaría a una SUB, una FUNCTION o un método."
"RPROGRAMSESSION.EXITCODE" = "El código de salida de la última ejecución."
"RPROGRAMSESSION.EXPAND" = "Obtiene los hijos de un valor —los elementos de un arreglo, los campos de un TYPE, las propiedades de un componente y los componentes que contiene, las filas de un RDataFrame (cada una se abre a sus celdas), los números de un RNum—, los primeros 100: OnVariables(Ref) cuando ya están."
"RPROGRAMSESSION.EXPANDMORE" = "Obtiene los siguientes 100 hijos de un valor desde Start (un arreglo, una tabla de datos o un RNum grandes se obtienen por páginas): se añaden a Variables(Ref), luego OnVariables(Ref)."
"RPROGRAMSESSION.FRAME" = "El marco seleccionado de la pila de llamadas (0: donde está en pausa; 1: quien lo llamó …). Al asignarlo se obtienen de nuevo las variables locales de ese marco y las expresiones de observación, luego OnVariables(0)."
