# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/components/studio.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"RAIPROJECTTOOLS" = "Un proyecto como herramientas para un RAI (docs/ide-ai.md): conectado con AI.AttachComponent Tools, \"project\", el modelo puede listar y leer los archivos del proyecto (solo dentro de ProjectFolder; el texto sin guardar de un editor cuando SetFile lo dio), listar los componentes de los formularios y leer sus propiedades, describir los componentes y las funciones integradas de RapidR, y ejecutar el compilador sobre código, cada cosa cuando la necesita y nunca el proyecto entero de una vez; con Permission \"propose\" también propone cambios a archivos y programas nuevos, que se guardan aquí como propuestas que el programa muestra como diferencias: no se escribe nada hasta que la persona aplica una. Lo que lee va al modelo como datos, nunca como instrucciones. El asistente de RapidR Studio es un RAI con estas herramientas."
"RAIPROJECTTOOLS.ADDRUNOUTPUT" = "Más salida del programa en ejecución (a medida que la imprime): RunOutput conserva sus últimas 20 líneas para el modelo."
"RAIPROJECTTOOLS.ALLOWPROGRAMUSE" = "La respuesta de la persona a la tarjeta de RAI (ProgramUseAsked): True: RAI puede mirar el programa en ejecución, hacer clic y escribir en él hasta que termine esta ejecución, y las llamadas que esperaban continúan; False: no en esta respuesta (se le avisa a RAI, que vuelve a preguntar en una posterior). Sin una pregunta en espera no hace nada."
"RAIPROJECTTOOLS.APPLIEDTEXT" = "Lo que se le dice a una aplicación de IA una vez que su cambio se aplicó de inmediato: Said es la respuesta de la herramienta (\"Waiting for the user to apply … / It compiles.\"), Files los archivos cambiados. Una frase sobre el cambio (\"Changed main.rr in Studio's editor (not on disk yet: Run saves it …)\"), luego el resto de la respuesta —si compila, qué corregir— y nunca \"changed\" y \"waiting for the user\" a la vez."
"RAIPROJECTTOOLS.AUDITCALL" = "Escribe la llamada de una aplicación de IA en el registro de auditoría que usa el asistente (junto a la configuración de Studio, nunca en el proyecto): cuándo, qué aplicación de IA, qué herramienta, el archivo del proyecto que tocó (nunca su texto) y cómo salió."
"RAIPROJECTTOOLS.AUDITCALLS" = "Las últimas Count llamadas de aplicaciones de IA del registro de auditoría (50 por defecto), la más antigua primero, una línea cada una, separadas por tabulaciones: la hora, la aplicación de IA, la herramienta, su objetivo y cómo salió."
"RAIPROJECTTOOLS.AUDITLOCATION" = "Dónde está el registro de auditoría, en palabras (~/Library/Application Support/RapidR/ai-audit.jsonl en macOS)."
"RAIPROJECTTOOLS.CALLFAILED" = "True cuando el último CallTool falló (su texto dice por qué: la aplicación de IA lo lee y puede intentarlo de nuevo)."
"RAIPROJECTTOOLS.CALLNOTE" = "Lo que hizo el último CallTool, en una línea (\"Read main.rr (40 lines)\", \"Proposed a change to main.rr\"): para un registro de actividad."
"RAIPROJECTTOOLS.CALLRISK" = "Qué tipo de acción es la del último CallTool: \"read\", \"proposal\" …"
"RAIPROJECTTOOLS.CALLTARGET" = "El archivo del proyecto (relativo) o el nombre que tocó el último CallTool; \"\" si ninguno."
"RAIPROJECTTOOLS.CALLTOOL" = "Ejecuta una herramienta para una aplicación de IA —una externa, a través del RMcpServer de un programa— sobre el proyecto y los cambios que esperan a la persona (sin una conversación alrededor): su texto, para la aplicación de IA. Lo que proponen las herramientas que proponen espera a la persona, como lo del asistente (ProposalCount …): no se escribe nada. Una ruta nunca es un archivo ni una carpeta ocultos, y en un proyecto cuya carpeta es una carpeta personal o la raíz de un disco solo se alcanzan los archivos listados del proyecto. CallFailed, CallNote, CallTarget y CallRisk dicen cómo salió."
"RAIPROJECTTOOLS.CHATLIST" = "Los chats guardados del proyecto de la carpeta Project (\"\": sin proyecto), el más reciente primero, una línea cada uno, separados por tabulaciones: su id, su título, cuándo se cambió por última vez (ISO 8601, UTC) y cuántas preguntas tiene."
"RAIPROJECTTOOLS.CHATSFOLDER" = "Dónde se guardan los chats del proyecto, en palabras: la carpeta de datos de Studio (nunca la del proyecto), chats/ junto a su configuración — ~/Library/Application Support/RapidR/chats en macOS, %APPDATA%\\RapidR\\chats en Windows, ~/.config/rapidr/chats en Linux; el almacenamiento de este navegador para la página en la web."
"RAIPROJECTTOOLS.CHATTITLE" = "El título de un chat hecho con su primera pregunta: su primera línea, de 48 caracteres como máximo."
"RAIPROJECTTOOLS.CLEARAUDIT" = "Quita del registro de auditoría las llamadas de las aplicaciones de IA (las líneas del propio asistente se quedan): True cuando se escribió."
"RAIPROJECTTOOLS.CLEARDECIDED" = "Olvida las propuestas sobre las que la persona decidió (después de aplicar una revisión): lo que queda espera una decisión."
"RAIPROJECTTOOLS.CLEARFILES" = "Olvida los textos de los editores que dio SetFile: los archivos se leen de su almacén."
"RAIPROJECTTOOLS.CLEARPROPOSALS" = "Olvida las propuestas."
"RAIPROJECTTOOLS.COMPATMODE" = "\"rapidq\" para un proyecto que se mantiene compatible con el lenguaje clásico: al modelo se le dice que escriba solo el lenguaje clásico."
"RAIPROJECTTOOLS.CREATEDFOLDER" = "La carpeta que hizo el último CreateProject (\"\" cuando no hizo ninguna, o una vez que se deshizo)."
"RAIPROJECTTOOLS.CREATEDTITLE" = "El título del programa que hizo el último CreateProject, como lo nombró el modelo (\"Scientific Calculator\")."
"RAIPROJECTTOOLS.CREATEPROJECT" = "Escribe en Folder el proyecto nuevo que propuso el modelo, en una carpeta con nombre tomado de su título (\"Scientific Calculator\" → ScientificCalculator; nunca sobre una que ya existe: entonces ScientificCalculator2, 3 …), con un archivo de proyecto que lo nombra por su título: la ruta de ese archivo, para abrirlo; \"error: \" y el motivo cuando no pudo. Lo que escribió se guarda para poder deshacerlo."
"RAIPROJECTTOOLS.DECIDE" = "Registra la decisión de la persona sobre la propuesta Index en la conversación de RAI y en el registro de auditoría, una sola vez: \"applied\", \"partly\", \"rejected\", \"stale\" (no aplicada: el archivo cambió después de que el asistente lo leyó) o \"failed\" (no aplicada: su editor rechazó el cambio). Una propuesta ya decidida se deja como estaba: nada se dice dos veces."
"RAIPROJECTTOOLS.DELETECHAT" = "Elimina para siempre un chat guardado (su archivo; en la web, su elemento): lo que era, para RestoreChat (deshacer); \"\" cuando no había ninguno."
"RAIPROJECTTOOLS.LAYOUTREPORT" = "Los formularios del proyecto tal como los hace su código fuente, en palabras: el área cliente de cada formulario, el lugar y el tamaño de cada componente (o que Align lo coloca), luego lo que parece estar mal: un control cortado por su formulario, dos uno encima del otro, un texto más largo que su botón."
"RAIPROJECTTOOLS.LITE" = "True mientras la ventana del modelo es pequeña (menos de 16 384 tokens): se envían las instrucciones y las herramientas reducidas."
"RAIPROJECTTOOLS.LOADCHAT" = "El estado de un chat guardado, para el ChatState de un RAI (\"\" cuando no hay ninguno)."
"RAIPROJECTTOOLS.MAINFILE" = "El archivo principal del proyecto, relativo a ProjectFolder."
"RAIPROJECTTOOLS.PATCH" = "La línea de RCODEEDITOR.ApplyPatches que convierte OldText en NewText (las líneas cambiadas reemplazadas, los saltos de línea del propio archivo conservados): al aplicarla, el cambio es un solo paso de deshacer. \"\" cuando son iguales."
"RAIPROJECTTOOLS.PERMISSION" = "Lo que puede hacer el modelo: \"propose\" (leer el proyecto y proponer cambios, que se muestran como diferencias sobre las que decide la persona) o \"read-only\" (leer y responder; las herramientas que proponen no se ofrecen)."
"RAIPROJECTTOOLS.PROGRAMUSEASKED" = "True mientras RAI espera la respuesta de la persona a su tarjeta en el chat: quiere mirar o usar el programa en ejecución (una vez por ejecución: \"Allow for this run\" o \"Don't allow\"); AllowProgramUse la responde."
"RAIPROJECTTOOLS.PROJECTERRORS" = "Cuántos errores de compilación tiene el programa nuevo que se propuso y aún no se creó (0: compila)."
"RAIPROJECTTOOLS.PROJECTFILES" = "Los archivos del proyecto, uno por línea, relativos a ProjectFolder (lo que list_files da al modelo)."
"RAIPROJECTTOOLS.PROJECTFOLDER" = "La carpeta del proyecto: los archivos se leen solo dentro de ella (\"\": sin proyecto)."
"RAIPROJECTTOOLS.PROJECTNAME" = "El nombre del proyecto, como se le dice al modelo."
"RAIPROJECTTOOLS.PROPOSALCOUNT" = "Cuántas propuestas hay: los cambios a archivos que esperan la decisión de la persona (propuestos en la última respuesta o en una anterior; uno cuyo archivo cambió la persona entretanto se aparta en la siguiente pregunta, y se dice), o los archivos de un proyecto nuevo."
"RAIPROJECTTOOLS.PROPOSALINFO" = "La propuesta Index (desde 0), separada por tabulaciones: su tipo (\"edit\": un archivo cambiado, \"create\": un archivo nuevo del proyecto, \"project\": un archivo de un proyecto nuevo), su ruta, su resumen, el nombre del proyecto nuevo, True para el archivo principal del proyecto nuevo, y la decisión de la persona (\"\", \"applied\", \"partly\", \"rejected\", \"created\")."
"RAIPROJECTTOOLS.PROPOSALNEW" = "El archivo de la propuesta Index tal como se propuso: el RightText de un RDiffView."
"RAIPROJECTTOOLS.PROPOSALOLD" = "El archivo de la propuesta Index como era (\"\" para un archivo nuevo): el LeftText de un RDiffView."
"RAIPROJECTTOOLS.RENAMECHAT" = "Da a un chat guardado el título que escribió la persona (se conserva desde entonces). True cuando se renombró."
"RAIPROJECTTOOLS.RESTORECHAT" = "Vuelve a poner un chat que DeleteChat eliminó (deshacer): su id."
"RAIPROJECTTOOLS.REVIEWFIRST" = "True: un programa nuevo espera a que se vea una vista previa y se cree (la opción de RapidR Studio \"Ask before the assistant creates or changes files\"); False: el programa lo crea cuando termina la respuesta, y al modelo se le dice."
"RAIPROJECTTOOLS.RUNOUTPUT" = "El final de la salida de la última ejecución (sus últimas 20 líneas), que se muestra al modelo como datos del programa, nunca como instrucciones: sus errores y advertencias, para que no tenga que adivinar qué pasó. Al asignarla la reemplaza (\"\": una ejecución nueva); AddRunOutput le añade. Las claves que aparezcan en ella se ocultan al modelo."
"RAIPROJECTTOOLS.SAVECHAT" = "Guarda un chat del proyecto (State: el ChatState de un RAI) en la carpeta de datos de Studio —uno nuevo cuando Id es \"\"—, sin claves de API ni tokens: su id; \"error: \" y el motivo cuando no pudo. Un título que dio la persona (RenameChat) se conserva."
"RAIPROJECTTOOLS.SEARCHCHATS" = "Los chats del proyecto cuyo título o texto contiene Text (en mayúsculas o minúsculas), como los da ChatList, con un quinto campo: la primera línea que lo contiene (\"\" cuando es el título)."
"RAIPROJECTTOOLS.SERVERINSTRUCTIONS" = "Lo que el servidor MCP de un programa (RMcpServer.Instructions) le dice a la aplicación de IA que se conecta: cómo trabajar con las herramientas de este proyecto —usar find_example primero, partir de la receta, revisar con check_code después de cada escritura, leer la sugerencia bajo un error, y recordar que el proyecto abierto es el programa de la persona— y una tarjeta breve del lenguaje (las reglas que los modelos pequeños rompen más). Se mantiene por debajo de unos 1 200 tokens."
"RAIPROJECTTOOLS.SETFILE" = "El texto de un archivo tal como lo tiene su editor, con los cambios sin guardar: lo que el modelo lee de él (Path dentro de ProjectFolder)."
"RAIPROJECTTOOLS.STATUSNEXT" = "El siguiente paso para la aplicación de IA, para el final de un texto de estado: \"This project is empty: call find_example first …\" cuando el proyecto aún no tiene código, qué hacer cuando no hay ninguno abierto, y si no, cómo continuar (read, propose_edit, check_code)."
"RAIPROJECTTOOLS.TOOLACTIVITY" = "Una llamada en palabras, para un registro de actividad: \"Reading main.rr\", \"Checking (compiling)\", \"Writing a change\" (Arguments: los de la llamada, como JSON)."
"RAIPROJECTTOOLS.TOOLDESCRIPTION" = "La descripción de una herramienta, como la lee el modelo (el Description de RMcpServer.AddTool)."
"RAIPROJECTTOOLS.TOOLKIND" = "Cómo actúa una herramienta: \"read\", o \"change\" para las que proponen cambios (el Kind de RMcpServer.AddTool)."
"RAIPROJECTTOOLS.TOOLNAMES" = "Las herramientas que una aplicación de IA puede llamar a través del servidor MCP de un programa (RMcpServer), las que recibe un RAI conectado, un nombre por línea: con Permission \"read-only\", solo las de lectura."
"RAIPROJECTTOOLS.TOOLSCHEMA" = "El JSON Schema de los argumentos de una herramienta (el Schema de RMcpServer.AddTool)."
"RAIPROJECTTOOLS.UNDOCHECK" = "Lo que cambió en la carpeta que hizo CreateProject desde que la escribió, en palabras sencillas (\"main.rr was changed; notes.txt was added\"); \"\" cuando no cambió nada: entonces deshacer no necesita preguntar."
"RAIPROJECTTOOLS.UNDODONE" = "Después de quitar los archivos de UndoFiles: las carpetas que hizo CreateProject, cada una solo cuando está vacía, y el deshacer dicho en la conversación. True cuando la carpeta del programa ya no existe (False: los archivos que añadió la persona la conservan)."
"RAIPROJECTTOOLS.UNDOFILES" = "Los archivos que escribió CreateProject, una ruta completa por línea, cada una comprobada como dentro de su carpeta: todo lo que quita deshacer (KILL a cada uno). Nunca un archivo que añadió la persona."
"RCOMMANDPALETTE" = "Un cuadro de comandos que se encuentran escribiendo: Show lo abre sobre el formulario, la persona escribe unas letras de un comando (en cualquier orden de sus palabras, saltándose letras), elige uno con las flechas y Enter, y OnCommand dice cuál. Cada comando muestra su atajo; los usados más recientemente van primero."
"RCOMMANDPALETTE.ACCESSIBLEDESCRIPTION" = "Una descripción más larga que un lector de pantalla da después del nombre (qué hace el control, un atajo)."
"RCOMMANDPALETTE.ACCESSIBLEHIDDEN" = "True: el control es decoración —un punto parpadeante, un adorno— y un lector de pantalla lo omite (sigue en la ventana, para los ojos). Nunca lo establezcas en nada que una persona pueda usar o necesite leer."
"RCOMMANDPALETTE.ACCESSIBLENAME" = "Cómo llama un lector de pantalla al control, cuando su título o texto no basta (un botón de imagen, un campo de edición sin etiqueta)."
"RCOMMANDPALETTE.ADDCOMMAND" = "Añade un comando (o cambia el que tiene ese Id): su título, su atajo tal como se muestra (\"Ctrl+Shift+P\"), una categoría que se antepone al título (\"File: \"), un ícono."
"RCOMMANDPALETTE.ADDPREFIX" = "Al escribir primero Prefix (\":\", \"#\" …) se muestra, en lugar de la lista, un comando hecho con lo que lo sigue: su título es Title con {} reemplazado por ese texto (\"Go to line {}\"), su id es Prefix y el texto (\":42\"), que OnCommand da. Un Title vacío quita el prefijo."
"RCOMMANDPALETTE.CLEAR" = "Quita todos los comandos."
"RCOMMANDPALETTE.COMMAND" = "El id del comando que se muestra en Index (desde 0) para lo que se escribió."
"RCOMMANDPALETTE.COMMANDCOUNT" = "Cuántos comandos tiene."
"RCOMMANDPALETTE.COMMANDENABLED" = "Si un comando se puede elegir; con On, lo establece (uno deshabilitado se muestra atenuado)."
"RCOMMANDPALETTE.COUNT" = "Cuántos comandos coinciden con lo que se escribió."
"RCOMMANDPALETTE.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RCOMMANDPALETTE.FILTER" = "Lo que escribió la persona."
"RCOMMANDPALETTE.FONT" = "La fuente del texto, un RFont; al asignar una, se copia."
"RCOMMANDPALETTE.HEIGHT" = "La altura, en píxeles; en `Screen`, la de la pantalla."
"RCOMMANDPALETTE.HIDE" = "Lo cierra."
"RCOMMANDPALETTE.HINT" = "La sugerencia que se muestra cuando el mouse se detiene sobre el control (con `ShowHint`)."
"RCOMMANDPALETTE.LEFT" = "La distancia al borde izquierdo del contenedor (en un formulario: el de la pantalla), en píxeles."
"RCOMMANDPALETTE.MAXROWS" = "La mayor cantidad de comandos que se muestran a la vez (si hay más, se desplaza)."
"RCOMMANDPALETTE.ONCANCEL" = "La persona cerró la paleta sin elegir (Escape)."
"RCOMMANDPALETTE.ONCOMMAND" = "La persona eligió un comando (Enter o un clic): la paleta se cerró."
"RCOMMANDPALETTE.ONENTER" = "Se produce cuando el componente recibe el foco del teclado: Tab o Shift+Tab, un clic, SetFocus, el atajo de su etiqueta y, en el caso del primero, cuando se muestra su formulario. Llega después del OnExit del componente que tenía el foco y antes de lo que hace un clic en él (su OnMouseDown, OnClick). Cambiar a otra ventana o aplicación y volver no lo produce."
"RCOMMANDPALETTE.ONEXIT" = "Se produce cuando el componente pierde el foco del teclado en favor de otro componente de su formulario (Tab, un clic, SetFocus), antes del OnEnter de ese otro: el lugar para comprobar lo que se escribió. Cambiar a otra ventana o aplicación no lo produce, ni tampoco ocultar o deshabilitar el componente."
"RCOMMANDPALETTE.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RCOMMANDPALETTE.PLACEHOLDER" = "El texto gris del cuadro de búsqueda vacío."
"RCOMMANDPALETTE.REMOVECOMMAND" = "Quita un comando de la paleta."
"RCOMMANDPALETTE.SELECTED" = "El id del comando resaltado."
"RCOMMANDPALETTE.SHOW" = "Abre la paleta en la parte superior de su formulario, centrada (tan ancha como Width, como máximo el ancho del formulario menos 32 píxeles), sobre todos los demás componentes, vacía, con el teclado en ella; los comandos usados más recientemente van primero."
"RCOMMANDPALETTE.TOP" = "La distancia al borde superior del contenedor (en un formulario: el de la pantalla), en píxeles."
"RCOMMANDPALETTE.VISIBLE" = "Si el control o formulario se muestra."
"RCOMMANDPALETTE.WIDTH" = "El ancho, en píxeles; en `Screen`, el de la pantalla."
"RLANGUAGESERVICE" = "El servicio de lenguaje de RapidR, el que usan rapidr lsp y la extensión de VS Code: la estructura de un archivo BASIC y sus diagnósticos (los mensajes del propio compilador), como texto, un elemento por línea, con los campos separados por tabulaciones. Dale el texto del editor con Update."
"RLANGUAGESERVICE.CLOSE" = "Olvida el texto del editor de un archivo: se vuelve a leer de su archivo."
"RLANGUAGESERVICE.COMPATMODE" = "\"rapidq\": se informan las extensiones de RapidR, como en un proyecto que se mantiene compatible con el lenguaje clásico."
"RLANGUAGESERVICE.DIAGNOSTICS" = "Los errores y advertencias del archivo, uno por línea: gravedad (error, warning, note), línea, columna (desde 1), mensaje, archivo, separados por tabulaciones."
"RLANGUAGESERVICE.ERRORCOUNT" = "Cuántos errores encontró el último Diagnostics o ProjectDiagnostics."
"RLANGUAGESERVICE.HELP" = "La entrada del lenguaje para una palabra (un componente, una función, una instrucción, una palabra clave, una constante, un objeto global; con OfType, un miembro de ese tipo de componente), una parte por línea: su título, su sintaxis, qué es (categoría, tipo, valor predeterminado, dónde se ejecuta), qué hace, luego los miembros de un componente. \"\" cuando no se conoce la palabra."
"RLANGUAGESERVICE.HELPFIND" = "Los nombres que Query puede significar, el mejor primero, uno por línea —el nombre, qué es, separados por tabulaciones—: los nombres del propio programa (el programa de File: tu variable, tu SUB …) y los del lenguaje (los componentes con los nombres de RapidR, y los nombres clásicos también los encuentran; funciones, instrucciones, palabras clave, tipos, directivas, objetos globales y, a partir de dos letras, constantes). Un nombre que empieza con Query va antes que uno que lo tiene dentro; cuando ninguno lo hace, los nombres a los que se parece. 12 como máximo."
"RLANGUAGESERVICE.HELPPAGE" = "La página del panel Ayuda para una palabra, como Markdown (lo que muestra RMARKDOWNVIEW): una primera línea con lo que el panel necesita además de la página —el tipo de página (start, entry, mine, none), la sintaxis que Insert escribe (sus saltos de línea como CHR$(13)), el archivo donde se declara un nombre del programa, su línea y la columna de su nombre ahí (ambas desde 1)—, separado por tabulaciones, luego la página: el título, qué es, la sintaxis, qué hace, y las propiedades, métodos y eventos de un componente, cada nombre un enlace (help:Word@Type). Con File y la Line y la Column del cursor (desde 1) también se responden los nombres propios del programa: una variable, una constante, una SUB, un componente del formulario —su declaración, dónde está, sus usos, luego la ayuda de su tipo—, y un miembro después de un punto es el de lo que va antes (Hello.Font.Color: el Color de RFont). Word solo con File: el nombre del programa con ese nombre. Sin palabra: la página de inicio. CanInsert (1): la página ofrece Insert (la sintaxis escrita en el código)."
"RLANGUAGESERVICE.OUTLINE" = "La estructura del archivo, una línea por elemento: profundidad, categoría (sub, function, type, field, method, event, component, constant, variable, label), nombre, detalle, línea (desde 1), separados por tabulaciones."
"RLANGUAGESERVICE.PROJECT" = "El archivo principal del proyecto abierto (\"\" si no hay). Un archivo que este incluye —un módulo, el archivo de un formulario, a cualquier profundidad— se analiza entonces como parte de su programa, esté abierto o no, nunca solo: no hay errores en un módulo que compila con su proyecto. La ayuda de los editores de código también lo sigue."
"RLANGUAGESERVICE.PROJECTDIAGNOSTICS" = "Los problemas del proyecto abierto (Project: su archivo principal), como los lista el panel Problemas de RapidR Studio: el programa compilado entero, como lo compila una compilación (un módulo nunca se revisa solo), lo que dice el registro sobre los archivos propios del proyecto, y lo que funciona en un solo entorno de ejecución —cuando Targets alcanza al otro—, una vez por componente o función integrada con cuántos usos. Agrupados por archivo, primero los archivos con errores; en un archivo, primero los errores, luego las advertencias, luego las notas. Los mismos campos que Diagnostics, una línea cada uno; \"\" sin proyecto."
"RLANGUAGESERVICE.TARGETS" = "Dónde se ejecuta el programa: \"desktop\", \"web\" o \"both\" (el valor predeterminado sin proyecto). Lo que funciona en un solo entorno de ejecución se avisa cuando el programa se ejecuta en el otro: en Diagnostics en cada uso, en ProjectDiagnostics una vez por componente con cuántos usos."
"RLANGUAGESERVICE.UPDATE" = "El texto de un archivo tal como lo tiene el editor (guardado o no)."
"RLANGUAGESERVICE.VERSION" = "La versión de RapidR, como la tiene esta compilación (\"2.121.0\"): lo que dice Ayuda > Acerca de."
"RMARKDOWNVIEW" = "Un texto Markdown mostrado con formato, como lo ve un lector: encabezados, párrafos con palabras en negrita, en cursiva, tachadas y de `code`, listas con viñetas y numeradas (anidadas), tablas, citas en bloque, bloques de código (coloreados como los colorea el editor de código, según el lenguaje que indica el delimitador del bloque: ```basic, ```sql —```sqlite y ```mysql con las palabras de ese dialecto—, ```json, ```html, ```css, ```javascript, ```toml, ```csv, ```rust, ```markdown; cualquier otro, sin color), líneas horizontales y enlaces. El texto se desplaza; la persona lo selecciona con el mouse y lo copia (Ctrl+C). Un clic en un enlace produce OnLinkClick; un enlace web (http, https, mailto) se abre en el navegador, un enlace `#heading` desplaza hasta ese encabezado. El HTML del texto se omite —salvo `<br>`, y `<ins>` / `<del>` para los conteos de las diferencias (el texto entre ellos se muestra como añadido o quitado, en el verde o el rojo del tema y en la fuente de código; un `title` lo dice en palabras para un lector de pantalla)— y una imagen muestra su descripción. RapidR Studio muestra los archivos `.md` con él."
"RMARKDOWNVIEW.ACCESSIBLEDESCRIPTION" = "Una descripción más larga que un lector de pantalla da después del nombre (qué hace el control, un atajo)."
"RMARKDOWNVIEW.ACCESSIBLEHIDDEN" = "True: el control es decoración —un punto parpadeante, un adorno— y un lector de pantalla lo omite (sigue en la ventana, para los ojos). Nunca lo establezcas en nada que una persona pueda usar o necesite leer."
"RMARKDOWNVIEW.ACCESSIBLENAME" = "Cómo llama un lector de pantalla al control, cuando su título o texto no basta (un botón de imagen, un campo de edición sin etiqueta)."
"RMARKDOWNVIEW.ALIGN" = "Dónde se acopla el control en su contenedor: una de las constantes `alXXX`. `alNone` conserva su propio lugar; `alClient` llena lo que dejan los demás controles acoplados."
"RMARKDOWNVIEW.ANCHORS" = "Los bordes de su contenedor a los que el control mantiene su distancia cuando el contenedor cambia de tamaño: akLeft + akTop (el valor predeterminado) no se mueve; añade akRight / akBottom para estirarlo."
"RMARKDOWNVIEW.CLEAR" = "No muestra nada."
"RMARKDOWNVIEW.CODELANGUAGE" = "El lenguaje del código en línea (`code`) del texto (\"rapidr\", o cualquier lenguaje que nombre el delimitador de un bloque de código): coloreado como lo colorea el editor de código; \"\" (el valor predeterminado) lo deja sin color. Con un lenguaje, una palabra de código en línea o de un bloque de código de RapidR que el servicio de lenguaje del programa conoce (el registro de RapidR Studio) muestra su ayuda de una línea como información flotante cuando el mouse se detiene sobre ella, el puntero es una mano y un clic produce OnCodeClick. El chat del asistente de RapidR Studio lo usa: pasa el mouse sobre una palabra clave, un componente o un miembro en una respuesta para ver su ayuda; haz clic para abrirla en el panel Ayuda."
"RMARKDOWNVIEW.EMPTYTEXT" = "Lo que dice mientras no tiene texto."
"RMARKDOWNVIEW.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RMARKDOWNVIEW.FILENAME" = "El archivo que leyó LoadFromFile (\"\" cuando se asignó Text)."
"RMARKDOWNVIEW.FOLLOWEND" = "True: una vista desplazada hasta su final se queda al final a medida que Text crece (un chat, un registro), mientras una que la persona desplazó hacia arriba se queda donde la dejó. False: el desplazamiento se queda donde está."
"RMARKDOWNVIEW.FONT" = "La fuente del texto (los encabezados son más grandes, el código es monoespaciado); la propia de RapidR cuando el programa no establece ninguna."
"RMARKDOWNVIEW.HEADINGS" = "Los encabezados, uno por línea: el nivel (1 a 6), el texto del encabezado, su ancla como la nombra un enlace `#` (\"getting-started\") y la línea del texto en que está (desde 1), separados por tabulaciones."
"RMARKDOWNVIEW.HEIGHT" = "La altura, en píxeles; en `Screen`, la de la pantalla."
"RMARKDOWNVIEW.HINT" = "La sugerencia que se muestra cuando el mouse se detiene sobre el control (con `ShowHint`)."
"RMARKDOWNVIEW.LEFT" = "La distancia al borde izquierdo del contenedor (en un formulario: el de la pantalla), en píxeles."
"RMARKDOWNVIEW.LINKCOUNT" = "Cuántos enlaces tiene el texto."
"RMARKDOWNVIEW.LOADFROMFILE" = "Muestra un archivo Markdown: True cuando se leyó. Los enlaces relativos que contiene son relativos a su carpeta."
"RMARKDOWNVIEW.MAXHEIGHT" = "La altura máxima del control, en píxeles; 0 para no tener límite. También `Constraints.MaxHeight`."
