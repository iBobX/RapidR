"RPROJECT.OPENFOLDER" = "Abre el proyecto de una carpeta: su .rrproj, si no, su fuente principal (main.rr / main.bas, el que se llama como la carpeta, el que tiene un formulario). True cuando se abrió."
"RPROJECT.OUTPUTFOLDER" = "Dónde pone Build la aplicación: una carpeta relativa a la del proyecto (\"\" para build). Recibe solo lo que se entrega: el Rust generado y los archivos del compilador se quedan en la caché de compilación de RapidR."
"RPROJECT.PROJECTSFOLDER" = "Dónde pone Nuevo proyecto los proyectos por defecto: la carpeta projects de Home mientras Studio se ejecuta desde una carpeta de la persona, Documents/RapidR/Projects cuando Studio está instalado (Home tiene su release.toml) o no se puede escribir en Home — nunca dentro del propio RapidR."
"RPROJECT.RECOVERYDISCARD" = "Descarta las copias de Run (si no se da ninguna: todas las copias que da RecoveryFound)."
"RPROJECT.RECOVERYEND" = "Studio se cerró como debe: las copias de este Studio se van."
"RPROJECT.RECOVERYFORGET" = "Descarta la copia de un documento (se guardó, o se cerró y se descartaron sus cambios)."
"RPROJECT.RECOVERYFOUND" = "Las copias que dejó un Studio que terminó sin cerrarse (un fallo, un cierre forzado, la computadora apagada) —no las de este Studio, ni las de uno que sigue en ejecución—, una por línea: Run, Key, Path y Caption, separados por tabulaciones. \"\" cuando no hay ninguna."
"RPROJECT.RECOVERYKEEP" = "Guarda una copia del texto sin guardar de un documento (Key: lo que distingue al documento, Path su archivo —\"\" para uno nunca guardado—, Caption como lo dice su pestaña) en la carpeta de Studio, para RecoveryFound después de un Studio que terminó sin cerrarse. True cuando se guardó; Error dice por qué no."
"RPROJECT.RECOVERYTEXT" = "El texto de una copia (Run y Key como los da RecoveryFound)."
"RPROJECT.REMOVEFILE" = "Quita un archivo del proyecto (el archivo en sí se queda). True cuando estaba en él."
"RPROJECT.REPLACE" = "Text con cada coincidencia de Pattern (las Options de Find) reemplazada por With; en el reemplazo de una expresión regular, $1 o ${name} representan sus grupos."
"RPROJECT.REVEAL" = "Muestra Path (si no, lo que hizo la última Build) seleccionado en Finder, el Explorador de archivos o el administrador de archivos de Linux."
"RPROJECT.RUNARGS" = "Los argumentos que Run da al programa (lo que lee COMMAND$), en una sola cadena: los espacios los separan, uno \"entre comillas\" conserva sus espacios (`[run] args` en el archivo del proyecto). Asígnalo y luego Save."
"RPROJECT.RUSTREADY" = "True cuando las compilaciones nativas pueden ejecutarse: Rust está instalado (rapidr setup --rust). Sin él solo funcionan las compilaciones interpretadas. True en la web, donde Build no está para preguntar."
"RPROJECT.SAVE" = "Escribe el archivo del proyecto (el proyecto de un archivo fuente pasa a ser <Folder>/<Name>.rrproj, o Path), con el tipo de cada archivo fuente como lo dice su código (FollowCode). True cuando se escribió."
"RPROJECT.STOPBUILD" = "Detiene la Build que se está ejecutando."
"RPROJECT.STUDIOFOLDER" = "La carpeta propia de Studio (nunca la de un proyecto): donde se guardan las copias del trabajo sin guardar y el registro de lo que salió mal en Studio — la carpeta de RapidR para la configuración de la persona (~/Library/Application Support/RapidR en macOS, %APPDATA%\\RapidR en Windows, ~/.config/rapidr en Linux; RAPIDR_STUDIO_DATA cuando está definida); en la web, el almacén de la página."
"RPROJECT.TARGETS" = "Dónde se ejecuta el programa: \"desktop\" (compilaciones nativas e intérprete), \"web\" (el navegador) o \"both\" — los Targets de Opciones del proyecto, guardados en el archivo del proyecto (`[build] runs_on`). Sin asignar, es \"both\" para un proyecto que también compila una aplicación web, si no \"desktop\". El panel Problemas avisa de lo que funciona en un solo entorno de ejecución cuando el programa se ejecuta en el otro. Asígnalo y luego Save."
"RPROJECT.THEMEEDIT" = "La edición que hace que el programa principal (su texto: MainText) nombre el aspecto Look (\"RapidR\", \"RapidR Light\", \"RapidR Dark\", \"RapidR High Contrast\", \"Classic\") con `$THEME`, como una línea de RCODEEDITOR.ApplyPatches: se cambia su línea `$THEME`, se quita para \"RapidR\" (el valor predeterminado no dice nada), o se pone después de las directivas de apertura, antes de las directivas `$INCLUDE`; \"\" cuando ya nombra ese aspecto."
"RPROJECT.THEMEOF" = "El aspecto que el programa principal (su texto: MainText) nombra con `$THEME`, como RapidR nombra los aspectos: \"RapidR\" (sin `$THEME`: como es el sistema), \"RapidR Light\", \"RapidR Dark\", \"RapidR High Contrast\" o \"Classic\" (también los nombres más antiguos: `Dark`, `Win98` …)."
"RPROJECT.UNWATCH" = "Deja de vigilar un archivo (su documento se cerró)."
"RPROJECT.UNWATCHALL" = "Deja de vigilar todos los archivos (el proyecto se cerró)."
"RPROJECT.VERSION" = "La versión de la aplicación: hasta cuatro números con puntos (1.0, 2.3.1); \"\" para 1.0."
"RPROJECT.WATCH" = "Archivos cambiados fuera del programa: recuerda el archivo del disco en Path —su hora, su tamaño y un hash de sus bytes— como el que el programa conoce ahora (llámalo después de leer el archivo, y después de cada vez que el programa lo escribe). False donde no hay disco que vigilar (la web: los archivos cambian solo a través del programa)."
"RPROJECT.WRITENEWFILE" = "Escribe un archivo nuevo, haciendo antes las carpetas que necesita — nunca sobre un archivo que ya existe. True cuando se escribió; Error dice por qué no (no es un error de ejecución). Lo que hizo se anota para ApplyUndo."
"RPROJECTTREE" = "Los archivos de un proyecto como un árbol (un proyecto .rrproj, o un archivo .bas / .rr y los archivos que incluye), agrupados por tipo —formularios con los componentes que hacen sus bloques CREATE, módulos, incluidos, recursos, activos, datos— cada uno con su ícono. La persona abre un archivo (doble clic o Enter), lo renombra en su lugar (F2), lo arrastra para reordenarlo o a una carpeta, y lo elimina después de confirmar; el programa oye cada cambio y hace el trabajo en el disco."
"RPROJECTTREE.ACCESSIBLEDESCRIPTION" = "Una descripción más larga que un lector de pantalla da después del nombre (qué hace el control, un atajo)."
"RPROJECTTREE.ACCESSIBLEHIDDEN" = "True: el control es decoración —un punto parpadeante, un adorno— y un lector de pantalla lo omite (sigue en la ventana, para los ojos). Nunca lo establezcas en nada que una persona pueda usar o necesite leer."
"RPROJECTTREE.ACCESSIBLENAME" = "Cómo llama un lector de pantalla al control, cuando su título o texto no basta (un botón de imagen, un campo de edición sin etiqueta)."
"RPROJECTTREE.ADDFILE" = "Añade un archivo al proyecto (su tipo según su extensión cuando se omite Kind). True cuando se añadió."
"RPROJECTTREE.ALIGN" = "Dónde se acopla el control en su contenedor: una de las constantes `alXXX`. `alNone` conserva su propio lugar; `alClient` llena lo que dejan los demás controles acoplados."
"RPROJECTTREE.ANCHORS" = "Los bordes de su contenedor a los que el control mantiene su distancia cuando el contenedor cambia de tamaño: akLeft + akTop (el valor predeterminado) no se mueve; añade akRight / akBottom para estirarlo."
"RPROJECTTREE.CLEARBADGES" = "Quita la insignia de versión de todos los archivos."
"RPROJECTTREE.COLLAPSEALL" = "Cierra todos los grupos y carpetas."
"RPROJECTTREE.COMPONENTNAMES" = "Los nombres que hacen los bloques CREATE de los otros archivos del proyecto (a cualquier profundidad), separados por comas: lo que el diseñador de ExceptPath no debe dar como nombre a un componente nuevo (RDESIGNSURFACE.ReservedNames) — los nombres de componentes de un programa clásico son globales."
"RPROJECTTREE.DELETE" = "Pide a la persona que confirme y luego quita el archivo del proyecto (OnDelete puede cancelar)."
"RPROJECTTREE.EMPTYTEXT" = "Lo que dice mientras no se muestra ningún proyecto (\"No project\" cuando está vacío): qué hacer, por ejemplo \"Open a project or a file\"."
"RPROJECTTREE.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RPROJECTTREE.EXPANDALL" = "Abre todos los grupos y carpetas."
"RPROJECTTREE.FILE" = "La ruta del archivo Index (desde 0), en el orden del proyecto."
"RPROJECTTREE.FILEBADGE" = "El estado de un archivo frente a la última versión del proyecto (RRepository.Changes): con Letter, lo establece —\"M\" cambiado, \"N\" nuevo, \"D\" quitado, \"\" ninguno—, mostrado como la letra en un cuadrado de estado suave a la derecha de su fila y dicho en palabras a un lector de pantalla. Sin Letter: la letra del archivo."
"RPROJECTTREE.FILECOUNT" = "Cuántos archivos tiene el proyecto."
"RPROJECTTREE.FILEKIND" = "El tipo de un archivo: \"module\", \"form\", \"include\", \"resource\", \"asset\" o \"data\"."
"RPROJECTTREE.FILEMODIFIED" = "Si un archivo tiene cambios sin guardar (de un editor): con On, lo establece — un archivo así se marca con un punto después de su nombre."
"RPROJECTTREE.FONT" = "La fuente del texto, un RFont; al asignar una, se copia."
"RPROJECTTREE.HEIGHT" = "La altura, en píxeles; en `Screen`, la de la pantalla."
"RPROJECTTREE.HINT" = "La sugerencia que se muestra cuando el mouse se detiene sobre el control (con `ShowHint`)."
"RPROJECTTREE.LEFT" = "La distancia al borde izquierdo del contenedor (en un formulario: el de la pantalla), en píxeles."
"RPROJECTTREE.LOADTEXT" = "Muestra un proyecto a partir del texto de su archivo (donde no hay archivos que leer: la web). Path es el nombre de su archivo. True cuando se leyó."
"RPROJECTTREE.MAXHEIGHT" = "La altura máxima del control, en píxeles; 0 para no tener límite. También `Constraints.MaxHeight`."
"RPROJECTTREE.MAXWIDTH" = "El ancho máximo del control, en píxeles; 0 para no tener límite. También `Constraints.MaxWidth`."
"RPROJECTTREE.MINHEIGHT" = "La altura mínima del control, en píxeles; 0 para no tener límite. También `Constraints.MinHeight`."
"RPROJECTTREE.MINWIDTH" = "El ancho mínimo del control, en píxeles, sea quien sea que lo cambie de tamaño (el programa, Align, Anchors, el usuario); 0 para no tener límite. También `Constraints.MinWidth`."
"RPROJECTTREE.MODIFIED" = "El proyecto cambió desde que se leyó o se guardó."
"RPROJECTTREE.NEWFILE" = "Añade un archivo nuevo de un tipo con un nombre libre (Form2.rr …) y empieza a renombrarlo: su ruta."
"RPROJECTTREE.ONDELETE" = "La persona confirmó quitar un archivo del proyecto: asigna Cancel para conservarlo. El programa lo elimina del disco si quiere."
"RPROJECTTREE.ONENTER" = "Se produce cuando el componente recibe el foco del teclado: Tab o Shift+Tab, un clic, SetFocus, el atajo de su etiqueta y, en el caso del primero, cuando se muestra su formulario. Llega después del OnExit del componente que tenía el foco y antes de lo que hace un clic en él (su OnMouseDown, OnClick). Cambiar a otra ventana o aplicación y volver no lo produce."
"RPROJECTTREE.ONEXIT" = "Se produce cuando el componente pierde el foco del teclado en favor de otro componente de su formulario (Tab, un clic, SetFocus), antes del OnEnter de ese otro: el lugar para comprobar lo que se escribió. Cambiar a otra ventana o aplicación no lo produce, ni tampoco ocultar o deshabilitar el componente."
"RPROJECTTREE.ONMOVE" = "La persona arrastró un archivo: a otro lugar del orden (Index, desde 0) o a otra carpeta (NewPath)."
"RPROJECTTREE.ONNEWFILE" = "NewFile añadió un archivo y la persona le puso nombre."
"RPROJECTTREE.ONOPEN" = "La persona abrió un nodo (doble clic, Enter): la ruta de un archivo, o `path#Component`."
"RPROJECTTREE.ONRENAME" = "Se está renombrando un archivo: asigna Cancel para rechazarlo. El programa renombra el archivo en el disco."
"RPROJECTTREE.ONSELECT" = "La persona seleccionó otro nodo (Path como lo da Selected)."
"RPROJECTTREE.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RPROJECTTREE.PROJECT" = "El archivo del proyecto (.rrproj, o un archivo .bas / .rr): al asignarlo se lee el proyecto y se muestra."
"RPROJECTTREE.PROJECTNAME" = "El nombre del proyecto."
"RPROJECTTREE.PROJECTTEXT" = "El texto del archivo del proyecto como lo escribe Save."
"RPROJECTTREE.REFRESH" = "Vuelve a leer los archivos del proyecto (incluidos los componentes de los formularios)."
"RPROJECTTREE.REMOVEFILE" = "Quita un archivo del proyecto (el disco no se toca)."
"RPROJECTTREE.RENAME" = "Cambia el nombre de un archivo (OnRename puede cancelarlo); sin NewName, el nombre se escribe allí mismo."
"RPROJECTTREE.REVEAL" = "Abre los grupos superiores de un archivo (o `path#Component`), lo selecciona y se desplaza hasta él."
"RPROJECTTREE.SAVE" = "Escribe el archivo del proyecto (.rrproj). True cuando se escribió."
"RPROJECTTREE.SELECTED" = "El nodo seleccionado: la ruta de un archivo, `path#Component` para un componente de un formulario, la ruta de una carpeta que termina en `/`, \"\" para el proyecto o un grupo (SelectedKind indica cuál). Al establecerlo en `@project` se selecciona la fila del propio proyecto."
"RPROJECTTREE.SELECTEDKIND" = "Qué es el nodo seleccionado: \"project\" (el nombre del proyecto en la parte superior), \"group\", \"folder\", \"file\", \"component\" o \"\" si no hay ninguno."
"RPROJECTTREE.SETFILETEXT" = "Da el texto de un archivo (el que tiene el editor, o el de un archivo que la web no puede leer) para que los componentes de un formulario se listen a partir de él."
"RPROJECTTREE.SHOWCOMPONENTS" = "Si los componentes de un formulario se listan debajo de él."
"RPROJECTTREE.SHOWFILES" = "Si se muestran los archivos (agrupados por tipo)."
"RPROJECTTREE.SHOWFORMS" = "Si se muestran los formularios con los componentes que crean sus bloques CREATE."
"RPROJECTTREE.TOP" = "La distancia al borde superior del contenedor (en un formulario: el de la pantalla), en píxeles."
"RPROJECTTREE.VISIBLE" = "Si el control o formulario se muestra."
"RPROJECTTREE.WIDTH" = "El ancho, en píxeles; en `Screen`, el de la pantalla."
"RPROPERTYINSPECTOR" = "Un inspector de objetos: las propiedades de un componente (o de todos los componentes que un diseñador tiene seleccionados) en una cuadrícula de dos columnas de nombres y valores, por categoría o de la A a la Z, con un cuadro de búsqueda y un editor para cada tipo de valor —números, texto, True / False, una lista de constantes, un conjunto de indicadores, colores con selector, fuentes, imágenes y archivos, listas de cadenas de texto, una referencia a un componente y un editor visual para los cuatro Anchors—. Un valor que se deja en su valor predeterminado se muestra atenuado y se puede restablecer; los miembros que RapidR añade a un componente clásico se agrupan bajo \"RapidR extensions\". Una página Events lista los eventos del componente y la SUB que ejecuta cada uno."
"RPROPERTYINSPECTOR.ACCESSIBLEDESCRIPTION" = "Una descripción más larga que un lector de pantalla da después del nombre (qué hace el control, un atajo)."
"RPROPERTYINSPECTOR.ACCESSIBLEHIDDEN" = "True: el control es decoración —un punto parpadeante, un adorno— y un lector de pantalla lo omite (sigue en la ventana, para los ojos). Nunca lo establezcas en nada que una persona pueda usar o necesite leer."
"RPROPERTYINSPECTOR.ACCESSIBLENAME" = "Cómo llama un lector de pantalla al control, cuando su título o texto no basta (un botón de imagen, un campo de edición sin etiqueta)."
"RPROPERTYINSPECTOR.ADDPROPERTY" = "Muestra una propiedad propia del programa (de un objeto que el registro no conoce): Type es \"int\", \"float\", \"string\", \"bool\", \"color\", \"file\", \"picture\", \"strings\" (una línea por fila), \"columns\", \"component\", una lista de constantes separadas por \"|\" (una de ellas) o \"set:\" e indicadores separados por \"|\" (cualquiera de ellos). Value es su valor actual y su valor predeterminado (se muestra atenuado mientras lo tiene); Category la agrupa (\"Misc\" si se omite). Doc es lo que dice la descripción bajo las filas mientras su fila está seleccionada; Default, si se da, es el valor en el que se muestra atenuada (si no, Value, el valor actual). Sus cambios llegan solo a OnPropertyChange."
"RPROPERTYINSPECTOR.ALIGN" = "Dónde se acopla el control en su contenedor: una de las constantes `alXXX`. `alNone` conserva su propio lugar; `alClient` llena lo que dejan los demás controles acoplados."
"RPROPERTYINSPECTOR.ANCHORS" = "Los bordes de su contenedor a los que el control mantiene su distancia cuando el contenedor cambia de tamaño: akLeft + akTop (el valor predeterminado) no se mueve; añade akRight / akBottom para estirarlo."
"RPROPERTYINSPECTOR.CLEARPROPERTIES" = "Quita las propiedades que dio AddProperty."
"RPROPERTYINSPECTOR.COLLAPSE" = "Cierra una categoría o una fila con partes."
"RPROPERTYINSPECTOR.COLLAPSEALL" = "Cierra todas las categorías y todas las filas con partes."
"RPROPERTYINSPECTOR.DESIGNER" = "Un diseñador de formularios cuya selección sigue el inspector: se inspecciona lo que se selecciona allí, y un cambio se hace en el diseñador."
"RPROPERTYINSPECTOR.DOC" = "Qué es la fila seleccionada, con palabras, tal como el inspector lo muestra bajo las filas: la descripción de una propiedad, la de un evento con sus parámetros."
"RPROPERTYINSPECTOR.EDITVALUE" = "Selecciona la fila de una propiedad e inicia su editor, como lo haría un doble clic."
"RPROPERTYINSPECTOR.EMPTYTEXT" = "Lo que dice la descripción bajo las filas mientras no se inspecciona nada (\"Select a component on the form\")."
"RPROPERTYINSPECTOR.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RPROPERTYINSPECTOR.EXPAND" = "Abre una categoría o una fila con partes."
"RPROPERTYINSPECTOR.EXPANDALL" = "Abre todas las categorías y todas las filas con partes (un conjunto, una fuente)."
"RPROPERTYINSPECTOR.FILTER" = "El texto del cuadro de búsqueda: solo se muestran las filas cuyo nombre coincide con él."
"RPROPERTYINSPECTOR.FONT" = "La fuente del texto, un RFont; al asignar una, se copia."
"RPROPERTYINSPECTOR.HANDLERS" = "Las SUB que puede ejecutar un evento, una por línea como `Name(parameters)`: la página Events ofrece las que tienen parámetros que encajan con el evento."
"RPROPERTYINSPECTOR.HEIGHT" = "La altura, en píxeles; en `Screen`, la de la pantalla."
"RPROPERTYINSPECTOR.HINT" = "La sugerencia que se muestra cuando el mouse se detiene sobre el control (con `ShowHint`)."
"RPROPERTYINSPECTOR.ISDEFAULT" = "True cuando una propiedad tiene su valor predeterminado."
"RPROPERTYINSPECTOR.LEFT" = "La distancia al borde izquierdo del contenedor (en un formulario: el de la pantalla), en píxeles."
"RPROPERTYINSPECTOR.MAXHEIGHT" = "La altura máxima del control, en píxeles; 0 para no tener límite. También `Constraints.MaxHeight`."
"RPROPERTYINSPECTOR.MAXWIDTH" = "El ancho máximo del control, en píxeles; 0 para no tener límite. También `Constraints.MaxWidth`."
"RPROPERTYINSPECTOR.MINHEIGHT" = "La altura mínima del control, en píxeles; 0 para no tener límite. También `Constraints.MinHeight`."
"RPROPERTYINSPECTOR.MINWIDTH" = "El ancho mínimo del control, en píxeles, sea quien sea que lo cambie de tamaño (el programa, Align, Anchors, el usuario); 0 para no tener límite. También `Constraints.MinWidth`."
"RPROPERTYINSPECTOR.NAMEWIDTH" = "El ancho de la columna de nombres, en píxeles (se cambia arrastrando la línea entre las columnas)."
"RPROPERTYINSPECTOR.ONEDITORREQUEST" = "La persona pidió el editor propio de una propiedad (su botón \"…\") que el inspector no tiene: el programa muestra uno."
"RPROPERTYINSPECTOR.ONENTER" = "Se produce cuando el componente recibe el foco del teclado: Tab o Shift+Tab, un clic, SetFocus, el atajo de su etiqueta y, en el caso del primero, cuando se muestra su formulario. Llega después del OnExit del componente que tenía el foco y antes de lo que hace un clic en él (su OnMouseDown, OnClick). Cambiar a otra ventana o aplicación y volver no lo produce."
"RPROPERTYINSPECTOR.ONEVENTDBLCLICK" = "La persona hizo doble clic en la fila de un evento: el programa crea (o muestra) su controlador de eventos."
"RPROPERTYINSPECTOR.ONEXIT" = "Se produce cuando el componente pierde el foco del teclado en favor de otro componente de su formulario (Tab, un clic, SetFocus), antes del OnEnter de ese otro: el lugar para comprobar lo que se escribió. Cambiar a otra ventana o aplicación no lo produce, ni tampoco ocultar o deshabilitar el componente."
"RPROPERTYINSPECTOR.ONPROPERTYCHANGE" = "La persona cambió una propiedad (o eligió la SUB que ejecuta un evento): su nombre y el valor nuevo tal como lo escribe el programa. Un secreto (la APIKey de un RAI) nunca se escribe en el código de un diseñador: solo este evento lo tiene, para que el programa lo guarde donde corresponde."
"RPROPERTYINSPECTOR.ONSELECT" = "Cambió la fila seleccionada."
"RPROPERTYINSPECTOR.PAGE" = "La página que se muestra: \"properties\" o \"events\"."
"RPROPERTYINSPECTOR.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RPROPERTYINSPECTOR.READONLY" = "Los valores se muestran, pero no se pueden cambiar."
"RPROPERTYINSPECTOR.REFRESH" = "Vuelve a leer los valores de los componentes inspeccionados (después de que el programa los cambió)."
"RPROPERTYINSPECTOR.RESETVALUE" = "Devuelve una propiedad a su valor predeterminado."
"RPROPERTYINSPECTOR.ROW" = "Lo que muestra la fila Index (desde 0), como \"Name=Value\" (el encabezado de una categoría como \"[Name]\")."
"RPROPERTYINSPECTOR.ROWCOUNT" = "Cuántas filas se muestran ahora (con los encabezados de las categorías)."
"RPROPERTYINSPECTOR.ROWS" = "Todas las filas que se muestran, una por línea, como las da Row (\"Name=Value\", el encabezado de una categoría como \"[Name]\")."
"RPROPERTYINSPECTOR.SELECTED" = "La propiedad (o el evento) cuya fila está seleccionada; al establecerla se selecciona esa fila."
"RPROPERTYINSPECTOR.SETCHOICES" = "Ofrece los valores de una propiedad de texto desde una lista desplegable (uno por línea; igualmente se puede escribir cualquier texto): RapidR Studio da al Model de un RAI los modelos del proveedor. Una opción que empieza con \"↻ \" es una acción: al elegirla se produce OnEditorRequest(Prop) en lugar de establecer el valor. Con Choices en \"\" se vuelve a las opciones del registro."
"RPROPERTYINSPECTOR.SETHEADING" = "Lo que dice el encabezado mientras el inspector muestra solo las propiedades propias del programa (AddProperty) y ningún componente: Title en negrita, Kind después y el ícono llamado Icon antes de ambos (las propiedades del proyecto de RapidR Studio: el nombre del proyecto, \"Project\"). Con \"\" como Title se quita."
"RPROPERTYINSPECTOR.SETNOTE" = "Una línea que se muestra sobre la descripción de una propiedad mientras su fila está seleccionada (\"Loading the models…\", por qué se rechazó una clave); \"\" la quita."
"RPROPERTYINSPECTOR.SETVALUE" = "Cambia una propiedad como si se hubiera escrito Value en su fila (las mismas comprobaciones, luego OnPropertyChange). True cuando se aceptó el valor."
"RPROPERTYINSPECTOR.SHOWEVENTS" = "Si se puede mostrar la página Events (su pestaña aparece)."
"RPROPERTYINSPECTOR.SHOWRAPIDREXTENSIONS" = "Si se muestran los miembros que RapidR añade a un componente clásico (bajo \"RapidR extensions\", con una insignia)."
"RPROPERTYINSPECTOR.TARGET" = "El componente inspeccionado: su nombre (o Handle). Varios nombres separados por comas se inspeccionan juntos: solo se muestran las propiedades que todos tienen, y un cambio va a cada uno de ellos. Mientras el inspector sigue a un Designer, lee los nombres de los componentes seleccionados allí."
"RPROPERTYINSPECTOR.TARGETTYPE" = "El tipo del componente inspeccionado: tal como lo escribe su código para el componente de un diseñador, el nombre de RapidR (RButton) para el de un programa en ejecución; \"\" cuando se inspeccionan varios de distintos tipos."
"RPROPERTYINSPECTOR.TOP" = "La distancia al borde superior del contenedor (en un formulario: el de la pantalla), en píxeles."
"RPROPERTYINSPECTOR.VALUE" = "El valor de una propiedad tal como lo muestra el inspector (\"alClient\", \"akLeft, akTop\", \"&H0000FF\")."
"RPROPERTYINSPECTOR.VIEW" = "Cómo se ordenan las filas: \"categories\" (agrupadas, el valor predeterminado) o \"alphabetic\"."
"RPROPERTYINSPECTOR.VISIBLE" = "Si el control o formulario se muestra."
"RPROPERTYINSPECTOR.WIDTH" = "El ancho, en píxeles; en `Screen`, el de la pantalla."
"RREPOSITORY" = "Las versiones de un proyecto, en palabras sencillas (el panel Versiones de RapidR Studio se basa en él): empezar a guardar versiones de una carpeta, guardar una versión de los archivos cambiados (antes se buscan claves y contraseñas), la línea de tiempo, qué cambió una versión, volver a una versión —todo el proyecto o un archivo, como una versión nueva: nunca se descarta nada, y cada acción se puede deshacer— y un historial local que guarda una copia de un archivo cada vez que se guarda, con versiones o sin ellas. Las versiones son un repositorio Git común (cada palabra sencilla tiene su nombre en Git: guardar una versión es un commit, la línea de tiempo es el log, un experimento es una rama); abrir uno nunca ejecuta nada de él. Las listas son texto, una línea cada una, con los campos separados por tabulaciones. En un navegador solo funciona el historial local (Available es False allí)."
"RREPOSITORY.AUTHOR" = "Quién guarda las versiones, por su nombre (\"\": el nombre de la cuenta)."
"RREPOSITORY.AVAILABLE" = "True donde se pueden guardar versiones (RapidR en una computadora); False en un navegador, donde solo funciona el historial local."
"RREPOSITORY.CANUNDO" = "Lo que Undo desharía, con palabras (\"Saved the version “Bigger button”\"); \"\" cuando no hay nada que deshacer."
"RREPOSITORY.CHANGECOUNT" = "Cuántos archivos difieren de la última versión (cambiados, nuevos o eliminados), según lo que encontró el último Refresh, Folder o acción."
"RREPOSITORY.CHANGES" = "Los archivos que difieren de la última versión, una línea cada uno: una letra —M cambiado, N nuevo, D eliminado— y la ruta relativa a Folder, separadas por una tabulación."
"RREPOSITORY.CHECKPOINT" = "Guarda la carpeta tal como está ahora, con una etiqueta (lo que una IA está por hacer): un punto de control en la línea de tiempo, nunca una versión. Devuelve su id."
"RREPOSITORY.CHECKSECRETS" = "Cuántas líneas de lo que incluiría un guardado (todos los archivos cambiados, o Files) parecen claves o contraseñas: Secrets las lista."
"RREPOSITORY.EMAIL" = "El correo electrónico que se guarda con cada versión (\"\" si no hay ninguno)."
"RREPOSITORY.ERROR" = "Por qué no ocurrió la última acción, con palabras sencillas (\"\" cuando ocurrió)."
"RREPOSITORY.ERRORKIND" = "Qué tipo de motivo da Error: \"secrets\" —hay líneas que parecen claves o contraseñas (Secrets las lista; SaveVersion con AllowSecrets guarda de todos modos)—, \"unsaved-changes\" —hay que guardar una versión primero—, \"nothing-to-save\", \"refused\" —Start no guarda versiones de esa carpeta (una unidad, la carpeta personal, una carpeta dentro de otra con versiones)—, \"not-available\" (un navegador) …; \"\" cuando la última acción funcionó."
"RREPOSITORY.EXPERIMENT" = "El experimento en el que está el proyecto (Git lo llama rama): \"main\" hasta que se inicia otro."
"RREPOSITORY.FILEAT" = "El texto de un archivo tal como lo tenía una versión (un id, \"HEAD\" para la última versión; \"\": tal como lo tiene el disco ahora), para el LeftText de un RDiffView. \"\" cuando la versión no tenía el archivo (HasFile distingue un archivo vacío)."
"RREPOSITORY.FOLDER" = "La carpeta del proyecto. Al establecerla se lee su estado: Versioned, Experiment, Changes."
"RREPOSITORY.GOBACK" = "Vuelve a una versión: una versión nueva cuyos archivos están como estaban entonces (nunca un reset destructivo: las versiones más nuevas quedan en la línea de tiempo), con un punto de seguridad antes; Undo la deshace. Devuelve el id de la versión nueva; \"\" con Error cuando hay archivos con cambios no guardados como versión."
"RREPOSITORY.GOBACKFILE" = "Vuelve a una versión solo para un archivo: una versión nueva con ese archivo como era (eliminado si la versión no lo tenía); los demás archivos y sus cambios sin guardar quedan como están. Undo la deshace."
"RREPOSITORY.HASFILE" = "True cuando la versión tiene el archivo."
"RREPOSITORY.HISTORY" = "Todas las acciones, la más reciente primero, una línea cada una: su número, cuándo (segundos desde 1970), su tipo (save, go-back, undo …), 1 cuando se deshizo, qué fue con palabras."
"RREPOSITORY.HISTORYFOLDER" = "Dónde se guarda el historial local: la carpeta .rapidr/history del proyecto (nunca forma parte de una versión)."
"RREPOSITORY.KEEPCOPY" = "Guarda Text como una copia del archivo de Path en el historial local (Why: \"before-reload\" de forma predeterminada —lo que tenía un editor antes de que se volviera a cargar el archivo, que había cambiado fuera—), con versiones o sin ellas: su número, \"\" cuando es igual a la copia más reciente (Error dice por qué cuando no se pudo guardar)."
"RREPOSITORY.LOCALFILES" = "Los archivos de los que el historial local tiene copias, una línea cada uno, relativos a Folder."
"RREPOSITORY.LOCALHISTORY" = "Las copias del archivo en el historial local, la más reciente primero, una línea cada una: el número, cuándo (segundos desde 1970), por qué, el tamaño en bytes."
"RREPOSITORY.NOW" = "Ahora, en segundos desde 1970: con lo que se comparan las horas de Timeline y LocalHistory (\"2 minutes ago\")."
"RREPOSITORY.READONLY" = "True cuando las versiones del proyecto pertenecen a otra cuenta de usuario de esta computadora (una memoria USB, la carpeta de otra cuenta): se pueden ver, no cambiar."
"RREPOSITORY.REFRESH" = "Vuelve a leer el estado del proyecto (Versioned, Experiment, Changes, ChangeCount): después de guardar archivos. True cuando tiene versiones."
"RREPOSITORY.SAVEVERSION" = "Guarda una versión (en Git, un commit) de todos los archivos cambiados, o de Files (rutas, una por línea), con Message diciendo qué cambia: el id de la versión nueva. \"\" cuando no se guardó —Error dice por qué: no cambió nada, un mensaje vacío o líneas que parecen claves o contraseñas (ErrorKind \"secrets\", Secrets las lista)—; AllowSecrets en True la guarda de todos modos, una vez que la persona lo eligió."
"RREPOSITORY.SECRETS" = "Las líneas que parecen claves o contraseñas, de la última llamada a SaveVersion o CheckSecrets, una línea cada una: el archivo, el número de línea, a qué se parece, la línea con el secreto enmascarado, separados por tabulaciones."
"RREPOSITORY.SNAPSHOT" = "Guarda en el historial local una copia del archivo tal como lo tiene el disco ahora (Why: \"saved\", \"on-disk\", \"before-reload\" …), con versiones o sin ellas: su número, \"\" cuando es igual a la copia más reciente. Se conservan las 100 copias más recientes de cada archivo; un archivo de más de 8 MB no se copia (Error lo dice)."
"RREPOSITORY.SNAPSHOTTEXT" = "El texto de una copia, ya comprobado: \"\" con Error cuando falta o está dañada."
"RREPOSITORY.START" = "Empieza a guardar versiones de Folder (en Git: init, la rama main y un .gitignore que deja fuera los archivos propios de RapidR). True cuando lo hizo; False con Error diciendo por qué —se rechazan una unidad completa, la carpeta personal o su Escritorio, Documentos o Descargas, y una carpeta dentro de otra que tiene versiones—."
"RREPOSITORY.TIMELINE" = "Las versiones, la más reciente primero (en Git, el log), hasta Limit (200), una línea cada una: el id, sus primeros siete caracteres, cuándo (segundos desde 1970), quién, la primera línea del mensaje y \"version\" —o \"checkpoint\" para los puntos de control de una IA, que se muestran más claros—."
"RREPOSITORY.UNDO" = "Deshace la última acción (un guardado, un regreso a una versión …), incluso al día siguiente: lo que se deshizo, con palabras. \"\" con Error cuando no hay nada que deshacer, o cuando se sobrescribiría un trabajo más reciente (entonces no se cambia nada)."
"RREPOSITORY.VERSIONED" = "True cuando la carpeta guarda versiones (se usó Start, aquí o con otra herramienta de Git)."
"RREPOSITORY.VERSIONFILES" = "Qué cambió una versión respecto de la anterior (todos los archivos son nuevos en la primera): una línea cada uno, M, N o D y la ruta. \"\": lo que cambió desde la última versión."
"RTOOLBOX" = "La paleta de componentes que coloca un diseñador de formularios, con los nombres de RapidR (RButton), agrupados por propósito (Estándar, Adicionales, Cuadros de diálogo, Sistema, Red, Datos …), cada uno con su ícono. Se puede buscar en ella (por cualquiera de los nombres de un componente, o por palabras de lo que hace), hacer doble clic en un componente (o presionar Enter) para añadirlo, o arrastrarlo a un diseñador, que lo escribe en el estilo propio de su archivo. Las plantillas —un componente con propiedades predefinidas— tienen un grupo propio."
"RTOOLBOX.ACCESSIBLEDESCRIPTION" = "Una descripción más larga que un lector de pantalla da después del nombre (qué hace el control, un atajo)."
"RTOOLBOX.ACCESSIBLEHIDDEN" = "True: el control es decoración —un punto parpadeante, un adorno— y un lector de pantalla lo omite (sigue en la ventana, para los ojos). Nunca lo establezcas en nada que una persona pueda usar o necesite leer."
"RTOOLBOX.ACCESSIBLENAME" = "Cómo llama un lector de pantalla al control, cuando su título o texto no basta (un botón de imagen, un campo de edición sin etiqueta)."
"RTOOLBOX.ADDTEMPLATE" = "Añade una plantilla al grupo de plantillas: Source es el bloque CREATE que coloca (un componente con sus propiedades establecidas), Icon un ícono integrado o el nombre de un componente."
"RTOOLBOX.ALIGN" = "Dónde se acopla el control en su contenedor: una de las constantes `alXXX`. `alNone` conserva su propio lugar; `alClient` llena lo que dejan los demás controles acoplados."
"RTOOLBOX.ANCHORS" = "Los bordes de su contenedor a los que el control mantiene su distancia cuando el contenedor cambia de tamaño: akLeft + akTop (el valor predeterminado) no se mueve; añade akRight / akBottom para estirarlo."
"RTOOLBOX.COLLAPSE" = "Cierra un grupo."
"RTOOLBOX.COLLAPSEALL" = "Cierra todos los grupos."
"RTOOLBOX.COUNT" = "Cuántos componentes se muestran ahora: con el filtro aplicado y sin contar los de un grupo cerrado (Item cuenta los mismos)."
"RTOOLBOX.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RTOOLBOX.EXPAND" = "Abre un grupo (\"Standard\", \"Data Science\" …, por su título o su id)."
"RTOOLBOX.EXPANDALL" = "Abre todos los grupos."
"RTOOLBOX.FILTER" = "El texto del cuadro de búsqueda: solo se muestran los componentes cuyos nombres coinciden con él."
"RTOOLBOX.FONT" = "La fuente del texto, un RFont; al asignar una, se copia."
"RTOOLBOX.HEIGHT" = "La altura, en píxeles; en `Screen`, la de la pantalla."
"RTOOLBOX.HINT" = "La sugerencia que se muestra cuando el mouse se detiene sobre el control (con `ShowHint`)."
"RTOOLBOX.ITEM" = "El componente que se muestra en Index (desde 0), con el nombre de RapidR (RButton), o el nombre de una plantilla."
"RTOOLBOX.LEFT" = "La distancia al borde izquierdo del contenedor (en un formulario: el de la pantalla), en píxeles."
"RTOOLBOX.MAXHEIGHT" = "La altura máxima del control, en píxeles; 0 para no tener límite. También `Constraints.MaxHeight`."
"RTOOLBOX.MAXWIDTH" = "El ancho máximo del control, en píxeles; 0 para no tener límite. También `Constraints.MaxWidth`."
"RTOOLBOX.MINHEIGHT" = "La altura mínima del control, en píxeles; 0 para no tener límite. También `Constraints.MinHeight`."
"RTOOLBOX.MINWIDTH" = "El ancho mínimo del control, en píxeles, sea quien sea que lo cambie de tamaño (el programa, Align, Anchors, el usuario); 0 para no tener límite. También `Constraints.MinWidth`."
"RTOOLBOX.ONDRAGDROP" = "Se soltó un componente arrastrado sobre el componente Target, el más anidado que se muestra allí en el formulario de la caja de herramientas (su nombre en minúsculas), en (X, Y) en los píxeles propios de Target; sobre el formulario vacío, Target es \"\" y (X, Y) está en el área de cliente del formulario. Si se suelta sobre la propia caja de herramientas, no se coloca nada."
"RTOOLBOX.ONDRAGSTART" = "La persona empezó a arrastrar un componente fuera de la caja de herramientas."
"RTOOLBOX.ONENTER" = "Se produce cuando el componente recibe el foco del teclado: Tab o Shift+Tab, un clic, SetFocus, el atajo de su etiqueta y, en el caso del primero, cuando se muestra su formulario. Llega después del OnExit del componente que tenía el foco y antes de lo que hace un clic en él (su OnMouseDown, OnClick). Cambiar a otra ventana o aplicación y volver no lo produce."
"RTOOLBOX.ONEXIT" = "Se produce cuando el componente pierde el foco del teclado en favor de otro componente de su formulario (Tab, un clic, SetFocus), antes del OnEnter de ese otro: el lugar para comprobar lo que se escribió. Cambiar a otra ventana o aplicación no lo produce, ni tampoco ocultar o deshabilitar el componente."
"RTOOLBOX.ONPICK" = "La persona eligió un componente para añadir (doble clic, Enter): su tipo con el nombre de RapidR (RButton: un diseñador lo escribe en el estilo propio de su archivo), o el nombre de una plantilla."
"RTOOLBOX.ONSELECT" = "Cambió el componente seleccionado."
"RTOOLBOX.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RTOOLBOX.REMOVETEMPLATE" = "Quita una plantilla del grupo de plantillas."
"RTOOLBOX.SELECTED" = "El tipo del componente seleccionado con el nombre de RapidR (RButton), o el nombre de una plantilla."
"RTOOLBOX.SHOWNAMES" = "Cómo se nombran los componentes: \"rapidr\" (los nombres de RapidR: RButton), \"rapidq\" (la escritura clásica: QBUTTON para los componentes clásicos, los nombres de RapidR para los demás) o \"titles\" (con palabras: \"Button\")."
"RTOOLBOX.TEMPLATE" = "El bloque CREATE de una plantilla."
"RTOOLBOX.TOP" = "La distancia al borde superior del contenedor (en un formulario: el de la pantalla), en píxeles."
"RTOOLBOX.VISIBLE" = "Si el control o formulario se muestra."
"RTOOLBOX.WIDTH" = "El ancho, en píxeles; en `Screen`, el de la pantalla."
