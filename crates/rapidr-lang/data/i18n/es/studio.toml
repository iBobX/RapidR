"RPROJECT.INSTALLRUST" = "Instala Rust con rapidr setup --yes --no-path (el conjunto de herramientas gratuito que necesitan las compilaciones nativas), en segundo plano como Build: OnBuildOutput da sus líneas, OnBuildDone su final. True cuando se inició; Error dice por qué no."
