"RPROJECT.IMPORTMISSING" = "Los archivos incluidos que el último ImportRapidQ no encontró en ninguna parte, uno por línea: el archivo y la línea del $INCLUDE, el nombre como está escrito y qué hacer, separados por tabulaciones (\"\" cuando se encontró cada incluido)."
"RPROJECT.IMPORTRAPIDQ" = "Importa un programa RapidQ —un archivo .bas, .rqw, .rqb, .rq o .inc y todos los archivos que incluye (que se buscan como los busca el compilador: la carpeta del programa, IncludeFolders, junto al archivo que incluye; sin distinguir mayúsculas y minúsculas, \\ o /), o una carpeta de ellos— como una copia con los nombres de RapidR (QBUTTON pasa a ser RButton) en Dest (si no, <name>-rapidr junto a él, el siguiente nombre libre): los incluidos copiados con ella (RAPIDQ.INC y los otros que RapidR proporciona se quedan integrados), la prueba de que cada programa compila al mismo bytecode que su original, un informe (ImportReport; ImportMissing lista los incluidos que no se encontraron en ninguna parte) y un proyecto para la copia (con el ajuste de compatibilidad con RapidQ desactivado). El original solo se lee. Da el archivo de proyecto de la copia para Open; \"\" cuando no puede (Error dice por qué). En la web, Source es un archivo o una carpeta del almacén de la página (uno que eligió la persona)."
"RPROJECT.IMPORTREPORT" = "El informe del último ImportRapidQ (rapidr-import-report.md en la copia): cada nombre cambiado con su archivo, línea y columna, cada archivo incluido y dónde se encontró, lo que se dejó y por qué, la prueba de cada programa."
