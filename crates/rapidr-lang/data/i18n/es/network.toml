# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/components/network.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"RCGI" = "Para programas CGI detrás de un servidor web (qcgi.inc): las variables CGI de la solicitud como propiedades, y Parse / Get para sus campos de formulario."
"RCGI.ACCEPT" = "Los tipos de contenido que acepta el navegador (la variable `HTTP_ACCEPT` de la solicitud); solo lectura."
"RCGI.AUTHTYPE" = "Cómo se autenticó la solicitud (la variable `AUTH_TYPE`, p. ej. `Basic`); solo lectura."
"RCGI.AUTOCONVERT" = "1 (el valor predeterminado) decodifica los valores del formulario en el método `Parse`: `%xx` se convierte en su carácter y `+` en un espacio; 0 los deja como se enviaron."
"RCGI.CONTENTLENGTH" = "La longitud en bytes del cuerpo de la solicitud (la variable `CONTENT_LENGTH`); solo lectura."
"RCGI.CONTENTTYPE" = "El tipo del cuerpo de la solicitud (la variable `CONTENT_TYPE`); solo lectura."
"RCGI.COOKIE" = "Las cookies enviadas con la solicitud (la variable `HTTP_COOKIE`); solo lectura."
"RCGI.GATEWAYINTERFACE" = "La versión de CGI que habla el servidor web (la variable `GATEWAY_INTERFACE`, `CGI/1.1`); solo lectura."
"RCGI.GET" = "Lee por clave o índice: un elemento de un arreglo, una cadena de una lista, un valor almacenado o una variable CGI; un cliente HTTP solicita una URL y devuelve el cuerpo de la respuesta."
"RCGI.MAXINPUT" = "El máximo de caracteres que el método `Parse` lee de la solicitud (32767)."
"RCGI.PARSE" = "Divide un texto en partes: una lista de cadenas divide `Source` en cada `Delim` en sus elementos y devuelve cuántos son; un CGI lee las variables de la solicitud."
"RCGI.PATHINFO" = "La ruta adicional después del nombre del script en la URL (la variable `PATH_INFO`); solo lectura."
"RCGI.PATHTRANSLATED" = "La propiedad `PathInfo` convertida en una ruta de archivo en el servidor (la variable `PATH_TRANSLATED`); solo lectura."
"RCGI.REFERER" = "La página de la que vino la solicitud (la variable `HTTP_REFERER`); solo lectura."
"RCGI.REMOTEADDR" = "La dirección IP del cliente (la variable `REMOTE_ADDR`); solo lectura."
"RCGI.REMOTEHOST" = "El nombre de host del cliente, cuando el servidor lo conoce (la variable `REMOTE_HOST`); solo lectura."
"RCGI.REMOTEIDENT" = "El nombre de usuario del cliente según una consulta ident (la variable `REMOTE_IDENT`); solo lectura."
"RCGI.REMOTEUSER" = "El nombre de usuario con el que se autenticó la solicitud (la variable `REMOTE_USER`); solo lectura."
"RCGI.REQUESTMETHOD" = "El método de la solicitud: `GET`, `POST` … (la variable `REQUEST_METHOD`); solo lectura."
"RCGI.SCRIPTNAME" = "La ruta del script en la URL (la variable `SCRIPT_NAME`); solo lectura."
"RCGI.SERVERNAME" = "El nombre de host del servidor web (la variable `SERVER_NAME`); solo lectura."
"RCGI.SERVERPORT" = "El puerto por el que llegó la solicitud (la variable `SERVER_PORT`); solo lectura."
"RCGI.SERVERPROTOCOL" = "El protocolo de la solicitud, como `HTTP/1.1` (la variable `SERVER_PROTOCOL`); solo lectura."
"RCGI.SERVERSOFTWARE" = "El nombre y la versión del servidor web (la variable `SERVER_SOFTWARE`); solo lectura."
"RCGI.USERAGENT" = "El nombre y la versión del navegador (la variable `HTTP_USER_AGENT`); solo lectura."
"RCOMPORT" = "Un puerto serial: establece el puerto y su velocidad, ábrelo con Open, luego lee y escribe cadenas de texto. Web Serial en el navegador. RapidR añade lo que necesitan las placas IoT (ESP32, Arduino): los puertos listados con sus ID de USB, las líneas DTR / RTS (el reinicio de una placa), líneas completas de entrada y un evento cuando se conecta o se desconecta un adaptador."
"RCOMPORT.ABORTALLIO" = "Cancela todas las lecturas y escrituras que aún están pendientes en el puerto serial."
"RCOMPORT.ADDFLOWCONTROL" = "Activa opciones de control de flujo del puerto serial."
"RCOMPORT.BAUDRATE" = "La velocidad de la línea serial: una constante `brXXX` (`br9600` …) o la velocidad misma en bits por segundo."
"RCOMPORT.BYTESNOTREAD" = "Bytes recibidos que aún no se han leído, tal como los vio la última lectura o escritura; solo lectura."
"RCOMPORT.BYTESNOTWRITTEN" = "Bytes que aún esperan para enviarse, tal como los vio la última lectura o escritura; solo lectura."
"RCOMPORT.CD" = "La línea Carrier Detect: 1 cuando está activa (0 mientras el puerto está cerrado)."
"RCOMPORT.CLOSE" = "Cierra lo que el componente tiene abierto: un formulario, un archivo, un puerto, un dispositivo, una conexión o una base de datos."
"RCOMPORT.CONNECTED" = "Distinto de cero mientras la conexión (base de datos, puerto serial, socket) está abierta, o mientras el joystick está conectado."
"RCOMPORT.CTS" = "La línea Clear To Send que controla el otro extremo: 1 cuando está activa (0 mientras el puerto está cerrado)."
"RCOMPORT.DATABITS" = "Bits por carácter en la línea serial (de 5 a 8)."
"RCOMPORT.DCBFLAGS" = "Los bits de indicadores de control de flujo del puerto serial, leídos al ejecutar el método `Open`: 20625 ninguno, 24725 por hardware, 21393 XON / XOFF."
"RCOMPORT.DELFLOWCONTROL" = "Desactiva opciones de control de flujo del puerto serial."
"RCOMPORT.DSR" = "La línea Data Set Ready que controla el otro extremo: 1 cuando está activa (0 mientras el puerto está cerrado)."
"RCOMPORT.DTR" = "La línea Data Terminal Ready: 1 activa, 0 inactiva. Cambia de inmediato en un puerto abierto y, si no, al ejecutar Open; hasta que se establece, sigue a DcbFlags (activa). Muchas placas la conectan, junto con RTS, a sus pines de reinicio y de arranque."
"RCOMPORT.FILLLIST" = "Vuelve a examinar los puertos y los pone en un cuadro de lista o una lista desplegable, un elemento por puerto (el nombre y luego la descripción entre paréntesis) en el orden de PortName, y selecciona el de Port; devuelve cuántos son. Port = PortName(Combo.ItemIndex) elige después uno."
"RCOMPORT.HANDLE" = "El identificador de la ventana (o de otro objeto del sistema), para llamadas a la API y para componentes que lo reciben."
"RCOMPORT.HASLINE" = "1 cuando ha llegado una línea completa (ReadLine la devuelve de inmediato)."
"RCOMPORT.INQUE" = "Bytes que esperan ahora en el búfer de recepción; solo lectura."
"RCOMPORT.LINEEND" = "Lo que termina una línea para ReadLine y OnLine: CHR$(10) si no se establece otra cosa. Con CHR$(10) también se descarta un CR justo antes, así que las líneas que terminan en CR LF o en LF se leen limpias."
"RCOMPORT.LISTPORTS" = "Examina los puertos seriales que hay ahora y devuelve cuántos son; PortName, PortDescription y los demás los leen, siendo 0 el primero. En el escritorio, todos los puertos que tiene el sistema, con los ID y los nombres de un adaptador USB; en el navegador, los puertos que se le permitieron a la página (COM1, COM2 …)."
"RCOMPORT.ONBREAK" = "Llegó una condición de break por la línea serial (el otro extremo la mantuvo en nivel bajo). Se busca mientras el programa se ejecuta, como OnRxChar: en Unix la terminal marca un break en lo que se lee, en Windows lo indica el estado de error del puerto, en un navegador, el BreakError de Web Serial."
"RCOMPORT.ONCLOSE" = "Se produce cuando se cierra el formulario, el puerto o el formulario de acoplamiento. El controlador de eventos de un formulario puede poner su parámetro BYREF Action en `caNone` (0) para mantener abierto el formulario."
"RCOMPORT.ONCOMERROR" = "Se produce cuando falla abrir, leer, escribir o cerrar el puerto serial; ErrorMessage dice qué salió mal."
"RCOMPORT.ONERROR" = "Se produce cuando falla una operación (una conexión, una consulta, una operación de socket o de puerto); el controlador recibe el mensaje de error."
"RCOMPORT.ONLINE" = "Se produce por cada línea completa que llega, sin su LineEnd (la línea se lee: ReadString y ReadLine no la ven). El entorno de ejecución revisa cada 50 ms."
"RCOMPORT.ONOPEN" = "Se produce cuando Open ha abierto el puerto serial."
"RCOMPORT.ONPORTSCHANGED" = "Se produce cuando aparecen o desaparecen puertos seriales, al conectar o desconectar un adaptador USB: los nombres añadidos y quitados, con un CR LF entre los dos. El entorno de ejecución revisa más o menos una vez por segundo (el navegador avisa de inmediato)."
"RCOMPORT.ONREADSTRING" = "Se produce después de que ReadString haya leído del puerto serial y esperado sus Wait milisegundos."
"RCOMPORT.ONRING" = "Se activó el indicador de llamada (una llamada entrante de un módem): se busca mientras el programa se ejecuta, como OnRxChar — la línea RI del puerto; en un navegador, las señales de Web Serial."
"RCOMPORT.ONRXCHAR" = "Se produce cuando llegan bytes al puerto serial (InQue: cuántos esperan a ser leídos)."
"RCOMPORT.ONTXEMPTY" = "El búfer de salida está vacío: todo lo que enviaron Write o WriteString ya salió — se produce después de su OnWriteString."
"RCOMPORT.ONWRITESTRING" = "Se produce después de que WriteString haya enviado su texto y esperado sus Wait milisegundos."
"RCOMPORT.OPEN" = "Abre aquello con lo que trabaja el componente: un archivo o dispositivo multimedia, un flujo de archivo en un modo, un puerto serial, el portapapeles o un socket que escucha en un puerto."
"RCOMPORT.OUTQUE" = "Bytes que esperan ahora en el búfer de envío; solo lectura."
"RCOMPORT.PARITY" = "La comprobación de paridad de la línea serial: `prNone`, `prOdd`, `prEven`, `prMark` o `prSpace`."
"RCOMPORT.PENDINGIO" = "Escrituras aún pendientes: siempre 0, porque la E/S de RapidR nunca queda pendiente; solo lectura."
"RCOMPORT.PORT" = "El puerto de red; en un puerto serial, su nombre (`COM1`) o número."
"RCOMPORT.PORTCOUNT" = "Cuántos puertos encontró ListPorts (primero los busca si aún no lo ha hecho)."
"RCOMPORT.PORTDESCRIPTION" = "Qué es el puerto Index: el nombre que da el sistema a su dispositivo (CP2102N USB to UART Bridge Controller) o, si no, el chip USB que nombran sus ID (CH340 USB to serial); vacío cuando nada lo dice."
"RCOMPORT.PORTMANUFACTURER" = "Quién fabricó el dispositivo USB del puerto Index, según dice el propio dispositivo (vacío si no es USB)."
"RCOMPORT.PORTNAME" = "El nombre del puerto Index tal como lo toma Port (COM3, /dev/cu.usbserial-1420, /dev/ttyUSB0); vacío después del último."
"RCOMPORT.PORTPRODUCTID" = "El ID de producto USB del puerto Index; 0 si no es USB."
"RCOMPORT.PORTSERIALNUMBER" = "El número de serie del dispositivo USB del puerto Index (vacío si no tiene): distingue dos placas del mismo tipo."
"RCOMPORT.PORTVENDORID" = "El ID de fabricante USB del puerto Index (&H10C4 Silicon Labs, &H1A86 WCH, &H0403 FTDI, &H303A Espressif); 0 si no es USB."
"RCOMPORT.PURGEIN" = "Descarta los datos que esperan en el búfer de recepción del puerto serial."
"RCOMPORT.PURGEOUT" = "Descarta los datos que aún esperan para enviarse desde el puerto serial."
"RCOMPORT.READ" = "Lee datos: hasta `NumBytes` de un socket (se devuelven), `Count` bytes de un puerto serial a un flujo, o la cantidad que ocupa una variable, de un flujo a la variable."
"RCOMPORT.READBUFSIZE" = "El tamaño del búfer de recepción del puerto serial, en bytes, leído al ejecutar el método `Open`."
"RCOMPORT.READLINE" = "La siguiente línea completa que ha llegado, sin su LineEnd, esperando hasta Timeout ms por una (1000 si se omite; 0 no espera). Vacía cuando no llegó ninguna a tiempo: la parte de una línea que ha llegado queda para la siguiente lectura."
"RCOMPORT.READSTRING" = "Lee una cadena de texto: `Count` caracteres del puerto serial, o el valor de cadena indicado de la clave del registro abierta."
"RCOMPORT.RI" = "La línea Ring Indicator: 1 cuando está activa (0 mientras el puerto está cerrado)."
"RCOMPORT.RTS" = "La línea Request To Send: 1 activa, 0 inactiva. Cambia de inmediato en un puerto abierto y, si no, al ejecutar Open; hasta que se establece, sigue a DcbFlags (activa). Con control de flujo por hardware, la controla el puerto."
"RCOMPORT.SENDBREAK" = "Mantiene la línea en break durante Duration ms (250 si se omite)."
"RCOMPORT.STOPBITS" = "Los bits de parada de la línea serial: `sbOneStopBit`, `sbOne5StopBits` o `sbTwoStopBits`."
"RCOMPORT.WAITFORLASTIO" = "Espera hasta que haya terminado la última lectura o escritura del puerto serial."
"RCOMPORT.WRITE" = "Escribe datos: `NumBytes` de un mensaje en un socket, `Count` bytes de un flujo en un puerto serial, o una variable en un flujo."
"RCOMPORT.WRITEBUFSIZE" = "El tamaño del búfer de envío del puerto serial, en bytes, leído al ejecutar el método `Open`."
"RCOMPORT.WRITESTRING" = "Escribe una cadena de texto: en el puerto serial (con espera cuando `Wait` es true), o como valor con nombre de la clave del registro abierta."
"RDOWNLOAD" = "Descarga un archivo por HTTP(S) a una variable o a un archivo, con progreso (Qdownload.inc)."
"RDOWNLOAD.CHECK" = "Devuelve true cuando hay una conexión a internet disponible; RapidR siempre indica que la hay."
"RDOWNLOAD.FILE" = "La ruta del archivo que se va a descargar en el servidor (`/dir/file.zip`)."
"RDOWNLOAD.LASTERROR" = "El número del último error de la descarga (0: ninguno); solo lectura."
"RDOWNLOAD.LASTSTRINGERROR" = "El texto del último error de la descarga; solo lectura."
"RDOWNLOAD.LEECHFILE" = "Descarga del servidor el archivo que indican las propiedades, a un archivo, a una variable o a la memoria; devuelve true si lo logra."
"RDOWNLOAD.OUTDEVICE" = "Adónde va la descarga: 1 a `OutVar`, 2 al archivo `OutFile`."
"RDOWNLOAD.OUTFILE" = "El archivo en el que se escribe la descarga (con `OutDevice` en 2)."
"RDOWNLOAD.OUTVAR" = "El texto descargado (con `OutDevice` en 1); solo lectura."
"RDOWNLOAD.PERCENT" = "Devuelve cuánto ha avanzado una transferencia, como un porcentaje entero del total."
"RDOWNLOAD.PORT" = "El puerto de red; en un puerto serial, su nombre (`COM1`) o número."
"RDOWNLOAD.SERVER" = "El nombre de host del servidor desde el que se descarga."
"RDOWNLOAD.SIZE" = "Un tamaño: de una fuente, en puntos; de un archivo, flujo, sonido o descarga, en bytes; de un arreglo, su número de valores."
"RDOWNLOAD.SPEED" = "Devuelve la velocidad de una transferencia en bytes por segundo, a partir de dos valores de `TIME$` y de los bytes transferidos."
"RDOWNLOAD.STATE" = "Lo que está haciendo: en un objeto multimedia, 0 cerrado, 1 reproduciendo, 2 en pausa, 3 detenido, 4 grabando; en una descarga, el porcentaje completado; en una casilla, 0, 1 o 2 (atenuada); en un objeto OLE, `osXXX`."
"RDOWNLOAD.STATEDEVICE" = "Dónde se muestra el progreso de la descarga: 1 en `State`, 2 en el indicador `StateGauge`."
"RDOWNLOAD.STATEGAUGE" = "El indicador que muestra el progreso de la descarga (con `StateDevice` en 2)."
"RHTTP" = "Un cliente HTTP(S): usa Get o Post con una URL y luego lee StatusCode, ResponseText y ResponseHeaders. Propio de RapidR."
"RHTTP.GET" = "Lee por clave o índice: un elemento de un arreglo, una cadena de una lista, un valor almacenado o una variable CGI; un cliente HTTP solicita una URL y devuelve el cuerpo de la respuesta."
"RHTTP.HOST" = "El nombre de host o la dirección del servidor."
"RHTTP.PORT" = "El puerto de red; en un puerto serial, su nombre (`COM1`) o número."
"RHTTP.POST" = "Envía datos de formulario a una URL en una solicitud HTTP POST y devuelve el cuerpo de la respuesta."
"RHTTP.RESPONSEHEADERS" = "Los encabezados de la última respuesta HTTP, uno por línea."
"RHTTP.RESPONSETEXT" = "El cuerpo de la última respuesta HTTP, como texto."
"RHTTP.STATUSCODE" = "El estado HTTP de la última respuesta (200, 404 …)."
"RHTTP.TIMEOUT" = "Cuánto esperar a la red, en milisegundos."
"RHTTP.URL" = "La dirección: la página que muestra la vista web, o la de la solicitud HTTP."
"RHTTP.USESSL" = "Un valor distinto de cero hace la solicitud por HTTPS."
"RHTTPSERVER" = "Un servidor web local para el programa: una API web, un panel, un servidor MCP. Escucha en 127.0.0.1 (solo esta computadora) a menos que Host indique otra cosa, y entrega al programa cada solicitud completa — su método, ruta, encabezados y cuerpo — en OnRequest, en el hilo propio del programa (la ventana nunca se congela). El programa responde entonces o más tarde con Respond, o envía Server-Sent Events en flujo (BeginStream, SendEvent, EndStream). El servidor rechaza por sí mismo lo que no corresponde: un Host que no es el suyo (DNS rebinding), una solicitud que el navegador marca como procedente de la página de otro sitio (Sec-Fetch-Site) o cuyo Origin no está permitido, cualquier cosa que no sea GET y HEAD mientras no haya un Token establecido, un token ausente o incorrecto cuando hay un Token establecido, una solicitud demasiado grande o demasiado lenta. Un enlace, una imagen o un script de la página de otro sitio aún puede enviar un GET sin Origin: los controladores de GET solo deben leer, nunca cambiar nada, y todo lo que vaya más allá de lecturas inofensivas necesita un Token (NewToken crea uno). HTTP simple, sin TLS: pensado para 127.0.0.1, donde nada viaja por la red — otros programas y personas que usan la misma computadora aún pueden conectarse, así que el Token es la protección. Propio de RapidR; solo para escritorio (una página web no puede escuchar conexiones)."
"RHTTPSERVER.ALLOWEDHOSTS" = "Más nombres a los que responde el servidor (`myhost:8080`), separados por comas; \"*\" cualquiera. Una solicitud para cualquier otro nombre de host se rechaza con 403: una página web no puede llegar a él con un nombre propio (DNS rebinding). 127.0.0.1, localhost y [::1] con el Port siempre están permitidos. Establécelo antes de Start."
"RHTTPSERVER.ALLOWEDORIGINS" = "Páginas web que pueden llamar al servidor, por origen (`https://example.com`), separadas por comas; \"*\" cualquiera. Las solicitudes propias de una página (fetch) llevan su Origin, y la de cualquier otra página se rechaza con 403, igual que todo lo que el navegador marca como `Sec-Fetch-Site: cross-site`. Pero un enlace, una imagen o un script de la página de otro sitio puede enviar un GET sin ningún Origin: los controladores de GET solo deben leer, y todo lo que vaya más allá de lecturas inofensivas necesita un Token. Las solicitudes que no vienen de una página (curl, una aplicación de IA) no tienen Origin. La propia dirección del servidor siempre está permitida. Establécelo antes de Start."
"RHTTPSERVER.BEGINSTREAM" = "Responde a una solicitud con un flujo de Server-Sent Events (200, `text/event-stream` y Headers); SendEvent envía cada uno, EndStream lo termina. Sin Request, la solicitud que atiende OnRequest."
"RHTTPSERVER.CLOSE" = "Cierra ahora la conexión de una solicitud, sin respuesta."
"RHTTPSERVER.ENDSTREAM" = "Termina un flujo que inició BeginStream."
"RHTTPSERVER.ERROR" = "Por qué falló Start (el puerto está en uso, un Host incorrecto); \"\" cuando funcionó."
"RHTTPSERVER.HEADER" = "Un encabezado de la solicitud (`Content-Type`, sin distinguir mayúsculas y minúsculas): \"\" si no tiene ninguno."
"RHTTPSERVER.HOST" = "La dirección en la que escucha: 127.0.0.1, solo esta computadora (el valor predeterminado); 0.0.0.0, todas las interfaces de red (entonces indica en AllowedHosts los nombres que usan las otras computadoras). Establécela antes de Start."
"RHTTPSERVER.LISTENING" = "Es True mientras escucha."
"RHTTPSERVER.MAXCONNECTIONS" = "Cuántas conexiones pueden estar abiertas a la vez; a una más se le responde 503. Establécelo antes de Start."
"RHTTPSERVER.MAXREQUESTSIZE" = "El cuerpo más grande que puede tener una solicitud; uno más grande se rechaza con 413. Establécelo antes de Start."
"RHTTPSERVER.METHOD" = "El método de la solicitud (GET, POST …), como el Method de OnRequest."
"RHTTPSERVER.NEWTOKEN" = "Establece Token con uno nuevo al azar — 64 dígitos hexadecimales de la fuente aleatoria segura del sistema operativo — y lo devuelve, para dárselo al programa que llamará al servidor (guárdalo con RSecrets). \"\" cuando el sistema no da ninguno (Error dice por qué). Llámalo antes de Start."
"RHTTPSERVER.ONREQUEST" = "Llegó una solicitud: su método, su ruta (sin la consulta: Query la contiene), sus encabezados (líneas `Name: value`, con CR LF entre ellas) y su cuerpo, como texto. De una en una: la siguiente espera hasta que termine este controlador. Responde con Respond (o BeginStream), ahora o más tarde con el número de Request; una solicitud que ningún controlador responde queda abierta hasta que su cliente se rinde."
"RHTTPSERVER.PATH" = "La ruta de la solicitud sin la consulta (`/mcp`), tal como se envió (sin decodificar)."
"RHTTPSERVER.PEER" = "La dirección de la que vino la solicitud (`127.0.0.1:53211`)."
"RHTTPSERVER.PORT" = "El puerto en el que escucha; 0 (el valor predeterminado) deja que el sistema elija uno libre, y Port dice cuál después de Start."
"RHTTPSERVER.QUERY" = "Lo que sigue al signo `?` de la ruta (`q=1&n=2`), \"\" si no hay."
"RHTTPSERVER.REQUEST" = "El número de la solicitud que atiende OnRequest: guárdalo para responder más tarde (el último argumento de Respond, de BeginStream y de SendEvent)."
"RHTTPSERVER.RESPOND" = "Responde a una solicitud: su estado (200, 404 …), sus encabezados (líneas `Name: value`, con CHR$(13) + CHR$(10) o CHR$(10) entre ellas; el servidor añade Content-Length y, para texto, Content-Type) y su cuerpo. Sin Request, la que atiende OnRequest. True cuando se envió; False cuando esa solicitud ya estaba respondida o su cliente se fue."
"RHTTPSERVER.SENDEVENT" = "Envía un evento por un flujo que inició BeginStream: `event: EventName` (cuando se da) y Data como líneas `data:`. False cuando el cliente se fue (el flujo terminó)."
"RHTTPSERVER.START" = "Empieza a escuchar en Host:Port: True cuando lo logra, False cuando no puede (Error dice por qué)."
"RHTTPSERVER.STOP" = "Deja de escuchar; las conexiones abiertas se cierran."
"RHTTPSERVER.TIMEOUT" = "Cuánto puede tardar una solicitud en llegar completa (si no, 408) y cuánto tiempo queda abierta una conexión inactiva. Establécelo antes de Start."
"RHTTPSERVER.TOKEN" = "Cuando está establecido, toda solicitud debe llevarlo como `Authorization: Bearer <token>`; si no, el servidor responde 401 por sí mismo. Sin uno, el servidor solo responde a GET y HEAD (todo lo demás recibe 401): establece uno para todo lo que cambie algo. Créalo con NewToken (nunca con RND: no sirve para secretos) y guárdalo con RSecrets. Establécelo antes de Start."
"RHTTPSERVER.URL" = "Su dirección una vez iniciado: `http://127.0.0.1:47110/`."
"RMCPSERVER" = "Ofrece las herramientas propias del programa a las aplicaciones de IA que admiten MCP, el protocolo que usan las aplicaciones de IA para las herramientas: una aplicación de IA de esta computadora que tenga la dirección y el token puede llamarlas, y el programa ve cada llamada en OnToolCall, en su propio hilo, de una en una, y la responde entonces o más tarde con Reply (texto), ReplyImage (una imagen) o ReplyJson. Añade cada herramienta con AddTool: su nombre, lo que hace en una frase que lee la IA, el JSON Schema de sus argumentos y cómo actúa (\"read\", \"change\" …). El componente habla el protocolo por sí mismo — la revisión actual (2026-07-28, sin sesión) y las anteriores basadas en initialize — y comprueba los argumentos de cada llamada contra el esquema de la herramienta antes de que el programa los vea: una llamada incorrecta se responde de inmediato con una frase que dice lo que necesita la herramienta. Escucha en 127.0.0.1 (solo esta computadora) y se niega a iniciarse sin un Token (NewToken crea uno): toda solicitud debe llevarlo como `Authorization: Bearer <token>`. También rechaza una solicitud para otro nombre de host y cualquier solicitud de una página web. Clients muestra quién está conectado; Disconnect deja fuera a una aplicación de IA hasta el próximo Start. Lo que el programa expone y la privacidad de los datos de quienes lo usan son responsabilidad de quien crea el programa: ofrece solo lo que una aplicación de IA puede ver, y describe el programa como que funciona con clientes MCP en lugar de poner MCP en su nombre. Propio de RapidR; solo para escritorio (una página web no puede escuchar conexiones)."
"RMCPSERVER.ADDRESOURCE" = "Ofrece algo que las aplicaciones de IA pueden leer (app://notes/today): OnReadResource se lo pide al programa, y Reply da su texto."
"RMCPSERVER.ADDTOOL" = "Ofrece una herramienta: su nombre (letras, dígitos, _ - .), lo que hace — la frase que lee la IA para decidir cuándo llamarla —, sus argumentos — como los parámetros de una SUB (`Text AS STRING, [Count AS INTEGER]`, los opcionales entre [ ]; STRING, INTEGER, DOUBLE, BOOLEAN, LIST, OBJECT) o como un JSON Schema ({\"type\": \"object\", \"properties\": {…}}); \"\" si no tiene — y cómo actúa: \"read\" (solo lee), \"change\", \"delete\", \"network\", o las anotaciones como JSON. Si se añade otra vez, se reemplaza. False cuando el nombre o el esquema es incorrecto (Error dice por qué)."
"RMCPSERVER.ALLOWEDHOSTS" = "Más nombres de host a los que responde el servidor, separados por comas; 127.0.0.1, localhost y [::1] con el Port siempre están permitidos. Establécelo antes de Start."
"RMCPSERVER.ALLOWEDORIGINS" = "Páginas web que pueden llamar al servidor, por origen, separadas por comas: déjalo vacío — las aplicaciones de IA no son páginas web, y la solicitud de una página se rechaza. Establécelo antes de Start."
"RMCPSERVER.ARGUMENT" = "Uno de los argumentos de la llamada como texto: una cadena de texto tal cual, un número o true / false tal como se escribió, una lista o un objeto como JSON; \"\" si no se dio. `options.size` llega al interior de un objeto."
"RMCPSERVER.ARGUMENTS" = "Los argumentos de la llamada, como JSON (el Arguments de OnToolCall)."
"RMCPSERVER.CALL" = "El número de la llamada que atiende OnToolCall: guárdalo para responder más tarde (el primer argumento de Reply)."
"RMCPSERVER.CLEARRESOURCES" = "Quita todos los recursos."
"RMCPSERVER.CLEARTOOLS" = "Quita todas las herramientas."
"RMCPSERVER.CLIENTCOUNT" = "Cuántas aplicaciones de IA están conectadas."
"RMCPSERVER.CLIENTNAME" = "La aplicación de IA que hace la llamada que atiende OnToolCall, tal como se nombra a sí misma (su título o, si no, su nombre)."
"RMCPSERVER.CLIENTS" = "Las aplicaciones de IA conectadas, una por línea: nombre, versión, segundos desde su último mensaje y cuántas herramientas llamó, con un TAB entre ellos."
"RMCPSERVER.DISCONNECT" = "Deja fuera a una aplicación de IA — la indicada, o todas si no se indica ninguna — hasta el próximo Start: se avisa a sus llamadas en espera y se rechazan sus solicitudes. Solo un token nuevo deja fuera a una aplicación de IA que se presenta de nuevo con su nombre: NewToken y luego Start."
"RMCPSERVER.ERROR" = "Por qué falló la última llamada a Start, AddTool o ReplyJson; \"\" cuando funcionó."
"RMCPSERVER.HOST" = "La dirección en la que escucha: 127.0.0.1, solo esta computadora (el valor predeterminado y la opción segura). Otra dirección abre las herramientas del programa a la red: no lo hagas, a menos que conozcas todas las computadoras que pueden llegar a él. Establécela antes de Start."
"RMCPSERVER.IDLESECONDS" = "Una aplicación de IA en silencio durante este tiempo (15 minutos de forma predeterminada) se considera desconectada: OnDisconnect. Establécelo antes de Start."
"RMCPSERVER.INSTRUCTIONS" = "Unas frases para la IA: para qué sirven las herramientas y cómo usarlas bien. Establécelo antes de Start."
"RMCPSERVER.ISOPEN" = "Es True mientras la llamada espera una respuesta."
"RMCPSERVER.LISTENING" = "Es True mientras escucha."
"RMCPSERVER.MAXCONNECTIONS" = "Cuántas conexiones pueden estar abiertas a la vez. Establécelo antes de Start."
"RMCPSERVER.MAXREQUESTSIZE" = "El mensaje más grande que puede enviar una aplicación de IA; uno más grande se rechaza con 413. Establécelo antes de Start."
"RMCPSERVER.NEWTOKEN" = "Establece Token con uno nuevo al azar — 64 dígitos hexadecimales de la fuente aleatoria segura del sistema operativo — y lo devuelve. Un token nuevo deja fuera a toda aplicación de IA que tenía el anterior (después del próximo Start)."
"RMCPSERVER.ONCONNECT" = "Una aplicación de IA se comunica por primera vez."
"RMCPSERVER.ONDISCONNECT" = "Una aplicación de IA terminó su sesión, fue desconectada o ha estado en silencio durante IdleSeconds."
"RMCPSERVER.ONREADRESOURCE" = "Una aplicación de IA lee un recurso que ofrece AddResource: responde con Reply (su texto)."
"RMCPSERVER.ONTOOLCALL" = "Una aplicación de IA llama a una herramienta: su nombre, sus argumentos como JSON (Argument lee uno) y el número de la llamada. De una en una: la siguiente espera hasta que termine este controlador. Responde con Reply ahora, o más tarde con el número (por ejemplo, después de preguntar a quien usa el programa) — mientras tanto, Progress."
"RMCPSERVER.PATH" = "La ruta de la dirección a la que las aplicaciones de IA envían sus mensajes. Establécela antes de Start."
"RMCPSERVER.PENDINGCOUNT" = "Cuántas llamadas esperan una respuesta."
"RMCPSERVER.PORT" = "El puerto en el que escucha; 0 (el valor predeterminado) deja que el sistema elija uno libre, y Port dice cuál después de Start. Las aplicaciones de IA guardan la dirección, así que un programa que se inicia de nuevo debería conservar su puerto. Establécelo antes de Start."
"RMCPSERVER.PROGRESS" = "Informa cómo va una llamada que espera (\"Asking the user…\", 3 de 10) a una aplicación de IA que escucha ese aviso. False cuando no lo escucha."
"RMCPSERVER.REMOVETOOL" = "Quita una herramienta: True cuando había una con ese nombre."
"RMCPSERVER.REPLY" = "Responde a una llamada con texto — lo que lee la IA — marcado como fallo cuando IsError es True (di qué salió mal y qué hacer en su lugar: la IA actúa según eso). False cuando esa llamada ya estaba respondida o su aplicación de IA se fue."
"RMCPSERVER.REPLYIMAGE" = "Responde a una llamada con una imagen — un archivo PNG, JPEG, GIF o WebP (un BMP se envía como PNG) — y, si se da, un texto antes de ella."
"RMCPSERVER.REPLYJSON" = "Responde a una llamada con un objeto de resultado completo como JSON, para lo que Reply no puede expresar ({\"content\": […], \"structuredContent\": {…}})."
"RMCPSERVER.SERVERNAME" = "El nombre del programa tal como lo ven las aplicaciones de IA (un identificador corto: my-notes); \"\" equivale a rapidr-app. Establécelo antes de Start."
"RMCPSERVER.SERVERTITLE" = "El nombre del programa tal como lo muestran las aplicaciones de IA a quien las usa (My Notes). Establécelo antes de Start."
"RMCPSERVER.SERVERVERSION" = "La versión del programa, tal como la ven las aplicaciones de IA. Establécela antes de Start."
"RMCPSERVER.START" = "Empieza a escuchar en Host:Port: True cuando lo logra, False cuando no puede — falta el Token, el puerto está en uso — y Error dice por qué."
"RMCPSERVER.STOP" = "Deja de escuchar: a las llamadas que aún esperan se les avisa de que el servidor se detuvo y las conexiones se cierran."
"RMCPSERVER.TIMEOUT" = "Cuánto puede tardar un mensaje en llegar completo y cuánto tiempo queda abierta una conexión inactiva. Establécelo antes de Start."
"RMCPSERVER.TOKEN" = "Lo que toda solicitud debe llevar como `Authorization: Bearer <token>` (si no, 401). Start se niega a ejecutarse sin uno. Créalo con NewToken, guárdalo con RSecrets y muéstraselo solo a la persona que configura la aplicación de IA. Establécelo antes de Start."
"RMCPSERVER.TOOL" = "La herramienta de la llamada que atiende OnToolCall."
"RMCPSERVER.TOOLCOUNT" = "Cuántas herramientas ofrece."
"RMCPSERVER.URL" = "Su dirección una vez iniciado, a la que se conectan las aplicaciones de IA: `http://127.0.0.1:47120/mcp`."
"RSERVERSOCKET" = "Un servidor TCP: escucha en un puerto, acepta clientes e intercambia datos con ellos — por líneas (lo predeterminado), según llegan los bytes o como solicitudes HTTP completas (Mode). Sus eventos se producen cuando el programa llama a Poll (desde un temporizador RTimer). Propio de RapidR; solo para escritorio: una página web no puede escuchar conexiones de red (un navegador le permite abrir WebSockets y hacer solicitudes HTTP, nunca un puerto propio). Para una API web, un panel o un servidor MCP, RHttpServer se encarga del HTTP por ti."
"RSERVERSOCKET.ACCEPT" = "Igual que Poll."
"RSERVERSOCKET.BROADCAST" = "Envía Data y un fin de línea a todos los clientes."
"RSERVERSOCKET.CLIENTCOUNT" = "El número de clientes conectados ahora al servidor."
"RSERVERSOCKET.DISCONNECT" = "Cierra la conexión del cliente que está en Address (después se produce OnClientDisconnect): 1 cuando había uno."
"RSERVERSOCKET.HOST" = "La dirección en la que escucha: 0.0.0.0, todas las interfaces de red (el valor predeterminado), o 127.0.0.1, solo esta computadora — lo que debe usar un servidor con el que solo hablan los programas de esta computadora (nada de la red puede llegar a él). Establécela antes de Start."
"RSERVERSOCKET.LISTEN" = "Igual que Start."
"RSERVERSOCKET.MODE" = "Cómo llega a OnDataReceived lo que envía un cliente: \"lines\" (el valor predeterminado), cada línea, sin espacios sobrantes y sin las vacías — con una última línea sin su fin cuando el cliente cierra; \"bytes\", lo que llegó tal como llegó, sin recortar ni omitir nada; \"http\", cada solicitud HTTP completa: su línea de solicitud, los encabezados, una línea en blanco y su cuerpo, sea cual sea su tamaño, según su Content-Length o sus fragmentos (unidos, con un Content-Length), hasta 4 MB (respóndela con Send). \"http\" no comprueba nada por ti (sin token, sin comprobación de Host ni de Origin) y RServerSocket escucha en todas las interfaces de red a menos que Host = \"127.0.0.1\": para una API web usa RHttpServer, o al menos establece Host = \"127.0.0.1\". Establécelo antes de Start."
"RSERVERSOCKET.ONCLIENTCONNECT" = "Se produce cuando un cliente se conecta al socket de servidor; el controlador recibe la dirección del cliente."
"RSERVERSOCKET.ONCLIENTDISCONNECT" = "Se produce cuando un cliente se desconecta del socket de servidor; el controlador recibe la dirección del cliente."
"RSERVERSOCKET.ONDATARECEIVED" = "Se produce cuando llegan datos de un cliente; el controlador recibe la dirección del cliente y los datos."
"RSERVERSOCKET.ONERROR" = "Se produce cuando falla una operación (una conexión, una consulta, una operación de socket o de puerto); el controlador recibe el mensaje de error."
"RSERVERSOCKET.POLL" = "Produce los eventos que llegaron desde la última llamada a Poll: OnClientConnect, OnDataReceived, OnClientDisconnect. Llámalo desde un temporizador RTimer (cada 25 a 100 ms)."
"RSERVERSOCKET.PORT" = "El puerto en el que escucha; 0 deja que el sistema elija uno libre, y Port dice cuál después de Start."
"RSERVERSOCKET.SEND" = "Envía Data tal cual, sin añadir nada, al cliente que está en Address: una respuesta HTTP, parte de una línea. 1 cuando se envió."
"RSERVERSOCKET.SENDTO" = "Envía Data y un fin de línea al cliente que está en Address (tal como lo dio OnClientConnect): 1 cuando se envió."
"RSERVERSOCKET.START" = "Escucha en Host:Port: 1 cuando lo logra, 0 cuando no puede (el puerto está en uso)."
"RSERVERSOCKET.STOP" = "Deja de escuchar y cierra la conexión de todos los clientes."
"RSOCKET" = "Un socket cliente TCP: conéctalo a un host y un puerto, luego lee y escribe texto o bytes. En el navegador se conecta por WebSocket."
"RSOCKET.ACCEPT" = "Toma una conexión de cliente en espera: con el número de un socket que escucha devuelve el número del nuevo socket cliente; en un RSERVERSOCKET atiende a los clientes y mensajes en espera, como el método `Poll`."
"RSOCKET.BINDADDRESS" = "La dirección en la que escucha Open(Port) cuando no se le da una: 0.0.0.0, todas las interfaces de red (el valor predeterminado), o 127.0.0.1, solo esta computadora — lo que debe usar un servidor con el que solo hablan los programas de esta computadora (nada de la red puede llegar a él, y el sistema no pregunta por las conexiones entrantes)."
"RSOCKET.CLOSE" = "Cierra lo que el componente tiene abierto: un formulario, un archivo, un puerto, un dispositivo, una conexión o una base de datos."
"RSOCKET.CONNECT" = "Abre una conexión: a un servidor MySQL a partir de un host, un nombre de usuario y una contraseña (true si lo logra), o al puerto TCP `PortNum` de un servidor (el número del nuevo socket, -1 si falla)."
"RSOCKET.CONNECTED" = "Distinto de cero mientras la conexión (base de datos, puerto serial, socket) está abierta, o mientras el joystick está conectado."
"RSOCKET.CONNECTIONREADY" = "Devuelve true cuando el socket con el número `Sock` está listo: hay un cliente esperando a ser aceptado en un socket de servidor."
"RSOCKET.DISCONNECT" = "Cierra la conexión. Igual que `Close`."
"RSOCKET.FAMILY" = "La familia de direcciones del socket, una de las constantes `AF_XXX` (`AF_INET`)."
"RSOCKET.GETHOSTIP" = "Devuelve la dirección IP de esta computadora."
"RSOCKET.GETHOSTNAME" = "Devuelve el nombre de red de esta computadora."
"RSOCKET.GETPEERNAME" = "Devuelve la dirección del otro extremo del socket `Socket`."
"RSOCKET.HOST" = "El nombre de host o la dirección del servidor."
"RSOCKET.ISCLIENTREADY" = "Devuelve true cuando el socket cliente `ClientSock` del socket de servidor `Sock` tiene datos para leer."
"RSOCKET.ISSERVERREADY" = "Devuelve true cuando el socket `Sock` tiene datos del servidor para leer."
"RSOCKET.LPARAM" = "El valor adicional del último mensaje del socket (`WMessage`)."
"RSOCKET.MYSOCKET" = "El identificador del socket; solo lectura."
"RSOCKET.ONCONNECT" = "Se produce cuando se establece la conexión: una base de datos abierta con Connect, un socket conectado a su host."
"RSOCKET.ONDISCONNECT" = "Se produce cuando se cierra la conexión: una base de datos con Close, un socket por cualquiera de los dos lados."
"RSOCKET.ONERROR" = "Se produce cuando falla una operación (una conexión, una consulta, una operación de socket o de puerto); el controlador recibe el mensaje de error."
"RSOCKET.OPEN" = "Escucha en el puerto PortNum: devuelve el número del socket de servidor (-1 cuando no puede). Address (propio de RapidR) indica dónde: \"127.0.0.1\", solo esta computadora; sin él, BindAddress (0.0.0.0, todas las interfaces de red). Un navegador no puede escuchar: -1 en la web."
"RSOCKET.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RSOCKET.PEEK" = "Devuelve hasta `NumBytes` bytes que esperan en el socket `Socket`, dejándolos para que se lean."
"RSOCKET.PORT" = "El puerto de red; en un puerto serial, su nombre (`COM1`) o número."
"RSOCKET.PROTOCOL" = "El protocolo del socket, una de las constantes `IPPROTO_XXX`."
"RSOCKET.READ" = "Lee datos: hasta `NumBytes` de un socket (se devuelven), `Count` bytes de un puerto serial a un flujo, o la cantidad que ocupa una variable, de un flujo a la variable."
"RSOCKET.READBYTE" = "Lee un byte del socket o del flujo."
"RSOCKET.READLINE" = "Lee una línea de texto, sin su fin de línea."
"RSOCKET.RECEIVE" = "Devuelve el siguiente mensaje recibido en el WebSocket. Igual que `Read`."
"RSOCKET.SEND" = "Envía texto por el WebSocket. Igual que `Write`."
"RSOCKET.TAG" = "Un número para uso propio del programa; RapidR nunca lo lee."
"RSOCKET.TIMEOUT" = "Cuánto esperar a la red, en milisegundos."
"RSOCKET.TRANSFERRED" = "Bytes enviados o recibidos en la última transferencia; solo lectura."
"RSOCKET.TYPE" = "El tipo del socket: un socket de flujo (TCP) o de datagramas (UDP)."
"RSOCKET.WMESSAGE" = "El mensaje de ventana que el socket envía en sus eventos (0: ninguno)."
"RSOCKET.WRITE" = "Escribe datos: `NumBytes` de un mensaje en un socket, `Count` bytes de un flujo en un puerto serial, o una variable en un flujo."
"RSOCKET.WRITEBYTE" = "Escribe un byte en el socket o en el flujo."
"RSOCKET.WRITELINE" = "Escribe texto seguido de un fin de línea. Una cadena de texto se escribe como la escribe `WriteStr`: en bytes, o en UTF-8 cuando tiene un carácter por encima de 255."
