# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/globals.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"APPLICATION" = "El programa en ejecución: su archivo y carpeta, título, ícono, configuración de sugerencias, el Theme de RapidR (y OnThemeChange cuando cambia el aspecto), el Language de RapidR (y OnLanguageChange) y Terminate para finalizarlo."
"APPLICATION.ACTIVE" = "True mientras el programa es la aplicación en primer plano: una de sus ventanas tiene el teclado. False mientras la persona trabaja en otra aplicación. Para el trabajo que espera hasta que se regresa al programa — RapidR Studio busca los archivos cambiados fuera de él cuando vuelve a estar en primer plano. Siempre True en la web y en un programa sin ventanas."
"APPLICATION.ANNOUNCE" = "Hace que el lector de pantalla del sistema diga Text sin mover el foco: con cortesía, cuando ya haya terminado lo que está diciendo — o de inmediato, interrumpiendo, cuando Assertive es True (reserva eso para lo que no puede esperar: un error, una conexión perdida). Sirve para avisos que la persona no pidió: el resultado de una búsqueda, una tarjeta nueva en un listado de novedades, una descarga terminada. El mismo texto dicho otra vez se dice otra vez. En el escritorio mediante las regiones dinámicas de la ventana con el foco (AccessKit), en la web mediante la región aria-live de la página; si no hay un lector de pantalla activo, no ocurre nada."
"APPLICATION.EXENAME" = "El nombre del archivo ejecutable del programa; solo lectura."
"APPLICATION.GETPRIORITY" = "Devuelve la prioridad del proceso del programa."
"APPLICATION.HANDLE" = "El identificador de la ventana (o de otro objeto del sistema), para llamadas a la API y para componentes que lo reciben."
"APPLICATION.HELPCOMMAND" = "Envía el comando `Command` con `Data` al sistema de ayuda del archivo de ayuda del programa."
"APPLICATION.HELPCONTEXT" = "Abre el archivo de ayuda del programa en el tema con el número de contexto `Context`."
"APPLICATION.HELPFILE" = "El archivo de ayuda que el programa abre con F1."
"APPLICATION.HELPJUMP" = "Abre el archivo de ayuda del programa en el tema `JumpID`."
"APPLICATION.HINTCOLOR" = "El color de fondo de las sugerencias, como &HBBGGRR."
"APPLICATION.HINTHIDEPAUSE" = "Cuánto tiempo permanece visible una sugerencia, en milisegundos (2500)."
"APPLICATION.HINTPAUSE" = "Cuánto tiempo debe detenerse el mouse antes de que se muestre una sugerencia, en milisegundos (500)."
"APPLICATION.HINTSHORTPAUSE" = "La espera antes de la siguiente sugerencia cuando el mouse pasa a otro control, en milisegundos (50)."
"APPLICATION.ICOHANDLE" = "Establece el ícono a partir de un identificador de recurso (`$RESOURCE`); solo escritura."
"APPLICATION.ICON" = "El ícono (el nombre de un archivo .ICO) de la ventana, de la aplicación o de la imagen."
"APPLICATION.KEYSPENDING" = "Cuántas teclas enviadas con SendKeys aún esperan llegar a las ventanas del programa."
"APPLICATION.LANGUAGE" = "El idioma que habla el programa, como un código de idioma (`es`, `es-AR`, `pt-BR`, `zh-Hans`): el del sistema hasta que el programa lo establece. `TR$` y `TRN$` traducen a ese idioma usando la carpeta `lang` del programa (`es-AR`: `lang/es-AR.po`, luego `lang/es.po`, luego el texto propio del programa). Al establecerlo se vuelven a leer los catálogos; \"\" vuelve al idioma del sistema. Se acepta cualquier forma de escribirlo (`es_ar` se lee de vuelta como `es-AR`). Cuando cambia el idioma, los textos, las sugerencias y los nombres accesibles que vinieron de los catálogos se traducen otra vez por sí solos (OnLanguageChange se encarga del resto)."
"APPLICATION.LANGUAGEFOLDER" = "La carpeta en la que están los catálogos del programa (`es.po`, `pt-BR.po` …): \"\" (el valor predeterminado) es la carpeta `lang` junto al programa; una carpeta relativa también está junto al programa, y en la web junto a la página. Al establecerla se vuelven a leer los catálogos, igual que un cambio de idioma."
"APPLICATION.LANGUAGENAME" = "El nombre propio de un idioma, como lo escriben sus hablantes, para una lista en la que la gente elige: `Español` para \"es\", `Português (Brasil)` para \"pt-BR\", `中文（简体）` para \"zh-Hans\"; el propio código para un idioma que RapidR no nombra."
"APPLICATION.LANGUAGES" = "Los idiomas que tienen los catálogos del programa, un código de idioma por línea (`es`, `pt-BR`): los archivos `.po` de su carpeta de catálogos (LanguageFolder; en la web, el `index.txt` de la carpeta que escriben las compilaciones). Sirve para una lista en la que la gente elige su idioma, junto con LanguageName."
"APPLICATION.MINIMIZE" = "Minimiza las ventanas del programa."
"APPLICATION.ONERROR" = "Un error de ejecución terminó uno de los controladores de eventos del programa (el de un clic, el de un temporizador …) y el programa continúa, como después de un error así: el mensaje del error (\"Division by zero\", \"Cannot create file icons/a.svg.\"), el archivo y la línea en que ocurrió (\"\" y 0 cuando no se conocen). Para un programa que protege el trabajo de quien lo usa: decir qué pasó, escribirlo en un registro, guardar lo que no está guardado. Se produce después del error, en la siguiente vuelta del ciclo de eventos, una vez por error; no por un error en este mismo controlador. Sin controlador, el error solo se escribe en la salida de errores del programa. Un error en el código del programa principal (no en un controlador) sigue terminando el programa. `SUB Failed(Message AS STRING, File AS STRING, Line AS INTEGER)` … `Application.OnError = Failed`. Una compilación nativa no informa archivo ni línea (\"\" y 0)."
"APPLICATION.ONLANGUAGECHANGE" = "El idioma del programa cambió (el programa asignó otro a Language): se produce una vez por cambio, en la siguiente vuelta del ciclo de eventos, desde el momento en que se asigna el controlador. Los textos, las sugerencias y los nombres accesibles que son por completo el texto de un catálogo se traducen de nuevo antes de que se ejecute; el texto hecho con marcadores de posición ya rellenados (`TR$(\"Line {n}\", \"n\", 5)`), los elementos de lista y las pestañas son valores, no enlaces: vuelve a asignarlos aquí (`Label1.Caption = TR$(\"Save file\")`). Language dice el idioma actual."
"APPLICATION.ONTHEMECHANGE" = "El aspecto con que se dibuja el programa cambió: el programa asignó otro aspecto a Theme, o el sistema cambió entre claro, oscuro y contraste alto mientras el programa lo sigue (el aspecto de RapidR, `$THEME rapidr`, el predeterminado). Se produce una vez por cambio, después de este, desde el momento en que se asigna el controlador. Los colores que el programa leyó con ThemeColor son valores, no enlaces: vuelve a leerlos aquí y asígnalos (`Label1.Font.Color = Application.ThemeColor(\"page.text\")`); los colores del sistema de Windows (clBtnFace, clWindowText …) y los propios de los componentes siguen el aspecto por sí solos. Theme dice el aspecto actual."
"APPLICATION.PATH" = "La carpeta donde está el ejecutable del programa; solo lectura."
"APPLICATION.REDUCEDMOTION" = "True cuando la persona pidió al sistema movimiento reducido (Reducir movimiento de macOS, las animaciones desactivadas de Windows, prefers-reduced-motion del navegador): las animaciones propias del programa —un pulso, un deslizamiento— se quedan quietas o terminan de inmediato, como las de RapidR. Léela cada vez que empiece una animación."
"APPLICATION.SENDKEYS" = "Envía teclas a la ventana del propio programa que está al frente, como si se escribieran: una por vuelta del ciclo de eventos, por el mismo camino del teclado que las teclas de la persona (foco, atajos, OnKeyDown / OnKeyPress). La notación clásica de SendKeys: + Shift, ^ Ctrl, % Alt (para la tecla siguiente o un grupo entre paréntesis), ~ Enter, {TAB}, {ENTER}, {BS}, {DEL}, {ESC}, {UP}, {DOWN}, {LEFT}, {RIGHT}, {HOME}, {END}, {PGUP}, {PGDN}, {INS}, {F1} a {F16}, {+} {^} {%} {~} {(} {)} {{} {}} para esos caracteres, {KEY n} para presionar n veces. False, y no se envía nada, cuando Keys está mal formada."
"APPLICATION.SETPRIORITY" = "Establece la prioridad del proceso del programa."
"APPLICATION.SHOWHINT" = "Muestra la sugerencia `Hint` cuando el mouse se detiene sobre el control; en `Application`, activa o desactiva todas las sugerencias."
"APPLICATION.TERMINATE" = "Lo termina: detiene el hilo, o termina el programa."
"APPLICATION.THEME" = "El aspecto con que se dibuja el programa ahora, por su nombre: `rapidr light`, `rapidr dark`, `rapidr high contrast` o `classic`. Al asignarlo acepta cualquier nombre que acepta `$THEME` (`rapidr`: el aspecto de RapidR igual al del sistema)."
"APPLICATION.THEMECOLOR" = "Un color del tema actual por su nombre, como valor de color (&HBBGGRR): los propios del tema (\"face\", \"window\", \"accent\" …) y los de un IDE (\"toolbar\", \"statusbar\", \"statusbar.running\", \"page.link\", \"editor.keyword\", los del depurador \"debug.number\", \"debug.string\", \"debug.changed\" …; los colores de estado \"status.info\", \"status.success\", \"status.warning\", \"status.danger\" —un relleno suave—, cada uno con su \".text\" y su \".border\"); -1 para un nombre que ningún tema tiene. El color del aspecto actual: léelo de nuevo en OnThemeChange, cuando cambia el aspecto."
"APPLICATION.TITLE" = "El título de un cuadro de diálogo, de la aplicación (barra de tareas), de un trabajo de impresión, de una notificación o de un gráfico."
"CLIPBOARD" = "El portapapeles: su texto y los formatos que contiene (el portapapeles del sistema en el escritorio)."
"CLIPBOARD.CLEAR" = "Vacía el componente: quita sus elementos, líneas, texto o datos, o borra su dibujo."
"CLIPBOARD.CLOSE" = "Cierra lo que el componente tiene abierto: un formulario, un archivo, un puerto, un dispositivo, una conexión o una base de datos."
"CLIPBOARD.FORMAT" = "Un formato que contiene el portapapeles, `Format(i)` desde 0."
"CLIPBOARD.FORMATCOUNT" = "El número de formatos que contiene el portapapeles; solo lectura."
"CLIPBOARD.GETASHANDLE" = "Devuelve un identificador de los datos del portapapeles en el formato `Format`."
"CLIPBOARD.GETASTEXT" = "Devuelve el texto del portapapeles."
"CLIPBOARD.HASFORMAT" = "Devuelve true cuando el portapapeles contiene datos en el formato `Format`."
"CLIPBOARD.OPEN" = "Abre aquello con lo que trabaja el componente: un archivo o dispositivo multimedia, un flujo de archivo en un modo, un puerto serial, el portapapeles o un socket que escucha en un puerto."
"CLIPBOARD.SETASHANDLE" = "Pone en el portapapeles los datos del identificador `Handle` en el formato `Format`."
"CLIPBOARD.SETASTEXT" = "Pone texto en el portapapeles."
"CLIPBOARD.TEXT" = "El texto: el contenido de un cuadro de texto o de un memo, el texto editable de una lista desplegable, los elementos de una lista uno por línea, el texto de un nodo de árbol o el contenido de un flujo."
"FILEREC" = "Lo que encontró el último DIR$: el nombre del archivo, su nombre corto, la fecha, la hora y el tamaño."
"FILEREC.DATE" = "La fecha elegida en el selector de fecha y hora, o la fecha de un archivo (`FileRec`), como texto."
"FILEREC.FILENAME" = "El archivo elegido en un cuadro de diálogo (con su carpeta), o el archivo que el objeto lee o escribe."
"FILEREC.FILETIME" = "La fecha y la hora del archivo como un solo número empaquetado; solo lectura."
"FILEREC.SHORTNAME" = "El nombre corto (8.3) del archivo; solo lectura."
"FILEREC.SIZE" = "Un tamaño: de una fuente, en puntos; de un archivo, flujo, sonido o descarga, en bytes; de un arreglo, su número de valores."
"FILEREC.TIME" = "La hora elegida en el selector de fecha y hora, la hora de un archivo (`FileRec`) o la posición del CD, como texto."
"MOUSE" = "La posición del puntero del mouse en la pantalla (X, Y). Propio de RapidR."
"MOUSE.X" = "Una X: el componente del vector, el primer eje del joystick (de 0 a 65535, 32767 en reposo) o la del puntero del mouse en la pantalla."
"MOUSE.Y" = "Una Y: el componente del vector, el segundo eje del joystick (de 0 a 65535, 32767 en reposo, y crece hacia abajo) o la del puntero del mouse en la pantalla."
"PRINTER" = "La impresora, lista para usar (un RPrinter): cada documento se convierte en un PDF que se envía a la impresora del sistema, o al diálogo de impresión del navegador en la web."
"SCREEN" = "La pantalla: su tamaño y su área de trabajo, la posición del mouse, los monitores, el cursor del mouse que se muestra y su densidad (`Scale`)."
"SCREEN.CLIENTHEIGHT" = "La altura del área dentro de los bordes (y de la barra de título y el menú de un formulario), en píxeles; en `Screen`, la del área de trabajo, sin la barra de tareas."
"SCREEN.CLIENTWIDTH" = "El ancho del área dentro de los bordes, en píxeles; en `Screen`, el del área de trabajo, sin la barra de tareas."
"SCREEN.CONSOLEX" = "El ancho de la consola en caracteres (80); solo lectura."
"SCREEN.CONSOLEY" = "El alto de la consola en líneas (25); solo lectura."
"SCREEN.CURSOR" = "El puntero del mouse que se muestra sobre el control: una de las constantes `crXXX`."
"SCREEN.CURSORS" = "Los identificadores de cursor según el código de cursor: Cursors(i) = un identificador de LoadCursorFromFile o LoadCursor (Windows) hace que Cursor = i lo muestre; 0 vuelve a poner el cursor estándar. Al leerla da el identificador en uso (Windows; 0 en otros sistemas, que no tienen identificadores de cursor)."
"SCREEN.GETPIXELDEPTH" = "Devuelve el número de bits por píxel de la pantalla."
"SCREEN.HEIGHT" = "La altura, en píxeles; en `Screen`, la de la pantalla."
"SCREEN.MONITORS" = "El número de monitores; solo lectura."
"SCREEN.MOUSEBUTTONS" = "El número de botones del mouse; solo lectura."
"SCREEN.MOUSEPRESENT" = "Distinto de cero cuando hay un mouse conectado; solo lectura."
"SCREEN.MOUSESWAP" = "Distinto de cero cuando los botones izquierdo y derecho del mouse están intercambiados; solo lectura."
"SCREEN.MOUSEX" = "La X del puntero del mouse en la pantalla, en píxeles; solo lectura."
"SCREEN.MOUSEY" = "La Y del puntero del mouse en la pantalla, en píxeles; solo lectura."
"SCREEN.PIXELSPERINCH" = "Los píxeles por pulgada de la pantalla tal como los ven los programas: siempre 96, porque RapidR se encarga por sí mismo de escalar para las pantallas high-DPI; solo lectura."
"SCREEN.SCALE" = "El factor de escala de la pantalla (2 en una pantalla Retina); solo lectura."
"SCREEN.WIDTH" = "El ancho, en píxeles; en `Screen`, el de la pantalla."
