# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/components/media.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"RAUDIOOUT" = "Reproduce el sonido que genera el programa muestra por muestra, según va llegando: el zumbador o el chip de sonido de un emulador, un sintetizador, un tono para una clase de ciencias. Write pone muestras en su cola (números de 16 bits, de -32768 a 32767, de un arreglo INTEGER, una cadena de texto binaria o un RMemoryStream; WriteFloat toma de -1 a 1); el dispositivo de sonido las reproduce en un hilo propio y nunca espera al programa. Mantén en cola unos BufferMs de sonido: escribe en OnNeedData (se produce en el hilo del programa cuando la cola baja de BufferMs, con cuántas muestras la llenan de nuevo) o revisa Queued desde un temporizador, una vez por cuadro. Cuando la cola se vacía, reproduce silencio después de un fundido de 2 ms (sin chasquido) y Underruns lo cuenta. Las muestras estéreo se intercalan, izquierda y luego derecha. En un navegador el sonido empieza solo después de un clic o una tecla en la página: llama a Start desde el OnClick de un botón (de lo contrario, Error lo indica). Sin un dispositivo de sonido, suena en silencio, al mismo ritmo (Error dice por qué). Propio de RapidR."
"RAUDIOOUT.BITS" = "Cómo leen números y bytes Write y WriteSample: 16, muestras de 16 bits con signo (de -32768 a 32767; los bytes de una cadena de texto binaria en pares little-endian); 8, bytes sin signo (de 0 a 255, con 128 como el centro silencioso) como los tienen los archivos WAV de 8 bits. WriteFloat siempre toma de -1 a 1."
"RAUDIOOUT.BUFFERMS" = "Cuánto sonido mantener en cola: OnNeedData lo pide cuando la cola baja de esa cantidad. Un valor menor responde antes (un instrumento que tocas) y necesita que el programa llegue a tiempo; uno mayor aguanta un momento en que el programa está ocupado. El sonido que oyes llega con aproximadamente este retraso."
"RAUDIOOUT.CHANNELS" = "1, mono; 2, estéreo —entonces las muestras se intercalan: izquierda, derecha, izquierda … (Count y Queued cuentan ambas)—. Si se cambia mientras suena, el flujo empieza de nuevo."
"RAUDIOOUT.CLEAR" = "Descarta lo que está en espera y sigue reproduciendo (el reinicio de un emulador): silencio hasta el siguiente Write."
"RAUDIOOUT.ENABLED" = "False lo pausa: silencio (con un fundido de 2 ms), lo que espera se conserva, sin OnNeedData; True continúa donde estaba, con un fundido de entrada."
"RAUDIOOUT.ERROR" = "Por qué no se oye (\"\" cuando se oye): no hay dispositivo de sonido, un programa compilado sin sonido, un navegador que espera un clic o una tecla, una propiedad establecida fuera de su rango (se usa el valor más cercano), un dispositivo que dejó de recibir sonido. OnError dice cada una cuando ocurre."
"RAUDIOOUT.ONERROR" = "Algo salió mal con el sonido; Code dice qué (aeNoDevice 1: no hay dispositivo de sonido, o rechazó el flujo; aeDeviceLost 2: el dispositivo dejó de recibir sonido mientras sonaba —se desconectó, unos auriculares que se alejaron—; aeBadSetting 3: una propiedad fuera de su rango, se usa el valor más cercano; aeUnderrun 4: la cola se vació, un corte que se oye —como mucho cuatro por segundo, el Message dice cuántas veces—; aeNeedsClick 5: un navegador reproduce sonido solo después de un clic o una tecla) y Message lo dice con palabras (también está en Error, hasta que el problema pasa). Se produce en el hilo del programa, un momento después de ocurrir, nunca en el del dispositivo de sonido; el flujo sigue sonando en silencio donde no puede sonar."
"RAUDIOOUT.ONNEEDDATA" = "La cola bajó de BufferMs: escribe ahora unas Count muestras (en estéreo, contando ambos canales) para llenarla de nuevo. Se produce en el hilo del programa, nunca en el del dispositivo de sonido, mientras suena; se pide otra vez después de un Write o de la mitad de BufferMs."
"RAUDIOOUT.PLAYING" = "Es True entre Start y Stop mientras Enabled es True."
"RAUDIOOUT.QUEUED" = "Cuánto sonido escrito espera a reproducirse, en ms. Un programa guiado por fotogramas escribe hasta que esto llega a unos BufferMs. La cola guarda 2 segundos."
"RAUDIOOUT.SAMPLERATE" = "Muestras por segundo (un fotograma de cada canal). 44100 es la de un CD; 22050, 11025 y 8000 son más ligeras para máquinas pequeñas. El dispositivo de sonido la convierte a la suya. Cambiarla durante la reproducción reinicia el flujo y se descarta lo que esperaba."
"RAUDIOOUT.START" = "Inicia la reproducción: primero lo que está en la cola y luego lo que escribe el programa (el dispositivo de sonido recibe 40 ms de silencio antes de ellos, así que unos audífonos que toman una ráfaga al empezar nunca cortan el comienzo). En un navegador, llámalo desde un controlador de clic o de tecla (es una regla del navegador)."
"RAUDIOOUT.STOP" = "Detiene el sonido con un desvanecimiento de 2 ms (sin chasquido) y descarta lo que esperaba; Start vuelve a empezar con lo que se escriba después."
"RAUDIOOUT.UNDERRUNS" = "Cuántas veces se vació la cola durante la reproducción — cada una es un corte que se oye, porque el programa no escribió a tiempo (un sonido que simplemente termina también cuenta una vez). 0 es lo ideal; Start vuelve a empezar en 0."
"RAUDIOOUT.VOLUME" = "El volumen: 100 reproduce las muestras tal como están escritas, 50 suena más o menos a la mitad (al oído: una ganancia de 0.25), 0 es silencio. Un cambio se desliza durante 10 ms, así que un control deslizante nunca produce chasquidos."
"RAUDIOOUT.WRITE" = "Pone muestras en la cola según indica Bits, desde un arreglo de INTEGER (o BYTE, LONG …), una cadena binaria (16 bits: dos bytes por muestra, primero el byte bajo), un RMemoryStream (desde su Position, que avanza más allá de lo que se tomó) o un solo número. Count: cuántas muestras (de forma predeterminada, todas); Offset: cuántas omitir primero. El estéreo va intercalado. Devuelve cuántas tomó: menos cuando la cola (2 segundos) está llena."
"RAUDIOOUT.WRITEFLOAT" = "Pone en cola muestras de -1 a 1 (las más fuertes se recortan), desde un arreglo de SINGLE o DOUBLE o un solo número; Count y Offset como los de Write. Devuelve cuántas tomó."
"RAUDIOOUT.WRITESAMPLE" = "Pone en cola una muestra según indica Bits (16 bits: de -32768 a 32767) — la forma más sencilla de aprender, una muestra a la vez; Write con un arreglo es mucho más rápido. Devuelve 1, o 0 cuando la cola está llena."
"RCDAUDIO" = "Reproduce CD de audio (Qcdaudio.inc). RapidR responde como una computadora sin unidad de CD."
"RCDAUDIO.AUDIOOPEN" = "Es True mientras el dispositivo de audio del CD está abierto; solo lectura."
"RCDAUDIO.CLOSE" = "Cierra lo que el componente tiene abierto: un formulario, un archivo, un puerto, un dispositivo, una conexión o una base de datos."
"RCDAUDIO.CURRENTTRACK" = "La pista del CD que suena o está seleccionada, desde 1; al establecerla se pasa a esa pista."
"RCDAUDIO.EJECT" = "Abre la bandeja de la unidad de CD."
"RCDAUDIO.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RCDAUDIO.ERROR" = "El texto de error del dispositivo después de que falló el método `Open`; vacío en otro caso; solo lectura."
"RCDAUDIO.INTERVAL" = "Los milisegundos entre los tics de un temporizador; en un objeto multimedia, entre las actualizaciones de su posición."
"RCDAUDIO.LENGTHTIME" = "La ortografía de RapidR para `LenghtTime`: la duración como tiempo."
"RCDAUDIO.ONCHANGE" = "Se produce cuando cambia el valor del control: el texto de un campo de edición, la selección de una lista, un árbol o una pestaña, la posición de una barra de desplazamiento o de un control deslizante, la fecha de un selector, el estado de un objeto multimedia."
"RCDAUDIO.OPEN" = "Abre aquello con lo que trabaja el componente: un archivo o dispositivo multimedia, un flujo de archivo en un modo, un puerto serial, el portapapeles o un socket que escucha en un puerto."
"RCDAUDIO.PAUSE" = "Pausa la reproducción; `Play` continúa desde ahí."
"RCDAUDIO.PLAY" = "Inicia la reproducción desde la posición actual."
"RCDAUDIO.POSITION" = "Dónde está ahora: el valor de una barra de progreso, de desplazamiento o deslizante, la posición de un flujo en bytes, o la posición de reproducción de un sonido o de un objeto multimedia."
"RCDAUDIO.PRESENT" = "Es True cuando hay un disco en la unidad; solo lectura."
"RCDAUDIO.STATE" = "Lo que está haciendo: en un objeto multimedia, 0 cerrado, 1 reproduciendo, 2 en pausa, 3 detenido, 4 grabando; en una descarga, el porcentaje completado; en una casilla, 0, 1 o 2 (atenuada); en un objeto OLE, `osXXX`."
"RCDAUDIO.STOP" = "Detiene lo que está en marcha: la reproducción (vuelve al inicio), la grabación o el servidor."
"RCDAUDIO.TIME" = "La hora elegida en el selector de fecha y hora, la hora de un archivo (`FileRec`) o la posición del CD, como texto."
"RCDAUDIO.TIMEPOSITION" = "La posición en el CD, como texto; solo lectura."
"RCDAUDIO.TIMER" = "El RTimer propio del objeto multimedia, que lee su posición y produce el evento `OnChange` mientras se reproduce."
"RCDAUDIO.TRACKNUMBER" = "El número de pistas del CD; solo lectura."
"RCDAUDIO.TRACKTIME" = "La duración de la pista actual, como texto; solo lectura."
"RMIDI" = "Reproduce un archivo MIDI estándar (QMidi.inc) en una salida MIDI del sistema que produzca sonido (GS Wavetable Synth de Windows, FluidSynth, TiMidity, una salida indicada en la variable de entorno RAPIDR_MIDI_OUT), o en el sintetizador propio de RapidR donde no hay ninguna: las salidas MIDI de una Mac y Midi Through de Linux solo pasan los mensajes a otros programas, así que una canción nunca se envía a una por sí sola. RAPIDR_MIDI_OUT=builtin siempre usa el sintetizador de RapidR."
"RMIDI.CLOSE" = "Cierra lo que el componente tiene abierto: un formulario, un archivo, un puerto, un dispositivo, una conexión o una base de datos."
"RMIDI.CURRENTFRAME" = "El fotograma (video) o la posición (MIDI) que se reproduce ahora; al establecerlo se salta a ese punto."
"RMIDI.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RMIDI.ERROR" = "El texto de error del dispositivo después de que falló el método `Open`; vacío en otro caso; solo lectura."
"RMIDI.FILEOPEN" = "Es True mientras hay un archivo abierto en el dispositivo; solo lectura."
"RMIDI.INTERVAL" = "Los milisegundos entre los tics de un temporizador; en un objeto multimedia, entre las actualizaciones de su posición."
"RMIDI.LENGHT" = "La duración: milisegundos para MIDI y WAV, fotogramas para video (se escribe así); solo lectura."
"RMIDI.LENGTH" = "En un objeto multimedia, la ortografía de RapidR para `Lenght`; en un resultado de MySQL, el ancho de un campo, `Length(i)`; en un arreglo, su número de valores."
"RMIDI.LENGTHTIME" = "La ortografía de RapidR para `LenghtTime`: la duración como tiempo."
"RMIDI.ONCHANGE" = "Se produce cuando cambia el valor del control: el texto de un campo de edición, la selección de una lista, un árbol o una pestaña, la posición de una barra de desplazamiento o de un control deslizante, la fecha de un selector, el estado de un objeto multimedia."
"RMIDI.OPEN" = "Abre aquello con lo que trabaja el componente: un archivo o dispositivo multimedia, un flujo de archivo en un modo, un puerto serial, el portapapeles o un socket que escucha en un puerto."
"RMIDI.PAUSE" = "Pausa la reproducción; `Play` continúa desde ahí."
"RMIDI.PLAY" = "Inicia la reproducción desde la posición actual."
"RMIDI.POSITION" = "Dónde está ahora: el valor de una barra de progreso, de desplazamiento o deslizante, la posición de un flujo en bytes, o la posición de reproducción de un sonido o de un objeto multimedia."
"RMIDI.STATE" = "Lo que está haciendo: en un objeto multimedia, 0 cerrado, 1 reproduciendo, 2 en pausa, 3 detenido, 4 grabando; en una descarga, el porcentaje completado; en una casilla, 0, 1 o 2 (atenuada); en un objeto OLE, `osXXX`."
"RMIDI.STOP" = "Detiene lo que está en marcha: la reproducción (vuelve al inicio), la grabación o el servidor."
"RMIDI.TIMER" = "El RTimer propio del objeto multimedia, que lee su posición y produce el evento `OnChange` mientras se reproduce."
"RMIDI.VOLUME" = "El volumen: de 0 a 100 en objetos multimedia y sonidos de DirectX; de 0 a 1 en audio y video web."
"RMIDIPORT" = "Entrada y salida MIDI: muestra los teclados, controladores y sintetizadores MIDI que hay, abre una entrada y una salida (por número o por nombre), produce eventos con lo que llega — cada mensaje (`OnMessage`), las notas (`OnNoteOn`, `OnNoteOff`), las perillas y los pedales (`OnControl`), los mensajes exclusivos del sistema completos (`OnSysEx`) — y envía notas, controles, cambios de programa y SysEx. SysEx está apagado hasta que el programa lo pide: pon IgnoreSysEx = False para recibir SysEx (SysEx puede cambiar ajustes guardados dentro de un dispositivo y, en un navegador, es un permiso aparte). Los eventos se producen en el hilo del programa, en orden; un SysEx que llega en partes llega completo; en una ráfaga no se pierde nada (`Dropped` indica si el programa se queda atrás). En un navegador, el primer uso explica por qué el programa lo pide y luego el navegador pregunta al usuario; una negativa es un mensaje claro en `Error`. Crea un `RMIDIPort` por cada entrada que quieras escuchar. Propio de RapidR."
"RMIDIPORT.CLOSE" = "Cierra la entrada y la salida."
"RMIDIPORT.CLOSEINPUT" = "Cierra la entrada (se descarta lo que esperaba). Si no hay nada abierto, no pasa nada."
"RMIDIPORT.CLOSEOUTPUT" = "Cierra la salida."
"RMIDIPORT.DROPPED" = "Los mensajes que se perdieron desde que se abrió la entrada porque llegaron más rápido de lo que el programa los atendía (más de 32768 en espera). Lo ideal es 0; el evento `OnError` avisa cuando pasa."
"RMIDIPORT.ERROR" = "Por qué no funcionó la última llamada, en palabras simples (\"\" cuando funcionó): no existe ese dispositivo, un dispositivo en uso, nada abierto, un byte de datos mayor que 127, un SysEx sin su F7, un navegador que no permitió MIDI o SysEx."
"RMIDIPORT.FILLINPUTS" = "Vuelve a leer las entradas y pone sus nombres en un `RListBox` o `RComboBox` (que vacía primero), con la que está abierta seleccionada (ninguna si no hay una abierta); devuelve cuántas son. Después, `OpenInput(List.ItemIndex)` abre la elegida."
"RMIDIPORT.FILLOUTPUTS" = "Las salidas en un cuadro de lista o un cuadro combinado, como `FillInputs`."
"RMIDIPORT.HEX" = "Los bytes de una cadena binaria en hexadecimal, \"F0 7E 7F 06 01 F7\": lo que muestra un monitor MIDI (el `Data` de `OnSysEx`)."
"RMIDIPORT.IGNOREACTIVESENSING" = "True (al empezar) descarta el sensado activo (&HFE), el byte de \"sigo aquí\" que algunos teclados envían tres veces por segundo."
"RMIDIPORT.IGNORECLOCK" = "True (al empezar) descarta el reloj de sincronía (&HF8, 24 por pulso) y los cuartos de cuadro del código de tiempo MIDI (&HF1), que algunos dispositivos envían todo el tiempo. False los entrega a `OnMessage` (para mostrar el tempo o sincronizarse con un secuenciador)."
"RMIDIPORT.IGNORESYSEX" = "True (al empezar) descarta los mensajes exclusivos del sistema que llegan: pon IgnoreSysEx = False para recibir SysEx (`OnSysEx`). SysEx puede cambiar ajustes guardados dentro de un dispositivo MIDI, así que el programa debe pedirlo; en un navegador, esto pide al usuario el permiso de SysEx, aparte del de las notas."
"RMIDIPORT.INPUTCOUNT" = "Cuántas entradas MIDI hay ahora (vuelve a leer la lista). En un navegador, la primera llamada pregunta antes al usuario (el programa espera la respuesta). 0 cuando no hay ninguna; `Error` dice por qué cuando no hay MIDI en absoluto."
"RMIDIPORT.INPUTDEVICE" = "El nombre de la entrada Index (0 es la primera) de la lista que leyó `InputCount`; \"\" después del final. Dos dispositivos con el mismo nombre se distinguen: el segundo es \"Nombre (2)\"."
"RMIDIPORT.INPUTNAME" = "El nombre de la entrada abierta (\"\" si no hay ninguna)."
"RMIDIPORT.ISINPUTOPEN" = "Es True mientras hay una entrada abierta (`OpenInput`)."
"RMIDIPORT.ISOUTPUTOPEN" = "Es True mientras hay una salida abierta (`OpenOutput`)."
"RMIDIPORT.ONCONTROL" = "Se movió una perilla, un control deslizante, una rueda o un pedal (un cambio de control): Channel de 1 a 16, Controller de 0 a 127 (1 la rueda de modulación, 7 el volumen, 64 el pedal de sostenido), Value de 0 a 127."
"RMIDIPORT.ONDEVICESCHANGED" = "Se conectó o desconectó un dispositivo MIDI: vuelve a leer `InputCount` / `OutputCount` (o `FillInputs`). El escritorio revisa más o menos cada segundo; un navegador avisa al instante."
"RMIDIPORT.ONERROR" = "Algo falló mientras no se estaba haciendo ninguna llamada: se desconectó un dispositivo abierto (queda cerrado), se perdieron mensajes porque el programa se quedó atrás, un SysEx llegó cortado o con más de 1 MB. Message (también en `Error`) lo dice en palabras simples."
"RMIDIPORT.ONMESSAGE" = "Cada mensaje corto que llega (notas, controles, cambios de programa, inflexión de tono, aftertouch, inicio, parada, posición en la canción …), en el hilo del programa y en orden: Status es el byte de estado completo (&H90 + canal - 1 para una nota encendida), Data1 y Data2 sus bytes de datos (0 cuando tiene menos). El estado implícito (running status) ya viene expandido. Después llegan `OnNoteOn`, `OnNoteOff` y `OnControl` para los suyos."
"RMIDIPORT.ONNOTEOFF" = "Se soltó una tecla: Channel de 1 a 16, Note de 0 a 127, Velocity (qué tan rápido subió; a menudo 0)."
"RMIDIPORT.ONNOTEON" = "Se presionó una tecla: Channel de 1 a 16, Note de 0 a 127 (60 es el do central), Velocity de 1 a 127. (Una nota encendida con velocidad 0 es una nota apagada y produce `OnNoteOff`.)"
"RMIDIPORT.ONSYSEX" = "Llegó un mensaje exclusivo del sistema completo — solo cuando IgnoreSysEx es False (pon IgnoreSysEx = False para recibir SysEx): Data es una cadena binaria de F0 (CHR$(240)) a F7 (CHR$(247)), cada carácter un byte (ASC de 0 a 255). Un mensaje que llegó en partes llega completo; `Hex(Data)` lo muestra en hexadecimal."
"RMIDIPORT.OPENINPUT" = "Abre una entrada: Device es su número en la lista o su nombre (el nombre exacto, si no, el primero que lo contiene, sin importar mayúsculas: \"keys\" encuentra \"USB Keys\"). Si había una entrada abierta, primero la cierra. Es True cuando se abrió; False, y `Error` dice por qué (no está, otro programa la usa, el navegador lo negó)."
"RMIDIPORT.OPENOUTPUT" = "Abre una salida, como `OpenInput`: después, `Send` y los otros métodos de envío van a ella."
"RMIDIPORT.OUTPUTCOUNT" = "Cuántas salidas MIDI hay ahora, como `InputCount`."
"RMIDIPORT.OUTPUTDEVICE" = "El nombre de la salida Index, como `InputDevice`."
"RMIDIPORT.OUTPUTNAME" = "El nombre de la salida abierta (\"\" si no hay ninguna)."
"RMIDIPORT.QUEUED" = "Los mensajes que llegaron y esperan sus eventos."
"RMIDIPORT.SEND" = "Envía un mensaje corto a la salida: Status (&H90 nota encendida + canal - 1, &HB0 cambio de control, &HC0 cambio de programa …) y los bytes de datos que lleva (de 0 a 127; un cambio de programa lleva uno, un reloj ninguno). Es True cuando salió; False, y `Error` dice por qué."
"RMIDIPORT.SENDCONTROL" = "Envía un cambio de control: Controller de 0 a 127 (7 el volumen, 10 el paneo, 64 el pedal de sostenido, 123 apagar todas las notas), Value de 0 a 127. Es True cuando salió."
"RMIDIPORT.SENDHEX" = "Envía bytes escritos en hexadecimal: \"F0 7E 7F 06 01 F7\" (la solicitud de identidad), \"90 3C 64\" (una nota). Se permiten espacios, comas, &H y 0x; cada mensaje debe estar completo. Es True cuando salió; False, y `Error` dice qué está mal."
"RMIDIPORT.SENDNOTEOFF" = "Detiene una nota que empezó con `SendNoteOn` (Velocity 0 si no se indica). Es True cuando salió."
"RMIDIPORT.SENDNOTEON" = "Empieza una nota: Channel de 1 a 16, Note de 0 a 127 (60 es el do central), Velocity de 1 a 127 (qué tan fuerte; 0 la detiene). Es True cuando salió."
"RMIDIPORT.SENDPROGRAM" = "Elige un instrumento: Program de 0 a 127 (en un sintetizador General MIDI, 0 es un piano y 40 un violín). Es True cuando salió."
"RMIDIPORT.SENDSYSEX" = "Envía un mensaje exclusivo del sistema completo: una cadena binaria que empieza con F0 (CHR$(240)) y termina con F7 (CHR$(247)), con cada byte intermedio de 0 a 127, de cualquier largo. SysEx puede cambiar ajustes guardados dentro de un dispositivo, incluso su firmware en algunos: envía solo mensajes que conoces. En un navegador, el primero pide al usuario el permiso de SysEx. Es True cuando salió."
"RMIDIPORT.TIMESTAMP" = "Cuándo llegó el mensaje que se está atendiendo, en ms desde que se abrió la entrada (con fracciones): léelo en un evento para grabar lo que se tocó."
"RVIDEO" = "Reproduce un video AVI con su sonido (QVideo.inc), en un formulario o en una ventana propia."
"RVIDEO.AUDIOOFF" = "True silencia la pista de sonido del video."
"RVIDEO.BORDERSTYLE" = "El borde: una de las constantes `bsXXX`. En un formulario, `bsSizeable` permite a la persona cambiar su tamaño, `bsDialog` no, `bsNone` no tiene barra de título."
"RVIDEO.CAPTION" = "El texto que muestra el control, o el título de una ventana o un diálogo; un `&` antes de una letra la subraya como atajo de teclado."
"RVIDEO.CLOSE" = "Cierra lo que el componente tiene abierto: un formulario, un archivo, un puerto, un dispositivo, una conexión o una base de datos."
"RVIDEO.CURRENTFRAME" = "El fotograma (video) o la posición (MIDI) que se reproduce ahora; al establecerlo se salta a ese punto."
"RVIDEO.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RVIDEO.ERROR" = "El texto de error del dispositivo después de que falló el método `Open`; vacío en otro caso; solo lectura."
"RVIDEO.FILEOPEN" = "Es True mientras hay un archivo abierto en el dispositivo; solo lectura."
"RVIDEO.HANDLE" = "El identificador de la ventana (o de otro objeto del sistema), para llamadas a la API y para componentes que lo reciben."
"RVIDEO.HEIGHT" = "La altura, en píxeles; en `Screen`, la de la pantalla."
"RVIDEO.IMGHEIGHT" = "La altura de la imagen del video, en píxeles; solo lectura."
"RVIDEO.IMGWIDTH" = "El ancho de la imagen del video, en píxeles; solo lectura."
"RVIDEO.INTERVAL" = "Los milisegundos entre los tics de un temporizador; en un objeto multimedia, entre las actualizaciones de su posición."
"RVIDEO.LEFT" = "La distancia al borde izquierdo del contenedor (en un formulario: el de la pantalla), en píxeles."
"RVIDEO.LENGHT" = "La duración: milisegundos para MIDI y WAV, fotogramas para video (se escribe así); solo lectura."
"RVIDEO.LENGHTTIME" = "La duración del video en milisegundos (se escribe así); solo lectura."
"RVIDEO.LENGTH" = "En un objeto multimedia, la ortografía de RapidR para `Lenght`; en un resultado de MySQL, el ancho de un campo, `Length(i)`; en un arreglo, su número de valores."
"RVIDEO.LENGTHTIME" = "La ortografía de RapidR para `LenghtTime`: la duración como tiempo."
"RVIDEO.ONCHANGE" = "Se produce cuando cambia el valor del control: el texto de un campo de edición, la selección de una lista, un árbol o una pestaña, la posición de una barra de desplazamiento o de un control deslizante, la fecha de un selector, el estado de un objeto multimedia."
"RVIDEO.OPEN" = "Abre aquello con lo que trabaja el componente: un archivo o dispositivo multimedia, un flujo de archivo en un modo, un puerto serial, el portapapeles o un socket que escucha en un puerto."
"RVIDEO.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RVIDEO.PAUSE" = "Pausa la reproducción; `Play` continúa desde ahí."
"RVIDEO.PLAY" = "Inicia la reproducción desde la posición actual."
"RVIDEO.POSITION" = "Dónde está ahora: el valor de una barra de progreso, de desplazamiento o deslizante, la posición de un flujo en bytes, o la posición de reproducción de un sonido o de un objeto multimedia."
"RVIDEO.SHOW" = "Muestra el componente o formulario; un objeto de ciencia de datos imprime su contenido."
"RVIDEO.STATE" = "Lo que está haciendo: en un objeto multimedia, 0 cerrado, 1 reproduciendo, 2 en pausa, 3 detenido, 4 grabando; en una descarga, el porcentaje completado; en una casilla, 0, 1 o 2 (atenuada); en un objeto OLE, `osXXX`."
"RVIDEO.STOP" = "Detiene lo que está en marcha: la reproducción (vuelve al inicio), la grabación o el servidor."
"RVIDEO.TIMER" = "El RTimer propio del objeto multimedia, que lee su posición y produce el evento `OnChange` mientras se reproduce."
"RVIDEO.TOP" = "La distancia al borde superior del contenedor (en un formulario: el de la pantalla), en píxeles."
"RVIDEO.VOLUME" = "El volumen: de 0 a 100 en objetos multimedia y sonidos de DirectX; de 0 a 1 en audio y video web."
"RVIDEO.WIDTH" = "El ancho, en píxeles; en `Screen`, el de la pantalla."
"RVIDEO.WINDOWSTATE" = "`wsNormal`, `wsMinimized` o `wsMaximized`."
"RWAVE" = "Reproduce, graba y guarda sonido WAV (QWave.inc)."
"RWAVE.BITS" = "Bits por muestra de una grabación nueva (8 o 16)."
"RWAVE.CLOSE" = "Cierra lo que el componente tiene abierto: un formulario, un archivo, un puerto, un dispositivo, una conexión o una base de datos."
"RWAVE.CURRENTPOS" = "La posición en el sonido, en milisegundos; al establecerla se salta a ese punto."
"RWAVE.DELETE" = "Quita una parte del contenido: la cadena o la imagen de una lista en un índice, o las muestras de una grabación desde `Pos1` hasta `Pos2`."
"RWAVE.DEVICETYPE" = "El tipo de dispositivo con el que se abre el sonido (`waveaudio`)."
"RWAVE.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RWAVE.ERROR" = "El texto de error del dispositivo después de que falló el método `Open`; vacío en otro caso; solo lectura."
"RWAVE.FILEOPEN" = "Es True mientras hay un archivo abierto en el dispositivo; solo lectura."
"RWAVE.FREQUENCE" = "Muestras por segundo de una grabación nueva (11025, 22050, 44100 …); se escribe así."
"RWAVE.INTERVAL" = "Los milisegundos entre los tics de un temporizador; en un objeto multimedia, entre las actualizaciones de su posición."
"RWAVE.LENGHT" = "La duración: milisegundos para MIDI y WAV, fotogramas para video (se escribe así); solo lectura."
"RWAVE.LENGTH" = "En un objeto multimedia, la ortografía de RapidR para `Lenght`; en un resultado de MySQL, el ancho de un campo, `Length(i)`; en un arreglo, su número de valores."
"RWAVE.LENGTHTIME" = "La ortografía de RapidR para `LenghtTime`: la duración como tiempo."
"RWAVE.MODE" = "En un cuadro de diálogo de archivos, 0 para abrir o 1 para guardar; en un RWave, los canales de una grabación nueva (1 mono, 2 estéreo)."
"RWAVE.NEW" = "Empieza de nuevo, en blanco: una grabación vacía para un sonido; en la web, un objeto de ciencia de datos."
"RWAVE.ONCHANGE" = "Se produce cuando cambia el valor del control: el texto de un campo de edición, la selección de una lista, un árbol o una pestaña, la posición de una barra de desplazamiento o de un control deslizante, la fecha de un selector, el estado de un objeto multimedia."
"RWAVE.OPEN" = "Abre aquello con lo que trabaja el componente: un archivo o dispositivo multimedia, un flujo de archivo en un modo, un puerto serial, el portapapeles o un socket que escucha en un puerto."
"RWAVE.PAUSE" = "Pausa la reproducción; `Play` continúa desde ahí."
"RWAVE.PLAY" = "Inicia la reproducción desde la posición actual."
"RWAVE.POSITION" = "Dónde está ahora: el valor de una barra de progreso, de desplazamiento o deslizante, la posición de un flujo en bytes, o la posición de reproducción de un sonido o de un objeto multimedia."
"RWAVE.RECORD" = "Empieza a grabar sonido desde el dispositivo de entrada."
"RWAVE.SAVE" = "Guarda en un archivo: el gráfico como imagen, o la grabación como archivo WAV."
"RWAVE.STATE" = "Lo que está haciendo: en un objeto multimedia, 0 cerrado, 1 reproduciendo, 2 en pausa, 3 detenido, 4 grabando; en una descarga, el porcentaje completado; en una casilla, 0, 1 o 2 (atenuada); en un objeto OLE, `osXXX`."
"RWAVE.STOP" = "Detiene lo que está en marcha: la reproducción (vuelve al inicio), la grabación o el servidor."
"RWAVE.TIMER" = "El RTimer propio del objeto multimedia, que lee su posición y produce el evento `OnChange` mientras se reproduce."
"RWAVE.VOLUME" = "El volumen: de 0 a 100 en objetos multimedia y sonidos de DirectX; de 0 a 1 en audio y video web."
