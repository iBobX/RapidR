# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/components/media.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"RAUDIOOUT" = "Reproduce el sonido que genera el programa muestra por muestra, según va llegando: el zumbador o el chip de sonido de un emulador, un sintetizador, un tono para una clase de ciencias. Write pone muestras en su cola (números de 16 bits, de -32768 a 32767, de un arreglo INTEGER, una cadena de texto binaria o un RMemoryStream; WriteFloat toma de -1 a 1); el dispositivo de sonido las reproduce en un hilo propio y nunca espera al programa. Mantén en cola unos BufferMs de sonido: escribe en OnNeedData (se produce en el hilo del programa cuando la cola baja de BufferMs, con cuántas muestras la llenan de nuevo) o revisa Queued desde un temporizador, una vez por cuadro. Cuando la cola se vacía, reproduce silencio después de un fundido de 2 ms (sin chasquido) y Underruns lo cuenta. Las muestras estéreo se intercalan, izquierda y luego derecha. En un navegador el sonido empieza solo después de un clic o una tecla en la página: llama a Start desde el OnClick de un botón (de lo contrario, Error lo indica). Sin un dispositivo de sonido, suena en silencio, al mismo ritmo (Error dice por qué). Propio de RapidR."
"RAUDIOOUT.BITS" = "Cómo leen números y bytes Write y WriteSample: 16, muestras de 16 bits con signo (de -32768 a 32767; los bytes de una cadena de texto binaria en pares little-endian); 8, bytes sin signo (de 0 a 255, con 128 como el centro silencioso) como los tienen los archivos WAV de 8 bits. WriteFloat siempre toma de -1 a 1."
"RAUDIOOUT.BUFFERMS" = "Cuánto sonido mantener en cola: OnNeedData lo pide cuando la cola baja de esa cantidad. Un valor menor responde antes (un instrumento que tocas) y necesita que el programa llegue a tiempo; uno mayor aguanta un momento en que el programa está ocupado. El sonido que oyes llega con aproximadamente este retraso."
"RAUDIOOUT.CHANNELS" = "1, mono; 2, estéreo —entonces las muestras se intercalan: izquierda, derecha, izquierda … (Count y Queued cuentan ambas)—. Si se cambia mientras suena, el flujo empieza de nuevo."
"RAUDIOOUT.CLEAR" = "Descarta lo que está en espera y sigue reproduciendo (el reinicio de un emulador): silencio hasta el siguiente Write."
"RAUDIOOUT.ENABLED" = "False lo pausa: silencio (con un fundido de 2 ms), lo que espera se conserva, sin OnNeedData; True continúa donde estaba, con un fundido de entrada."
"RAUDIOOUT.ERROR" = "Por qué no se oye (\"\" cuando se oye): no hay dispositivo de sonido, un programa compilado sin sonido, un navegador que espera un clic o una tecla, una propiedad establecida fuera de su rango (se usa el valor más cercano)."
"RAUDIOOUT.ONNEEDDATA" = "La cola bajó de BufferMs: escribe ahora unas Count muestras (en estéreo, contando ambos canales) para llenarla de nuevo. Se produce en el hilo del programa, nunca en el del dispositivo de sonido, mientras suena; se pide otra vez después de un Write o de la mitad de BufferMs."
"RAUDIOOUT.PLAYING" = "Es True entre Start y Stop mientras Enabled es True."
"RAUDIOOUT.QUEUED" = "Cuánto sonido escrito espera a reproducirse, en ms. Un programa guiado por fotogramas escribe hasta que esto llega a unos BufferMs. La cola guarda 2 segundos."
"RAUDIOOUT.SAMPLERATE" = "Muestras por segundo (un fotograma de cada canal). 44100 es la de un CD; 22050, 11025 y 8000 son más ligeras para máquinas pequeñas. El dispositivo de sonido la convierte a la suya. Cambiarla durante la reproducción reinicia el flujo y se descarta lo que esperaba."
"RAUDIOOUT.START" = "Inicia la reproducción: primero lo que está en la cola y luego lo que escribe el programa (el dispositivo de sonido recibe 40 ms de silencio antes de ellos, así que unos audífonos que toman una ráfaga al empezar nunca cortan el comienzo). En un navegador, llámalo desde un controlador de clic o de tecla (es una regla del navegador)."
"RAUDIOOUT.STOP" = "Detiene el sonido con un desvanecimiento de 2 ms (sin chasquido) y descarta lo que esperaba; Start vuelve a empezar con lo que se escriba después."
"RAUDIOOUT.UNDERRUNS" = "Cuántas veces se vació la cola durante la reproducción — cada una es un corte que se oye, porque el programa no escribió a tiempo (un sonido que simplemente termina también cuenta una vez). 0 es lo ideal; Start vuelve a empezar en 0."
"RAUDIOOUT.VOLUME" = "El volumen: 100 reproduce las muestras tal como están escritas, 50 suena más o menos a la mitad (al oído: una ganancia de 0.25), 0 es silencio. Un cambio se desliza durante 10 ms, así que un control deslizante nunca produce chasquidos."
"RAUDIOOUT.WRITE" = "Pone muestras en la cola según indica Bits, desde un arreglo de INTEGER (o BYTE, LONG …), una cadena binaria (16 bits: dos bytes por muestra, primero el byte bajo), un RMemoryStream (desde su Position, que avanza más allá de lo que se tomó) o un solo número. Count: cuántas muestras (de forma predeterminada, todas); Offset: cuántas omitir primero. El estéreo va intercalado. Devuelve cuántas tomó: menos cuando la cola (2 segundos) está llena."
"RAUDIOOUT.WRITEFLOAT" = "Pone en cola muestras de -1 a 1 (las más fuertes se recortan), desde un arreglo de SINGLE o DOUBLE o un solo número; Count y Offset como los de Write. Devuelve cuántas tomó."
"RAUDIOOUT.WRITESAMPLE" = "Pone en cola una muestra según indica Bits (16 bits: de -32768 a 32767) — la forma más sencilla de aprender, una muestra a la vez; Write con un arreglo es mucho más rápido. Devuelve 1, o 0 cuando la cola está llena."
"RCDAUDIO" = "Reproduce CD de audio (Qcdaudio.inc). RapidR responde como una computadora sin unidad de CD."
"RCDAUDIO.AUDIOOPEN" = "Es True mientras el dispositivo de audio del CD está abierto; solo lectura."
"RCDAUDIO.CLOSE" = "Cierra lo que el componente tiene abierto: un formulario, un archivo, un puerto, un dispositivo, una conexión o una base de datos."
"RCDAUDIO.CURRENTTRACK" = "La pista del CD que suena o está seleccionada, desde 1; al establecerla se pasa a esa pista."
"RCDAUDIO.EJECT" = "Abre la bandeja de la unidad de CD."
"RCDAUDIO.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RCDAUDIO.ERROR" = "El texto de error del dispositivo después de que falló el método `Open`; vacío en otro caso; solo lectura."
"RCDAUDIO.INTERVAL" = "Los milisegundos entre los tics de un temporizador; en un objeto multimedia, entre las actualizaciones de su posición."
"RCDAUDIO.LENGTHTIME" = "La ortografía de RapidR para `LenghtTime`: la duración como tiempo."
"RCDAUDIO.ONCHANGE" = "Se produce cuando cambia el valor del control: el texto de un campo de edición, la selección de una lista, un árbol o una pestaña, la posición de una barra de desplazamiento o de un control deslizante, la fecha de un selector, el estado de un objeto multimedia."
"RCDAUDIO.OPEN" = "Abre aquello con lo que trabaja el componente: un archivo o dispositivo multimedia, un flujo de archivo en un modo, un puerto serial, el portapapeles o un socket que escucha en un puerto."
"RCDAUDIO.PAUSE" = "Pausa la reproducción; `Play` continúa desde ahí."
"RCDAUDIO.PLAY" = "Inicia la reproducción desde la posición actual."
"RCDAUDIO.POSITION" = "Dónde está ahora: el valor de una barra de progreso, de desplazamiento o deslizante, la posición de un flujo en bytes, o la posición de reproducción de un sonido o de un objeto multimedia."
"RCDAUDIO.PRESENT" = "Es True cuando hay un disco en la unidad; solo lectura."
"RCDAUDIO.STATE" = "Lo que está haciendo: en un objeto multimedia, 0 cerrado, 1 reproduciendo, 2 en pausa, 3 detenido, 4 grabando; en una descarga, el porcentaje completado; en una casilla, 0, 1 o 2 (atenuada); en un objeto OLE, `osXXX`."
"RCDAUDIO.STOP" = "Detiene lo que está en marcha: la reproducción (vuelve al inicio), la grabación o el servidor."
"RCDAUDIO.TIME" = "La hora elegida en el selector de fecha y hora, la hora de un archivo (`FileRec`) o la posición del CD, como texto."
"RCDAUDIO.TIMEPOSITION" = "La posición en el CD, como texto; solo lectura."
"RCDAUDIO.TIMER" = "El RTimer propio del objeto multimedia, que lee su posición y produce el evento `OnChange` mientras se reproduce."
"RCDAUDIO.TRACKNUMBER" = "El número de pistas del CD; solo lectura."
"RCDAUDIO.TRACKTIME" = "La duración de la pista actual, como texto; solo lectura."
"RMIDI" = "Reproduce un archivo MIDI estándar (QMidi.inc) en una salida MIDI del sistema que produzca sonido (GS Wavetable Synth de Windows, FluidSynth, TiMidity, una salida indicada en la variable de entorno RAPIDR_MIDI_OUT), o en el sintetizador propio de RapidR donde no hay ninguna: las salidas MIDI de una Mac y Midi Through de Linux solo pasan los mensajes a otros programas, así que una canción nunca se envía a una por sí sola. RAPIDR_MIDI_OUT=builtin siempre usa el sintetizador de RapidR."
