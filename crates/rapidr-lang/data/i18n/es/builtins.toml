# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/builtins.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"ABS" = "El valor absoluto de un número; un entero sigue siendo entero."
"ACOS" = "El arcocoseno de un número de -1 a 1, como ángulo en radianes (0 a π)."
"ASC" = "El código del primer carácter de una cadena de texto, 0 si la cadena está vacía; el inverso de `CHR$`. Cuenta caracteres, no bytes UTF-8: `ASC(\"é\")` es 233."
"ASIN" = "El arcoseno de un número de -1 a 1, como ángulo en radianes (-π/2 a π/2)."
"ATAN" = "La arcotangente de un número, en radianes; igual que `ATN`."
"ATN" = "La arcotangente de un número, como ángulo en radianes (-π/2 a π/2)."
"BEEP" = "Emite un bip corto por la salida de sonido del sistema (sin sonido, el timbre de la terminal)."
"BIN$" = "Los dígitos binarios de los 32 bits de un número, sin ceros a la izquierda: `BIN$(5)` es `101`, `BIN$(-1)` son 32 unos. Un número decimal se redondea antes a un número entero."
"CALLBACK" = "La dirección de una SUB o FUNCTION, en la forma que necesita una rutina de la API de Windows para llamarla de vuelta (un procedimiento de ventana, una devolución de llamada de enumeración)."
"CALLFUNC" = "Llama a la SUB o FUNCTION que contiene un puntero (de `BIND` o `CODEPTR`) con los argumentos dados; devuelve el resultado de una FUNCTION."
"CBOOL" = "Un valor como valor lógico: verdadero para un número distinto de cero, o para un texto que es un número distinto de cero o que (si no es un número) no está vacío; falso en los demás casos."
"CDBL" = "Un valor convertido a DOUBLE (un texto se lee como lo lee `VAL`)."
"CEIL" = "El menor número entero que no es menor que un número (`CEIL(2.1)` es 3, `CEIL(-2.1)` -2), como entero de 32 bits."
"CHDIR" = "Establece una carpeta como la actual, la carpeta desde la que parten las rutas relativas."
"CHDRIVE" = "Establece una unidad (`\"d:\"`) como la actual en Windows; otros sistemas no tienen unidades y no hace nada."
"CHR$" = "La cadena de un carácter cuyo código es el byte bajo del número (`CHR$(65)` es `A`); un número decimal se redondea antes, con las mitades al entero par."
"CINT" = "Un número redondeado a un entero como `INT(x + 0.5)`: 2.5 da 3, -2.5 da -2. Más allá de 32 bits, -2147483648."
"CLNG" = "Un número redondeado a un entero de 32 bits, como lo redondea `CINT`: `INT(x + 0.5)`."
"CLOSE" = "Cierra el archivo abierto con `OPEN` bajo ese número; lo que se escribió en él se conserva."
"CLS" = "Borra la consola y mueve el cursor a la esquina superior izquierda."
"CODEPTR" = "La dirección de una SUB o FUNCTION, para `CALLFUNC` o para una rutina que recibe un puntero para llamarla."
"COLOR" = "Establece los colores del texto de la consola: primer plano de 0 a 15, fondo de 0 a 7, en la paleta clásica de 16 colores; sin argumentos, los colores propios de la terminal."
"COMMAND$" = "La línea de comandos del programa: `COMMAND$(n)` el argumento n (`COMMAND$(0)` el propio programa, \"\" después del último); sin argumentos, todos los argumentos juntos."
"COMMANDCOUNT" = "El número de argumentos de la línea de comandos del programa (sin contar el propio programa); COMMAND$(n) lee cada uno."
"COMPRESS$" = "`Bytes$` empaquetado para que ocupe menos: una cadena de bytes (un carácter por byte, como la da el método ReadBinStr de un flujo y la recibe de vuelta DECOMPRESS$). `Format$` es \"gzip\" (el predeterminado: lo que contienen los archivos `.gz`), \"zlib\" o \"deflate\"; `Level` de 0 (almacenado, el más rápido) a 9 (el más pequeño), 6 por defecto. Para archivos y carpetas, RArchive."
"CONVBASE$" = "Un número escrito en una base (2 a 36) como cadena de dígitos en otra: `CONVBASE$(\"FF\", 16, 10)` es `255`. Un número negativo se convierte como sus 32 bits; \"\" si la base o un dígito no son válidos."
"CONVBASEX" = "Una variante de `CONVBASE$` para convertir una cadena de dígitos de una base numérica a otra."
"COS" = "El coseno de un ángulo en radianes."
"CSNG" = "Un valor convertido a SINGLE (un texto se lee como lo lee `VAL`)."
"CSRLIN" = "La fila del cursor de la consola, siendo 1 la de arriba."
"CURDIR$" = "La ruta completa de la carpeta actual."
"DATE$" = "La fecha local de hoy como texto, `MM-DD-YYYY`."
"DECOMPRESS$" = "Bytes empaquetados, devueltos desempaquetados: gzip, zlib, xz y zstd se reconocen por sus primeros bytes; \"deflate\" (sin encabezado) debe indicarse en `Format$`. Como máximo `MaxSize` bytes (256 MB si no se da): si hay más, el programa se detiene con un error, para que una cadena diminuta no pueda llenar la memoria. Los datos que no están empaquetados, o están dañados, causan un error de ejecución que dice por qué; para desempaquetar algo que puede estar dañado, usa el método OpenData de RArchive, que en cambio dice por qué en Error."
"DELETE$" = "La cadena sin `Count` caracteres, quitados desde la posición `Index` (1 la primera): `DELETE$(\"Hello\", 2, 3)` es `Ho`."
"DIR$" = "El primer archivo que coincide con un patrón con `*` y `?` (mayúsculas o minúsculas; `*.` los nombres sin extensión, como en Windows), o \"\" si no hay ninguno; luego `DIR$` sin argumentos da el siguiente. Atributos: faDirectory incluye carpetas, faHidden archivos ocultos, faSysFile los archivos del sistema de Windows."
"DIREXISTS" = "Verdadero (1) si existe una carpeta con esa ruta, si no 0."
"DOEVENTS" = "Deja que se ejecuten los eventos de ventana, los temporizadores y los repintados pendientes, para que las ventanas del programa sigan respondiendo durante un ciclo largo."
"ENVIRON" = "`ENVIRON \"NAME=value\"` establece una variable en el entorno del programa; `ENVIRON$(\"NAME\")` lee una (\"\" si no está definida)."
"EOF" = "Verdadero (-1) si a un archivo abierto con `OPEN` no le queda nada por leer (o no está abierto), si no 0."
"EXECUTE" = "Ejecuta en tiempo de ejecución una rutina cuyo nombre da una cadena de texto."
"EXP" = "e elevado a la potencia de un número; el inverso de `LOG`."
"EXTRACTRESOURCE" = "Escribe en un archivo un recurso incluido en el programa (`$RESOURCE`, su identificador viene de `RESOURCE(n)`)."
"FIELD$" = "La parte n-ésima (1 la primera) de una cadena dividida en cada aparición de un separador: `FIELD$(\"a,b,c\", \",\", 2)` es `b`; \"\" fuera de rango."
"FILEEXISTS" = "Verdadero (1) si existe un archivo con ese nombre, si no 0 (una carpeta no cuenta)."
"FILELEN" = "El tamaño de un archivo en bytes, 0 si no existe."
"FIX" = "La parte entera de un número, truncada hacia cero (`FIX(-2.7)` es -2); igual que `INT`."
"FLOOR" = "El mayor número entero que no es mayor que un número (`FLOOR(-2.1)` es -3), como entero de 32 bits."
"FORMAT$" = "Texto construido a partir de un patrón y valores: `%d`, `%s`, `%f`, `%x`, `%e`, `%g`, `%n`, `%m` con ancho y precisión opcionales: `FORMAT$(\"%5.2f\", 3.14159)` es ` 3.14`."
"FRAC" = "La parte fraccionaria de un número, con su signo: `FRAC(-2.75)` es -0.75."
"FREEFILE" = "El número de archivo más bajo que no está en uso, para `OPEN … AS #n`."
"GET$" = "Lee hasta `NumChars` bytes de la entrada estándar tal como llegan (para un programa CGI, el cuerpo de su solicitud); \"\" al final."
"GETCAPTURE" = "El identificador de la ventana que ha capturado el mouse, 0 si ninguna."
"GETFOCUS" = "El identificador de la ventana que tiene el foco del teclado."
"HEX$" = "Los dígitos hexadecimales de los 32 bits de un número, siempre 8: `HEX$(255)` es `000000FF`. Un número decimal se redondea antes, con las mitades al entero par."
"HEXTODEC" = "El número que representa una cadena de dígitos hexadecimales (se permite `&H` o `0x` delante): `HEXTODEC(\"FF\")` es 255; 0 si no es hexadecimal."
"IIF" = "`TrueValue` si la condición es verdadera, si no `FalseValue`. Los dos se evalúan antes de elegir."
"INITARRAY" = "Llena un arreglo con los valores indicados, desde su primer elemento."
"INKEY$" = "La siguiente tecla presionada, o \"\" si no hay ninguna esperando; no espera. Las teclas especiales (flechas, F1–F12, …) llegan como `CHR$(27)` seguido de su código de escaneo."
"INP" = "Lee un byte de un puerto de E/S del hardware. Windows no deja que los programas accedan a los puertos, así que la llamada detiene el programa con un error de ejecución."
"INPUT$" = "Espera a que se presionen `NumChars` teclas y las devuelve como una cadena de texto."
"INPW" = "Lee una palabra de 16 bits de un puerto de E/S del hardware. Windows no deja que los programas accedan a los puertos, así que la llamada detiene el programa con un error de ejecución."
"INSERT$" = "`Source$` con `Part$` insertado antes del carácter `Index` (1 el primero): `INSERT$(\"hi\", \"Hello\", 3)` es `Hehillo`. El texto que se inserta va primero."
"INSTR" = "La posición (1 la primera) donde `Find$` aparece por primera vez en `Search$`, desde el carácter `Start` si se da; 0 si no aparece (un `Find$` vacío nunca se encuentra)."
"INT" = "La parte entera de un número, truncada hacia cero (`INT(-2.5)` es -2), del tamaño que necesite el número."
"INV" = "El inverso modular de un número (`INV(3, 26)` es 9), o -1 si no existe; también un operador, `a INV m`."
"ISCONSOLE" = "Verdadero si el programa se ejecuta como programa de consola."
"ISNUMERIC" = "Verdadero (-1) si el valor es un número o un texto que es exactamente un número (`\"3.5\"`, `\"-2E3\"`), si no 0."
"KILL" = "Elimina un archivo."
"KILLMESSAGE" = "Quita de la cola de mensajes de una ventana los mensajes pendientes de un tipo (la función PeekMessage de Windows con PM_REMOVE). Solo en Windows: en macOS, Linux y la web detiene el programa con un error que lo dice. Solo el Handle de un formulario es una ventana real; el Handle de un control no designa ninguna ventana, así que ahí no pasa nada."
"LBOUND" = "El índice más bajo de un arreglo, en su primera dimensión o en la indicada (1 la primera)."
"LCASE$" = "La cadena en minúsculas."
"LEFT$" = "Los primeros `Num` caracteres de una cadena (toda la cadena si es más corta)."
"LEN" = "El número de caracteres de una cadena (caracteres, no bytes)."
"LFLUSH" = "Envía a la impresora, como un solo trabajo, lo que `LPRINT` ha impreso hasta ahora; lo que quede al final del programa se imprime entonces."
"LIBRARYINST" = "Carga una DLL y devuelve su identificador de instancia, 0 si no se puede cargar: una forma de comprobar si una biblioteca está presente."
"LOCATE" = "Mueve el cursor de la consola a la fila `Y`, columna `X` (1 la primera); un valor omitido conserva el actual."
"LOF" = "La longitud en bytes de un archivo abierto con `OPEN`."
"LOG" = "El logaritmo natural (base e) de un número positivo."
"LPRINT" = "Imprime en la impresora como `PRINT` imprime en la consola; `LFLUSH` envía el trabajo. RapidR convierte cada trabajo en un PDF para la impresora del sistema."
"LTRIM$" = "La cadena sin los espacios del principio."
"MEMCMP" = "Compara `count` bytes en dos direcciones: verdadero (-1) si son iguales, 0 si no (a diferencia de memcmp de C)."
"MEMCPY" = "Copia `count` bytes de una dirección a otra (direcciones de `VARPTR`, `UDTPTR` o de la propiedad `Pointer` de un flujo); en RapidR una dirección no válida es un error de ejecución, nunca una caída del programa."
"MEMSET" = "Establece `count` bytes desde una dirección a un mismo valor de byte."
"MESSAGEBOX" = "Muestra un cuadro de mensaje con los botones y el ícono que piden los indicadores `MB_`; devuelve la constante `ID` (`IDOK`, `IDYES`, …) del botón elegido. Enter presiona el primer botón, o el que nombra el indicador `MB_DEFBUTTON2` (`&H100`) o `MB_DEFBUTTON3` (`&H200`) de Windows (constantes de windows.inc)."
"MESSAGEDLG" = "Muestra un cuadro de mensaje de un tipo (`mtWarning`, `mtError`, `mtInformation`, `mtConfirmation`, `mtCustom`) con los botones `mb` indicados; devuelve la constante `mr` del que se eligió. Enter presiona el primer botón; `DefaultButton` (el quinto argumento, opcional) nombra otro por su respuesta, de modo que Enter pueda dar la opción segura: `MESSAGEDLG(\"This deletes 1,204 rows.\", mtWarning, mbYes OR mbNo, 0, mrNo)`. El botón predeterminado tiene el foco al abrirse el diálogo y Tab sigue yendo de izquierda a derecha; Escape y el botón de cerrar responden como siempre (Cancel, si no No). Su indicador `mb` (`mbNo`) también se acepta cuando ningún botón responde con ese número."
"MICROTIMER" = "Una lectura del temporizador de alta resolución, para medir intervalos cortos con más precisión que `TIMER`."
"MID$" = "`Num` caracteres de una cadena de texto desde `Position` (1 es el primero); sin `Num`, el resto de la cadena."
"MKDIR" = "Crea una carpeta."
"MOUSEX" = "La posición horizontal del puntero del mouse, relativa al área de cliente del formulario activo."
"MOUSEY" = "La posición vertical del puntero del mouse, relativa al área de cliente del formulario activo."
"MSGBOX" = "Muestra un cuadro de mensaje con un botón Aceptar y devuelve 0 al cerrarse."
"NVIEWLIBPRESENT" = "Indica si la biblioteca de imágenes NViewLib (JPEG y otros formatos) está disponible para el programa."
"OCT" = "Los dígitos octales de un número entero, como texto: `OCT(8)` es `10`."
"OPEN" = "Abre un archivo para acceso `INPUT`, `OUTPUT`, `APPEND`, `BINARY` o `RANDOM` con un número de archivo (ver `FREEFILE`)."
"OUT" = "Escribe un byte en un puerto de E/S del hardware. Windows no deja que los programas accedan a los puertos, así que la llamada detiene el programa con un error de ejecución."
"OUTW" = "Escribe una palabra de 16 bits en un puerto de E/S del hardware. Windows no deja que los programas accedan a los puertos, así que la llamada detiene el programa con un error de ejecución."
"PARAMSTR$" = "En una `SUBI` o `FUNCTIONI`: el argumento de cadena n con el que se la llamó (1 el primero), \"\" después del último."
"PARAMSTRCOUNT" = "En una `SUBI` o `FUNCTIONI`: con cuántos argumentos de cadena se la llamó."
"PARAMVAL" = "En una `SUBI` o `FUNCTIONI`: el argumento numérico n con el que se la llamó (1 el primero), 0 después del último."
"PARAMVALCOUNT" = "En una `SUBI` o `FUNCTIONI`: con cuántos argumentos numéricos se la llamó."
"PCOPY" = "Copia una página de la consola (0 es la pantalla, de 1 a 7 son búferes fuera de pantalla) en otra."
"PEEK" = "Lee un byte: de una página de la consola (las direcciones 0 a 3999 de la página 0 son la pantalla; una dirección par es el carácter de una celda, la impar que sigue su atributo de color), o de la memoria del propio programa en una dirección de VARPTR y similares. Cualquier otra dirección es un error de ejecución."
"PI" = "El número π, 3.14159265358979…"
"PLAYSOUND" = "Reproduce un archivo de sonido en segundo plano."
"PLAYWAV" = "Reproduce un archivo WAV o un `$RESOURCE` en segundo plano (`SND_ASYNC`), esperando a que termine (`SND_SYNC`) o repitiéndose (`SND_LOOP`); `PLAYWAV \"\"` lo detiene."
"POKE" = "Escribe un byte: en una página de la consola (en la página 0 se ve de inmediato), o en la memoria del propio programa en una dirección de VARPTR y similares. Cualquier otra dirección es un error de ejecución."
"POS" = "La columna del cursor de la consola, siendo 1 la primera."
"POSTMESSAGE" = "Pone un mensaje de Windows en la cola de una ventana y vuelve sin esperar a que se procese (la función PostMessage de Windows). Solo en Windows: en macOS, Linux y la web detiene el programa con un error que lo dice. Solo el Handle de un formulario es una ventana real; el Handle de un control no designa ninguna ventana, así que el mensaje no llega a ninguna parte."
"RANDOMIZE" = "Inicia la secuencia de `RND` desde una semilla: la misma semilla da los mismos números en todos los entornos de ejecución. Sin semilla, una nueva."
"RELEASECAPTURE" = "Libera la captura del mouse que tiene una ventana."
"RENAME" = "Cambia el nombre de un archivo (o lo mueve) del primer nombre al segundo."
"REPLACE$" = "`Overwrite$` escrito sobre `Source$` desde el carácter `Index` (1 el primero): `REPLACE$(\"Hello\", \"J\", 1)` es `Jello`. Para buscar y reemplazar, `REPLACESUBSTR$`."
"REPLACESUBSTR$" = "`Source$` con cada aparición de `ReplaceStr$` reemplazada por `Withstr$`."
"RESOURCE" = "El identificador del recurso n incluido en el programa con `$RESOURCE` (0 el primero), para `EXTRACTRESOURCE`, `PLAYWAV` o una imagen."
"RESOURCECOUNT" = "El número de recursos incluidos en el programa con `$RESOURCE`."
"REVERSE$" = "La cadena con sus caracteres en orden inverso."
"RGB" = "El valor de color para las partes roja, verde y azul, de 0 a 255 cada una (el azul en el byte alto)."
"RIGHT$" = "Los últimos `Num` caracteres de una cadena (toda la cadena si es más corta)."
"RINSTR" = "La posición (1 la primera) de la última aparición de `FindString` en `SearchString`, 0 si no hay ninguna. Con `Start`, solo cuenta una aparición que termina en el carácter `Start` o antes (la búsqueda se hace en `LEFT$(SearchString, Start)`): `RINSTR(4, \"hehe they\", \"he\")` es 3; un `Start` de 0 o menos no encuentra nada. Un `FindString` vacío nunca se encuentra."
"RMDIR" = "Elimina una carpeta vacía."
"RND" = "Un número aleatorio: sin argumentos, un número decimal desde 0 hasta 1 (sin incluirlo); `RND(n)`, un número entero de 0 a n - 1. `RANDOMIZE` le da la semilla."
"ROUND" = "Un número redondeado como `INT(x + 0.5)`: 2.5 da 3, -2.5 da -2; un entero de 32 bits."
"RTLMOVEMEMORY" = "Copia un bloque de memoria de una dirección a otra (la rutina de Windows con ese nombre)."
"RTRIM$" = "La cadena sin los espacios del final."
"RUN" = "Inicia un programa (una línea de comandos) sin esperar a que termine; devuelve su ID de proceso, 0 si no pudo iniciarse."
"SEEK" = "Se mueve a un byte de un archivo abierto con `OPEN`: la siguiente lectura o escritura es ahí (1 el primer byte)."
"SENDMESSAGE" = "Envía un mensaje de Windows a una ventana y espera hasta que su procedimiento de ventana lo haya procesado (la función SendMessage de Windows). Solo en Windows: en macOS, Linux y la web detiene el programa con un error que lo dice. Solo el Handle de un formulario es una ventana real; el Handle de un control no designa ninguna ventana, así que el mensaje no llega a ninguna parte: usa las propiedades y los métodos del propio control."
"SETCAPTURE" = "Hace que una ventana reciba toda la entrada del mouse hasta que se libere la captura."
"SETCONSOLETITLE" = "Establece el título de la ventana de la consola (la terminal)."
"SETFOCUS" = "Da el foco del teclado a una ventana mediante su identificador."
"SGN" = "El signo de un número: 1 si es positivo, -1 si es negativo, 0 si es cero."
"SHELL" = "Ejecuta un comando con el shell del sistema y espera hasta que termina; devuelve su código de salida."
"SHELLWAIT" = "Ejecuta un comando con el shell del sistema, espera hasta que termina y devuelve su código de salida (-1 si no pudo ejecutarse)."
"SHL" = "Los 32 bits de un número desplazados a la izquierda `Bits` posiciones (sus 5 bits bajos), como entero de 32 bits con signo; también un operador, `a SHL n`."
"SHOWMESSAGE" = "Muestra un mensaje en un cuadro modal con un botón Aceptar, con el título de la aplicación."
"SHR" = "Los 32 bits de un número desplazados a la derecha `Bits` posiciones (sus 5 bits bajos), entrando ceros por la izquierda; también un operador, `a SHR n`."
"SIN" = "El seno de un ángulo en radianes."
"SIZEOF" = "El tamaño en bytes de una variable, un elemento de arreglo, un arreglo, un tipo o un TYPE, tal como está dispuesto en la memoria."
"SLEEP" = "Pausa el programa durante un número de segundos; se permiten fracciones (`SLEEP 0.5`)."
"SOUND" = "Reproduce un tono de una frecuencia en hertz durante una duración en milisegundos, en segundo plano."
"SPACE$" = "Una cadena de `Num` espacios."
"SQR" = "La raíz cuadrada de un número."
"STR$" = "Un número como texto, con hasta 9 cifras significativas: `STR$(1 / 3)` es `0.333333333`."
"STRF$" = "Un número como texto en un formato decimal (`ffGeneral`, `ffExponent`, `ffFixed`, `ffNumber`) con `Precision%` cifras significativas y `Digits%` decimales."
"STRING$" = "Una cadena de `Num` copias de un carácter, dado por su código o como el primer carácter de una cadena: `STRING$(3, 65)` es `AAA`."
"TAB" = "En `PRINT`: espacios hasta la columna `Column` de la consola (1 la primera); si ya se pasó de ella, esa columna en la línea siguiente."
"TALLY" = "El número de veces que `Match$` aparece en `Search$` (las apariciones no se superponen); 0 si `Match$` está vacío."
"TAN" = "La tangente de un ángulo en radianes."
"TIME$" = "La hora local como texto, `HH:MM:SS`."
"TIMER" = "Los segundos desde la medianoche (hora local), con fracciones, para medir el tiempo de partes de un programa."
"TR$" = "El texto en el idioma del programa (`Application.Language`): su traducción de la carpeta `lang` del programa (`lang/es.po`, `lang/pt-BR.po`, `lang/zh-Hans.po`, archivos PO), si no el texto mismo. `es-AR` busca en `es-AR.po` y luego en `es.po`. Después del texto, un número impar de argumentos empieza con un contexto, que distingue dos significados del mismo texto (`TR$(\"Open\", \"menu\")`, el msgctxt del archivo PO); los demás son marcadores por nombre, un nombre y luego su valor: `{name}` en el texto (o en su traducción) se convierte en el valor, `{{` y `}}` son llaves, un nombre que no se da queda como está escrito. Una carpeta, un archivo o una entrada que falta nunca es un error."
"TRIM" = "La cadena sin los espacios del principio ni del final."
"TRN$" = "La forma de un texto según una cantidad, en el idioma del programa: la forma de la traducción que elige la regla de plurales del idioma (el encabezado `Plural-Forms` del archivo PO: el español y el portugués tienen dos, el chino una, el polaco tres), si no `Singular$` para 1 y `Plural$` para cualquier otra cantidad. `{n}` es la cantidad; un contexto y marcadores como los recibe `TR$`."
"UBOUND" = "El índice más alto de un arreglo, en su primera dimensión o en la indicada (1 la primera)."
"UCASE$" = "La cadena en mayúsculas."
"UDTPTR" = "La dirección de los campos de una variable TYPE, para `MEMCPY` y las demás funciones de memoria integradas."
"UNLOADLIBRARY" = "Quita una DLL de la memoria: solo una que el programa declaró (`DECLARE … LIB \"name\"`), con ese mismo nombre: `UNLOADLIBRARY(\"USER32\")` descarga `LIB \"USER32\"`, mientras que `UNLOADLIBRARY(\"USER32.DLL\")` no hace nada (las mayúsculas no importan). Una biblioteca no cargada, o no declarada, no hace nada; una llamada posterior a una de sus funciones la carga de nuevo, así que descargarla nunca es obligatorio (se hace al terminar el programa). Solo en Windows hay una DLL que descargar: en otros sistemas no hace nada, sin error."
"VAL" = "El número que hay al principio de un texto, ignorando los espacios y lo que lo sigue: `VAL(\"12abc\")` es 12; 0 si no hay ninguno."
"VARPTR" = "La dirección de una variable o de un elemento de arreglo, para las funciones de memoria; en RapidR, una vista segura de los datos del propio programa."
"VARTYPE" = "Un código para la clase de valor que contiene un VARIANT, como los numera VB: 0 vacío, 2 entero, 5 double, 8 cadena, 9 objeto, 11 Boolean."
"WSTRING" = "Una cadena convertida a caracteres anchos (UTF-16), para rutinas que reciben texto Unicode."
"WSTRINGTOASCII" = "Una cadena ancha (UTF-16) convertida de vuelta a una cadena normal."
