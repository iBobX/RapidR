# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/components/databases.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"RMYSQL" = "Un cliente de un servidor MySQL o MariaDB: conectarse, ejecutar consultas y recorrer las filas que devuelven. Solo en escritorio (un navegador no tiene TCP directo)."
"RMYSQL.AUTOCOMMIT" = "1 mientras la sesión confirma cada instrucción por sí sola (el autocommit de MySQL, activado de forma predeterminada), 0 después de `SET autocommit = 0` (cada cambio espera entonces a COMMIT), -1 antes de Connect o cuando el servidor no lo dijo. Se sigue a partir de las respuestas del servidor, igual que InTransaction."
"RMYSQL.BUSY" = "1 mientras se ejecuta una consulta en segundo plano (QueryAsync), y si no 0."
"RMYSQL.CANCEL" = "Detiene la consulta en segundo plano (el KILL QUERY del servidor): sigue OnError(\"cancelled\") o, si acababa de terminar, OnDone. Devuelve 1 si había una en ejecución."
"RMYSQL.CLEARPARAMS" = "Descarta los valores puestos en cola con AddParam."
"RMYSQL.CLOSE" = "Cierra lo que el componente tiene abierto: un formulario, un archivo, un puerto, un dispositivo, una conexión o una base de datos."
"RMYSQL.COLCOUNT" = "El número de columnas: de una cuadrícula (con las fijas incluidas), del resultado de una consulta, de una tabla de datos."
"RMYSQL.COLNAME" = "El nombre de la columna `Index` (desde 0) de las filas de la última consulta, tomado de los metadatos del propio resultado (`SELECT name AS who` → \"who\"): se conoce también en una conexión de solo lectura, sin ejecutar nada otra vez. \"\" después de la última columna. También el de una consulta en segundo plano, en cuanto se conocen sus columnas."
"RMYSQL.COLTYPE" = "El tipo de la columna `Index` (desde 0) de las filas de la última consulta, tomado de los metadatos del resultado, tal como MySQL lo nombra en una tabla: \"INT\", \"BIGINT UNSIGNED\", \"DECIMAL\", \"VARCHAR\", \"TEXT\", \"BLOB\", \"DATETIME\", \"ENUM\", \"JSON\" …; \"\" después de la última columna."
"RMYSQL.CONNECT" = "Se conecta al servidor MySQL en `Host` (\"\": esta computadora; la propiedad Port, y si no, 3306) como `User` con la contraseña `Passwd`, con cifrado según SSLMode (de forma predeterminada, cuando el servidor puede). Devuelve 1 si lo logró, y si no 0 (OnError recibe el mensaje); después valen Connected, Encrypted, DB(i) y DBCount, y se produce OnConnect."
"RMYSQL.CONNECTED" = "Distinto de cero mientras la conexión (base de datos, puerto serial, socket) está abierta, o mientras el joystick está conectado."
"RMYSQL.CREATEDB" = "Crea una base de datos nueva llamada `DB` en el servidor. Devuelve 1 si lo logró, 0 si no (no hay conexión, o el servidor lo rechazó: OnError recibe su mensaje); DB(i) y DBCount la muestran después."
"RMYSQL.DATABASE" = "La base de datos en uso: un archivo SQLite o el nombre de una base de datos MySQL."
"RMYSQL.DB" = "El nombre de una base de datos, `dB(i)` desde 0, tal como las lista el servidor."
"RMYSQL.DBCOUNT" = "El número de bases de datos que lista el servidor."
"RMYSQL.DROPDB" = "Elimina la base de datos `DB` y sus tablas del servidor. Devuelve 1 si lo logró, 0 si no (OnError recibe el mensaje del servidor); DB(i) y DBCount lo reflejan."
"RMYSQL.ENCRYPTED" = "1 mientras la conexión está cifrada (TLS), 0 cuando es de texto sin cifrar o no hay ninguna."
"RMYSQL.ESCAPESTRING" = "Los primeros `Length` caracteres de `S` hechos seguros entre comillas en SQL: NUL, salto de línea, retorno de carro, barra invertida, ambas comillas y Ctrl+Z se convierten cada uno en un par con barra invertida (\\0 \n \\r \\\\ \\' \\\" \\Z). Los datos binarios (un carácter por byte) también pasan. RapidR también lo admite sin `Length` (todo el texto); enlazar valores con ? es más seguro."
"RMYSQL.FETCHFIELD" = "Pasa a la siguiente columna del resultado de la consulta y llena la información del campo; devuelve false cuando ya no quedan."
"RMYSQL.FETCHLENGTHS" = "Mide en bytes los campos de la fila actual para Length(i), que conserva esos valores hasta el siguiente FetchLengths. Devuelve 1, o 0 cuando no hay fila actual (antes del primer FetchRow, después de la última)."
"RMYSQL.FETCHROW" = "Pasa a la siguiente fila del resultado de la consulta; devuelve false cuando ya no quedan filas."
"RMYSQL.FIELDCOUNT" = "El número de campos (columnas) del resultado de la última consulta."
"RMYSQL.FIELDSEEK" = "Mueve el cursor de campos a la columna `Position`, la siguiente que lee `FetchField`."
"RMYSQL.HOST" = "El nombre de host o la dirección del servidor."
"RMYSQL.INTRANSACTION" = "1 mientras hay una transacción abierta en la sesión, 0 cuando no hay ninguna, -1 cuando las respuestas del servidor no lo dijeron: tal como lo informa el servidor (MySQL 5.7+ y MariaDB 10.3+ lo registran) en su respuesta a cada instrucción que lo cambia —BEGIN / START TRANSACTION, COMMIT, ROLLBACK, un cambio con Autocommit desactivado, la confirmación implícita después de CREATE, ALTER o DROP, SET autocommit = 1—, así que leer este valor no ejecuta ninguna consulta y las filas se conservan. -1 (verdadero en un IF: considera que hay una transacción abierta) después de una consulta de varias instrucciones cuya última da filas (`BEGIN; SELECT …`), después de una lectura con Autocommit desactivado (puede haber iniciado una) y en un servidor más antiguo; la respuesta de la siguiente instrucción lo informa de nuevo. Al cerrar, se revierte una transacción abierta: pregunta antes con `IF My.InTransaction THEN`."
"RMYSQL.ITEM" = "Un elemento, `Item(i)` desde 0: la cadena de texto de una lista, un campo del resultado de una base de datos, o un nodo de un árbol o de una vista de lista con sus propias propiedades."
"RMYSQL.LENGTH" = "`Length(i)`: cuántos bytes tiene el campo `i` (desde 0) de la fila que midió el último FetchLengths (un NULL da 0); 0 si aún no hubo ninguna."
"RMYSQL.LOADBLOB" = "Lee los bytes de un archivo y los devuelve como lo haría EscapeString, listos para ir entre comillas en un INSERT o UPDATE. \"\" si no se puede leer el archivo (OnError dice por qué)."
"RMYSQL.NUMFIELDS" = "El número de campos del resultado de la última consulta."
"RMYSQL.NUMROWS" = "El número de filas del resultado de la última consulta."
"RMYSQL.ONCONNECT" = "Se produce cuando se establece la conexión: una base de datos abierta con Connect, un socket conectado a su host."
"RMYSQL.ONDISCONNECT" = "Se produce cuando se cierra la conexión: una base de datos con Close, un socket por cualquiera de los dos lados."
"RMYSQL.ONDONE" = "Una consulta en segundo plano terminó: sus filas y los milisegundos que tardó."
"RMYSQL.ONERROR" = "Algo falló: el mensaje (el del servidor, \"busy: …\" mientras se ejecuta una consulta en segundo plano, \"cancelled\" después de Cancel)."
"RMYSQL.ONROWS" = "Llegaron las filas de una consulta en segundo plano: Count es cuántas hay hasta ahora (también RowCount)."
"RMYSQL.PASSWORD" = "La contraseña con la que inicia sesión la conexión a la base de datos."
"RMYSQL.PORT" = "El puerto de red; en un puerto serial, su nombre (`COM1`) o número."
"RMYSQL.QUERY" = "Ejecuta el SQL. Los valores que le siguen se enlazan a sus marcadores ? (se envían aparte del SQL: sin inyección de SQL); un arreglo aporta sus elementos. Devuelve 1, o 0 si hay un error (OnError recibe el mensaje)."
"RMYSQL.QUERYASYNC" = "Ejecuta el SQL en segundo plano: el programa y sus ventanas siguen respondiendo mientras llegan las filas. Los valores que siguen al SQL se enlazan a sus marcadores ?, como en Query. Las filas llegan por tandas: OnRows(Count) con las filas hasta ese momento, seguido de RowCount, y luego OnDone(Rows, Ms), o OnError(Message) (\"cancelled\" después de Cancel). FetchRow y Row(i) recorren las filas que ya llegaron; un RDBGrid con DataSource = este componente las dibuja a medida que llegan, solo las filas que se ven en pantalla. Una consulta a la vez: Query, QueryScalar y QueryAsync se rechazan mientras hay una en ejecución (OnError \"busy: …\"). Devuelve 1 si empezó, y si no 0 (OnError dice por qué). Sus celdas son texto (datos binarios: usa Query, RowBlob)."
"RMYSQL.REALCONNECT" = "Se conecta como Connect, con más opciones: `DB` es la base de datos que se usa (\"\" ninguna), `Port` el puerto TCP del servidor (0: 3306), `UnixSock` la ruta de un socket Unix o el nombre de una canalización con nombre de Windows para conectarse en lugar de usar TCP (\"\" ninguno), `Flags` los indicadores CLIENT_* del cliente en C (CLIENT_COMPRESS = 32 comprime el tráfico; CLIENT_SSL = 2048 pide una conexión cifrada: SSLMode Required, salvo que SSLMode pida más). Un `Host` vacío es esta computadora. Es una SUB: lee Connected (OnConnect / OnError también lo indican)."
"RMYSQL.REFRESH" = "Pide al servidor que recargue o borre lo que nombran los indicadores (MYSQL.INC): Refresh_Grant (1) las tablas de privilegios, Refresh_Log (2) los registros, Refresh_Table (4) las tablas abiertas, Refresh_Hosts (8) la memoria caché de hosts, Refresh_Status (16) los contadores de estado, sumados cuando son varios. El usuario necesita el privilegio RELOAD de MySQL. Devuelve 1 si se hizo todo, 0 si no (OnError recibe el mensaje del servidor)."
"RMYSQL.ROW" = "La fila seleccionada: de la celda seleccionada de una cuadrícula o del nodo de un árbol, desde 0; en una base de datos, la fila actual del resultado (MySQL: `Row(i)`, su campo i)."
"RMYSQL.ROWBLOB" = "Datos binarios de la fila actual: los primeros `Bytes` bytes de su campo número `Row` (desde 0; a pesar del nombre, una columna), un carácter por byte, con NUL y todo. `Bytes` suele ser Length(Row) después de FetchLengths. \"\" si no hay fila actual o no existe ese campo."
"RMYSQL.ROWCOUNT" = "El número de filas: de una cuadrícula (con las fijas incluidas), del resultado de una consulta, de una tabla de datos."
"RMYSQL.ROWSEEK" = "Pasa a la fila `Row` del resultado de la consulta, la siguiente que lee `FetchRow`."
"RMYSQL.SAVEBLOB" = "Escribe el campo `Field` (desde 0) de la fila actual, con sus bytes tal como los envió el servidor, en un archivo nuevo `File` (no hace falta FetchLengths). No hace nada si no hay fila actual o no existe ese campo."
"RMYSQL.SCHEMA" = "Las tablas y vistas de la base de datos seleccionada, cada una con sus columnas y sus tipos (de information_schema: también en una conexión de solo lectura), como JSON, que es lo que recibe el método SetSchema de un RCodeEditor: `Editor.SetSchema DB.Schema`. \"\" cuando no hay conexión o mientras se ejecuta una consulta en segundo plano (OnError dice cuál)."
"RMYSQL.SELECTDB" = "Hace que la base de datos `DB` sea la actual; devuelve true si lo logra."
"RMYSQL.SSLCA" = "La autoridad de certificación en la que confían VerifyCA y VerifyFull: un archivo .pem (uno o más certificados) o .der, como el ca.pem del servidor. \"\": las autoridades en las que confía el sistema."
"RMYSQL.SSLMODE" = "Cómo se cifra la conexión (TLS, el del sistema operativo), como lo expresa el propio cliente de MySQL. Preferred (el predeterminado): cifrada cuando el servidor puede, y si no sin cifrar; no se comprueba el certificado. Disabled: nunca. Required: cifrada o ninguna conexión; no se comprueba el certificado. VerifyCA: además, el certificado del servidor firmado por SSLCA (o por una autoridad en la que confía el sistema). VerifyFull: además, el certificado nombra a Host. Solo VerifyCA y VerifyFull comprueban que es tu servidor: Preferred y Required cifran pero no comprueban quién responde, así que en una red en la que no confías alguien en medio puede leer la contraseña y los datos; usa VerifyFull para un servidor en otra computadora. Un socket Unix o una canalización con nombre no lleva TLS: Required y los modos más estrictos lo rechazan. Se lee antes de Connect / RealConnect; Encrypted dice cómo es esta conexión."
"RMYSQL.TABLE" = "El nombre de una tabla, `Table(i)` desde 0, tal como las lista la base de datos; solo lectura."
"RMYSQL.TABLECOUNT" = "El número de tablas de la base de datos."
"RMYSQL.USER" = "El nombre de usuario con el que inicia sesión la conexión a la base de datos."
"RSQLITE" = "Una base de datos SQLite: Connect abre un archivo (o `:memory:`), Query ejecuta SQL con parámetros `?`, FetchRow recorre las filas. Propia de RapidR; también en el navegador."
"RSQLITE.BUSY" = "1 mientras se ejecuta una consulta en segundo plano (QueryAsync), y si no 0."
"RSQLITE.CANCEL" = "Detiene la consulta en segundo plano (la interrupción de SQLite): sigue OnError(\"cancelled\") o, si acababa de terminar, OnDone. Devuelve 1 si había una en ejecución."
"RSQLITE.CLEARPARAMS" = "Descarta los valores puestos en cola con AddParam."
"RSQLITE.CLOSE" = "Cierra lo que el componente tiene abierto: un formulario, un archivo, un puerto, un dispositivo, una conexión o una base de datos."
"RSQLITE.COLCOUNT" = "El número de columnas: de una cuadrícula (con las fijas incluidas), del resultado de una consulta, de una tabla de datos."
"RSQLITE.COLNAME" = "El nombre de la columna `Index` (desde 0) de las filas de la última consulta, tal como lo da la instrucción (`SELECT name AS who` → \"who\"; un nombre repetido se queda como está). \"\" después de la última columna. También el de una consulta en segundo plano, en cuanto se conocen sus columnas."
"RSQLITE.COLTYPE" = "El tipo declarado de la columna `Index` (desde 0) de las filas de la última consulta, tal como lo declara la tabla (\"INTEGER\", \"VARCHAR(40)\", \"DATE\"); \"\" para una expresión (`COUNT(*)`, `a + 1`) o después de la última columna."
"RSQLITE.CONNECT" = "Abre (o crea) el archivo de la base de datos; \":memory:\" para una en memoria. Devuelve 1 si la base de datos ya existía, 0 si es nueva. En la web una base de datos dura lo que dura la sesión de la página (primero se lee el archivo .db de un proyecto)."
"RSQLITE.CONNECTED" = "Distinto de cero mientras la conexión (base de datos, puerto serial, socket) está abierta, o mientras el joystick está conectado."
"RSQLITE.DATABASE" = "La base de datos en uso: un archivo SQLite o el nombre de una base de datos MySQL."
"RSQLITE.DB" = "El nombre de una base de datos, `dB(i)` desde 0, tal como las lista el servidor."
"RSQLITE.DBCOUNT" = "El número de bases de datos que lista el servidor."
"RSQLITE.ESCAPESTRING" = "El texto con sus comillas simples duplicadas, para ponerlo entre comillas en SQL (enlazar con ? es más seguro)."
"RSQLITE.FETCHFIELD" = "Pasa a la siguiente columna del resultado de la consulta y llena la información del campo; devuelve false cuando ya no quedan."
"RSQLITE.FETCHROW" = "Pasa a la siguiente fila de las filas de la última consulta: 1, o 0 después de la última."
"RSQLITE.FIELDCOUNT" = "El número de campos (columnas) del resultado de la última consulta."
"RSQLITE.FIELDSEEK" = "Mueve el cursor de campos a la columna `Position`, la siguiente que lee `FetchField`."
"RSQLITE.INTRANSACTION" = "1 mientras hay una transacción abierta en la conexión, desde BEGIN (o un SAVEPOINT fuera de una) hasta COMMIT, END o ROLLBACK, y si no 0; tal como lo informa el propio SQLite después de cada instrucción (Query, QueryScalar, y la de una consulta en segundo plano antes de OnDone), así que leer este valor no ejecuta ninguna consulta y las filas se conservan. Al cerrar, se revierte una transacción abierta: avisa antes de que Close pierda cambios con `IF DB.InTransaction THEN …`."
"RSQLITE.ONCONNECT" = "Se produce cuando se establece la conexión: una base de datos abierta con Connect, un socket conectado a su host."
"RSQLITE.ONDISCONNECT" = "Se produce cuando se cierra la conexión: una base de datos con Close, un socket por cualquiera de los dos lados."
"RSQLITE.ONDONE" = "Una consulta en segundo plano terminó: sus filas y los milisegundos que tardó."
"RSQLITE.ONERROR" = "Algo falló: el mensaje (el error de una consulta, \"not connected: Connect first\", \"busy: …\" mientras se ejecuta una consulta en segundo plano, \"cancelled\" después de Cancel)."
"RSQLITE.ONROWS" = "Llegaron las filas de una consulta en segundo plano: Count es cuántas hay hasta ahora (también RowCount). Se produce como máximo unas pocas decenas de veces por segundo."
"RSQLITE.QUERY" = "Ejecuta las instrucciones del SQL; una que tenga columnas de resultado (SELECT, WITH, PRAGMA, … RETURNING) da las filas que recorre FetchRow. Los valores que siguen al SQL se enlazan a sus marcadores ? (nunca se insertan en él: sin inyección de SQL); un arreglo aporta sus elementos. Devuelve 1, o 0 si hay un error (OnError recibe el mensaje)."
"RSQLITE.QUERYASYNC" = "Ejecuta el SQL en segundo plano: el programa y sus ventanas siguen respondiendo mientras llegan las filas. Los valores que siguen al SQL se enlazan a sus marcadores ?, como en Query. Las filas llegan por tandas: OnRows(Count) con las filas hasta ese momento, seguido de RowCount, y luego OnDone(Rows, Ms), o OnError(Message) (\"cancelled\" después de Cancel). FetchRow y Row(i) recorren las filas que ya llegaron; un RDBGrid con DataSource = este componente las dibuja a medida que llegan, solo las filas que se ven en pantalla. Una consulta a la vez: Query, QueryScalar y QueryAsync se rechazan mientras hay una en ejecución (OnError \"busy: …\"). Devuelve 1 si empezó, y si no 0 (OnError dice por qué). En la web se ejecuta en el hilo de la página, en porciones de pocos milisegundos, y la página se dibuja entre ellas."
"RSQLITE.ROW" = "La fila seleccionada: de la celda seleccionada de una cuadrícula o del nodo de un árbol, desde 0; en una base de datos, la fila actual del resultado (MySQL: `Row(i)`, su campo i)."
"RSQLITE.ROWCOUNT" = "El número de filas: de una cuadrícula (con las fijas incluidas), del resultado de una consulta, de una tabla de datos."
"RSQLITE.ROWSEEK" = "El siguiente FetchRow trae la fila `row` (desde 0)."
"RSQLITE.SCHEMA" = "Las tablas y vistas de la base de datos, cada una con sus columnas y sus tipos declarados, como JSON, que es lo que recibe el método SetSchema de un RCodeEditor: `Editor.SetSchema DB.Schema`. \"\" cuando no hay conexión o mientras se ejecuta una consulta en segundo plano (OnError dice cuál)."
"RSQLITE.TABLECOUNT" = "El número de tablas de la base de datos."
