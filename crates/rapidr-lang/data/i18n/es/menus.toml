# The registry's docs in Spanish (español neutro, docs/i18n/glossary-es.md): the entries of data/components/menus.toml.
# KEY = the entry's RapidR name in capitals (RBUTTON, RBUTTON.CAPTION, MID$, PRINT); code stays as written.

[docs]
"RMAINMENU" = "La barra de menús de un formulario; sus menús y comandos son objetos QMENUITEM."
"RMAINMENU.ADD" = "Añade al final una entrada: una línea de texto a un editor o a una lista de cadenas de texto, o un elemento a un menú."
"RMAINMENU.ADDITEMS" = "Añade al final una o más cadenas de texto (elementos, líneas o nodos) al componente, en el orden indicado."
"RMAINMENU.CLEAR" = "Vacía el componente: quita sus elementos, líneas, texto o datos, o borra su dibujo."
"RMAINMENU.DELINDEX" = "Quita el elemento de menú de la posición `index`."
"RMAINMENU.DELITEMS" = "Quita los elementos de los índices indicados."
"RMAINMENU.HANDLE" = "El identificador de la ventana (o de otro objeto del sistema), para llamadas a la API y para componentes que lo reciben."
"RMAINMENU.INSERT" = "Inserta en una posición: un nodo o una cadena de texto antes del índice `Index`, o el elemento de menú `Item` en la posición `I`."
"RMAINMENU.ITEMCOUNT" = "El número de elementos: cadenas de texto de una lista, nodos de un árbol, filas de una vista de lista o elementos de un menú."
"RMAINMENU.PARENT" = "El componente en el que está (un formulario, un panel, un control de pestañas …) o al que pertenece."
"RMENUITEM" = "Una entrada de menú: un comando (OnClick), una opción que se puede marcar, un separador (\"-\") o un submenú con más elementos."
"RMENUITEM.ADD" = "Añade al final una entrada: una línea de texto a un editor o a una lista de cadenas de texto, o un elemento a un menú."
"RMENUITEM.ADDITEMS" = "Añade al final una o más cadenas de texto (elementos, líneas o nodos) al componente, en el orden indicado."
"RMENUITEM.CAPTION" = "El texto que muestra el control, o el título de una ventana o un diálogo; un `&` antes de una letra la subraya como atajo de teclado."
"RMENUITEM.CHECKED" = "True si la casilla, el botón de opción o el elemento de menú está marcado."
"RMENUITEM.CLEAR" = "Vacía el componente: quita sus elementos, líneas, texto o datos, o borra su dibujo."
"RMENUITEM.COMMAND" = "El número de comando del elemento de menú, tal como lo identifica el sistema; solo lectura."
"RMENUITEM.COUNT" = "Cuántos elementos contiene: elementos de lista, nodos de árbol, cadenas de texto, elementos de menú, imágenes, entradas JSON o componentes diseñados."
"RMENUITEM.DELINDEX" = "Quita el elemento de menú de la posición `index`."
"RMENUITEM.DELITEMS" = "Quita los elementos de los índices indicados."
"RMENUITEM.ENABLED" = "Si el control responde al mouse y al teclado (uno deshabilitado se ve atenuado); en un temporizador, si está en marcha."
"RMENUITEM.HANDLE" = "El identificador de la ventana (o de otro objeto del sistema), para llamadas a la API y para componentes que lo reciben."
"RMENUITEM.HINT" = "La sugerencia que se muestra cuando el mouse se detiene sobre el control (con `ShowHint`)."
"RMENUITEM.INSERT" = "Inserta en una posición: un nodo o una cadena de texto antes del índice `Index`, o el elemento de menú `Item` en la posición `I`."
"RMENUITEM.ITEMCOUNT" = "El número de elementos: cadenas de texto de una lista, nodos de un árbol, filas de una vista de lista o elementos de un menú."
"RMENUITEM.MENUINDEX" = "La posición del elemento en el menú que lo contiene, desde 0."
"RMENUITEM.ONCLICK" = "Se produce cuando la persona hace clic en el control (o presiona su atajo, o Space o Enter en un botón con el foco)."
"RMENUITEM.RADIOITEM" = "Muestra un punto en lugar de una marca de verificación cuando el elemento de menú está marcado."
"RMENUITEM.SHORTCUT" = "La tecla que ejecuta el elemento de menú, como texto (`Ctrl+S`, `F5`)."
"RMENUITEM.TAG" = "Un número para uso propio del programa; RapidR nunca lo lee."
"RMENUITEM.VISIBLE" = "Si el control o formulario se muestra."
"RPOPUPMENU" = "Un menú contextual, que se muestra cuando se hace clic derecho en un componente cuyo PopupMenu es este menú, o con Popup."
"RPOPUPMENU.ADD" = "Añade al final una entrada: una línea de texto a un editor o a una lista de cadenas de texto, o un elemento a un menú."
"RPOPUPMENU.ADDITEMS" = "Añade al final una o más cadenas de texto (elementos, líneas o nodos) al componente, en el orden indicado."
"RPOPUPMENU.ALIGNMENT" = "Cómo se alinea el texto dentro del control: `taLeftJustify`, `taCenter` o `taRightJustify`; en un menú emergente, a qué lado del punto se abre."
"RPOPUPMENU.AUTOPOPUP" = "Si es true, un clic derecho en un control al que está asociado el menú lo abre; false lo deja al método `Popup` del programa."
"RPOPUPMENU.CLEAR" = "Vacía el componente: quita sus elementos, líneas, texto o datos, o borra su dibujo."
"RPOPUPMENU.DELINDEX" = "Quita el elemento de menú de la posición `index`."
"RPOPUPMENU.DELITEMS" = "Quita los elementos de los índices indicados."
"RPOPUPMENU.HANDLE" = "El identificador de la ventana (o de otro objeto del sistema), para llamadas a la API y para componentes que lo reciben."
"RPOPUPMENU.INSERT" = "Inserta en una posición: un nodo o una cadena de texto antes del índice `Index`, o el elemento de menú `Item` en la posición `I`."
"RPOPUPMENU.ITEMCOUNT" = "El número de elementos: cadenas de texto de una lista, nodos de un árbol, filas de una vista de lista o elementos de un menú."
"RPOPUPMENU.ONPOPUP" = "Se produce justo antes de que se abra el menú contextual; el lugar para habilitar, marcar o cambiar sus elementos."
"RPOPUPMENU.POPUP" = "Muestra el menú contextual en el punto (`X`, `Y`) de la pantalla."
"RPOPUPMENU.POPUPAT" = "Muestra el menú en (X, Y) dentro de Control (cualquier componente de un formulario), con su esquina superior izquierda como origen, esté donde esté Control en su ventana (acoplado, en un panel): un menú bajo el elemento de una lista o junto a un botón, donde Popup toma las coordenadas de la pantalla. Como con Popup, primero se produce OnPopup y el elemento elegido produce su OnClick."
"RPOPUPMENU.TAG" = "Un número para uso propio del programa; RapidR nunca lo lee."
"RPOPUPMENU.WINDOWHANDLE" = "La ventana que recibe los mensajes del menú contextual."
