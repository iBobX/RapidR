# Forms and containers: the registry's components (crates/rapidr-lang; src/lib.rs says how to edit).
group = "Forms and containers"

[[component]]
name = "RFORM"
rapidq = "QFORM"
visual = true
container = true
size = [320, 240]
default_event = "OnShow"
sets = ["layout", "a11y", "generic"]
doc = "A window: the top-level container of a program's components, with its caption, border, menu and events. Show shows it; ShowModal shows it and waits until it closes."
properties = [
  { name = "AutoScroll", type = "bool", default = true },
  { name = "BorderStyle", type = "enum", values = ["bsNone", "bsSingle", "bsSizeable", "bsDialog", "bsToolWindow", "bsSizeToolWin"], default = "bsSizeable" },
  { name = "Caption", type = "string" },
  { name = "ClientHeight", type = "int", design = false },
  { name = "ClientWidth", type = "int", design = false },
  { name = "Color", type = "color", default = -2147483633 },
  { name = "Cursor", type = "enum", values = ["crDefault", "crNone", "crArrow", "crCross", "crIBeam", "crSize", "crSizeNESW", "crSizeNS", "crSizeNWSE", "crSizeWE", "crUpArrow", "crHourGlass", "crDrag", "crNoDrop", "crHSplit", "crVSplit", "crMultiDrag", "crSQLWait", "crNo", "crAppStart", "crHelp", "crHandPoint"], default = "crDefault" },
  { name = "Font", type = "font", access = "write", design = false },
  { name = "FormStyle", type = "enum", values = ["fsNormal", "fsMDIChild", "fsMDIForm", "fsStayOnTop"], default = "fsNormal" },
  { name = "Handle", type = "int", access = "read", design = false },
  { name = "Height", type = "int" },
  { name = "Hint", type = "string" },
  { name = "IcoHandle", type = "resource", access = "write", design = false },
  { name = "Icon", type = "picture", access = "write", design = false },
  { name = "KeyPreview", type = "bool", default = false },
  { name = "Left", type = "int", default = 0 },
  { name = "ModalResult", type = "enum", values = ["mrNone", "mrOk", "mrCancel", "mrAbort", "mrRetry", "mrIgnore", "mrYes", "mrNo", "mrAll"], access = "write", design = false },
  { name = "Parent", type = "component", kinds = ["QFORM"], access = "write", design = false },
  { name = "PopupMenu", type = "component", kinds = ["QPOPUPMENU"], access = "write", design = false },
  { name = "ShowHint", type = "bool", default = false },
  { name = "Top", type = "int", default = 0 },
  { name = "Visible", type = "bool", default = false },
  { name = "Width", type = "int", default = 320 },
  { name = "WindowState", type = "enum", values = ["wsNormal", "wsMinimized", "wsMaximized"], default = "wsNormal" },
  { name = "AutoSize", type = "int", origin = "rapidr" },
  { name = "FontSize", type = "int", origin = "rapidr" },
  { name = "FontColor", type = "color", origin = "rapidr" },
  { name = "Enabled", type = "int" },
  { name = "HelpFile", type = "string", origin = "rapidr" },
  { name = "PenColor", type = "color", origin = "rapidr" },
  { name = "BrushColor", type = "color", origin = "rapidr" },
  { name = "FontName", type = "string", origin = "rapidr" },
  { name = "CopyMode", type = "enum", values = ["cmBlackness", "cmDstInvert", "cmMergeCopy", "cmMergePaint", "cmNotSrcCopy", "cmNotSrcErase", "cmPatCopy", "cmPatInvert", "cmPatPaint", "cmSrcAnd", "cmSrcCopy", "cmSrcErase", "cmSrcInvert", "cmSrcPaint", "cmWhiteness"] },
  { name = "MdiChildCount", type = "any" },
  { name = "Pixel", type = "int", design = false, indexed = 2 },
  { name = "TileMode", type = "any" },
]
methods = [
  { name = "AddBorderIcons", params = "Items ..." },
  { name = "Center" },
  { name = "Circle", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER, fill AS INTEGER", value = true },
  { name = "Close", value = true },
  { name = "CopyRect", params = "D, Image, S" },
  { name = "DelBorderIcons", params = "Items ..." },
  { name = "Draw", params = "x AS INTEGER, y AS INTEGER, BMP" },
  { name = "FillRect", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER", value = true },
  { name = "HideTitleBar", missing = true },
  { name = "Line", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER", value = true },
  { name = "Paint", params = "x AS INTEGER, y AS INTEGER, c AS INTEGER, borderc AS INTEGER" },
  { name = "Pset", params = "x AS INTEGER, y AS INTEGER, c AS INTEGER" },
  { name = "Rectangle", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER" },
  { name = "Repaint" },
  { name = "RoundRect", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, x3 AS INTEGER, y3 AS INTEGER, c AS INTEGER" },
  { name = "ShapeForm", params = "Filename AS STRING, TransparentColor AS LONG", missing = true },
  { name = "Show", value = true, test = "skip: waits for the user" },
  { name = "ShowModal", returns = "VARIANT", value = true, test = "skip: waits for the user" },
  { name = "ShowTitleBar", missing = true },
  { name = "StretchDraw", params = "Rect AS QRECT, BMP" },
  { name = "TextHeight", params = "Text AS STRING", returns = "WORD" },
  { name = "TextWidth", params = "Text AS STRING", returns = "WORD" },
  { name = "TextRect", params = "Rect AS QRECT, x AS INTEGER, y AS INTEGER, S AS STRING, fc AS INTEGER, bc AS INTEGER", missing = true },
  { name = "TextOut", params = "x AS INTEGER, y AS INTEGER, s AS STRING, fc AS INTEGER, bc AS INTEGER" },
  { name = "Refresh", value = true, origin = "rapidr" },
  { name = "Hide", value = true, origin = "rapidr" },
  { name = "SetFocus", value = true, origin = "rapidr" },
  { name = "Update", origin = "rapidr" },
  { name = "Rect", value = true, origin = "rapidr" },
  { name = "SetPixel", value = true, origin = "rapidr" },
  { name = "FillCircle", origin = "rapidr" },
  { name = "Ellipse", value = true, origin = "rapidr" },
  { name = "Cls", origin = "rapidr" },
  { name = "DrawText", value = true, origin = "rapidr" },
  { name = "ArrangeIcons", missing = true },
  { name = "Cascade", missing = true },
  { name = "Next", missing = true },
  { name = "Previous", missing = true },
  { name = "Tile", missing = true },
]
events = [
  { name = "OnClick" },
  { name = "OnClose", params = "BYREF Action AS INTEGER" },
  { name = "OnHint", params = "Hint AS STRING", missing = true },
  { name = "OnKeyDown", params = "Key AS WORD, Shift AS INTEGER" },
  { name = "OnKeyPress", params = "Key AS BYTE" },
  { name = "OnKeyUp", params = "Key AS WORD, Shift AS INTEGER" },
  { name = "OnMouseDown", params = "Button AS INTEGER, X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnMouseMove", params = "X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnMouseUp", params = "Button AS INTEGER, X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnPaint" },
  { name = "OnResize" },
  { name = "OnShow" },
  { name = "WndProc", params = "Hwnd AS LONG, Msg AS LONG, wParam AS LONG, lParam AS LONG", missing = true },
  { name = "OnDblClick", origin = "rapidr" },
  { name = "OnTimer", origin = "rapidr" },
  { name = "OnLoad", origin = "rapidr" },
]

[[component]]
name = "RFORMMDI"
rapidq = "QFORMMDI"
from = "RAPIDQ2.INC"
visual = true
container = true
default_event = "OnChildClose"
