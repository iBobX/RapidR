[[component]]
name = "RDOCKMANAGER"
visual = true
container = true
size = [400, 300]
default_event = "OnPaneChange"
sets = ["layout", "a11y", "generic"]
doc = "RapidR's docking area (RapidR Studio is built on it): panes docked at its edges, tabbed together, auto-hidden or floating, around a documents area of MDI windows or tabs. The user drags panes with a docking compass or moves them from the keyboard; the layout saves to text and loads back."
properties = [
  { name = "Align", type = "enum", values = ["alNone", "alTop", "alBottom", "alLeft", "alRight", "alClient"], default = "alNone" },
  { name = "DocumentMode", type = "string", default = "mdi", doc = "How documents show: \"mdi\" (windows in the documents area, the default) or \"tabs\"." },
  { name = "ActiveDocument", type = "string", design = false, doc = "The active document's name; setting it activates that document." },
  { name = "ActivePane", type = "string", design = false, doc = "The active pane's name; setting it shows and focuses that pane." },
  { name = "PaneCount", type = "int", access = "read", design = false, doc = "How many panes the manager has (documents included)." },
  { name = "DocumentCount", type = "int", access = "read", design = false, doc = "How many documents are open." },
  { name = "Layout", type = "string", design = false, doc = "The whole layout as text: reading it is SaveLayout, setting it LoadLayout." },
  { name = "Height", type = "int" },
  { name = "Hint", type = "string" },
  { name = "Left", type = "int", default = 0 },
  { name = "Parent", type = "component", kinds = ["QFORM", "QPANEL", "QTABCONTROL"], access = "write", design = false },
  { name = "Top", type = "int", default = 0 },
  { name = "Width", type = "int" },
  { name = "Enabled", type = "bool", default = true },
  { name = "Visible", type = "bool", default = true },
]
methods = [
  { name = "AddPane", params = "Component, Title AS STRING, Where AS STRING, Icon AS STRING", returns = "INTEGER", doc = "Adds a component as a pane, titled, docked where Where says (\"left\", \"right\", \"top\", \"bottom\", \"documents\", \"float\", \"tab:<pane>\", \"<side>:<pane>\", \"autohide:<side>\"), with a built-in icon name or \"\". True when it was placed." },
  { name = "ShowPane", params = "Name AS STRING", doc = "Shows a pane where it was last (or slides an auto-hidden one out)." },
  { name = "HidePane", params = "Name AS STRING", doc = "Hides a pane; ShowPane brings it back where it was." },
  { name = "FloatPane", params = "Name AS STRING", doc = "Floats a pane in its own window." },
  { name = "AutoHide", params = "Name AS STRING, [On AS INTEGER]", doc = "Pins a pane to its edge's auto-hide strip (On False: docks it again)." },
  { name = "FocusPane", params = "Name AS STRING", doc = "Shows a pane, makes it the active one and gives it the keyboard." },
  { name = "ClosePane", params = "Name AS STRING", doc = "Closes a document (OnDocumentClose may cancel) or hides a tool pane." },
  { name = "DockPane", params = "Name AS STRING, Where AS STRING", doc = "Docks a pane where Where says (AddPane's places)." },
  { name = "MovePane", params = "Name AS STRING", returns = "INTEGER", doc = "Starts moving a pane from the keyboard with the docking compass." },
  { name = "SaveLayout", returns = "STRING", value = true, doc = "The layout as text, for LoadLayout." },
  { name = "LoadLayout", params = "Text AS STRING", returns = "INTEGER", doc = "Restores a layout SaveLayout gave; True when it was read." },
  { name = "ResetLayout", value = true, doc = "Puts every pane back where AddPane placed it." },
  { name = "Pane", params = "Index AS INTEGER", returns = "STRING", doc = "The name of pane Index (from 0)." },
  { name = "Document", params = "Index AS INTEGER", returns = "STRING", doc = "The name of document Index (from 0)." },
  { name = "PaneTitle", params = "Name AS STRING, [Title AS STRING]", returns = "STRING", doc = "A pane's title; with Title, sets it." },
  { name = "PaneState", params = "Name AS STRING", returns = "STRING", doc = "Where a pane is: \"docked\", \"tabbed\", \"autohide\", \"floating\", \"document\" or \"hidden\"." },
  { name = "PaneVisible", params = "Name AS STRING", returns = "INTEGER", doc = "True when the pane is placed and shown (not hidden, nor behind another tab)." },
  { name = "NextDocument", value = true, doc = "Activates the next document (Ctrl+Tab)." },
  { name = "PreviousDocument", value = true, doc = "Activates the previous document (Ctrl+Shift+Tab)." },
  { name = "Cascade", value = true, doc = "Cascades the documents' windows." },
  { name = "TileHorizontal", value = true, doc = "Tiles the documents' windows one above the other." },
  { name = "TileVertical", value = true, doc = "Tiles the documents' windows side by side." },
  { name = "ArrangeIcons", value = true },
]
events = [
  { name = "OnPaneChange", params = "Name AS STRING", doc = "A pane became the active one." },
  { name = "OnDocumentActivate", params = "Name AS STRING", doc = "A document became the active one." },
  { name = "OnDocumentClose", params = "Name AS STRING, BYREF Cancel AS INTEGER", doc = "A document is about to close; set Cancel to keep it open." },
  { name = "OnLayoutChange", doc = "The layout changed (the user or the program moved, docked, floated or hid a pane)." },
]
