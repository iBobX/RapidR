# Forms and containers: the registry's components (crates/rapidr-lang; src/lib.rs says how to edit).
group = "Forms and containers"

[[component]]
name = "RFORM"
display = "Form"
rapidq = "QFORM"
visual = true
container = true
size = [320, 240]
default_event = "OnShow"
sets = ["layout", "a11y"]
doc = "A window: the top-level container of a program's components, with its caption, border, menu and events. Show shows it; ShowModal shows it and waits until it closes."
properties = [
  { name = "AutoScroll", type = "bool", default = true },
  { name = "BorderStyle", type = "enum", values = ["bsNone", "bsSingle", "bsSizeable", "bsDialog", "bsToolWindow", "bsSizeToolWin"], default = "bsSizeable" },
  { name = "Caption", type = "string", default = "" },
  { name = "ClientHeight", type = "int", design = false },
  { name = "ClientWidth", type = "int", design = false },
  { name = "Color", type = "color", default = -2147483633 },
  { name = "Cursor", type = "enum", values = ["crDefault", "crNone", "crArrow", "crCross", "crIBeam", "crSize", "crSizeNESW", "crSizeNS", "crSizeNWSE", "crSizeWE", "crUpArrow", "crHourGlass", "crDrag", "crNoDrop", "crHSplit", "crVSplit", "crMultiDrag", "crSQLWait", "crNo", "crAppStart", "crHelp", "crHandPoint"], default = "crDefault" },
  { name = "Font", type = "font", access = "write", design = true },
  { name = "FormStyle", type = "enum", values = ["fsNormal", "fsMDIChild", "fsMDIForm", "fsStayOnTop"], default = "fsNormal" },
  { name = "Handle", type = "int", access = "read", design = false },
  { name = "Height", type = "int" },
  { name = "Hint", type = "string" },
  { name = "IcoHandle", type = "resource", access = "write", design = false },
  { name = "Icon", type = "picture", access = "write", design = false },
  { name = "KeyPreview", type = "bool", default = false },
  { name = "Left", type = "int", default = 0 },
  { name = "ModalResult", type = "enum", values = ["mrNone", "mrOk", "mrCancel", "mrAbort", "mrRetry", "mrIgnore", "mrYes", "mrNo", "mrAll"], access = "write", design = false },
  { name = "Parent", type = "component", kinds = ["QFORM"], access = "write", design = false },
  { name = "PopupMenu", type = "component", kinds = ["QPOPUPMENU"], access = "write", design = false },
  { name = "ShowHint", type = "bool", default = false },
  { name = "Top", type = "int", default = 0 },
  { name = "Visible", type = "bool", default = false },
  { name = "Width", type = "int", default = 320 },
  { name = "WindowState", type = "enum", values = ["wsNormal", "wsMinimized", "wsMaximized"], default = "wsNormal" },
  { name = "AutoSize", type = "int", origin = "rapidr" },
  { name = "FontSize", type = "int", origin = "rapidr" },
  { name = "FontColor", type = "color", origin = "rapidr" },
  { name = "Enabled", type = "bool", default = true },
  { name = "HelpFile", type = "string", origin = "rapidr", kind = "file:any" },
  { name = "Modified", type = "bool", default = false, design = false, origin = "rapidr", doc = "True while what the window shows has changes not saved: macOS draws a dot in its close button, and in a browser leaving the page (closing the tab, reloading) asks first, with the browser's own question. Set it when a document changes, False again once it is saved." },
  { name = "PenColor", type = "color", origin = "rapidr" },
  { name = "BrushColor", type = "color", origin = "rapidr" },
  { name = "FontName", type = "string", origin = "rapidr", kind = "font" },
  { name = "CopyMode", type = "enum", values = ["cmBlackness", "cmDstInvert", "cmMergeCopy", "cmMergePaint", "cmNotSrcCopy", "cmNotSrcErase", "cmPatCopy", "cmPatInvert", "cmPatPaint", "cmSrcAnd", "cmSrcCopy", "cmSrcErase", "cmSrcInvert", "cmSrcPaint", "cmWhiteness"] },
  { name = "MdiChildCount", type = "int", default = 0, design = false },
  { name = "Pixel", type = "int", design = false, indexed = 2 },
  { name = "TileMode", type = "int", default = 0 },
]
methods = [
  { name = "AddBorderIcons", params = "Items ..." },
  { name = "Center" },
  { name = "Circle", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER, fill AS INTEGER", value = true, arg_kinds = { c = "color", fill = "color" } },
  { name = "Close", value = true },
  { name = "CopyRect", params = "D, Image, S" },
  { name = "DelBorderIcons", params = "Items ..." },
  { name = "Draw", params = "x AS INTEGER, y AS INTEGER, BMP" },
  { name = "FillRect", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER", value = true, arg_kinds = { c = "color" } },
  { name = "HideTitleBar" },
  { name = "Line", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER", value = true, arg_kinds = { c = "color" } },
  { name = "Paint", params = "x AS INTEGER, y AS INTEGER, c AS INTEGER, borderc AS INTEGER", arg_kinds = { c = "color", borderc = "color" } },
  { name = "Pset", params = "x AS INTEGER, y AS INTEGER, c AS INTEGER", arg_kinds = { c = "color" } },
  { name = "Rectangle", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER", arg_kinds = { c = "color" } },
  { name = "Repaint" },
  { name = "RoundRect", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, x3 AS INTEGER, y3 AS INTEGER, c AS INTEGER", arg_kinds = { c = "color" } },
  { name = "ShapeForm", params = "Filename AS STRING, TransparentColor AS LONG", test = "skip: needs a bitmap file (tests/fixtures/shape_form.bas has one)", arg_kinds = { Filename = "file:image", TransparentColor = "color" } },
  { name = "Show", value = true, test = "skip: waits for the user" },
  { name = "ShowModal", returns = "VARIANT", value = true, test = "skip: waits for the user" },
  { name = "ShowTitleBar" },
  { name = "StretchDraw", params = "Rect AS RRect, BMP" },
  { name = "TextHeight", params = "Text AS STRING", returns = "WORD" },
  { name = "TextWidth", params = "Text AS STRING", returns = "WORD" },
  { name = "TextRect", params = "Rect AS RRect, x AS INTEGER, y AS INTEGER, S AS STRING, fc AS INTEGER, bc AS INTEGER", test = "args: 0, 0, 0, \"x\", 0, -1", doc = "Writes `S` at (`x`, `y`) in colour `fc` as TextOut does, but only the part inside `Rect` (its right and bottom edges left out) shows; a background colour `bc` fills the whole of `Rect` first, -1 leaves what is there.", arg_kinds = { fc = "color", bc = "color" } },
  { name = "TextOut", params = "x AS INTEGER, y AS INTEGER, s AS STRING, fc AS INTEGER, bc AS INTEGER", arg_kinds = { fc = "color", bc = "color" } },
  { name = "Refresh", value = true, origin = "rapidr" },
  { name = "SaveImage", params = "FileName AS STRING", returns = "INTEGER", value = true, origin = "rapidr", only = "desktop", effects = ["file-write"], test = "skip: writes a file of a shown form", arg_kinds = { FileName = "file:image" }, doc = "Saves what the form shows now — its controls as drawn, at the screen's scale — as a picture: a PNG file (a BMP when the name ends in .bmp). True when it was saved; False when the form isn't shown or the file can't be written. Only the program's own windows: never the screen or another program's. Desktop only for now." },
  { name = "Hide", value = true, origin = "rapidr" },
  { name = "SetFocus", value = true, origin = "rapidr" },
  { name = "Update", origin = "rapidr" },
  { name = "Rect", value = true, origin = "rapidr" },
  { name = "SetPixel", value = true, origin = "rapidr" },
  { name = "FillCircle", origin = "rapidr" },
  { name = "Ellipse", value = true, origin = "rapidr" },
  { name = "Cls", origin = "rapidr" },
  { name = "DrawText", value = true, origin = "rapidr" },
  { name = "ArrangeIcons" },
  { name = "Cascade" },
  { name = "Next" },
  { name = "Previous" },
  { name = "Tile" },
]
events = [
  { name = "OnClick" },
  { name = "OnClose", params = "BYREF Action AS INTEGER" },
  { name = "OnHint", params = "Hint AS STRING" },
  { name = "OnKeyDown", params = "Key AS WORD, Shift AS INTEGER" },
  { name = "OnKeyPress", params = "Key AS BYTE" },
  { name = "OnKeyUp", params = "Key AS WORD, Shift AS INTEGER" },
  { name = "OnMouseDown", params = "Button AS INTEGER, X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnMouseMove", params = "X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnMouseWheel", params = "Delta AS INTEGER, X AS INTEGER, Y AS INTEGER, Shift AS INTEGER", origin = "rapidr", doc = "RapidR's: the mouse wheel turned over it, or over a component in it that doesn't scroll with the wheel itself: the first one up from under the mouse whose OnMouseWheel is bound hears it. Delta is whole notches, 1 a notch away from you (up), -1 toward you (down); X, Y are the mouse in its own pixels; Shift as OnMouseMove's. A list, a memo, a grid, a scroll bar, and a scroll box's or form's own scroll bars under the mouse take the wheel themselves. Use it to scroll a list you paint yourself." },
  { name = "OnMouseUp", params = "Button AS INTEGER, X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnPaint" },
  { name = "OnResize" },
  { name = "OnShow" },
  { name = "WndProc", params = "Hwnd AS LONG, Msg AS LONG, wParam AS LONG, lParam AS LONG", doc = "Windows' messages to the form (Hwnd, Msg, wParam, lParam): `WndProc = MySub` in its CREATE (or `Form.WndProc = MySub`). On Windows, every message Windows sends or posts to the form's window: the system's (WM_SIZE, WM_ACTIVATE, the mouse and the keys …) and the ones a program or a driver sends (`PostMessageA(Form.Handle, WM_USER + 1, …)`, winmm's MM_MIM_DATA from a MIDI input opened with CALLBACK_WINDOW), from the moment its window shows. Hwnd is the form's Handle; Msg, wParam and lParam are 32-bit numbers. The handler runs just after Windows has handled the message, in the order the messages came; what it returns is ignored. On macOS, Linux and the web there are no Windows messages: it hears only the form's system tray icon (RNotifyIconData and Shell_NotifyIcon), so a program hears its icon's clicks." },
  { name = "OnMessage", params = "Hwnd AS LONG, Msg AS LONG, wParam AS LONG, lParam AS LONG", origin = "rapidr", doc = "Another name for WndProc (RapidR's): `OnMessage = MySub` in its CREATE (or `Form.OnMessage = MySub`). It is the same event, with the same four parameters, delivered the same way and in the same places: on Windows every message Windows sends or posts to the form's window; on macOS, Linux and the web only the form's system tray icon (RNotifyIconData and Shell_NotifyIcon). With both bound, the one bound last hears the messages." },
  { name = "OnDblClick", origin = "rapidr" },
  { name = "OnTimer", origin = "rapidr" },
  { name = "OnLoad", origin = "rapidr" },
  { name = "OnDropFiles", params = "Files AS STRING", origin = "rapidr", doc = "Files were dragged from the computer (Finder, File Explorer, a file manager) and dropped on the window. Files holds their paths, one a line (CHR$(10) between them); open each as any file. In a browser a dropped file is read into the program's own files under its name, so Files holds names (\"sales.csv\") the program opens the same way. A form without this handler ignores them." },
]

[[component]]
name = "RFORMMDI"
display = "FormMDI"
rapidq = "QFORMMDI"
from = "RAPIDQ2.INC"
visual = true
container = true
default_event = "OnChildClose"
doc = "An MDI parent window: a form whose child windows open, tile, cascade and minimize inside it (AddChild, CascadeChild …)."
properties = [
  { name = "ChildCaption", type = "string" },
  { name = "ChildHandle", type = "int", access = "read", design = false },
  { name = "ChildLeft", type = "int" },
  { name = "ChildTop", type = "int" },
  { name = "ChildWidth", type = "int" },
  { name = "ChildHeight", type = "int" },
  { name = "ChildMax", type = "int", default = 1024 },
  { name = "ChildCount", type = "int", access = "read", design = false },
  { name = "ChildIcon", type = "int" },
  { name = "ChildState", type = "int" },
  { name = "MDIMenu", type = "int" },
  { name = "ComponentIndex", type = "int", access = "read", design = false },
  { name = "ChildResult", type = "bool", default = false },
  { name = "PenColor", type = "color", origin = "rapidr" },
  { name = "BrushColor", type = "color", origin = "rapidr" },
  { name = "FontColor", type = "color", origin = "rapidr" },
  { name = "FontName", type = "string", origin = "rapidr", kind = "font" },
  { name = "FontSize", type = "int", origin = "rapidr" },
]
methods = [
  { name = "AddChild", params = "handle AS LONG, Title AS STRING, index AS LONG, left AS INTEGER, top AS INTEGER, width AS INTEGER, height AS INTEGER, DefaultSize AS LONG" },
  { name = "CloseChild", value = true },
  { name = "CloseAllChild", value = true },
  { name = "CascadeChild", value = true },
  { name = "SetHorzChild", value = true },
  { name = "SetVertChild", value = true },
  { name = "IconArrangeChild", value = true },
  { name = "MinimizeAllChild" },
  { name = "MaximizeAllChild" },
  { name = "RestoreChild" },
  { name = "ActiveNextChild" },
  { name = "ActivePreviousChild" },
  { name = "GetChild", params = "Title AS STRING", returns = "VARIANT" },
  { name = "ChildExist", params = "Title AS STRING", returns = "VARIANT" },
  { name = "ActiveChild", params = "Index AS LONG" },
  { name = "FreeChild", params = "handle AS LONG", returns = "VARIANT" },
  { name = "SetDeskBar" },
  { name = "Rect", value = true, origin = "rapidr" },
  { name = "SetPixel", value = true, origin = "rapidr" },
  { name = "FillCircle", origin = "rapidr" },
  { name = "Ellipse", value = true, origin = "rapidr" },
  { name = "Cls", origin = "rapidr" },
  { name = "DrawText", value = true, origin = "rapidr" },
]
events = [
  { name = "OnChildClose", params = "handleChild AS LONG, index AS LONG, titleChild AS STRING" },
  { name = "OnChildActive", params = "handleChild AS LONG, index AS LONG, titleChild AS STRING" },
  { name = "OnChildResize", params = "handleChild AS LONG, index AS LONG, titleChild AS STRING" },
]

[[component]]
name = "RFORMEX"
display = "FormEx"
rapidq = "QFORMEX"
from = "RAPIDQ2.INC"
extends = "RFORM"
visual = true
container = true
size = [320, 240]
default_event = "OnShow"
doc = "A form with more: files dropped onto it one by one (OnDrag), its own icon in the system tray (AddTrayIcon, OnTrayClick, an animation from TrayICO), the whole window see-through (Transparent) or only its background (TransparentClient), always on top (FormStyle = fsStayOnTop), and told when it is minimised (OnMinimise), gets or loses the focus (OnGetFocus, OnLostFocus), and, on Windows, the window's messages (OnMessage). Everything an RForm has, it has too. Written QFormEx (the name an older include gave it), it behaves exactly as that include's form: an empty DragZone takes no drop, OnMouseWheel gets the screen position and Windows' key flags, OnMinimise comes just before the window minimises, and Transparent reads 0 until the program sets it."
example = "CREATE Main AS RFormEx\n    Caption = \"Drop files here\"\n    DragEnable = True\n    OnDrag = FileDropped\nEND CREATE\n\nSUB FileDropped(File AS STRING)\n    Main.Caption = File\nEND SUB\n\nMain.ShowModal"
properties = [
  { name = "DragEnable", type = "bool", default = false, category = "Behavior", doc = "True: files dragged from the computer (Finder, File Explorer, a file manager) can be dropped on the form, and OnDrag hears each one. False: the form doesn't take them (OnDropFiles, every form's, still does when it is bound)." },
  { name = "DragZone", type = "component", kinds = ["QRECT"], design = false, doc = "Where on the form a drop counts: `DragZone.Left`, `.Top`, `.Right`, `.Bottom`, in the form's client pixels (Right and Bottom outside the zone). Empty (Right not past Left or Bottom not past Top, as it starts): the whole form; written QFormEx, an empty zone takes no drop at all, as the include's form did." },
  { name = "DropPoint", type = "any", access = "read", design = false, doc = "Where the last file was dropped: `DropPoint.X`, `DropPoint.Y`, in the form's client pixels. Set before OnDrag." },
  { name = "FormStyle", type = "enum", values = ["fsNormal", "fsStayOnTop"], default = "fsNormal", category = "Window", doc = "fsStayOnTop keeps the window above other programs' windows (on Wayland the compositor decides; in a browser it stays above the page's other windows); fsNormal makes it an ordinary window again. An RForm's FormStyle does the same." },
  { name = "TrayICO", type = "component", kinds = ["QIMAGELIST"], access = "read", design = false, doc = "The tray icon's pictures, an RImageList of the form's own: `Main.TrayICO.AddICOFile \"app.ico\"` (AddBMPFile, AddICOHandle, AddSVGFile too). With none, the tray shows the form's icon, else the application's, else RapidR's." },
  { name = "TrayIconHint", type = "string", category = "Behavior", doc = "The tray icon's tooltip; the application's title until set. Changing it while the icon shows changes the tooltip at once." },
  { name = "TrayIconIndex", type = "int", default = 0, range = "0..", category = "Appearance", doc = "Which of TrayICO's pictures the tray shows, from 1 (0, as it starts, is the first too). A number past the last is ignored. Setting it while the icon shows changes the picture at once." },
  { name = "TrayIconUpdate", type = "int", default = 2000, range = "0..", unit = "ms", category = "Appearance", doc = "With two pictures or more in TrayICO, they take turns in the tray at this pace (an animation), from when the form shows; 0 stops it." },
  { name = "TrayIconShown", type = "bool", access = "read", design = false, origin = "rapidr", doc = "True while the form's icon is in the system tray (after AddTrayIcon, until DelTrayIcon or the form closes)." },
  { name = "Transparent", type = "int", default = 255, range = "0..255", category = "Appearance", doc = "How opaque the whole window is — frame, title bar, controls and all: 255 opaque, 127 half see-through, 0 invisible (it still takes the mouse). Values outside 0 to 255 are ignored. Written QFormEx it reads 0 until the program sets it, and the window stays as it is until then. Windows, macOS and the web; not on Linux yet (the window stays opaque there)." },
  { name = "TransparentClient", type = "bool", default = false, category = "Appearance", doc = "True turns the form's background colour (its Color) into a hole: the desktop shows through and clicks there go to whatever is behind. The controls stay, except their parts in exactly that colour. Windows, macOS and the web; not on Linux yet (the background stays there)." },
]
methods = [
  { name = "AddTrayIcon", effects = ["ui"], doc = "Puts the form's icon in the system tray — the notification area on Windows, the menu bar on macOS, the panel on Linux, a strip in the page on the web — with TrayICO's picture (TrayIconIndex) and the TrayIconHint tooltip. OnTrayClick and OnTrayDblClick hear it. Calling it again while it shows does nothing." },
  { name = "DelTrayIcon", effects = ["ui"], doc = "Takes the form's icon out of the system tray. Closing the form for good and the program ending take it away too." },
  { name = "ModifyTrayIcon", effects = ["ui"], doc = "Shows the tray icon again with the current picture and tooltip (setting TrayIconHint or TrayIconIndex does it already)." },
  { name = "SetTrayIconIndex", params = "Index AS INTEGER", effects = ["ui"], doc = "Shows TrayICO's picture number `Index` (from 1) in the tray: the same as setting TrayIconIndex." },
  { name = "RemoveTaskBar", effects = ["ui"], doc = "Takes the window's button off the Windows taskbar (a program that lives in the tray). Elsewhere it does nothing: macOS shows the application in the Dock, not its windows." },
  { name = "InheritOnShow", effects = ["none"], doc = "Accepted and does nothing: the work the include's own OnShow did (hooking the window, starting the tray animation) is RFormEx's own. A program that set OnShow calls it, as it did there." },
  { name = "InheritOnClose", effects = ["none"], doc = "Accepted and does nothing: what the include's own OnClose did (taking the tray icon away) RFormEx does itself when the form closes." },
]
events = [
  { name = "OnDrag", params = "File AS STRING", doc = "A file was dropped on the form (with DragEnable = True, inside DragZone): once for each file of the drop, in the order the system gave them, with its whole path; DropPoint says where. In a browser the file is read into the program's own files and `File` is its name." },
  { name = "OnTrayClick", doc = "The right mouse button was released on the form's tray icon (on macOS also a Control-click): the place to show a pop-up menu." },
  { name = "OnTrayDblClick", doc = "The form's tray icon was double-clicked with the left button: the place to show the form again." },
  { name = "OnTrayMouseUp", params = "Button AS INTEGER", origin = "rapidr", doc = "A mouse button was released on the form's tray icon: Button is mbLeft (0), mbRight (1) or mbMiddle (2). For a program that wants the left click too." },
  { name = "OnMinimise", doc = "The person minimised the window (its button, the system menu, the taskbar or the Dock), not when the program set WindowState itself: a program that lives in the tray hides the form here. It comes once the window is minimised; written QFormEx, just before it minimises (on Windows; elsewhere the system tells RapidR once it happened)." },
  { name = "OnGetFocus", doc = "The window became the active one (clicked, switched to with Alt+Tab or Command+Tab, or the program's SetFocus)." },
  { name = "OnLostFocus", doc = "The window stopped being the active one: another window, of this program or another, took the keyboard." },
  { name = "OnMouseWheel", params = "Delta AS INTEGER, X AS INTEGER, Y AS INTEGER, Shift AS INTEGER", doc = "The mouse wheel turned over the form, or over a component on it that doesn't scroll with the wheel itself. Delta is whole notches, 1 a notch away from you (up), -1 toward you (down); X, Y are the mouse in the form's pixels; Shift as OnMouseMove's. Written QFormEx (the include's), Delta is 1 or -1 each time, X and Y are the mouse on the screen and Shift is Windows' key flags (4 Shift, 8 Ctrl)." },
  { name = "OnMessage", params = "Hwnd AS LONG, Msg AS LONG, wParam AS LONG, lParam AS LONG", doc = "The window's messages (Hwnd, Msg, wParam, lParam; the handler's result is ignored). On Windows: every message Windows sends or posts to the form's window — a MIDI input's MM_MIM_DATA opened with CALLBACK_WINDOW, WM_USER + n a program posts, WM_SIZE, the mouse and keys … — except the ones that are RFormEx's own events: WM_DROPFILES, WM_ACTIVATE, WM_KILLFOCUS, WM_SYSCOMMAND, WM_MOUSEWHEEL and the tray icon's (&H590). On macOS, Linux and the web there are no Windows messages: it hears exactly the program's own tray icons' (RNotifyIconData and Shell_NotifyIcon), WM_SIZE (&H5: wParam 0 restored, 1 minimised, 2 maximised; lParam the client width + height * 65536) and WM_MOVE (&H3: lParam the client area's left + top * 65536 on the screen). WndProc, every form's, hears every message." },
]

[[component]]
name = "RPANEL"
display = "Panel"
rapidq = "QPANEL"
visual = true
container = true
size = [185, 41]
default_event = "OnClick"
sets = ["layout", "a11y"]
doc = "A container with raised or lowered bevels and an optional caption, to group components and, with Align, build toolbars and side areas."
properties = [
  { name = "Align", type = "enum", values = ["alNone", "alTop", "alBottom", "alLeft", "alRight", "alClient"], default = "alNone" },
  { name = "Alignment", type = "enum", values = ["taLeftJustify", "taRightJustify", "taCenter"], default = "taCenter" },
  { name = "BevelInner", type = "enum", values = ["bvNone", "bvLowered", "bvRaised"], default = "bvNone" },
  { name = "BevelOuter", type = "enum", values = ["bvNone", "bvLowered", "bvRaised"], default = "bvRaised" },
  { name = "BevelWidth", type = "int", default = 1 },
  { name = "BorderStyle", type = "enum", values = ["bsNone", "bsSingle", "bsSizeable", "bsDialog", "bsToolWindow", "bsSizeToolWin"], default = "bsNone" },
  { name = "Caption", type = "string", default = "" },
  { name = "ClientHeight", type = "int", design = false },
  { name = "ClientWidth", type = "int", design = false },
  { name = "Color", type = "color" },
  { name = "Cursor", type = "enum", values = ["crDefault", "crNone", "crArrow", "crCross", "crIBeam", "crSize", "crSizeNESW", "crSizeNS", "crSizeNWSE", "crSizeWE", "crUpArrow", "crHourGlass", "crDrag", "crNoDrop", "crHSplit", "crVSplit", "crMultiDrag", "crSQLWait", "crNo", "crAppStart", "crHelp", "crHandPoint"], default = "crDefault" },
  { name = "Enabled", type = "bool", default = true },
  { name = "Font", type = "font", access = "write", design = true },
  { name = "Handle", type = "int", access = "read", design = false },
  { name = "Height", type = "int" },
  { name = "Hint", type = "string" },
  { name = "Left", type = "int", default = 0 },
  { name = "Parent", type = "component", kinds = ["QFORM", "QPANEL", "QTABCONTROL"], access = "write", design = false },
  { name = "ShowHint", type = "bool", default = false },
  { name = "TabOrder", type = "int" },
  { name = "Tag", type = "int" },
  { name = "Top", type = "int", default = 0 },
  { name = "Width", type = "int" },
  { name = "Visible", type = "bool", default = true },
  { name = "FontSize", type = "int", origin = "rapidr" },
  { name = "FontColor", type = "color", origin = "rapidr" },
  { name = "PopupMenu", type = "component", kinds = ["QPOPUPMENU"] },
