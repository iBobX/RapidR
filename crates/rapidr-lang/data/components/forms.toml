  { name = "ChildCaption", type = "string" },
  { name = "ChildHandle", type = "int", access = "read", design = false },
  { name = "ChildLeft", type = "int" },
  { name = "ChildTop", type = "int" },
  { name = "ChildWidth", type = "int" },
  { name = "ChildHeight", type = "int" },
  { name = "ChildMax", type = "int", default = 1024 },
  { name = "ChildCount", type = "int", access = "read", design = false },
  { name = "ChildIcon", type = "int" },
  { name = "ChildState", type = "int" },
  { name = "MDIMenu", type = "int" },
  { name = "ComponentIndex", type = "int", access = "read", design = false },
  { name = "ChildResult", type = "bool", default = false },
  { name = "PenColor", type = "color", origin = "rapidr" },
  { name = "BrushColor", type = "color", origin = "rapidr" },
  { name = "FontColor", type = "color", origin = "rapidr" },
  { name = "FontName", type = "string", origin = "rapidr" },
  { name = "FontSize", type = "int", origin = "rapidr" },
]
methods = [
  { name = "AddChild", params = "handle AS LONG, Title AS STRING, index AS LONG, left AS INTEGER, top AS INTEGER, width AS INTEGER, height AS INTEGER, DefaultSize AS LONG" },
  { name = "CloseChild", value = true },
  { name = "CloseAllChild", value = true },
  { name = "CascadeChild", value = true },
  { name = "SetHorzChild", value = true },
  { name = "SetVertChild", value = true },
  { name = "IconArrangeChild", value = true },
  { name = "MinimizeAllChild" },
  { name = "MaximizeAllChild" },
  { name = "RestoreChild" },
  { name = "ActiveNextChild", missing = true },
  { name = "ActivePreviousChild", missing = true },
  { name = "GetChild", params = "Title AS STRING", returns = "VARIANT" },
  { name = "ChildExist", params = "Title AS STRING", returns = "VARIANT" },
  { name = "ActiveChild", params = "Index AS LONG" },
  { name = "FreeChild", params = "handle AS LONG", returns = "VARIANT" },
  { name = "SetDeskBar" },
  { name = "Rect", value = true },
  { name = "SetPixel", value = true, origin = "rapidr" },
  { name = "FillCircle", origin = "rapidr" },
  { name = "Ellipse", value = true, origin = "rapidr" },
  { name = "Cls", origin = "rapidr" },
  { name = "DrawText", value = true, origin = "rapidr" },
]
events = [
  { name = "OnChildClose", params = "handleChild AS LONG, index AS LONG, titleChild AS STRING" },
  { name = "OnChildActive", params = "handleChild AS LONG, index AS LONG, titleChild AS STRING" },
  { name = "OnChildResize", params = "handleChild AS LONG, index AS LONG, titleChild AS STRING" },
]

