# Lists, grids and trees: the registry's components (crates/rapidr-lang; src/lib.rs says how to edit).
group = "Lists, grids and trees"

[[component]]
name = "RLISTBOX"
display = "ListBox"
rapidq = "QLISTBOX"
visual = true
size = [121, 97]
default_event = "OnClick"
sets = ["layout", "a11y"]
doc = "A list of text items the user picks one or several of; it can be sorted, in columns or drawn by the program."
properties = [
  { name = "Align", type = "enum", values = ["alNone", "alTop", "alBottom", "alLeft", "alRight", "alClient"], default = "alNone" },
  { name = "BorderStyle", type = "enum", values = ["bsNone", "bsSingle", "bsSizeable", "bsDialog", "bsToolWindow", "bsSizeToolWin"], default = "bsSingle" },
  { name = "Color", type = "color" },
  { name = "Columns", type = "int", default = 0 },
  { name = "CopyMode", type = "enum", values = ["cmBlackness", "cmDstInvert", "cmMergeCopy", "cmMergePaint", "cmNotSrcCopy", "cmNotSrcErase", "cmPatCopy", "cmPatInvert", "cmPatPaint", "cmSrcAnd", "cmSrcCopy", "cmSrcErase", "cmSrcInvert", "cmSrcPaint", "cmWhiteness"], default = "cmSrcCopy" },
  { name = "Cursor", type = "enum", values = ["crDefault", "crNone", "crArrow", "crCross", "crIBeam", "crSize", "crSizeNESW", "crSizeNS", "crSizeNWSE", "crSizeWE", "crUpArrow", "crHourGlass", "crDrag", "crNoDrop", "crHSplit", "crVSplit", "crMultiDrag", "crSQLWait", "crNo", "crAppStart", "crHelp", "crHandPoint"], default = "crDefault" },
  { name = "Enabled", type = "bool", default = true },
  { name = "ExtendedSelect", type = "bool", default = true },
  { name = "Font", type = "font", access = "write", design = false },
  { name = "Handle", type = "int", access = "read", design = false },
  { name = "Height", type = "int" },
  { name = "Hint", type = "string" },
  { name = "Item", type = "string", design = false, indexed = 1 },
  { name = "ItemCount", type = "int", access = "read", design = false },
  { name = "ItemHeight", type = "int" },
  { name = "ItemIndex", type = "int" },
  { name = "Left", type = "int", default = 0 },
  { name = "MultiSelect", type = "bool", default = false },
  { name = "Parent", type = "component", kinds = ["QFORM", "QPANEL", "QTABCONTROL"], access = "write", design = false },
  { name = "PopupMenu", type = "component", kinds = ["QPOPUPMENU"], access = "write", design = false },
  { name = "SelCount", type = "int", access = "read", design = false },
  { name = "Selected", type = "int", design = false, indexed = 1 },
  { name = "ShowHint", type = "bool", default = false },
  { name = "Sorted", type = "bool", default = false },
  { name = "Style", type = "enum", values = ["lbStandard", "lbOwnerDrawFixed", "lbOwnerDrawVariable"], default = "lbStandard" },
  { name = "TabOrder", type = "int" },
  { name = "TabWidth", type = "int", default = 0 },
  { name = "Tag", type = "int" },
  { name = "Text", type = "string" },
  { name = "Top", type = "int", default = 0 },
  { name = "TopIndex", type = "int" },
  { name = "Visible", type = "bool", default = true },
  { name = "Width", type = "int" },
  { name = "FontSize", type = "int", origin = "rapidr" },
  { name = "FontColor", type = "color", origin = "rapidr" },
  { name = "PenColor", type = "color", origin = "rapidr" },
  { name = "BrushColor", type = "color", origin = "rapidr" },
  { name = "FontName", type = "string", origin = "rapidr" },
  { name = "Count", type = "int", origin = "rapidr" },
  { name = "ListCount", type = "int", origin = "rapidr" },
  { name = "ListIndex", type = "int", origin = "rapidr" },
  { name = "Items", type = "string", origin = "rapidr" },
  { name = "Pixel", type = "int", design = false, indexed = 2 },
]
methods = [
  { name = "AddItems", params = "Items ...", value = true },
  { name = "Circle", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER, fill AS INTEGER", doc = "Draws on the list (RC.EXE-built programs, seen in Windows): in an owner-drawn list's OnDrawItem on the item, kept with it; on a list box that isn't owner-drawn on the list itself, until the list paints those rows again; on a combo box that isn't owner-drawn nothing shows." },
  { name = "Clear", value = true },
  { name = "CopyRect", params = "D, Image, S", missing = true },
  { name = "DelItems", params = "Items ..." },
  { name = "Draw", params = "x AS INTEGER, y AS INTEGER, BMP" },
  { name = "FillRect", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER", doc = "Draws on the list (RC.EXE-built programs, seen in Windows): in an owner-drawn list's OnDrawItem on the item, kept with it; on a list box that isn't owner-drawn on the list itself, until the list paints those rows again; on a combo box that isn't owner-drawn nothing shows." },
  { name = "InsertItem", params = "Index AS INTEGER, String AS STRING" },
  { name = "Line", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER", doc = "Draws on the list (RC.EXE-built programs, seen in Windows): in an owner-drawn list's OnDrawItem on the item, kept with it; on a list box that isn't owner-drawn on the list itself, until the list paints those rows again; on a combo box that isn't owner-drawn nothing shows." },
  { name = "LoadFromFile", params = "FileName AS STRING" },
  { name = "Paint", params = "x AS INTEGER, y AS INTEGER, c AS INTEGER, borderc AS INTEGER", doc = "Flood-fills from (`x`, `y`) with `c` up to the border colour `borderc`, on the pixels drawn so far: in an owner-drawn list's OnDrawItem the item, on a list box that isn't owner-drawn the list (as `Line` and the rest)." },
  { name = "Pset", params = "x AS INTEGER, y AS INTEGER, c AS INTEGER", missing = true },
  { name = "Rectangle", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER", missing = true },
  { name = "Repaint" },
  { name = "RoundRect", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, x3 AS INTEGER, y3 AS INTEGER, c AS INTEGER", missing = true },
  { name = "SaveToFile", params = "FileName AS STRING" },
  { name = "StretchDraw", params = "Rect AS RRect, BMP", missing = true },
  { name = "TextHeight", params = "Text AS STRING", returns = "WORD", missing = true },
  { name = "TextWidth", params = "Text AS STRING", returns = "WORD", missing = true },
  { name = "TextRect", params = "Rect AS RRect, x AS INTEGER, y AS INTEGER, S AS STRING, fc AS INTEGER, bc AS INTEGER", missing = true },
  { name = "TextOut", params = "x AS INTEGER, y AS INTEGER, S AS STRING, fc AS INTEGER, bc AS INTEGER", missing = true },
  { name = "AddItem", value = true, origin = "rapidr" },
  { name = "DeleteItem", value = true, origin = "rapidr" },
  { name = "SetFocus", value = true, origin = "rapidr" },
  { name = "Refresh", value = true, origin = "rapidr" },
  { name = "AddString", origin = "rapidr" },
  { name = "DeleteItems", value = true, origin = "rapidr" },
  { name = "RemoveItem", value = true, origin = "rapidr" },
  { name = "Find", value = true, origin = "rapidr" },
]
events = [
  { name = "OnClick" },
  { name = "OnDblClick" },
  { name = "OnDrawItem", params = "Index AS INTEGER, State AS INTEGER, R AS QRECT" },
  { name = "OnEnter", missing = true },
  { name = "OnMeasureItem", params = "Index AS INTEGER, Height AS INTEGER" },
  { name = "WndProc", params = "Hwnd AS INTEGER, Msg AS INTEGER, wParam AS INTEGER, lParam AS INTEGER", missing = true },
  { name = "OnChange", origin = "rapidr" },
]

