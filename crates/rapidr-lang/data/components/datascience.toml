# Data science: the registry's components (crates/rapidr-lang; src/lib.rs says how to edit).
group = "Data science"

[[component]]
name = "RNUM"
visual = false
doc = "NumPy-compatible numeric array component (backed by ndarray). Supports creation, aggregation, element-wise math, arithmetic, sorting, cumulative ops, linear algebra, random generation, and more."
properties = [
  { name = "Data", type = "string" },
  { name = "Shape", type = "string" },
  { name = "Size", type = "int" },
  { name = "Length", type = "int", indexed = 1, design = false },
  { name = "Len", type = "int" },
  { name = "NDim", type = "int" },
  { name = "DType", type = "any" },
  { name = "Avg", type = "string", only = "web" },
  { name = "Average", type = "string", only = "web" },
]
methods = [
  { name = "Arange", params = "start, stop, [step]", doc = "Creates evenly spaced values in [start, stop) with given step (default 1)", value = true },
  { name = "Linspace", params = "start, stop, [num]", doc = "Creates num evenly spaced values between start and stop (default 50)", value = true },
  { name = "Zeros", params = "n", doc = "Creates array of n zeros", value = true },
  { name = "Ones", params = "n", doc = "Creates array of n ones", value = true },
  { name = "Full", params = "n, fillValue", doc = "Creates array of n elements filled with fillValue", value = true },
  { name = "Fromlist", params = "v1, v2, v3 ...", doc = "Creates array from comma-separated string of numbers", value = true },
  { name = "Sum", doc = "Returns sum of all elements", value = true },
  { name = "Mean", doc = "Returns arithmetic mean", value = true },
  { name = "Min", value = true },
  { name = "Max", value = true },
  { name = "Std", doc = "Returns standard deviation", value = true },
  { name = "Var", doc = "Returns variance", value = true },
  { name = "Median", doc = "Returns median value", value = true },
  { name = "Argmin", doc = "Returns index of minimum value", value = true },
  { name = "Argmax", doc = "Returns index of maximum value", value = true },
  { name = "Count", doc = "Returns number of elements", value = true },
  { name = "Ptp", doc = "Returns peak-to-peak (max - min) range", value = true },
  { name = "Sin", value = true },
  { name = "Cos", value = true },
  { name = "Tan", value = true },
  { name = "Asin", value = true },
  { name = "Acos", value = true },
  { name = "Atan", value = true },
  { name = "Sqrt", value = true },
  { name = "Abs", value = true },
  { name = "Exp", value = true },
  { name = "Log", value = true },
  { name = "Log2" },
  { name = "Log10" },
  { name = "Floor", value = true },
  { name = "Ceil", value = true },
  { name = "Round", params = "[decimals]", doc = "Rounds elements to given decimal places (default 0)", value = true },
  { name = "Sign", value = true },
  { name = "Reciprocal", value = true },
  { name = "Square", value = true },
  { name = "Negative", value = true },
  { name = "Add", params = "value", doc = "Adds scalar or another array element-wise" },
  { name = "Subtract", params = "value", doc = "Subtracts scalar or another array element-wise", value = true },
  { name = "Multiply", params = "value", doc = "Multiplies by scalar or another array element-wise", value = true },
  { name = "Divide", params = "value", doc = "Divides by scalar or another array element-wise", value = true },
  { name = "Power", params = "exp", doc = "Raises elements to the given power", value = true },
  { name = "Mod", params = "divisor", doc = "Computes element-wise modulo", value = true },
  { name = "Clip", params = "low, high", doc = "Clips values to [low, high] range", value = true },
  { name = "Sort", value = true },
  { name = "Reverse", value = true },
  { name = "Unique", value = true },
  { name = "Shuffle", value = true },
  { name = "Append", params = "v1, v2 ...", doc = "Appends comma-separated values to the array", value = true },
  { name = "Slice", params = "start, end", doc = "Returns elements from start to end index", value = true },
  { name = "Cumsum", value = true },
  { name = "Cumprod", value = true },
  { name = "Diff", value = true },
  { name = "Dot", params = "otherArray", doc = "Computes dot product with another RNum array", value = true },
  { name = "Norm", value = true },
  { name = "Normalize", value = true },
  { name = "Any", value = true },
  { name = "All", value = true },
  { name = "Where" },
  { name = "Nonzero", value = true },
  { name = "Searchsorted", params = "value", doc = "Finds insertion index for value in sorted array", value = true },
  { name = "Rand", params = "n", doc = "Fills with n random values in [0,1)", value = true },
  { name = "Randn", params = "n", doc = "Fills with n standard-normal random values", value = true },
  { name = "Uniform", params = "low, high, n", doc = "Fills with n uniform random values in [low,high)", value = true },
  { name = "Randint", params = "low, high, n", doc = "Fills with n random integers in [low,high)", value = true },
  { name = "Choice", params = "n", doc = "Randomly samples n elements from the array", value = true },
  { name = "Tolist", value = true },
  { name = "ToString", value = true },
  { name = "Print", value = true },
  { name = "Show", value = true },
  { name = "Reshape", only = "desktop", value = true },
  { name = "Clear", value = true },
  { name = "From_list", value = true },
  { name = "Variance", value = true },
  { name = "Arcsin", value = true },
  { name = "Arccos", value = true },
  { name = "Arctan", value = true },
  { name = "Ln", value = true },
  { name = "Neg", value = true },
  { name = "Sub", value = true },
  { name = "Mul", value = true },
  { name = "Div", value = true },
  { name = "Pow", value = true },
  { name = "Fmod", value = true },
  { name = "Clamp", value = true },
  { name = "Flip", value = true },
  { name = "Concatenate", value = true },
  { name = "Random", value = true },
  { name = "Random_normal", value = true },
  { name = "Normal", value = true },
  { name = "Random_uniform", value = true },
  { name = "Create", only = "web" },
  { name = "New", only = "web" },
  { name = "Init", only = "web" },
  { name = "Set", only = "web" },
  { name = "Setvalue", only = "web" },
  { name = "Setitem", only = "web" },
  { name = "Get", only = "web" },
  { name = "Getvalue", only = "web" },
  { name = "Getitem", only = "web" },
  { name = "At", only = "web", value = true },
  { name = "Push", only = "web" },
]
events = []

[[component]]
name = "RDATAFRAME"
visual = false
doc = "Pandas-compatible data frame component (backed by Polars). Supports CSV/JSON I/O, selection, filtering, grouping, column operations, statistics, sampling, joins, transforms, and grid binding."
properties = [
  { name = "RowCount", type = "int" },
  { name = "Height", type = "int" },
  { name = "Nrows", type = "int" },
  { name = "ColCount", type = "int" },
  { name = "Width", type = "int" },
  { name = "Ncols", type = "int" },
  { name = "Columns", type = "int" },
  { name = "Shape", type = "any" },
  { name = "Empty", type = "int" },
]
methods = [
  { name = "LoadFromCSV", params = "filename", doc = "Loads a CSV file into the DataFrame. Auto-resolves paths relative to project.", value = true },
  { name = "Readcsv", params = "filename", doc = "Alias for loadfromcsv.", value = true },
  { name = "Savetocsv", params = "filename", doc = "Saves the DataFrame to a CSV file.", only = "desktop", value = true },
  { name = "Loadfromjson", params = "filename", doc = "Loads a JSON file into the DataFrame.", only = "desktop", value = true },
  { name = "Savetojson", params = "filename", doc = "Saves the DataFrame to a JSON file.", only = "desktop", value = true },
  { name = "Head", params = "[n]", doc = "Returns the first n rows as a string (default 5).", value = true },
  { name = "Tail", params = "[n]", doc = "Returns the last n rows as a string (default 5).", value = true },
  { name = "Cell", params = "col, row", doc = "Returns cell value by column and row indices." },
  { name = "Cellbyname", params = "row, columnName", doc = "Returns cell value by row index and column name.", value = true },
  { name = "At", value = true },
  { name = "SetCell", params = "col, row, value", doc = "Sets a cell value by column and row indices. Auto-expands rows as needed.", value = true },
  { name = "Iloc", params = "row", doc = "Returns an entire row as comma-separated string.", only = "desktop", value = true },
  { name = "Select", params = "col1, col2 ...", doc = "Selects specified columns into a new DataFrame.", value = true },
  { name = "Sort", params = "column, [ascending]", doc = "Sorts by column. ascending: 1 (default) or 0.", value = true },
  { name = "Sort_values", params = "column, [ascending]", doc = "Alias for sort with Pandas naming.", only = "desktop", value = true },
  { name = "Filter", params = "column, operator, value", doc = "Filters rows. Operators: >, <, >=, <=, =, !=, contains.", value = true },
  { name = "Query", params = "expression", doc = "Filters using a query expression string.", only = "desktop" },
  { name = "GroupBy", params = "column, aggColumn, aggFunc", doc = "Groups by column, aggregates aggColumn with aggFunc (mean/sum/count/min/max/first/last).", only = "desktop", value = true },
  { name = "Drop", params = "column", doc = "Removes a column from the DataFrame.", value = true },
  { name = "Rename", params = "oldName, newName", doc = "Renames a column.", value = true },
  { name = "Addcolumn", params = "name, values", doc = "Adds a column with comma-separated values.", value = true },
  { name = "Fillna", params = "value", doc = "Fills null/missing values with the given value.", value = true },
  { name = "Dropna", doc = "Removes rows containing null values.", value = true },
  { name = "Describe", doc = "Returns statistical summary (count, mean, std, min, max, etc.).", value = true },
  { name = "Value_counts", params = "column", doc = "Returns frequency counts for a column.", only = "desktop", value = true },
  { name = "Nunique", params = "column", doc = "Returns number of unique values in a column.", only = "desktop", value = true },
  { name = "Corr", params = "col1, col2", doc = "Returns Pearson correlation coefficient between two columns.", only = "desktop", value = true },
  { name = "Sample", params = "n", doc = "Returns n random rows.", value = true },
  { name = "Nlargest", params = "n, column", doc = "Returns n largest rows by column value.", only = "desktop", value = true },
  { name = "Nsmallest", params = "n, column", doc = "Returns n smallest rows by column value.", only = "desktop", value = true },
  { name = "Info", doc = "Prints DataFrame info: columns, types, non-null counts.", value = true },
  { name = "Dtypes", doc = "Returns column data types.", only = "desktop", value = true },
  { name = "Merge", params = "otherDf, onColumn, [how]", doc = "Joins with another DataFrame. how: inner (default), left, right, outer, cross.", only = "desktop", value = true },
  { name = "Join", only = "desktop", value = true },
  { name = "Concat", params = "otherDf", doc = "Vertically concatenates another DataFrame.", only = "desktop", value = true },
  { name = "Transpose", doc = "Transposes rows and columns.", value = true },
  { name = "Apply", params = "column, function", doc = "Applies a transform to a column: upper, lower, abs, round, sqrt, log.", only = "desktop", value = true },
  { name = "Replace", params = "column, oldValue, newValue", doc = "Replaces values in a column.", only = "desktop", value = true },
  { name = "Clear", value = true },
  { name = "Rows" },
  { name = "ToString", value = true },
  { name = "Show", value = true },
  { name = "Print", value = true },
  { name = "Togrid", params = "gridName", doc = "Populates an RStringGrid with the DataFrame contents.", value = true },
  { name = "Read_csv", value = true },
  { name = "To_csv", only = "desktop", value = true },
  { name = "Writecsv", only = "desktop", value = true },
  { name = "Read_json", only = "desktop", value = true },
  { name = "To_json", only = "desktop", value = true },
  { name = "Group_by", only = "desktop", value = true },
  { name = "Drop_column", value = true },
  { name = "Rename_column", value = true },
  { name = "Add_column", value = true },
  { name = "Set_column", value = true },
  { name = "Fill_null", value = true },
  { name = "Drop_nulls", value = true },
  { name = "Correlation", only = "desktop", value = true },
  { name = "Append", only = "desktop", value = true },
  { name = "T" },
  { name = "Len" },
  { name = "To_grid", value = true },
  { name = "Display", value = true },
  { name = "Create", only = "web" },
  { name = "New", only = "web" },
  { name = "Init", only = "web" },
  { name = "AddRow", only = "web", value = true },
  { name = "Add_row", only = "web" },
  { name = "Appendrow", only = "web" },
  { name = "Push_row", only = "web" },
  { name = "Std", only = "web", value = true },
]
events = []

[[component]]
name = "RPLOT"
visual = true
size = [640, 480]
sets = ["layout", "a11y"]
doc = "Matplotlib-compatible plotting component (backed by plotters). Supports line, bar, scatter, step, area, histogram, pie charts, annotations, and image export."
properties = [
  { name = "Title", type = "string" },
  { name = "XLabel", type = "string" },
  { name = "YLabel", type = "string" },
  { name = "Width", type = "int" },
  { name = "Height", type = "int" },
  { name = "Grid", type = "int" },
  { name = "Dpi", type = "int", only = "desktop" },
  { name = "Html", type = "string", only = "web" },
  { name = "Url", type = "string", only = "web" },
  { name = "Sandbox", type = "string", only = "web" },
  { name = "Src", type = "string", only = "web" },
  { name = "Picture", type = "string", only = "web" },
  { name = "Volume", type = "int", only = "web" },
  { name = "Currenttime", type = "string", only = "web" },
  { name = "Loop", type = "string", only = "web" },
  { name = "Autoplay", type = "string", only = "web" },
  { name = "Controls", type = "string", only = "web" },
  { name = "Poster", type = "string", only = "web" },
  { name = "InnerHTML", type = "string", only = "web" },
  { name = "Innertext", type = "string", only = "web" },
  { name = "CssClass", type = "string", only = "web" },
  { name = "CssStyle", type = "string", only = "web" },
  { name = "Tooltip", type = "string", only = "web" },
  { name = "Hint", type = "string", only = "web" },
  { name = "Tagname", type = "string", only = "web" },
  { name = "Left", type = "int", only = "web" },
  { name = "Top", type = "int", only = "web" },
  { name = "Visible", type = "int", only = "web" },
  { name = "Parent", type = "component", kinds = ["QFORM"], design = false, only = "web" },
  { name = "Parentid", type = "string", only = "web" },
  { name = "Align", type = "enum", values = ["alNone", "alTop", "alBottom", "alLeft", "alRight", "alClient"], only = "web" },
  { name = "Duration", type = "string", only = "web" },
  { name = "Playing", type = "int", only = "web" },
  { name = "Paused", type = "string", only = "web" },
]
methods = [
  { name = "Clear", doc = "Clears all series, annotations and resets the plot.", value = true },
  { name = "Plot", params = "xData, yData, [color], [label]", doc = "Draws a line plot. xData/yData are comma-separated strings.", value = true },
  { name = "Bar", params = "labels, values, [color], [label]", doc = "Draws a vertical bar chart.", value = true },
  { name = "Barh", params = "labels, values, [color], [label]", doc = "Draws a horizontal bar chart.", value = true },
  { name = "Scatter", params = "xData, yData, [color], [label]", doc = "Draws a scatter plot.", value = true },
  { name = "Step", params = "xData, yData, [color], [label]", doc = "Draws a step plot.", value = true },
  { name = "Area", params = "xData, yData, [color], [label]", doc = "Draws a filled area chart.", value = true },
  { name = "Fill_between", value = true },
  { name = "Hist", params = "data, [bins], [color], [label]", doc = "Draws a histogram. Default 10 bins.", value = true },
  { name = "Pie", params = "labels, values, [colors]", doc = "Draws a pie chart.", value = true },
  { name = "Hline", params = "y, [color], [label]", doc = "Draws a horizontal reference line at y.", value = true },
  { name = "Axhline", value = true },
  { name = "Vline", params = "x, [color], [label]", doc = "Draws a vertical reference line at x.", value = true },
  { name = "Axvline", value = true },
  { name = "Annotate", params = "text, x, y, [color]", doc = "Places text annotation at (x,y).", value = true },
  { name = "Legend", params = "[position]", doc = "Enables legend display. Position: \"top-right\" (default).", value = true },
  { name = "SaveFig", params = "filename", doc = "Renders and saves the plot to a PNG file.", value = true },
  { name = "Save", value = true },
  { name = "Figsize", params = "width, height, [dpi]", doc = "Sets figure dimensions in pixels and optional DPI.", value = true },
  { name = "Xlim", params = "min, max", doc = "Sets the X axis range.", value = true },
  { name = "Ylim", params = "min, max", doc = "Sets the Y axis range.", value = true },
  { name = "Xscale", params = "type", doc = "Sets X axis scale: \"linear\" or \"log\".", only = "desktop", value = true },
  { name = "Yscale", params = "type", doc = "Sets Y axis scale: \"linear\" or \"log\".", only = "desktop", value = true },
  { name = "Render", only = "web" },
  { name = "Histogram", value = true },
  { name = "Create", only = "web" },
  { name = "New", only = "web" },
  { name = "Init", only = "web" },
  { name = "Settitle", only = "web" },
  { name = "Set_title", only = "web" },
  { name = "Setxlabel", only = "web" },
  { name = "Set_xlabel", only = "web" },
  { name = "Setylabel", only = "web" },
  { name = "Set_ylabel", only = "web" },
  { name = "Addseries", only = "web" },
  { name = "Add_series", only = "web" },
  { name = "Series", only = "web" },
  { name = "Show", only = "web", value = true },
  { name = "Play", only = "web" },
  { name = "Pause", only = "web" },
  { name = "Stop", only = "web" },
]
events = []
