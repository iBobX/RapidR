# Data science: the registry's components (crates/rapidr-lang; src/lib.rs says how to edit).
group = "Data science"

[[component]]
name = "RNUM"
visual = false
doc = "A numeric array in NumPy's style: make ranges, zeros or lists, then sum, average, sort, compute element-wise and do linear algebra on them. RapidR's own."
properties = [
  { name = "Data", type = "string" },
  { name = "Shape", type = "string", only = "web" },
  { name = "Size", type = "int" },
  { name = "Length", type = "int" },
  { name = "Len", type = "int" },
  { name = "NDim", type = "int" },
  { name = "DType", type = "string" },
  { name = "Avg", type = "string", only = "web" },
  { name = "Average", type = "string", only = "web" },
]
methods = [
  { name = "Arange", params = "start, stop, [step]", value = true, doc = "Creates evenly spaced values in [start, stop) with given step (default 1)" },
  { name = "LinSpace", params = "start, stop, [num]", value = true, doc = "Creates num evenly spaced values between start and stop (default 50)" },
  { name = "Zeros", params = "n", value = true, doc = "Creates array of n zeros" },
  { name = "Ones", params = "n", value = true, doc = "Creates array of n ones" },
  { name = "Full", params = "n, fillValue", value = true, doc = "Creates array of n elements filled with fillValue" },
  { name = "FromList", params = "v1, v2, v3 ...", value = true, doc = "Creates array from comma-separated string of numbers" },
  { name = "Sum", value = true, doc = "Returns sum of all elements" },
  { name = "Mean", value = true, doc = "Returns arithmetic mean" },
  { name = "Min", value = true },
  { name = "Max", value = true },
  { name = "Std", value = true, doc = "Returns standard deviation" },
  { name = "Var", value = true, doc = "Returns variance" },
  { name = "Median", value = true, doc = "Returns median value" },
  { name = "ArgMin", value = true, doc = "Returns index of minimum value" },
  { name = "ArgMax", value = true, doc = "Returns index of maximum value" },
  { name = "Count", value = true, doc = "Returns number of elements" },
  { name = "Ptp", value = true, doc = "Returns peak-to-peak (max - min) range" },
  { name = "Sin", value = true },
  { name = "Cos", value = true },
  { name = "Tan", value = true },
  { name = "Asin", value = true },
  { name = "Acos", value = true },
  { name = "Atan", value = true },
  { name = "Sqrt", value = true },
  { name = "Abs", value = true },
  { name = "Exp", value = true },
  { name = "Log", value = true },
  { name = "Log2", value = true },
  { name = "Log10", value = true },
  { name = "Floor", value = true },
  { name = "Ceil", value = true },
  { name = "Round", params = "[decimals]", value = true, doc = "Rounds elements to given decimal places (default 0)" },
  { name = "Sign", value = true },
  { name = "Reciprocal", value = true },
  { name = "Square", value = true },
  { name = "Negative", value = true },
  { name = "Add", params = "value", doc = "Adds scalar or another array element-wise" },
  { name = "Subtract", params = "value", value = true, doc = "Subtracts scalar or another array element-wise" },
  { name = "Multiply", params = "value", value = true, doc = "Multiplies by scalar or another array element-wise" },
  { name = "Divide", params = "value", value = true, doc = "Divides by scalar or another array element-wise" },
  { name = "Power", params = "exp", value = true, doc = "Raises elements to the given power" },
  { name = "Mod", params = "divisor", value = true, doc = "Computes element-wise modulo" },
  { name = "Clip", params = "low, high", value = true, doc = "Clips values to [low, high] range" },
  { name = "Sort", value = true },
  { name = "Reverse", value = true },
  { name = "Unique", value = true },
  { name = "Shuffle", value = true },
  { name = "Append", params = "v1, v2 ...", value = true, doc = "Appends comma-separated values to the array" },
  { name = "Slice", params = "start, end", value = true, doc = "Returns elements from start to end index" },
  { name = "CumSum", value = true },
  { name = "CumProd", value = true },
  { name = "Diff", value = true },
  { name = "Dot", params = "otherArray", value = true, doc = "Computes dot product with another RNum array" },
  { name = "Norm", value = true },
  { name = "Normalize", value = true },
  { name = "Any", value = true },
  { name = "All", value = true },
  { name = "Where" },
  { name = "Nonzero", value = true },
  { name = "SearchSorted", params = "value", value = true, doc = "Finds insertion index for value in sorted array" },
  { name = "Rand", params = "n", value = true, doc = "Fills with n random values in [0,1)" },
  { name = "Randn", params = "n", value = true, doc = "Fills with n standard-normal random values" },
  { name = "Uniform", params = "low, high, n", value = true, doc = "Fills with n uniform random values in [low,high)" },
  { name = "Randint", params = "low, high, n", value = true, doc = "Fills with n random integers in [low,high)" },
  { name = "Choice", params = "n", value = true, doc = "Randomly samples n elements from the array" },
  { name = "ToList", value = true },
  { name = "ToString", value = true },
  { name = "Print", value = true },
  { name = "Show", value = true },
  { name = "Reshape", value = true, only = "desktop" },
  { name = "Clear", value = true },
  { name = "From_list", value = true },
  { name = "Variance", value = true },
  { name = "ArcSin", value = true },
  { name = "ArcCos", value = true },
  { name = "ArcTan", value = true },
  { name = "Ln", value = true },
  { name = "Neg", value = true },
  { name = "Sub", value = true },
  { name = "Mul", value = true },
  { name = "Div", value = true },
  { name = "Pow", value = true },
  { name = "Fmod", value = true },
  { name = "Clamp", value = true },
  { name = "Flip", value = true },
  { name = "Concatenate", value = true },
  { name = "Random", value = true },
  { name = "Random_normal", value = true },
  { name = "Normal", value = true },
  { name = "Random_uniform", value = true },
  { name = "Create", only = "web" },
  { name = "New", only = "web" },
  { name = "Init", only = "web" },
  { name = "Set", only = "web" },
  { name = "SetValue", only = "web" },
  { name = "SetItem", only = "web" },
  { name = "Get", only = "web" },
  { name = "GetValue", only = "web" },
  { name = "GetItem", only = "web" },
  { name = "At", value = true, only = "web" },
  { name = "Push", only = "web" },
]
events = []

[[component]]
name = "RDATAFRAME"
visual = false
doc = "A table of named columns in pandas' style: read CSV or JSON, select, filter, sort, group and join, compute statistics, show it in a grid. RapidR's own."
properties = [
  { name = "RowCount", type = "int" },
  { name = "Height", type = "int" },
  { name = "Nrows", type = "int" },
  { name = "ColCount", type = "int" },
  { name = "Width", type = "int" },
  { name = "Ncols", type = "int" },
  { name = "Columns", type = "string" },
  { name = "Shape", type = "string" },
  { name = "Empty", type = "int" },
]
methods = [
  { name = "LoadFromCSV", params = "filename", value = true, doc = "Loads a CSV file into the DataFrame. Auto-resolves paths relative to project." },
  { name = "ReadCSV", params = "filename", value = true, doc = "Alias for loadfromcsv." },
  { name = "SaveToCSV", params = "filename", value = true, only = "desktop", doc = "Saves the DataFrame to a CSV file." },
  { name = "LoadFromJSON", params = "filename", value = true, only = "desktop", doc = "Loads a JSON file into the DataFrame." },
  { name = "SaveToJSON", params = "filename", value = true, only = "desktop", doc = "Saves the DataFrame to a JSON file." },
  { name = "Head", params = "[n]", value = true, doc = "Returns the first n rows as a string (default 5)." },
  { name = "Tail", params = "[n]", value = true, doc = "Returns the last n rows as a string (default 5)." },
  { name = "Cell", params = "col, row", doc = "Returns cell value by column and row indices." },
  { name = "CellByName", params = "row, columnName", value = true, doc = "Returns cell value by row index and column name." },
  { name = "At", value = true },
  { name = "SetCell", params = "col, row, value", value = true, doc = "Sets a cell value by column and row indices. Auto-expands rows as needed." },
  { name = "Iloc", params = "row", value = true, only = "desktop", doc = "Returns an entire row as comma-separated string." },
  { name = "Select", params = "col1, col2 ...", value = true, doc = "Selects specified columns into a new DataFrame." },
  { name = "Sort", params = "column, [ascending]", value = true, doc = "Sorts by column. ascending: 1 (default) or 0." },
  { name = "Sort_values", params = "column, [ascending]", value = true, only = "desktop", doc = "Alias for sort with Pandas naming." },
  { name = "Filter", params = "column, operator, value", value = true, doc = "Filters rows. Operators: >, <, >=, <=, =, !=, contains." },
  { name = "Query", params = "expression", only = "desktop", doc = "Filters using a query expression string." },
  { name = "GroupBy", params = "column, aggColumn, aggFunc", value = true, only = "desktop", doc = "Groups by column, aggregates aggColumn with aggFunc (mean/sum/count/min/max/first/last)." },
  { name = "Drop", params = "column", value = true, doc = "Removes a column from the DataFrame." },
  { name = "Rename", params = "oldName, newName", value = true, doc = "Renames a column." },
  { name = "AddColumn", params = "name, values", value = true, doc = "Adds a column with comma-separated values." },
  { name = "Fillna", params = "value", value = true, doc = "Fills null/missing values with the given value." },
  { name = "Dropna", value = true, doc = "Removes rows containing null values." },
  { name = "Describe", value = true, doc = "Returns statistical summary (count, mean, std, min, max, etc.)." },
  { name = "Value_counts", params = "column", value = true, only = "desktop", doc = "Returns frequency counts for a column." },
  { name = "Nunique", params = "column", value = true, only = "desktop", doc = "Returns number of unique values in a column." },
  { name = "Corr", params = "col1, col2", value = true, only = "desktop", doc = "Returns Pearson correlation coefficient between two columns." },
  { name = "Sample", params = "n", value = true, doc = "Returns n random rows." },
  { name = "Nlargest", params = "n, column", value = true, only = "desktop", doc = "Returns n largest rows by column value." },
  { name = "Nsmallest", params = "n, column", value = true, only = "desktop", doc = "Returns n smallest rows by column value." },
  { name = "Info", value = true, doc = "Prints DataFrame info: columns, types, non-null counts." },
  { name = "Dtypes", value = true, only = "desktop", doc = "Returns column data types." },
  { name = "Merge", params = "otherDf, onColumn, [how]", value = true, only = "desktop", doc = "Joins with another DataFrame. how: inner (default), left, right, outer, cross." },
  { name = "Join", value = true, only = "desktop" },
  { name = "Concat", params = "otherDf", value = true, only = "desktop", doc = "Vertically concatenates another DataFrame." },
  { name = "Transpose", value = true, doc = "Transposes rows and columns." },
  { name = "Apply", params = "column, function", value = true, only = "desktop", doc = "Applies a transform to a column: upper, lower, abs, round, sqrt, log." },
  { name = "Replace", params = "column, oldValue, newValue", value = true, only = "desktop", doc = "Replaces values in a column." },
  { name = "Clear", value = true },
  { name = "Rows" },
  { name = "ToString", value = true },
  { name = "Show", value = true },
  { name = "Print", value = true },
  { name = "ToGrid", params = "gridName", value = true, doc = "Populates an RStringGrid with the DataFrame contents." },
  { name = "Read_csv", params = "filename", value = true },
  { name = "To_csv", params = "filename", value = true, only = "desktop" },
  { name = "WriteCSV", params = "filename", value = true, only = "desktop" },
  { name = "Read_json", params = "filename", value = true, only = "desktop" },
  { name = "To_json", params = "filename", value = true, only = "desktop" },
  { name = "Group_by", value = true, only = "desktop" },
  { name = "Drop_column", value = true },
  { name = "Rename_column", value = true },
  { name = "Add_column", value = true },
  { name = "Set_column", value = true },
  { name = "Fill_null", value = true },
  { name = "Drop_nulls", value = true },
  { name = "Correlation", value = true, only = "desktop" },
  { name = "Append", value = true, only = "desktop" },
  { name = "T" },
  { name = "Len" },
  { name = "To_grid", value = true },
  { name = "Display", value = true },
  { name = "Create", only = "web" },
  { name = "New", only = "web" },
  { name = "Init", only = "web" },
  { name = "AddRow", value = true, only = "web" },
  { name = "Add_row", only = "web" },
  { name = "AppendRow", only = "web" },
  { name = "Push_row", only = "web" },
]
events = []

[[component]]
name = "RPLOT"
visual = true
size = [640, 480]
sets = ["layout", "a11y", "generic"]
doc = "A chart in Matplotlib's style: line, bar, scatter, area, histogram and pie plots with labels, legends and notes, on a form or saved as a picture. RapidR's own."
properties = [
  { name = "Title", type = "string" },
  { name = "XLabel", type = "string" },
  { name = "YLabel", type = "string" },
  { name = "Width", type = "int" },
  { name = "Height", type = "int" },
  { name = "Grid", type = "int" },
  { name = "Dpi", type = "int", only = "desktop" },
  { name = "Hint", type = "string", only = "web" },
  { name = "Left", type = "int", only = "web" },
  { name = "Top", type = "int", only = "web" },
  { name = "Visible", type = "int", only = "web" },
  { name = "Parent", type = "component", kinds = ["QFORM"], design = false, only = "web" },
  { name = "Align", type = "enum", values = ["alNone", "alTop", "alBottom", "alLeft", "alRight", "alClient"], only = "web" },
]
methods = [
  { name = "Clear", value = true, doc = "Clears all series, annotations and resets the plot." },
  { name = "Plot", params = "xData, yData, [color], [label]", value = true, doc = "Draws a line plot. xData/yData are comma-separated strings." },
  { name = "Bar", params = "labels, values, [color], [label]", value = true, doc = "Draws a vertical bar chart." },
  { name = "Barh", params = "labels, values, [color], [label]", value = true, doc = "Draws a horizontal bar chart." },
  { name = "Scatter", params = "xData, yData, [color], [label]", value = true, doc = "Draws a scatter plot." },
  { name = "Step", params = "xData, yData, [color], [label]", value = true, doc = "Draws a step plot." },
  { name = "Area", params = "xData, yData, [color], [label]", value = true, doc = "Draws a filled area chart." },
  { name = "Fill_between", value = true },
  { name = "Hist", params = "data, [bins], [color], [label]", value = true, doc = "Draws a histogram. Default 10 bins." },
  { name = "Pie", params = "labels, values, [colors]", value = true, doc = "Draws a pie chart." },
  { name = "Hline", params = "y, [color], [label]", value = true, doc = "Draws a horizontal reference line at y." },
  { name = "Axhline", value = true },
  { name = "Vline", params = "x, [color], [label]", value = true, doc = "Draws a vertical reference line at x." },
  { name = "Axvline", value = true },
  { name = "Annotate", params = "text, x, y, [color]", value = true, doc = "Places text annotation at (x,y)." },
  { name = "Legend", params = "[position]", value = true, doc = "Enables legend display. Position: \"top-right\" (default)." },
  { name = "SaveFig", params = "filename", value = true, doc = "Renders and saves the plot to a PNG file." },
  { name = "Save", value = true },
  { name = "Figsize", params = "width, height, [dpi]", value = true, doc = "Sets figure dimensions in pixels and optional DPI." },
  { name = "Xlim", params = "min, max", value = true, doc = "Sets the X axis range." },
  { name = "Ylim", params = "min, max", value = true, doc = "Sets the Y axis range." },
  { name = "Xscale", params = "type", value = true, only = "desktop", doc = "Sets X axis scale: \"linear\" or \"log\"." },
  { name = "Yscale", params = "type", value = true, only = "desktop", doc = "Sets Y axis scale: \"linear\" or \"log\"." },
  { name = "Render", only = "web" },
  { name = "Histogram", value = true },
  { name = "Create", only = "web" },
  { name = "New", only = "web" },
  { name = "Init", only = "web" },
  { name = "SetTitle", only = "web" },
  { name = "Set_title", only = "web" },
  { name = "SetXLabel", only = "web" },
  { name = "Set_xlabel", only = "web" },
  { name = "SetYLabel", only = "web" },
  { name = "Set_ylabel", only = "web" },
  { name = "AddSeries", only = "web" },
  { name = "Add_series", only = "web" },
  { name = "Series", only = "web" },
  { name = "Show", value = true, only = "web" },
]
events = []
