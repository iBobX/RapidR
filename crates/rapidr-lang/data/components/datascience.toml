# Data science: the registry's components (crates/rapidr-lang; src/lib.rs says how to edit).
group = "Data science"

[[component]]
name = "RNUM"
display = "Num"
visual = false
doc = "A numeric array in NumPy's style: make ranges, zeros or lists, then sum, average, sort, compute element-wise and do linear algebra on them. RapidR's own."
properties = [
  { name = "Size", type = "int", access = "read", design = false },
  { name = "Length", type = "int", access = "read", design = false },
  { name = "Len", type = "int", access = "read", design = false },
  { name = "Data", type = "string" },
  { name = "Shape", type = "string", access = "read", design = false },
  { name = "NDim", type = "int", access = "read", design = false },
  { name = "DType", type = "string", access = "read", design = false },
]
methods = [
  { name = "Create", params = "[n]", doc = "Makes the array n zeros (empty without n)." },
  { name = "New" },
  { name = "Init" },
  { name = "Arange", params = "start, stop, [stepSize]", value = true, doc = "Evenly spaced values from `start` up to, not including, `stop`, `stepSize` apart (default 1; may be negative).", example = "DIM a AS RNum\nstart = 2\nstop = 8\nstepSize = 2\na.Arange start, stop, stepSize\nPRINT a.ToString", expect = "2,4,6" },
  { name = "LinSpace", params = "start, stop, [num]", value = true, doc = "num evenly spaced values from start to stop, both included (default 50).", example = "DIM a AS RNum\nstart = 0\nstop = 10\nnum = 5\na.LinSpace start, stop, num\nPRINT a.ToString", expect = "0,2.5,5,7.5,10" },
  { name = "Zeros", params = "[n]", value = true, doc = "n zeros." },
  { name = "Ones", params = "[n]", value = true, doc = "n ones." },
  { name = "Full", params = "n, fillValue", value = true, doc = "n elements of fillValue.", example = "DIM a AS RNum\nn = 3\nfillValue = 7\na.Full n, fillValue\nPRINT a.ToString", expect = "7,7,7" },
  { name = "FromList", params = "list", value = true, doc = "The numbers of a comma-separated list, given as ONE text: `a.FromList \"5,6,7\"`.", example = "DIM a AS RNum\nDIM list AS STRING = \"5,6,7\"\na.FromList list\nPRINT a.ToString", expect = "5,6,7" },
  { name = "From_list", params = "list", value = true },
  { name = "Set", params = "index, value", doc = "Sets element index (from 0); past the end the array grows with zeros.", example = "DIM a AS RNum\na.Zeros 3\nindex = 1\nvalue = 9\na.Set index, value\nPRINT a.ToString", expect = "0,9,0" },
  { name = "SetValue", params = "index, value", example = "DIM a AS RNum\na.Zeros 3\nindex = 1\nvalue = 9\na.SetValue index, value\nPRINT a.ToString", expect = "0,9,0" },
  { name = "SetItem", params = "index, value", example = "DIM a AS RNum\na.Zeros 3\nindex = 1\nvalue = 9\na.SetItem index, value\nPRINT a.ToString", expect = "0,9,0" },
  { name = "Get", params = "index", doc = "Element index (from 0); 0 past the end." },
  { name = "GetValue", params = "index" },
  { name = "GetItem", params = "index" },
  { name = "At", params = "index", value = true },
  { name = "Push", params = "value", doc = "Adds value at the end." },
  { name = "Sum", value = true, doc = "The sum of the elements." },
  { name = "Mean", value = true, doc = "The arithmetic mean." },
  { name = "Avg" },
  { name = "Average" },
  { name = "Min", value = true },
  { name = "Max", value = true },
  { name = "Std", value = true, doc = "The (population) standard deviation." },
  { name = "Var", value = true, doc = "The (population) variance." },
  { name = "Variance", value = true },
  { name = "Median", value = true, doc = "The median." },
  { name = "ArgMin", value = true, doc = "The index of the smallest element." },
  { name = "ArgMax", value = true, doc = "The index of the largest element." },
  { name = "Count", value = true, doc = "The number of elements." },
  { name = "Ptp", value = true, doc = "Peak to peak: max - min." },
  { name = "Sin", value = true },
  { name = "Cos", value = true },
  { name = "Tan", value = true },
  { name = "Asin", value = true },
  { name = "ArcSin", value = true },
  { name = "Acos", value = true },
  { name = "ArcCos", value = true },
  { name = "Atan", value = true },
  { name = "ArcTan", value = true },
  { name = "Sqrt", value = true },
  { name = "Abs", value = true },
  { name = "Exp", value = true },
  { name = "Log", value = true },
  { name = "Ln", value = true },
  { name = "Log2", value = true },
  { name = "Log10", value = true },
  { name = "Floor", value = true },
  { name = "Ceil", value = true },
  { name = "Round", params = "[decimals]", value = true, doc = "Rounds every element (default 0 decimals)." },
  { name = "Sign", value = true },
  { name = "Reciprocal", value = true },
  { name = "Square", value = true },
  { name = "Negative", value = true },
  { name = "Neg", value = true },
  { name = "Add", params = "value", doc = "Adds a number, or another array element by element (arrays of the same length)." },
  { name = "Subtract", params = "value", value = true, doc = "Subtracts a number or another array, element by element." },
  { name = "Sub", params = "value", value = true },
  { name = "Multiply", params = "value", value = true, doc = "Multiplies by a number or another array, element by element." },
  { name = "Mul", params = "value", value = true },
  { name = "Divide", params = "value", value = true, doc = "Divides by a number or another array, element by element (by 0: NAN)." },
  { name = "Div", params = "value", value = true },
  { name = "Power", params = "[exp]", value = true, doc = "Raises every element to a power (default 2)." },
  { name = "Pow", params = "[exp]", value = true },
  { name = "Mod", params = "divisor", value = true, doc = "The remainder of each element." },
  { name = "Fmod", params = "divisor", value = true },
  { name = "Clip", params = "low, high", value = true, doc = "Limits every element to [low, high].", example = "DIM a AS RNum\na.FromList \"1,5,9\"\nlow = 2\nhigh = 6\na.Clip low, high\nPRINT a.ToString", expect = "2,5,6" },
  { name = "Clamp", params = "low, high", value = true, example = "DIM a AS RNum\na.FromList \"1,5,9\"\nlow = 2\nhigh = 6\na.Clamp low, high\nPRINT a.ToString", expect = "2,5,6" },
  { name = "Sort", value = true },
  { name = "Reverse", value = true },
  { name = "Flip", value = true },
  { name = "Unique", value = true },
  { name = "Shuffle", value = true },
  { name = "Append", params = "values", value = true, doc = "Adds at the end another array, a comma-separated list in one text, or a number.", example = "DIM a AS RNum\na.FromList \"1,2\"\nDIM values AS STRING = \"3,4\"\na.Append values\na.Append 5\nPRINT a.ToString", expect = "1,2,3,4,5" },
  { name = "Concatenate", params = "values", value = true },
  { name = "Slice", params = "start, stop", value = true, doc = "Keeps the elements from index `start` up to, not including, `stop` (from 0).", example = "DIM a AS RNum\na.FromList \"10,20,30,40\"\nstart = 1\nstop = 3\na.Slice start, stop\nPRINT a.ToString", expect = "20,30" },
  { name = "Reshape", value = true },
  { name = "CumSum", value = true },
  { name = "CumProd", value = true },
  { name = "Diff", value = true },
  { name = "Dot", params = "otherArray", value = true, doc = "The dot product with another array." },
  { name = "Norm", value = true },
  { name = "Normalize", value = true },
  { name = "Any", value = true },
  { name = "All", value = true },
  { name = "Where" },
  { name = "Nonzero", value = true },
  { name = "SearchSorted", params = "value", value = true, doc = "Where value would go in the sorted array." },
  { name = "Rand", params = "[n]", value = true, doc = "n random values in [0, 1) (default 1)." },
  { name = "Random", params = "[n]", value = true },
  { name = "Randn", params = "n, [mean], [stddev]", value = true, doc = "n normally distributed random values, with the given `mean` (default 0) and standard deviation `stddev` (default 1).", example = "DIM a AS RNum\nn = 3\nmean = 5\nstddev = 0\na.Randn n, mean, stddev\nPRINT a.ToString", expect = "5,5,5" },
  { name = "Random_normal", params = "n, [mean], [stddev]", value = true, example = "DIM a AS RNum\nn = 3\nmean = 5\nstddev = 0\na.Random_normal n, mean, stddev\nPRINT a.ToString", expect = "5,5,5" },
  { name = "Normal", params = "n, [mean], [stddev]", value = true, example = "DIM a AS RNum\nn = 3\nmean = 5\nstddev = 0\na.Normal n, mean, stddev\nPRINT a.ToString", expect = "5,5,5" },
  { name = "Uniform", params = "low, high, n", value = true, doc = "n random values in [low, high).", example = "DIM a AS RNum\nlow = 2\nhigh = 2\nn = 4\na.Uniform low, high, n\nPRINT a.ToString", expect = "2,2,2,2" },
  { name = "Random_uniform", params = "low, high, n", value = true, example = "DIM a AS RNum\nlow = 2\nhigh = 2\nn = 4\na.Random_uniform low, high, n\nPRINT a.ToString", expect = "2,2,2,2" },
  { name = "Randint", params = "low, high, n", value = true, doc = "n random whole numbers from low to high, both included.", example = "DIM a AS RNum\nlow = 7\nhigh = 7\nn = 4\na.Randint low, high, n\nPRINT a.ToString", expect = "7,7,7,7" },
  { name = "Choice", params = "[n]", value = true, doc = "One element at random (returned), or the array becomes n of them." },
  { name = "ToList", value = true, doc = "The elements as \"1,2,3\"." },
  { name = "ToString", value = true },
  { name = "Print", value = true, doc = "Prints the array as [1, 2, 3]." },
  { name = "Show", value = true },
  { name = "Clear", value = true },
]
events = []

[[component]]
name = "RDATAFRAME"
display = "DataFrame"
visual = false
doc = "A table of named columns in pandas' style: read CSV or JSON, select, filter, sort, group and join, compute statistics, show it in a grid. Point its Source at an RCSV, an RJSON or another RDataFrame and it takes their rows — at design time too. RapidR's own."
properties = [
  { name = "Source", type = "component", kinds = ["RCSV", "RJSON", "RDATAFRAME"], category = "Data", doc = "Where the frame's rows come from: an RCSV, an RJSON (its records) or another RDataFrame. The frame gets a copy of them at once, and again whenever the source changes (a new FileName, Load); Refresh asks again. What you do to the frame afterwards (Filter, Sort …) changes only the frame, until the source changes." },
  { name = "Height", type = "int", access = "read", design = false },
  { name = "Nrows", type = "int", access = "read", design = false },
  { name = "ColCount", type = "int", access = "read", design = false },
  { name = "Width", type = "int", access = "read", design = false },
  { name = "Ncols", type = "int", access = "read", design = false },
  { name = "Empty", type = "int", access = "read", design = false },
  { name = "Error", type = "string", default = "", access = "read", design = false, doc = "Why the last LoadFromCSV, SaveToCSV, LoadFromJSON or SaveToJSON couldn't read or write its file, in plain words (\"staff_edited.csv: this folder can't be written (it is read-only, or not yours)\"); \"\" when it could. Check it after a save to tell the user." },
]
methods = [
  { name = "Create", doc = "Makes the frame empty." },
  { name = "New" },
  { name = "Init" },
  { name = "AddRow", params = "v1, v2 ...", value = true, doc = "Adds a row (columns column_1, ... if the frame has fewer).", example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nDIM v1 AS STRING = \"Di\"\nv2 = 41\nDIM v3 AS STRING = \"Oslo\"\nd.AddRow v1, v2, v3\nPRINT d.Nrows; \"|\"; d.Cell(3, 0); \"|\"; d.Cell(3, 1)", expect = "4|Di|41" },
  { name = "Add_row", params = "v1, v2 ..." },
  { name = "AppendRow", params = "v1, v2 ..." },
  { name = "Push_row", params = "v1, v2 ..." },
  { name = "LoadFromCSV", params = "filename", value = true, doc = "Reads CSV (the first line the header) from a file, or the CSV text itself." },
  { name = "ReadCSV", params = "filename", value = true, doc = "The same as loadfromcsv." },
  { name = "Read_csv", params = "filename", value = true },
  { name = "SaveToCSV", params = "[filename]", value = true, doc = "Writes the frame as CSV (default output.csv)." },
  { name = "To_csv", params = "[filename]", value = true },
  { name = "WriteCSV", params = "[filename]", value = true },
  { name = "LoadFromJSON", params = "filename", value = true, doc = "Reads JSON records ([{...}, ...]), JSON Lines or columns ({\"a\": [...]})." },
  { name = "Read_json", params = "filename", value = true },
  { name = "SaveToJSON", params = "[filename]", value = true, doc = "Writes the frame as an array of JSON records (default output.json)." },
  { name = "To_json", params = "[filename]", value = true },
  { name = "Head", params = "[n]", value = true, doc = "Keeps the first n rows (default 5).", example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nn = 2\nd.Head n\nPRINT d.Nrows; \"|\"; d.Cell(1, 0)", expect = "2|Bob" },
  { name = "Tail", params = "[n]", value = true, doc = "Keeps the last n rows (default 5).", example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nn = 2\nd.Tail n\nPRINT d.Nrows; \"|\"; d.Cell(0, 0)", expect = "2|Bob" },
  { name = "Cell", params = "row, col", doc = "The text of a cell (row: from 0, the first data row; col: an index from 0, or a column name); \"\" for a missing value. The row comes first: `Frame.Cell(2, 0)` is the third row's first column.", example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nrow = 1\ncol = 0\nPRINT d.Cell(row, col); \"|\"; d.Cell(2, \"city\")", expect = "Bob|Rome" },
  { name = "CellByName", params = "row, columnName", value = true, doc = "The text of a cell by its column name.", example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nrow = 1\nDIM columnName AS STRING = \"age\"\nPRINT d.CellByName(row, columnName)", expect = "25" },
  { name = "At", params = "row, columnName", value = true, example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nrow = 1\nDIM columnName AS STRING = \"age\"\nPRINT d.At(row, columnName)", expect = "25" },
  { name = "SetCell", params = "row, col, value", value = true, doc = "Sets a cell (row from 0; col: an index or a name); past the end the frame grows. The row comes first, as in Cell.", example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nrow = 2\ncol = 0\nDIM value AS STRING = \"Cyrus\"\nd.SetCell row, col, value\nPRINT d.Cell(2, 0); \"|\"; d.Cell(0, 2)", expect = "Cyrus|Rome" },
  { name = "Iloc", params = "start, [stop]", value = true, doc = "Keeps the rows from index `start` up to, not including, `stop` (rows count from 0; without `stop`, through the last row): `Iloc 1, 3` keeps the second and third rows, two rows.", example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nstart = 1\nstop = 3\nd.Iloc start, stop\nPRINT d.Nrows; \"|\"; d.Cell(0, 0)", expect = "2|Bob" },
  { name = "Select", params = "columns", value = true, doc = "Keeps those columns, in that order. The names are ONE text, separated by commas: `Select \"name,city\"`, not one argument each.", example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nDIM columns AS STRING = \"city,name\"\nd.Select columns\nPRINT d.Columns; \"|\"; d.Cell(0, 0)", expect = "city,name|Rome" },
  { name = "Sort", params = "columns, [ascending]", value = true, doc = "Sorts by one column, or several (their names in one text, separated by commas); `ascending` is 1 (the default) or 0 for descending. Numbers sort as numbers, missing values last.", example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nDIM columns AS STRING = \"age\"\nascending = 0\nd.Sort columns, ascending\nPRINT d.Cell(0, 0)", expect = "Cy" },
  { name = "Sort_values", params = "columns, [ascending]", value = true, doc = "The same as sort.", example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nDIM columns AS STRING = \"age\"\nascending = 1\nd.Sort_values columns, ascending\nPRINT d.Cell(0, 0)", expect = "Bob" },
  { name = "Filter", params = "column, operator, value", value = true, doc = "Keeps the rows that pass: =, ==, <>, !=, >, <, >=, <=, contains, startswith, endswith.", example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nDIM column AS STRING = \"age\"\nDIM operator AS STRING = \">\"\nvalue = 28\nd.Filter column, operator, value\nPRINT d.Nrows; \"|\"; d.Cell(0, 0)", expect = "2|Ann" },
  { name = "Query", params = "expression", doc = "Filters with one condition: query \"age > 30\"." },
  { name = "GroupBy", params = "column, [aggFunc]", value = true, doc = "A row a group: groups by `column` and gives, for every other column, the aggregate `aggFunc`: mean (the default), sum, count, min, max, first, last, median or std. The groups come in order of their value.", example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nDIM column AS STRING = \"city\"\nDIM aggFunc AS STRING = \"sum\"\nd.GroupBy column, aggFunc\nPRINT d.Nrows; \"|\"; d.Cell(0, 0); \"|\"; d.Cell(1, 2)", expect = "2|Oslo|65" },
  { name = "Group_by", params = "column, [aggFunc]", value = true, example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nDIM column AS STRING = \"city\"\nDIM aggFunc AS STRING = \"sum\"\nd.Group_by column, aggFunc\nPRINT d.Nrows; \"|\"; d.Cell(0, 0); \"|\"; d.Cell(1, 2)", expect = "2|Oslo|65" },
  { name = "Drop", params = "column", value = true, doc = "Removes a column." },
  { name = "Drop_column", params = "column", value = true },
  { name = "Rename", params = "oldName, newName", value = true, doc = "Renames a column.", example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nDIM oldName AS STRING = \"age\"\nDIM newName AS STRING = \"years\"\nd.Rename oldName, newName\nPRINT d.Columns", expect = "name,years,city" },
  { name = "Rename_column", params = "oldName, newName", value = true, example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nDIM oldName AS STRING = \"age\"\nDIM newName AS STRING = \"years\"\nd.Rename_column oldName, newName\nPRINT d.Columns", expect = "name,years,city" },
  { name = "AddColumn", params = "name, values", value = true, doc = "Adds (or replaces) a column: its values are ONE text, separated by commas, one per row; a frame without rows gets one row with the value.", example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nDIM name AS STRING = \"country\"\nDIM values AS STRING = \"Italy,Norway,Italy\"\nd.AddColumn name, values\nPRINT d.Columns; \"|\"; d.Cell(1, 3)", expect = "name,age,city,country|Norway" },
  { name = "Add_column", params = "name, values", value = true, example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nDIM name AS STRING = \"country\"\nDIM values AS STRING = \"Italy,Norway,Italy\"\nd.Add_column name, values\nPRINT d.Columns; \"|\"; d.Cell(1, 3)", expect = "name,age,city,country|Norway" },
  { name = "Set_column", params = "name, values", value = true, example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nDIM name AS STRING = \"country\"\nDIM values AS STRING = \"Italy,Norway,Italy\"\nd.Set_column name, values\nPRINT d.Columns; \"|\"; d.Cell(1, 3)", expect = "name,age,city,country|Norway" },
  { name = "Fillna", params = "[value]", value = true, doc = "Missing values become value (default \"0\")." },
  { name = "Fill_null", params = "[value]", value = true },
  { name = "Dropna", value = true, doc = "Removes the rows with a missing value." },
  { name = "Drop_nulls", value = true },
  { name = "Describe", value = true, doc = "The frame becomes the summary of its numeric columns: count, mean, std, min, 25%, 50%, 75%, max." },
  { name = "Value_counts", params = "column", value = true, doc = "The frame becomes each value of the column and its count, most first." },
  { name = "Nunique", params = "column", value = true, doc = "How many different values the column has." },
  { name = "Corr", params = "col1, col2", value = true, doc = "Pearson's correlation of two columns.", example = "DIM d AS RDataFrame\nd.LoadFromCSV \"x,y\" + CHR$(10) + \"1,3\" + CHR$(10) + \"2,2\" + CHR$(10) + \"3,1\"\nDIM col1 AS STRING = \"x\"\nDIM col2 AS STRING = \"y\"\nPRINT d.Corr(col1, col2)", expect = "-1.000000000" },
  { name = "Correlation", params = "col1, col2", value = true, example = "DIM d AS RDataFrame\nd.LoadFromCSV \"x,y\" + CHR$(10) + \"1,3\" + CHR$(10) + \"2,2\" + CHR$(10) + \"3,1\"\nDIM col1 AS STRING = \"x\"\nDIM col2 AS STRING = \"y\"\nPRINT d.Correlation(col1, col2)", expect = "-1.000000000" },
  { name = "Sample", params = "[n]", value = true, doc = "Keeps n rows at random (default 5)." },
  { name = "Nlargest", params = "column, [n]", value = true, doc = "Keeps the `n` rows with the largest values in `column` (default 5), largest first.", example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nDIM column AS STRING = \"age\"\nn = 1\nd.Nlargest column, n\nPRINT d.Nrows; \"|\"; d.Cell(0, 0)", expect = "1|Cy" },
  { name = "Nsmallest", params = "column, [n]", value = true, doc = "Keeps the `n` rows with the smallest values in `column` (default 5), smallest first.", example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nDIM column AS STRING = \"age\"\nn = 2\nd.Nsmallest column, n\nPRINT d.Nrows; \"|\"; d.Cell(0, 0)", expect = "2|Bob" },
  { name = "Info", value = true, doc = "Prints the size and each column's type and non-null count." },
  { name = "Dtypes", value = true, doc = "The columns' types: \"name: str,age: i64\"." },
  { name = "Shape", value = true },
  { name = "Merge", params = "otherDf, onColumn, [how]", value = true, doc = "Joins another frame on a column: inner (default), left, right, outer, cross.", example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nDIM otherDf AS RDataFrame\notherDf.LoadFromCSV \"city,country\" + CHR$(10) + \"Rome,Italy\" + CHR$(10) + \"Oslo,Norway\"\nDIM onColumn AS STRING = \"city\"\nd.Merge otherDf, onColumn\nPRINT d.Columns; \"|\"; d.Nrows; \"|\"; d.Cell(1, 3)", expect = "name,age,city,country|3|Norway" },
  { name = "Join", params = "otherDf, onColumn, [how]", value = true, example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nDIM otherDf AS RDataFrame\notherDf.LoadFromCSV \"city,country\" + CHR$(10) + \"Rome,Italy\" + CHR$(10) + \"Oslo,Norway\"\nDIM onColumn AS STRING = \"city\"\nd.Join otherDf, onColumn\nPRINT d.Columns; \"|\"; d.Nrows; \"|\"; d.Cell(1, 3)", expect = "name,age,city,country|3|Norway" },
  { name = "Concat", params = "otherDf", value = true, doc = "Adds another frame's rows (columns matched by name)." },
  { name = "Append", params = "otherDf", value = true },
  { name = "Transpose", value = true, doc = "Columns become rows." },
  { name = "T" },
  { name = "Apply", params = "column, operation, [decimals]", value = true, doc = "Transforms a column with an `operation`: upper, lower, trim, abs, round, sqrt, log or exp. `round` takes the number of `decimals` (default 2).", example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nDIM column AS STRING = \"name\"\nDIM operation AS STRING = \"upper\"\nd.Apply column, operation\nPRINT d.Cell(0, 0)", expect = "ANN" },
  { name = "Replace", params = "column, oldValue, newValue", value = true, doc = "Cells that are oldValue become newValue.", example = "DIM d AS RDataFrame\nd.LoadFromCSV \"name,age,city\" + CHR$(10) + \"Ann,30,Rome\" + CHR$(10) + \"Bob,25,Oslo\" + CHR$(10) + \"Cy,35,Rome\"\nDIM column AS STRING = \"city\"\nDIM oldValue AS STRING = \"Rome\"\nDIM newValue AS STRING = \"Roma\"\nd.Replace column, oldValue, newValue\nPRINT d.Cell(0, 2)", expect = "Roma" },
  { name = "Clear", value = true },
  { name = "Columns", value = true },
  { name = "Rows" },
  { name = "RowCount" },
  { name = "Len" },
  { name = "ToString", value = true, doc = "The frame as a text table." },
  { name = "Show", value = true },
  { name = "Print", value = true, doc = "Prints the frame as a text table." },
  { name = "ToGrid", params = "gridName", value = true, doc = "Fills an RStringGrid: the header row, then the cells." },
  { name = "To_grid", value = true },
  { name = "Display", value = true },
  { name = "Refresh", value = true, doc = "Takes the rows of its Source again (its file read again when it is an RCSV)." },
]
events = []

[[component]]
name = "RCSV"
display = "CSV"
visual = false
default_event = "OnLoad"
doc = "A CSV file as a data source: set FileName and its table is ready — show it in an RDBGrid (DataSource = it), give its rows to an RDataFrame (Source = it), or bind edits and labels to it. Any delimiter, with or without a header line; read when first needed, at design time too. RapidR's own."
properties = [
  { name = "FileName", type = "string", default = "", category = "Data", editor = "file", doc = "The CSV file (a path, or a name next to the program), or a `$RESOURCE`'s name: the file built into the program, so it runs from anywhere (RapidR Studio's designer reads the file the `$RESOURCE` names). Setting it reads the file again when its table is next needed." },
  { name = "Delimiter", type = "string", default = ",", category = "Data", doc = "What separates the fields: \",\" (the default), \";\", a tab (\"tab\" or CHR$(9)), \"|\" …" },
  { name = "HasHeader", type = "bool", default = true, category = "Data", doc = "True: the first line names the columns. False: every line is a row and the columns are column_1, column_2 …" },
  { name = "Text", type = "string", category = "Data", design = false, doc = "The table as CSV text; setting it gives the data itself instead of a file." },
  { name = "RowCount", type = "int", default = 0, access = "read", design = false, doc = "How many rows the table has." },
  { name = "ColCount", type = "int", default = 0, access = "read", design = false, doc = "How many columns the table has." },
  { name = "Columns", type = "string", default = "", access = "read", design = false, doc = "The columns' names: \"name,age,city\"." },
  { name = "Error", type = "string", default = "", access = "read", design = false, doc = "Why the file couldn't be read (\"\" when it could)." },
]
methods = [
  { name = "Load", value = true, returns = "INTEGER", doc = "Reads the file again now: 1 if it could, 0 if not (Error and OnError say why)." },
  { name = "Save", params = "[fileName AS STRING]", value = true, returns = "INTEGER", doc = "Writes the table (with its edits) to its FileName, or to fileName: 1 if it could, 0 if not." },
  { name = "Clear", value = true, doc = "Forgets the file and the table." },
]
events = [
  { name = "OnLoad", doc = "The file was read." },
  { name = "OnError", params = "Message AS STRING", doc = "The file couldn't be read or written; Message says why." },
]

[[component]]
name = "RDATASOURCE"
display = "DataSource"
visual = false
default_event = "OnDataChange"
doc = "The current row of a data set (an RDataFrame, an RCSV, an RJSON), shared by the controls bound to it: grids, edits and labels with DataSource = it follow it as it moves. First, Next, Prior, Last and Row move it; Field reads the current row. RapidR's own."
properties = [
  { name = "DataSet", type = "component", kinds = ["RDATAFRAME", "RCSV", "RJSON"], category = "Data", doc = "The data set whose rows it walks." },
  { name = "Row", type = "int", default = 0, category = "Data", design = false, doc = "The current row, from 0; set it to move there." },
  { name = "RecordCount", type = "int", default = 0, access = "read", design = false, doc = "How many rows the data set has." },
  { name = "EOF", type = "bool", access = "read", design = false, doc = "True (-1) after Next couldn't move past the last row (or after Last), or when there are no rows: `WHILE NOT DS.EOF … DS.Next WEND` walks every row." },
  { name = "BOF", type = "bool", access = "read", design = false, doc = "True (-1) after First, or after Prior couldn't move before the first row, or when there are no rows." },
  { name = "Enabled", type = "bool", default = true, category = "Data", doc = "False: the bound controls stop following it." },
  { name = "State", type = "string", default = "inactive", access = "read", design = false, doc = "\"inactive\" (no DataSet, or not Enabled) or \"browse\"." },
]
methods = [
  { name = "First", value = true, doc = "Moves to the first row." },
  { name = "Next", value = true, doc = "Moves to the next row (EOF becomes True at the end)." },
  { name = "Prior", value = true, doc = "Moves to the row before (BOF becomes True at the start)." },
  { name = "Last", value = true, doc = "Moves to the last row." },
  { name = "MoveBy", params = "rows AS INTEGER", doc = "Moves that many rows (negative: back)." },
  { name = "Field", params = "name AS STRING", returns = "STRING", doc = "The current row's value in that column (\"\" for a missing value)." },
  { name = "SetField", params = "name AS STRING, value AS STRING", doc = "Changes the current row's value in that column (in the data set's table; its Save writes it out)." },
  { name = "Refresh", value = true, doc = "Reads the data set again from where its rows come from." },
]
events = [
  { name = "OnDataChange", doc = "The current row moved, or the data changed." },
]

[[component]]
name = "RDBGRID"
display = "DBGrid"
visual = true
size = [320, 160]
default_event = "OnCellClick"
sets = ["layout", "a11y"]
doc = "A grid that shows a data set straight from its table — an RDataSource, an RDataFrame, an RCSV, an RJSON, or an RSQLite's or RMySQL's last query (a background query's rows as they arrive) — drawing only the rows on screen, so a million rows scroll smoothly. A click or the arrows move the current row (bound edits follow); Ctrl+C copies it. A click on a heading sorts the view by that column (again: descending, a third time: back), the data itself unchanged; a database's rows are sorted by the program: on OnTitleClick it asks again with ORDER BY, SortColumn and SortDescending saying what was clicked. RapidR's own."
properties = [
  { name = "DataSource", type = "component", kinds = ["RDATASOURCE", "RDATAFRAME", "RCSV", "RJSON", "RSQLITE", "RMYSQL"], category = "Data", doc = "What it shows: an RDataSource (it follows that current row), a data set straight, or a database component's last query (its rows as a background query brings them)." },
  { name = "ReadOnly", type = "bool", default = true, category = "Data", doc = "True: the cells are shown, not edited (editing in the grid comes later; edit through bound REdits)." },
  { name = "Row", type = "int", default = 0, design = false, doc = "The current row (a row of the data, from 0); set it to move there." },
  { name = "TopRow", type = "int", default = 0, design = false, doc = "The first row shown (in the grid's order)." },
  { name = "RowCount", type = "int", default = 0, access = "read", design = false, doc = "How many rows the data has." },
  { name = "ColCount", type = "int", default = 0, access = "read", design = false, doc = "How many columns the data has." },
  { name = "Columns", type = "string", default = "", access = "read", design = false, doc = "The columns' names: \"name,age,city\"." },
  { name = "SortColumn", type = "int", default = -1, access = "read", design = false, doc = "The column its view is sorted by (-1: none, the data's own order). Bound to a database component: the column the user asked for — the program sorts, asking again with ORDER BY." },
  { name = "SortDescending", type = "bool", default = false, access = "read", design = false, doc = "True: sorted highest first." },
  { name = "Align", type = "enum", values = ["alNone", "alTop", "alBottom", "alLeft", "alRight", "alClient"], default = "alNone" },
  { name = "Color", type = "color" },
  { name = "Enabled", type = "bool", default = true },
  { name = "Font", type = "font", access = "write", design = true },
  { name = "Height", type = "int" },
  { name = "Hint", type = "string" },
  { name = "Left", type = "int", default = 0 },
  { name = "Parent", type = "component", kinds = ["RFORM", "RPANEL", "RTABCONTROL"], access = "write", design = false },
  { name = "ShowHint", type = "bool", default = false },
  { name = "TabOrder", type = "int" },
  { name = "Tag", type = "int" },
  { name = "Top", type = "int", default = 0 },
  { name = "Visible", type = "bool", default = true },
  { name = "Width", type = "int" },
]
methods = [
  { name = "SetFocus", value = true },
  { name = "Repaint" },
]
events = [
  { name = "OnCellClick", params = "Row AS INTEGER, Col AS INTEGER", doc = "A cell was clicked: its data row and column (from 0)." },
  { name = "OnTitleClick", params = "Col AS INTEGER", doc = "A heading was clicked (the view is sorted by it; a database's rows: the program asks again with ORDER BY, SortColumn and SortDescending saying how)." },
  { name = "OnClick" },
  { name = "OnDblClick" },
  { name = "OnKeyDown", params = "Key AS WORD, Shift AS INTEGER" },
  { name = "OnKeyUp", params = "Key AS WORD, Shift AS INTEGER" },
  { name = "OnKeyPress", params = "Key AS BYTE" },
  { name = "OnEnter", origin = "rapidr" },
  { name = "OnExit", origin = "rapidr" },
]

[[component]]
name = "RPLOT"
display = "Plot"
visual = true
size = [640, 480]
sets = ["layout", "a11y"]
doc = "A chart in Matplotlib's style: line, bar, scatter, area, histogram and pie plots with labels, legends and notes, on a form (drawn crisp at any screen scale, the same on the desktop and the web) or saved as a picture. RapidR's own."
properties = [
  { name = "Title", type = "string" },
  { name = "XLabel", type = "string" },
  { name = "YLabel", type = "string" },
  { name = "Grid", type = "int" },
  { name = "Width", type = "int" },
  { name = "Height", type = "int" },
  { name = "Dpi", type = "int" },
  { name = "DataSource", type = "component", kinds = ["RDATASOURCE", "RDATAFRAME", "RCSV", "RJSON"], category = "Data", doc = "The data it charts: a data set (an RDataFrame, an RCSV, an RJSON) or an RDataSource's. Its rows are drawn as Kind says — X along the bottom, a series for each Y column — and drawn again whenever the data change (a filter, a sort, a file read again); RapidR Studio's designer shows them while you design. Empty: the chart is the one its methods (Bar, Plot …) draw." },
  { name = "Kind", type = "string", values = ["bar", "barh", "line", "scatter", "area", "step", "pie", "hist"], default = "bar", category = "Data", doc = "How DataSource's rows are drawn: \"bar\" (a bar for each row over its X name), \"barh\" (lying down), \"line\", \"scatter\", \"area\", \"step\" (over X's numbers, or its names), \"pie\" (X's names, Y's first column), \"hist\" (Y's values counted in 10 bins)." },
  { name = "X", type = "string", default = "", category = "Data", doc = "DataSource's column along the bottom: the names under bars and a pie's slices, the numbers a line runs over (\"Department\"). Empty: the first column." },
  { name = "Y", type = "string", default = "", category = "Data", doc = "DataSource's column(s) drawn, comma-separated, a series each in its own colour, with a legend when there are several (\"Salary\", \"Sales,Costs\"). Empty: every numeric column but X. At most the first 10,000 rows are drawn." },
  { name = "SeriesCount", type = "int", access = "read", design = false, doc = "How many series the plot has." },
  { name = "Count", type = "int", access = "read", design = false, doc = "How many series the plot has (SeriesCount)." },
]
methods = [
  { name = "Create" },
  { name = "New" },
  { name = "Init" },
  { name = "Clear", value = true, doc = "Removes every series and setting." },
  { name = "Plot", params = "xData, yData, [color], [label]", value = true, doc = "A line: x and y are RNum arrays (or \"1,2,3\"); style \"-\" (default), \"--\" dashed, \"o\" points." },
  { name = "Bar", params = "labels, values, [color], [label]", value = true, doc = "Vertical bars." },
  { name = "Barh", params = "labels, values, [color], [label]", value = true, doc = "Horizontal bars." },
  { name = "Scatter", params = "xData, yData, [color], [label]", value = true, doc = "Points." },
  { name = "Step", params = "xData, yData, [color], [label]", value = true, doc = "A step line." },
  { name = "Area", params = "xData, yData, [color], [label]", value = true, doc = "A filled area under the line." },
  { name = "Fill_between", value = true },
  { name = "AddSeries", params = "label, y1, y2 ..., [x1], [x2] ..., [color]", doc = "A line from numbers written in place, drawn at once where the chart shows." },
  { name = "Add_series" },
  { name = "Series" },
  { name = "Hist", params = "data, [bins], [color], [label]", value = true, doc = "A histogram (default 10 bins)." },
  { name = "Histogram", value = true },
  { name = "Pie", params = "labels, values, [colors]", value = true, doc = "A pie chart." },
  { name = "Hline", params = "y, [color], [label]", value = true, doc = "A horizontal reference line at y." },
  { name = "Axhline", value = true },
  { name = "Vline", params = "x, [color], [label]", value = true, doc = "A vertical reference line at x." },
  { name = "Axvline", value = true },
  { name = "Annotate", params = "text, x, y, [color]", value = true, doc = "Text at (x, y)." },
  { name = "Legend", params = "[position]", value = true, doc = "Shows the series labels." },
  { name = "SetTitle" },
  { name = "Set_title" },
  { name = "SetXLabel" },
  { name = "Set_xlabel" },
  { name = "SetYLabel" },
  { name = "Set_ylabel" },
  { name = "SaveFig", params = "filename", value = true, doc = "Draws the chart into a PNG file (on the web: one of the page's files, which the program can read back or offer as a download)." },
  { name = "Save", value = true },
  { name = "Render" },
  { name = "Show", value = true, doc = "Draws the chart again where it shows: an RPLOT on a form (a chart only saved or loaded into a picture has nowhere else to show)." },
  { name = "Figsize", params = "width, height, [dpi]", value = true, doc = "The size in inches at the chart's DPI." },
  { name = "Xlim", params = "min, max", value = true, doc = "The X axis range." },
  { name = "Ylim", params = "min, max", value = true, doc = "The Y axis range." },
  { name = "Xticks", params = "names, [positions]", doc = "Names the X axis' ticks (\"Jan,Feb,Mar\"), at positions, or at the first series' x values when there are as many, else at 0, 1, 2 …" },
  { name = "Xscale", params = "type", value = true, doc = "\"linear\" or \"log\" (kept with the chart; drawn linear)." },
  { name = "Yscale", params = "type", value = true, doc = "\"linear\" or \"log\" (kept with the chart; drawn linear)." },
]
events = []
