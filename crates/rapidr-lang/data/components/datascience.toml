# Data science: the registry's components (crates/rapidr-lang; src/lib.rs says how to edit).
group = "Data science"

[[component]]
name = "RNUM"
visual = false
doc = "A numeric array in NumPy's style: make ranges, zeros or lists, then sum, average, sort, compute element-wise and do linear algebra on them. RapidR's own."
properties = [
  { name = "Size", type = "int", access = "read", design = false },
  { name = "Length", type = "int", access = "read", design = false },
  { name = "Len", type = "int", access = "read", design = false },
  { name = "Data", type = "string" },
  { name = "Shape", type = "string", access = "read", design = false },
  { name = "NDim", type = "int", access = "read", design = false },
  { name = "DType", type = "string", access = "read", design = false },
]
methods = [
  { name = "Create", params = "[n]", doc = "Makes the array n zeros (empty without n)." },
  { name = "New" },
  { name = "Init" },
  { name = "Arange", params = "start, stop, [step]", value = true, doc = "Evenly spaced values in [start, stop) with the given step (default 1; may be negative)." },
  { name = "LinSpace", params = "start, stop, [num]", value = true, doc = "num evenly spaced values from start to stop, both included (default 50)." },
  { name = "Zeros", params = "n", value = true, doc = "n zeros." },
  { name = "Ones", params = "n", value = true, doc = "n ones." },
  { name = "Full", params = "n, fillValue", value = true, doc = "n elements of fillValue." },
  { name = "FromList", params = "v1, v2, v3 ...", value = true, doc = "The numbers of a comma-separated list." },
  { name = "From_list", value = true },
  { name = "Set", params = "index, value", doc = "Sets element index (from 0); past the end the array grows with zeros." },
  { name = "SetValue" },
  { name = "SetItem" },
  { name = "Get", params = "index", doc = "Element index (from 0); 0 past the end." },
  { name = "GetValue" },
  { name = "GetItem" },
  { name = "At", value = true },
  { name = "Push", params = "value", doc = "Adds value at the end." },
  { name = "Sum", value = true, doc = "The sum of the elements." },
  { name = "Mean", value = true, doc = "The arithmetic mean." },
  { name = "Avg" },
  { name = "Average" },
  { name = "Min", value = true },
  { name = "Max", value = true },
  { name = "Std", value = true, doc = "The (population) standard deviation." },
  { name = "Var", value = true, doc = "The (population) variance." },
  { name = "Variance", value = true },
  { name = "Median", value = true, doc = "The median." },
  { name = "ArgMin", value = true, doc = "The index of the smallest element." },
  { name = "ArgMax", value = true, doc = "The index of the largest element." },
  { name = "Count", value = true, doc = "The number of elements." },
  { name = "Ptp", value = true, doc = "Peak to peak: max - min." },
  { name = "Sin", value = true },
  { name = "Cos", value = true },
  { name = "Tan", value = true },
  { name = "Asin", value = true },
  { name = "ArcSin", value = true },
  { name = "Acos", value = true },
  { name = "ArcCos", value = true },
  { name = "Atan", value = true },
  { name = "ArcTan", value = true },
  { name = "Sqrt", value = true },
  { name = "Abs", value = true },
  { name = "Exp", value = true },
  { name = "Log", value = true },
  { name = "Ln", value = true },
  { name = "Log2", value = true },
  { name = "Log10", value = true },
  { name = "Floor", value = true },
  { name = "Ceil", value = true },
  { name = "Round", params = "[decimals]", value = true, doc = "Rounds every element (default 0 decimals)." },
  { name = "Sign", value = true },
  { name = "Reciprocal", value = true },
  { name = "Square", value = true },
  { name = "Negative", value = true },
  { name = "Neg", value = true },
  { name = "Add", params = "value", doc = "Adds a number, or another array element by element (arrays of the same length)." },
  { name = "Subtract", params = "value", value = true, doc = "Subtracts a number or another array, element by element." },
  { name = "Sub", value = true },
  { name = "Multiply", params = "value", value = true, doc = "Multiplies by a number or another array, element by element." },
  { name = "Mul", value = true },
  { name = "Divide", params = "value", value = true, doc = "Divides by a number or another array, element by element (by 0: NAN)." },
  { name = "Div", value = true },
  { name = "Power", params = "exp", value = true, doc = "Raises every element to a power (default 2)." },
  { name = "Pow", value = true },
  { name = "Mod", params = "divisor", value = true, doc = "The remainder of each element." },
  { name = "Fmod", value = true },
  { name = "Clip", params = "low, high", value = true, doc = "Limits every element to [low, high]." },
  { name = "Clamp", value = true },
  { name = "Sort", value = true },
  { name = "Reverse", value = true },
  { name = "Flip", value = true },
  { name = "Unique", value = true },
  { name = "Shuffle", value = true },
  { name = "Append", params = "v1, v2 ...", value = true, doc = "Adds another array, a list or a number at the end." },
  { name = "Concatenate", value = true },
  { name = "Slice", params = "start, end", value = true, doc = "Keeps the elements from start to end (not included)." },
  { name = "Reshape", value = true },
  { name = "CumSum", value = true },
  { name = "CumProd", value = true },
  { name = "Diff", value = true },
  { name = "Dot", params = "otherArray", value = true, doc = "The dot product with another array." },
  { name = "Norm", value = true },
  { name = "Normalize", value = true },
  { name = "Any", value = true },
  { name = "All", value = true },
  { name = "Where" },
  { name = "Nonzero", value = true },
  { name = "SearchSorted", params = "value", value = true, doc = "Where value would go in the sorted array." },
  { name = "Rand", params = "n", value = true, doc = "n random values in [0, 1) (default 1)." },
  { name = "Random", value = true },
  { name = "Randn", params = "n", value = true, doc = "n normally distributed values." },
  { name = "Random_normal", value = true },
  { name = "Normal", value = true },
  { name = "Uniform", params = "low, high, n", value = true, doc = "n random values in [low, high)." },
  { name = "Random_uniform", value = true },
  { name = "Randint", params = "low, high, n", value = true, doc = "n random whole numbers from low to high, both included." },
  { name = "Choice", params = "n", value = true, doc = "One element at random (returned), or the array becomes n of them." },
  { name = "ToList", value = true, doc = "The elements as \"1,2,3\"." },
  { name = "ToString", value = true },
  { name = "Print", value = true, doc = "Prints the array as [1, 2, 3]." },
  { name = "Show", value = true },
  { name = "Clear", value = true },
]
events = []

[[component]]
name = "RDATAFRAME"
visual = false
doc = "A table of named columns in pandas' style: read CSV or JSON, select, filter, sort, group and join, compute statistics, show it in a grid. RapidR's own."
properties = [
  { name = "Height", type = "int", access = "read", design = false },
  { name = "Nrows", type = "int", access = "read", design = false },
  { name = "ColCount", type = "int", access = "read", design = false },
  { name = "Width", type = "int", access = "read", design = false },
  { name = "Ncols", type = "int", access = "read", design = false },
  { name = "Empty", type = "int", access = "read", design = false },
]
methods = [
  { name = "Create", doc = "Makes the frame empty." },
  { name = "New" },
  { name = "Init" },
  { name = "AddRow", params = "v1, v2 ..., v2 ...", value = true, doc = "Adds a row (columns column_1, ... if the frame has fewer)." },
  { name = "Add_row" },
  { name = "AppendRow" },
  { name = "Push_row" },
  { name = "LoadFromCSV", params = "filename", value = true, doc = "Reads CSV (the first line the header) from a file, or the CSV text itself." },
  { name = "ReadCSV", params = "filename", value = true, doc = "The same as loadfromcsv." },
  { name = "Read_csv", params = "filename", value = true },
  { name = "SaveToCSV", params = "filename", value = true, doc = "Writes the frame as CSV (default output.csv)." },
  { name = "To_csv", params = "filename", value = true },
  { name = "WriteCSV", params = "filename", value = true },
  { name = "LoadFromJSON", params = "filename", value = true, doc = "Reads JSON records ([{...}, ...]), JSON Lines or columns ({\"a\": [...]})." },
  { name = "Read_json", params = "filename", value = true },
  { name = "SaveToJSON", params = "filename", value = true, doc = "Writes the frame as an array of JSON records (default output.json)." },
  { name = "To_json", params = "filename", value = true },
  { name = "Head", params = "[n]", value = true, doc = "Keeps the first n rows (default 5)." },
  { name = "Tail", params = "[n]", value = true, doc = "Keeps the last n rows (default 5)." },
  { name = "Cell", params = "col, row", doc = "The text of a cell (col: an index from 0, or a column name); \"\" for a missing value." },
  { name = "CellByName", params = "row, columnName", value = true, doc = "The text of a cell by its column name." },
  { name = "At", value = true },
  { name = "SetCell", params = "col, row, value", value = true, doc = "Sets a cell (col: an index or a name); past the end the frame grows." },
  { name = "Iloc", params = "row", value = true, doc = "Keeps rows start to end (not included)." },
  { name = "Select", params = "col1, col2 ...", value = true, doc = "Keeps those columns, in that order." },
  { name = "Sort", params = "column, [ascending]", value = true, doc = "Sorts by columns: 1 ascending (default), 0 descending; numbers as numbers, missing values last." },
  { name = "Sort_values", params = "column, [ascending]", value = true, doc = "The same as sort." },
  { name = "Filter", params = "column, operator, value", value = true, doc = "Keeps the rows that pass: =, ==, <>, !=, >, <, >=, <=, contains, startswith, endswith." },
  { name = "Query", params = "expression", doc = "Filters with one condition: query \"age > 30\"." },
  { name = "GroupBy", params = "column, aggColumn, aggFunc", value = true, doc = "A row a group: the column, then mean (default), sum, count, min, max, first, last, median or std of every other column." },
  { name = "Group_by", value = true },
  { name = "Drop", params = "column", value = true, doc = "Removes a column." },
  { name = "Drop_column", value = true },
  { name = "Rename", params = "oldName, newName", value = true, doc = "Renames a column." },
  { name = "Rename_column", value = true },
  { name = "AddColumn", params = "name, values", value = true, doc = "Adds (or replaces) a column; a frame without rows gets one a value." },
  { name = "Add_column", value = true },
  { name = "Set_column", value = true },
  { name = "Fillna", params = "value", value = true, doc = "Missing values become value (default \"0\")." },
  { name = "Fill_null", value = true },
  { name = "Dropna", value = true, doc = "Removes the rows with a missing value." },
  { name = "Drop_nulls", value = true },
  { name = "Describe", value = true, doc = "The frame becomes the summary of its numeric columns: count, mean, std, min, 25%, 50%, 75%, max." },
  { name = "Value_counts", params = "column", value = true, doc = "The frame becomes each value of the column and its count, most first." },
  { name = "Nunique", params = "column", value = true, doc = "How many different values the column has." },
  { name = "Corr", params = "col1, col2", value = true, doc = "Pearson's correlation of two columns." },
  { name = "Correlation", value = true },
  { name = "Sample", params = "n", value = true, doc = "Keeps n rows at random (default 5)." },
  { name = "Nlargest", params = "n, column", value = true, doc = "Keeps the n rows with the largest values (default 5)." },
  { name = "Nsmallest", params = "n, column", value = true, doc = "Keeps the n rows with the smallest values (default 5)." },
  { name = "Info", value = true, doc = "Prints the size and each column's type and non-null count." },
  { name = "Dtypes", value = true, doc = "The columns' types: \"name: str,age: i64\"." },
  { name = "Shape", value = true },
  { name = "Merge", params = "otherDf, onColumn, [how]", value = true, doc = "Joins another frame on a column: inner (default), left, right, outer, cross." },
  { name = "Join", value = true },
  { name = "Concat", params = "otherDf", value = true, doc = "Adds another frame's rows (columns matched by name)." },
  { name = "Append", value = true },
  { name = "Transpose", value = true, doc = "Columns become rows." },
  { name = "T" },
  { name = "Apply", params = "column, function", value = true, doc = "Transforms a column: upper, lower, trim, abs, round, sqrt, log, exp." },
  { name = "Replace", params = "column, oldValue, newValue", value = true, doc = "Cells that are oldValue become newValue." },
  { name = "Clear", value = true },
  { name = "Columns", value = true },
  { name = "Rows" },
  { name = "RowCount" },
  { name = "Len" },
  { name = "ToString", value = true, doc = "The frame as a text table." },
  { name = "Show", value = true },
  { name = "Print", value = true, doc = "Prints the frame as a text table." },
  { name = "ToGrid", params = "gridName", value = true, doc = "Fills a QSTRINGGRID: the header row, then the cells." },
  { name = "To_grid", value = true },
  { name = "Display", value = true },
]
events = []

[[component]]
name = "RPLOT"
visual = true
size = [640, 480]
sets = ["layout", "a11y"]
doc = "A chart in Matplotlib's style: line, bar, scatter, area, histogram and pie plots with labels, legends and notes, on a form or saved as a picture. RapidR's own."
properties = [
  { name = "Title", type = "string" },
  { name = "XLabel", type = "string" },
  { name = "YLabel", type = "string" },
  { name = "Grid", type = "int" },
  { name = "Width", type = "int" },
  { name = "Height", type = "int" },
  { name = "Dpi", type = "int" },
]
methods = [
  { name = "Create" },
  { name = "New" },
  { name = "Init" },
  { name = "Clear", value = true, doc = "Removes every series and setting." },
  { name = "Plot", params = "xData, yData, [color], [label]", value = true, doc = "A line: x and y are RNum arrays (or \"1,2,3\"); style \"-\" (default), \"--\" dashed, \"o\" points." },
  { name = "Bar", params = "labels, values, [color], [label]", value = true, doc = "Vertical bars." },
  { name = "Barh", params = "labels, values, [color], [label]", value = true, doc = "Horizontal bars." },
  { name = "Scatter", params = "xData, yData, [color], [label]", value = true, doc = "Points." },
  { name = "Step", params = "xData, yData, [color], [label]", value = true, doc = "A step line." },
  { name = "Area", params = "xData, yData, [color], [label]", value = true, doc = "A filled area under the line." },
  { name = "Fill_between", value = true },
  { name = "AddSeries", params = "label, y1, y2 ..., [x1], [x2] ..., [color]", doc = "A line from numbers written in place, drawn at once where the chart shows." },
  { name = "Add_series" },
  { name = "Series" },
  { name = "Hist", params = "data, [bins], [color], [label]", value = true, doc = "A histogram (default 10 bins)." },
  { name = "Histogram", value = true },
  { name = "Pie", params = "labels, values, [colors]", value = true, doc = "A pie chart." },
  { name = "Hline", params = "y, [color], [label]", value = true, doc = "A horizontal reference line at y." },
  { name = "Axhline", value = true },
  { name = "Vline", params = "x, [color], [label]", value = true, doc = "A vertical reference line at x." },
  { name = "Axvline", value = true },
  { name = "Annotate", params = "text, x, y, [color]", value = true, doc = "Text at (x, y)." },
  { name = "Legend", params = "[position]", value = true, doc = "Shows the series labels." },
  { name = "SetTitle" },
  { name = "Set_title" },
  { name = "SetXLabel" },
  { name = "Set_xlabel" },
  { name = "SetYLabel" },
  { name = "Set_ylabel" },
  { name = "SaveFig", params = "filename", value = true, doc = "Draws the chart into a PNG file (on the web: on the page)." },
  { name = "Save", value = true },
  { name = "Render" },
  { name = "Show", value = true, doc = "Draws the chart where it is shown (the page, on the web)." },
  { name = "Figsize", params = "width, height, [dpi]", value = true, doc = "The size in inches at the chart's DPI." },
  { name = "Xlim", params = "min, max", value = true, doc = "The X axis range." },
  { name = "Ylim", params = "min, max", value = true, doc = "The Y axis range." },
  { name = "Xscale", params = "type", value = true, doc = "\"linear\" or \"log\" (kept with the chart; drawn linear)." },
  { name = "Yscale", params = "type", value = true, doc = "\"linear\" or \"log\" (kept with the chart; drawn linear)." },
]
events = []
