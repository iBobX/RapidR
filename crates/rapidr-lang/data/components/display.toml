[[component]]
name = "RPROGRESS"
display = "Progress"
visual = true
size = [200, 25]
sets = ["layout", "a11y"]
doc = "Windows' classic progress bar: a sunken bar filled in blocks from Min to Max at Position. RapidR's own; RPROGRESSBAR is RapidQ's gauge."
properties = [
  { name = "Left", type = "int", default = 0 },
  { name = "Top", type = "int", default = 0 },
  { name = "Width", type = "int" },
  { name = "Height", type = "int" },
  { name = "Visible", type = "bool", default = true },
