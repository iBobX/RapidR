# Display and drawing: the registry's components (crates/rapidr-lang; src/lib.rs says how to edit).
group = "Display and drawing"

[[component]]
name = "RLABEL"
display = "Label"
rapidq = "QLABEL"
visual = true
size = [65, 17]
default_event = "OnClick"
sets = ["layout", "a11y"]
doc = "Text on a form that the user reads but doesn't edit, with alignment, word wrap, an angle and 3D styles."
properties = [
  { name = "Align", type = "enum", values = ["alNone", "alTop", "alBottom", "alLeft", "alRight", "alClient"], default = "alNone" },
  { name = "Alignment", type = "enum", values = ["taLeftJustify", "taRightJustify", "taCenter"], default = "taLeftJustify" },
  { name = "Angle", type = "int", default = 0 },
  { name = "AutoSize", type = "bool", default = true },
  { name = "Caption", type = "string", default = "" },
  { name = "Color", type = "color" },
  { name = "Cursor", type = "enum", values = ["crDefault", "crNone", "crArrow", "crCross", "crIBeam", "crSize", "crSizeNESW", "crSizeNS", "crSizeNWSE", "crSizeWE", "crUpArrow", "crHourGlass", "crDrag", "crNoDrop", "crHSplit", "crVSplit", "crMultiDrag", "crSQLWait", "crNo", "crAppStart", "crHelp", "crHandPoint"], default = "crDefault" },
  { name = "Enabled", type = "bool", default = true },
  { name = "Font", type = "font", access = "write", design = true },
  { name = "Handle", type = "int", access = "read", design = false },
  { name = "Height", type = "int" },
  { name = "Hint", type = "string" },
  { name = "LabelStyle", type = "enum", values = ["lsNone", "lsRaised", "lsRecessed"] },
  { name = "Left", type = "int", default = 0 },
  { name = "LowerColor", type = "color", default = -2147483632 },
  { name = "Parent", type = "component", kinds = ["QFORM", "QPANEL", "QTABCONTROL"], access = "write", design = false },
  { name = "PopupMenu", type = "component", kinds = ["QPOPUPMENU"], access = "write", design = false },
  { name = "ShowHint", type = "bool", default = false },
  { name = "Tag", type = "int" },
  { name = "Top", type = "int", default = 0 },
  { name = "Transparent", type = "bool", default = false },
  { name = "UpperColor", type = "color", default = -2147483628 },
  { name = "Visible", type = "bool", default = true },
  { name = "Width", type = "int" },
  { name = "WordWrap", type = "bool", default = false },
  { name = "FontSize", type = "int", origin = "rapidr" },
  { name = "FontColor", type = "color", origin = "rapidr" },
  { name = "ClientHeight", type = "int", design = false },
  { name = "ClientWidth", type = "int", design = false },
  { name = "Layout", type = "enum", values = ["blBMPLeft", "blBMPRight", "blBMPTop", "blBMPBottom"] },
  { name = "TextStyle", type = "any" },
]
methods = [
  { name = "Repaint", origin = "rapidr" },
  { name = "Refresh", value = true, origin = "rapidr" },
]
events = [
  { name = "OnClick" },
  { name = "OnDblClick" },
  { name = "OnMouseDown", params = "Button AS INTEGER, X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnMouseMove", params = "X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnMouseUp", params = "Button AS INTEGER, X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "WndProc", params = "Hwnd AS INTEGER, Msg AS INTEGER, wParam AS INTEGER, lParam AS INTEGER", missing = true },
]

[[component]]
name = "RIMAGE"
display = "Image"
rapidq = "QIMAGE"
visual = true
size = [105, 105]
default_event = "OnClick"
sets = ["layout", "a11y"]
doc = "Shows a picture (BMP, PNG, JPEG, GIF, SVG …), stretched or centred; the program can also draw on it like a canvas."
properties = [
  { name = "Align", type = "enum", values = ["alNone", "alTop", "alBottom", "alLeft", "alRight", "alClient"], default = "alNone" },
  { name = "AutoSize", type = "bool", default = false },
  { name = "BMP", type = "picture" },
  { name = "BMPHandle", type = "resource", access = "write", design = false },
  { name = "Center", type = "bool", default = false },
  { name = "CopyMode", type = "enum", values = ["cmBlackness", "cmDstInvert", "cmMergeCopy", "cmMergePaint", "cmNotSrcCopy", "cmNotSrcErase", "cmPatCopy", "cmPatInvert", "cmPatPaint", "cmSrcAnd", "cmSrcCopy", "cmSrcErase", "cmSrcInvert", "cmSrcPaint", "cmWhiteness"], default = "cmSrcCopy" },
  { name = "Cursor", type = "enum", values = ["crDefault", "crNone", "crArrow", "crCross", "crIBeam", "crSize", "crSizeNESW", "crSizeNS", "crSizeNWSE", "crSizeWE", "crUpArrow", "crHourGlass", "crDrag", "crNoDrop", "crHSplit", "crVSplit", "crMultiDrag", "crSQLWait", "crNo", "crAppStart", "crHelp", "crHandPoint"], default = "crDefault" },
  { name = "Enabled", type = "bool", default = true },
  { name = "Font", type = "font", access = "write", design = true },
  { name = "Handle", type = "int", design = false },
  { name = "Height", type = "int" },
  { name = "Hint", type = "string" },
  { name = "ICOHandle", type = "resource", access = "write", design = false },
  { name = "Icon", type = "picture", access = "write", design = false },
  { name = "IncrementalDisplay", type = "bool", default = false },
  { name = "Left", type = "int", default = 0 },
  { name = "Parent", type = "component", kinds = ["QFORM", "QPANEL", "QTABCONTROL"], access = "write", design = false },
  { name = "Pixel", type = "int", design = false, indexed = 2 },
  { name = "PopupMenu", type = "component", kinds = ["QPOPUPMENU"], access = "write", design = false },
  { name = "ShowHint", type = "bool", default = false },
  { name = "Stretch", type = "bool", default = false },
  { name = "Tag", type = "int" },
  { name = "Top", type = "int", default = 0 },
  { name = "Transparent", type = "bool", default = false },
  { name = "Width", type = "int" },
  { name = "Visible", type = "bool", default = true },
  { name = "PenColor", type = "color", origin = "rapidr" },
  { name = "BrushColor", type = "color", origin = "rapidr" },
  { name = "FontColor", type = "color", origin = "rapidr" },
  { name = "FontName", type = "string", origin = "rapidr" },
  { name = "FontSize", type = "int", origin = "rapidr" },
]
methods = [
  { name = "Circle", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER, fill AS INTEGER", value = true },
  { name = "CopyRect", params = "D, Image, S" },
  { name = "Draw", params = "x AS INTEGER, y AS INTEGER, BMP" },
  { name = "FillRect", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER", value = true },
  { name = "Line", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER", value = true },
  { name = "Paint", params = "x AS INTEGER, y AS INTEGER, c AS INTEGER, borderc AS INTEGER" },
  { name = "Pset", params = "x AS INTEGER, y AS INTEGER, c AS INTEGER" },
  { name = "Rectangle", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER" },
  { name = "Repaint", missing = true },
  { name = "Rotate", params = "xOrigin AS INTEGER, yOrigin AS INTEGER, Angle AS INTEGER", missing = true },
  { name = "RoundRect", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, x3 AS INTEGER, y3 AS INTEGER, c AS INTEGER" },
  { name = "StretchDraw", params = "Rect AS QRECT, BMP" },
  { name = "TextHeight", params = "Text AS STRING", returns = "WORD" },
  { name = "TextWidth", params = "Text AS STRING", returns = "WORD" },
  { name = "TextRect", params = "Rect AS QRECT, x AS INTEGER, y AS INTEGER, S AS STRING, fc AS INTEGER, bc AS INTEGER", missing = true },
  { name = "TextOut", params = "x AS INTEGER, y AS INTEGER, S AS STRING, fc AS INTEGER, bc AS INTEGER" },
  { name = "LoadFromFile", origin = "rapidr" },
  { name = "SaveToFile", origin = "rapidr" },
  { name = "LoadFromPlot", origin = "rapidr" },
  { name = "Cls", origin = "rapidr", doc = "Removes the picture: nothing shows. Same as `Clear`." },
  { name = "Load", origin = "rapidr", doc = "Loads a picture file (BMP, PNG, JPEG, ICO, SVG). Same as `LoadFromFile`." },
  { name = "Clear", value = true, origin = "rapidr", doc = "Removes the picture: nothing shows. Same as `Cls`." },
]
events = [
  { name = "OnClick" },
  { name = "OnDblClick" },
  { name = "OnMouseDown", params = "Button AS INTEGER, X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnMouseMove", params = "X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnMouseUp", params = "Button AS INTEGER, X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
]

[[component]]
name = "RCANVAS"
display = "Canvas"
rapidq = "QCANVAS"
visual = true
size = [105, 105]
default_event = "OnClick"
sets = ["layout", "a11y"]
doc = "A surface to draw on: lines, shapes, text and pictures, usually redrawn in its OnPaint handler."
