  { name = "Visible", type = "int" },
  { name = "FormCaption", type = "string" },
  { name = "Theme", type = "string", design = false, doc = "The look the designed form is drawn in (any name `$THEME` takes; \"\": the surface's own): `classic` shows it as RapidQ drew it." },
  { name = "FormType", type = "string", access = "read", design = false, doc = "The designed form's type as its CREATE writes it (`RForm`, `QFORMMDI` …); \"\" when there is no form." },
  { name = "ReservedNames", type = "string", design = false, doc = "Names the program's other files give their components, separated by commas: a component or form added here is never named one of them (a RapidQ program's component names are global — Form1's Button1 and Form2's would clash)." },
  { name = "Parent", type = "component", kinds = ["QFORM"], design = false },
  { name = "Count", type = "int" },
  { name = "SelCount", type = "int", access = "read", doc = "How many components are selected (Shift / Ctrl+click, a rubber band)." },
  { name = "PreviewWidth", type = "int", design = false, doc = "The resize preview: the designed form shown this wide, its components where the running program puts them (Align, Anchors, Constraints); 0 ends the preview. Dragging the form's corner does the same." },
  { name = "PreviewHeight", type = "int", design = false, doc = "The resize preview's height (see PreviewWidth); 0 ends the preview." },
  { name = "ShowGuides", type = "bool", default = true, doc = "Whether a drag snaps to and shows smart guides: siblings' edges, centres and baselines, the form's centre lines, margins, equal spacing (Alt suspends snapping)." },
  { name = "SnapToGrid", type = "bool", default = true, doc = "Whether moves and resizes snap to the grid where no guide is near." },
  { name = "GridSize", type = "int", default = 8, doc = "The grid's step in pixels." },
  { name = "ShowGrid", type = "bool", default = true, doc = "Whether the grid's dots show on the designed form." },
  { name = "ShowSelection", type = "bool", default = true, doc = "Whether the designer's own marks show: the selection's frames and handles, the anchor pins, the form's sizing grips. Off: the designed form alone, as the running program shows it." },
  { name = "Source", type = "string", design = false, doc = "The program's source text. Setting it reads the file's forms and shows the one FormName names (else its first QFORM) at its own size, drawn as the running program draws it; setting the same text again changes nothing. From then on every change made in the designer is written back into this text as the smallest edits (OnSourceEdit), and reading Source gives the text as they left it. Set it again whenever the code is edited elsewhere." },
  { name = "SourceFile", type = "string", design = false, doc = "The source's file name, set before Source: its $INCLUDE files are found from there." },
  { name = "FormName", type = "string", design = false, doc = "The name of the form being designed (\"\" when the source creates none). Setting it designs that form of the source instead." },
  { name = "SelIndex", type = "int", design = false, doc = "The index of the selected component (the first selected); -1 when nothing is, which means the form itself." },
  { name = "PlaceType", type = "string", design = false, doc = "The placing tool: a component type (\"QBUTTON\"). The next click on the form places one at its default size, or a drag draws its rectangle; Shift keeps the tool for another. Escape or \"\" turns it off." },
  { name = "CanUndo", type = "int", access = "read", design = false, doc = "Whether Undo has a change to undo." },
  { name = "CanRedo", type = "int", access = "read", design = false, doc = "Whether Redo has a change to do again." },
  { name = "StatusText", type = "string", access = "read", design = false, doc = "What the last change did, in words: what a screen reader is told (\"Button1 (QBUTTON), 16, 24, 75 × 25\")." },
  { name = "Guides", type = "string", access = "read", design = false, doc = "The smart guides showing while a component is dragged, in words: each one's kind (edge, centre, baseline, margin, spacing N), its axis (x for a vertical line, y for a horizontal one) and where it is, comma-separated (\"edge x 112, baseline y 30\"); empty when none show." },
  { name = "HandlerLine", type = "int", access = "read", design = false, doc = "The line (from 0) of the SUB the last CreateHandler gave: where the code editor's caret goes." },
  { name = "Zoom", type = "int", default = 100, design = false, doc = "How large the designed form shows, in percent (25 to 400): drawn at the screen's resolution, so as crisp as at 100, while every position stays in the program's pixels. Ctrl (⌘) with + , − and 0 on the designer, Ctrl with the mouse wheel, and a trackpad's pinch change it." },
  { name = "TabOrderMode", type = "bool", default = false, design = false, doc = "The Tab-order editor: every component that takes the focus shows its place in the Tab order (2.1: the second inside the third), and clicking components in the order wanted renumbers them, each click written as TabOrder in the code (one undo step). Escape turns it off." },
  { name = "SharedUndo", type = "bool", default = false, design = false, doc = "The file's undo history is kept elsewhere (the code editor's): Undo and Redo on the designer — its methods, Ctrl+Z, Ctrl+Y — fire OnUndo instead of undoing, and the program undoes there and sets Source again. OnSourceStep then says how each change's OnSourceEdits group into steps." },
  { name = "Editing", type = "int", access = "read", design = false, doc = "Whether a caption is being edited in place (EditCaption, F2, a slow click, the menu editor's Type Here)." },
]
methods = [
  { name = "SetFocus", value = true, doc = "Gives the surface the keyboard focus (its keys: arrows, Delete, Ctrl+Z …)." },
  { name = "AddMdiChild", returns = "STRING", value = true, doc = "A child window for the designed RFormMDI, RapidQ's way (QFORMMDI's children are components it shows in child windows): a panel on the MDI form named as a form (Form2), and `Main.AddChild(Form2.Handle, \"Form2\", 0, 0, 0, 0, 0, 1)` written after the form, one undo step. Its name; \"\" when the form isn't an MDI main window." },
  { name = "AddComponent", value = true, params = "Type AS STRING, X AS INTEGER, Y AS INTEGER", doc = "Adds a new component of Type at (X, Y) of the form's inside, into the panel, group box or scroll box there, at its default size, named as Delphi names them (Button1, Button2 …) and written into Source as a CREATE block. X and Y of -1 put it at a free spot in the selected container (Enter on a toolbox item). Returns its index, or -1 when it can't go there. (AddComponent(Type, Name, X, Y, W, H), the older form, adds to a designer without a source.)" },
  { name = "DragComponent", params = "Type AS STRING", doc = "Starts dragging a new component of Type in from elsewhere, from a toolbox's mouse-down: while the button stays down, any design surface the mouse moves over shows where it would go, and letting go there adds it (as AddComponent). Letting go anywhere else does nothing." },
  { name = "SelectName", params = "Name AS STRING", returns = "INTEGER", doc = "Selects the component called Name; True if there is one." },
  { name = "SelectAll", value = true, doc = "Selects every component on the form." },
  { name = "DeleteSelection", returns = "INTEGER", doc = "Deletes the selected components (one undo step)." },
  { name = "CopySelection", returns = "STRING", doc = "Keeps the selected components for Paste and returns their CREATE blocks as text, for the clipboard." },
  { name = "CutSelection", returns = "STRING", doc = "CopySelection, then DeleteSelection." },
  { name = "Paste", value = true, returns = "INTEGER", doc = "Adds the components copied last into the selected container: names kept unique, event handlers not bound." },
  { name = "Duplicate", returns = "INTEGER", doc = "Copies the selected components beside themselves, one grid step away." },
  { name = "Arrange", params = "How AS STRING", returns = "INTEGER", doc = "The Format menu on the selection, one undo step: \"left\", \"center\", \"right\", \"top\", \"middle\", \"bottom\" (to the first selected), \"samewidth\", \"sameheight\", \"samesize\", \"spaceh\", \"spacev\" (equal gaps), \"centerh\", \"centerv\" (in the parent), \"front\", \"back\"." },
  { name = "ResizeForm", params = "Width AS INTEGER, Height AS INTEGER", returns = "INTEGER", doc = "Gives the designed form this Width and Height, as dragging its edge does: the size written into its CREATE block, and the components its Anchors move written where they go." },
  { name = "ZoomStep", params = "Direction AS INTEGER", returns = "INTEGER", doc = "Zooms in (Direction 1) or out (-1) by one step (25, 33, 50, 67, 75, 90, 100, 110, 125, 150, 175, 200, 250, 300, 400 %), or back to 100 % (0)." },
  { name = "ZoomToFit", returns = "INTEGER", doc = "Zooms so the whole form shows in the designer (never above 100 %)." },
  { name = "EditMenu", returns = "INTEGER", doc = "The menu editor: selects the form's main menu — adding a QMAINMENU when it has none — so its bar shows Type Here, where a click (or typing) adds an item in place." },
  { name = "EditCaption", returns = "INTEGER", doc = "Edits the selected component's Caption (or Text) in place, over the component — F2 or a second, slower click on it does the same (a double click makes its event handler). Enter writes it into the code (one undo step), Escape leaves it. On a menu item the editor has a second field, its ShortCut (Tab goes there; the keys pressed there are the shortcut). True if the selection has a caption to edit." },
  { name = "AddForm", params = "Name AS STRING", returns = "STRING", doc = "Adds a form to a file that has none (or another one): CREATE Name AS QFORM with a Caption and RapidQ's starting size, and the line that shows it (Name.ShowModal), written at the end of the code as one undo step; the designer then designs it. Name \"\" takes Form1, Form2 … whichever the file doesn't use. Returns the form's name (\"\": it couldn't be added)." },
  { name = "CreateHandler", params = "Name AS STRING, Event AS STRING", returns = "STRING", doc = "The SUB handling component Name's Event (\"\": its default event): the one its CREATE block names, else a new one written with the event's parameters and wired (one undo step). Returns the SUB's name; HandlerLine says where it is." },
  { name = "RemoveComponent", value = true },
  { name = "ClearAll", value = true },
  { name = "SelectComp", value = true },
  { name = "GetName", value = true },
  { name = "SetName", value = true },
  { name = "GetType", value = true },
  { name = "GetProp", value = true },
  { name = "SetProp", value = true },
  { name = "SetCompBounds", value = true },
  { name = "GetCompX", value = true },
  { name = "GetCompY", value = true },
  { name = "GetCompW", value = true },
  { name = "GetCompH", value = true },
  { name = "Undo", returns = "INTEGER", doc = "Undoes the last change to the designed form (a move, a resize, a property, an added or removed component); True if there was one. With a Source, the exact text before it comes back (OnSourceEdit)." },
  { name = "Redo", returns = "INTEGER", doc = "Does again the last change undone; True if there was one." },
  { name = "AlignSelection", params = "How AS STRING", doc = "Lines the selected components up with the first selected: \"left\", \"center\", \"right\", \"top\", \"middle\" or \"bottom\" (one undo step)." },
  { name = "SelectAdd", params = "Index AS INTEGER", doc = "Adds component Index to the selection (as Shift+click)." },
  { name = "Show", value = true },
  { name = "Hide", value = true },
]
events = [
  { name = "OnSelect", params = "Index AS INTEGER", doc = "A component was selected (pressed, Tab, added); -1: nothing, the form itself." },
  { name = "OnDblClick", params = "Index AS INTEGER" },
  { name = "OnMove", params = "Index AS INTEGER, X AS INTEGER, Y AS INTEGER, W AS INTEGER, H AS INTEGER" },
  { name = "OnBgClick", params = "X AS INTEGER, Y AS INTEGER" },
  { name = "OnSourceEdit", params = "StartLine AS INTEGER, StartCol AS INTEGER, EndLine AS INTEGER, EndCol AS INTEGER, Text AS STRING", doc = "The designer changed Source: the text from (StartLine, StartCol) to (EndLine, EndCol) is replaced by Text (lines and columns from 0, columns in characters). One change's edits come in order, each in the text as the ones before left it: applied to the code editor in turn, it holds Source again." },
  { name = "OnChange", doc = "The designed form changed (after its OnSourceEdit events)." },
  { name = "OnSourceStep", params = "Continues AS INTEGER", doc = "A change's OnSourceEdit events follow: one step of the file's undo history, or — Continues True — part of the step before (a caption typed right after adding the component). A code editor that keeps the history groups them so." },
  { name = "OnUndo", params = "Redo AS INTEGER", doc = "With SharedUndo, Undo (Redo False) or Redo (True) was asked on the designer: undo it in the editor that keeps the file's history, then set Source again." },
]

[[component]]
name = "RDIGDISPLAY"
display = "DigDisplay"
rapidq = "QDIGDISPLAY"
from = "QDigDisplay.inc"
visual = true
size = [12, 24]
default_event = "OnClick"
sets = ["layout", "a11y"]
doc = "A seven-segment LED display (QDigDisplay.inc) showing the digits and signs of its Display text, as on a clock or a counter."
properties = [
  { name = "Align", type = "enum", values = ["alNone", "alTop", "alBottom", "alLeft", "alRight", "alClient"], default = "alNone" },
  { name = "ClientHeight", type = "int", design = false },
  { name = "ClientWidth", type = "int", design = false },
  { name = "Color", type = "color" },
  { name = "CopyMode", type = "enum", values = ["cmBlackness", "cmDstInvert", "cmMergeCopy", "cmMergePaint", "cmNotSrcCopy", "cmNotSrcErase", "cmPatCopy", "cmPatInvert", "cmPatPaint", "cmSrcAnd", "cmSrcCopy", "cmSrcErase", "cmSrcInvert", "cmSrcPaint", "cmWhiteness"] },
  { name = "Cursor", type = "enum", values = ["crDefault", "crNone", "crArrow", "crCross", "crIBeam", "crSize", "crSizeNESW", "crSizeNS", "crSizeNWSE", "crSizeWE", "crUpArrow", "crHourGlass", "crDrag", "crNoDrop", "crHSplit", "crVSplit", "crMultiDrag", "crSQLWait", "crNo", "crAppStart", "crHelp", "crHandPoint"] },
  { name = "Enabled", type = "bool", default = true },
  { name = "Font", type = "font", access = "write", design = true },
  { name = "Height", type = "int", default = 24 },
  { name = "Hint", type = "string" },
  { name = "Left", type = "int", default = 0 },
  { name = "Parent", type = "component", kinds = ["QFORM", "QPANEL", "QTABCONTROL"], access = "write", design = false },
  { name = "Pixel", type = "int", design = false, indexed = 2 },
  { name = "PopupMenu", type = "component", kinds = ["QPOPUPMENU"], access = "write", design = false },
  { name = "ShowHint", type = "bool", default = false },
  { name = "Tag", type = "int" },
  { name = "Top", type = "int", default = 0 },
  { name = "Width", type = "int", default = 12 },
  { name = "Visible", type = "bool", default = true },
  { name = "Display", type = "string", default = "0" },
  { name = "PenColor", type = "color", origin = "rapidr" },
  { name = "BrushColor", type = "color", origin = "rapidr" },
  { name = "FontColor", type = "color", origin = "rapidr" },
  { name = "FontName", type = "string", origin = "rapidr" },
  { name = "FontSize", type = "int", origin = "rapidr" },
]
methods = [
  { name = "Rect", origin = "rapidr" },
  { name = "SetPixel", origin = "rapidr" },
  { name = "FillCircle", origin = "rapidr" },
  { name = "Ellipse", origin = "rapidr" },
  { name = "Cls", origin = "rapidr" },
  { name = "DrawText", origin = "rapidr" },
  { name = "SetFont", origin = "rapidr" },
]
events = [
  { name = "OnClick" },
  { name = "OnDblClick" },
  { name = "OnMouseDown", params = "Button AS INTEGER, X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnMouseMove", params = "X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnMouseUp", params = "Button AS INTEGER, X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnPaint" },
]
