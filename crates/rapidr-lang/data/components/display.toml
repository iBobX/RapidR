# Display and drawing: the registry's components (crates/rapidr-lang; src/lib.rs says how to edit).
group = "Display and drawing"

[[component]]
name = "RLABEL"
display = "Label"
rapidq = "QLABEL"
visual = true
size = [65, 17]
default_event = "OnClick"
sets = ["layout", "a11y"]
doc = "Text on a form that the user reads but doesn't edit, with alignment, word wrap, an angle and 3D styles."
properties = [
  { name = "Align", type = "enum", values = ["alNone", "alTop", "alBottom", "alLeft", "alRight", "alClient"], default = "alNone" },
  { name = "Alignment", type = "enum", values = ["taLeftJustify", "taRightJustify", "taCenter"], default = "taLeftJustify" },
  { name = "Angle", type = "int", default = 0 },
  { name = "AutoSize", type = "bool", default = true },
  { name = "Caption", type = "string", default = "" },
  { name = "Color", type = "color" },
  { name = "Cursor", type = "enum", values = ["crDefault", "crNone", "crArrow", "crCross", "crIBeam", "crSize", "crSizeNESW", "crSizeNS", "crSizeNWSE", "crSizeWE", "crUpArrow", "crHourGlass", "crDrag", "crNoDrop", "crHSplit", "crVSplit", "crMultiDrag", "crSQLWait", "crNo", "crAppStart", "crHelp", "crHandPoint"], default = "crDefault" },
  { name = "Enabled", type = "bool", default = true },
  { name = "Font", type = "font", access = "write", design = true },
  { name = "Handle", type = "int", access = "read", design = false },
  { name = "Height", type = "int" },
  { name = "Hint", type = "string" },
  { name = "LabelStyle", type = "enum", values = ["lsNone", "lsRaised", "lsRecessed"] },
  { name = "Left", type = "int", default = 0 },
  { name = "LowerColor", type = "color", default = -2147483632 },
  { name = "Parent", type = "component", kinds = ["QFORM", "QPANEL", "QTABCONTROL"], access = "write", design = false },
  { name = "PopupMenu", type = "component", kinds = ["QPOPUPMENU"], access = "write", design = false },
  { name = "ShowHint", type = "bool", default = false },
  { name = "Tag", type = "int" },
  { name = "TabStop", type = "bool", default = false, origin = "rapidr", doc = "True makes the label a link that takes the keyboard focus: Tab reaches it (in TabOrder), the theme's focus ring shows around its text, Enter or Space clicks it (OnClick), and a screen reader announces it as a link named by its Caption or AccessibleName. False (the default) leaves it out of the keyboard's way." },
  { name = "Top", type = "int", default = 0 },
  { name = "Transparent", type = "bool", default = false },
  { name = "UpperColor", type = "color", default = -2147483628 },
  { name = "Visible", type = "bool", default = true },
  { name = "Width", type = "int" },
  { name = "WordWrap", type = "bool", default = false },
  { name = "FontSize", type = "int", origin = "rapidr" },
  { name = "FontColor", type = "color", origin = "rapidr" },
  { name = "ClientHeight", type = "int", design = false },
  { name = "ClientWidth", type = "int", design = false },
  { name = "Layout", type = "enum", values = ["blBMPLeft", "blBMPRight", "blBMPTop", "blBMPBottom"] },
  { name = "TextStyle", type = "any" },
  { name = "DataSource", type = "component", kinds = ["RDATASOURCE", "RDATAFRAME", "RCSV", "RJSON"], origin = "rapidr", category = "Data", doc = "Shows a data set's current row: an RDataSource, or a data set straight (with DataField: the column) — its Caption follows as the row moves." },
  { name = "DataField", type = "string", default = "", origin = "rapidr", category = "Data", doc = "The column of DataSource's current row it shows (\"name\")." },
]
methods = [
  { name = "Repaint", origin = "rapidr" },
  { name = "Refresh", value = true, origin = "rapidr" },
  { name = "SetFocus", value = true, origin = "rapidr", effects = ["ui"], doc = "Gives the label the keyboard focus when it takes it (TabStop = True: a link): its focus ring shows, and Enter or Space clicks it." },
]
events = [
  { name = "OnClick" },
  { name = "OnDblClick" },
  { name = "OnMouseDown", params = "Button AS INTEGER, X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnMouseMove", params = "X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnMouseUp", params = "Button AS INTEGER, X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "WndProc", params = "Hwnd AS INTEGER, Msg AS INTEGER, wParam AS INTEGER, lParam AS INTEGER" },
  { name = "OnEnter", origin = "rapidr", doc = "Fires when the label gets the keyboard focus itself (it takes it only with TabStop = True): Tab, a click, SetFocus. (RapidR's.)" },
  { name = "OnExit", origin = "rapidr", doc = "Fires when the label, focused itself (TabStop = True), loses the keyboard focus to another component of its form. (RapidR's.)" },
]

[[component]]
name = "RIMAGE"
display = "Image"
rapidq = "QIMAGE"
visual = true
size = [105, 105]
default_event = "OnClick"
sets = ["layout", "a11y"]
doc = "Shows a picture (BMP, PNG, JPEG, GIF, SVG …), stretched or centred; the program can also draw on it like a canvas."
properties = [
  { name = "Align", type = "enum", values = ["alNone", "alTop", "alBottom", "alLeft", "alRight", "alClient"], default = "alNone" },
  { name = "AutoSize", type = "bool", default = false },
  { name = "BMP", type = "picture" },
  { name = "BMPHandle", type = "resource", access = "write", design = false },
  { name = "Center", type = "bool", default = false },
  { name = "CopyMode", type = "enum", values = ["cmBlackness", "cmDstInvert", "cmMergeCopy", "cmMergePaint", "cmNotSrcCopy", "cmNotSrcErase", "cmPatCopy", "cmPatInvert", "cmPatPaint", "cmSrcAnd", "cmSrcCopy", "cmSrcErase", "cmSrcInvert", "cmSrcPaint", "cmWhiteness"], default = "cmSrcCopy" },
  { name = "Cursor", type = "enum", values = ["crDefault", "crNone", "crArrow", "crCross", "crIBeam", "crSize", "crSizeNESW", "crSizeNS", "crSizeNWSE", "crSizeWE", "crUpArrow", "crHourGlass", "crDrag", "crNoDrop", "crHSplit", "crVSplit", "crMultiDrag", "crSQLWait", "crNo", "crAppStart", "crHelp", "crHandPoint"], default = "crDefault" },
  { name = "Enabled", type = "bool", default = true },
  { name = "Font", type = "font", access = "write", design = true },
  { name = "Handle", type = "int", design = false },
  { name = "Height", type = "int" },
  { name = "Hint", type = "string" },
  { name = "ICOHandle", type = "resource", access = "write", design = false },
  { name = "Icon", type = "picture", access = "write", design = false },
  { name = "IncrementalDisplay", type = "bool", default = false },
  { name = "Left", type = "int", default = 0 },
  { name = "Parent", type = "component", kinds = ["QFORM", "QPANEL", "QTABCONTROL"], access = "write", design = false },
  { name = "Pixel", type = "int", design = false, indexed = 2 },
  { name = "PopupMenu", type = "component", kinds = ["QPOPUPMENU"], access = "write", design = false },
  { name = "ShowHint", type = "bool", default = false },
  { name = "Stretch", type = "bool", default = false },
  { name = "Tag", type = "int" },
  { name = "Top", type = "int", default = 0 },
  { name = "Transparent", type = "bool", default = false },
  { name = "Width", type = "int" },
  { name = "Visible", type = "bool", default = true },
  { name = "PenColor", type = "color", origin = "rapidr" },
  { name = "BrushColor", type = "color", origin = "rapidr" },
  { name = "FontColor", type = "color", origin = "rapidr" },
  { name = "FontName", type = "string", origin = "rapidr", kind = "font" },
  { name = "FontSize", type = "int", origin = "rapidr" },
  { name = "Smooth", type = "bool", default = false, origin = "rapidr", doc = "Whether `StretchDraw` and `CopyRect` blend when they scale. False (the default, and how a scaled copy has always been drawn) takes the nearest pixel: crisp edges, right for pixel art, an emulator's screen, a QR code. True blends the four pixels around each one (bilinear): smooth, right for photographs." },
]
methods = [
  { name = "Circle", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER, fill AS INTEGER", value = true, arg_kinds = { c = "color", fill = "color" } },
  { name = "CopyRect", params = "D, Image, S" },
  { name = "Draw", params = "x AS INTEGER, y AS INTEGER, BMP" },
  { name = "FillRect", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER", value = true, arg_kinds = { c = "color" } },
  { name = "Line", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER", value = true, arg_kinds = { c = "color" } },
  { name = "Paint", params = "x AS INTEGER, y AS INTEGER, c AS INTEGER, borderc AS INTEGER", arg_kinds = { c = "color", borderc = "color" } },
  { name = "Pset", params = "x AS INTEGER, y AS INTEGER, c AS INTEGER", arg_kinds = { c = "color" } },
  { name = "Rectangle", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER", arg_kinds = { c = "color" } },
  { name = "Repaint", doc = "Shows the picture again." },
  { name = "Rotate", params = "xOrigin AS INTEGER, yOrigin AS INTEGER, Angle AS INTEGER", doc = "Turns the whole picture `Angle` degrees anticlockwise about pixel (`xOrigin`, `yOrigin`), keeping its size: each pixel takes the nearest one that turns onto it, and pixels nothing turns onto take the colour the top-left pixel had before." },
  { name = "RoundRect", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, x3 AS INTEGER, y3 AS INTEGER, c AS INTEGER", arg_kinds = { c = "color" } },
  { name = "StretchDraw", params = "Rect AS RRect, BMP", doc = "Draws `BMP` scaled to fill `Rect` (its right and bottom edges left out). RapidR also takes the rectangle as four numbers: `StretchDraw x, y, w, h, BMP` draws it at (`x`, `y`), `w` wide and `h` high. Every pixel of the result takes the nearest pixel of `BMP` - crisp, as pixel art and an emulator's screen want it, and one fast pass over rows (a 256 x 192 picture at twice its size in a fraction of a millisecond). With `Smooth` True the four pixels around it are blended instead." },
  { name = "TextHeight", params = "Text AS STRING", returns = "WORD" },
  { name = "TextWidth", params = "Text AS STRING", returns = "WORD" },
  { name = "TextRect", params = "Rect AS RRect, x AS INTEGER, y AS INTEGER, S AS STRING, fc AS INTEGER, bc AS INTEGER", test = "args: 0, 0, 0, \"x\", 0, -1", doc = "Writes `S` at (`x`, `y`) in colour `fc` as TextOut does, but only the part inside `Rect` (its right and bottom edges left out) shows; a background colour `bc` fills the whole of `Rect` first, -1 leaves what is there.", arg_kinds = { fc = "color", bc = "color" } },
  { name = "TextOut", params = "x AS INTEGER, y AS INTEGER, S AS STRING, fc AS INTEGER, bc AS INTEGER", arg_kinds = { fc = "color", bc = "color" } },
  { name = "LoadFromFile", params = "FileName AS STRING", origin = "rapidr", doc = "Loads a picture file (BMP, PNG, JPEG, ICO, SVG), or a `$RESOURCE` by its name; an SVG in RapidR's colour tokens or `currentColor` follows the theme (see Load).", test = "skip: reads a picture file", arg_kinds = { FileName = "file:image" } },
  { name = "SaveToFile", params = "FileName AS STRING", origin = "rapidr", test = "skip: writes a picture file", arg_kinds = { FileName = "file:image" } },
  { name = "LoadFromPlot", origin = "rapidr" },
  { name = "Cls", origin = "rapidr", doc = "Removes the picture: nothing shows. Same as `Clear`." },
  { name = "Load", params = "FileName AS STRING", origin = "rapidr", effects = ["file-read", "ui"], doc = "Loads a picture file (BMP, PNG, JPEG, ICO, SVG), or a picture built into the program by `$RESOURCE` (its name: `Image.Load MY_ICON`). An SVG drawn with RapidR's icon colour tokens or `currentColor` takes the theme's colours, and follows the theme when it changes. Same as `LoadFromFile`.", test = "skip: reads a picture file", arg_kinds = { FileName = "file:image" } },
  { name = "Clear", value = true, origin = "rapidr", doc = "Removes the picture: nothing shows. Same as `Cls`." },
  { name = "SetPixels", params = "Pixels AS VARIANT, Width AS INTEGER, Height AS INTEGER, [X AS INTEGER], [Y AS INTEGER]", origin = "rapidr", effects = ["ui"], test = "skip: needs an array", doc = "Puts a whole block of colours into the picture in one call, from an array: the `Width` x `Height` colours of `Pixels`, row by row from its first element (a one-dimensional array's element `y * Width + x` is pixel (x, y); a two-dimensional `(Height - 1, Width - 1)` array is `Pixels(y, x)`), with the block's top-left corner at (`X`, `Y`) - 0, 0 if left out. Colours are the numbers `Pset` takes (`RGB(r, g, b)`, red in the low byte). It is the fast way to draw an image from data - an emulator's video memory, an image filter, a heat map, a game of life: one call does the work of `Width * Height` calls of `Pset` (a 256 x 192 screen in well under a millisecond, not 70). The block must lie inside the picture and `Pixels` must hold enough values, or the program stops with a message that says which.", example = "CREATE f AS RForm\n  CREATE im AS RImage\n    Width = 20: Height = 20\n  END CREATE\nEND CREATE\nDIM Pixels(7) AS INTEGER\nFOR i = 0 TO 7\n  Pixels(i) = (i + 1) * 10\nNEXT\nWidth = 4\nHeight = 2\nX = 1\nY = 0\nim.SetPixels Pixels, Width, Height, X, Y\nPRINT im.Pixel(1, 0); \"|\"; im.Pixel(4, 0); \"|\"; im.Pixel(1, 1); \"|\"; im.Pixel(4, 1)", expect = "10|40|50|80" },
  { name = "SetPixels8", params = "Indexes AS VARIANT, Palette AS VARIANT, Width AS INTEGER, Height AS INTEGER, [X AS INTEGER], [Y AS INTEGER]", origin = "rapidr", effects = ["ui"], test = "skip: needs an array", doc = "Like `SetPixels`, but the array holds palette numbers: each of the `Width` x `Height` elements of `Indexes` (0 to 255, a BYTE array) picks a colour of `Palette` (an array of colours, `RGB(r, g, b)`; its first element is colour 0) - one lookup a pixel, in Rust, as a retro machine's screen memory and palette work. The block's top-left corner is at (`X`, `Y`), 0, 0 if left out. An index the palette does not have stops the program with a message that names the pixel.", example = "CREATE f AS RForm\n  CREATE im AS RImage\n    Width = 20: Height = 20\n  END CREATE\nEND CREATE\nDIM Indexes(5) AS BYTE\nDIM Palette(2) AS INTEGER\nPalette(0) = 0: Palette(1) = 255: Palette(2) = 65280\nFOR i = 0 TO 5\n  Indexes(i) = i MOD 3\nNEXT\nWidth = 3\nHeight = 2\nX = 1\nY = 0\nim.SetPixels8 Indexes, Palette, Width, Height, X, Y\nPRINT im.Pixel(1, 0); \"|\"; im.Pixel(2, 0); \"|\"; im.Pixel(3, 0); \"|\"; im.Pixel(3, 1)", expect = "0|255|65280|65280" },
  { name = "GetPixels", params = "Pixels AS VARIANT, X AS INTEGER, Y AS INTEGER, Width AS INTEGER, Height AS INTEGER", origin = "rapidr", effects = ["state"], test = "skip: needs an array", doc = "Reads a block of the picture into an array in one call: the `Width` x `Height` pixels with the top-left corner at (`X`, `Y`), row by row, into the first `Width * Height` elements of `Pixels` (an INTEGER or LONG array - colours need 24 bits). With `SetPixels` it makes an image filter: read, change the numbers, put back. The block must lie inside the picture.", example = "CREATE f AS RForm\n  CREATE im AS RImage\n    Width = 20: Height = 20\n  END CREATE\nEND CREATE\nim.FillRect 0, 0, 30, 30, 0\nim.Pset 1, 1, 777\nDIM Pixels(3) AS INTEGER\nX = 1\nY = 1\nWidth = 2\nHeight = 2\nim.GetPixels Pixels, X, Y, Width, Height\nPRINT Pixels(0); \"|\"; Pixels(1); \"|\"; Pixels(3)", expect = "777|0|0" },
]
events = [
  { name = "OnClick" },
  { name = "OnDblClick" },
  { name = "OnMouseDown", params = "Button AS INTEGER, X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnMouseMove", params = "X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnMouseUp", params = "Button AS INTEGER, X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
]

[[component]]
name = "RCANVAS"
display = "Canvas"
rapidq = "QCANVAS"
visual = true
size = [105, 105]
default_event = "OnClick"
sets = ["layout", "a11y"]
doc = "A surface to draw on: lines, shapes, text and pictures, usually redrawn in its OnPaint handler."
properties = [
  { name = "Align", type = "enum", values = ["alNone", "alTop", "alBottom", "alLeft", "alRight", "alClient"], default = "alNone" },
  { name = "ClientHeight", type = "int", design = false },
  { name = "ClientWidth", type = "int", design = false },
  { name = "Color", type = "color" },
  { name = "CopyMode", type = "enum", values = ["cmBlackness", "cmDstInvert", "cmMergeCopy", "cmMergePaint", "cmNotSrcCopy", "cmNotSrcErase", "cmPatCopy", "cmPatInvert", "cmPatPaint", "cmSrcAnd", "cmSrcCopy", "cmSrcErase", "cmSrcInvert", "cmSrcPaint", "cmWhiteness"] },
  { name = "Cursor", type = "enum", values = ["crDefault", "crNone", "crArrow", "crCross", "crIBeam", "crSize", "crSizeNESW", "crSizeNS", "crSizeNWSE", "crSizeWE", "crUpArrow", "crHourGlass", "crDrag", "crNoDrop", "crHSplit", "crVSplit", "crMultiDrag", "crSQLWait", "crNo", "crAppStart", "crHelp", "crHandPoint"] },
  { name = "Enabled", type = "bool", default = true },
  { name = "Font", type = "font", access = "write", design = true },
  { name = "Handle", type = "int", access = "read", design = false },
  { name = "Height", type = "int" },
  { name = "Hint", type = "string" },
  { name = "Left", type = "int", default = 0 },
  { name = "Parent", type = "component", kinds = ["QFORM", "QPANEL", "QTABCONTROL"], access = "write", design = false },
  { name = "Pixel", type = "int", design = false, indexed = 2 },
  { name = "PopupMenu", type = "component", kinds = ["QPOPUPMENU"], access = "write", design = false },
  { name = "ShowHint", type = "bool", default = false },
  { name = "Tag", type = "int" },
  { name = "Top", type = "int", default = 0 },
  { name = "Width", type = "int" },
  { name = "Visible", type = "bool", default = true },
  { name = "PenColor", type = "color", origin = "rapidr" },
  { name = "PenWidth", type = "int", origin = "rapidr" },
  { name = "BrushColor", type = "color", origin = "rapidr" },
  { name = "FontSize", type = "int", origin = "rapidr" },
  { name = "FontColor", type = "color", origin = "rapidr" },
  { name = "FontName", type = "string", origin = "rapidr", kind = "font" },
  { name = "Smooth", type = "bool", default = false, origin = "rapidr", doc = "Whether `StretchDraw` and `CopyRect` blend when they scale. False (the default, and how a scaled copy has always been drawn) takes the nearest pixel: crisp edges, right for pixel art, an emulator's screen, a QR code. True blends the four pixels around each one (bilinear): smooth, right for photographs." },
]
methods = [
  { name = "Circle", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER, fill AS INTEGER", value = true, doc = "Draws the ellipse that fits the box from (`x1`, `y1`) to (`x2`, `y2`), the right and bottom edges left out: its outline in colour `c`, its inside in colour `fill`. `Circle(cx, cy, r [, c])` (three or four arguments) draws a circle's outline around a centre.", example = "CREATE f AS RForm\n  CREATE cv AS RCanvas\n    Width = 20: Height = 20\n  END CREATE\nEND CREATE\ncv.FillRect 0, 0, 30, 30, 0\nx1 = 2\ny1 = 2\nx2 = 12\ny2 = 8\nc = 255\nfill = 1000\ncv.Circle x1, y1, x2, y2, c, fill\nPRINT cv.Pixel(7, 2); \"|\"; cv.Pixel(7, 5); \"|\"; cv.Pixel(2, 7)", expect = "255|1000|0", arg_kinds = { c = "color", fill = "color" } },
  { name = "CopyRect", params = "D, Image, S", example = "DIM Image AS RBitmap\nImage.Width = 4: Image.Height = 4\nImage.FillRect 0, 0, 9, 9, 0\nImage.Pset 0, 0, 255: Image.Pset 3, 0, 1000\nCREATE f AS RForm\n  CREATE cv AS RCanvas\n    Width = 20: Height = 20\n  END CREATE\nEND CREATE\ncv.FillRect 0, 0, 30, 30, 0\nDIM d AS RRect: DIM s AS RRect\nd.Left = 10: d.Top = 10: d.Right = 14: d.Bottom = 14\ns.Left = 0: s.Top = 0: s.Right = 4: s.Bottom = 4\ncv.CopyRect d, Image, s\nPRINT cv.Pixel(10, 10); \"|\"; cv.Pixel(13, 10); \"|\"; cv.Pixel(10, 13)", expect = "255|1000|0" },
  { name = "Draw", params = "x AS INTEGER, y AS INTEGER, BMP", example = "DIM BMP AS RBitmap\nBMP.Width = 4: BMP.Height = 4\nBMP.FillRect 0, 0, 9, 9, 0\nBMP.Pset 0, 0, 255: BMP.Pset 3, 0, 1000\nCREATE f AS RForm\n  CREATE cv AS RCanvas\n    Width = 20: Height = 20\n  END CREATE\nEND CREATE\ncv.FillRect 0, 0, 30, 30, 0\nx = 5\ny = 2\ncv.Draw x, y, BMP\nPRINT cv.Pixel(5, 2); \"|\"; cv.Pixel(8, 2); \"|\"; cv.Pixel(2, 5)", expect = "255|1000|0" },
  { name = "FillRect", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER", value = true, doc = "Fills a rectangle from (x1,y1) to (x2,y2). Optional fill color.", example = "CREATE f AS RForm\n  CREATE cv AS RCanvas\n    Width = 20: Height = 20\n  END CREATE\nEND CREATE\nx1 = 0\ny1 = 0\nx2 = 30\ny2 = 30\nc = 0\ncv.FillRect x1, y1, x2, y2, c\ncv.FillRect 2, 1, 9, 4, 255\nPRINT cv.Pixel(8, 3); \"|\"; cv.Pixel(3, 8)", expect = "255|0", arg_kinds = { c = "color" } },
  { name = "Line", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER", value = true, doc = "Draws a line.", example = "CREATE f AS RForm\n  CREATE cv AS RCanvas\n    Width = 20: Height = 20\n  END CREATE\nEND CREATE\ncv.FillRect 0, 0, 30, 30, 0\nx1 = 1\ny1 = 2\nx2 = 9\ny2 = 2\nc = 255\ncv.Line x1, y1, x2, y2, c\nPRINT cv.Pixel(5, 2); \"|\"; cv.Pixel(2, 5)", expect = "255|0", arg_kinds = { c = "color" } },
  { name = "Paint", params = "x AS INTEGER, y AS INTEGER, c AS INTEGER, borderc AS INTEGER", example = "CREATE f AS RForm\n  CREATE cv AS RCanvas\n    Width = 20: Height = 20\n  END CREATE\nEND CREATE\ncv.FillRect 0, 0, 30, 30, 0\ncv.Rectangle 2, 2, 12, 8, 255\nx = 5\ny = 4\nc = 1000\nborderc = 255\ncv.Paint x, y, c, borderc\nPRINT cv.Pixel(5, 4); \"|\"; cv.Pixel(2, 2); \"|\"; cv.Pixel(15, 15)", expect = "1000|255|0", arg_kinds = { c = "color", borderc = "color" } },
  { name = "Pset", params = "x AS INTEGER, y AS INTEGER, c AS INTEGER", example = "CREATE f AS RForm\n  CREATE cv AS RCanvas\n    Width = 20: Height = 20\n  END CREATE\nEND CREATE\ncv.FillRect 0, 0, 30, 30, 0\nx = 3\ny = 4\nc = 255\ncv.Pset x, y, c\nPRINT cv.Pixel(3, 4); \"|\"; cv.Pixel(4, 3)", expect = "255|0", arg_kinds = { c = "color" } },
  { name = "Rectangle", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER", doc = "Draws the outline of the rectangle from (`x1`, `y1`) to (`x2`, `y2`) in colour `c`, the right and bottom edges left out (the last pixels drawn are `x2 - 1`, `y2 - 1`); its inside stays as it was. `FillRect` fills one.", example = "CREATE f AS RForm\n  CREATE cv AS RCanvas\n    Width = 20: Height = 20\n  END CREATE\nEND CREATE\ncv.FillRect 0, 0, 30, 30, 0\nx1 = 1\ny1 = 1\nx2 = 8\ny2 = 4\nc = 255\ncv.Rectangle x1, y1, x2, y2, c\nPRINT cv.Pixel(7, 1); \"|\"; cv.Pixel(1, 3); \"|\"; cv.Pixel(1, 7); \"|\"; cv.Pixel(4, 2); \"|\"; cv.Pixel(8, 2)", expect = "255|255|0|0|0", arg_kinds = { c = "color" } },
  { name = "Repaint" },
  { name = "Rotate", params = "xOrigin AS INTEGER, yOrigin AS INTEGER, Angle AS INTEGER", doc = "Turns the whole picture `Angle` degrees anticlockwise about pixel (`xOrigin`, `yOrigin`), keeping its size: each pixel takes the nearest one that turns onto it, and pixels nothing turns onto take the colour the top-left pixel had before.", example = "CREATE f AS RForm\n  CREATE cv AS RCanvas\n    Width = 20: Height = 20\n  END CREATE\nEND CREATE\ncv.FillRect 0, 0, 30, 30, 0\ncv.Pset 10, 5, 255\nxOrigin = 5\nyOrigin = 5\nAngle = 90\ncv.Rotate xOrigin, yOrigin, Angle\nPRINT cv.Pixel(5, 0); \"|\"; cv.Pixel(10, 5)", expect = "255|0" },
  { name = "RoundRect", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, x3 AS INTEGER, y3 AS INTEGER, c AS INTEGER", doc = "Draws the rectangle from (`x1`, `y1`) to (`x2`, `y2`), the right and bottom edges left out, with corners rounded by an ellipse `x3` wide and `y3` high, filled in colour `c`.", example = "CREATE f AS RForm\n  CREATE cv AS RCanvas\n    Width = 20: Height = 20\n  END CREATE\nEND CREATE\ncv.FillRect 0, 0, 30, 30, 0\nx1 = 2\ny1 = 2\nx2 = 12\ny2 = 8\nx3 = 4\ny3 = 4\nc = 255\ncv.RoundRect x1, y1, x2, y2, x3, y3, c\nPRINT cv.Pixel(2, 2); \"|\"; cv.Pixel(7, 2); \"|\"; cv.Pixel(2, 5); \"|\"; cv.Pixel(7, 5); \"|\"; cv.Pixel(12, 5)", expect = "0|255|255|255|0", arg_kinds = { c = "color" } },
  { name = "StretchDraw", params = "Rect AS RRect, BMP", doc = "Draws `BMP` scaled to fill `Rect` (its right and bottom edges left out). RapidR also takes the rectangle as four numbers: `StretchDraw x, y, w, h, BMP` draws it at (`x`, `y`), `w` wide and `h` high. Every pixel of the result takes the nearest pixel of `BMP` - crisp, as pixel art and an emulator's screen want it, and one fast pass over rows (a 256 x 192 picture at twice its size in a fraction of a millisecond). With `Smooth` True the four pixels around it are blended instead." },
  { name = "TextHeight", params = "Text AS STRING", returns = "WORD" },
  { name = "TextWidth", params = "Text AS STRING", returns = "WORD" },
  { name = "TextRect", params = "Rect AS RRect, x AS INTEGER, y AS INTEGER, S AS STRING, fc AS INTEGER, bc AS INTEGER", test = "args: 0, 0, 0, \"x\", 0, -1", doc = "Writes `S` at (`x`, `y`) in colour `fc` as TextOut does, but only the part inside `Rect` (its right and bottom edges left out) shows; a background colour `bc` fills the whole of `Rect` first, -1 leaves what is there.", example = "CREATE f AS RForm\n  CREATE cv AS RCanvas\n    Width = 20: Height = 20\n  END CREATE\nEND CREATE\ncv.FillRect 0, 0, 30, 30, 0\nDIM Rect AS RRect\nRect.Left = 0: Rect.Top = 0: Rect.Right = 10: Rect.Bottom = 10\nx = 2\ny = 2\nDIM S AS STRING = \"I\"\nfc = 255\nbc = 65280\ncv.TextRect Rect, x, y, S, fc, bc\nPRINT cv.Pixel(9, 9); \"|\"; cv.Pixel(10, 10)", expect = "65280|0", arg_kinds = { fc = "color", bc = "color" } },
  { name = "TextOut", params = "x AS INTEGER, y AS INTEGER, S AS STRING, fc AS INTEGER, bc AS INTEGER", example = "CREATE f AS RForm\n  CREATE cv AS RCanvas\n    Width = 20: Height = 20\n  END CREATE\nEND CREATE\ncv.FillRect 0, 0, 30, 30, 0\nx = 1\ny = 1\nDIM S AS STRING = \"I\"\nfc = 255\nbc = 65280\ncv.TextOut x, y, S, fc, bc\nPRINT cv.Pixel(1, 1)", expect = "65280", arg_kinds = { fc = "color", bc = "color" } },
  { name = "Cls", origin = "rapidr", doc = "Clears the canvas using the current Color." },
  { name = "FillCircle", params = "x, y, radius, [color]", origin = "rapidr", doc = "Draws a filled circle.", example = "CREATE f AS RForm\n  CREATE cv AS RCanvas\n    Width = 20: Height = 20\n  END CREATE\nEND CREATE\ncv.FillRect 0, 0, 30, 30, 0\nx = 10\ny = 12\nradius = 4\ncolor = 255\ncv.FillCircle x, y, radius, color\nPRINT cv.Pixel(10, 15); \"|\"; cv.Pixel(15, 10)", expect = "255|0", arg_kinds = { color = "color" } },
  { name = "Rect", value = true, origin = "rapidr" },
  { name = "DrawText", params = "x, y, text, [color]", value = true, origin = "rapidr", doc = "Draws text at (x, y). Optional color argument (RGB integer).", example = "CREATE f AS RForm\n  CREATE cv AS RCanvas\n    Width = 30: Height = 30\n  END CREATE\nEND CREATE\ncv.FillRect 0, 0, 30, 30, 0\nx = 2\ny = 14\nDIM text AS STRING = \"I\"\ncolor = 255\ncv.DrawText x, y, text, color\nfx = -1\nfy = -1\nFOR y = 29 TO 0 STEP -1\n  FOR x = 29 TO 0 STEP -1\n    IF cv.Pixel(x, y) = 255 THEN\n      fx = x\n      fy = y\n    END IF\n  NEXT\nNEXT\nPRINT fx >= 2 AND fx < 10; \"|\"; fy >= 14", expect = "-1|-1", arg_kinds = { color = "color" } },
  { name = "SetFont", params = "family, [size]", origin = "rapidr", doc = "Sets the font used by subsequent DrawText calls. On the web runtime this maps to ctx.font = \"<size>px <family>\". Default size 12.", example = "CREATE f AS RForm\n  CREATE cv AS RCanvas\n    Width = 20: Height = 20\n  END CREATE\nEND CREATE\ncv.FillRect 0, 0, 30, 30, 0\nDIM family AS STRING = \"Arial\"\nsize = 14\ncv.SetFont family, size\nPRINT cv.Font.Name; \"|\"; cv.Font.Size", expect = "Arial|14" },
  { name = "SetPixel", value = true, origin = "rapidr" },
  { name = "Refresh", value = true, origin = "rapidr" },
  { name = "Update", origin = "rapidr" },
  { name = "Show", value = true, origin = "rapidr" },
  { name = "Hide", value = true, origin = "rapidr" },
  { name = "Ellipse", value = true, origin = "rapidr" },
  { name = "Get", returns = "INTEGER", value = true, doc = "Takes nothing, draws and keeps nothing, and gives 0 — a Put after it doesn't bring the pixels back." },
  { name = "Put", returns = "INTEGER", value = true, doc = "Takes nothing, draws nothing and gives 0." },
  { name = "SetPixels", params = "Pixels AS VARIANT, Width AS INTEGER, Height AS INTEGER, [X AS INTEGER], [Y AS INTEGER]", origin = "rapidr", effects = ["ui"], test = "skip: needs an array", doc = "Puts a whole block of colours into the picture in one call, from an array: the `Width` x `Height` colours of `Pixels`, row by row from its first element (a one-dimensional array's element `y * Width + x` is pixel (x, y); a two-dimensional `(Height - 1, Width - 1)` array is `Pixels(y, x)`), with the block's top-left corner at (`X`, `Y`) - 0, 0 if left out. Colours are the numbers `Pset` takes (`RGB(r, g, b)`, red in the low byte). It is the fast way to draw an image from data - an emulator's video memory, an image filter, a heat map, a game of life: one call does the work of `Width * Height` calls of `Pset` (a 256 x 192 screen in well under a millisecond, not 70). The block must lie inside the picture and `Pixels` must hold enough values, or the program stops with a message that says which.", example = "CREATE f AS RForm\n  CREATE cv AS RCanvas\n    Width = 20: Height = 20\n  END CREATE\nEND CREATE\nDIM Pixels(7) AS INTEGER\nFOR i = 0 TO 7\n  Pixels(i) = (i + 1) * 10\nNEXT\nWidth = 4\nHeight = 2\nX = 1\nY = 0\ncv.SetPixels Pixels, Width, Height, X, Y\nPRINT cv.Pixel(1, 0); \"|\"; cv.Pixel(4, 0); \"|\"; cv.Pixel(1, 1); \"|\"; cv.Pixel(4, 1)", expect = "10|40|50|80" },
  { name = "SetPixels8", params = "Indexes AS VARIANT, Palette AS VARIANT, Width AS INTEGER, Height AS INTEGER, [X AS INTEGER], [Y AS INTEGER]", origin = "rapidr", effects = ["ui"], test = "skip: needs an array", doc = "Like `SetPixels`, but the array holds palette numbers: each of the `Width` x `Height` elements of `Indexes` (0 to 255, a BYTE array) picks a colour of `Palette` (an array of colours, `RGB(r, g, b)`; its first element is colour 0) - one lookup a pixel, in Rust, as a retro machine's screen memory and palette work. The block's top-left corner is at (`X`, `Y`), 0, 0 if left out. An index the palette does not have stops the program with a message that names the pixel.", example = "CREATE f AS RForm\n  CREATE cv AS RCanvas\n    Width = 20: Height = 20\n  END CREATE\nEND CREATE\nDIM Indexes(5) AS BYTE\nDIM Palette(2) AS INTEGER\nPalette(0) = 0: Palette(1) = 255: Palette(2) = 65280\nFOR i = 0 TO 5\n  Indexes(i) = i MOD 3\nNEXT\nWidth = 3\nHeight = 2\nX = 1\nY = 0\ncv.SetPixels8 Indexes, Palette, Width, Height, X, Y\nPRINT cv.Pixel(1, 0); \"|\"; cv.Pixel(2, 0); \"|\"; cv.Pixel(3, 0); \"|\"; cv.Pixel(3, 1)", expect = "0|255|65280|65280" },
  { name = "GetPixels", params = "Pixels AS VARIANT, X AS INTEGER, Y AS INTEGER, Width AS INTEGER, Height AS INTEGER", origin = "rapidr", effects = ["state"], test = "skip: needs an array", doc = "Reads a block of the picture into an array in one call: the `Width` x `Height` pixels with the top-left corner at (`X`, `Y`), row by row, into the first `Width * Height` elements of `Pixels` (an INTEGER or LONG array - colours need 24 bits). With `SetPixels` it makes an image filter: read, change the numbers, put back. The block must lie inside the picture.", example = "CREATE f AS RForm\n  CREATE cv AS RCanvas\n    Width = 20: Height = 20\n  END CREATE\nEND CREATE\ncv.FillRect 0, 0, 30, 30, 0\ncv.Pset 1, 1, 777\nDIM Pixels(3) AS INTEGER\nX = 1\nY = 1\nWidth = 2\nHeight = 2\ncv.GetPixels Pixels, X, Y, Width, Height\nPRINT Pixels(0); \"|\"; Pixels(1); \"|\"; Pixels(3)", expect = "777|0|0" },
]
events = [
  { name = "OnClick" },
  { name = "OnMouseDown", params = "Button AS INTEGER, X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnMouseMove", params = "X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnMouseUp", params = "Button AS INTEGER, X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnPaint" },
  { name = "OnDblClick" },
]

