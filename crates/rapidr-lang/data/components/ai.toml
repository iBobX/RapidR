# AI (docs/ai-architecture.md, docs/ide-ai.md §8): the registry's components (crates/rapidr-lang; src/lib.rs says how to edit).
group = "AI"

[[component]]
name = "RAI"
display = "AI"
visual = false
default_event = "OnMessage"
doc = "A conversation with an AI provider — Anthropic (Claude), OpenAI, DeepSeek, or any OpenAI-compatible server such as Ollama or LM Studio on the user's own computer. Ask sends a question; the answer streams in (OnToken), then OnMessage and OnDone; Cancel stops it. ReplyLanguage = \"auto\" keeps the answers in the user's language; a request that never reached the provider (no network for a moment) is tried once more by itself. The model is one the provider's own list gives (RefreshModels, Models, OnModelsLoaded): nothing is chosen for you. The API key is never in the program: APIKeySource says where it is kept (\"keychain:NAME\" in the OS keychain, \"env:VARIABLE\", or \"ask\": the program asks its user, OnKeyNeeded, and sets APIKey); a web page keeps it for the tab only. Each answer is capped (MaxTokens); a long conversation is summarised to stay cheap; InputTokens, OutputTokens and Usage meter it. RapidR Studio's assistant is an RAI too, with the project's tools attached (AttachComponent)."
example = """
DECLARE SUB Token(Text AS STRING)
DECLARE SUB Done(Status AS STRING)
DECLARE SUB AskClick

CREATE Form1 AS RForm
    Caption = "Ask"
    Width = 420: Height = 300
    CREATE Question AS REdit
        Left = 10: Top = 10: Width = 300
        Text = "What is RapidR?"
    END CREATE
    CREATE AskButton AS RButton
        Caption = "Ask"
        Left = 320: Top = 8: Width = 80
        OnClick = AskClick
    END CREATE
    CREATE Answer AS RMemo
        Left = 10: Top = 44: Width = 390: Height = 210
    END CREATE
END CREATE

CREATE AI AS RAI
    Provider = "compatible"
    BaseURL = "http://localhost:11434/v1"
    Model = "llama3.2"
    OnToken = Token
    OnDone = Done
END CREATE

SUB AskClick
    Answer.Text = ""
    IF AI.Ask(Question.Text) = 0 THEN ShowMessage AI.Error
END SUB

SUB Token(Text AS STRING)
    Answer.Text = Answer.Text + Text
END SUB

SUB Done(Status AS STRING)
    IF Status = "error" THEN ShowMessage AI.Error
END SUB

Form1.ShowModal
"""
properties = [
  { name = "Provider", type = "string", values = ["anthropic", "openai", "deepseek", "compatible"], category = "Network", doc = "Who answers: \"anthropic\" (Claude), \"openai\", \"deepseek\" or \"compatible\" (an OpenAI-compatible server at BaseURL: Ollama, LM Studio, xAI, OpenRouter …); \"\" for none. Changing it forgets the models listed and a key the program set." },
  { name = "Model", type = "string", category = "Network", doc = "The model that answers, as the provider names it — one of Models (RefreshModels lists the provider's: no model is chosen for you). In RapidR Studio's designer the list comes by itself once the provider has a key." },
  { name = "BaseURL", type = "string", category = "Network", doc = "Where the provider's API is: reading it gives the provider's own unless one was set; set it for an OpenAI-compatible server (\"http://localhost:11434/v1\" for Ollama, \"http://localhost:1234/v1\" for LM Studio) or a proxy that keeps the key on a server." },
  { name = "WorkspaceID", type = "string", category = "Network", doc = "Anthropic: the workspace a key that isn't made inside one works in (sent as anthropic-workspace-id); \"\" for none (ANTHROPIC_WORKSPACE_ID when set)." },
  { name = "APIKey", type = "string", editor = "secret", secret = true, category = "Network", doc = "The API key, set at run time (typed by the user, read from your own store): kept in memory only, never shown or read back (KeyHint gives its last four characters); RememberKey keeps it in the keychain. Typed in RapidR Studio's inspector it is stored in your keychain and APIKeySource names it: the key itself is never written into the program." },
  { name = "APIKeySource", type = "string", category = "Network", doc = "Where the key comes from when APIKey isn't set: \"keychain:NAME\" (the OS keychain's entry NAME; on the web, the tab's session or the device), \"env:VARIABLE\" (an environment variable; not on the web), \"ask\" (OnKeyNeeded: the program asks its user); several separated by | are tried in order (\"keychain:MyApp/OpenAI|env:OPENAI_API_KEY|ask\"). Each program's keychain entries are its own (kept under the program's own keychain service, rapidr-app:<program>:RAI): a program never reads RapidR Studio's keys (\"RapidR Studio/…\"; Error says so) or another program's." },
  { name = "KeyOwner", type = "string", design = false, category = "Network", doc = "RapidR Studio's own: the program file whose keys this RAI reads and keeps (Studio's designer keeps a key typed in the APIKey row for the program being designed). A program can't set it — its keys are always its own — and setting it there only sets Error." },
  { name = "System", type = "string", category = "Behavior", editor = "multiline", doc = "The program's instructions to the model (its role, its tone, what it must not do), sent before the conversation." },
  { name = "ReplyLanguage", type = "string", design = false, category = "Behavior", doc = "The language the answers are in: \"\" (the default) says nothing of it — the model chooses, as a translator needs; \"auto\" follows the language of the user's latest message (kept while a message says too little to tell, \"ok\"; the program's Application.Language, else the system's, before the first), RapidR Studio's assistant's; a language's English name (\"Spanish\") always that one. Every request ends by saying it, and a long conversation's summary is written in it, so a model never drifts into another language." },
  { name = "UserLanguage", type = "string", access = "read", design = false, doc = "The language of the user's latest message, as RAI reads it (\"English\", \"Spanish\" …; kept while a message says too little to tell); \"\" before it can tell." },
  { name = "MaxTokens", type = "int", default = 1024, range = "16..128000", unit = "count", category = "Behavior", doc = "The longest an answer may be, in tokens: the provider stops there (each answer's cost cap). Never more than the model's context window leaves: when the provider's models list gives the window (local servers do), an answer gets at most a quarter of it, and 4,096 tokens at most from a server on this computer; an OpenAI-compatible server that doesn't give it, 4,096." },
  { name = "SummaryAt", type = "int", default = 0, range = "0..1000000", unit = "count", category = "Behavior", doc = "Once a question sends more tokens than this, the conversation so far is summarised in one short request (your request kept word for word), and the next questions start from the summary. 0 (the default): 70% of the model's context window (40,000 when the window isn't known)." },
  { name = "Audit", type = "bool", default = false, category = "Behavior", doc = "True: every request, tool call and decision is written to the local audit log (AuditLog reads it; never a key or a file's content)." },
  { name = "PriceIn", type = "float", default = 0.0, range = "0..", category = "Data", doc = "What the provider charges for a million tokens sent (see its prices: PricingURL), for Cost; 0 for no estimate." },
  { name = "PriceOut", type = "float", default = 0.0, range = "0..", category = "Data", doc = "What the provider charges for a million tokens received, for Cost." },
  { name = "Busy", type = "bool", access = "read", design = false, doc = "True while a request runs (an answer, the models list)." },
  { name = "Error", type = "string", access = "read", design = false, doc = "Why the last request or call failed, in plain words with what to do (\"\" when it worked)." },
  { name = "Status", type = "string", access = "read", design = false, doc = "One sentence on what it is doing or did, for a status line a screen reader announces." },
  { name = "Answer", type = "string", access = "read", design = false, doc = "The last answer's text." },
  { name = "Effort", type = "string", values = ["", "low", "medium", "high"], category = "Behavior", doc = "How hard the model thinks before it answers: \"\" (the default) as the model usually does; \"low\", \"medium\" or \"high\" ask for more thinking where the provider has it — Anthropic's adaptive thinking at that effort (a thinking budget on older models), an OpenAI-compatible reasoning_effort; DeepSeek's models choose for themselves. More thinking takes longer and costs more: each answer may use up to 16,384 more tokens at high. The answer's reasoning, when the provider shows it, is in Transcript as \"Thought for N s\" (ToggleThought shows it). A model that takes none says so once and answers as usual (EffortSupported)." },
  { name = "EffortSupported", type = "bool", access = "read", design = false, doc = "True when Provider and Model take an Effort (False for DeepSeek, and for a model that refused one)." },
  { name = "ChatState", type = "string", design = false, doc = "The conversation as JSON — its messages, its transcript, its questions, the answers' reasoning, the user's language — to keep (a file, a database) and set back later, in this run or the next: setting it replaces the conversation (an answer being written stops). API keys and tokens in it are removed (\"[key removed]\"), as are the program's secrets. RapidR Studio keeps its chats this way." },
  { name = "Editable", type = "bool", default = false, design = false, doc = "True: Transcript has an Edit link under each question (rai:edit/N) and Retry under the last answer (rai:retry), for an RMarkdownView's OnLinkClick: the program calls Rewind and asks again. RapidR Studio's chat." },
  { name = "QuestionCount", type = "int", access = "read", design = false, doc = "How many questions the conversation has (QuestionText and Rewind number them from 1)." },
  { name = "Activity", type = "string", access = "read", design = false, doc = "What it is doing now, in words, while Busy: \"Thinking\", \"Writing the answer\", what an attached tool does (\"Reading main.rr\", \"Reading the help of RListBox\", \"Writing server.rr (+318 lines)\", \"Checking (compiling)\", \"Searching the manual\"), \"Fixing 2 problems\" after a check found them, \"Continuing (part 2)\" after an answer reached its length limit, \"Compacting the conversation\" or \"Summarising the chat to keep it short\"; \"\" when idle. OnUpdate fires when it changes." },
  { name = "Elapsed", type = "int", access = "read", design = false, unit = "s", doc = "Seconds since the answer (or Compact) began; 0 when idle. A timer shows it ticking." },
  { name = "Quiet", type = "int", access = "read", design = false, unit = "s", doc = "Seconds since the provider last sent anything while an answer runs (0 when idle): past 30, say \"No answer from the model for 30 s: wait, or Stop\"." },
  { name = "ContextTokens", type = "int", access = "read", design = false, unit = "count", doc = "The conversation's size in tokens as the next question would send it (the instructions, tools, messages and the last reply): the last request's as the provider counted it, else estimated. With ContextLimit, a context meter." },
  { name = "ContextLimit", type = "int", access = "read", design = false, unit = "count", doc = "Where the conversation is compacted by itself: SummaryAt, or 70% of the model's context window when that is less." },
  { name = "ContextWindow", type = "int", access = "read", design = false, unit = "count", doc = "The model's context window in tokens, when the provider's models list says it (0 when not)." },
  { name = "Lite", type = "bool", access = "read", design = false, doc = "True when the last request went to a model of a small window (under 16,384 tokens): the attached tools sent their lite instructions and tools, so a small local model can start." },
  { name = "Transcript", type = "string", access = "read", design = false, doc = "The conversation as Markdown, for an RMarkdownView: the questions, the answers as they stream, the facts the attached tools report as cards (a small heading each: a program created, a change proposed), a muted line in place of a reply that claimed a change before any tool made it, a muted \"Answer was long: continuing (part 2 of up to 5)\" where an answer reached its length limit and RAI went on by itself (a \"Continue in smaller steps\" link, rai:continue, if it finally stopped), a \"✓ 6 steps · show\" link under a finished answer (rai:steps/N), and under each closed code block \"Copy · Insert\" links (rai:copy/N, rai:insert/N; Insert for RapidR code, which is coloured as the code editor colours it, a block with no language that looks like RapidR's included)." },
  { name = "Steps", type = "string", access = "read", design = false, doc = "What the attached tools did in the current (or last) answer, a line each (\"Read main.rr (40 lines)\"): a progress checklist while it works." },
  { name = "TurnInputTokens", type = "int", access = "read", design = false, unit = "count", doc = "The tokens sent so far in the current (or last) answer, all its requests: the provider's count, updated while the answer streams in." },
  { name = "TurnCachedTokens", type = "int", access = "read", design = false, unit = "count", doc = "Of TurnInputTokens, those the provider read from its cache (charged far less), so far in the current (or last) answer." },
  { name = "TurnOutputTokens", type = "int", access = "read", design = false, unit = "count", doc = "The tokens received so far in the current (or last) answer: the provider's count, or — while it reports few, before the end — an estimate from the characters that came, so a counter beside the answer moves as it is written." },
  { name = "Part", type = "int", access = "read", design = false, doc = "Which part of its answer RAI is on: 1, then 2 … when an answer reached its length limit and RAI went on by itself (at most MaxParts)." },
  { name = "MaxParts", type = "int", access = "read", design = false, doc = "How many parts an answer may come in (5): the first and four continuations. Past them RAI stops and says so, with a way to go on in smaller steps." },
  { name = "Models", type = "string", access = "read", design = false, doc = "The models RefreshModels found, a line each — the id, its name, and a hint from the words of its name (\"fast · low cost\" for the small ones, \"costs more\" for the largest), separated by tabs —, the fast, low-cost ones first." },
  { name = "ModelCount", type = "int", access = "read", design = false, doc = "How many models Models lists." },
  { name = "HasKey", type = "bool", access = "read", design = false, doc = "True when there is a key: APIKey's, or one APIKeySource finds." },
  { name = "KeyHint", type = "string", access = "read", design = false, doc = "The key's last four characters (\"…abcd\"): all that is ever shown of it." },
  { name = "KeySource", type = "string", access = "read", design = false, doc = "Where the key comes from now: \"program\" (APIKey), \"stored\" (the keychain; on the web, this device), \"session\", \"environment\", or \"\"." },
  { name = "KeyEnv", type = "string", access = "read", design = false, doc = "The environment variable the provider's key is usually in (\"OPENAI_API_KEY\"), for APIKeySource." },
  { name = "KeyStore", type = "string", access = "read", design = false, doc = "Where the key in use is, in words (\"the macOS Keychain\", \"this browser tab, until it closes\", \"this program's memory, until it ends\"); with no key, where RememberKey keeps one." },
  { name = "NeedsKey", type = "bool", access = "read", design = false, doc = "True when Provider needs an API key (a local server doesn't)." },
  { name = "PricingURL", type = "string", access = "read", design = false, doc = "The provider's prices (\"\" for a compatible server)." },
  { name = "KeysURL", type = "string", access = "read", design = false, doc = "Where a key is made at the provider." },
  { name = "Providers", type = "string", access = "read", design = false, doc = "The providers, a line each: the id, the name and a short name, separated by tabs." },
  { name = "Presets", type = "string", access = "read", design = false, doc = "Base URLs for an OpenAI-compatible server, a line each: a label and the URL, separated by a tab." },
  { name = "InputTokens", type = "int", access = "read", design = false, doc = "The tokens sent this session (questions, instructions, what tools read)." },
  { name = "OutputTokens", type = "int", access = "read", design = false, doc = "The tokens received this session." },
  { name = "CachedTokens", type = "int", access = "read", design = false, doc = "Of InputTokens, those the provider read from its cache (charged far less)." },
  { name = "Usage", type = "string", access = "read", design = false, doc = "The session's tokens in words, with Cost's estimate when PriceIn / PriceOut are set." },
  { name = "Cost", type = "string", access = "read", design = false, doc = "The session's cost estimated from PriceIn and PriceOut (\"$0.0123\"; \"\" without prices)." },
  { name = "LastRequest", type = "string", access = "read", design = false, doc = "What was sent last: the method, the URL, the headers (the key never shown) and the JSON body." },
  { name = "ToolCalls", type = "int", access = "read", design = false, doc = "How many tool calls the last answer made (at most 25)." },
  { name = "AuditLocation", type = "string", access = "read", design = false, doc = "Where the audit log is kept (a file in the user's settings folder; on the web, the browser's storage for the page)." },
]
methods = [
  { name = "Ask", params = "Text AS STRING", returns = "INTEGER", effects = ["network"], test = "skip: talks to an AI provider", doc = "Sends Text, with the conversation so far, to Provider's Model and returns at once: the answer streams in (OnToken), then OnMessage with the whole of it and OnDone. False when it can't ask (no provider, key or model: Error says which; no key fires OnKeyNeeded)." },
  { name = "Cancel", value = true, effects = ["state"], doc = "Stops the answer being written (what came so far stays) or the models list being fetched: OnDone(\"cancelled\")." },
  { name = "NewChat", value = true, effects = ["state"], doc = "Starts a new conversation: the messages and the transcript go (the usage stays)." },
  { name = "RefreshModels", returns = "INTEGER", value = true, effects = ["network"], test = "skip: talks to an AI provider", doc = "Asks Provider which models the key can use (OpenAI's chat models only): OnModelsLoaded(Count) when Models has them, OnError when not — a refused key, no answer within 30 seconds (10 to connect) … in plain words. A Model the list no longer has is cleared: choose again. Asked again, the newer request replaces the one on its way; changing Provider, BaseURL, WorkspaceID, APIKey or APIKeySource drops it too (OnDone(\"cancelled\")). True when it started." },
  { name = "RememberKey", params = "[OnThisDevice AS INTEGER]", returns = "INTEGER", effects = ["registry"], test = "skip: writes the user's keychain", doc = "Keeps APIKey in the keychain under APIKeySource's keychain NAME, for the next runs. On the web it is kept for the tab, and on this device too when OnThisDevice is True (the page's storage: anyone using this browser profile could read it). True when it was kept." },
  { name = "ForgetKey", value = true, effects = ["registry"], test = "skip: writes the user's keychain", doc = "Removes the key kept under APIKeySource's keychain NAME, and APIKey's." },
  { name = "Compact", returns = "INTEGER", value = true, effects = ["network"], test = "skip: talks to an AI provider", doc = "Summarises the conversation now, in one short request; the next questions start from the summary (a long chat costs less). Status then says how much smaller it is; the questions before it can't be edited any more. False when it can't (answering, a short chat: Error says why)." },
  { name = "Rewind", params = "Question AS INTEGER", returns = "STRING", effects = ["state"], doc = "Takes question Question (from 1) and everything after it out of the conversation and the transcript, and returns its text — to edit it and ask again, or to Retry the last. \"\" when it can't (answering; a question from before the conversation was compacted): Error says why. Keep ChatState first to keep what is taken out." },
  { name = "QuestionText", params = "Question AS INTEGER", returns = "STRING", effects = ["none"], doc = "Question Question's text (from 1), as the user asked it." },
  { name = "ToggleSteps", params = "Index AS INTEGER", effects = ["state"], doc = "Lists or hides the steps of answer Index in Transcript (rai:steps/Index, the \"✓ 6 steps\" link under a finished answer)." },
  { name = "CodeBlock", params = "Index AS INTEGER", returns = "STRING", doc = "The text of code block Index (from 1) of the answers, in the order Transcript numbers them (its Copy and Insert links, rai:copy/Index and rai:insert/Index): a program asks for it to copy or insert. \"\" when there is no such block." },
  { name = "ToggleThought", params = "Index AS INTEGER", effects = ["state"], doc = "Shows or hides answer Index's reasoning in Transcript (rai:thought/Index, the \"Thought for N s\" link)." },
  { name = "AttachComponent", params = "Component AS RAIProjectTools, Kind AS STRING", returns = "INTEGER", effects = ["state"], doc = "Gives the model a component's tools of Kind (an RAIProjectTools' \"project\": RapidR Studio's assistant). True when attached; Error says why not." },
  { name = "ModelName", params = "Index AS INTEGER", returns = "STRING", effects = ["none"], doc = "Model Index's id in Models (from 0), for a list's choice." },
  { name = "AuditLog", params = "[Count AS INTEGER]", returns = "STRING", effects = ["file-read"], doc = "The audit log's last Count lines (50 by default), oldest first, tab-separated: the time, what happened, its target, and the decision or result." },
]
events = [
  { name = "OnToken", params = "Text AS STRING", doc = "More of the answer arrived (a few words at a time): add it to what shows." },
  { name = "OnMessage", params = "Text AS STRING", doc = "The model's message is whole (an answer; before a tool is used, what it said)." },
  { name = "OnDone", params = "Status AS STRING", doc = "A request ended: \"ok\", \"error\" (Error says why) or \"cancelled\"." },
  { name = "OnUpdate", doc = "Transcript changed: an answer streaming, a tool used, a decision recorded." },
  { name = "OnModelsLoaded", params = "Count AS INTEGER", doc = "RefreshModels found Count models: they're in Models." },
  { name = "OnError", params = "Message AS STRING", doc = "A request failed: Message says why and what to do." },
  { name = "OnKeyNeeded", doc = "There is no key yet (APIKeySource found none, or says \"ask\"): ask the user for one and set APIKey, then ask again." },
]

[[component]]
name = "RWINDOWCAPTURE"
display = "WindowCapture"
visual = false
doc = "The program's own eyes: a picture of its windows as they show now — one window, or all of them side by side — saved as a PNG (a BMP when the name ends in .bmp), with each window's title bar drawn or without, at the screen's scale (sharp on a high-DPI screen) or at 1× (one picture pixel per program pixel); and a layout report of its forms as they are laid out now — each component's name, type, caption, text, place and size, whether it shows, is enabled and has the keyboard — with what a person would see wrong: a caption cut off, two controls on top of each other, a control past its window's edge. Only the program's own windows, ever: never the screen, the desktop or another program, so it needs no Screen Recording permission. Use it for a \"save as picture\" command, a bug report with a picture, help pages made from the program itself, or a self-check (Problems) after a layout change. RapidR Studio's AI tools look at a running program the same way (app_screenshot, app_layout). Recording a video of the windows comes later. Pictures and clicks of a program show and do what its users' data and buttons are: tell users what is captured, and never record or automate without their knowledge. RapidR's own."
example = """
CREATE Form1 AS RForm
    Caption = "Snapshot"
    Width = 300: Height = 160
    CREATE Info AS RLabel
        Caption = "Hello from my program"
        Left = 20: Top = 20
    END CREATE
END CREATE
DIM Eyes AS RWindowCapture
Eyes.Scale = 1
Form1.Show
IF Eyes.SaveToFile("snapshot.png", "Form1") THEN PRINT "saved"; Eyes.Width; " x"; Eyes.Height ELSE PRINT Eyes.Error
PRINT Eyes.LayoutReport("Form1")
"""
properties = [
  { name = "Scale", type = "float", default = 0, range = "0..4", doc = "How big the pictures are: 0 (the default) at the screen's scale — sharp on a high-DPI screen, twice the program's pixels on a Retina one —, 1 one picture pixel per program pixel, 2 twice …" },
  { name = "Frame", type = "bool", default = true, doc = "Each window drawn with its frame and title bar (as RapidR draws a window's on the web and in the form designer): its title shows which window it is. False: its inside only (what Form.SaveImage saves)." },
  { name = "Width", type = "int", access = "read", design = false, unit = "px", doc = "The last picture's width in pixels." },
  { name = "Height", type = "int", access = "read", design = false, unit = "px", doc = "The last picture's height in pixels." },
  { name = "Windows", type = "string", access = "read", design = false, doc = "The program's windows that show now, back to front, one a line: the form's name and its title, a TAB between." },
  { name = "Error", type = "string", access = "read", design = false, doc = "Why the last call failed (\"\" when it worked): no such window (the message lists the program's windows), nothing shown, a file that can't be written." },
]
methods = [
  { name = "SaveToFile", params = "FileName AS STRING, [Window AS STRING]", returns = "INTEGER", effects = ["file-write"], arg_kinds = { FileName = "file:image" }, test = "skip: needs a shown window", doc = "Saves a picture of Window — a form's name or its title — or, when none is given (or \"all\"), of every window that shows, side by side from the back one to the front one: a PNG file, a BMP when FileName ends in .bmp. True when it was saved; False when not (Error says why). The program's own windows only." },
  { name = "LayoutReport", params = "[Window AS STRING]", returns = "STRING", effects = ["none"], test = "skip: needs a shown window", doc = "The forms that show (or Window only) in words, a line a component: `b7 (RButton) \"7\" at 8,60 size 56×36`, places in the window's inside; then the problems a person would see, or that there are none." },
  { name = "LayoutJson", params = "[Window AS STRING]", returns = "STRING", effects = ["none"], test = "skip: needs a shown window", doc = "The same report as JSON: {\"windows\": [{name, type, title, x, y, width, height, front, modal, components: [{name, type, caption, text, x, y, width, height, visible, enabled, focused, parent}], problems: […]}]} — for a program that reads it (RJson)." },
  { name = "Problems", params = "[Window AS STRING]", returns = "STRING", effects = ["none"], test = "skip: needs a shown window", doc = "Only what looks wrong, one problem a line (\"\" when nothing does): a caption cut off, controls on top of each other, a control past its window's edge or outside it — each with its numbers and what to do." },
]
events = []

[[component]]
name = "RAPPHANDS"
display = "AppHands"
visual = false
default_event = "OnDone"
doc = "The program's own hands: clicks, typing, keys, drags and the wheel played into its own windows as a person's would be — through the same routing, so its handlers run as for the user — with a visible pointer that glides to what it clicks (a ring shows each click; with the system's reduced motion it jumps). Components are named as a person finds them: their name, what they show (\"OK\", \"7\": a button's caption), or the label beside an edit (\"label:Name\"); force one with `name:`, `caption:` or `label:`. Each call queues the action and returns its number at once; OnDone(Id, Ok, Text) says how it went in a sentence — or what is there instead (\"No button shows \\\"Go\\\". Buttons now: Start, Reset.\"). Only the program's own windows: the system's mouse and keyboard are never touched, nothing outside the program can be, and no Accessibility permission is needed. Use it for guided tours and demos, a \"show me\" button in help, self-tests, or macros. A program that drives itself acts as its user: everything its buttons do can happen. Pictures and clicks of a program show and do what its users' data and buttons are: tell users what is captured, and never record or automate without their knowledge. RapidR's own."
example = """
DECLARE SUB Done(Id AS INTEGER, Ok AS INTEGER, Text AS STRING)
DECLARE SUB AddOne
DIM Count AS INTEGER
CREATE Form1 AS RForm
    Caption = "Counter"
    Width = 260: Height = 140
    CREATE Total AS RLabel
        Caption = "0"
        Left = 20: Top = 20
    END CREATE
    CREATE AddButton AS RButton
        Caption = "Add one"
        Left = 20: Top = 50: Width = 100
        OnClick = AddOne
    END CREATE
END CREATE
CREATE Hands AS RAppHands
    OnDone = Done
END CREATE
SUB AddOne
    Count = Count + 1
    Total.Caption = STR$(Count)
END SUB
SUB Done(Id AS INTEGER, Ok AS INTEGER, Text AS STRING)
    PRINT Text
END SUB
