[[component]]
name = "RJSON"
visual = false
doc = "JSON parsing and generation component. Supports parse, stringify, prettify, dot-path get/set, file I/O, and key enumeration."
properties = [
  { name = "Text", type = "string" },
  { name = "FileName", type = "string" },
  { name = "Count", type = "int" },
]
methods = [
  { name = "Parse", params = "jsonString", doc = "Parses a JSON string into the internal store. Returns 1 on success, 0 on error.", value = true },
  { name = "Stringify", doc = "Returns the stored JSON as a compact string.", value = true },
  { name = "Prettify", doc = "Returns the stored JSON as a pretty-printed string with indentation.", value = true },
  { name = "Get", params = "path", doc = "Returns the value at the dot-path (e.g. \"user.name\" or \"items.0\"). Returns \"\" if not found." },
  { name = "Set", params = "path, value", doc = "Sets the value at the dot-path, creating intermediate objects as needed." },
  { name = "Has", params = "path", doc = "Returns 1 if the path exists, 0 otherwise.", value = true },
  { name = "Remove", params = "path", doc = "Removes the key at the given path.", value = true },
  { name = "Keys", doc = "Returns a comma-separated list of top-level keys.", value = true },
  { name = "LoadFile", params = "filename", doc = "Loads and parses a JSON file. Returns 1 on success, 0 on error.", value = true },
  { name = "SaveFile", params = "filename", doc = "Saves the stored JSON to a file (pretty-printed). Returns 1 on success, 0 on error.", value = true },
  { name = "Clear", doc = "Clears the stored JSON data.", value = true },
]
events = []

