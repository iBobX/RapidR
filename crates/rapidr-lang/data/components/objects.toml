# Non-visual objects: the registry's components (crates/rapidr-lang; src/lib.rs says how to edit).
group = "Non-visual objects"

[[component]]
name = "RTIMER"
display = "Timer"
rapidq = "QTIMER"
visual = false
default_event = "OnTimer"
doc = "Runs its OnTimer handler every Interval milliseconds while Enabled."
properties = [
  { name = "Enabled", type = "bool", default = true },
  { name = "Interval", type = "int", default = 1000 },
  { name = "Tag", type = "int" },
]
methods = []
events = [
  { name = "OnTimer", params = "Sender AS RTimer" },
]

