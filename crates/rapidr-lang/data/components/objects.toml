[[component]]
name = "RJSON"
display = "Json"
visual = false
doc = "Parses and builds JSON: get and set values by dotted path, list keys, pretty-print, load and save files. RapidR's own."
properties = [
  { name = "Text", type = "string", default = "" },
  { name = "FileName", type = "string", default = "" },
  { name = "Count", type = "int", default = 0 },
]
methods = [
  { name = "Parse", params = "jsonString", value = true, doc = "Parses a JSON string into the internal store. Returns 1 on success, 0 on error." },
  { name = "Stringify", value = true, doc = "Returns the stored JSON as a compact string." },
  { name = "Prettify", value = true, doc = "Returns the stored JSON as a pretty-printed string with indentation." },
  { name = "Get", params = "path", doc = "Returns the value at the dot-path (e.g. \"user.name\" or \"items.0\"). Returns \"\" if not found." },
  { name = "Set", params = "path, value", doc = "Sets the value at the dot-path, creating intermediate objects as needed." },
  { name = "Has", params = "path", value = true, doc = "Returns 1 if the path exists, 0 otherwise." },
  { name = "Remove", params = "path", value = true, doc = "Removes the key at the given path." },
  { name = "Keys", value = true, doc = "Returns a comma-separated list of top-level keys." },
  { name = "LoadFile", params = "filename", value = true, doc = "Loads and parses a JSON file. Returns 1 on success, 0 on error." },
  { name = "SaveFile", params = "filename", value = true, doc = "Saves the stored JSON to a file (pretty-printed). Returns 1 on success, 0 on error." },
  { name = "Clear", value = true, doc = "Clears the stored JSON data." },
]
events = []

