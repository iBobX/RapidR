[[component]]
name = "RARCHIVE"
display = "Archive"
visual = false
doc = "Opens zip, 7z, tar, tar.gz, .gz, .xz and .zst files — the format found from their first bytes, not their name — lists what they hold and unpacks it: one file's bytes into a string or a stream, to a file, or everything into a folder. Makes zip, tar, tar.gz and .gz files. An archive is untrusted: MaxSize and MaxRatio stop a zip bomb, ExtractAll never writes outside its folder (a name with `..`, an absolute path or a drive stops it before anything is written; links are never extracted), encrypted entries are refused. RAR files are refused: it's a closed, proprietary format. Every call leaves Error \"\" when it worked, else says why. The same on the desktop, native builds and the web (where files are the page's). RapidR's own."
example = """
DIM Mem AS RMemoryStream
DIM Zip AS RArchive
Zip.CreateStream Mem, "zip"
Zip.AddText "hello.txt", "Hello from RapidR"
Zip.Close
IF Zip.OpenStream(Mem) THEN PRINT Zip.Format; " "; Zip.Count; " "; Zip.Name(0); ": "; Zip.ExtractText(0)
"""
properties = [
  { name = "Count", type = "int", access = "read", design = false, doc = "How many entries (files and folders) the open archive holds, or the archive being made; 0 with none." },
  { name = "Format", type = "string", access = "read", design = false, doc = "The open archive's format, from its first bytes: \"zip\", \"7z\", \"tar\", \"tar.gz\", \"gzip\" (one file), \"tar.xz\", \"xz\", \"tar.zst\", \"zstd\"; or the one being made; \"\" with none." },
  { name = "FileName", type = "string", access = "read", design = false, kind = "file:any", doc = "The file Open opened or Create makes; \"\" for a stream, data or a resource." },
  { name = "Error", type = "string", access = "read", design = false, doc = "Why the last call failed, in plain words (not an archive, a zip bomb, a name outside the folder, encrypted, damaged); \"\" when it worked." },
  { name = "MaxSize", type = "int", default = 1073741824, range = "0..", unit = "bytes", category = "Behavior", doc = "The most an archive may unpack to: one entry, all of ExtractAll, a whole .tar.gz at Open; also the most an archive being made may hold. 1 GB by default (256 MB in a browser). More is an error, not a full memory: a zip bomb stops here." },
  { name = "MaxRatio", type = "int", default = 1000, range = "0..1000000", category = "Behavior", doc = "The most an entry larger than 1 MB may grow when unpacked (unpacked size ÷ packed size): real files rarely pass 100, a zip bomb passes thousands. 0: no ratio check (MaxSize still holds)." },
  { name = "Level", type = "int", default = 6, range = "0..9", doc = "How hard Create packs: 0 stores (fastest), 9 is the smallest; 6 by default." },
  { name = "CaseSensitive", type = "bool", default = false, category = "Behavior", doc = "Whether Find and an entry named in Extract tell \"Game.Z80\" from \"game.z80\" (False by default: either finds it)." },
]
methods = [
  { name = "Open", params = "FileName AS STRING", returns = "INTEGER", effects = ["file-read", "state"], arg_kinds = { FileName = "file:any" }, doc = "Opens an archive file (or a `$RESOURCE` built into the program: its handle), whatever its extension says. True when it opened; False when it isn't an archive RapidR reads, is damaged or encrypted (Error says which). A .gz, .xz or .zst holding one file is an archive of one entry." },
  { name = "OpenStream", params = "Stream AS RMemoryStream", returns = "INTEGER", effects = ["state"], arg_kinds = { Stream = "component:RMEMORYSTREAM|RFILESTREAM" }, doc = "Opens the archive a stream holds (all of it, wherever its Position is): one downloaded into a memory stream, or a file stream's." },
  { name = "OpenData", params = "Bytes AS STRING", returns = "INTEGER", effects = ["state"], doc = "Opens the archive in a string of bytes (one character a byte: what a download or ReadBinStr gives)." },
  { name = "FormatOf", params = "FileName AS STRING", returns = "STRING", effects = ["file-read"], arg_kinds = { FileName = "file:any" }, doc = "What a file is, from its first bytes, without opening it: \"zip\", \"7z\", \"tar\", \"gzip\", \"xz\", \"zstd\", \"rar\", \"bzip2\" …, or \"\" when it's no archive (a .z80 snapshot, a picture, a text). So a program takes a .z80 or an archive holding one alike." },
  { name = "Close", returns = "INTEGER", value = true, effects = ["file-write"], doc = "Writes the archive Create or CreateStream began (to its file or stream) and lets go of an open one. True when it worked." },
  { name = "Find", params = "Name AS STRING", returns = "INTEGER", value = true, effects = ["none"], doc = "The index (0 the first) of the entry with this name (folders with `/` or `\\`; \"Roms/Game.z80\" finds \"roms/game.z80\" unless CaseSensitive); -1 when there's none." },
  { name = "Name", params = "Entry AS VARIANT", returns = "STRING", effects = ["none"], doc = "An entry's name, its folders before it with `/` (\"roms/game.z80\"); \"\" for an index outside 0 … Count - 1. An entry is its index or its name, here and in the other entry methods." },
  { name = "Size", params = "Entry AS VARIANT", returns = "LONG", effects = ["none"], doc = "An entry's size unpacked, in bytes, as the archive says (Extract checks the real one)." },
  { name = "CompressedSize", params = "Entry AS VARIANT", returns = "LONG", effects = ["none"], doc = "An entry's size packed, in bytes (a .tar.gz's entries share one stream: their size)." },
  { name = "IsFolder", params = "Entry AS VARIANT", returns = "INTEGER", effects = ["none"], doc = "True when the entry is a folder." },
  { name = "IsEncrypted", params = "Entry AS VARIANT", returns = "INTEGER", effects = ["none"], doc = "True when the entry is protected by a password: RArchive lists it but doesn't unpack it." },
  { name = "DateTime", params = "Entry AS VARIANT", returns = "STRING", effects = ["none"], doc = "When the entry was last changed, local time, as \"2026-10-29 14:05:00\" (it sorts as text); \"\" when the archive doesn't say." },
  { name = "Extract", params = "Entry AS VARIANT", returns = "STRING", effects = ["state"], doc = "An entry's bytes as a string, one character a byte (LEN is its size; ASC(MID$(…)) a byte; a stream's WriteBinStr writes it back). \"\" with Error set when it can't: a folder gives \"\" and no error." },
  { name = "ExtractText", params = "Entry AS VARIANT", returns = "STRING", effects = ["state"], doc = "An entry as text: UTF-8 (a byte-order mark dropped) when it is, else one character a byte." },
  { name = "ExtractToStream", params = "Entry AS VARIANT, Stream AS RMemoryStream", returns = "INTEGER", effects = ["state"], arg_kinds = { Stream = "component:RMEMORYSTREAM|RFILESTREAM" }, doc = "Writes an entry's bytes into a stream at its Position (as WriteBinStr does), Position after them. True when it worked." },
  { name = "ExtractToFile", params = "Entry AS VARIANT, FileName AS STRING", returns = "INTEGER", effects = ["file-write"], risk = "irreversible", arg_kinds = { FileName = "file:any" }, test = "args: 0, \"rapidr-conformance-extract.tmp\"", doc = "Writes an entry to the file you name (replacing one already there); the file is written only once the whole entry is unpacked and checked. True when it worked." },
  { name = "ExtractAll", params = "Folder AS STRING", returns = "INTEGER", effects = ["file-write"], risk = "irreversible", arg_kinds = { Folder = "file:any" }, test = "args: \"rapidr-conformance-extract\"", doc = "Unpacks everything into a folder (made if needed; files already there are replaced). Every name is checked and everything unpacked first, so a name that would leave the folder (`..`, an absolute path, a drive, a device), an encrypted entry or a zip bomb writes nothing; links and devices are never extracted, and nothing is written through a link already in the folder. True when it worked." },
  { name = "Create", params = "FileName AS STRING, [Format AS STRING]", returns = "INTEGER", effects = ["state"], arg_kinds = { FileName = "file:any" }, test = "args: \"rapidr-conformance.zip\"", doc = "Begins a new archive, written to the file on Close: its format the file's extension (.zip, .tar, .tar.gz or .tgz, .gz) or `Format` (\"zip\", \"tar\", \"tar.gz\", \"gzip\"). Entries are added with AddFile, AddText, AddData, AddStream and AddFolder; a .gz holds one file." },
  { name = "CreateStream", params = "Stream AS RMemoryStream, [Format AS STRING]", returns = "INTEGER", effects = ["state"], arg_kinds = { Stream = "component:RMEMORYSTREAM|RFILESTREAM" }, doc = "Begins a new archive (a zip unless `Format` says) written into a stream on Close, at its Position." },
  { name = "AddFile", params = "FileName AS STRING, [NameInArchive AS STRING]", returns = "INTEGER", effects = ["file-read", "state"], arg_kinds = { FileName = "file:any" }, doc = "Adds a file (or a `$RESOURCE`'s handle) under its own name, no folders, or `NameInArchive` (\"roms/game.z80\": folders with `/`). An entry already of that name is replaced." },
  { name = "AddText", params = "NameInArchive AS STRING, Text AS STRING", returns = "INTEGER", effects = ["state"], doc = "Adds text as a file, in UTF-8 (every language's letters kept)." },
  { name = "AddData", params = "NameInArchive AS STRING, Bytes AS STRING", returns = "INTEGER", effects = ["state"], doc = "Adds a string of bytes as a file, one character a byte (what Extract gives back)." },
  { name = "AddStream", params = "NameInArchive AS STRING, Stream AS RMemoryStream", returns = "INTEGER", effects = ["state"], arg_kinds = { Stream = "component:RMEMORYSTREAM|RFILESTREAM" }, doc = "Adds all of a stream's bytes as a file (wherever its Position is)." },
  { name = "AddFolder", params = "Folder AS STRING, [NameInArchive AS STRING]", returns = "INTEGER", effects = ["file-read", "state"], arg_kinds = { Folder = "file:any" }, doc = "Adds a folder on disk and everything in it, under its own name or `NameInArchive` (\"\" or \".\": its contents at the top). Links aren't followed. Not in a browser (no folders there): add each file." },
]
events = []

[[component]]
name = "RBITMAP"
display = "Bitmap"
rapidq = "QBITMAP"
visual = false
doc = "A picture in memory to draw on and draw from: load and save images, draw with the canvas methods."
properties = [
  { name = "BMP", type = "picture" },
  { name = "BMPHandle", type = "resource", access = "write", design = false },
  { name = "CopyMode", type = "enum", values = ["cmBlackness", "cmDstInvert", "cmMergeCopy", "cmMergePaint", "cmNotSrcCopy", "cmNotSrcErase", "cmPatCopy", "cmPatInvert", "cmPatPaint", "cmSrcAnd", "cmSrcCopy", "cmSrcErase", "cmSrcInvert", "cmSrcPaint", "cmWhiteness"], default = "cmSrcCopy" },
  { name = "Empty", type = "int", access = "read", design = false },
  { name = "Font", type = "font", access = "write", design = false },
  { name = "Handle", type = "int", design = false },
  { name = "Height", type = "int" },
  { name = "Monochrome", type = "int" },
  { name = "Pixel", type = "int", design = false, indexed = 2 },
  { name = "PixelFormat", type = "enum", values = ["pfDevice", "pf1bit", "pf4bit", "pf8bit", "pf15bit", "pf16bit", "pf24bit", "pf32bit"], default = "pfDevice" },
  { name = "Top", type = "int" },
  { name = "Transparent", type = "bool", default = false },
  { name = "TransparentColor", type = "color" },
  { name = "TransparentMode", type = "int", default = 0 },
  { name = "Width", type = "int" },
  { name = "PenColor", type = "color", origin = "rapidr" },
  { name = "BrushColor", type = "color", origin = "rapidr" },
  { name = "FontColor", type = "color", origin = "rapidr" },
  { name = "FontName", type = "string", origin = "rapidr", kind = "font" },
  { name = "FontSize", type = "int", origin = "rapidr" },
  { name = "Smooth", type = "bool", default = false, origin = "rapidr", category = "Appearance", doc = "Whether `StretchDraw` and `CopyRect` blend when they scale. False (the default, and how a scaled copy has always been drawn) takes the nearest pixel: crisp edges, right for pixel art, an emulator's screen, a QR code. True blends the four pixels around each one (bilinear): smooth, right for photographs." },
]
methods = [
  { name = "Circle", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER, fill AS INTEGER", value = true, doc = "Draws the ellipse that fits the box from (`x1`, `y1`) to (`x2`, `y2`), the right and bottom edges left out: its outline in colour `c`, its inside in colour `fill`.", example = "DIM bm AS RBitmap\nbm.Width = 20: bm.Height = 20\nbm.FillRect 0, 0, 30, 30, 0\nx1 = 2\ny1 = 2\nx2 = 12\ny2 = 8\nc = 255\nfill = 1000\nbm.Circle x1, y1, x2, y2, c, fill\nPRINT bm.Pixel(7, 2); \"|\"; bm.Pixel(7, 5); \"|\"; bm.Pixel(2, 7)", expect = "255|1000|0", arg_kinds = { c = "color", fill = "color" } },
  { name = "CopyRect", params = "D, Image, S", example = "DIM Image AS RBitmap\nImage.Width = 4: Image.Height = 4\nImage.FillRect 0, 0, 9, 9, 0\nImage.Pset 0, 0, 255: Image.Pset 3, 0, 1000\nDIM bm AS RBitmap\nbm.Width = 20: bm.Height = 20\nbm.FillRect 0, 0, 30, 30, 0\nDIM d AS RRect: DIM s AS RRect\nd.Left = 10: d.Top = 10: d.Right = 14: d.Bottom = 14\ns.Left = 0: s.Top = 0: s.Right = 4: s.Bottom = 4\nbm.CopyRect d, Image, s\nPRINT bm.Pixel(10, 10); \"|\"; bm.Pixel(13, 10); \"|\"; bm.Pixel(10, 13)", expect = "255|1000|0" },
  { name = "Draw", params = "x AS INTEGER, y AS INTEGER, BMP", example = "DIM BMP AS RBitmap\nBMP.Width = 4: BMP.Height = 4\nBMP.FillRect 0, 0, 9, 9, 0\nBMP.Pset 0, 0, 255: BMP.Pset 3, 0, 1000\nDIM bm AS RBitmap\nbm.Width = 20: bm.Height = 20\nbm.FillRect 0, 0, 30, 30, 0\nx = 5\ny = 2\nbm.Draw x, y, BMP\nPRINT bm.Pixel(5, 2); \"|\"; bm.Pixel(8, 2); \"|\"; bm.Pixel(2, 5)", expect = "255|1000|0" },
  { name = "FillRect", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER", value = true, example = "DIM bm AS RBitmap\nbm.Width = 20: bm.Height = 20\nx1 = 0\ny1 = 0\nx2 = 30\ny2 = 30\nc = 0\nbm.FillRect x1, y1, x2, y2, c\nbm.FillRect 2, 1, 9, 4, 255\nPRINT bm.Pixel(8, 3); \"|\"; bm.Pixel(3, 8)", expect = "255|0", arg_kinds = { c = "color" } },
  { name = "Line", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER", value = true, example = "DIM bm AS RBitmap\nbm.Width = 20: bm.Height = 20\nbm.FillRect 0, 0, 30, 30, 0\nx1 = 1\ny1 = 2\nx2 = 9\ny2 = 2\nc = 255\nbm.Line x1, y1, x2, y2, c\nPRINT bm.Pixel(5, 2); \"|\"; bm.Pixel(2, 5)", expect = "255|0", arg_kinds = { c = "color" } },
  { name = "LoadFromFile", params = "FileName AS STRING", arg_kinds = { FileName = "file:image" } },
  { name = "LoadFromStream", params = "Stream" },
  { name = "Paint", params = "x AS INTEGER, y AS INTEGER, c AS INTEGER, borderc AS INTEGER", doc = "Fills the area around (`x`, `y`) with colour `c`, up to the colour `borderc` that bounds it.", example = "DIM bm AS RBitmap\nbm.Width = 20: bm.Height = 20\nbm.FillRect 0, 0, 30, 30, 0\nbm.Rectangle 2, 2, 12, 8, 255\nx = 5\ny = 4\nc = 1000\nborderc = 255\nbm.Paint x, y, c, borderc\nPRINT bm.Pixel(5, 4); \"|\"; bm.Pixel(2, 2); \"|\"; bm.Pixel(15, 15)", expect = "1000|255|0", arg_kinds = { c = "color", borderc = "color" } },
  { name = "Pset", params = "x AS INTEGER, y AS INTEGER, c AS INTEGER", example = "DIM bm AS RBitmap\nbm.Width = 20: bm.Height = 20\nbm.FillRect 0, 0, 30, 30, 0\nx = 3\ny = 4\nc = 255\nbm.Pset x, y, c\nPRINT bm.Pixel(3, 4); \"|\"; bm.Pixel(4, 3)", expect = "255|0", arg_kinds = { c = "color" } },
  { name = "Rectangle", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, c AS INTEGER", doc = "Draws the outline of the rectangle from (`x1`, `y1`) to (`x2`, `y2`) in colour `c`, the right and bottom edges left out (the last pixels drawn are `x2 - 1`, `y2 - 1`); its inside stays as it was. `FillRect` fills one.", example = "DIM bm AS RBitmap\nbm.Width = 20: bm.Height = 20\nbm.FillRect 0, 0, 30, 30, 0\nx1 = 1\ny1 = 1\nx2 = 8\ny2 = 4\nc = 255\nbm.Rectangle x1, y1, x2, y2, c\nPRINT bm.Pixel(7, 1); \"|\"; bm.Pixel(1, 3); \"|\"; bm.Pixel(1, 7); \"|\"; bm.Pixel(4, 2); \"|\"; bm.Pixel(8, 2)", expect = "255|255|0|0|0", arg_kinds = { c = "color" } },
  { name = "Rotate", params = "xOrigin AS INTEGER, yOrigin AS INTEGER, Angle AS INTEGER", doc = "Turns the whole picture `Angle` degrees anticlockwise about pixel (`xOrigin`, `yOrigin`), keeping its size: each pixel takes the nearest one that turns onto it, and pixels nothing turns onto take the colour the top-left pixel had before.", example = "DIM bm AS RBitmap\nbm.Width = 20: bm.Height = 20\nbm.FillRect 0, 0, 30, 30, 0\nbm.Pset 10, 5, 255\nxOrigin = 5\nyOrigin = 5\nAngle = 90\nbm.Rotate xOrigin, yOrigin, Angle\nPRINT bm.Pixel(5, 0); \"|\"; bm.Pixel(10, 5)", expect = "255|0" },
  { name = "RoundRect", params = "x1 AS INTEGER, y1 AS INTEGER, x2 AS INTEGER, y2 AS INTEGER, x3 AS INTEGER, y3 AS INTEGER, c AS INTEGER", doc = "Draws the rectangle from (`x1`, `y1`) to (`x2`, `y2`), the right and bottom edges left out, with corners rounded by an ellipse `x3` wide and `y3` high, filled in colour `c`.", example = "DIM bm AS RBitmap\nbm.Width = 20: bm.Height = 20\nbm.FillRect 0, 0, 30, 30, 0\nx1 = 2\ny1 = 2\nx2 = 12\ny2 = 8\nx3 = 4\ny3 = 4\nc = 255\nbm.RoundRect x1, y1, x2, y2, x3, y3, c\nPRINT bm.Pixel(2, 2); \"|\"; bm.Pixel(7, 2); \"|\"; bm.Pixel(2, 5); \"|\"; bm.Pixel(7, 5); \"|\"; bm.Pixel(12, 5)", expect = "0|255|255|255|0", arg_kinds = { c = "color" } },
  { name = "SaveToFile", params = "FileName AS STRING", arg_kinds = { FileName = "file:image" } },
  { name = "SaveToStream", params = "Stream" },
  { name = "StretchDraw", params = "Rect AS RRect, BMP", doc = "Draws `BMP` scaled to fill `Rect` (its right and bottom edges left out). RapidR also takes the rectangle as four numbers: `StretchDraw x, y, w, h, BMP` draws it at (`x`, `y`), `w` wide and `h` high. Every pixel of the result takes the nearest pixel of `BMP` - crisp, as pixel art and an emulator's screen want it, and one fast pass over rows (a 256 x 192 picture at twice its size in a fraction of a millisecond). With `Smooth` True the four pixels around it are blended instead.", example = "DIM BMP AS RBitmap\nBMP.Width = 4: BMP.Height = 4\nBMP.FillRect 0, 0, 9, 9, 0\nBMP.Pset 0, 0, 255: BMP.Pset 3, 0, 1000\nDIM bm AS RBitmap\nbm.Width = 20: bm.Height = 20\nbm.FillRect 0, 0, 30, 30, 0\nDIM Rect AS RRect\nRect.Left = 0: Rect.Top = 12: Rect.Right = 8: Rect.Bottom = 20\nbm.StretchDraw Rect, BMP\nPRINT bm.Pixel(0, 12); \"|\"; bm.Pixel(7, 12); \"|\"; bm.Pixel(12, 0)", expect = "255|1000|0" },
  { name = "TextHeight", params = "Text AS STRING", returns = "WORD" },
  { name = "TextWidth", params = "Text AS STRING", returns = "WORD" },
  { name = "TextRect", params = "Rect AS RRect, x AS INTEGER, y AS INTEGER, S AS STRING, fc AS INTEGER, bc AS INTEGER", test = "args: 0, 0, 0, \"x\", 0, -1", doc = "Writes `S` at (`x`, `y`) in colour `fc` as TextOut does, but only the part inside `Rect` (its right and bottom edges left out) shows; a background colour `bc` fills the whole of `Rect` first, -1 leaves what is there.", example = "DIM bm AS RBitmap\nbm.Width = 20: bm.Height = 20\nbm.FillRect 0, 0, 30, 30, 0\nDIM Rect AS RRect\nRect.Left = 0: Rect.Top = 0: Rect.Right = 10: Rect.Bottom = 10\nx = 2\ny = 2\nDIM S AS STRING = \"I\"\nfc = 255\nbc = 65280\nbm.TextRect Rect, x, y, S, fc, bc\nPRINT bm.Pixel(9, 9); \"|\"; bm.Pixel(10, 10)", expect = "65280|0", arg_kinds = { fc = "color", bc = "color" } },
  { name = "TextOut", params = "x AS INTEGER, y AS INTEGER, S AS STRING, fc AS INTEGER, bc AS INTEGER", doc = "Writes `S` with its top-left corner at (`x`, `y`), in colour `fc` on a background of colour `bc`.", example = "DIM bm AS RBitmap\nbm.Width = 20: bm.Height = 20\nbm.FillRect 0, 0, 30, 30, 0\nx = 1\ny = 1\nDIM S AS STRING = \"I\"\nfc = 255\nbc = 65280\nbm.TextOut x, y, S, fc, bc\nPRINT bm.Pixel(1, 1)", expect = "65280", arg_kinds = { fc = "color", bc = "color" } },
  { name = "LoadIcon", params = "Name AS STRING, [Size AS INTEGER], [Theme AS STRING]", origin = "rapidr", doc = "Loads one of RapidR's own icons (an icon name such as \"run\", a component type, a command id), Size pixels square (16 if left out), in the current theme's colours or Theme's; crisp at every screen scale." },
  { name = "SetPixels", params = "Pixels AS VARIANT, Width AS INTEGER, Height AS INTEGER, [X AS INTEGER], [Y AS INTEGER]", origin = "rapidr", effects = ["state"], test = "skip: needs an array", doc = "Puts a whole block of colours into the picture in one call, from an array: the `Width` x `Height` colours of `Pixels`, row by row from its first element (a one-dimensional array's element `y * Width + x` is pixel (x, y); a two-dimensional `(Height - 1, Width - 1)` array is `Pixels(y, x)`), with the block's top-left corner at (`X`, `Y`) - 0, 0 if left out. Colours are the numbers `Pset` takes (`RGB(r, g, b)`, red in the low byte). It is the fast way to draw an image from data - an emulator's video memory, an image filter, a heat map, a game of life: one call does the work of `Width * Height` calls of `Pset` (a 256 x 192 screen in well under a millisecond, not 70). The block must lie inside the picture and `Pixels` must hold enough values, or the program stops with a message that says which.", example = "DIM bm AS RBitmap\nbm.Width = 5: bm.Height = 2\nDIM Pixels(7) AS INTEGER\nFOR i = 0 TO 7\n  Pixels(i) = (i + 1) * 10\nNEXT\nWidth = 4\nHeight = 2\nX = 1\nY = 0\nbm.SetPixels Pixels, Width, Height, X, Y\nPRINT bm.Pixel(1, 0); \"|\"; bm.Pixel(4, 0); \"|\"; bm.Pixel(1, 1); \"|\"; bm.Pixel(4, 1)", expect = "10|40|50|80" },
  { name = "SetPixels8", params = "Indexes AS VARIANT, Palette AS VARIANT, Width AS INTEGER, Height AS INTEGER, [X AS INTEGER], [Y AS INTEGER]", origin = "rapidr", effects = ["state"], test = "skip: needs an array", doc = "Like `SetPixels`, but the array holds palette numbers: each of the `Width` x `Height` elements of `Indexes` (0 to 255, a BYTE array) picks a colour of `Palette` (an array of colours, `RGB(r, g, b)`; its first element is colour 0) - one lookup a pixel, in Rust, as a retro machine's screen memory and palette work. The block's top-left corner is at (`X`, `Y`), 0, 0 if left out. An index the palette does not have stops the program with a message that names the pixel.", example = "DIM bm AS RBitmap\nbm.Width = 5: bm.Height = 2\nDIM Indexes(5) AS BYTE\nDIM Palette(2) AS INTEGER\nPalette(0) = 0: Palette(1) = 255: Palette(2) = 65280\nFOR i = 0 TO 5\n  Indexes(i) = i MOD 3\nNEXT\nWidth = 3\nHeight = 2\nX = 1\nY = 0\nbm.SetPixels8 Indexes, Palette, Width, Height, X, Y\nPRINT bm.Pixel(1, 0); \"|\"; bm.Pixel(2, 0); \"|\"; bm.Pixel(3, 0); \"|\"; bm.Pixel(3, 1)", expect = "0|255|65280|65280" },
  { name = "GetPixels", params = "Pixels AS VARIANT, X AS INTEGER, Y AS INTEGER, Width AS INTEGER, Height AS INTEGER", origin = "rapidr", effects = ["state"], test = "skip: needs an array", doc = "Reads a block of the picture into an array in one call: the `Width` x `Height` pixels with the top-left corner at (`X`, `Y`), row by row, into the first `Width * Height` elements of `Pixels` (an INTEGER or LONG array - colours need 24 bits). With `SetPixels` it makes an image filter: read, change the numbers, put back. The block must lie inside the picture.", example = "DIM bm AS RBitmap\nbm.Width = 4: bm.Height = 4\nbm.FillRect 0, 0, 30, 30, 0\nbm.Pset 1, 1, 777\nDIM Pixels(3) AS INTEGER\nX = 1\nY = 1\nWidth = 2\nHeight = 2\nbm.GetPixels Pixels, X, Y, Width, Height\nPRINT Pixels(0); \"|\"; Pixels(1); \"|\"; Pixels(3)", expect = "777|0|0" },
]
