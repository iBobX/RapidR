[[component]]
name = "RSECRETS"
display = "Secrets"
visual = false
doc = "Keeps passwords, tokens and keys in the operating system's keychain (the macOS Keychain, Windows Credential Manager, the Secret Service on Linux), by a service and a name: never in the program, a file or the settings. Each program has its own items (kept as rapidr-app:<program>:<service>, <program> its file's name and a digest of where the file is, or a built macOS app's bundle identifier), so no program reaches another's or RapidR Studio's — not even one of the same name in another folder. What it reads and saves is never shown: the debugger shows ••••, an AI is never given it, and Error never says it. A browser has no keychain: on the web Available is False and every call fails (Error says so); nothing is kept in the page's storage. For tests, RAPIDR_AI_KEYSTORE=memory keeps everything in the program's memory. RapidR's own."
example = """
DIM Secrets AS RSecrets
IF Secrets.Save("MySQL", "office", "my password") THEN PRINT "kept in "; Secrets.Store
pw$ = Secrets.Read("MySQL", "office")
PRINT "read back: "; LEN(pw$); " characters"
IF Secrets.Exists("MySQL", "office") THEN Secrets.Delete "MySQL", "office"
IF Secrets.Error <> "" THEN PRINT "couldn't: "; Secrets.Error
"""
properties = [
  { name = "Available", type = "bool", access = "read", design = false, doc = "True where secrets can be kept: a keychain RapidR can use (or the test keystore). False in a browser, and on a Linux without the Secret Service." },
  { name = "Error", type = "string", access = "read", design = false, doc = "Why the last call failed (\"\" when it worked): no keychain here, the keychain refused, an empty service or name, a value longer than 1,024 characters. Never the value." },
  { name = "Store", type = "string", access = "read", design = false, doc = "Where secrets are kept here, in words: \"the macOS Keychain\", \"Windows Credential Manager\", \"the Secret Service (GNOME Keyring or KWallet)\"; with the test keystore, memory." },
  { name = "Program", type = "string", access = "read", design = false, doc = "The identity this program's items are kept under: its file's name in lower case and a digest of the file's full path (\"dbstudio~1a2b3c4d5e6f7081\": two programs called main.rr in two folders are two programs; moved to another folder, a program starts without its secrets), or a built macOS app's bundle identifier (\"com.example.dbstudio\", wherever the app is)." },
]
methods = [
  { name = "Save", params = "Service AS STRING, Name AS STRING, Value AS STRING", returns = "INTEGER", effects = ["registry"], risk = "irreversible", secret = true, test = "args: \"RapidR conformance\", \"case\", \"not-a-real-secret\"", doc = "Keeps `Value` in the keychain as `Name` of `Service` (both your own words: \"MySQL\", \"office\"), replacing what was kept there. True when it was kept; False when not (Error says why). `Value` is a credential: never shown." },
  { name = "Read", params = "Service AS STRING, Name AS STRING", returns = "STRING", effects = ["registry"], secret = true, test = "args: \"RapidR conformance\", \"case\"", doc = "What is kept as `Name` of `Service`: \"\" when nothing is (Exists tells them apart) or the keychain can't be read (Error says why). The value is a credential: the debugger shows ••••." },
  { name = "Delete", params = "Service AS STRING, Name AS STRING", returns = "INTEGER", effects = ["registry"], risk = "irreversible", test = "args: \"RapidR conformance\", \"case\"", doc = "Removes `Name` of `Service` from the keychain. True when there was one; False when there wasn't or it couldn't (Error says why)." },
  { name = "Exists", params = "Service AS STRING, Name AS STRING", returns = "INTEGER", effects = ["registry"], test = "args: \"RapidR conformance\", \"case\"", doc = "True when something is kept as `Name` of `Service`." },
]
events = []

[[component]]
