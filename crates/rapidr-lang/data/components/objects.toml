[[component]]
name = "RIMAGELIST"
display = "ImageList"
rapidq = "QIMAGELIST"
visual = false
doc = "A list of same-size pictures (bitmaps or icons), drawn by index; list views and trees take their pictures from one."
properties = [
  { name = "BkColor", type = "color", default = 536870911 },
  { name = "BlendColor", type = "color", default = 536870911 },
  { name = "Count", type = "int", access = "read", design = false },
  { name = "DrawingStyle", type = "enum", values = ["dsFocused", "dsSelected", "dsNormal", "dsTransparent"], default = "dsNormal" },
  { name = "GetBMP", type = "any", access = "read", design = false, indexed = 1 },
  { name = "GetICO", type = "any", access = "read", design = false, indexed = 1 },
  { name = "Handle", type = "int", design = false },
  { name = "Height", type = "int" },
  { name = "ImageType", type = "enum", values = ["itImage", "itMask"], default = "itImage" },
  { name = "Masked", type = "bool", default = true },
  { name = "Width", type = "int" },
  { name = "ShareImages", type = "any" },
]
methods = [
  { name = "AddBMPFile", params = "FileName AS STRING, MaskColor AS INTEGER", arg_kinds = { FileName = "file:image", MaskColor = "color" } },
  { name = "AddICOFile", params = "FileName AS STRING", arg_kinds = { FileName = "file:image" } },
  { name = "AddBMPHandle", params = "BMP_Resource, MaskColor AS INTEGER", arg_kinds = { MaskColor = "color" } },
  { name = "AddICOHandle", params = "ICO_Resource" },
  { name = "Clear", value = true },
  { name = "Delete", params = "Index AS INTEGER" },
  { name = "Draw", params = "Target, X AS INTEGER, Y AS INTEGER, Index AS INTEGER", doc = "Draws image `Index` with its top left at (`X`, `Y`) on `Target`: an RBitmap, RImage, RCanvas or RDXScreen (its back buffer). An `Index` out of range draws nothing; the mask colour's pixels are left out." },
  { name = "InsertBMPFile", params = "Index AS INTEGER, Filename AS STRING, Mask AS INTEGER", arg_kinds = { Filename = "file:image" } },
  { name = "InsertICOFile", params = "Index AS INTEGER, Filename AS STRING", arg_kinds = { Filename = "file:image" } },
  { name = "InsertBMPHandle", params = "Index AS INTEGER, BMP_Resource, Mask AS INTEGER" },
  { name = "InsertICOHandle", params = "Index AS INTEGER, ICO_Resource" },
  { name = "AddIcon", params = "Name AS STRING, [Theme AS STRING]", origin = "rapidr", doc = "Adds one of RapidR's own icons (an icon name, a component type or a command id) at the list's Width × Height, in the current theme's colours or Theme's." },
  { name = "AddSVGFile", params = "FileName AS STRING, [Theme AS STRING]", returns = "INTEGER", origin = "rapidr", effects = ["file-read"], test = "skip: needs an SVG file (tests/conformance/cases/imagelist_svg.rr)", doc = "Adds your own SVG icon — a file, or one built into the program by `$RESOURCE` (its name) — drawn at the list's Width × Height and at the screen's scale, so it stays sharp at 2×. Drawn with RapidR's icon colour tokens (ink #5B6478, blue #2F5BFF … as their light values) or `currentColor`, it takes the theme's colours (light, dark, high contrast) and follows the theme when it changes; Theme (\"dark\", \"highcontrast\" …) fixes them. An SVG with colours of its own keeps them. Returns the new image's index.", example = "DIM Icons AS RImageList\nIcons.Width = 16: Icons.Height = 16\nIcons.AddSVGFile \"icons/table.svg\"\nIcons.AddSVGFile \"icons/table.svg\", \"dark\"", arg_kinds = { FileName = "file:image" } },
]
