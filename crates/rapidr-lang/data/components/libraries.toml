  { name = "ItemIndex", type = "int" },
  { name = "LargeImageList", type = "component", kinds = ["QIMAGELIST"] },
  { name = "LargeImages", type = "component", kinds = ["QIMAGELIST"], access = "write" },
  { name = "Left", type = "int" },
  { name = "Mask", type = "string" },
  { name = "MultiSelect", type = "bool" },
  { name = "Parent", type = "component", kinds = ["QFORM", "QPANEL", "QTABCONTROL"], access = "write" },
  { name = "PopupMenu", type = "component", kinds = ["QPOPUPMENU"], access = "write" },
  { name = "ReadOnly", type = "bool" },
