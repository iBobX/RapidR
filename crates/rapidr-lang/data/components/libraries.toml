# Components that aren't built into the runtimes: RapidQ's community libraries RapidR
# supplies in BASIC (rapidr_preprocessor::RAPIDR_LIBRARIES), and RapidQ's objects RapidR
# doesn't have yet (rapidr_ast::RAPIDQ_OBJECTS_NOT_YET_IMPLEMENTED).
group = "Libraries"

[[component]]
name = "QOLECONTAINER"
rapidq = "QOLECONTAINER"
kind = "planned"
visual = true
doc = "Hosts an embedded OLE object (a document or control of another program) on a form. Planned: RapidR doesn't have it yet."
properties = [
  { name = "Align", type = "enum", values = ["alNone", "alTop", "alBottom", "alLeft", "alRight", "alClient"] },
  { name = "AllowInPlace", type = "bool" },
  { name = "AutoShow", type = "bool" },
  { name = "BorderStyle", type = "enum", values = ["bsNone", "bsSingle", "bsSizeable", "bsDialog", "bsToolWindow", "bsSizeToolWin"] },
  { name = "Color", type = "color" },
  { name = "Cursor", type = "enum", values = ["crDefault", "crNone", "crArrow", "crCross", "crIBeam", "crSize", "crSizeNESW", "crSizeNS", "crSizeNWSE", "crSizeWE", "crUpArrow", "crHourGlass", "crDrag", "crNoDrop", "crHSplit", "crVSplit", "crMultiDrag", "crSQLWait", "crNo", "crAppStart", "crHelp", "crHandPoint"] },
  { name = "Enabled", type = "bool" },
  { name = "Handle", type = "int", access = "read" },
  { name = "Height", type = "int" },
  { name = "Hint", type = "string" },
  { name = "Left", type = "int" },
  { name = "Modified", type = "bool" },
  { name = "Parent", type = "component", kinds = ["QFORM", "QPANEL", "QTABCONTROL"], access = "write" },
  { name = "ShowHint", type = "bool" },
  { name = "SizeMode", type = "enum", values = ["smClip", "smCenter", "smScale", "smStretch", "smAutoSize"] },
  { name = "State", type = "enum", values = ["osEmpty", "osLoaded", "osRunning", "osOpen", "osInPlaceActive", "osUIActive"] },
  { name = "TabOrder", type = "int" },
  { name = "Tag", type = "int" },
  { name = "Top", type = "int" },
  { name = "Width", type = "int" },
  { name = "Visible", type = "bool" },
]
methods = [
  { name = "CreateObject", params = "ClassName AS STRING", returns = "INTEGER" },
  { name = "Free" },
  { name = "Invoke", params = "ID AS STRING, Params, Items ...", returns = "VARIANT" },
]
events = [
  { name = "OnKeyDown", params = "Key AS WORD, Shift AS INTEGER" },
  { name = "OnKeyPress", params = "Key AS BYTE" },
  { name = "OnKeyUp", params = "Key AS WORD, Shift AS INTEGER" },
  { name = "OnMouseDown", params = "Button AS INTEGER, X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnMouseMove", params = "X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnMouseUp", params = "Button AS INTEGER, X AS INTEGER, Y AS INTEGER, Shift AS INTEGER" },
  { name = "OnObjectMove", params = "Rect AS QRECT" },
  { name = "OnResize" },
]

[[component]]
name = "QOLEOBJECT"
rapidq = "QOLEOBJECT"
kind = "planned"
visual = false
doc = "Drives a COM / OLE automation object (another program's) by calling its methods by name. Planned: RapidR doesn't have it yet."
properties = []
methods = [
  { name = "CreateObject", params = "ClassName AS STRING", returns = "INTEGER" },
  { name = "CreateRemote", params = "Host AS STRING, ClassName AS STRING", returns = "INTEGER" },
  { name = "Free" },
  { name = "GetIDofName", params = "Name AS STRING", returns = "INTEGER" },
  { name = "GetObject", params = "ClassName AS STRING", returns = "INTEGER" },
  { name = "Invoke", params = "ID AS STRING, Params, Items ...", returns = "VARIANT" },
  { name = "InvokeCopy", params = "ID AS STRING, Object AS QOLEOBJECT" },
]
events = []

[[component]]
name = "QDOCKFORM"
rapidq = "QDOCKFORM"
from = "QDockForm.inc"
kind = "library"
visual = true
doc = "A panel docked at an edge of its form that the user can tear off into a window of its own and dock back. RapidR's own BASIC implementation of the RapidQ library."
properties = [
  { name = "Align", type = "int" },
  { name = "AltAlign", type = "int" },
  { name = "AltDock", type = "int", access = "read" },
  { name = "CanClose", type = "bool" },
  { name = "Canvas", type = "component", kinds = ["QCANVAS"] },
  { name = "Caption", type = "string" },
  { name = "Client", type = "component", kinds = ["QPANEL"] },
  { name = "Closed", type = "bool", access = "read" },
  { name = "Docked", type = "bool", access = "read" },
  { name = "DockStyle", type = "int" },
  { name = "DragCursor", type = "int" },
  { name = "Font", type = "font", access = "write" },
  { name = "Height", type = "int" },
  { name = "Left", type = "int" },
  { name = "Locked", type = "bool" },
  { name = "Parent", type = "component", kinds = ["QFORM"], access = "write" },
  { name = "Sizeable", type = "bool" },
  { name = "ST1_TitleBackground", type = "int" },
  { name = "Style", type = "int" },
  { name = "TitleColor", type = "color" },
  { name = "Top", type = "int" },
  { name = "UndockedHeight", type = "int" },
  { name = "UndockedWidth", type = "int" },
  { name = "UndockStyle", type = "int" },
  { name = "Width", type = "int" },
  { name = "Visible", type = "int" },
]
methods = [
  { name = "Close" },
  { name = "Dock", params = "Dock AS INTEGER" },
]
events = [
  { name = "OnDock", params = "Docked AS INTEGER, Alt AS INTEGER" },
  { name = "OnPaint" },
  { name = "OnClose" },
]

