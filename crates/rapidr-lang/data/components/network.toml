# Network, devices and CGI: the registry's components (crates/rapidr-lang; src/lib.rs says how to edit).
group = "Network, devices and CGI"

[[component]]
name = "RSOCKET"
display = "Socket"
rapidq = "QSOCKET"
visual = false
where = "desktop (TCP); web (WebSocket)"
default_event = "OnConnect"
doc = "A TCP client socket: connect to a host and port, then read and write text or bytes. In the browser it connects over WebSocket."
properties = [
  { name = "Family", type = "enum", values = ["AF_UNSPEC", "AF_UNIX", "AF_INET", "AF_IMPLINK", "AF_PUP", "AF_CHAOS", "AF_IPX", "AF_NS", "AF_ISO", "AF_ECMA", "AF_DATAKIT", "AF_CCITT", "AF_SNA", "AF_DECnet", "AF_DLI", "AF_LAT", "AF_HYLINK", "AF_APPLETALK", "AF_NETBIOS", "AF_VOICEVIEW", "AF_FIREFOX", "AF_UNKNOWN1", "AF_BAN"], default = "AF_INET" },
  { name = "LParam", type = "int" },
  { name = "MySocket", type = "int", access = "read", design = false },
  { name = "Parent", type = "component", kinds = ["QFORM"], access = "write", design = false },
  { name = "Protocol", type = "enum", values = ["IPPROTO_IP", "IPPROTO_ICMP", "IPPROTO_IGMP", "IPPROTO_TCP", "IPPROTO_PUP", "IPPROTO_UDP", "IPPROTO_IDP", "IPPROTO_RAW"], default = "IPPROTO_IP" },
  { name = "Tag", type = "int" },
  { name = "Transferred", type = "int", access = "read", design = false },
  { name = "WMessage", type = "int", default = 0 },
  { name = "Host", type = "string", origin = "rapidr" },
  { name = "Port", type = "int", origin = "rapidr" },
  { name = "Connected", type = "int", origin = "rapidr" },
  { name = "Timeout", type = "int", origin = "rapidr" },
  { name = "Type", type = "int" },
]
methods = [
  { name = "Accept", params = "Socket AS INTEGER", returns = "VARIANT", value = true },
  { name = "Close", params = "Socket AS INTEGER", value = true },
  { name = "Connect", params = "ServerName AS STRING, PortNum AS INTEGER", returns = "VARIANT", value = true },
  { name = "ConnectionReady", params = "Sock AS INTEGER", returns = "VARIANT" },
  { name = "GetHostIP", returns = "VARIANT" },
  { name = "GetHostName", returns = "VARIANT" },
  { name = "GetPeerName", params = "Socket AS INTEGER", returns = "VARIANT" },
  { name = "IsClientReady", params = "Sock AS INTEGER, ClientSock AS INTEGER", returns = "VARIANT" },
  { name = "IsServerReady", params = "Sock AS INTEGER", returns = "VARIANT" },
  { name = "Open", params = "PortNum AS INTEGER", returns = "VARIANT", only = "web" },
  { name = "Peek", params = "Socket AS INTEGER, NumBytes AS INTEGER", returns = "VARIANT" },
  { name = "Read", params = "Socket AS INTEGER, NumBytes AS INTEGER", returns = "VARIANT", value = true },
  { name = "ReadByte", params = "Socket AS INTEGER", returns = "BYTE" },
  { name = "ReadLine", params = "Socket AS INTEGER", returns = "VARIANT", value = true },
  { name = "Write", params = "Socket AS INTEGER, Message AS STRING, NumBytes AS INTEGER", value = true },
  { name = "WriteByte", params = "Socket AS INTEGER, B AS BYTE" },
  { name = "WriteLine", params = "Socket AS INTEGER, Message AS STRING", returns = "VARIANT", value = true },
  { name = "Disconnect", origin = "rapidr" },
  { name = "Send", origin = "rapidr", only = "web" },
  { name = "Receive", origin = "rapidr", only = "web" },
]
events = [
  { name = "OnConnect", params = "State AS STRING", origin = "rapidr" },
  { name = "OnDisconnect", params = "State AS STRING", origin = "rapidr" },
  { name = "OnError", params = "Message AS STRING", origin = "rapidr" },
]

[[component]]
name = "RSERVERSOCKET"
display = "ServerSocket"
visual = false
only = "desktop"
default_event = "OnClientConnect"
doc = "A TCP server: listens on a port, accepts clients and exchanges data with them. RapidR's own; desktop only: a web page can't listen for network connections (a browser lets it open WebSockets and HTTP requests, never a port of its own)."
properties = [
  { name = "Host", type = "string" },
  { name = "Port", type = "int" },
  { name = "ClientCount", type = "int" },
]
methods = [
  { name = "Start", value = true, only = "desktop" },
  { name = "Stop", value = true, only = "desktop" },
  { name = "Broadcast", value = true, only = "desktop" },
  { name = "Listen", value = true, only = "desktop" },
  { name = "Accept", value = true, only = "desktop" },
  { name = "Poll", only = "desktop" },
  { name = "SendTo", only = "desktop" },
]
events = [
  { name = "OnClientConnect", params = "Address AS STRING" },
  { name = "OnClientDisconnect", params = "Address AS STRING" },
  { name = "OnDataReceived", params = "Address AS STRING, Data AS STRING" },
  { name = "OnError" },
]

[[component]]
name = "RHTTP"
display = "Http"
visual = false
doc = "An HTTP(S) client: Get or Post a URL, then read StatusCode, ResponseText and ResponseHeaders. RapidR's own."
properties = [
  { name = "Host", type = "string" },
  { name = "Port", type = "int" },
  { name = "Url", type = "string" },
  { name = "StatusCode", type = "int" },
  { name = "ResponseText", type = "string" },
  { name = "ResponseHeaders", type = "string" },
  { name = "Timeout", type = "int" },
  { name = "UseSSL", type = "int" },
]
methods = [
  { name = "Get", value = true },
  { name = "Post", value = true },
]
events = []

[[component]]
name = "RCGI"
display = "CGI"
rapidq = "QCGI"
from = "qcgi.inc"
visual = false
doc = "For CGI programs behind a web server (qcgi.inc): the request's CGI variables as properties, and Parse / Get for its form fields."
properties = [
  { name = "AutoConvert", type = "int", default = 1 },
  { name = "MaxInput", type = "int", default = 32767 },
  { name = "Accept", type = "string", access = "read", design = false },
  { name = "AuthType", type = "string", access = "read", design = false },
  { name = "ContentLength", type = "int", access = "read", design = false },
  { name = "ContentType", type = "string", access = "read", design = false },
  { name = "Cookie", type = "string", access = "read", design = false },
  { name = "GatewayInterface", type = "string", access = "read", design = false },
  { name = "PathInfo", type = "string", access = "read", design = false },
  { name = "PathTranslated", type = "string", access = "read", design = false },
  { name = "Referer", type = "string", access = "read", design = false },
  { name = "RemoteAddr", type = "string", access = "read", design = false },
  { name = "RemoteHost", type = "string", access = "read", design = false },
  { name = "RemoteIdent", type = "string", access = "read", design = false },
  { name = "RemoteUser", type = "string", access = "read", design = false },
  { name = "RequestMethod", type = "string", access = "read", design = false },
  { name = "ScriptName", type = "string", access = "read", design = false },
  { name = "ServerSoftware", type = "string", access = "read", design = false },
  { name = "ServerName", type = "string", access = "read", design = false },
  { name = "ServerPort", type = "int", access = "read", design = false },
  { name = "ServerProtocol", type = "string", access = "read", design = false },
  { name = "UserAgent", type = "string", access = "read", design = false },
]
methods = [
  { name = "Parse" },
  { name = "Get", params = "Name AS STRING, BYREF Value AS STRING", returns = "INTEGER" },
]
events = []

[[component]]
name = "RCOMPORT"
display = "ComPort"
rapidq = "QCOMPORT"
aliases = ["COMPORT"]
visual = false
where = "desktop (serial2); web (Web Serial)"
default_event = "OnRxChar"
doc = "A serial port (RAPIDQ2.INC's COMPORT): set the port and its speed, Open it, then read and write strings. Web Serial in the browser. RapidR adds what IoT boards (ESP32, Arduino) need: the ports listed with their USB IDs, the DTR / RTS lines (a board's reset), whole lines in and an event when an adapter is plugged in or out."
properties = [
  { name = "BytesNotRead", type = "int", access = "read", design = false },
  { name = "BytesNotWritten", type = "int", access = "read", design = false },
  { name = "BaudRate", type = "int", default = 9600 },
  { name = "Connected", type = "int", access = "read", design = false },
  { name = "DataBits", type = "int", default = 8 },
  { name = "Handle", type = "int", access = "read", design = false },
  { name = "Parity", type = "enum", values = ["prNone", "prOdd", "prEven", "prMark", "prSpace"], default = "prNone" },
  { name = "ReadBufSize", type = "int", default = 1024 },
  { name = "StopBits", type = "int", default = 1 },
  { name = "WriteBufSize", type = "int", default = 1024 },
  { name = "Port", type = "any" },
  { name = "DcbFlags", type = "int", origin = "rapidr" },
  { name = "InQue", type = "int", access = "read", design = false },
  { name = "OutQue", type = "int", access = "read", design = false },
  { name = "PendingIO", type = "int", access = "read", design = false },
  { name = "DTR", type = "int", default = 1, design = false, origin = "rapidr", doc = "The Data Terminal Ready line: 1 set, 0 clear. It changes at once on an open port, else at Open; until set it follows DcbFlags (set). Many boards wire it, with RTS, to their reset and boot pins." },
  { name = "RTS", type = "int", default = 1, design = false, origin = "rapidr", doc = "The Request To Send line: 1 set, 0 clear. It changes at once on an open port, else at Open; until set it follows DcbFlags (set). With hardware flow control the port drives it." },
  { name = "CTS", type = "int", access = "read", design = false, origin = "rapidr", doc = "The Clear To Send line the other end drives: 1 when set (0 while the port is closed)." },
  { name = "DSR", type = "int", access = "read", design = false, origin = "rapidr", doc = "The Data Set Ready line the other end drives: 1 when set (0 while the port is closed)." },
  { name = "CD", type = "int", access = "read", design = false, origin = "rapidr", doc = "The Carrier Detect line: 1 when set (0 while the port is closed)." },
  { name = "RI", type = "int", access = "read", design = false, origin = "rapidr", doc = "The Ring Indicator line: 1 when set (0 while the port is closed)." },
  { name = "LineEnd", type = "string", design = false, origin = "rapidr", doc = "What ends a line for ReadLine and OnLine: CHR$(10) unless set. With CHR$(10) a CR just before it is dropped too, so lines ending CR LF or LF both read clean." },
  { name = "HasLine", type = "int", access = "read", design = false, origin = "rapidr", doc = "1 when a whole line has arrived (ReadLine returns it at once)." },
  { name = "PortCount", type = "int", access = "read", design = false, origin = "rapidr", doc = "How many ports ListPorts found (it looks first when it hasn't yet)." },
]
methods = [
  { name = "AbortAllIO" },
  { name = "Close", value = true },
  { name = "Open", value = true },
  { name = "PurgeIn" },
  { name = "PurgeOut" },
  { name = "Read", params = "QFile, Count AS INTEGER, Wait AS INTEGER" },
  { name = "ReadString", params = "Count AS INTEGER, Wait AS INTEGER", returns = "VARIANT" },
  { name = "WaitForLastIO" },
  { name = "Write", params = "QMemoryStream, Count AS INTEGER, Wait AS INTEGER" },
  { name = "WriteString", params = "Str AS STRING, Wait AS INTEGER" },
  { name = "AddFlowControl" },
  { name = "DelFlowControl" },
  { name = "ListPorts", returns = "INTEGER", value = true, origin = "rapidr", doc = "Looks at the serial ports there are now and returns how many; PortName, PortDescription and the others read them, 0 being the first. On the desktop every port the system has, a USB adapter's IDs and names with it; in the browser the ports the page was allowed (COM1, COM2 …)." },
  { name = "PortName", params = "Index AS INTEGER", returns = "STRING", origin = "rapidr", doc = "Port Index's name as Port takes it (COM3, /dev/cu.usbserial-1420, /dev/ttyUSB0); empty past the last." },
  { name = "PortDescription", params = "Index AS INTEGER", returns = "STRING", origin = "rapidr", doc = "What port Index is: the system's name for its device (CP2102N USB to UART Bridge Controller), else the USB chip its IDs name (CH340 USB to serial); empty when nothing says." },
  { name = "PortManufacturer", params = "Index AS INTEGER", returns = "STRING", origin = "rapidr", doc = "Who made port Index's USB device, as the device says (empty when not USB)." },
  { name = "PortSerialNumber", params = "Index AS INTEGER", returns = "STRING", origin = "rapidr", doc = "Port Index's USB device's serial number (empty when it has none): it tells two boards of the same kind apart." },
  { name = "PortVendorID", params = "Index AS INTEGER", returns = "INTEGER", origin = "rapidr", doc = "Port Index's USB vendor ID (&H10C4 Silicon Labs, &H1A86 WCH, &H0403 FTDI, &H303A Espressif); 0 when not USB." },
  { name = "PortProductID", params = "Index AS INTEGER", returns = "INTEGER", origin = "rapidr", doc = "Port Index's USB product ID; 0 when not USB." },
  { name = "FillList", params = "Control", returns = "INTEGER", origin = "rapidr", doc = "Looks at the ports again and puts them in a list box or combo box, one item each (the name, then the description in brackets) in PortName's order, selecting Port's; returns how many. Port = PortName(Combo.ItemIndex) then picks one." },
  { name = "ReadLine", params = "[Timeout AS INTEGER]", returns = "STRING", value = true, origin = "rapidr", doc = "The next whole line that has arrived, without its LineEnd, waiting up to Timeout ms for one (1000 without it; 0 doesn't wait). Empty when none came in time: what part of a line has arrived stays for the next read." },
  { name = "SendBreak", params = "[Duration AS INTEGER]", origin = "rapidr", doc = "Holds the line in a break for Duration ms (250 without it)." },
]
events = [
  { name = "OnBreak" },
  { name = "OnClose" },
  { name = "OnComError", params = "ErrorMessage AS STRING" },
  { name = "OnOpen" },
  { name = "OnReadString" },
  { name = "OnWriteString" },
  { name = "OnRing" },
  { name = "OnRxChar", params = "InQue AS INTEGER" },
  { name = "OnTxEmpty" },
  { name = "OnError", params = "Message AS STRING" },
  { name = "OnLine", params = "Received AS STRING", origin = "rapidr", doc = "Fires for each whole line that arrives, without its LineEnd (the line is read: ReadString and ReadLine don't see it). The runtime looks every 50 ms." },
  { name = "OnPortsChanged", params = "Added AS STRING, Removed AS STRING", origin = "rapidr", doc = "Fires when serial ports come or go, a USB adapter plugged in or out: the names added and removed, a CR LF between two. The runtime looks about once a second (the browser says at once)." },
]

[[component]]
name = "RDOWNLOAD"
display = "Download"
rapidq = "QDOWNLOAD"
from = "Qdownload.inc"
visual = false
doc = "Downloads a file over HTTP(S) into a variable or a file, with progress (Qdownload.inc)."
properties = [
  { name = "Server", type = "string" },
  { name = "Port", type = "int", default = 80 },
  { name = "File", type = "string" },
  { name = "Outfile", type = "string" },
  { name = "Outvar", type = "string", access = "read", design = false },
  { name = "Outdevice", type = "int", default = 1 },
  { name = "Statedevice", type = "int", default = 1 },
  { name = "State", type = "int", access = "read", design = false },
  { name = "Size", type = "int", access = "read", design = false },
  { name = "LastError", type = "int", access = "read", design = false },
  { name = "LastStringError", type = "string", access = "read", design = false },
  { name = "StateGauge", type = "component", kinds = ["QGAUGE"] },
]
methods = [
  { name = "LeechFile", returns = "VARIANT", value = true },
  { name = "Check", returns = "VARIANT", value = true },
  { name = "Percent", returns = "VARIANT" },
  { name = "Speed" },
]
events = []
