# RapidR Studio's services as components (docs/ide-plan.md I1, docs/ide-components.md §3.9): the registry's components (crates/rapidr-lang; src/lib.rs says how to edit).
group = "IDE"

[[component]]
name = "RPROJECT"
display = "Project"
visual = false
default_event = "OnChange"
doc = "A RapidR project: a .rrproj file (format 2, or the web IDE's v1 projects), or a source file (.rr, .bas, .rqw, .rqb, .rq) with the files it $INCLUDEs. Lists the project's files and their kinds, adds and removes files, saves the project file, and makes new projects from templates. RapidR Studio is built on it."
properties = [
  { name = "FileName", type = "string", access = "read", design = false, doc = "The .rrproj file (\"\" for a source file opened without one).", kind = "file:any" },
  { name = "Folder", type = "string", access = "read", design = false, doc = "The project's folder: its files' paths are relative to it." },
  { name = "Kind", type = "string", access = "read", design = false, doc = "What is open: \"project\" (a .rrproj), \"file\" (a source file and its includes), \"v1\" (a web IDE project, imported) or \"\" (nothing)." },
  { name = "Error", type = "string", access = "read", design = false, doc = "Why the last Open, Save, New, AddFile or RemoveFile failed (\"\" when it worked)." },
  { name = "Name", type = "string", doc = "The project's name." },
  { name = "MainFile", type = "string", doc = "The file the program starts from (relative to the folder).", kind = "file:any" },
  { name = "FileCount", type = "int", access = "read", design = false, doc = "How many files the project has." },
  { name = "CompatMode", type = "string", doc = "\"rapidq\" for a project kept classic-compatible (RapidR's extensions are reported), else \"\"." },
  { name = "Targets", type = "string", design = false, values = ["desktop", "web", "both"], doc = "Where the program runs: \"desktop\" (native builds and the interpreter), \"web\" (the browser) or \"both\" — Project Options' Targets, kept in the project file (`[build] runs_on`). Unset, it is \"both\" for a project that builds a web app too, else \"desktop\". The Problems pane notes what works on one runtime only when the program runs on the other. Set it, then Save." },
  { name = "Icon", type = "string", doc = "The app's icon file (.icns, .ico, .png or .svg), relative to the folder; \"\" for the main file's $OPTION ICON, else RapidR's icon for programs.", kind = "file:image" },
  { name = "AppName", type = "string", doc = "The app's name, as Finder, Explorer and the applications menu show it; \"\" for the project's Name." },
  { name = "BundleID", type = "string", doc = "The app's reverse-DNS identifier (com.example.notepad); \"\" for dev.rapidr.app.<name>." },
  { name = "Version", type = "string", doc = "The app's version: up to four numbers with dots (1.0, 2.3.1); \"\" for 1.0." },
  { name = "Company", type = "string", doc = "Who makes the app (Windows' company name, the copyright line)." },
  { name = "BuildKind", type = "string", doc = "How Build makes the program: \"native\" (compiled with Rust) or \"interpreted\" (RapidR's runner and the program's bytecode; no Rust needed)." },
  { name = "OutputFolder", type = "string", doc = "Where Build puts the app: a folder relative to the project's (\"\" for build). It gets only what is shipped: the generated Rust and the compiler's files stay in RapidR's build cache." },
  { name = "KeepRust", type = "int", doc = "True: a native Build also leaves the Rust RapidR generated beside the app, in <program>-rust-source (with a README). False, the default: it is deleted." },
  { name = "Building", type = "int", access = "read", design = false, doc = "True while a Build runs." },
  { name = "FileManager", type = "string", access = "read", design = false, doc = "What this system calls the file manager Reveal opens: \"Finder\", \"File Explorer\" or \"Files\" (\"\" on the web)." },
  { name = "BuiltPath", type = "string", access = "read", design = false, doc = "What the last Build made: the .app, the .exe or the AppDir (\"\" until one succeeds)." },
  { name = "ImportSummary", type = "string", access = "read", design = false, doc = "The last ImportRapidQ's summary: how many programs, files and names, and how many compile to the same bytecode as their originals." },
  { name = "ImportReport", type = "string", access = "read", design = false, doc = "The last ImportRapidQ's report (rapidr-import-report.md in the copy): every name changed by file, line and column, each include file and where it was found, what was left and why, each program's proof." },
  { name = "ImportMissing", type = "string", access = "read", design = false, doc = "The include files the last ImportRapidQ found nowhere, a line each: the file and line of the $INCLUDE, the name as written and what to do, separated by tabs (\"\" when every include was found)." },
  { name = "ExampleCopy", type = "string", access = "read", design = false, doc = "What the last ExampleToOpen did: \"made\" (it copied the example now), \"kept\" (it gave the copy that was there, as the user left it) or \"\" (the example itself)." },
  { name = "IncludeFolders", type = "string", design = false, doc = "The include folders, a line each: where $INCLUDE looks after the program's own folder for every program Open, Run, Build and ImportRapidQ compile — RapidR Studio's Settings > Include folders. Programs run from here get them too." },
  { name = "RunArgs", type = "string", design = false, doc = "The arguments Run gives the program (what COMMAND$ reads), one string: spaces separate them, a \"quoted\" one keeps its spaces (`[run] args` in the project file). Set it, then Save." },
  { name = "DesignerGrid", type = "int", design = false, range = "1..64", unit = "px", doc = "The form designer's grid step in pixels (`[designer] grid`, 8 unless the project says): what Snap snaps to. Set it, then Save." },
  { name = "DesignerSnap", type = "int", design = false, doc = "True (the default): the form designer snaps what is moved or sized to the grid (`[designer] snap`). Set it, then Save." },
  { name = "DesignerGuides", type = "int", design = false, doc = "True (the default): the form designer shows alignment guides and snaps to them (`[designer] guides`). Set it, then Save." },
]
methods = [
  { name = "Open", params = "Path AS STRING", returns = "INTEGER", test = "skip: needs a project file", doc = "Opens a .rrproj, or a .bas / .rr / .inc file with what it includes. True when it opened; Error says why not." },
  { name = "OpenFolder", params = "Folder AS STRING", returns = "INTEGER", test = "skip: needs a project folder", doc = "Opens the project of a folder: its .rrproj, else its main source (main.rr / main.bas, the one named as the folder, the one with a form). True when it opened." },
  { name = "Save", params = "[Path AS STRING]", returns = "INTEGER", value = true, test = "skip: writes a file", doc = "Writes the project file (a source file's project becomes <Folder>/<Name>.rrproj, or Path), each source file's kind as its code says (FollowCode). True when it was written." },
  { name = "FollowCode", returns = "STRING", value = true, effects = ["file-read", "state"], test = "skip: needs a project file", doc = "The files' kinds as their code says now (forms come from the code: a source or include that creates a form at its top level is a form file, one that no longer does a module or include again), read from the files as saved; not written until Save. The files whose kind changed, a line each: the path and its new kind, tab-separated (\"\" when none did)." },
  { name = "New", params = "Template AS STRING, Name AS STRING, Folder AS STRING", returns = "INTEGER", test = "skip: writes files", doc = "A new project from a template (\"console\", \"gui\", \"rapidq\", \"data\" or \"mdi\"): the main file (main.rr, or main.bas for \"rapidq\", which also turns the classic-compatibility checks on) and <Name>.rrproj written in Folder. On a computer without Rust (see RustReady) the new project's BuildKind is \"interpreted\", the build that works there." },
  { name = "AddFile", params = "Path AS STRING, [Kind AS STRING]", returns = "INTEGER", doc = "Adds a file (its kind from its name and code — a file that creates a form is a form file —, or Kind: module, form, include, resource, asset, data). True when it was added." },
  { name = "RemoveFile", params = "Path AS STRING", returns = "INTEGER", doc = "Takes a file out of the project (the file itself stays). True when it was in it." },
  { name = "Close", value = true, doc = "No project is open any more." },
  { name = "File", params = "Index AS INTEGER", returns = "STRING", doc = "File Index's path, relative to the folder (from 0)." },
  { name = "FileKind", params = "Index AS INTEGER", returns = "STRING", doc = "File Index's kind: module, form, include, resource, asset or data." },
  { name = "FullPath", params = "Index AS INTEGER", returns = "STRING", doc = "File Index's path to open it with (the folder's and its own)." },
  { name = "Build", params = "[Kind AS STRING]", returns = "INTEGER", value = true, test = "skip: builds a program", doc = "Makes the program into an app for this computer's system with rapidr build — a release build, optimized — in OutputFolder: Name.app on macOS, the .exe with its icon and version on Windows, Name.AppDir on Linux. Kind is \"native\" or \"interpreted\" (else BuildKind). Runs in the background: OnBuildOutput gives its lines, OnBuildDone its end. True when it started; Error says why not (on the web there is nothing to run it)." },
  { name = "RustReady", returns = "INTEGER", value = true, test = "skip: runs rapidr", doc = "True when native builds can run: Rust is installed (rapidr setup --rust). Without it only interpreted builds work. True on the web, where Build is not there to ask." },
  { name = "InstallRust", returns = "INTEGER", value = true, test = "skip: installs Rust", doc = "Installs Rust with rapidr setup --yes --no-path (the free toolchain native builds need), in the background like Build: OnBuildOutput gives its lines, OnBuildDone its end. True when it started; Error says why not." },
  { name = "StopBuild", value = true, test = "skip: needs a running build", doc = "Stops the Build that is running." },
  { name = "Reveal", params = "[Path AS STRING]", returns = "INTEGER", value = true, test = "skip: opens the file manager", doc = "Shows Path (else what the last Build made) selected in Finder, Explorer or the Linux file manager." },
  { name = "ImportRapidQ", params = "Source AS STRING, [Dest AS STRING]", returns = "STRING", test = "skip: writes a copy of a program", doc = "Imports a RapidQ program — a .bas, .rqw, .rqb, .rq or .inc file and every file it includes (found as the compiler finds them: the program's folder, IncludeFolders, beside the including file; any case, \\ or /), or a folder of them — as a copy with RapidR's names (QBUTTON becomes RButton) in Dest (else <name>-rapidr beside it, the next free name): the includes copied with it (RAPIDQ.INC and the others RapidR supplies stay built in), each program proved to compile to the same bytecode as its original, a report (ImportReport; ImportMissing lists the includes found nowhere) and a project for the copy (the RapidQ-compatible setting off). The original is only read. Gives the copy's project file to Open; \"\" when it can't (Error says why). On the web, Source is a file or folder in the page's store (one the user picked)." },
  { name = "StudioFolder", returns = "STRING", value = true, effects = ["none"], test = "skip: reads the user's settings folder", doc = "Studio's own folder (never a project's): where the copies of unsaved work and the log of what went wrong in Studio are kept — RapidR's folder of the user's settings (~/Library/Application Support/RapidR on macOS, %APPDATA%\\RapidR on Windows, ~/.config/rapidr on Linux; RAPIDR_STUDIO_DATA when set); on the web, the page's store." },
  { name = "RecoveryKeep", params = "Key AS STRING, Path AS STRING, Caption AS STRING, Text AS STRING", returns = "INTEGER", test = "skip: writes Studio's folder", doc = "Keeps a copy of a document's unsaved text (Key: what tells the document apart, Path its file — \"\" for one never saved —, Caption as its tab says it) in Studio's folder, for RecoveryFound after a Studio that ended without closing. True when it was kept; Error says why not." },
  { name = "RecoveryForget", params = "Key AS STRING", test = "skip: writes Studio's folder", doc = "Lets go of a document's copy (it was saved, or closed and its changes let go)." },
  { name = "RecoveryEnd", value = true, test = "skip: writes Studio's folder", doc = "Studio closed as it should: this Studio's copies go." },
  { name = "RecoveryFound", returns = "STRING", value = true, test = "skip: reads Studio's folder", doc = "The copies a Studio that ended without closing kept (a crash, a kill, the computer switched off) — not this Studio's, not one still running —, a line each: Run, Key, Path and Caption, separated by tabs. \"\" when there are none." },
  { name = "RecoveryText", params = "Run AS STRING, Key AS STRING", returns = "STRING", effects = ["none"], test = "skip: reads Studio's folder", doc = "A copy's text (Run and Key as RecoveryFound gives them)." },
  { name = "RecoveryDiscard", params = "[Run AS STRING]", value = true, test = "skip: writes Studio's folder", doc = "Lets go of the copies of Run (none given: every copy RecoveryFound gives)." },
  { name = "LogError", params = "Line AS STRING", returns = "INTEGER", test = "skip: writes Studio's folder", doc = "Adds Line to the log of what went wrong in Studio (LogFile; the last 256 KB are kept). True when it was written." },
  { name = "LogFile", returns = "STRING", value = true, effects = ["none"], test = "skip: reads the user's settings folder", doc = "The log of what went wrong in Studio's own code: studio-errors.log in StudioFolder." },
  { name = "ApplyBegin", value = true, test = "skip: an Apply's step", doc = "An Apply of changes starts (RAI's: all or nothing): nothing written yet for ApplyUndo to take away." },
  { name = "CanWriteNewFile", params = "Path AS STRING", returns = "INTEGER", test = "skip: reads the disk", doc = "Whether a new file can be written at Path: nothing is there yet, and its folder is one or can be made (the nearest folder above it that is there is a folder, not a file, and can be written). Error says why not. Nothing is written." },
  { name = "WriteNewFile", params = "Path AS STRING, Text AS STRING", returns = "INTEGER", test = "skip: writes a file", doc = "Writes a new file, the folders it needs made first — never over a file that is there. True when it was written; Error says why not (no run-time error). What it made is noted for ApplyUndo." },
  { name = "ApplyUndo", returns = "STRING", value = true, test = "skip: removes files", doc = "Takes away the files and folders WriteNewFile made since ApplyBegin (folders that were there stay): an Apply that couldn't finish leaves the project as it was. The paths taken away, a line each." },
  { name = "ProjectsFolder", params = "Home AS STRING", returns = "STRING", test = "skip: reads the install", doc = "Where New Project puts projects by default: Home's projects folder while Studio runs from a folder of the user's, Documents/RapidR/Projects when Studio is installed (Home has its release.toml) or Home can't be written — never inside RapidR itself." },
  { name = "ExampleToOpen", params = "Path AS STRING, Examples AS STRING", returns = "STRING", test = "skip: copies an example", doc = "The file to open for Path: when it is one of RapidR's examples (in folder Examples) where RapidR is installed (the macOS app, /usr/lib/rapidr, Program Files: a home with its release.toml) or where it can't be changed, the user's copy of it in Documents/RapidR/Examples/<its name>/ — made now with its include and data files (the files `rapidr examples copy` takes), or the copy already there, never overwritten (ExampleCopy says which); else Path itself. \"\" when the copy can't be made (Error says why). On the web, Path itself: the page's store keeps what the user saves." },
  { name = "ExampleOf", params = "Path AS STRING, Examples AS STRING", returns = "STRING", test = "skip: needs an example's copy", doc = "The example (in folder Examples) that Path is the user's copy of (Documents/RapidR/Examples/<name>/<file>); \"\" for any other file." },
  { name = "CopyExampleAgain", params = "Path AS STRING, Examples AS STRING", returns = "STRING", test = "skip: writes an example's copy", doc = "Copies the example again over the user's copy of it (Path: the copy, or the example): its program, include and data files as they come with RapidR replace the copy's; files the user added stay. The copy's main file; \"\" when it can't (Error says why)." },
  { name = "IconPreview", params = "[Size AS INTEGER]", returns = "STRING", test = "skip: writes a file", doc = "Draws the app's icon (Icon, else RapidR's) as a Size-pixel PNG (128 by default) in the project's .rapidr folder and gives its path, for an RImage to show; \"\" when the icon can't be read (Error says why)." },
  { name = "Find", params = "Pattern AS STRING, Options AS STRING, Text AS STRING", returns = "STRING", value = true, doc = "Find in Files: every match of Pattern in Text, a line each: line, column (both from 1), length, the line's text, separated by tabs. Options: any of \"case\" (match case), \"word\" (whole words), \"regex\" (Pattern is a regular expression), separated by commas. \"\" with Error set when the pattern is not a valid regular expression." },
  { name = "Replace", params = "Pattern AS STRING, Options AS STRING, Text AS STRING, With AS STRING", returns = "STRING", doc = "Text with every match of Pattern (Find's Options) replaced by With; in a regular expression's replacement $1 or ${name} stand for its groups." },
  { name = "MacKeys", returns = "INTEGER", value = true, effects = ["none"], doc = "True when the keyboard is a Mac's: Cmd is the shortcut key and Option with an arrow moves by words in text (RapidR Studio on macOS, or Studio's page in a browser on a Mac). Studio's Navigate Back and Forward are Cmd+Option+Left and Right there, so Option+Left still moves by words; elsewhere Alt+Left and Alt+Right." },
  { name = "FilesIn", params = "Folder AS STRING", returns = "STRING", effects = ["file-read"], doc = "The text files under Folder, at any depth, a line each (full paths, sorted): hidden folders, build and target folders, and pictures, sounds, videos, fonts, archives and programs left out; at most 2,000. Search's \"A folder\" scope reads them (the disk on the desktop, the page's store on the web)." },
  { name = "FileText", params = "Path AS STRING", returns = "STRING", doc = "A file's text (UTF-8, or a byte a character as older programs wrote it), from the disk on the desktop and the page's store on the web; Error says why when it can't be read." },
  { name = "NewFileText", params = "Path AS STRING, Kind AS STRING, MainText AS STRING", returns = "STRING", doc = "The text a new project file starts with (Project > Add Form / Add Module): for Kind \"form\" a form named as the file (`CREATE Form2 AS RForm`; \"formmdi\": an MDI main window, `RFormMDI`; or QFORM when MainText — the main program — is written with the classic names or the project is classic-compatible) with its Caption and size; for \"module\" a comment naming it; \"\" for other kinds. Line ends as MainText's." },
  { name = "IncludeRenameEdit", params = "MainText AS STRING, OldPath AS STRING, NewPath AS STRING", returns = "STRING", doc = "The main program's `$INCLUDE` of project file OldPath changed to name NewPath (the file renamed or moved), as one RCODEEDITOR.ApplyPatches line: only the path is replaced; \"\" when MainText doesn't include it." },
  { name = "ThemeOf", params = "MainText AS STRING", returns = "STRING", doc = "The look the main program (its text: MainText) names with `$THEME`, as RapidR names the looks: \"RapidR\" (no `$THEME`: as the system is), \"RapidR Light\", \"RapidR Dark\", \"RapidR High Contrast\" or \"Classic\" (the older names too: `Dark`, `Win98` …)." },
  { name = "ThemeEdit", params = "MainText AS STRING, Look AS STRING", returns = "STRING", doc = "The edit that makes the main program (its text: MainText) name look Look (\"RapidR\", \"RapidR Light\", \"RapidR Dark\", \"RapidR High Contrast\", \"Classic\") with `$THEME`, as one RCODEEDITOR.ApplyPatches line: its `$THEME` line changed, taken out for \"RapidR\" (the default says nothing), or put in after the opening directives, before its `$INCLUDE`s; \"\" when it names that look already." },
  { name = "IncludeRemoveEdit", params = "MainText AS STRING, Path AS STRING", returns = "STRING", doc = "The main program's `$INCLUDE` line of project file Path taken out (the file taken out of the project), as one RCODEEDITOR.ApplyPatches line; \"\" when MainText doesn't include it." },
  { name = "IncludeEdit", params = "MainText AS STRING, Path AS STRING", returns = "STRING", doc = "The `$INCLUDE` the main program (its text: MainText) needs for project file Path, as one RCODEEDITOR.ApplyPatches line (after its last $INCLUDE, else after its opening directives, else before its first statement; the path relative to the main file's folder); \"\" when it includes it already." },
]
events = [
  { name = "OnChange", doc = "The project was opened, saved, closed, or its files changed." },
  { name = "OnBuildOutput", params = "Text AS STRING", doc = "A line rapidr build printed while Build runs." },
  { name = "OnBuildDone", params = "Code AS INTEGER, Path AS STRING", doc = "Build ended: Code 0 when it worked, and Path is what it made (the .app, .exe or AppDir)." },
]

[[component]]
name = "RLANGUAGESERVICE"
display = "LanguageService"
visual = false
doc = "RapidR's language service, the one rapidr lsp and the VS Code extension use: a BASIC file's outline and its diagnostics (the compiler's own messages), as text one item a line, fields separated by tabs. Give it the editor's text with Update."
properties = [
  { name = "CompatMode", type = "string", doc = "\"rapidq\": RapidR's extensions are reported, as in a project kept classic-compatible." },
  { name = "ErrorCount", type = "int", access = "read", design = false, doc = "How many errors the last Diagnostics or ProjectDiagnostics found." },
  { name = "Project", type = "string", design = false, doc = "The open project's main file (\"\" for none). A file it includes — a module, a form's file, at any depth — is then analysed as part of its program, open or not, never alone: no errors in a module that compiles with its project. The code editors' help follows it too." },
  { name = "Targets", type = "string", design = false, values = ["desktop", "web", "both"], doc = "Where the program runs: \"desktop\", \"web\" or \"both\" (the default without a project). What works on one runtime only is noted when the program runs on the other — in Diagnostics at each use, in ProjectDiagnostics once per component with how many uses." },
  { name = "Version", type = "string", access = "read", design = false, doc = "RapidR's version, as this build has it (\"2.121.0\"): what Help > About says." },
]
methods = [
  { name = "Update", params = "File AS STRING, Text AS STRING", doc = "A file's text as the editor has it (saved or not).", arg_kinds = { File = "file:any" } },
  { name = "Close", params = "File AS STRING", value = true, doc = "Forgets the editor's text of a file: it is read from its file again.", arg_kinds = { File = "file:any" } },
  { name = "Outline", params = "File AS STRING", returns = "STRING", doc = "The file's outline, a line per item: depth, kind (sub, function, type, field, method, event, component, constant, variable, label), name, detail, line (from 1), separated by tabs.", arg_kinds = { File = "file:any" } },
  { name = "Help", params = "Word AS STRING, [OfType AS STRING]", returns = "STRING", doc = "The language's entry for a word (a component, a function, a statement, a keyword, a constant, a global object; with OfType, a member of that component type), a part a line: its title, its syntax, what it is (kind, type, default, where it runs), what it does, then a component's members. \"\" when the word isn't known." },
  { name = "HelpPage", params = "Word AS STRING, [OfType AS STRING], [File AS STRING], [Line AS INTEGER], [Column AS INTEGER], [CanInsert AS INTEGER]", returns = "STRING", doc = "The Help pane's page for a word, as Markdown (what RMARKDOWNVIEW shows): a first line of what the pane needs besides the page — the kind of page (start, entry, mine, none), the syntax Insert types (its line breaks as CHR$(13)), the file a name of the program is declared in, its line and the column of its name there (both from 1) — tab-separated, then the page: the title, what it is, the syntax, what it does, a component's properties, methods and events each name a link (help:Word@Type). With File and the caret's Line and Column (from 1) the program's own names are answered too: a variable, a constant, a SUB, a component of the form — its declaration, where it is, its uses, then the help of its type — and a member after a dot is the one of what is before it (Hello.Font.Color: RFont's Color). Word alone with File: the program's name of that name. Without a word: the start page. CanInsert (1): the page offers Insert (the syntax typed into the code).", arg_kinds = { File = "file:any" } },
  { name = "HelpFind", params = "Query AS STRING, [File AS STRING]", returns = "STRING", doc = "The names Query may mean, best first, a line each — the name, what it is, separated by tabs: the program's own names (File's program: your variable, your SUB …) and the language's (components under RapidR's names, the classic names finding them too; functions, statements, keywords, types, directives, global objects and, from two letters on, constants). A name that starts with Query comes before one that has it inside; when none does, the names it is close to. At most 12.", arg_kinds = { File = "file:any" } },
  { name = "Diagnostics", params = "File AS STRING", returns = "STRING", doc = "The file's errors and warnings, a line each: severity (error, warning, note), line, column (from 1), message, file, separated by tabs.", arg_kinds = { File = "file:any" } },
  { name = "ProjectDiagnostics", returns = "STRING", value = true, effects = ["file-read"], doc = "The open project's problems (Project: its main file), as RapidR Studio's Problems pane lists them: the program compiled whole, as a build compiles it (a module is never checked alone), the registry's word on the project's own files, and what works on one runtime only — when Targets reach the other — once per component or builtin with how many uses. Grouped by file, the files with errors first; in a file errors, then warnings, then notes. The same fields as Diagnostics, a line each; \"\" with no project." },
]
events = []

[[component]]
name = "RPROGRAMSESSION"
display = "ProgramSession"
visual = false
default_event = "OnOutput"
doc = "A run of a program under development, as an IDE runs it: in its own process on the desktop (its forms real windows), in a sandboxed frame on the web. Start, stop, pause, step, breakpoints (with conditions, hit counts and log messages), the call stack, variables, watches and evaluation; its output and its stops come as events. What the debugger shows is fetched at each stop before OnStopped, so it can be read at once."
properties = [
  { name = "Program", type = "string", doc = "The source file to run (saved)." },
  { name = "Args", type = "string", doc = "Its command line arguments, as COMMAND$ reads them (spaces separate them, quotes keep spaces)." },
  { name = "Debug", type = "bool", default = true, doc = "Run under the debugger: breakpoints stop it, stepping works." },
  { name = "BreakOnError", type = "bool", default = false, doc = "Stop at the statement of a run-time error (StopReason \"exception\", StopMessage the error)." },
  { name = "StopOnEntry", type = "bool", default = false, doc = "Stop at the program's first statement when it starts." },
  { name = "Theme", type = "string", doc = "The look the program is drawn in when it names none (any name `$THEME` takes; \"\" its default, RapidR's look): `classic` previews it in the classic look." },
  { name = "State", type = "string", access = "read", design = false, doc = "\"stopped\", \"running\" or \"paused\"." },
  { name = "CurrentFile", type = "string", access = "read", design = false, doc = "Where the program is paused: its file.", kind = "file:any" },
  { name = "CurrentLine", type = "int", access = "read", design = false, doc = "Where the program is paused: its line (from 1; 0 when not paused)." },
  { name = "StopReason", type = "string", access = "read", design = false, doc = "Why it paused: \"breakpoint\", \"step\", \"pause\", \"entry\" or \"exception\"." },
  { name = "StopMessage", type = "string", access = "read", design = false, doc = "A run-time error's message, when that's why it paused." },
  { name = "ExitCode", type = "int", access = "read", design = false, doc = "The last run's exit code." },
  { name = "Error", type = "string", access = "read", design = false, doc = "Why the last Start (or another request) failed." },
  { name = "ComponentsRef", type = "int", access = "read", design = false, doc = "The program's components no other holds (its forms, frames, timers …) as a scope for Variables: each opens to its properties and the components it holds." },
  { name = "Frame", type = "int", design = false, doc = "The call stack's selected frame (0: where it is paused; 1 its caller …). Setting it fetches that frame's locals and the watches again, then OnVariables(0)." },
  { name = "LocalsRef", type = "int", access = "read", design = false, doc = "The selected frame's locals, for Variables." },
  { name = "GlobalsRef", type = "int", access = "read", design = false, doc = "The program's globals, for Variables." },
  { name = "Watches", type = "string", design = false, doc = "The watch expressions, one a line: evaluated at every stop (WatchValues)." },
  { name = "BrowserURL", type = "string", access = "read", design = false, doc = "Where RunInBrowser serves the program (on this machine only), once it does." },
  { name = "ShellPath", type = "string", access = "read", design = false, doc = "The PATH the programs run from here get, and their SHELL and RUN calls: on macOS and Linux your login shell's (an app started from the Dock or Finder has a short one, so php, curl or Homebrew's tools wouldn't be found), read once (ReadShellPath) with three seconds to answer; when it can't say, this process's PATH and the usual folders that are there (Homebrew's, /usr/local/bin, ~/.cargo/bin …). \"\" where the PATH isn't changed: Windows (its apps have the full one) and the web. Only read: your shell's files are never written." },
  { name = "ShellPathSource", type = "string", access = "read", design = false, doc = "Where ShellPath came from, in words: your login shell, or why it couldn't say and the usual folders were added." },
]
methods = [
  { name = "Start", returns = "INTEGER", value = true, test = "skip: runs a program", doc = "Runs Program. True when it started; Error says why not." },
  { name = "Stop", value = true, doc = "Ends the program at once." },
  { name = "Pause", returns = "INTEGER", value = true, doc = "Pauses the program at its next statement." },
  { name = "ShowProgram", returns = "INTEGER", value = true, doc = "Brings the running or paused program's windows to the front and makes it the active app (an IDE's Show Program Window; RapidR Studio does it on Continue too): on the desktop the IDE hands its process the front as the system allows it (not on Wayland), on the web its frame gets the keyboard. A paused program's windows show, move and come to the front, but take no clicks or keys until it goes on. False when nothing runs or it couldn't." },
  { name = "Continue", returns = "INTEGER", value = true, doc = "Lets a paused program go on." },
  { name = "StepIn", returns = "INTEGER", value = true, doc = "Runs one statement, into a SUB or FUNCTION it calls." },
  { name = "StepOver", returns = "INTEGER", value = true, doc = "Runs one statement, a call whole." },
  { name = "StepOut", returns = "INTEGER", value = true, doc = "Runs to the end of the SUB or FUNCTION and stops after its call." },
  { name = "SetBreakpoint", params = "File AS STRING, Line AS INTEGER, [Condition AS STRING], [HitCount AS STRING], [LogMessage AS STRING]", returns = "INTEGER", doc = "A breakpoint at a line (from 1) of a file, or its rules changed. Condition: it stops only when that is true. HitCount: only on that hit (3), or >= 3, > 3, <= 3, < 3, % 3 (every third). LogMessage: a logpoint, which prints the message ({expression} shows its value) and goes on.", arg_kinds = { File = "file:any" } },
  { name = "ClearBreakpoint", params = "File AS STRING, Line AS INTEGER", returns = "INTEGER", doc = "Removes a breakpoint.", arg_kinds = { File = "file:any" } },
  { name = "ClearBreakpoints", params = "[File AS STRING]", returns = "INTEGER", doc = "Removes a file's breakpoints (every file's when none is given).", arg_kinds = { File = "file:any" } },
  { name = "RunToCursor", params = "File AS STRING, Line AS INTEGER", returns = "INTEGER", doc = "The program stops at that line once (a paused one goes on to it; a stopped one stops there once started).", arg_kinds = { File = "file:any" } },
  { name = "StackTrace", returns = "STRING", value = true, test = "skip: needs a paused program", doc = "The call stack as the last stop fetched it, the innermost first: a line each, its name, file and line tab-separated." },
  { name = "Variables", params = "Ref AS INTEGER", returns = "STRING", test = "skip: needs a paused program", doc = "Ref's values as fetched (LocalsRef, GlobalsRef, a value's children after Expand): a line each, tab-separated: its name, value, type, children's reference (0: none) and count, the expression that names it (a(2).Name, Form1.Caption), 1 when its value changed since the last stop, a table's columns and a table row's cells (an RDataFrame's; CHR$(31) between them), and what the registry knows of a property (`color`, `handle`, `bool`, `const:alClient`, `choices:alNone|alTop|…`, `readonly`, comma-separated: TreeView.SetItemValue's Hint)." },
  { name = "WatchValues", returns = "STRING", value = true, test = "skip: needs a paused program", doc = "Each watch with its value at this stop: a line each, its expression, value, type, children's reference, 1 when its value changed since the last stop, and how many children it has, tab-separated." },
  { name = "Expand", params = "Ref AS INTEGER", test = "skip: needs a paused program", doc = "Fetches a value's children — an array's elements, a TYPE's fields, a component's properties and the components it holds, an RDataFrame's rows (each opens to its cells), an RNum's numbers —, the first 100: OnVariables(Ref) when they're in." },
  { name = "ExpandMore", params = "Ref AS INTEGER, Start AS INTEGER", test = "skip: needs a paused program", doc = "Fetches the next 100 of a value's children from Start (a big array, frame or RNum pages): added to Variables(Ref), then OnVariables(Ref)." },
  { name = "Evaluate", params = "Expr AS STRING, [Context AS STRING]", returns = "INTEGER", test = "skip: needs a paused program", doc = "Evaluates in the selected frame of the paused program: its answer comes as OnEvaluate(Id, Result, Kind, Ref, Count, Columns) with the Id returned (Ref: its children, for Expand). Context \"repl\" (the Immediate window's): \"? expression\" gives its value, a statement runs; \"clipboard\": the value whole, as plain text (a long string uncut); \"hover\": a data tip's, refused when it would call a SUB, FUNCTION or method." },
  { name = "SetVariable", params = "Name AS STRING, Value AS STRING", returns = "INTEGER", test = "skip: needs a paused program", doc = "A variable of the selected frame set to an expression's value: OnEvaluate(Id, NewValue), then the values again (OnVariables(0))." },
  { name = "SetNextStatement", params = "File AS STRING, Line AS INTEGER", returns = "INTEGER", test = "skip: needs a paused program", doc = "Set Next Statement: the paused program goes on from that line (a line without code: the next with some) — within the SUB or FUNCTION it is paused in. OnEvaluate(Id, \"\") then OnStopped(\"goto\", File, Line); OnEvaluate(Id, \"error: …\") when it can't. Paused at a run-time error, the program then goes on instead of failing (fix a value, run the line again or skip it).", arg_kinds = { File = "file:any" } },
  { name = "StepInTargets", test = "skip: needs a paused program", doc = "Step Into Specific's choices: the SUBs and FUNCTIONs the paused line still calls, in the order it calls them — OnStepInTargets(Targets)." },
  { name = "StepInTarget", params = "Id AS INTEGER", returns = "INTEGER", test = "skip: needs a paused program", doc = "Step Into Specific: into the call of that SUB or FUNCTION (an id from OnStepInTargets) the paused line makes; a line that doesn't make it is stepped over." },
  { name = "Input", params = "Text AS STRING", returns = "INTEGER", doc = "A line for the program's INPUT." },
  { name = "RunInBrowser", returns = "INTEGER", value = true, test = "skip: opens a browser", doc = "Program's web build served on this machine (127.0.0.1, an address nobody can guess) and opened in the default browser (the desktop's; on the web, Error says to run it here). Its lines come as OnOutput; BrowserURL says where it is." },
  { name = "StopBrowser", value = true, doc = "Ends what RunInBrowser serves." },
  { name = "ReadShellPath", value = true, effects = ["process"], test = "skip: runs the login shell", doc = "Starts reading your login shell's PATH in the background (RapidR Studio does at start-up): ShellPath waits for it. Nothing on Windows and the web." },
  { name = "RefreshShellPath", returns = "STRING", value = true, effects = ["process", "wait"], test = "skip: runs the login shell", doc = "Reads your login shell's PATH again now (after you changed your shell's startup files): the new ShellPath." },
]
events = [
  { name = "OnOutput", params = "Text AS STRING", doc = "The program printed Text (PRINT, errors, logpoints)." },
  { name = "OnStopped", params = "Reason AS STRING, File AS STRING, Line AS INTEGER", doc = "The program paused: at a breakpoint, a step's end, a pause, a run-time error. The call stack, the locals, the globals and the watches are in." },
  { name = "OnContinue", doc = "A paused program goes on." },
  { name = "OnExit", params = "Code AS INTEGER", doc = "The program ended, with its exit code." },
  { name = "OnFormShown", params = "Id AS STRING", doc = "The program showed a form." },
  { name = "OnVariables", params = "Ref AS INTEGER", doc = "Values fetched: Ref's children (Expand), or 0 — the selected frame's locals and the watches again (Frame, Watches, SetVariable, a statement evaluated)." },
  { name = "OnEvaluate", params = "Id AS INTEGER, Result AS STRING, Kind AS STRING, Ref AS INTEGER, Count AS INTEGER, Columns AS STRING", doc = "An Evaluate's, SetVariable's or SetNextStatement's answer (\"error: …\" when it failed); its type, its children's reference (0: none; Expand fetches them), how many it has and, for a table (an RDataFrame), its columns' names (CHR$(31) between them)." },
  { name = "OnStepInTargets", params = "Targets AS STRING", doc = "StepInTargets' answer: a line for each call the paused line still makes, its id (for StepInTarget) and its SUB or FUNCTION's name, tab-separated; empty when it calls none." },
  { name = "OnBreakpointPlaced", params = "File AS STRING, Line AS INTEGER, NewLine AS INTEGER", doc = "The running program placed a breakpoint elsewhere than its line: one on a line without code (a comment, a blank line, a DIM) stops at the next line with code, NewLine; NewLine 0: no code follows it in its file, it never stops." },
]

[[component]]
name = "RAIPROJECTTOOLS"
display = "AIProjectTools"
visual = false
doc = "A project as tools for an RAI (docs/ide-ai.md): attached with AI.AttachComponent Tools, \"project\", the model may list and read the project's files (inside ProjectFolder only; an editor's unsaved text when SetFile gave it), list the forms' components and read their properties, describe RapidR's components and builtins, and run the compiler on code — each when it needs it, never the whole project at once; with Permission \"propose\" it also proposes changes to files and new programs, kept here as proposals the program shows as diffs: nothing is written until the user applies one. What it reads goes to the model as data, never as instructions. RapidR Studio's assistant is an RAI with these tools."
example = """
DECLARE SUB Answered(Status AS STRING)

DIM Tools AS RAIProjectTools
DIM AI AS RAI

SUB Answered(Status AS STRING)
    PRINT AI.Transcript
    PRINT Tools.ProposalCount; " change(s) proposed"
END SUB

Tools.ProjectFolder = CURDIR$
Tools.ProjectFiles = "main.rr"
Tools.MainFile = "main.rr"
AI.Provider = "compatible"
AI.BaseURL = "http://localhost:11434/v1"
AI.OnDone = Answered
AI.AttachComponent Tools, "project"
"""
properties = [
  { name = "ProjectFolder", type = "string", design = false, doc = "The project's folder: files are read inside it only (\"\" — no project)." },
  { name = "ProjectFiles", type = "string", design = false, doc = "The project's files, a line each, relative to ProjectFolder (what list_files gives the model)." },
  { name = "MainFile", type = "string", design = false, doc = "The project's main file, relative to ProjectFolder.", kind = "file:any" },
  { name = "ProjectName", type = "string", design = false, doc = "The project's name, as the model is told it." },
  { name = "CompatMode", type = "string", design = false, doc = "\"rapidq\" for a project kept classic-compatible: the model is told to write only the classic language." },
  { name = "Permission", type = "string", default = "propose", values = ["propose", "read-only"], doc = "What the model may do: \"propose\" (read the project and propose changes, shown as diffs the user decides on) or \"read-only\" (read and answer; the proposing tools aren't offered)." },
  { name = "ProposalCount", type = "int", access = "read", design = false, doc = "How many proposals there are: the changes to files that wait for the user's decision (proposed in the last answer or an earlier one; one whose file the user changed meanwhile is set aside at the next question, said), or a new project's files." },
  { name = "ReviewFirst", type = "bool", default = false, design = false, doc = "True: a new program waits to be previewed and created (RapidR Studio's \"Ask before the assistant creates or changes files\"); False: the program creates it as the answer ends, and the model is told so." },
  { name = "ProjectErrors", type = "int", access = "read", design = false, doc = "How many compile errors the new program proposed and not created yet has (0: it compiles)." },
  { name = "CreatedFolder", type = "string", access = "read", design = false, doc = "The folder the last CreateProject made (\"\" when none, or once it was undone)." },
  { name = "CreatedTitle", type = "string", access = "read", design = false, doc = "The title of the program the last CreateProject made, as the model named it (\"Scientific Calculator\")." },
  { name = "ChatsFolder", type = "string", access = "read", design = false, doc = "Where the project's chats are kept, in words: Studio's data folder (never the project's), chats/ beside its settings — ~/Library/Application Support/RapidR/chats on macOS, %APPDATA%\\RapidR\\chats on Windows, ~/.config/rapidr/chats on Linux; this browser's storage for the page on the web." },
  { name = "Lite", type = "bool", access = "read", design = false, doc = "True while the model's window is small (under 16,384 tokens): the lite instructions and tools are sent." },
  { name = "RunOutput", type = "string", design = false, doc = "The end of the last run's output (its last 20 lines), which the model is shown as data from the program, never as instructions — its errors and warnings, so it doesn't have to guess what happened. Setting it replaces it (\"\": a new run); AddRunOutput adds to it. Keys written in it are hidden from the model." },
]
methods = [
  { name = "SetFile", params = "Path AS STRING, Text AS STRING", effects = ["state"], doc = "A file's text as its editor has it, unsaved changes included: what the model reads of it (Path inside ProjectFolder)." },
  { name = "ClearFiles", value = true, effects = ["state"], doc = "Forgets the editors' texts SetFile gave: files are read from their store." },
  { name = "AddRunOutput", params = "Text AS STRING", effects = ["state"], doc = "More of the running program's output (as it prints it): RunOutput keeps its last 20 lines for the model." },
  { name = "ProposalInfo", params = "Index AS INTEGER", returns = "STRING", effects = ["none"], doc = "Proposal Index (from 0), tab-separated: its kind (\"edit\": a file changed, \"create\": a new file of the project, \"project\": a file of a new project), its path, its summary, the new project's name, True for the new project's main file, and the user's decision (\"\", \"applied\", \"partly\", \"rejected\", \"created\")." },
  { name = "ProposalOld", params = "Index AS INTEGER", returns = "STRING", effects = ["none"], doc = "Proposal Index's file as it was (\"\" for a new file): an RDiffView's LeftText." },
  { name = "ProposalNew", params = "Index AS INTEGER", returns = "STRING", effects = ["none"], doc = "Proposal Index's file as proposed: an RDiffView's RightText." },
  { name = "Patch", params = "OldText AS STRING, NewText AS STRING", returns = "STRING", effects = ["none"], doc = "The RCODEEDITOR.ApplyPatches line that turns OldText into NewText (the changed lines replaced, the file's own line breaks kept): applied, the change is one undo step. \"\" when they are the same." },
  { name = "Decide", params = "Index AS INTEGER, Decision AS STRING", effects = ["state"], doc = "Records the user's decision on proposal Index in the RAI's conversation and audit log, once: \"applied\", \"partly\", \"rejected\", \"stale\" (not applied: the file changed after the assistant read it) or \"failed\" (not applied: its editor refused the change). A proposal decided already is left as it was: nothing is said twice." },
  { name = "ClearDecided", value = true, effects = ["state"], doc = "Forgets the proposals the user decided on (after a review is applied): what is left waits for a decision." },
  { name = "ClearProposals", value = true, effects = ["state"], doc = "Forgets the proposals." },
  { name = "CreateProject", params = "Folder AS STRING", returns = "STRING", effects = ["file-write"], test = "skip: writes files", doc = "Writes the new project the model proposed in Folder, in a folder named from its title (\"Scientific Calculator\" → ScientificCalculator; never over one that is there: then ScientificCalculator2, 3 …), with a project file naming it by its title: that file's path, to open; \"error: \" and why when it couldn't. What it wrote is kept for Undo." },
  { name = "ChatList", params = "Project AS STRING", returns = "STRING", effects = ["file-read"], doc = "The kept chats of the project in folder Project (\"\": no project), the newest first, a line each, tab-separated: its id, its title, when it was last changed (ISO 8601, UTC) and how many questions it has." },
  { name = "SearchChats", params = "Project AS STRING, Text AS STRING", returns = "STRING", effects = ["file-read"], doc = "The project's chats whose title or text has Text in it (any case), as ChatList gives them, with a fifth field: the first line that has it (\"\" when the title does)." },
  { name = "SaveChat", params = "Project AS STRING, Id AS STRING, Title AS STRING, Model AS STRING, State AS STRING", returns = "STRING", effects = ["file-write"], doc = "Keeps a chat of the project (State: an RAI's ChatState) in Studio's data folder — a new one when Id is \"\" —, API keys and tokens removed: its id; \"error: \" and why when it couldn't. A title the user gave (RenameChat) stays." },
  { name = "LoadChat", params = "Project AS STRING, Id AS STRING", returns = "STRING", effects = ["file-read"], doc = "A kept chat's state, for an RAI's ChatState (\"\" when there is none)." },
  { name = "DeleteChat", params = "Project AS STRING, Id AS STRING", returns = "STRING", effects = ["file-write"], doc = "Removes a kept chat for good (its file; on the web, its item): what it was, for RestoreChat (Undo); \"\" when there was none." },
  { name = "RestoreChat", params = "Project AS STRING, Kept AS STRING", returns = "STRING", effects = ["file-write"], doc = "Puts back a chat DeleteChat removed (Undo): its id." },
  { name = "RenameChat", params = "Project AS STRING, Id AS STRING, Title AS STRING", returns = "INTEGER", effects = ["file-write"], doc = "Gives a kept chat the title the user typed (kept from then on). True when it was renamed." },
  { name = "ChatTitle", params = "Question AS STRING", returns = "STRING", effects = ["none"], doc = "A chat's title made from its first question: its first line, at most 48 characters." },
  { name = "UndoCheck", returns = "STRING", effects = ["none"], doc = "What changed in the folder CreateProject made since it wrote it, in plain words (\"main.rr was changed; notes.txt was added\"); \"\" when nothing did — then Undo needs no question." },
  { name = "UndoFiles", returns = "STRING", effects = ["none"], doc = "The files CreateProject wrote, a full path a line, each checked to be inside its folder: all Undo removes (KILL each). Never a file the user added." },
  { name = "UndoDone", returns = "INTEGER", effects = ["file-write"], test = "skip: removes folders", doc = "After UndoFiles' files were removed: the folders CreateProject made, each only when empty, and the undo said in the conversation. True when the program's folder is gone (False: files the user added keep it)." },
]
events = []
