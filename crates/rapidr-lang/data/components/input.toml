[[component]]
name = "RCODEEDITOR"
display = "CodeEditor"
visual = true
size = [400, 300]
default_event = "OnChange"
sets = ["layout", "a11y"]
doc = "RapidR Studio's code editor: syntax colours from a language definition (BASIC by default; SQL, JSON, HTML … or your own), line numbers, folding, several carets, find and replace, word wrap, a minimap, markers, problems and IntelliSense (completion, hovers, signatures) from RapidR's language service where the runtime carries it, or from the program through its request events. What it always answered counts lines from 0 (Line, GotoLine, WhereX, WhereY); what's new counts lines and columns from 1."
properties = [
  { name = "Text", type = "string", default = "" },
  { name = "Width", type = "int" },
  { name = "Height", type = "int" },
  { name = "Top", type = "int", default = 0 },
  { name = "Left", type = "int", default = 0 },
  { name = "Visible", type = "int", default = true },
  { name = "Enabled", type = "bool", default = true },
  { name = "Font", type = "font" },
  { name = "FontSize", type = "int", doc = "The code's size in points (10 = 13 pixels); Ctrl+= / Ctrl+- and Ctrl+wheel change it." },
  { name = "FontName", type = "string", doc = "The code's font (JetBrains Mono, built in)." },
  { name = "FontColor", type = "color" },
  { name = "Color", type = "color" },
  { name = "ReadOnly", type = "int" },
  { name = "WordWrap", type = "int", doc = "Long lines break at the view's width (Alt+Z turns it on and off)." },
  { name = "SelStart", type = "int" },
  { name = "SelLength", type = "int" },
  { name = "SelText", type = "string" },
  { name = "Line", type = "string", design = false, indexed = 1 },
  { name = "LineCount", type = "int", design = false },
  { name = "WhereX", type = "int", access = "read", design = false, doc = "The caret's column, from 0." },
  { name = "WhereY", type = "int", access = "read", design = false, doc = "The caret's line, from 0." },
  { name = "Modified", type = "bool", design = false, doc = "The text changed since it was set, loaded or saved (undoing back to the saved text clears it)." },
  { name = "MaxLength", type = "int", design = false },
  { name = "CharCase", type = "int", design = false },
  { name = "WantTabs", type = "bool", doc = "Tab types (indents) in the editor rather than moving the focus on (True by default)." },
  { name = "Language", type = "string", doc = "The language its colours, brackets, indentation and folding follow: an id (\"rapidq-basic\", \"sql\", \"json\", \"html\", \"css\", \"javascript\", \"markdown\", \"toml\", \"rust\", \"csv\", \"plaintext\"), a file name whose extension says, or a language definition file (.toml)." },
  { name = "ColorScheme", type = "string", doc = "\"auto\" (the theme's) or a scheme's name: \"classic\", \"modern\", \"dark\", \"highcontrast\"." },
  { name = "TabSize", type = "int", doc = "Columns per tab stop (4)." },
  { name = "InsertSpaces", type = "bool", doc = "Tab inserts spaces (True) or a tab character." },
  { name = "AutoClose", type = "bool", doc = "Typing an opening bracket or quote types its closing one too." },
  { name = "AutoIndent", type = "bool", doc = "A new line keeps the indentation, one level more after SUB, IF … THEN, FOR …" },
  { name = "ShowLineNumbers", type = "bool", doc = "The gutter numbers the lines." },
  { name = "ShowFolding", type = "bool", doc = "The gutter has fold arrows (SUB … END SUB, CREATE … END CREATE …)." },
  { name = "ShowMinimap", type = "bool", doc = "A small picture of the whole text at the right, its view's part marked; click or drag it to scroll." },
  { name = "ShowWhitespace", type = "bool", doc = "Spaces show as dots, tabs as arrows." },
  { name = "HighlightCurrentLine", type = "bool", doc = "The caret's line is tinted." },
  { name = "Rulers", type = "string", doc = "Columns with a vertical line, comma-separated (\"80,120\")." },
  { name = "CaretLine", type = "int", design = false, doc = "The caret's line, from 1; setting it moves the caret there." },
  { name = "CaretColumn", type = "int", design = false, doc = "The caret's column (a character of the line), from 1." },
  { name = "CursorCount", type = "int", access = "read", design = false, doc = "How many carets there are." },
  { name = "CanUndo", type = "bool", access = "read", design = false, doc = "Undo has something to undo." },
  { name = "CanRedo", type = "bool", access = "read", design = false, doc = "Redo has something to do again." },
  { name = "CompletionTrigger", type = "string", doc = "Characters that open completion by themselves (\".\")." },
  { name = "LanguageService", type = "bool", doc = "RapidR's language service answers completion, hovers, signatures and problems (where the runtime carries it: rapidr run, RapidR Studio); off, the program answers the request events." },
  { name = "DebugHover", type = "bool", design = false, doc = "While True (a debugger paused), a mouse resting on a word asks the program first: OnHoverRequest, answered with ShowHover — before the language service." },
  { name = "KeywordCase", type = "string", doc = "The language's words' case as you type: \"upper\" (DIM x AS INTEGER), \"lower\", \"proper\" or \"preserve\"." },
  { name = "IdentifierCase", type = "string", doc = "The program's own names as you type: \"preserve\" (as typed) or \"declaration\" (as declared — form.caption becomes Form.Caption — and components' members as RapidQ spells them)." },
  { name = "FileName", type = "string", design = false, doc = "The file it was loaded from or saved to (the language service knows it by this name)." },
  { name = "LineEnding", type = "string", design = false, doc = "The file's line breaks SaveToFile writes: \"CRLF\", \"LF\" or \"CR\" (LoadFromFile keeps the file's)." },
  { name = "Encoding", type = "string", access = "read", design = false, doc = "How the file was stored: \"UTF-8\", \"UTF-8 BOM\" or \"Latin-1\" (SaveToFile writes it back the same)." },
  { name = "DiagnosticCount", type = "int", access = "read", design = false, doc = "How many problems it shows." },
  { name = "CompletionItems", type = "string", access = "read", design = false, doc = "The completion list as it shows now, one label a line, best match first (empty while it's closed)." },
  { name = "CompletionSelected", type = "string", access = "read", design = false, doc = "The completion list's selected label (what Tab or Enter would insert); empty while it's closed." },
  { name = "HoverText", type = "string", access = "read", design = false, doc = "The hover showing now (its Markdown), empty when none is." },
  { name = "SignatureText", type = "string", access = "read", design = false, doc = "The signature help showing now (the call's signature), empty when none is." },
  { name = "FoldCount", type = "int", access = "read", design = false, doc = "How many places are folded." },
  { name = "Outline", type = "string", access = "read", design = false, doc = "The file's outline, one entry a line: kind, name, line (from 1) and depth, tab-separated — the language service's (SUBs, FUNCTIONs, TYPEs and their members, the CREATE tree), else the SUBs and FUNCTIONs." },
  { name = "Hint", type = "string" },
  { name = "ShowHint", type = "int" },
  { name = "Cursor", type = "enum", values = ["crDefault", "crNone", "crArrow", "crCross", "crIBeam", "crSize", "crSizeNESW", "crSizeNS", "crSizeNWSE", "crSizeWE", "crUpArrow", "crHourGlass", "crDrag", "crNoDrop", "crHSplit", "crVSplit", "crMultiDrag", "crSQLWait", "crNo", "crAppStart", "crHelp", "crHandPoint"] },
  { name = "Parent", type = "component", kinds = ["QFORM"], design = false },
  { name = "BorderStyle", type = "enum", values = ["bsNone", "bsSingle", "bsSizeable", "bsDialog", "bsToolWindow", "bsSizeToolWin"] },
]
methods = [
  { name = "Clear", value = true },
  { name = "SetFocus", value = true },
  { name = "SelectAll", value = true },
  { name = "CopyToClipboard" },
  { name = "CutToClipboard" },
  { name = "PasteFromClipboard" },
  { name = "LoadFromFile", doc = "Loads a file: its line breaks and encoding are remembered, its language taken from its name unless Language was set." },
  { name = "SaveToFile", doc = "Saves the text (to its FileName when none is given) with the file's own line breaks and encoding; clears Modified." },
  { name = "AddStrings" },
  { name = "GotoSub", value = true },
  { name = "GotoLine", value = true },
  { name = "GetSubList", value = true },
  { name = "Repaint" },
  { name = "Refresh", value = true },
  { name = "Lines" },
  { name = "AddString" },
  { name = "AddLines" },
  { name = "Add" },
  { name = "AddItems", value = true },
  { name = "ClearSelection" },
  { name = "Undo", doc = "Undoes the last edit (typing is undone a word at a time)." },
  { name = "Redo", doc = "Does again what Undo undid." },
  { name = "Find", params = "Text AS STRING, Options AS STRING", returns = "INTEGER", value = true, doc = "Selects the next place of Text after the selection; Options: \"case\", \"word\", \"regex\" (comma-separated). True when found." },
  { name = "FindNext", returns = "INTEGER", value = true, doc = "Find's next place." },
  { name = "FindPrevious", returns = "INTEGER", value = true, doc = "Find's previous place." },
  { name = "Replace", params = "Find AS STRING, With AS STRING, Options AS STRING", returns = "INTEGER", doc = "Replaces the selected place of Find (selecting the next); 1 when it replaced one. A regex's With can say $1." },
  { name = "ReplaceAll", params = "Find AS STRING, With AS STRING, Options AS STRING", returns = "INTEGER", doc = "Replaces every place (Options \"selection\": in the selection), one undo step; how many." },
  { name = "AddCursor", params = "Line AS INTEGER, Column AS INTEGER", doc = "Another caret at a line and column (from 1)." },
  { name = "SelectNextOccurrence", returns = "INTEGER", value = true, doc = "Adds the next place of the selected word to the selections (Ctrl+D)." },
  { name = "ClearCursors", doc = "Back to the one main caret." },
  { name = "Fold", params = "Line AS INTEGER", returns = "INTEGER", doc = "Folds the block at a line (from 1)." },
  { name = "Unfold", params = "Line AS INTEGER", returns = "INTEGER", doc = "Unfolds the block at a line (from 1)." },
  { name = "FoldAll", doc = "Folds every block (Ctrl+K Ctrl+0)." },
  { name = "UnfoldAll", doc = "Unfolds every block (Ctrl+K Ctrl+J)." },
  { name = "InsertText", params = "Text AS STRING", doc = "Types Text at every caret (one undo step)." },
  { name = "ReplaceRange", params = "StartLine AS INTEGER, StartColumn AS INTEGER, EndLine AS INTEGER, EndColumn AS INTEGER, Text AS STRING", doc = "Replaces the text between two places (lines and columns from 1)." },
  { name = "ApplyEdits", params = "Json AS STRING", returns = "INTEGER", doc = "Several edits as one undo step: a JSON list of {\"line\", \"column\", \"endLine\", \"endColumn\", \"text\"} (or \"start\" / \"end\" character offsets). False, and nothing done, when two overlap." },
  { name = "ApplyPatch", params = "StartLine AS INTEGER, StartCol AS INTEGER, EndLine AS INTEGER, EndCol AS INTEGER, Text AS STRING, [Join AS INTEGER]", returns = "INTEGER", doc = "Replaces the text between two places with Text — lines from 0, columns counted in characters, as RDESIGNSURFACE's OnSourceEdit gives them — keeping the carets where they were in the text. One undo step, or with Join True part of the step before (a designer action's several patches undone together). False, and nothing changed, for a range that isn't in the text." },
  { name = "SetDiagnostics", params = "Json AS STRING", doc = "The program's problems, shown as squiggles and in the gutter: a JSON list of {\"line\", \"column\", \"endLine\", \"endColumn\", \"severity\" (error, warning, info, hint), \"message\"}." },
  { name = "ClearDiagnostics", doc = "Removes the problems shown." },
  { name = "AddMarker", params = "Line AS INTEGER, Kind AS STRING, [Note AS STRING]", doc = "A gutter marker on a line (from 1) that follows it through edits. Kinds: \"breakpoint\" (a dot), \"breakpoint.conditional\" (a dot with a bar), \"breakpoint.log\" (a diamond), \"breakpoint.disabled\" (a ring), \"current\" (the debugger's line: an arrow, the line tinted), \"frame\" (a caller's line: a grey arrow, a fainter tint), \"exception\" (an arrow and the line in the error colour), \"bookmark\", \"error\", \"warning\" or a kind of the program's. Note shows as a label after the line's end (a run-time error's message); a line shows one note, the newest." },
  { name = "WordAt", params = "Line AS INTEGER, Column AS INTEGER", returns = "STRING", doc = "The dotted name at a line and column (from 1): the word there and the names before it joined by dots (\"Form.Caption\" on Caption); empty off a word." },
  { name = "RemoveMarker", params = "Line AS INTEGER, [Kind AS STRING]", returns = "INTEGER", doc = "Removes the marker of Kind (every kind when empty) from a line; True when there was one." },
  { name = "ClearMarkers", params = "[Kind AS STRING]", doc = "Removes every marker of Kind (all when empty)." },
  { name = "GetMarkers", params = "[Kind AS STRING]", returns = "STRING", value = true, doc = "The lines (from 1) with a marker of Kind (any when empty), comma-separated." },
  { name = "HasMarker", params = "Line AS INTEGER, [Kind AS STRING]", returns = "INTEGER", doc = "Whether a line (from 1) has a marker of Kind (any when empty)." },
  { name = "ShowCompletion", params = "Items", doc = "Shows a completion list at the caret: lines of tab-separated label, kind, detail and text to insert (a string or a QSTRINGLIST), or JSON. The answer to OnCompletionRequest." },
  { name = "ShowHover", params = "Text AS STRING", doc = "Shows a hover where OnHoverRequest asked (a fenced ``` block shows as code)." },
  { name = "ShowSignature", params = "Text AS STRING, ActiveParam AS INTEGER", doc = "Shows signature help over the caret, the parameter ActiveParam (from 0) marked." },
  { name = "HidePopups", doc = "Closes the completion list, the hover and signature help." },
  { name = "TriggerCompletion", doc = "Opens completion at the caret, as Ctrl+Space does." },
  { name = "TriggerSignature", doc = "Opens signature help at the caret, as Ctrl+Shift+Space does." },
  { name = "TriggerHover", params = "[Line AS INTEGER, Column AS INTEGER]", doc = "Shows the hover at a place (the caret's when none is given)." },
  { name = "QuickFix", doc = "Lists the language service's fixes for the problem at the caret (or on its line), as Ctrl+. (Cmd+. on a Mac) does: a misspelt member's nearest names, a RapidR name RapidQ doesn't know. Enter or Tab applies the one picked, as one undo step." },
  { name = "FormatDocument", doc = "Re-indents the text and cases its words (the language service's; Shift+Alt+F)." },
  { name = "GotoDefinition", doc = "Jumps to the declaration of what's at the caret (F12); in another file, OnNavigate." },
  { name = "FindReferences", doc = "Selects every use of what's at the caret here and tells OnReferences (Shift+F12)." },
  { name = "Rename", params = "NewName AS STRING", doc = "Renames what's at the caret everywhere it's used (F2); other files' edits come through OnFileEdits." },
  { name = "OpenFind", params = "[Mode AS STRING]", doc = "Opens the find box: \"find\", \"replace\", \"goto\" (a line) or \"rename\"." },
  { name = "GotoLineColumn", params = "Line AS INTEGER, Column AS INTEGER", doc = "The caret at a line and column (from 1), scrolled into view." },
  { name = "ToggleComment", doc = "Comments the caret's lines out, or back in (Ctrl+/)." },
  { name = "Indent", doc = "Indents the lines with a caret one level (Ctrl+])." },
  { name = "Outdent", doc = "Takes the lines with a caret one level out (Ctrl+[)." },
  { name = "CopyText", returns = "STRING", value = true, doc = "What Copy would put on the clipboard (the selections, or the caret's line)." },
  { name = "BeginUpdate", doc = "Many changes to come: the view waits for EndUpdate." },
  { name = "EndUpdate", doc = "The changes are done: the view shows them." },
]
events = [
  { name = "OnChange" },
  { name = "OnClick" },
  { name = "OnDblClick" },
  { name = "OnKeyDown" },
  { name = "OnKeyUp" },
  { name = "OnKeyPress" },
  { name = "OnCaretMove", params = "Line AS INTEGER, Column AS INTEGER", doc = "The user moved the caret (line and column from 1)." },
  { name = "OnSelectionChange", doc = "The user changed the selections." },
  { name = "OnGutterClick", params = "Line AS INTEGER, Area AS STRING", doc = "A click in the gutter: Area is \"marker\" (where breakpoints go), \"number\" or \"fold\"." },
  { name = "OnCompletionRequest", params = "Line AS INTEGER, Column AS INTEGER, Prefix AS STRING", doc = "Completion is wanted and no language service answers: answer with ShowCompletion." },
  { name = "OnHoverRequest", params = "Line AS INTEGER, Column AS INTEGER", doc = "The mouse rests on the text and no language service answers (or, with DebugHover, on a word before the service): answer with ShowHover." },
  { name = "OnSignatureRequest", params = "Line AS INTEGER, Column AS INTEGER", doc = "Signature help is wanted (after ( or ,) and no language service answers: answer with ShowSignature." },
  { name = "OnSave", doc = "Ctrl+S (Cmd+S) in the editor." },
  { name = "OnNavigate", params = "File AS STRING, Line AS INTEGER, Column AS INTEGER", doc = "Go to definition found it in another file: open it there." },
  { name = "OnReferences", params = "Json AS STRING", doc = "Find references' places: a JSON list of {\"file\", \"line\", \"column\"}." },
  { name = "OnFileEdits", params = "File AS STRING, Json AS STRING", doc = "A rename's edits to another file (ApplyEdits' JSON with \"start\" / \"end\" byte offsets)." },
]


[[component]]
name = "RDIFFVIEW"
display = "DiffView"
visual = true
size = [500, 300]
default_event = "OnHunkChange"
sets = ["layout", "a11y"]
doc = "Two texts compared line by line, the way a code review shows them: side by side or in one column, the removed lines tinted on one side and the added lines on the other, the changed characters marked, in the language's syntax colours. Each run of changes (a hunk) has Accept and Reject buttons; ResultText is the text the decisions give. RapidR's own; RapidR Studio's assistant and \"compare with saved\" use it."
properties = [
  { name = "LeftText", type = "string", default = "", category = "Data", doc = "The original text (the left side). Setting it or RightText compares the two again: every hunk starts undecided. CR LF and lone CR line breaks become LF." },
  { name = "RightText", type = "string", default = "", category = "Data", doc = "The changed text (the right side), compared with LeftText." },
  { name = "Language", type = "string", default = "rapidq-basic", category = "Appearance", doc = "How the text is coloured: a language id (\"rapidq-basic\", \"sql\", \"json\" …), a file name whose extension says (\"query.sql\"), or a language definition file (.toml). Reading it gives the id." },
  { name = "Mode", type = "string", default = "split", category = "Appearance", doc = "\"split\" shows the two texts side by side, \"inline\" in one column (a hunk's removed lines, then its added ones). The line at the top of the view stays there when it changes." },
  { name = "HunkCount", type = "int", access = "read", design = false, category = "Data", doc = "How many hunks there are: runs of changed lines between unchanged ones (two changes with no unchanged line between them are one hunk)." },
  { name = "CurrentHunk", type = "int", design = false, category = "Data", doc = "The hunk the keyboard works on, from 0 (-1 when there are none). Setting it scrolls that hunk into view." },
  { name = "ResultText", type = "string", access = "read", design = false, category = "Data", doc = "LeftText with every accepted hunk's lines replaced by RightText's. An undecided hunk counts as rejected: its left lines stay." },
  { name = "AcceptedCount", type = "int", access = "read", design = false, category = "Data", doc = "How many hunks are accepted." },
  { name = "RejectedCount", type = "int", access = "read", design = false, category = "Data", doc = "How many hunks are rejected." },
  { name = "Align", type = "enum", values = ["alNone", "alTop", "alBottom", "alLeft", "alRight", "alClient"], default = "alNone" },
  { name = "Left", type = "int", default = 0 },
  { name = "Top", type = "int", default = 0 },
  { name = "Width", type = "int" },
  { name = "Height", type = "int" },
  { name = "Visible", type = "bool", default = true },
  { name = "Enabled", type = "bool", default = true },
  { name = "Hint", type = "string" },
  { name = "ShowHint", type = "bool", default = false },
  { name = "TabOrder", type = "int" },
  { name = "Tag", type = "int" },
  { name = "Font", type = "font", access = "write", design = false },
  { name = "Parent", type = "component", kinds = ["QFORM", "QPANEL", "QTABCONTROL"], access = "write", design = false },
]
methods = [
  { name = "AcceptHunk", params = "Index AS INTEGER", doc = "Accepts hunk Index (from 0): its right-side lines go into ResultText. Fires no OnHunkChange (only the user's decisions do)." },
  { name = "RejectHunk", params = "Index AS INTEGER", doc = "Rejects hunk Index (from 0): its left-side lines stay in ResultText." },
  { name = "AcceptAll", value = true, doc = "Accepts every hunk: ResultText is then RightText." },
  { name = "RejectAll", value = true, doc = "Rejects every hunk: ResultText is then LeftText." },
  { name = "HunkState", params = "Index AS INTEGER", returns = "INTEGER", doc = "Hunk Index's state: 1 accepted, -1 rejected, 0 undecided (and 0 for an index out of range)." },
  { name = "NextHunk", returns = "INTEGER", value = true, doc = "Makes the next hunk the current one (after the last, the first) and scrolls it into view, as F7 does; gives its index (-1: no hunks)." },
  { name = "PreviousHunk", returns = "INTEGER", value = true, doc = "Makes the previous hunk the current one (before the first, the last) and scrolls it into view, as Shift+F7 does; gives its index." },
  { name = "SetFocus", value = true, doc = "Gives the view the keyboard: F7 / Shift+F7 (or Alt+Down / Alt+Up) go from hunk to hunk, Enter or Ctrl+Y accepts the current one, Backspace or Ctrl+N rejects it, the arrows, Page Up / Page Down, Home and End scroll." },
  { name = "Repaint", doc = "Draws the view again." },
]
events = [
  { name = "OnHunkChange", params = "Index AS INTEGER, Accepted AS INTEGER", doc = "The user accepted (Accepted = True) or rejected (False) hunk Index, with its button, a key or a screen reader. The program's own AcceptHunk / RejectHunk / AcceptAll / RejectAll don't fire it." },
  { name = "OnClick" },
  { name = "OnKeyDown" },
  { name = "OnKeyUp" },
  { name = "OnKeyPress" },
]

