# Databases: the registry's components (crates/rapidr-lang; src/lib.rs says how to edit).
group = "Databases"

[[component]]
name = "RSQLITE"
display = "SQLite"
visual = false
default_event = "OnConnect"
doc = "A SQLite database: Connect opens a file (or `:memory:`), Query runs SQL with `?` parameters, FetchRow walks the rows. RapidR's own; also in the browser."
properties = [
  { name = "Database", type = "string" },
  { name = "dB", type = "string", design = false, indexed = 1 },
  { name = "Connected", type = "int" },
  { name = "RowCount", type = "int" },
  { name = "ColCount", type = "int" },
  { name = "FieldCount", type = "int" },
  { name = "Row", type = "int" },
  { name = "TableCount", type = "int" },
  { name = "DBCount", type = "int" },
  { name = "Busy", type = "int", access = "read", design = false, doc = "1 while a background query (QueryAsync) runs, else 0." },
  { name = "InTransaction", type = "int", access = "read", design = false, doc = "1 while a transaction is open on the connection — from BEGIN (or a SAVEPOINT outside one) until COMMIT, END or ROLLBACK —, else 0; as SQLite itself says it after each statement (Query, QueryScalar, a background query's before OnDone), so reading it runs no query and the rows stay. Closing rolls an open transaction back: warn before Close loses changes, `IF DB.InTransaction THEN …`." },
]
methods = [
  { name = "Connect", params = "file", value = true, doc = "Opens (or creates) the database file; \":memory:\" for one in memory. Returns 1 if the database was there already, 0 if new. On the web a database lasts for the page's session (a project's .db file is read in first).", arg_kinds = { file = "file:any" } },
  { name = "Close", value = true },
  { name = "Query", params = "sql, [value] ...", value = true, doc = "Runs the SQL's statements; one with result columns (SELECT, WITH, PRAGMA, … RETURNING) gives the rows FetchRow walks. Values after the SQL are bound to its ? placeholders (never spliced into it: no SQL injection); an array gives its elements. Returns 1, or 0 on an error (OnError gets the message)." },
  { name = "QueryAsync", params = "sql, [value] ...", returns = "INTEGER", effects = ["state"], example = "DIM DB AS RSQLITE\nDIM sql AS STRING\nDB.Connect \":memory:\"\nsql = \"SELECT 42\"\nDB.QueryAsync sql", doc = "Runs the SQL in the background: the program and its windows keep answering while the rows come. Values after the SQL are bound to its ? placeholders, as in Query. The rows arrive in chunks — OnRows(Count) with the rows so far, RowCount following —, then OnDone(Rows, Ms), or OnError(Message) (\"cancelled\" after Cancel). FetchRow and Row(i) walk the rows that have arrived; an RDBGrid with DataSource = this component draws them as they come, only the rows on screen. One query at a time: Query, QueryScalar and QueryAsync while one runs are refused (OnError \"busy: …\"). Returns 1 if it started, else 0 (OnError says why). On the web it runs on the page's thread in slices of a few milliseconds, the page drawn between them." },
  { name = "Cancel", returns = "INTEGER", value = true, effects = ["state"], doc = "Stops the background query (SQLite's interrupt): OnError(\"cancelled\") follows — or OnDone, if it had just finished. Returns 1 if one was running." },
  { name = "FetchRow", value = true, doc = "Moves to the next row of the last query's rows: 1, or 0 past the last." },
  { name = "ColName", params = "Index AS INTEGER", returns = "STRING", effects = ["none"], doc = "The name of column `Index` (from 0) of the last query's rows, as the statement gives it (`SELECT name AS who` → \"who\"; a repeated name stays as it is). \"\" past the last column. A background query's too, as soon as its columns are known." },
  { name = "Schema", returns = "STRING", value = true, effects = ["none"], doc = "The database's tables and views, each with its columns and their declared types, as JSON — what an RCodeEditor's SetSchema takes: `Editor.SetSchema DB.Schema`. \"\" when not connected or while a background query runs (OnError says which)." },
  { name = "ColType", params = "Index AS INTEGER", returns = "STRING", effects = ["none"], doc = "The declared type of column `Index` (from 0) of the last query's rows, as the table declares it (\"INTEGER\", \"VARCHAR(40)\", \"DATE\"); \"\" for an expression (`COUNT(*)`, `a + 1`) or past the last column." },
  { name = "FetchField", value = true },
  { name = "RowSeek", params = "row", value = true, doc = "The next FetchRow fetches row `row` (from 0)." },
  { name = "FieldSeek", value = true },
  { name = "EscapeString", params = "text", value = true, doc = "The text with its single quotes doubled, to put between quotes in SQL (binding with ? is safer)." },
  { name = "ClearParams", value = true, doc = "Drops the values queued with AddParam." },
]
events = [
  { name = "OnConnect" },
  { name = "OnDisconnect" },
  { name = "OnError", params = "Message AS STRING", doc = "Something failed: the message (a query's error, \"not connected: Connect first\", \"busy: …\" while a background query runs, \"cancelled\" after Cancel)." },
  { name = "OnRows", params = "Count AS INTEGER", doc = "A background query's rows arrived: Count is how many have so far (RowCount too). Fired a few dozen times a second at most." },
  { name = "OnDone", params = "Rows AS INTEGER, Ms AS INTEGER", doc = "A background query finished: its rows, and the milliseconds it took." },
]

[[component]]
name = "RMYSQL"
display = "MySQL"
rapidq = "QMYSQL"
visual = false
only = "desktop"
default_event = "OnConnect"
doc = "A client for a MySQL or MariaDB server: connect, run queries and walk the rows they return. Desktop only (a browser has no raw TCP)."
properties = [
  { name = "Connected", type = "int", access = "read", design = false },
  { name = "DB", type = "string", access = "read", design = false, indexed = 1 },
  { name = "DBCount", type = "int", access = "read", design = false },
  { name = "ColCount", type = "int", access = "read", design = false },
  { name = "FieldCount", type = "int", access = "read", design = false },
  { name = "Length", type = "int", access = "read", design = false, indexed = 1, doc = "`Length(i)`: how many bytes field `i` (from 0) of the row the last FetchLengths measured has (a NULL 0); 0 before any." },
  { name = "Row", type = "string", access = "read", design = false, indexed = 1 },
  { name = "RowCount", type = "int", access = "read", design = false },
  { name = "Busy", type = "int", access = "read", design = false, origin = "rapidr", doc = "1 while a background query (QueryAsync) runs, else 0." },
  { name = "Table", type = "string", access = "read", design = false, indexed = 1 },
  { name = "TableCount", type = "int", access = "read", design = false },
  { name = "Host", type = "string", origin = "rapidr" },
  { name = "User", type = "string", origin = "rapidr" },
  { name = "Password", type = "string", origin = "rapidr", secret = true },
  { name = "Database", type = "string", origin = "rapidr" },
  { name = "Port", type = "int", origin = "rapidr" },
  { name = "SSLMode", type = "string", values = ["Preferred", "Disabled", "Required", "VerifyCA", "VerifyFull"], default = "Preferred", origin = "rapidr", category = "Network", doc = "How the connection is encrypted (TLS, the operating system's), as MySQL's own client says it. Preferred (the default): encrypted when the server can, else plain; the certificate isn't checked. Disabled: never. Required: encrypted or no connection; the certificate isn't checked. VerifyCA: also the server's certificate signed by SSLCA (or an authority the system trusts). VerifyFull: also the certificate names Host. A Unix socket or named pipe carries no TLS: Required and stricter refuse it. Read before Connect / RealConnect; Encrypted says what this connection is." },
  { name = "SSLCA", type = "string", editor = "file", origin = "rapidr", category = "Network", doc = "The certificate authority VerifyCA and VerifyFull trust: a .pem (one or more certificates) or .der file, such as the server's ca.pem. \"\": the authorities the system trusts." },
  { name = "Encrypted", type = "int", access = "read", design = false, origin = "rapidr", doc = "1 while the connection is encrypted (TLS), 0 when it is plain or there is none." },
  { name = "InTransaction", type = "int", access = "read", design = false, origin = "rapidr", doc = "1 while a transaction is open on the session, 0 when none, -1 when the server's answers didn't say: as the server reports it (MySQL 5.7+ and MariaDB 10.3+ track it) in its answer to each statement that changes it — BEGIN / START TRANSACTION, COMMIT, ROLLBACK, a change with Autocommit off, the implicit commit after CREATE, ALTER or DROP, SET autocommit = 1 —, so reading it runs no query and the rows stay. -1 (true in an IF: treat it as open) after a query of several statements whose last gives rows (`BEGIN; SELECT …`), after a read with Autocommit off (it may have begun one), and on an older server; the next statement's answer says it again. Closing rolls an open transaction back: `IF My.InTransaction THEN` ask first." },
  { name = "Autocommit", type = "int", access = "read", design = false, origin = "rapidr", doc = "1 while the session commits each statement by itself (MySQL's autocommit, on by default), 0 after `SET autocommit = 0` (each change then waits for COMMIT), -1 before Connect or when the server didn't say. Followed from the server's answers, as InTransaction is." },
  { name = "Item", type = "string", design = false, indexed = 1 },
  { name = "NumFields", type = "int" },
  { name = "NumRows", type = "int" },
]
methods = [
  { name = "Close", value = true },
  { name = "Connect", params = "Host AS STRING, User AS STRING, Passwd AS STRING", returns = "INTEGER", value = true, test = "args: \"rapidr-conformance.invalid\", \"\", \"\"", doc = "Connects to the MySQL server on `Host` (\"\": this machine; the Port property, else 3306) as `User` with password `Passwd`, encrypted as SSLMode says (by default when the server can). Returns 1 if it did, else 0 (OnError gets the message); then Connected, Encrypted, DB(i) and DBCount, and OnConnect." },
  { name = "CreateDB", params = "DB AS STRING", returns = "INTEGER", value = true, doc = "Makes a new database named `DB` on the server. Returns 1 if it did, 0 if not (not connected, or the server refused: OnError gets its message); DB(i) and DBCount then list it." },
  { name = "DropDB", params = "DB AS STRING", returns = "INTEGER", value = true, doc = "Deletes database `DB` and its tables from the server. Returns 1 if it did, 0 if not (OnError gets the server's message); DB(i) and DBCount follow." },
  { name = "EscapeString", params = "S AS STRING, Length AS INTEGER", returns = "STRING", value = true, doc = "The first `Length` characters of `S` made safe between quotes in SQL: NUL, line feed, carriage return, backslash, both quotes and Ctrl+Z each become a backslash pair (\\0 \\n \\r \\\\ \\' \\\" \\Z). Binary data (one character per byte) passes too. RapidR also takes it without `Length` (the whole text); binding values with ? is safer." },
  { name = "FetchField", returns = "VARIANT", value = true },
  { name = "FetchLengths", returns = "INTEGER", value = true, doc = "Measures the current row's fields in bytes for Length(i), which keeps those values until the next FetchLengths. Returns 1, or 0 when there's no current row (before the first FetchRow, past the last)." },
  { name = "FetchRow", returns = "VARIANT", value = true },
  { name = "ColName", params = "Index AS INTEGER", returns = "STRING", origin = "rapidr", effects = ["none"], doc = "The name of column `Index` (from 0) of the last query's rows, from the result's own metadata (`SELECT name AS who` → \"who\"): known on a read-only connection too, nothing run again. \"\" past the last column. A background query's too, as soon as its columns are known." },
  { name = "Schema", returns = "STRING", value = true, origin = "rapidr", effects = ["none"], doc = "The selected database's tables and views, each with its columns and their types (from information_schema: a read-only connection's too), as JSON — what an RCodeEditor's SetSchema takes: `Editor.SetSchema DB.Schema`. \"\" when not connected or while a background query runs (OnError says which)." },
  { name = "ColType", params = "Index AS INTEGER", returns = "STRING", origin = "rapidr", effects = ["none"], doc = "The type of column `Index` (from 0) of the last query's rows, from the result's metadata, as MySQL names it in a table: \"INT\", \"BIGINT UNSIGNED\", \"DECIMAL\", \"VARCHAR\", \"TEXT\", \"BLOB\", \"DATETIME\", \"ENUM\", \"JSON\" …; \"\" past the last column." },
  { name = "FieldSeek", params = "Position AS INTEGER", returns = "VARIANT", value = true },
  { name = "Query", params = "Query AS STRING", returns = "INTEGER", value = true, doc = "Runs the SQL. Values after it are bound to its ? placeholders (sent apart from the SQL: no SQL injection); an array gives its elements. Returns 1, or 0 on an error (OnError gets the message)." },
  { name = "QueryAsync", params = "Query AS STRING, [Value] ...", returns = "INTEGER", origin = "rapidr", effects = ["state"], doc = "Runs the SQL in the background: the program and its windows keep answering while the rows come. Values after the SQL are bound to its ? placeholders, as in Query. The rows arrive in chunks — OnRows(Count) with the rows so far, RowCount following —, then OnDone(Rows, Ms), or OnError(Message) (\"cancelled\" after Cancel). FetchRow and Row(i) walk the rows that have arrived; an RDBGrid with DataSource = this component draws them as they come, only the rows on screen. One query at a time: Query, QueryScalar and QueryAsync while one runs are refused (OnError \"busy: …\"). Returns 1 if it started, else 0 (OnError says why). Its cells are text (binary data: use Query, RowBlob)." },
  { name = "Cancel", returns = "INTEGER", value = true, origin = "rapidr", effects = ["state"], doc = "Stops the background query (the server's KILL QUERY): OnError(\"cancelled\") follows — or OnDone, if it had just finished. Returns 1 if one was running." },
  { name = "RealConnect", params = "Host AS STRING, User AS STRING, Passwd AS STRING, DB AS STRING, Port AS INTEGER, UnixSock AS STRING, Flags AS INTEGER", doc = "Connects like Connect, with more say: `DB` is the database to use (\"\" none), `Port` the server's TCP port (0: 3306), `UnixSock` a Unix socket's path or a Windows named pipe's name to connect through instead of TCP (\"\" none), `Flags` the C client's CLIENT_* flags (CLIENT_COMPRESS = 32 compresses the traffic; CLIENT_SSL = 2048 asks for an encrypted connection: SSLMode Required, unless SSLMode asks for more). An empty `Host` is this machine. A SUB: read Connected (OnConnect / OnError also tell).", test = "args: \"\", \"\", \"\", \"\", 0, \"/nonexistent/rapidr-conformance.sock\", 0" },
  { name = "Refresh", params = "RefreshFlags AS INTEGER", returns = "INTEGER", value = true, doc = "Asks the server to reload or clear what the flags name (MYSQL.INC): Refresh_Grant (1) the privilege tables, Refresh_Log (2) the logs, Refresh_Table (4) the open tables, Refresh_Hosts (8) the host cache, Refresh_Status (16) the status counters — added together for several. The user needs MySQL's RELOAD privilege. Returns 1 if all of it was done, 0 if not (OnError gets the server's message)." },
  { name = "RowBlob", params = "Row AS INTEGER, Bytes AS LONG", returns = "STRING", value = true, doc = "Binary data from the current row: the first `Bytes` bytes of its field number `Row` (from 0; despite the name, a column), one character per byte, NUL and all. `Bytes` is usually Length(Row) after FetchLengths. \"\" without a current row or such a field." },
  { name = "RowSeek", params = "Row AS INTEGER", returns = "VARIANT", value = true },
  { name = "SelectDB", params = "DB AS STRING", returns = "INTEGER", value = true },
  { name = "ClearParams", value = true, origin = "rapidr", doc = "Drops the values queued with AddParam." },
  { name = "LoadBlob", params = "File AS STRING", returns = "STRING", doc = "Reads a file's bytes and returns them as EscapeString would, ready to go between quotes in an INSERT or UPDATE. \"\" if the file can't be read (OnError says why).", arg_kinds = { File = "file:any" } },
  { name = "SaveBlob", params = "Field AS INTEGER, File AS STRING", doc = "Writes field `Field` (from 0) of the current row, its bytes as the server sent them, to a new file `File` (no FetchLengths needed). Does nothing without a current row or such a field.", arg_kinds = { File = "file:any" } },
]
events = [
  { name = "OnConnect", origin = "rapidr" },
  { name = "OnDisconnect", origin = "rapidr" },
  { name = "OnError", params = "Message AS STRING", origin = "rapidr", doc = "Something failed: the message (the server's, \"busy: …\" while a background query runs, \"cancelled\" after Cancel)." },
  { name = "OnRows", params = "Count AS INTEGER", origin = "rapidr", doc = "A background query's rows arrived: Count is how many have so far (RowCount too)." },
  { name = "OnDone", params = "Rows AS INTEGER, Ms AS INTEGER", origin = "rapidr", doc = "A background query finished: its rows, and the milliseconds it took." },
]
