# Menus: the registry's components (crates/rapidr-lang; src/lib.rs says how to edit).
group = "Menus"

[[component]]
name = "RMAINMENU"
display = "MainMenu"
rapidq = "QMAINMENU"
visual = false
doc = "A form's menu bar; its menus and commands are QMENUITEMs."
properties = [
  { name = "Handle", type = "int", access = "read", design = false },
  { name = "Parent", type = "component", kinds = ["QFORM"], access = "write", design = false },
  { name = "ItemCount", type = "int", design = false, origin = "rapidr" },
]
methods = [
  { name = "AddItems", params = "Items ...", value = true },
  { name = "DelIndex", params = "index AS LONG" },
  { name = "DelItems", params = "Items ..." },
  { name = "Insert", params = "I AS INTEGER, Item AS RMenuItem" },
  { name = "Add", origin = "rapidr" },
  { name = "Clear", value = true, origin = "rapidr" },
]
events = []

[[component]]
name = "RMENUITEM"
display = "MenuItem"
rapidq = "QMENUITEM"
visual = false
default_event = "OnClick"
doc = "One menu entry: a command (OnClick), a checkable option, a separator (\"-\") or a submenu holding more items."
properties = [
  { name = "Caption", type = "string", default = "" },
  { name = "Checked", type = "int", default = false },
  { name = "Command", type = "int", access = "read", design = false },
  { name = "Count", type = "int", access = "read", design = false },
  { name = "Enabled", type = "bool", default = true },
  { name = "Handle", type = "int", access = "read", design = false },
  { name = "Hint", type = "string" },
  { name = "MenuIndex", type = "int" },
  { name = "RadioItem", type = "bool", default = false },
  { name = "ShortCut", type = "string" },
  { name = "Tag", type = "int" },
  { name = "Visible", type = "bool", default = true },
  { name = "ItemCount", type = "int", design = false, origin = "rapidr" },
  { name = "Default", type = "bool", default = false, origin = "rapidr", doc = "Draws the item's words bold: the default action of what the menu is for (what a double click or Enter does there). One per menu." },
]
methods = [
  { name = "AddItems", params = "Items ...", value = true },
  { name = "DelIndex", params = "index AS LONG" },
  { name = "DelItems", params = "Items ..." },
  { name = "Insert", params = "I AS INTEGER, Item AS RMenuItem" },
  { name = "Clear", value = true, origin = "rapidr" },
  { name = "Add", origin = "rapidr" },
]
events = [
  { name = "OnClick" },
]

[[component]]
name = "RPOPUPMENU"
display = "PopupMenu"
rapidq = "QPOPUPMENU"
visual = false
default_event = "OnPopup"
doc = "A context menu, shown when the user right-clicks a component whose PopupMenu it is, or by Popup."
properties = [
  { name = "Alignment", type = "enum", values = ["taLeftJustify", "taRightJustify", "taCenter"] },
  { name = "AutoPopup", type = "bool", default = true },
  { name = "Handle", type = "int", access = "read", design = false },
  { name = "Tag", type = "int" },
  { name = "WindowHandle", type = "int" },
  { name = "ItemCount", type = "int", design = false, origin = "rapidr" },
  { name = "AccessibleName", type = "string", default = "", origin = "rapidr", category = "Accessibility", doc = "What a screen reader calls the menu while it is open — say what it is for: \"Actions for orders.rr\". Without it, \"Menu\"." },
  { name = "SystemMenu", type = "bool", default = true, origin = "rapidr", category = "Appearance", doc = "True (the default): on macOS and Windows the system shows the menu, as its other menus. False: RapidR draws it on every system, in the program's look (RapidR's light, dark, high contrast), so it shows in screenshots and recordings and RapidR's AI tools can see and pick its items. RapidR Studio's menus are drawn this way." },
]
methods = [
  { name = "AddItems", params = "Items ...", value = true },
  { name = "DelIndex", params = "index AS LONG" },
  { name = "DelItems", params = "Items ..." },
  { name = "Insert", params = "I AS INTEGER, Item AS RMenuItem" },
  { name = "Popup", params = "X AS INTEGER, Y AS INTEGER" },
  { name = "Clear", value = true, origin = "rapidr" },
  { name = "Add", origin = "rapidr" },
  { name = "PopupAt", params = "Control, X AS INTEGER, Y AS INTEGER", origin = "rapidr", effects = ["ui"], doc = "Shows the menu at (X, Y) inside Control (any component on a form), its top-left corner the origin, wherever Control sits in its window (docked, in a panel): a menu under a list's item or beside a button, where Popup takes the screen's coordinates. As with Popup, OnPopup comes first and the item picked fires its OnClick." },
]
events = [
  { name = "OnPopup" },
]
