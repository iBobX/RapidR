# Media: the registry's components (crates/rapidr-lang; src/lib.rs says how to edit).
group = "Media"

[[component]]
name = "RMIDI"
display = "MIDI"
rapidq = "QMIDI"
from = "QMidi.inc"
visual = false
default_event = "OnChange"
doc = "Plays a standard MIDI file (QMidi.inc) on a system MIDI output that makes sound (Windows' GS Wavetable Synth, FluidSynth, TiMidity, an output named in the RAPIDR_MIDI_OUT environment variable), or on RapidR's own synthesizer where there is none: a Mac's MIDI outputs and Linux's Midi Through only pass messages on to other programs, so a song is never sent to one by itself. RAPIDR_MIDI_OUT=builtin always uses RapidR's synthesizer."
example = """
DIM Midi AS RMIDI
Midi.Timer.Interval = 200
IF Midi.Open("tune.mid") THEN
    Midi.Volume = 80
    Midi.Play
ELSE
    PRINT "Can't open it: "; Midi.Error
END IF
"""
properties = [
  { name = "Timer", type = "component", kinds = ["QTIMER"] },
  { name = "Lenght", type = "int", access = "read", design = false },
  { name = "State", type = "int", default = 0, access = "read", design = false },
  { name = "FileOpen", type = "bool", default = false, access = "read", design = false },
  { name = "CurrentFrame", type = "int" },
  { name = "Error", type = "string", access = "read", design = false },
  { name = "Volume", type = "int", default = 0 },
  { name = "Interval", type = "int", origin = "rapidr" },
  { name = "Enabled", type = "bool", origin = "rapidr" },
  { name = "Length", type = "int", origin = "rapidr" },
  { name = "LengthTime", type = "string", origin = "rapidr" },
  { name = "Position", type = "int", origin = "rapidr" },
]
methods = [
  { name = "Close", value = true },
  { name = "Open", params = "FileName AS STRING", returns = "VARIANT", value = true, arg_kinds = { FileName = "file:sound" } },
  { name = "Play" },
  { name = "Stop" },
  { name = "Pause" },
]
events = [
  { name = "OnChange", params = "position AS LONG" },
]

