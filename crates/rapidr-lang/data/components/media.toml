[[component]]
name = "RAUDIOOUT"
display = "AudioOut"
visual = false
default_event = "OnNeedData"
doc = "Plays sound the program makes sample by sample, as it comes: an emulator's beeper or sound chip, a synthesizer, a tone for a science lesson. Write puts samples in its queue (16-bit numbers, -32768 to 32767, from an INTEGER array, a binary string or an RMemoryStream; WriteFloat takes -1 to 1); the sound device plays them on a thread of its own and never waits for the program. Keep about BufferMs of sound queued: write in OnNeedData (raised on the program's thread when the queue drops under BufferMs, with how many samples fill it again) or check Queued from a timer, one frame at a time. When the queue runs dry it plays silence after a 2 ms fade (no click) and Underruns counts it. Stereo samples are interleaved, left then right. In a browser sound starts only after a click or a key on the page: call Start from a button's OnClick (Error says so otherwise). Without a sound device it plays silently, in time (Error says why). RapidR's own."
example = """
DIM Speaker AS RAudioOut
DIM phase AS DOUBLE
SUB Feed (Count AS INTEGER)
    DIM buf(Count - 1) AS INTEGER, i AS INTEGER
    FOR i = 0 TO Count - 1
        buf(i) = SIN(phase) * 6000              ' a quiet 440 Hz tone
        phase = phase + 2 * 3.14159265 * 440 / Speaker.SampleRate
    NEXT
    Speaker.Write buf, Count
END SUB
Speaker.OnNeedData = Feed
Speaker.Start
"""
properties = [
  { name = "SampleRate", type = "int", default = 44100, range = "8000..96000", unit = "hz", category = "Media", doc = "Samples a second (a frame of each channel). 44100 is a CD's; 22050, 11025 and 8000 are lighter for small machines. The sound device converts it to its own. Changing it while playing starts the stream again, what waited dropped." },
  { name = "Channels", type = "int", default = 1, range = "1..2", category = "Media", doc = "1, mono; 2, stereo — then samples are interleaved: left, right, left … (Count and Queued count both). Changing it while playing starts the stream again." },
  { name = "Bits", type = "int", default = 16, range = "8..16", doc = "How Write and WriteSample read numbers and bytes: 16, signed 16-bit samples (-32768 to 32767; a binary string's bytes in little-endian pairs); 8, unsigned bytes (0 to 255, 128 the silent middle) as 8-bit WAV files have them. WriteFloat always takes -1 to 1." },
  { name = "BufferMs", type = "int", default = 60, range = "20..1000", unit = "ms", category = "Media", doc = "How much sound to keep queued: OnNeedData asks when the queue drops under it. Smaller answers sooner (an instrument you play) and needs the program on time; larger survives a busy moment. The sound you hear is about this late." },
  { name = "Volume", type = "int", default = 100, range = "0..100", unit = "percent", doc = "Loudness: 100 plays the samples as written, 50 about half as loud (by the ear: a gain of 0.25), 0 silent. A change glides over 10 ms, so a slider never clicks." },
  { name = "Enabled", type = "bool", default = true, doc = "False pauses it: quiet (a 2 ms fade), what waits kept, no OnNeedData; True goes on where it was, fading in." },
  { name = "Playing", type = "bool", access = "read", design = false, doc = "True between Start and Stop while Enabled." },
  { name = "Queued", type = "int", access = "read", design = false, unit = "ms", doc = "How much written sound waits to be played, in ms. A frame-driven program writes until it is about BufferMs. The queue holds 2 seconds." },
  { name = "Underruns", type = "int", access = "read", design = false, unit = "count", doc = "How many times the queue ran dry while playing — each a gap you hear, because the program didn't write in time (a sound that simply ends counts once too). 0 is the goal; Start begins again at 0." },
  { name = "Error", type = "string", access = "read", design = false, doc = "Why it can't be heard (\"\" when it can): no sound device, a program built without sound, a browser waiting for a click or key, a property set out of its range (the nearest value is used)." },
]
methods = [
  { name = "Start", effects = ["device"], doc = "Starts playing: what is queued first, then what the program writes (the sound device gets 40 ms of silence before them, so a headset that takes a burst as it begins never cuts the start). In a browser, call it from a click or key handler (the browser's rule)." },
  { name = "Stop", effects = ["device"], doc = "Stops the sound with a 2 ms fade (no click) and drops what was waiting; Start begins again with what is written next." },
  { name = "Clear", value = true, effects = ["state"], doc = "Drops what is waiting and keeps playing (an emulator's reset): silence until the next Write." },
  { name = "Write", params = "Samples AS VARIANT, [Count AS INTEGER], [Offset AS INTEGER]", returns = "INTEGER", effects = ["device"], test = "args: 0", doc = "Queues samples as Bits says, from an INTEGER (or BYTE, LONG …) array, a binary string (16-bit: two bytes a sample, low byte first), an RMemoryStream (from its Position, which moves past what was taken) or one number. Count: how many samples (default: all); Offset: how many to skip first. Stereo is interleaved. Returns how many it took: fewer when the queue (2 seconds) is full." },
  { name = "WriteFloat", params = "Samples AS VARIANT, [Count AS INTEGER], [Offset AS INTEGER]", returns = "INTEGER", effects = ["device"], test = "args: 0", doc = "Queues samples from -1 to 1 (louder ones clipped), from a SINGLE or DOUBLE array or one number; Count and Offset as Write's. Returns how many it took." },
  { name = "WriteSample", params = "Value AS INTEGER", returns = "INTEGER", effects = ["device"], test = "args: 0", doc = "Queues one sample as Bits says (16-bit: -32768 to 32767) — the simplest way to learn, a sample at a time; Write with an array is much faster. Returns 1, or 0 when the queue is full." },
]
events = [
  { name = "OnNeedData", params = "Count AS INTEGER", doc = "The queue dropped under BufferMs: write about Count samples now (for stereo, both channels counted) to fill it again. Raised on the program's thread, never the sound device's, while it plays; asked again after a Write or half of BufferMs." },
]

[[component]]
name = "RMIDIPORT"
display = "MIDIPort"
visual = false
default_event = "OnMessage"
doc = "MIDI in and out: lists the MIDI keyboards, controllers and synthesizers there are, opens one input and one output (by number or by name), raises events for what arrives — every message (OnMessage), notes (OnNoteOn, OnNoteOff), knobs and pedals (OnControl), whole System Exclusive messages (OnSysEx) — and sends notes, controls, program changes and SysEx. SysEx is off until the program asks for it: set IgnoreSysEx = False to receive SysEx (SysEx can change settings stored inside a device, and in a browser it is a separate permission). Events run on the program's thread, in order; a SysEx that arrives in pieces comes whole; nothing is lost in a burst (Dropped says if the program falls behind). In a browser the first use shows why the program asks, then the browser asks the user; a refusal is a plain message in Error. Make one RMIDIPort for each input to listen to. RapidR's own."
example = """
DIM Midi AS RMIDIPort
SUB NoteOn (Channel AS INTEGER, Note AS INTEGER, Velocity AS INTEGER)
    PRINT "note "; Note; " on channel "; Channel; ", velocity "; Velocity
END SUB
Midi.OnNoteOn = NoteOn
IF Midi.InputCount > 0 THEN
    IF Midi.OpenInput(0) THEN PRINT "Listening to "; Midi.InputName
ELSE
    PRINT "No MIDI input: "; Midi.Error
END IF
"""
properties = [
  { name = "IgnoreSysEx", type = "bool", default = true, category = "Media", doc = "True (the start) drops System Exclusive messages that arrive: set IgnoreSysEx = False to receive SysEx (OnSysEx). SysEx can change settings stored inside a MIDI device, so a program asks for it; in a browser that asks the user for the SysEx permission, separately from notes." },
  { name = "IgnoreClock", type = "bool", default = true, category = "Media", doc = "True (the start) drops timing clock (&HF8, 24 a beat) and MIDI time code quarter frames (&HF1), which some devices send all the time. False gives them to OnMessage (a tempo display, syncing to a sequencer)." },
  { name = "IgnoreActiveSensing", type = "bool", default = true, category = "Media", doc = "True (the start) drops active sensing (&HFE), the \"still here\" byte some keyboards send three times a second." },
  { name = "IsInputOpen", type = "bool", access = "read", design = false, doc = "True while an input is open (OpenInput)." },
  { name = "IsOutputOpen", type = "bool", access = "read", design = false, doc = "True while an output is open (OpenOutput)." },
  { name = "InputName", type = "string", access = "read", design = false, doc = "The name of the input that is open (\"\" when none)." },
  { name = "OutputName", type = "string", access = "read", design = false, doc = "The name of the output that is open (\"\" when none)." },
  { name = "Timestamp", type = "float", access = "read", design = false, unit = "ms", doc = "When the message being handled arrived, in ms since the input opened (fractions kept): read it in an event to record what was played." },
  { name = "Queued", type = "int", access = "read", design = false, unit = "count", doc = "Messages that arrived and wait for their events." },
  { name = "Dropped", type = "int", access = "read", design = false, unit = "count", doc = "Messages lost since the input opened because they came faster than the program handled them (more than 32768 waiting). 0 is the goal; OnError says when it happens." },
  { name = "Error", type = "string", access = "read", design = false, doc = "Why the last call didn't work, in plain words (\"\" when it did): no such device, a device in use, nothing open, a data byte over 127, a SysEx without its F7, a browser that didn't allow MIDI or SysEx." },
]
methods = [
  { name = "InputCount", returns = "INTEGER", value = true, effects = ["none"], doc = "How many MIDI inputs there are now (the list is read again). In a browser the first call asks the user first (the program waits for the answer). 0 when there are none; Error says why when MIDI isn't there at all." },
  { name = "OutputCount", returns = "INTEGER", value = true, effects = ["none"], doc = "How many MIDI outputs there are now, as InputCount." },
  { name = "InputDevice", params = "Index AS INTEGER", returns = "STRING", effects = ["none"], test = "args: 0", doc = "The name of input Index (0 is the first) in the list InputCount read; \"\" past its end. Two devices with one name are told apart: the second is \"Name (2)\"." },
  { name = "OutputDevice", params = "Index AS INTEGER", returns = "STRING", effects = ["none"], test = "args: 0", doc = "The name of output Index, as InputDevice." },
  { name = "FillInputs", params = "List AS VARIANT", returns = "INTEGER", effects = ["ui"], test = "skip: needs a list box", doc = "Reads the inputs again and puts their names in an RListBox or RComboBox (cleared first), the open one selected (none when none is open); returns how many. Then OpenInput(List.ItemIndex) opens the one picked." },
  { name = "FillOutputs", params = "List AS VARIANT", returns = "INTEGER", effects = ["ui"], test = "skip: needs a list box", doc = "The outputs in a list box or combo box, as FillInputs." },
  { name = "OpenInput", params = "Device AS VARIANT", returns = "INTEGER", effects = ["state"], test = "args: 0", doc = "Opens an input: Device is its number in the list or its name (the exact name, else the first that contains it, any case: \"keys\" finds \"USB Keys\"). An input that was open is closed first. True when it opened; False, and Error says why (not there, in use by another program, a browser's refusal)." },
  { name = "OpenOutput", params = "Device AS VARIANT", returns = "INTEGER", effects = ["state"], test = "args: 0", doc = "Opens an output, as OpenInput: then Send and the other Send methods go to it." },
  { name = "CloseInput", effects = ["state"], doc = "Closes the input (what was waiting is dropped). Nothing open: nothing happens." },
  { name = "CloseOutput", effects = ["state"], doc = "Closes the output." },
  { name = "Close", value = true, effects = ["state"], doc = "Closes the input and the output." },
  { name = "Send", params = "Status AS INTEGER, [Data1 AS INTEGER], [Data2 AS INTEGER]", returns = "INTEGER", effects = ["device"], test = "args: 144, 60, 0", doc = "Sends one short message to the output: Status (&H90 note on + channel - 1, &HB0 control change, &HC0 program change …) and the data bytes it takes (0 to 127; a program change takes one, a clock none). True when it went out; False, and Error says why." },
  { name = "SendNoteOn", params = "Channel AS INTEGER, Note AS INTEGER, Velocity AS INTEGER", returns = "INTEGER", effects = ["device"], test = "args: 1, 60, 0", doc = "Starts a note: Channel 1 to 16, Note 0 to 127 (60 is middle C), Velocity 1 to 127 (how hard; 0 stops it). True when it went out." },
  { name = "SendNoteOff", params = "Channel AS INTEGER, Note AS INTEGER, [Velocity AS INTEGER]", returns = "INTEGER", effects = ["device"], test = "args: 1, 60", doc = "Stops a note started with SendNoteOn (Velocity 0 unless given). True when it went out." },
  { name = "SendControl", params = "Channel AS INTEGER, Controller AS INTEGER, Value AS INTEGER", returns = "INTEGER", effects = ["device"], test = "args: 1, 7, 100", doc = "Sends a control change: Controller 0 to 127 (7 volume, 10 pan, 64 sustain pedal, 123 all notes off), Value 0 to 127. True when it went out." },
  { name = "SendProgram", params = "Channel AS INTEGER, Program AS INTEGER", returns = "INTEGER", effects = ["device"], test = "args: 1, 0", doc = "Chooses an instrument: Program 0 to 127 (on a General MIDI synthesizer 0 is a piano, 40 a violin). True when it went out." },
  { name = "SendSysEx", params = "Data AS STRING", returns = "INTEGER", effects = ["device"], risk = "irreversible", test = "skip: needs an open output", doc = "Sends a whole System Exclusive message: a binary string that starts with F0 (CHR$(240)) and ends with F7 (CHR$(247)), every byte between 0 to 127, any length. SysEx can change settings stored inside a device, even its firmware on some: send only messages you know. In a browser the first one asks the user for the SysEx permission. True when it went out." },
  { name = "SendHex", params = "Text AS STRING", returns = "INTEGER", effects = ["device"], risk = "irreversible", test = "skip: needs an open output", doc = "Sends bytes written in hex: \"F0 7E 7F 06 01 F7\" (the Identity Request), \"90 3C 64\" (a note). Spaces, commas, &H and 0x are allowed; each message must be whole. True when it went out; False, and Error says what is wrong." },
  { name = "Hex", params = "Data AS STRING", returns = "STRING", effects = ["none"], test = "args: \"x\"", doc = "The bytes of a binary string in hex, \"F0 7E 7F 06 01 F7\": what a MIDI monitor shows (OnSysEx's Data)." },
]
events = [
  { name = "OnMessage", params = "Status AS INTEGER, Data1 AS INTEGER, Data2 AS INTEGER", doc = "Every short message that arrives (notes, controls, program changes, pitch bend, aftertouch, start, stop, song position …), on the program's thread, in order: Status is the whole status byte (&H90 + channel - 1 for a note on), Data1 and Data2 its data bytes (0 when it has fewer). Running status is already expanded. OnNoteOn, OnNoteOff and OnControl come after it for theirs." },
  { name = "OnNoteOn", params = "Channel AS INTEGER, Note AS INTEGER, Velocity AS INTEGER", doc = "A key went down: Channel 1 to 16, Note 0 to 127 (60 is middle C), Velocity 1 to 127. (A note on with velocity 0 is a note off and fires OnNoteOff.)" },
  { name = "OnNoteOff", params = "Channel AS INTEGER, Note AS INTEGER, Velocity AS INTEGER", doc = "A key came up: Channel 1 to 16, Note 0 to 127, Velocity (how fast it came up; often 0)." },
  { name = "OnControl", params = "Channel AS INTEGER, Controller AS INTEGER, Value AS INTEGER", doc = "A knob, slider, wheel or pedal moved (a control change): Channel 1 to 16, Controller 0 to 127 (1 the modulation wheel, 7 volume, 64 the sustain pedal), Value 0 to 127." },
  { name = "OnSysEx", params = "Data AS STRING", doc = "A whole System Exclusive message arrived — only when IgnoreSysEx is False (set IgnoreSysEx = False to receive SysEx): Data is a binary string from F0 (CHR$(240)) to F7 (CHR$(247)), each character one byte (ASC 0 to 255). A message that came in pieces comes whole; Hex(Data) shows it in hex." },
  { name = "OnDevicesChanged", doc = "A MIDI device was plugged in or out: read InputCount / OutputCount (or FillInputs) again. The desktop looks about once a second, a browser says at once." },
  { name = "OnError", params = "Message AS STRING", doc = "Something went wrong while no call was being made: an open device was unplugged (it is closed), messages were dropped because the program fell behind, a SysEx was cut or longer than 1 MB. Message (also in Error) says it in plain words." },
]
