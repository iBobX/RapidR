# RapidR Studio's panels: the registry's components (crates/rapidr-lang; src/lib.rs says how to edit).
# Public components (docs/ide-components.md §3): the IDE is built from them, and any program may use them.
group = "IDE"

[[component]]
name = "RPROPERTYINSPECTOR"
visual = true
size = [280, 400]
default_event = "OnPropertyChange"
sets = ["layout", "a11y", "generic"]
doc = "An object inspector in the style of Delphi's: the properties of a component (or of every component a designer has selected) as a two-column grid of names and values, by category or A to Z, with a search box and an editor for each kind of value — numbers, text, True / False, a list of constants, a set of flags, colours with a picker, fonts, pictures and files, lists of strings, a component reference, and a visual editor for the four Anchors. A value left at its default is shown dimmed and can be reset; RapidR's own members of a RapidQ component are grouped under \"RapidR extensions\". An Events page lists the component's events and the SUB each one runs."
properties = [
  { name = "Align", type = "enum", values = ["alNone", "alTop", "alBottom", "alLeft", "alRight", "alClient"], default = "alNone" },
  { name = "Target", type = "string", default = "", design = false, doc = "The component inspected: its name (or Handle). Several names separated by commas inspect them together: only the properties they all have are shown, and a change goes to every one of them." },
  { name = "Designer", type = "component", kinds = ["RDESIGNSURFACE"], design = false, doc = "A form designer whose selection the inspector follows: what the user selects there is inspected, and a change is made in the designer." },
  { name = "View", type = "string", default = "categories", doc = "How the rows are ordered: \"categories\" (grouped, the default) or \"alphabetic\"." },
  { name = "Page", type = "string", default = "properties", doc = "The page shown: \"properties\" or \"events\"." },
  { name = "Filter", type = "string", default = "", design = false, doc = "The search box's text: only the rows whose name matches it are shown." },
  { name = "ShowEvents", type = "bool", default = true, doc = "Whether the Events page can be shown (its tab is there)." },
  { name = "ShowRapidRExtensions", type = "bool", default = true, doc = "Whether RapidR's own members of a RapidQ component are shown (under \"RapidR extensions\", with a badge)." },
  { name = "ReadOnly", type = "bool", default = false, doc = "Values are shown but can't be changed." },
  { name = "Handlers", type = "string", default = "", design = false, editor = "strings", doc = "The SUBs an event can run, one per line as `Name(parameters)`: the Events page offers those whose parameters fit the event." },
  { name = "NameWidth", type = "int", default = 120, doc = "The width of the names' column, in pixels (the user drags the line between the columns)." },
  { name = "Selected", type = "string", default = "", design = false, doc = "The property (or event) whose row is selected; setting it selects that row." },
  { name = "RowCount", type = "int", access = "read", design = false, doc = "How many rows are shown now (the categories' headings included)." },
  { name = "TargetType", type = "string", access = "read", design = false, doc = "The inspected component's type as the program writes it (QBUTTON), or \"\" when several of different types are inspected." },
  { name = "Height", type = "int" },
  { name = "Hint", type = "string" },
  { name = "Left", type = "int", default = 0 },
  { name = "Parent", type = "component", kinds = ["QFORM", "QPANEL", "QTABCONTROL"], access = "write", design = false },
  { name = "Top", type = "int", default = 0 },
  { name = "Width", type = "int" },
  { name = "Enabled", type = "bool", default = true },
  { name = "Visible", type = "bool", default = true },
  { name = "Font", type = "font" },
]
methods = [
  { name = "Refresh", value = true, doc = "Reads the inspected components' values again (after the program changed them)." },
  { name = "ExpandAll", value = true, doc = "Opens every category and every row with parts (a set, a font)." },
  { name = "CollapseAll", value = true, doc = "Closes every category and every row with parts." },
  { name = "Expand", params = "Name AS STRING", doc = "Opens a category or a row with parts." },
  { name = "Collapse", params = "Name AS STRING", doc = "Closes a category or a row with parts." },
  { name = "Value", params = "Prop AS STRING", returns = "STRING", doc = "A property's value as the inspector shows it (\"alClient\", \"akLeft, akTop\", \"&H0000FF\")." },
  { name = "SetValue", params = "Prop AS STRING, Value AS STRING", returns = "INTEGER", doc = "Changes a property as if the user had typed Value into its row (the same checks, then OnPropertyChange). True when the value was taken." },
  { name = "ResetValue", params = "Prop AS STRING", doc = "Puts a property back to its default value." },
  { name = "IsDefault", params = "Prop AS STRING", returns = "INTEGER", doc = "True when a property has its default value." },
  { name = "EditValue", params = "Prop AS STRING", doc = "Selects a property's row and starts its editor, as a double click would." },
  { name = "AddProperty", params = "Name AS STRING, Type AS STRING, Value AS STRING, [Category AS STRING]", doc = "Shows a property of the program's own (an object the registry doesn't know): Type is \"int\", \"float\", \"string\", \"bool\", \"color\", \"file\" or a list of constants separated by \"|\". Its changes come to OnPropertyChange." },
  { name = "ClearProperties", value = true, doc = "Removes the properties AddProperty gave." },
  { name = "Row", params = "Index AS INTEGER", returns = "STRING", doc = "What row Index (from 0) shows, as \"Name=Value\" (a category heading as \"[Name]\")." },
]
events = [
  { name = "OnPropertyChange", params = "Prop AS STRING, Value AS STRING", doc = "The user changed a property (or picked the SUB an event runs): its name and the new value as the program writes it." },
  { name = "OnEventDblClick", params = "Event AS STRING", doc = "The user double-clicked an event's row: the program creates (or shows) its handler." },
  { name = "OnEditorRequest", params = "Prop AS STRING", doc = "The user asked for a property's own editor (its \"…\" button) where the inspector has none: the program shows one." },
  { name = "OnSelect", params = "Prop AS STRING", doc = "The selected row changed." },
]

[[component]]
name = "RTOOLBOX"
visual = true
size = [220, 400]
default_event = "OnPick"
sets = ["layout", "a11y", "generic"]
doc = "The palette of components a form designer places, grouped under \"RapidQ\" (the components RapidQ has, shown with their Q names: QBUTTON) and \"RapidR\" (RapidR's own), each with its icon and the name the designer writes. The user searches it, double-clicks a component (or presses Enter) to add it, or drags it onto a designer. Templates — a component with preset properties — have a group of their own."
properties = [
  { name = "Align", type = "enum", values = ["alNone", "alTop", "alBottom", "alLeft", "alRight", "alClient"], default = "alNone" },
  { name = "Filter", type = "string", default = "", design = false, doc = "The search box's text: only the components whose names match it are shown." },
  { name = "ShowNames", type = "string", default = "as-written", doc = "How components are named: \"as-written\" (RapidQ's components by their Q names, the others by their R names — what the designer writes), \"rapidr\" (every one by its R name) or \"titles\" (in words: \"Button\")." },
  { name = "Selected", type = "string", default = "", design = false, doc = "The selected component's type as the designer writes it (QBUTTON), or a template's name." },
  { name = "Count", type = "int", access = "read", design = false, doc = "How many components are shown now: the filter applied, a closed group's left out (Item counts the same ones)." },
  { name = "Height", type = "int" },
  { name = "Hint", type = "string" },
  { name = "Left", type = "int", default = 0 },
  { name = "Parent", type = "component", kinds = ["QFORM", "QPANEL", "QTABCONTROL"], access = "write", design = false },
  { name = "Top", type = "int", default = 0 },
  { name = "Width", type = "int" },
  { name = "Enabled", type = "bool", default = true },
  { name = "Visible", type = "bool", default = true },
  { name = "Font", type = "font" },
]
methods = [
  { name = "Item", params = "Index AS INTEGER", returns = "STRING", doc = "The component shown at Index (from 0) as the designer writes it." },
  { name = "Expand", params = "Group AS STRING", doc = "Opens a group (\"RapidQ\", \"Standard\", \"Data Science\" …)." },
  { name = "Collapse", params = "Group AS STRING", doc = "Closes a group." },
  { name = "ExpandAll", value = true, doc = "Opens every group." },
  { name = "CollapseAll", value = true, doc = "Closes every group." },
  { name = "AddTemplate", params = "Name AS STRING, Source AS STRING, [Icon AS STRING]", doc = "Adds a template to the Templates group: Source is the CREATE block it places (a component with its properties set), Icon a built-in icon or component name." },
  { name = "RemoveTemplate", params = "Name AS STRING", doc = "Takes a template out of the Templates group." },
  { name = "Template", params = "Name AS STRING", returns = "STRING", doc = "A template's CREATE block." },
]
events = [
  { name = "OnPick", params = "Type AS STRING", doc = "The user chose a component to add (double click, Enter): its type as the designer writes it, or a template's name." },
  { name = "OnSelect", params = "Type AS STRING", doc = "The selected component changed." },
  { name = "OnDragStart", params = "Type AS STRING", doc = "The user started dragging a component out of the toolbox." },
  { name = "OnDragDrop", params = "Type AS STRING, Target AS STRING, X AS INTEGER, Y AS INTEGER", doc = "A dragged component was let go over component Target, the deepest one shown there on the toolbox's form (its name in lower case), at (X, Y) in Target's own pixels; over the bare form Target is \"\" and (X, Y) is in the form's client area. Let go over the toolbox itself, nothing is dropped." },
]

[[component]]
name = "RPROJECTTREE"
visual = true
size = [240, 360]
default_event = "OnOpen"
sets = ["layout", "a11y", "generic"]
doc = "A project's files as a tree (an .rrproj project, or a .bas / .rr file and the files it includes), grouped by kind — forms with the components their CREATE blocks make, modules, includes, resources, assets, data — each with its icon. The user opens a file (double click or Enter), renames it in place (F2), drags it to reorder or into a folder, and deletes it after confirming; the program hears each change and does the work on the disk."
properties = [
  { name = "Align", type = "enum", values = ["alNone", "alTop", "alBottom", "alLeft", "alRight", "alClient"], default = "alNone" },
  { name = "Project", type = "string", default = "", doc = "The project's file (.rrproj, or a .bas / .rr file): setting it reads the project and shows it." },
  { name = "ProjectName", type = "string", access = "read", design = false, doc = "The project's name." },
  { name = "ShowFiles", type = "bool", default = true, doc = "Whether the files are shown (grouped by kind)." },
  { name = "ShowForms", type = "bool", default = true, doc = "Whether forms are shown with the components their CREATE blocks make." },
  { name = "ShowComponents", type = "bool", default = true, doc = "Whether a form's components are listed under it." },
  { name = "Selected", type = "string", default = "", design = false, doc = "The selected node: a file's path, `path#Component` for a form's component, a folder's path ending in `/`, \"\" for the project or a group." },
  { name = "FileCount", type = "int", access = "read", design = false, doc = "How many files the project has." },
  { name = "Modified", type = "bool", design = false, doc = "The project changed since it was read or saved." },
  { name = "Height", type = "int" },
  { name = "Hint", type = "string" },
  { name = "Left", type = "int", default = 0 },
  { name = "Parent", type = "component", kinds = ["QFORM", "QPANEL", "QTABCONTROL"], access = "write", design = false },
  { name = "Top", type = "int", default = 0 },
  { name = "Width", type = "int" },
  { name = "Enabled", type = "bool", default = true },
  { name = "Visible", type = "bool", default = true },
  { name = "Font", type = "font" },
]
methods = [
  { name = "Refresh", value = true, doc = "Reads the project's files again (forms' components included)." },
  { name = "LoadText", params = "Text AS STRING, Path AS STRING", returns = "INTEGER", doc = "Shows a project from its file's text (where there are no files to read: the web). Path is its file's name. True when it was read." },
  { name = "SetFileText", params = "Path AS STRING, Text AS STRING", doc = "Gives a file's text (what the editor has, or a file the web can't read), so a form's components are listed from it." },
  { name = "File", params = "Index AS INTEGER", returns = "STRING", doc = "File Index's path (from 0), in the project's order." },
  { name = "FileKind", params = "Path AS STRING", returns = "STRING", doc = "A file's kind: \"module\", \"form\", \"include\", \"resource\", \"asset\" or \"data\"." },
  { name = "AddFile", params = "Path AS STRING, [Kind AS STRING]", returns = "INTEGER", doc = "Adds a file to the project (its kind from its extension when Kind is left out). True when it was added." },
  { name = "RemoveFile", params = "Path AS STRING", returns = "INTEGER", doc = "Takes a file out of the project (the disk is left alone)." },
  { name = "NewFile", params = "Kind AS STRING, [Name AS STRING]", returns = "STRING", doc = "Adds a new file of a kind with a free name (Form2.rr …) and starts renaming it: its path." },
  { name = "Rename", params = "[Path AS STRING], [NewName AS STRING]", doc = "Renames a file (OnRename may cancel); without NewName the user types the name in place." },
  { name = "Delete", params = "[Path AS STRING]", doc = "Asks the user to confirm, then takes the file out of the project (OnDelete may cancel)." },
  { name = "Reveal", params = "Path AS STRING", doc = "Opens the groups above a file (or `path#Component`), selects it and scrolls to it." },
  { name = "Save", returns = "INTEGER", value = true, doc = "Writes the project file (.rrproj). True when it was written." },
  { name = "ProjectText", returns = "STRING", value = true, doc = "The project file's text as Save writes it." },
  { name = "ExpandAll", value = true, doc = "Opens every group and folder." },
  { name = "CollapseAll", value = true, doc = "Closes every group and folder." },
]
events = [
  { name = "OnOpen", params = "Path AS STRING", doc = "The user opened a node (double click, Enter): a file's path, or `path#Component`." },
  { name = "OnSelect", params = "Path AS STRING", doc = "The user selected another node (Path as Selected gives it)." },
  { name = "OnRename", params = "OldPath AS STRING, NewPath AS STRING, BYREF Cancel AS INTEGER", doc = "A file is being renamed: set Cancel to refuse. The program renames the file on the disk." },
  { name = "OnDelete", params = "Path AS STRING, BYREF Cancel AS INTEGER", doc = "The user confirmed taking a file out of the project: set Cancel to keep it. The program deletes it from the disk if it wants to." },
  { name = "OnMove", params = "Path AS STRING, NewPath AS STRING, Index AS INTEGER", doc = "The user dragged a file: to another place in the order (Index, from 0) or into another folder (NewPath)." },
  { name = "OnNewFile", params = "Path AS STRING, Kind AS STRING", doc = "NewFile added a file and the user named it." },
]

[[component]]
name = "ROUTPUTCONSOLE"
visual = true
size = [480, 180]
default_event = "OnLinkClick"
sets = ["layout", "a11y", "generic"]
doc = "A program's output as a console shows it — colours, CLS, LOCATE, COLOR as ANSI sequences — with pages for the build log and the problems found. `file:line` places in the text and every problem are links; the user searches the text, and the oldest lines go past MaxLines."
properties = [
  { name = "Align", type = "enum", values = ["alNone", "alTop", "alBottom", "alLeft", "alRight", "alClient"], default = "alNone" },
  { name = "Page", type = "string", default = "output", doc = "The page shown: \"output\", \"build\" or \"problems\"." },
  { name = "MaxLines", type = "int", default = 5000, doc = "The most lines a page keeps: older ones go." },
  { name = "Filter", type = "string", default = "", design = false, doc = "The search box's text: matches are marked and the first is shown." },
  { name = "ShowTabs", type = "bool", default = true, doc = "Whether the pages' tabs (and the search box) are shown above the text." },
  { name = "AutoScroll", type = "bool", default = true, doc = "New output scrolls the page to its end (unless the user scrolled up)." },
  { name = "LineCount", type = "int", access = "read", design = false, doc = "How many lines the shown page has." },
  { name = "ProblemCount", type = "int", access = "read", design = false, doc = "How many problems the Problems page lists." },
  { name = "Text", type = "string", access = "read", design = false, doc = "The shown page's text, without colours." },
  { name = "Height", type = "int" },
  { name = "Hint", type = "string" },
  { name = "Left", type = "int", default = 0 },
  { name = "Parent", type = "component", kinds = ["QFORM", "QPANEL", "QTABCONTROL"], access = "write", design = false },
  { name = "Top", type = "int", default = 0 },
  { name = "Width", type = "int" },
  { name = "Enabled", type = "bool", default = true },
  { name = "Visible", type = "bool", default = true },
  { name = "Font", type = "font" },
]
methods = [
  { name = "Write", params = "Text AS STRING", doc = "Adds output to the Output page, ANSI sequences understood (colours, CLS, LOCATE)." },
  { name = "WriteLine", params = "Text AS STRING", doc = "Write, then a new line." },
  { name = "Clear", params = "[Page AS STRING]", value = true, doc = "Empties a page (the shown one when Page is left out)." },
  { name = "AddBuildLine", params = "Text AS STRING", doc = "Adds a line to the Build page." },
  { name = "AddProblem", params = "File AS STRING, Line AS INTEGER, Column AS INTEGER, Severity AS STRING, Message AS STRING", doc = "Adds a problem (Severity \"error\", \"warning\" or \"info\") to the Problems page." },
  { name = "ClearProblems", value = true, doc = "Empties the Problems page." },
  { name = "Line", params = "Index AS INTEGER", returns = "STRING", doc = "The shown page's line Index (from 0), without colours." },
  { name = "Find", params = "Text AS STRING", value = true, returns = "INTEGER", doc = "Searches the shown page (as the search box does): how many matches; the first is shown." },
  { name = "FindNext", returns = "INTEGER", value = true, doc = "Shows the next match: its line, -1 when there is none." },
]
events = [
  { name = "OnLinkClick", params = "File AS STRING, Line AS INTEGER", doc = "The user clicked a `file:line` place or a problem (or pressed Enter on it)." },
  { name = "OnPageChange", params = "Page AS STRING", doc = "The user showed another page." },
]

[[component]]
name = "RCOMMANDPALETTE"
visual = true
size = [560, 320]
default_event = "OnCommand"
sets = ["a11y", "generic"]
doc = "A box of commands found by typing: Show opens it over the form, the user types a few letters of a command (in any order of its words, letters skipped), picks one with the arrows and Enter, and OnCommand says which. Each command shows its shortcut; the ones used last come first."
properties = [
  { name = "Filter", type = "string", default = "", design = false, doc = "What the user typed." },
  { name = "Placeholder", type = "string", default = "Type a command", doc = "The grey text in the empty search box." },
  { name = "Count", type = "int", access = "read", design = false, doc = "How many commands match what was typed." },
  { name = "CommandCount", type = "int", access = "read", design = false, doc = "How many commands it has." },
  { name = "Selected", type = "string", default = "", design = false, doc = "The highlighted command's id." },
  { name = "MaxRows", type = "int", default = 10, doc = "The most commands shown at once (more scroll)." },
  { name = "Height", type = "int" },
  { name = "Hint", type = "string" },
  { name = "Left", type = "int", default = 0 },
  { name = "Parent", type = "component", kinds = ["QFORM", "QPANEL", "QTABCONTROL"], access = "write", design = false },
  { name = "Top", type = "int", default = 0 },
  { name = "Width", type = "int" },
  { name = "Enabled", type = "bool", default = true },
  { name = "Visible", type = "bool", default = false },
  { name = "Font", type = "font" },
]
methods = [
  { name = "AddCommand", params = "Id AS STRING, Title AS STRING, [Shortcut AS STRING], [Category AS STRING], [Icon AS STRING]", doc = "Adds a command (or changes the one with that Id): its title, its shortcut as shown (\"Ctrl+Shift+P\"), a category put before the title (\"File: \"), an icon." },
  { name = "RemoveCommand", params = "Id AS STRING", doc = "Takes a command out of the palette." },
  { name = "Clear", value = true, doc = "Removes every command." },
  { name = "CommandEnabled", params = "Id AS STRING, [On AS INTEGER]", returns = "INTEGER", doc = "Whether a command can be picked; with On, sets it (a disabled one is shown dimmed)." },
  { name = "Command", params = "Index AS INTEGER", returns = "STRING", doc = "The id of the command shown at Index (from 0) for what was typed." },
  { name = "Show", value = true, doc = "Opens the palette at the top of its form, centred (as wide as Width, at most the form's width less 32 pixels), over every other component, empty, with the keyboard in it; the commands used last come first." },
  { name = "Hide", value = true, doc = "Closes it." },
]
events = [
  { name = "OnCommand", params = "Id AS STRING", doc = "The user picked a command (Enter or a click): the palette has closed." },
  { name = "OnCancel", doc = "The user closed the palette without picking (Escape)." },
]
