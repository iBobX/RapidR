# Direct3D (retained mode): the registry's components (crates/rapidr-lang; src/lib.rs says how to edit).
group = "Direct3D (retained mode)"

[[component]]
name = "RD3DFRAME"
rapidq = "QD3DFRAME"
visual = false
doc = ""
properties = [
  { name = "FogColor", type = "color" },
  { name = "FogMode", type = "int" },
  { name = "Parent", type = "component", kinds = ["QFORM", "QPANEL"], design = false },
]
methods = [
  { name = "AddFrame", params = "Frame AS QD3DFRAME" },
  { name = "AddLight", params = "Light AS QD3DLIGHT" },
  { name = "AddScale", params = "CombineType AS INTEGER, X AS DOUBLE, Y AS DOUBLE, Z AS DOUBLE" },
  { name = "AddVisual", params = "Visual AS QD3DMESHBUILDER" },
  { name = "CreateFrame", params = "Frame AS QD3DFRAME" },
  { name = "DeleteFrame", params = "Frame AS QD3DFRAME" },
  { name = "DeleteLight", params = "Light AS QD3DLIGHT" },
  { name = "DeleteVisual", params = "Visual AS QD3DMESHBUILDER" },
  { name = "Load", params = "FileName AS STRING" },
  { name = "LookAt", params = "F AS QD3DFRAME, Constraint AS INTEGER" },
  { name = "Move", params = "D AS DOUBLE" },
  { name = "SetBackgroundImage", params = "Texture AS QD3DTEXTURE" },
  { name = "SetBackgroundRGB", params = "R AS DOUBLE, G AS DOUBLE, B AS DOUBLE" },
  { name = "SetFogParams", params = "Start AS DOUBLE, End AS DOUBLE, Density AS DOUBLE" },
  { name = "SetOrientation", params = "DX AS DOUBLE, DY AS DOUBLE, DZ AS DOUBLE, UX AS DOUBLE, UY AS DOUBLE, UZ AS DOUBLE" },
  { name = "SetPosition", params = "X AS DOUBLE, Y AS DOUBLE, Z AS DOUBLE" },
  { name = "SetRotation", params = "X AS DOUBLE, Y AS DOUBLE, Z AS DOUBLE, Theta AS DOUBLE" },
  { name = "SetTexture", params = "Tex AS QD3DTEXTURE" },
  { name = "SetVelocity", origin = "rapidr" },
  { name = "FogEnabled" },
]
events = []

[[component]]
name = "RD3DMESHBUILDER"
rapidq = "QD3DMESHBUILDER"
visual = false
doc = ""
properties = [
  { name = "FaceCount", type = "int", access = "read", design = false },
  { name = "Parent", type = "component", kinds = ["QFORM"], design = false },
]
methods = [
  { name = "AddFace", params = "Face AS QD3DFACE" },
  { name = "AddVertex", params = "X AS DOUBLE, Y AS DOUBLE, Z AS DOUBLE" },
  { name = "CreateFace", params = "Face AS QD3DFACE" },
  { name = "CreateMesh", params = "Mesh AS QD3DMESH" },
  { name = "DeleteFace", params = "Face AS QD3DFACE" },
  { name = "GetFace", params = "Index AS LONG, Face AS QD3DFACE" },
  { name = "Load", params = "S AS STRING" },
  { name = "LoadTexture", params = "S AS STRING" },
  { name = "Scale", params = "X AS DOUBLE, Y AS DOUBLE, Z AS DOUBLE" },
  { name = "SetQuality", params = "Quality AS INTEGER" },
  { name = "SetRGB", params = "R AS DOUBLE, G AS DOUBLE, B AS DOUBLE" },
  { name = "SetRGBA", params = "R AS DOUBLE, G AS DOUBLE, B AS DOUBLE, A AS DOUBLE" },
  { name = "SetTexture", params = "Tex AS QD3DTEXTURE" },
  { name = "Translate", params = "TX AS DOUBLE, TY AS DOUBLE, TZ AS DOUBLE" },
  { name = "SetColorRGB", origin = "rapidr" },
]
events = []

