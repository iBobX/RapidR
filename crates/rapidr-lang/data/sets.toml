# Members RapidR adds to every component the UI kernel lays out (`sets = ["layout", "a11y"]` in a
# component): RapidR's extensions, additive — a program that doesn't set them behaves as under RapidQ.

[[set]]
name = "layout"
origin = "rapidr"
properties = [
  { name = "Anchors", type = "set", values = ["akLeft", "akTop", "akRight", "akBottom"], default = "akLeft + akTop", category = "Layout", doc = "Which edges of its parent the control keeps its distance to as the parent resizes: akLeft + akTop (the default) stays put; add akRight / akBottom to stretch." },
  { name = "MinWidth", type = "int", default = 0, range = "0..", unit = "px", category = "Layout", doc = "The narrowest the control gets, in pixels, whoever sizes it (the program, Align, Anchors, the user); 0 for no limit. Also `Constraints.MinWidth`." },
  { name = "MinHeight", type = "int", default = 0, range = "0..", unit = "px", category = "Layout", doc = "The shortest the control gets, in pixels; 0 for no limit. Also `Constraints.MinHeight`." },
  { name = "MaxWidth", type = "int", default = 0, range = "0..", unit = "px", category = "Layout", doc = "The widest the control gets, in pixels; 0 for no limit. Also `Constraints.MaxWidth`." },
  { name = "MaxHeight", type = "int", default = 0, range = "0..", unit = "px", category = "Layout", doc = "The tallest the control gets, in pixels; 0 for no limit. Also `Constraints.MaxHeight`." },
]
methods = []
events = []

[[set]]
name = "a11y"
origin = "rapidr"
properties = [
  { name = "AccessibleName", type = "string", default = "", category = "Accessibility", doc = "What a screen reader calls the control, when its caption or text isn't enough (an image button, an unlabelled edit)." },
  { name = "AccessibleDescription", type = "string", default = "", category = "Accessibility", doc = "A longer description a screen reader gives after the name (what the control does, a shortcut)." },
  { name = "AccessibleHidden", type = "bool", default = false, category = "Accessibility", doc = "True: the control is decoration — a pulsing dot, a flourish — and a screen reader skips it (it stays in the window, for the eyes). Never set it on anything a person can use or needs to read." },
]
methods = []
# (CONTEXT-MENUS: every control that can take the keyboard opens its menu
# by the mouse, the keyboard and a screen reader alike)
events = [
  { name = "OnContextMenu", params = "X AS INTEGER, Y AS INTEGER, Key AS INTEGER", origin = "rapidr", doc = "RapidR's: the person asked for this component's context menu - a right click let go on it, Shift+F10 or the Menu key while it has the keyboard, a screen reader's \"show menu\", or a row's More button. X, Y are where the menu goes, in its own pixels (under its focused item when the keyboard asked); Key says how: 0 the mouse, 1 the keyboard, 3 a screen reader, 4 a row's More button (X, Y its bottom right corner: a menu right-aligned there). Show a menu with `Menu.PopupAt Sender, X, Y`. A list, tree or inspector says first which item it was (ContextIndex, the selected row). Without this event a component's PopupMenu opens by itself, in a RapidR program from the keyboard too." },
]
