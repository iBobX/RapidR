# The builtin functions and procedures. `name` is how programs write it (a `$` for those
# that return text); the runtimes' dispatch key drops the suffix (MID$ is `mid`).

# BUILTINS' names programs never write: the compilers' lowerings of statements (PRINT,
# INPUT, DATA, …) and of objects, memory and numeric stores.
internal = [
  "__aget",
  "__arg_round",
  "__aset",
  "__bind_event",
  "__bind_event_this",
  "__component_array",
  "__cstring",
  "__data_add",
  "__data_label",
  "__data_reset",
  "__decimal",
  "__dll_call",
  "__environ_set",
  "__getfield",
  "__gui_register_timer",
  "__inkey_trapall",
  "__input_value",
  "__lastoftype",
  "__lprint",
  "__mem_refresh",
  "__mem_sync",
  "__newarray",
  "__newobject",
  "__null",
  "__objcall",
  "__objcreate",
  "__objectarray",
  "__objget",
  "__objset",
  "__pack",
  "__paramstr",
  "__paramstrcount",
  "__paramval",
  "__paramvalcount",
  "__quicksort",
  "__read",
  "__redim",
  "__restore",
  "__set_theme",
  "__setfield",
  "__shell_notifyicon",
  "__sizeof",
  "__sizeof_type",
  "__to_byte",
  "__to_double",
  "__to_dword",
  "__to_fixed",
  "__to_long",
  "__to_short",
  "__to_single",
  "__to_word",
  "__varptr_elem",
  "__varptr_var",
  "date_func",
  "e",
  "end",
  "get",
  "input_field",
  "input_func",
  "line_input",
  "math.e",
  "math.pi",
  "print",
  "print_hash",
  "println",
  "rapidr__waitkey",
  "time_func",
  "write_hash",
]

[[builtin]]
name = "ABS"
syntax = "ABS(Number)"
group = "Numbers"
doc = "The absolute value of a number; an integer stays an integer."

[[builtin]]
name = "ACOS"
syntax = "ACOS(Number)"
group = "Numbers"
doc = "The arc cosine of a number from -1 to 1, as an angle in radians (0 to π)."

[[builtin]]
name = "ASC"
syntax = "ASC(char$)"
group = "Strings"
doc = "The character code of a string's first character, 0 for an empty string; the inverse of `CHR$`. It counts characters, not UTF-8 bytes: `ASC(\"é\")` is 233."

[[builtin]]
name = "ASIN"
syntax = "ASIN(Number)"
group = "Numbers"
doc = "The arc sine of a number from -1 to 1, as an angle in radians (-π/2 to π/2)."

[[builtin]]
name = "ATAN"
syntax = "ATAN(Number)"
group = "Numbers"
doc = "The arc tangent of a number, in radians; the same as `ATN`."

[[builtin]]
name = "ATN"
syntax = "ATN(Number)"
group = "Numbers"
doc = "The arc tangent of a number, as an angle in radians (-π/2 to π/2)."

[[builtin]]
name = "BEEP"
syntax = "BEEP"
group = "Dialogs and sound"
origin = "rapidr"
doc = "Plays a short beep on the system's sound output (without sound, the terminal's bell)."

[[builtin]]
name = "BIN$"
syntax = "BIN$(Integer)"
group = "Strings"
doc = "The binary digits of a number's 32 bits, without leading zeros: `BIN$(5)` is `101`, `BIN$(-1)` is 32 ones. A real number is rounded to a whole one first."

[[builtin]]
name = "CALLBACK"
syntax = "CALLBACK(MySub)"
group = "Routines"
missing = true
doc = "The address of a SUB or FUNCTION, in the form a Windows API routine needs to call it back (a window procedure, an enumeration callback)."

[[builtin]]
name = "CALLFUNC"
syntax = "CALLFUNC(Num, param1, param2, ...)"
group = "Routines"
doc = "Calls the SUB or FUNCTION a pointer holds (from `BIND` or `CODEPTR`) with the arguments given; returns a FUNCTION's result."

[[builtin]]
name = "CBOOL"
syntax = "CBOOL(Expression)"
group = "Numbers"
doc = "A value as a truth value: true for a non-zero number, or for a text that is a non-zero number or (not a number) isn't empty; false otherwise."

[[builtin]]
name = "CDBL"
syntax = "CDBL(Expression)"
group = "Numbers"
origin = "rapidr"
doc = "A value as a DOUBLE (a text is read as `VAL` reads it)."

[[builtin]]
name = "CEIL"
syntax = "CEIL(Number)"
group = "Numbers"
doc = "The smallest whole number not less than a number (`CEIL(2.1)` is 3, `CEIL(-2.1)` -2), as a 32-bit integer."

[[builtin]]
name = "CHDIR"
syntax = "CHDIR path$"
group = "Files and folders"
doc = "Makes a folder the current one, the folder relative paths start from."

[[builtin]]
name = "CHDRIVE"
syntax = "CHDRIVE \"a:\\\""
group = "Files and folders"
doc = "Makes a drive (`\"d:\"`) the current one on Windows; other systems have no drives and it does nothing."

[[builtin]]
name = "CHR$"
syntax = "CHR$(byte)"
group = "Strings"
doc = "The one-character string whose code is the number's low byte (`CHR$(65)` is `A`); a real number is rounded half to even first."

[[builtin]]
name = "CINT"
syntax = "CINT(Number)"
group = "Numbers"
doc = "A number rounded to an integer as `INT(x + 0.5)`: 2.5 gives 3, -2.5 gives -2. Beyond 32 bits, -2147483648."

[[builtin]]
name = "CLNG"
syntax = "CLNG(Number)"
group = "Numbers"
doc = "A number rounded to a 32-bit integer, as `CINT` rounds it: `INT(x + 0.5)`."

[[builtin]]
name = "CLOSE"
syntax = "CLOSE #FileNum"
group = "Files and folders"
origin = "rapidr"
doc = "Closes the file opened with `OPEN` under that number; what was written to it is kept."

[[builtin]]
name = "CLS"
syntax = "CLS"
group = "Console"
doc = "Clears the console and moves the cursor to the top left corner."

[[builtin]]
name = "CODEPTR"
syntax = "CODEPTR(MySub)"
group = "Routines"
missing = true
doc = "The address of a SUB or FUNCTION, for `CALLFUNC` or a routine that takes a pointer to call."

[[builtin]]
name = "COLOR"
syntax = "COLOR [Fore%][, Back%]"
group = "Console"
doc = "Sets the console's text colours: foreground 0 to 15, background 0 to 7, in the classic 16-colour palette; without arguments, the terminal's own colours."

[[builtin]]
name = "COMMAND$"
syntax = "COMMAND$[(n)]"
group = "System"
bare = true
doc = "The program's command line: `COMMAND$(n)` the n-th argument (`COMMAND$(0)` the program itself, \"\" past the last); bare, the arguments together."

[[builtin]]
name = "COMMANDCOUNT"
syntax = "COMMANDCOUNT"
group = "System"
bare = true
doc = "The number of arguments on the program's command line (not counting the program itself); COMMAND$(n) reads each."

[[builtin]]
name = "CONVBASE$"
syntax = "CONVBASE$(Str$, FromBase, ToBase)"
group = "Strings"
doc = "A number written in one base (2 to 36) as a string of digits in another: `CONVBASE$(\"FF\", 16, 10)` is `255`. A negative number converts as its 32 bits; \"\" for a bad base or digit."

[[builtin]]
name = "CONVBASEX"
syntax = "CONVBASEX(Str$, FromBase, ToBase)"
group = "Library functions"
missing = true
doc = "A variant of `CONVBASE$` for converting a string of digits from one number base to another."

[[builtin]]
name = "COS"
syntax = "COS(Number)"
group = "Numbers"
doc = "The cosine of an angle in radians."

[[builtin]]
name = "CSNG"
syntax = "CSNG(Expression)"
group = "Numbers"
origin = "rapidr"
doc = "A value as a SINGLE (a text is read as `VAL` reads it)."

[[builtin]]
name = "CSRLIN"
syntax = "CSRLIN"
group = "Console"
bare = true
doc = "The console cursor's row, 1 being the top."

[[builtin]]
name = "CURDIR$"
syntax = "CURDIR$"
group = "Files and folders"
bare = true
doc = "The full path of the current folder."

[[builtin]]
name = "DATE$"
syntax = "DATE$"
group = "System"
bare = true
doc = "Today's local date as text, `MM-DD-YYYY`."

[[builtin]]
name = "DELETE$"
syntax = "DELETE$(String$, Index, Count)"
group = "Strings"
doc = "The string with `Count` characters removed starting at position `Index` (1 the first): `DELETE$(\"Hello\", 2, 3)` is `Ho`."

[[builtin]]
name = "DIR$"
syntax = "DIR$[(FileSpec$, Attributes%)]"
group = "Files and folders"
bare = true
doc = "The first file matching a pattern with `*` and `?` (any case), or \"\" when none; then bare `DIR$` gives the next. Attributes: faDirectory includes folders, faHidden hidden files."

[[builtin]]
name = "DIREXISTS"
syntax = "DIREXISTS(Path$)"
group = "Files and folders"
doc = "True (1) when a folder of that path exists, else 0."

[[builtin]]
name = "DOEVENTS"
syntax = "DOEVENTS"
group = "System"
doc = "Lets pending window events, timers and repaints run, so a long loop keeps the program's windows responsive."

[[builtin]]
name = "ENVIRON"
syntax = "ENVIRON StringExpression"
group = "System"
doc = "`ENVIRON \"NAME=value\"` sets a variable in the program's environment; `ENVIRON$(\"NAME\")` reads one (\"\" when unset)."

[[builtin]]
name = "EOF"
syntax = "EOF(FileNum)"
group = "Files and folders"
origin = "rapidr"
doc = "True (-1) when a file opened with `OPEN` has nothing left to read (or isn't open), else 0."

[[builtin]]
name = "EXECUTE"
syntax = "Execute function"
group = "Library functions"
missing = true
doc = "Runs a routine named by a string at run time."

[[builtin]]
name = "EXP"
syntax = "EXP(Number)"
group = "Numbers"
doc = "e raised to the power of a number; the inverse of `LOG`."

[[builtin]]
name = "EXTRACTRESOURCE"
syntax = "EXTRACTRESOURCE ResourceNumber%, FileName$"
group = "Files and folders"
doc = "Writes a resource built into the program (`$RESOURCE`, its handle from `RESOURCE(n)`) to a file."

[[builtin]]
name = "FIELD$"
syntax = "FIELD$(StringExpresion, Deliminator, FieldNumber)"
group = "Strings"
doc = "The n-th piece (1 the first) of a string split at every occurrence of a separator: `FIELD$(\"a,b,c\", \",\", 2)` is `b`; \"\" out of range."

[[builtin]]
name = "FILEEXISTS"
syntax = "FILEEXISTS(FileName$)"
group = "Files and folders"
doc = "True (1) when a file of that name exists, else 0 (a folder doesn't count)."

[[builtin]]
name = "FILELEN"
syntax = "FILELEN(FileName$)"
group = "Files and folders"
origin = "rapidr"
doc = "The size of a file in bytes, 0 when it doesn't exist."

[[builtin]]
name = "FIX"
syntax = "FIX(Number)"
group = "Numbers"
doc = "A number's whole part, truncated toward zero (`FIX(-2.7)` is -2); the same as `INT` in RapidQ."

[[builtin]]
name = "FLOOR"
syntax = "FLOOR(Number)"
group = "Numbers"
doc = "The largest whole number not greater than a number (`FLOOR(-2.1)` is -3), as a 32-bit integer."

[[builtin]]
name = "FORMAT$"
syntax = "FORMAT$(S$, arg1, arg2, ...)"
group = "Strings"
doc = "Text built from a pattern and values, Pascal style: `%d`, `%s`, `%f`, `%x`, `%e`, `%g`, `%n`, `%m` with optional width and precision: `FORMAT$(\"%5.2f\", 3.14159)` is ` 3.14`."

[[builtin]]
name = "FRAC"
syntax = "FRAC(Number)"
group = "Numbers"
doc = "A number's fractional part, with its sign: `FRAC(-2.75)` is -0.75."

[[builtin]]
name = "FREEFILE"
syntax = "FREEFILE"
group = "Files and folders"
bare = true
origin = "rapidr"
doc = "The lowest file number not in use, for `OPEN … AS #n`."

[[builtin]]
name = "GET$"
syntax = "GET$(NumChars)"
group = "Other"
doc = "Reads up to `NumChars` bytes from standard input as they are (for a CGI program, its request body); \"\" at the end."

[[builtin]]
name = "GETCAPTURE"
syntax = "GETCAPTURE"
group = "Library functions"
missing = true
doc = "The handle of the window that has captured the mouse, 0 if none."

[[builtin]]
name = "GETFOCUS"
syntax = "GETFOCUS"
group = "Library functions"
missing = true
doc = "The handle of the window that has the keyboard focus."

[[builtin]]
name = "HEX$"
syntax = "HEX$(Number)"
group = "Strings"
doc = "The hexadecimal digits of a number's 32 bits, always 8 of them: `HEX$(255)` is `000000FF`. A real number is rounded half to even first."

[[builtin]]
name = "HEXTODEC"
syntax = "HEXTODEC(Hex$)"
group = "Strings"
doc = "The number a string of hexadecimal digits stands for (`&H` or `0x` in front allowed): `HEXTODEC(\"FF\")` is 255; 0 when it isn't hexadecimal."

[[builtin]]
name = "IIF"
syntax = "IIF(Condition, TrueValue, FalseValue)"
group = "Numbers"
doc = "`TrueValue` when the condition is true, else `FalseValue`. Both are evaluated before the choice."

[[builtin]]
name = "INITARRAY"
syntax = "INITARRAY(Array, values, ...)"
group = "Arrays and memory"
missing = true
doc = "Fills an array with the values listed, from its first element on."

[[builtin]]
name = "INKEY$"
syntax = "INKEY$"
group = "Console"
bare = true
doc = "The next key pressed, or \"\" when none is waiting; it doesn't wait. Special keys (arrows, F1–F12, …) come as `CHR$(27)` followed by their scan code."

[[builtin]]
name = "INP"
syntax = "INP(Address)"
group = "System"
doc = "Reads a byte from a hardware I/O port. Windows doesn't let programs reach the ports, so the call stops the program with a run-time error, as it did under RapidQ on Windows."

[[builtin]]
name = "INPUT$"
syntax = "INPUT$(NumChars)"
group = "Console"
doc = "Waits for `NumChars` keys to be pressed and returns them as a string."

[[builtin]]
name = "INPW"
syntax = "INPW(Address)"
group = "System"
doc = "Reads a 16-bit word from a hardware I/O port. Windows doesn't let programs reach the ports, so the call stops the program with a run-time error."

[[builtin]]
name = "INSERT$"
syntax = "INSERT$(Source$,Dest$,Index)"
group = "Strings"
doc = "`Dest$` with `Source$` inserted before character `Index` (1 the first): `INSERT$(\"hi\", \"Hello\", 3)` is `Hehillo`."

[[builtin]]
name = "INSTR"
syntax = "INSTR([Start,] Search$,Find$)"
group = "Strings"
doc = "The position (1 the first) where `Find$` first occurs in `Search$`, from character `Start` when given; 0 when it doesn't (an empty `Find$` is never found)."

[[builtin]]
name = "INT"
syntax = "INT(Number)"
group = "Numbers"
doc = "A number's whole part, truncated toward zero as RapidQ does (`INT(-2.5)` is -2), kept as large as the number."

[[builtin]]
name = "INV"
syntax = "INV(Number, Modulus)"
group = "Numbers"
doc = "The modular inverse of a number (`INV(3, 26)` is 9), or -1 when there is none; also an operator, `a INV m`."

[[builtin]]
name = "ISCONSOLE"
syntax = "ISCONSOLE"
group = "Console"
missing = true
doc = "True when the program is running as a console program."

[[builtin]]
name = "ISNUMERIC"
syntax = "ISNUMERIC(Expression)"
group = "Strings"
origin = "rapidr"
doc = "True (-1) when the value is a number or a text that is exactly a number (`\"3.5\"`, `\"-2E3\"`), else 0."

[[builtin]]
name = "KILL"
syntax = "KILL Filename$"
group = "Files and folders"
doc = "Deletes a file."

[[builtin]]
name = "KILLMESSAGE"
syntax = "KILLMESSAGE hWnd, Message"
group = "System"
missing = true
doc = "Removes pending messages of one kind from a window's message queue."

[[builtin]]
name = "LBOUND"
syntax = "LBOUND(ArrayName[, Dimension])"
group = "Arrays and memory"
doc = "The lowest index of an array, in its first dimension or the one given (1 the first)."

[[builtin]]
name = "LCASE$"
syntax = "LCASE$(String)"
group = "Strings"
doc = "The string in lower case."

[[builtin]]
name = "LEFT$"
syntax = "LEFT$(String,Num)"
group = "Strings"
doc = "The first `Num` characters of a string (all of it when it is shorter)."

[[builtin]]
name = "LEN"
syntax = "LEN(String)"
group = "Strings"
doc = "The number of characters in a string (characters, not bytes)."

[[builtin]]
name = "LFLUSH"
syntax = "LFLUSH"
group = "System"
doc = "Sends what `LPRINT` has printed so far to the printer as one job; what is left at the program's end is printed then."

[[builtin]]
name = "LIBRARYINST"
syntax = "LIBRARYINST(DLLName)"
group = "System"
missing = true
doc = "Loads a DLL and returns its instance handle, 0 when it can't be loaded: a way to test whether a library is present."

[[builtin]]
name = "LOCATE"
syntax = "LOCATE [Y%][, X%][, cursor]"
group = "Console"
doc = "Moves the console cursor to row `Y`, column `X` (1 the first); a value left out keeps the current one."

[[builtin]]
name = "LOF"
syntax = "LOF(FileNum)"
group = "Files and folders"
origin = "rapidr"
doc = "The length in bytes of a file opened with `OPEN`."

[[builtin]]
name = "LOG"
syntax = "LOG(Number)"
group = "Numbers"
doc = "The natural logarithm (base e) of a positive number."

[[builtin]]
name = "LPRINT"
syntax = "LPRINT [Expression][;|,][...]"
group = "System"
doc = "Prints to the printer as `PRINT` prints to the console; `LFLUSH` sends the job. RapidR makes each job a PDF for the system's printer."

[[builtin]]
name = "LTRIM$"
syntax = "LTRIM$(String)"
group = "Strings"
doc = "The string without its leading spaces."

[[builtin]]
name = "MEMCMP"
syntax = "MEMCMP(ptr1, ptr2, count)"
group = "Arrays and memory"
doc = "Compares `count` bytes at two addresses: true (-1) when they are the same, 0 when not (unlike C's memcmp)."

[[builtin]]
name = "MEMCPY"
syntax = "MEMCPY(dest, source, count)"
group = "Arrays and memory"
doc = "Copies `count` bytes from one address to another (addresses from `VARPTR`, `UDTPTR` or a stream's `Pointer`); in RapidR a bad address is a run-time error, never a crash."

[[builtin]]
name = "MEMSET"
syntax = "MEMSET(ptr, byte, count)"
group = "Arrays and memory"
doc = "Sets `count` bytes from an address to one byte value."

[[builtin]]
name = "MESSAGEBOX"
syntax = "MESSAGEBOX(Msg$, Title$, MsgButtons%)"
group = "Dialogs and sound"
doc = "Shows a message box with the buttons and icon the `MB_` flags ask for; returns the `ID` constant (`IDOK`, `IDYES`, …) of the button chosen."

[[builtin]]
name = "MESSAGEDLG"
syntax = "MESSAGEDLG(Msg$, MsgType, MsgButtons, HelpContext)"
group = "Dialogs and sound"
doc = "Shows a message dialog of a type (`mtWarning`, `mtError`, `mtInformation`, `mtConfirmation`, `mtCustom`) with the `mb` buttons given; returns the `mr` constant of the one chosen."

[[builtin]]
name = "MICROTIMER"
syntax = "MICROTIMER"
group = "Library functions"
missing = true
doc = "A high-resolution timer reading, for timing short intervals more finely than `TIMER`."

[[builtin]]
name = "MID$"
syntax = "MID$(String, Position, Num)"
group = "Strings"
doc = "`Num` characters of a string from `Position` (1 the first); without `Num`, the rest of the string."

[[builtin]]
name = "MKDIR"
syntax = "MKDIR Dir$"
group = "Files and folders"
doc = "Creates a folder."

[[builtin]]
name = "MOUSEX"
syntax = "MOUSEX"
group = "System"
bare = true
doc = "The mouse pointer's horizontal position, relative to the active form's client area."

[[builtin]]
name = "MOUSEY"
syntax = "MOUSEY"
group = "System"
bare = true
doc = "The mouse pointer's vertical position, relative to the active form's client area."

[[builtin]]
name = "MSGBOX"
syntax = "MSGBOX(Msg$)"
group = "Dialogs and sound"
origin = "rapidr"
doc = "Shows a message box with an OK button and returns 0 when it is closed."

[[builtin]]
name = "NVIEWLIBPRESENT"
syntax = "NVIEWLIBPRESENT"
group = "Library functions"
missing = true
doc = "Whether the NViewLib image library (JPEG and other formats) is available to the program."

[[builtin]]
name = "OCT"
syntax = "OCT(Number)"
group = "Strings"
origin = "rapidr"
doc = "The octal digits of a whole number, as text: `OCT(8)` is `10`."

[[builtin]]
name = "OPEN"
syntax = "OPEN FileName$ FOR mode AS #FileNum"
group = "Files and folders"
origin = "rapidr"
doc = "Opens a file for `INPUT`, `OUTPUT`, `APPEND`, `BINARY` or `RANDOM` access under a file number (see `FREEFILE`)."

[[builtin]]
name = "OUT"
syntax = "OUT(Address, bytevalue)"
group = "System"
doc = "Writes a byte to a hardware I/O port. Windows doesn't let programs reach the ports, so the call stops the program with a run-time error, as it did under RapidQ on Windows."

[[builtin]]
name = "OUTW"
syntax = "OUTW(Address, wordvalue)"
group = "System"
doc = "Writes a 16-bit word to a hardware I/O port. Windows doesn't let programs reach the ports, so the call stops the program with a run-time error."

[[builtin]]
name = "PARAMSTR$"
syntax = "PARAMSTR$(n)"
group = "Routines"
doc = "In a `SUBI` or `FUNCTIONI`: the n-th string argument it was called with (1 the first), \"\" past the last."

[[builtin]]
name = "PARAMSTRCOUNT"
syntax = "PARAMSTRCOUNT"
group = "Routines"
doc = "In a `SUBI` or `FUNCTIONI`: how many string arguments it was called with."

[[builtin]]
name = "PARAMVAL"
syntax = "PARAMVAL(n)"
group = "Routines"
doc = "In a `SUBI` or `FUNCTIONI`: the n-th numeric argument it was called with (1 the first), 0 past the last."

[[builtin]]
name = "PARAMVALCOUNT"
syntax = "PARAMVALCOUNT"
group = "Routines"
doc = "In a `SUBI` or `FUNCTIONI`: how many numeric arguments it was called with."

[[builtin]]
name = "PCOPY"
syntax = "PCOPY source, dest"
group = "Console"
doc = "Copies one console page (0 is the screen, 1 to 7 are off-screen buffers) onto another."

[[builtin]]
name = "PEEK"
syntax = "PEEK([#PageNum,] address)"
group = "Arrays and memory"
doc = "Reads one byte: of a console page (addresses 0 to 3999 of page 0 are the screen, an even address a cell's character, the odd one after it its colour attribute), or of the program's own memory at an address from VARPTR and the like. Any other address is a run-time error."

[[builtin]]
name = "PI"
syntax = "PI"
group = "Numbers"
bare = true
origin = "rapidr"
doc = "The number π, 3.14159265358979…"

[[builtin]]
name = "PLAYSOUND"
syntax = "PLAYSOUND(FileName$)"
group = "Dialogs and sound"
origin = "rapidr"
doc = "Plays a sound file in the background."

[[builtin]]
name = "PLAYWAV"
syntax = "PLAYWAV FileName$|Resource_Handle, SndOption"
group = "Dialogs and sound"
doc = "Plays a WAV file or `$RESOURCE` in the background (`SND_ASYNC`), waiting for its end (`SND_SYNC`) or repeating (`SND_LOOP`); `PLAYWAV \"\"` stops it."

[[builtin]]
name = "POKE"
syntax = "POKE [#PageNum,] address, byte"
group = "Arrays and memory"
doc = "Writes one byte: into a console page (on page 0 it shows at once), or into the program's own memory at an address from VARPTR and the like. Any other address is a run-time error."

[[builtin]]
name = "POS"
syntax = "POS(0)"
group = "Console"
doc = "The console cursor's column, 1 being the first."

[[builtin]]
name = "POSTMESSAGE"
syntax = "POSTMESSAGE(Handle, uMsg, wParam, lParam)"
group = "System"
missing = true
doc = "Puts a Windows message in a window's queue and returns without waiting for it to be handled."

[[builtin]]
name = "RANDOMIZE"
syntax = "RANDOMIZE [Num]"
group = "Numbers"
doc = "Starts `RND`'s sequence from a seed: the same seed gives the same numbers on every runtime. Without one, a fresh seed."

[[builtin]]
name = "RELEASECAPTURE"
syntax = "RELEASECAPTURE"
group = "Library functions"
missing = true
doc = "Releases the mouse capture a window holds."

[[builtin]]
name = "RENAME"
syntax = "RENAME File1$, File2$"
group = "Files and folders"
doc = "Renames (or moves) a file from the first name to the second."

[[builtin]]
name = "REPLACE$"
syntax = "REPLACE$(Source$, Replace$, Index)"
group = "Strings"
doc = "`Replace$` written over `Source$` from character `Index` (1 the first): `REPLACE$(\"Hello\", \"J\", 1)` is `Jello`. To find and replace, `REPLACESUBSTR$`."

[[builtin]]
name = "REPLACESUBSTR$"
syntax = "REPLACESUBSTR$(Source$, ReplaceStr$, Withstr$)"
group = "Strings"
doc = "`Source$` with every occurrence of `ReplaceStr$` replaced by `Withstr$`."

[[builtin]]
name = "RESOURCE"
syntax = "RESOURCE(number%)"
group = "Files and folders"
doc = "The handle of the n-th resource built into the program with `$RESOURCE` (0 the first), for `EXTRACTRESOURCE`, `PLAYWAV` or a picture."

[[builtin]]
name = "RESOURCECOUNT"
syntax = "RESOURCECOUNT"
group = "Files and folders"
bare = true
doc = "The number of resources built into the program with `$RESOURCE`."

[[builtin]]
name = "REVERSE$"
syntax = "REVERSE$(S$)"
group = "Strings"
doc = "The string with its characters in reverse order."

[[builtin]]
name = "RGB"
syntax = "RGB(Red%, Green%, Blue%)"
group = "Colours"
doc = "The colour value for red, green and blue parts of 0 to 255 each, as RapidQ stores colours (blue in the high byte)."

[[builtin]]
name = "RIGHT$"
syntax = "RIGHT$(String,Num)"
group = "Strings"
doc = "The last `Num` characters of a string (all of it when it is shorter)."

[[builtin]]
name = "RINSTR"
syntax = "RINSTR([Start,] SearchString, FindString)"
group = "Strings"
doc = "The position (1 the first) of the last occurrence of `FindString` in `SearchString`, 0 when there is none."

[[builtin]]
name = "RMDIR"
syntax = "RMDIR Dir$"
group = "Files and folders"
doc = "Removes an empty folder."

[[builtin]]
name = "RND"
syntax = "RND(UpperBound)"
group = "Numbers"
bare = true
doc = "A random number: bare, a real from 0 up to (not including) 1; `RND(n)`, a whole number from 0 to n - 1. `RANDOMIZE` seeds it."

[[builtin]]
name = "ROUND"
syntax = "ROUND(Number)"
group = "Numbers"
doc = "A number rounded as `INT(x + 0.5)`: 2.5 gives 3, -2.5 gives -2; a 32-bit integer."

[[builtin]]
name = "RTLMOVEMEMORY"
syntax = "RTLMOVEMEMORY(dest, source, count)"
group = "Library functions"
missing = true
doc = "Copies a block of memory from one address to another (Windows' routine of that name)."

[[builtin]]
name = "RTRIM$"
syntax = "RTRIM$(String)"
group = "Strings"
doc = "The string without its trailing spaces."

[[builtin]]
name = "RUN"
syntax = "RUN command$"
group = "System"
doc = "Starts a program (a command line) without waiting for it; returns its process ID, 0 when it couldn't start."

[[builtin]]
name = "SEEK"
syntax = "SEEK #FileNum, Position"
group = "Files and folders"
origin = "rapidr"
doc = "Moves to a byte of a file opened with `OPEN`: the next read or write is there (1 the first byte)."

[[builtin]]
name = "SENDMESSAGE"
syntax = "SENDMESSAGE(Handle, uMsg, wParam, lParam)"
group = "System"
missing = true
doc = "Sends a Windows message to a window and waits for the result its window procedure returns."

[[builtin]]
name = "SETCAPTURE"
syntax = "SETCAPTURE(Handle)"
group = "Library functions"
missing = true
doc = "Makes a window receive all mouse input until the capture is released."

[[builtin]]
name = "SETCONSOLETITLE"
syntax = "SETCONSOLETITLE(Title$)"
group = "Console"
doc = "Sets the title of the console (terminal) window."

[[builtin]]
name = "SETFOCUS"
syntax = "SETFOCUS(Handle)"
group = "Library functions"
missing = true
doc = "Gives the keyboard focus to a window by its handle."

[[builtin]]
name = "SGN"
syntax = "SGN(Number)"
group = "Numbers"
doc = "The sign of a number: 1 if positive, -1 if negative, 0 if zero."

[[builtin]]
name = "SHELL"
syntax = "SHELL command$"
group = "System"
doc = "Runs a command with the system's shell and waits until it has finished; returns its exit code."

[[builtin]]
name = "SHELLWAIT"
syntax = "SHELLWAIT(command$)"
group = "System"
origin = "rapidr"
doc = "Runs a command with the system's shell, waits until it has finished and returns its exit code (-1 when it couldn't run)."

[[builtin]]
name = "SHL"
syntax = "SHL(Number, Bits)"
group = "Numbers"
doc = "A number's 32 bits shifted left by `Bits` (its low 5 bits), as a signed 32-bit integer; also an operator, `a SHL n`."

[[builtin]]
name = "SHOWMESSAGE"
syntax = "SHOWMESSAGE text$"
group = "Dialogs and sound"
doc = "Shows a message in a modal box with an OK button, titled with the application's title."

[[builtin]]
name = "SHR"
syntax = "SHR(Number, Bits)"
group = "Numbers"
doc = "A number's 32 bits shifted right by `Bits` (its low 5 bits), zeros coming in from the left; also an operator, `a SHR n`."

[[builtin]]
name = "SIN"
syntax = "SIN(Number)"
group = "Numbers"
doc = "The sine of an angle in radians."

[[builtin]]
name = "SIZEOF"
syntax = "SIZEOF (Var(Index))"
group = "Arrays and memory"
doc = "The size in bytes of a variable, array element, array, type or TYPE, as RapidQ lays it out in memory."

[[builtin]]
name = "SLEEP"
syntax = "SLEEP Num"
group = "System"
doc = "Pauses the program for a number of seconds; fractions allowed (`SLEEP 0.5`)."

[[builtin]]
name = "SOUND"
syntax = "SOUND freq, duration"
group = "Dialogs and sound"
doc = "Plays a tone of a frequency in hertz for a duration in milliseconds, in the background."

[[builtin]]
name = "SPACE$"
syntax = "SPACE$(Num)"
group = "Strings"
doc = "A string of `Num` spaces."

[[builtin]]
name = "SQR"
syntax = "SQR(Number)"
group = "Numbers"
doc = "The square root of a number."

[[builtin]]
name = "STR$"
syntax = "STR$(Number)"
group = "Strings"
doc = "A number as text, with up to 9 significant digits as RapidQ writes it: `STR$(1 / 3)` is `0.333333333`."

[[builtin]]
name = "STRF$"
syntax = "STRF$(Number, Format%, Precision%, Digits%)"
group = "Strings"
doc = "A number as text in a float format (`ffGeneral`, `ffExponent`, `ffFixed`, `ffNumber`) with `Precision%` significant digits and `Digits%` decimals."

[[builtin]]
name = "STRING$"
syntax = "STRING$(Num, Char) or STRING$(Num, Char$)"
group = "Strings"
doc = "A string of `Num` copies of a character, given by its code or as the first character of a string: `STRING$(3, 65)` is `AAA`."

[[builtin]]
name = "TAB"
syntax = "TAB(Column)"
group = "Console"
doc = "In `PRINT`: spaces up to console column `Column` (1 the first); past it already, that column on the next line."

[[builtin]]
name = "TALLY"
syntax = "TALLY(Search$, Match$)"
group = "Strings"
doc = "The number of times `Match$` occurs in `Search$` (occurrences don't overlap); 0 for an empty `Match$`."

[[builtin]]
name = "TAN"
syntax = "TAN(Number)"
group = "Numbers"
doc = "The tangent of an angle in radians."

[[builtin]]
name = "TIME$"
syntax = "TIME$"
group = "System"
bare = true
doc = "The local time as text, `HH:MM:SS`."

[[builtin]]
name = "TIMER"
syntax = "TIMER"
group = "System"
bare = true
doc = "The seconds since midnight (local time), with fractions, for timing parts of a program."

[[builtin]]
name = "TRIM"
syntax = "TRIM(String)"
group = "Strings"
origin = "rapidr"
doc = "The string without its leading and trailing spaces."

[[builtin]]
name = "UBOUND"
syntax = "UBOUND(ArrayName[, Dimension])"
group = "Arrays and memory"
doc = "The highest index of an array, in its first dimension or the one given (1 the first)."

[[builtin]]
name = "UCASE$"
syntax = "UCASE$(String)"
group = "Strings"
doc = "The string in upper case."

[[builtin]]
name = "UDTPTR"
syntax = "UDTPTR(Variable)"
group = "Arrays and memory"
doc = "The address of a TYPE variable's fields, for `MEMCPY` and the other memory builtins."

[[builtin]]
name = "UNLOADLIBRARY"
syntax = "UNLOADLIBRARY(DLLName)"
group = "System"
missing = true
doc = "Unloads a DLL the program loaded."

[[builtin]]
name = "VAL"
syntax = "VAL(String)"
group = "Strings"
doc = "The number at the start of a text, ignoring spaces and what follows it: `VAL(\"12abc\")` is 12; 0 when there is none."

[[builtin]]
name = "VARPTR"
syntax = "VARPTR(VarName)"
group = "Arrays and memory"
doc = "The address of a variable or array element, for the memory builtins; in RapidR a safe view of the program's own data."

[[builtin]]
name = "VARTYPE"
syntax = "VARTYPE(variant)"
group = "Numbers"
doc = "A code for the kind of value a VARIANT holds, as VB numbers them: 0 empty, 2 integer, 5 double, 8 string, 9 object, 11 Boolean."

[[builtin]]
name = "WSTRING"
syntax = "WSTRING(String$)"
group = "Library functions"
missing = true
doc = "A string converted to wide (UTF-16) characters, for routines that take Unicode text."

[[builtin]]
name = "WSTRINGTOASCII"
syntax = "WSTRINGTOASCII(WideString)"
group = "Library functions"
missing = true
doc = "A wide (UTF-16) string converted back to an ordinary one."
