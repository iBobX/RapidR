[package]
name = "rapidr-value"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
description = "Shared dynamic Value type for RapidR runtimes and bytecode VM"

[dependencies]
# The language registry (GUI-free, static tables, no runtime dependencies):
# the IDE's designer model (designer/) reads component names, sizes,
# defaults and constants from it, and what a new component starts with
# (component_defaults.rs).
rapidr-lang = { workspace = true }
resvg ={ version = "0.48.1", default-features = false }
# RapidR's own icons (objects/icons.rs: Bitmap.LoadIcon, ImageList.AddIcon;
# feature `icons`).
rapidr-icons = { workspace = true, optional = true }
# (L-PANELS, docs/ide-plan.md I1) The project file the project tree shows
# (.rrproj, TOML; wasm-safe). The inspector and the toolbox read the
# registry above.
rapidr-project = { workspace = true }
# JPEG pictures (objects/codec.rs); no threads, so it builds for the web too.
jpeg-decoder = { version = "0.3", default-features = false }
# Text on bitmaps (objects/text.rs): reads the built-in Liberation fonts.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
# RCODEEDITOR's model (objects/codeedit.rs): the editor's document — rope,
# selections, undo tree, search, language definitions (GUI-free, wasm-safe).
rapidr-editor = { workspace = true }
# Its JSON arguments (ApplyEdits, SetDiagnostics, ShowCompletion; MIT OR
# Apache-2.0, already in the tree).
serde_json = "1"
# Markdown (panels/markdown.rs: RMARKDOWNVIEW, RapidR Studio's .md preview):
# CommonMark with GitHub's tables (MIT; pure Rust, wasm-safe). No default
# features: no HTML writer, no command-line parser.
pulldown-cmark = { version = "0.13.4", default-features = false }

# QREGISTRY on Windows: Windows' own registry (registry.rs). Microsoft's
# windows-rs (MIT OR Apache-2.0); its windows-link / -result / -strings are
# already in the tree.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"
# Real pages at a block's address around a DLL call (memory.rs): Microsoft's
# windows-sys (MIT OR Apache-2.0), already in the tree through winit.
windows-sys = { version = "0.52", features = ["Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[features]
# Bitmap.LoadIcon and ImageList.AddIcon: RapidR's icon set in programs (the
# SVGs deflated, inflated on first use). Measured 2026-10-06: a GUI program's
# native exe +154 KB, the web runtime's wasm +119 KB (+64 KB brotli); a
# console program +0 (the linker drops it). Without it the two methods report
# that the build has no icons.
default = ["icons"]
icons = ["dep:rapidr-icons"]

[dev-dependencies]
# Property tests of the designer model (MIT OR Apache-2.0; dev-only, never
# shipped; already in the tree through rapidr-editor).
proptest = { version = "1.11", default-features = false, features = ["std"] }
