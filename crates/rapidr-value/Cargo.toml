[package]
name = "rapidr-value"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
description = "Shared dynamic Value type for RapidR runtimes and bytecode VM"

[dependencies]
resvg = { version = "0.48.1", default-features = false }
# RapidR's own icons (objects/icons.rs: Bitmap.LoadIcon, ImageList.AddIcon;
# feature `icons`).
rapidr-icons = { workspace = true, optional = true }
# (L-PANELS, docs/ide-plan.md I1) The language registry the property
# inspector and the toolbox read (static data, no dependencies), and the
# project file the project tree shows (.rrproj, TOML): both wasm-safe.
rapidr-lang = { workspace = true }
rapidr-project = { workspace = true }
# JPEG pictures (objects/codec.rs); no threads, so it builds for the web too.
jpeg-decoder = { version = "0.3", default-features = false }
# Text on bitmaps (objects/text.rs): reads the built-in Liberation fonts.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

# QREGISTRY on Windows: Windows' own registry (registry.rs). Microsoft's
# windows-rs (MIT OR Apache-2.0); its windows-link / -result / -strings are
# already in the tree.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"

[features]
# Bitmap.LoadIcon and ImageList.AddIcon: RapidR's icon set in programs (the
# SVGs deflated, inflated on first use). Measured 2026-10-06: a GUI program's
# native exe +154 KB, the web runtime's wasm +119 KB (+64 KB brotli); a
# console program +0 (the linker drops it). Without it the two methods report
# that the build has no icons.
default = ["icons"]
icons = ["dep:rapidr-icons"]
