[package]
name = "rapidr-cli"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true

[dependencies]
# `rapidr dev test-mode`: keys, tokens, the build's status (SEC-24)
rapidr-testmode = { workspace = true, features = ["issue"] }
rapidr-codegen-rust.workspace = true
rapidr-lexer.workspace = true
rapidr-parser.workspace = true
rapidr-preprocessor.workspace = true
rapidr-bcgen.workspace = true
rapidr-bytecode.workspace = true
rapidr-vm.workspace = true
rapidr-vm-host-native = { workspace = true, features = ["full", "session", "studio"] }
# RapidR's crash and hang reports for Studio and the programs it runs
rapidr-crash.workspace = true
rapidr-webbundle = { workspace = true, features = ["zip"] }
rapidr-lsp.workspace = true
# The code editor's completion and hovers in programs run here (RapidR Studio's
# RCODEEDITOR): the language service, installed at start (main.rs)
rapidr-langsvc.workspace = true
rapidr-dap.workspace = true
# `rapidr lang`: the language registry's generators
rapidr-lang.workspace = true
# `rapidr i18n`, `rapidr check`: catalogs and the compiler's messages in
# the user's language (RapidR's own, no dependencies).
rapidr-i18n.workspace = true
rapidr-diagnostics.workspace = true
# (RapidR's own catalogs, compiled in: `rapidr i18n runtime`, coverage)
rapidr-value.workspace = true
# `rapidr ai`: the AI provider layer RapidR Studio's assistant uses
rapidr-ai.workspace = true
# `rapidr introspect` (feature `ai-introspect`): the AI introspection
# interface's design-time side (docs/ai-architecture.md; phase 0, off by default)
rapidr-introspect = { workspace = true, optional = true, features = ["design"] }
# `rapidr build`: programs made into apps (Name.app, the .exe's resources, Name.AppDir) with their icons
rapidr-package.workspace = true
# a program's project (`.rrproj`): its app name, icon, version
rapidr-project.workspace = true
# `rapidr import-rapidq` / `upgrade-names`: RapidR's names in RapidQ programs
rapidr-import.workspace = true
# `rapidr school-lock`: School Lock's password hash and policy check for a
# school's IT (rapidr-studio's school_lock: the same code Studio uses)
rapidr-studio.workspace = true
base64 = "0.22"
# Downloaded files are remembered by content (SHA-256)
sha2 = "0.10"
# THIRD-PARTY-NOTICES.txt reads `cargo metadata` (notices.rs)
serde_json = "1"

[features]
# Local development builds only: the GUI test hooks act without a test-mode
# token (SEC-24). Never in a release build (tools/release/, tools/studio_app.sh
# release; tests/security/test_mode_release.mjs checks).
dev-hooks = ["rapidr-testmode/dev-hooks"]
# AI-ARCH phase 0: `rapidr introspect` (describe / list / get over a
# program's source). Off in every build RapidR ships until `rapidr mcp` lands.
ai-introspect = ["dep:rapidr-introspect"]

[target.'cfg(unix)'.dependencies]
# Reads the attribute a download carries (macOS' quarantine, Linux's origin)
libc = "0.2"

[[bin]]
name = "rapidr"
path = "src/main.rs"

[dev-dependencies]
# (tests/session.rs: the IDE's end of a session against `rapidr run --session`)
rapidr-session.workspace = true
# (tests/app_eyes.rs: a screenshot's PNG, base64)
rapidr-value.workspace = true
