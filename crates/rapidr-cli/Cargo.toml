[package]
name = "rapidr-cli"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true

[dependencies]
rapidr-codegen-rust.workspace = true
rapidr-lexer.workspace = true
rapidr-parser.workspace = true
rapidr-preprocessor.workspace = true
rapidr-bcgen.workspace = true
rapidr-bytecode.workspace = true
rapidr-vm.workspace = true
rapidr-vm-host-native = { workspace = true, features = ["full"] }
rapidr-webbundle.workspace = true
rapidr-lsp.workspace = true
rapidr-dap.workspace = true
base64 = "0.22"
# Downloaded files are remembered by content (SHA-256)
sha2 = "0.10"
# THIRD-PARTY-NOTICES.txt reads `cargo metadata` (notices.rs)
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# Reads the attribute a download carries (macOS' quarantine, Linux's origin)
libc = "0.2"

[[bin]]
name = "rapidr"
path = "src/main.rs"
