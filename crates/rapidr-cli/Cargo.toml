[package]
name = "rapidr-cli"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true

[dependencies]
rapidr-codegen-rust.workspace = true
rapidr-lexer.workspace = true
rapidr-parser.workspace = true
rapidr-preprocessor.workspace = true
rapidr-bcgen.workspace = true
rapidr-bytecode.workspace = true
rapidr-vm.workspace = true
rapidr-vm-host-native = { workspace = true, features = ["full", "session", "studio"] }
rapidr-webbundle.workspace = true
rapidr-lsp.workspace = true
# The code editor's IntelliSense in programs run here (RapidR Studio's
# RCODEEDITOR): the language service, installed at start (main.rs)
rapidr-langsvc.workspace = true
rapidr-dap.workspace = true
# `rapidr lang`: the language registry's generators
rapidr-lang.workspace = true
# `rapidr build`: programs made into apps (Name.app, the .exe's resources, Name.AppDir) with their icons
rapidr-package.workspace = true
# a program's project (`.rrproj`): its app name, icon, version
rapidr-project.workspace = true
# `rapidr import-rapidq` / `upgrade-names`: RapidR's names in RapidQ programs
rapidr-import.workspace = true
base64 = "0.22"
# Downloaded files are remembered by content (SHA-256)
sha2 = "0.10"
# THIRD-PARTY-NOTICES.txt reads `cargo metadata` (notices.rs)
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# Reads the attribute a download carries (macOS' quarantine, Linux's origin)
libc = "0.2"

[[bin]]
name = "rapidr"
path = "src/main.rs"

[dev-dependencies]
# (tests/session.rs: the IDE's end of a session against `rapidr run --session`)
rapidr-session.workspace = true
