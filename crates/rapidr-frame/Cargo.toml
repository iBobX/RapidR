[package]
name = "rapidr-frame"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
description = "RDATAFRAME, the one data-frame engine of every RapidR runtime (polars; decision D7): a pure interface — a call in, a reply out, no I/O"

[dependencies]
# MIT. What RDATAFRAME uses: lazy queries, CSV and JSON, every dtype,
# strings, round / abs / log, and tables printed without a terminal
# (`fmt_no_tty`: `fmt` pulls crossterm, which has no wasm).
polars = { version = "0.46", optional = true, default-features = false, features = ["lazy", "csv", "json", "dtype-full", "strings", "round_series", "abs", "log", "fmt_no_tty"] }
serde = { version = "1", features = ["derive"] }

[features]
# The engine itself (polars). Without it, only the call and reply types:
# what the web runtime sends to and reads from the frame module.
default = ["engine"]
engine = ["dep:polars"]
