[package]
name = "rapidr-ai"
description = "RapidR's AI provider layer (docs/ide-ai.md §2): Anthropic's Messages API and OpenAI-compatible Chat Completions (OpenAI, DeepSeek, Ollama, LM Studio, xAI …) over plain HTTPS with our own client — one normalized request, stream and tool-call model, errors explained in plain words, models listed, API keys in the OS keychain (a browser tab's session on the web). No vendor SDKs."
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true

# wasm-safe: the request building, the stream decoders and the error
# explanations are pure; the transport and the key store are the
# platform's (cfg: a thread and ureq on the desktop, fetch in a browser).
[dependencies]
# (SEC-24: the test hooks act only in development builds or with a signed
# test-mode token — docs/security/test-mode.md)
rapidr-testmode.workspace = true
serde_json = { version = "1", features = ["preserve_order"] }
# RapidR's own words in the person's language (rapidr_i18n::host: the host
# installs how to translate; English without) and `{name}` templates; no
# dependencies of its own
rapidr-i18n.workspace = true
# (feature `component`) RAI, the component programs and RapidR Studio use:
# its properties, methods and events in the runtimes' values
rapidr-value = { workspace = true, optional = true }

[features]
default = []
component = ["dep:rapidr-value"]

# The desktop's HTTPS: ureq with the operating system's TLS (native-tls:
# Security.framework, SChannel, OpenSSL 3 on Linux) — the same client and
# features RHTTP uses (rapidr-runtime-core), so nothing new is compiled in.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["gzip", "native-tls"] }
# API keys in the OS keychain (docs/ide-ai.md §3): keyring-core and its
# per-OS stores, all MIT OR Apache-2.0, no C library of their own.
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

# (Linux and the BSDs: the Secret Service — GNOME Keyring, KWallet — over
# D-Bus in pure Rust. Its session is encrypted with the system's OpenSSL 3,
# which HTTPS (native-tls) loads on these systems anyway: AES and HKDF are
# OpenSSL's, so no AES, CBC or HKDF code is compiled into the program. Not
# `crypto-rust`: it would compile the `aes`, `cbc` and `hkdf` crates in
# (docs/licensing.md §2.1, LEGAL.md "Export"). What stays in the crate itself
# is the Diffie-Hellman key exchange of the Secret Service's own protocol.)
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-openssl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = ["Window", "console", "Storage", "Headers", "Request", "RequestInit", "RequestMode", "Response", "ReadableStream", "ReadableStreamDefaultReader", "AbortController", "AbortSignal"] }

# (RAI: a tool call that comes later; needs the component)
[[test]]
name = "later_tools"
required-features = ["component"]
