[package]
name = "rapidr-project"
description = "RapidR Studio's project file (.rrproj format 2, TOML), per-user workspace state, and loading the web IDE's JSON v1 projects and plain .bas / .rr files"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
