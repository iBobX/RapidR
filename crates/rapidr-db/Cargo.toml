[package]
name = "rapidr-db"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
description = "RSQLITE and RMYSQL as every RapidR runtime has them: one SQLite (native builds, the interpreter, the web), parameter binding"

[dependencies]
rapidr-value = { workspace = true }
# (no derive: it pulled the unmaintained proc-macro-error2; flate2 in pure
# Rust: no system zlib.) Encrypted connections (RMySQL's SSLMode) on the
# operating system's TLS through native-tls (MIT OR Apache-2.0), the same
# crate and features HTTPS uses (ureq): Security.framework on macOS,
# SChannel on Windows, the system's OpenSSL 3 on Linux. No TLS library is
# compiled in (never the crate's rustls features: deny.toml bans them).
mysql = { version = "28", optional = true, default-features = false, features = ["minimal-rust", "buffer-pool", "native-tls"] }

# One SQLite everywhere: compiled from its C sources into native builds and
# the interpreter (`bundled`), and into the web's wasm (sqlite-wasm-rs).
# `serialize` opens a project's .db file on the web from its bytes;
# `backup` copies them into the page's session file; `column_metadata`
# tells which table a result column came from (the web's bound widgets
# write their edits back); `modern_sqlite` (which `bundled` implies) words
# errors the same on the web: `no such function: f in SELECT f(1) at
# offset 7`.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
rusqlite = { version = "0.40", optional = true, default-features = false, features = ["ffi-sqlite-wasm-rs", "modern_sqlite", "serialize", "backup", "column_metadata"] }

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
rusqlite = { version = "0.40", optional = true, default-features = false, features = ["bundled", "serialize", "backup", "column_metadata"] }

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]
# RMYSQL (native builds and the interpreter: a browser can't open the TCP
# connection MySQL's protocol needs).
mysql = ["dep:mysql"]
