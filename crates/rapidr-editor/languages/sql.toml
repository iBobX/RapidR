# SQL (RSQLITE, RMYSQL): the words SQLite and MySQL / MariaDB share. Each
# dialect's own words are added as it loads (crates/rapidr-editor/src/sql.rs):
# `sql` has both, `sql-sqlite` and `sql-mysql` one each (SqlDialect).

[language]
id = "sql"
name = "SQL"
extensions = ["sql"]
case_insensitive = true
line_comment = ["--"]
block_comment = ["/*", "*/"]
word = '[A-Za-z_][A-Za-z0-9_]*'

[brackets]
pairs = [["(", ")"]]
auto_close = [["(", ")"], ["'", "'"], ['"', '"']]

[indent]
increase = '(\(|\bBEGIN|\bCASE)\s*(--.*)?$'
decrease = '^\s*(\)|END\b)'

[folding]
# a statement over several lines (to its `;`), a bracketed list or subquery
statements = ";"
brackets = true

[keywords]
keyword = ["SELECT", "FROM", "WHERE", "INSERT", "INTO", "VALUES", "UPDATE", "SET", "DELETE", "CREATE", "TABLE", "INDEX", "VIEW", "TRIGGER", "DROP", "ALTER", "ADD", "COLUMN", "RENAME", "PRIMARY", "KEY", "FOREIGN", "REFERENCES", "JOIN", "INNER", "LEFT", "RIGHT", "OUTER", "FULL", "CROSS", "NATURAL", "USING", "ON", "AS", "AND", "OR", "NOT", "NULL", "IS", "IN", "EXISTS", "BETWEEN", "LIKE", "ORDER", "BY", "GROUP", "HAVING", "LIMIT", "OFFSET", "UNION", "INTERSECT", "EXCEPT", "ALL", "DISTINCT", "CASE", "WHEN", "THEN", "ELSE", "END", "BEGIN", "COMMIT", "ROLLBACK", "TRANSACTION", "UNIQUE", "DEFAULT", "CHECK", "CONSTRAINT", "IF", "REPLACE", "WITH", "RECURSIVE", "ASC", "DESC", "EXPLAIN", "DATABASE", "SCHEMA", "RETURNING", "IGNORE", "TEMP", "TEMPORARY", "COLLATE", "ESCAPE", "OVER", "PARTITION", "WINDOW", "ROWS", "RANGE", "PRECEDING", "FOLLOWING", "UNBOUNDED", "CURRENT", "ROW"]
type = ["INTEGER", "INT", "TINYINT", "SMALLINT", "MEDIUMINT", "BIGINT", "TEXT", "REAL", "BLOB", "NUMERIC", "VARCHAR", "CHAR", "BOOLEAN", "BOOL", "DATE", "DATETIME", "TIMESTAMP", "TIME", "DECIMAL", "FLOAT", "DOUBLE", "PRECISION", "JSON"]
function = ["COUNT", "SUM", "AVG", "MIN", "MAX", "COALESCE", "IFNULL", "NULLIF", "LENGTH", "SUBSTR", "SUBSTRING", "UPPER", "LOWER", "TRIM", "LTRIM", "RTRIM", "ROUND", "ABS", "CAST", "CONCAT", "ROW_NUMBER", "RANK", "DENSE_RANK", "LAG", "LEAD"]
constant = ["TRUE", "FALSE", "CURRENT_DATE", "CURRENT_TIME", "CURRENT_TIMESTAMP"]

[defaults]
string = "string"
quoted = "variable"
backtick = "variable"
comment = "comment"

[[states.root]]
match = '--.*$'
token = "comment"
[[states.root]]
match = '/\*'
token = "comment"
push = "comment"
[[states.root]]
match = "'"
token = "string"
push = "string"
[[states.root]]
match = '"'
token = "variable"
push = "quoted"
[[states.root]]
match = '`'
token = "variable"
push = "backtick"
[[states.root]]
match = '0x[0-9A-Fa-f]+|([0-9]+\.?[0-9]*|\.[0-9]+)(E[+-]?[0-9]+)?'
token = "number"
[[states.root]]
match = '[?:@$][A-Za-z0-9_]*'
token = "variable.parameter"
[[states.root]]
match = '[A-Za-z_][A-Za-z0-9_]*'
token = "text"
keywords = true
[[states.root]]
match = '[-+*/%=<>!|&~^]+'
token = "operator"
[[states.root]]
match = '[(),;.]'
token = "punctuation"

# strings may run across lines; '' is a quote
[[states.string]]
match = "''"
token = "string.escape"
[[states.string]]
match = "'"
token = "string"
pop = true

[[states.quoted]]
match = '""'
token = "variable"
[[states.quoted]]
match = '"'
token = "variable"
pop = true

[[states.backtick]]
match = '`'
token = "variable"
pop = true

[[states.comment]]
match = '\*/'
token = "comment"
pop = true
