# RapidR BASIC (RapidQ's BASIC too; its old id `rapidq-basic` is an alias).
# Its keyword groups come from the compiler's lists
# (src/lang/basic.rs; later the language registry), added when it loads.
# BASIC's semantic colours (which names are SUBs, components, locals) come
# from the language service's semantic tokens, on top of these.

[language]
id = "rapidr-basic"
name = "RapidR BASIC"
extensions = ["rr", "bas", "inc", "rqw", "rqb", "rq"]
case_insensitive = true
line_comment = ["'", "REM "]
word = '[A-Za-z_][A-Za-z0-9_]*[$%&!#]?'
keyword_suffixes = "$%&!#"

[brackets]
pairs = [["(", ")"], ["[", "]"], ["{", "}"]]
auto_close = [["(", ")"], ["[", "]"], ['"', '"']]

[indent]
increase = '''^\s*((SUB|SUBI|FUNCTION|FUNCTIONI|ELSE|ELSEIF|FOR|WHILE|DO|SELECT|CASE|CREATE|TYPE|STRUCT|WITH|PROPERTY|CONSTRUCTOR)\b|\$(IFDEF|IFNDEF|ELSE)\b|IF\b.*\bTHEN\s*('.*)?$)'''
decrease = '^\s*(END\s+(SUB|SUBI|FUNCTION|FUNCTIONI|IF|SELECT|CREATE|TYPE|STRUCT|WITH|PROPERTY|CONSTRUCTOR)\b|ENDIF\b|NEXT\b|WEND\b|LOOP\b|ELSE\b|ELSEIF\b|CASE\b|\$(ENDIF|ELSE)\b)'

[folding]
markers = [
    ['^\s*SUB\b', '^\s*END\s+SUB\b'],
    ['^\s*SUBI\b', '^\s*END\s+SUBI\b'],
    ['^\s*FUNCTION\b', '^\s*END\s+FUNCTION\b'],
    ['^\s*FUNCTIONI\b', '^\s*END\s+FUNCTIONI\b'],
    ['^\s*CREATE\b', '^\s*END\s+CREATE\b'],
    ['^\s*(TYPE|STRUCT)\b', '^\s*END\s+(TYPE|STRUCT)\b'],
    ['^\s*WITH\b', '^\s*END\s+WITH\b'],
    ['^\s*SELECT\b', '^\s*END\s+SELECT\b'],
    ['''^\s*IF\b.*\bTHEN\s*('.*)?$''', '^\s*(END\s*IF)\b'],
    ['^\s*FOR\b', '^\s*NEXT\b'],
    ['^\s*WHILE\b', '^\s*WEND\b'],
    ['^\s*DO\b', '^\s*LOOP\b'],
    ['^\s*\$IFN?DEF\b', '^\s*\$ENDIF\b'],
]

[defaults]
string = "string"
string_escapes = "string"

# Every line starts in `root`; `$ESCAPECHARS ON` moves to `escapes` (strings
# read backslash escapes there) until `$ESCAPECHARS OFF`.
[[states.root]]
match = '^\s*\$ESCAPECHARS\s+ON\b.*$'
token = "directive"
push = "escapes"
[[states.root]]
include = "code"
[[states.root]]
match = '"'
token = "string"
push = "string"

[[states.escapes]]
match = '^\s*\$ESCAPECHARS\s+OFF\b.*$'
token = "directive"
pop = true
[[states.escapes]]
include = "code"
[[states.escapes]]
match = '"'
token = "string"
push = "string_escapes"

[[states.code]]
match = "'.*$"
token = "comment"
[[states.code]]
match = '^\s*REM(\s.*)?$'
token = "comment"
# Rust between RUSTSTART and RUSTEND (each on its own line, as the lexer
# reads them)
[[states.code]]
match = '^\s*RUSTSTART\b.*$'
token = "keyword"
embed = "rust"
end = '^\s*RUSTEND\b.*$'
end_token = "keyword"
[[states.code]]
match = '^\s*\$[A-Za-z]+'
token = "directive"
[[states.code]]
match = '^(\s*)(SUB|SUBI|FUNCTION|FUNCTIONI)(\s+)([A-Za-z_][A-Za-z0-9_.]*[$%&!#]?)'
groups = ["", "keyword", "", "function"]
[[states.code]]
match = '^\s*[A-Za-z_][A-Za-z0-9_]*:(\s|$)'
token = "label"
[[states.code]]
match = '&H[0-9A-F]+&?|&O[0-7]+|&B[01]+'
token = "number"
[[states.code]]
match = '([0-9]+\.?[0-9]*|\.[0-9]+)(E[+-]?[0-9]+)?[!#%&]?'
token = "number"
[[states.code]]
match = '[A-Za-z_][A-Za-z0-9_]*[$%&!#]?'
token = "text"
keywords = true
[[states.code]]
match = '[-+*/\\^=<>&]+'
token = "operator"
[[states.code]]
match = '[(),.;:\[\]{}]'
token = "punctuation"

# a string ends at its quote, or with its line
[[states.string]]
match = '"'
token = "string"
pop = true
[[states.string]]
match = '$'
pop = true

[[states.string_escapes]]
match = '\\(x[0-9A-Fa-f]{1,2}|[0-9]{1,3}|.)'
token = "string.escape"
[[states.string_escapes]]
match = '"'
token = "string"
pop = true
[[states.string_escapes]]
match = '$'
pop = true

[[snippets]]
prefix = "sub"
body = "SUB ${1:Name}(${2})\n\t$0\nEND SUB"
description = "A SUB"
[[snippets]]
prefix = "function"
body = "FUNCTION ${1:Name}(${2}) AS ${3:INTEGER}\n\t$0\nEND FUNCTION"
description = "A FUNCTION"
[[snippets]]
prefix = "if"
body = "IF ${1:condition} THEN\n\t$0\nEND IF"
description = "IF … END IF"
[[snippets]]
prefix = "for"
body = "FOR ${1:i} = ${2:1} TO ${3:10}\n\t$0\nNEXT ${1:i}"
description = "FOR … NEXT"
[[snippets]]
prefix = "select"
body = "SELECT CASE ${1:value}\nCASE ${2:1}\n\t$0\nCASE ELSE\nEND SELECT"
description = "SELECT CASE"
[[snippets]]
prefix = "create"
body = "CREATE ${1:Form} AS ${2:QFORM}\n\t$0\nEND CREATE"
description = "CREATE … END CREATE"
[[snippets]]
prefix = "type"
body = "TYPE ${1:Name}\n\t${2:Field} AS ${3:INTEGER}$0\nEND TYPE"
description = "TYPE … END TYPE"
[[snippets]]
prefix = "while"
body = "WHILE ${1:condition}\n\t$0\nWEND"
description = "WHILE … WEND"
[[snippets]]
prefix = "do"
body = "DO\n\t$0\nLOOP UNTIL ${1:condition}"
description = "DO … LOOP UNTIL"
[[snippets]]
prefix = "with"
body = "WITH ${1:Form}\n\t.$0\nEND WITH"
description = "WITH … END WITH"
