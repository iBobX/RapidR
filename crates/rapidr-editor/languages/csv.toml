# CSV / TSV: quoted fields (which may run across lines), separators,
# numeric fields.

[language]
id = "csv"
name = "CSV"
extensions = ["csv", "tsv", "tab"]

[brackets]
auto_close = [['"', '"']]

[folding]
offside = false

[defaults]
quoted = "string"

[[states.root]]
match = '"'
token = "string"
push = "quoted"
[[states.root]]
match = '[,;\t]'
token = "punctuation"
[[states.root]]
match = '([+-]?([0-9]+\.?[0-9]*|\.[0-9]+)([eE][+-]?[0-9]+)?)( *)([,;\t]|$)'
groups = ["number", "", "", "", "punctuation"]
[[states.root]]
match = '[^,;\t"0-9+.-][^,;\t"]*'
token = "text"

[[states.quoted]]
match = '""'
token = "string.escape"
[[states.quoted]]
match = '"'
token = "string"
pop = true
