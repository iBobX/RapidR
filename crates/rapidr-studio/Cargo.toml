[package]
name = "rapidr-studio"
description = "RapidR Studio's services as public non-visual components — RPROJECT (rapidr-project), RLANGUAGESERVICE (rapidr-langsvc), RPROGRAMSESSION (rapidr-session's client) — one implementation the desktop and web runtimes reach through a thin host trait (docs/ide-plan.md I1)"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true

# wasm-safe: the hosts give it files (rapidr-value's file hooks), events and
# a way to launch the program under development.
[dependencies]
rapidr-value.workspace = true
rapidr-project.workspace = true
rapidr-session.workspace = true
rapidr-langsvc.workspace = true
rapidr-lang.workspace = true
# Find in Files: the code editor's own search (regex, case, whole word)
rapidr-editor.workspace = true
rapidr-designer.workspace = true
rapidr-preprocessor.workspace = true
# RAI's project_outline: the program's statements as parsed, and their spans
rapidr-ast.workspace = true
rapidr-diagnostics.workspace = true
# RPROJECT.IconPreview: the project's icon drawn as rapidr build draws it
rapidr-package.workspace = true
# File > Import RapidQ Project or File: the engine of `rapidr import-rapidq`
rapidr-import.workspace = true
# RAIPROJECTTOOLS: the project as tools for RAI (rapidr-ai's component),
# the introspection interface's design-time side for them (describe /
# list / get), JSON
rapidr-ai = { workspace = true, features = ["component"] }
rapidr-introspect = { workspace = true, features = ["design"] }
serde_json = "1"
# RREPOSITORY's local history (local_history.rs): each saved file's copy
# named by its SHA-256 (MIT OR Apache-2.0; already in the tree, rapidr-cli's)
sha2 = "0.10"
# School Lock's password hash (school_lock.rs: PBKDF2-HMAC-SHA256 on
# SHA-256's compression function, which 0.11 runs on the processor's SHA
# instructions where it has them — 600,000 rounds in a fraction of a second);
# MIT OR Apache-2.0, already in the tree (lzma-rust2's)
sha256 = { package = "sha2", version = "0.11", default-features = false }
# School Lock's policy file (school_lock.rs: /Library/Application
# Support/RapidR/policy.toml …; MIT OR Apache-2.0, already in the tree:
# rapidr-project's)
toml = "0.9"

# RREPOSITORY's versions (repository.rs): gitoxide through rapidr-vcs —
# not in a browser (gix doesn't build for wasm: docs/versions-g0.md §5)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rapidr-vcs = { path = "../rapidr-vcs" }
# School Lock's salt: the system's secure random source (MIT OR Apache-2.0,
# already in the tree: rapidr-runtime-core's); the web's comes from the page
getrandom = { version = "0.4.2", default-features = false }

# Run gets your Terminal's PATH (login_path.rs): the login shell read in a
# session of its own (setsid), ended with what it started after its time
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# (local_history.rs and repository.rs: temporary projects)
tempfile = "3"
# (tests: every component of the toolbox added to a form, and the program
# written compiles to bytecode and to Rust)
rapidr-icons.workspace = true
rapidr-lexer.workspace = true
rapidr-parser.workspace = true
rapidr-bcgen.workspace = true
# (examples/ai_eval.rs: the click tests' patterns)
regex = "1.12"
rapidr-codegen-rust.workspace = true
