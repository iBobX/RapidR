[package]
name = "rapidr-ui-host-web"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
description = "RapidR's web host for the UI kernel: the program's forms as kernel-drawn windows on the page (vello_cpu into canvases), input and input methods through the DOM, an ARIA mirror of the kernel's accessibility tree"

# The web host (docs/web-host-plan.md, Stage W3): the web runtime's
# `kernel` feature uses it (`?host=kernel`). It never depends on a runtime
# — its callbacks route input into the kernel (`rapidr_ui_app::desktop`'s
# `Desktop`, the desktop host's own) and wake the runtime, which dispatches.
#
# Feature `spike` (on by default) keeps the W0 spike's wasm API and fixture
# forms (`SpikeForm`, tests/web_host_spike.html, built by
# tools/build_web_host_spike.sh); the runtime builds without it.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["spike"]
spike = []
# vello on WebGPU where the browser has it (the spike's: the CPU renderer
# stays the fallback and what the pixel comparison reads).
gpu = ["spike", "rapidr-ui-render/gpu", "dep:vello", "dep:wasm-bindgen-futures", "web-sys/HtmlCanvasElement"]

[dependencies]
rapidr-value = { workspace = true }
rapidr-ui-kernel = { workspace = true }
# The forms' kernel sides, stacking, the modal list and the queues
# (`Desktop`), shared with the desktop host.
rapidr-ui-app = { workspace = true }
# The drawing the desktop host does too (vello_cpu; with feature gpu,
# vello), without vello_cpu's PNG codec: a browser has no system fonts
# with bitmap glyphs to decode.
rapidr-ui-render = { workspace = true }
# The browser (MIT OR Apache-2.0): the versions the workspace is aligned on.
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
    "CanvasRenderingContext2d", "ContextAttributes2d", "ImageData", "console",
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement", "HtmlTextAreaElement",
    "Node", "NamedNodeMap", "Attr", "CssStyleDeclaration", "DomRect", "DomStringMap", "EventTarget", "Event",
    "AddEventListenerOptions", "MouseEvent", "PointerEvent", "WheelEvent", "KeyboardEvent", "InputEvent",
    "CompositionEvent", "ClipboardEvent", "DataTransfer", "FocusEvent", "FocusOptions", "MediaQueryList",
    "Navigator", "Clipboard", "HtmlHeadElement",
] }
# (feature "gpu") vello on wgpu's WebGPU backend (MIT OR Apache-2.0): its
# surfaces and devices; rapidr-ui-render's vello.
vello = { version = "0.11", optional = true }
wasm-bindgen-futures = { version = "0.4.79", optional = true }

# The desktop's capture of the same forms, for the pixel comparison
# (examples/desktop_capture.rs): the shared CPU path built as the desktop
# host builds it (its PNG decoder on), the kernel's text system without
# the system's fonts (parley's fontique).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rapidr-ui-render = { workspace = true, features = ["png"] }
parley = { version = "0.11", default-features = false, features = ["std"] }

[[example]]
name = "desktop_capture"
required-features = ["spike"]
