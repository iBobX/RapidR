[package]
name = "rapidr-runtime-core"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true

[dependencies]
rapidr-value = { workspace = true }
# Which names are components and their methods (object.rs): the language registry's
rapidr-lang = { workspace = true }
# (preserve_order: an object's keys stay in their order, as the web's RJSON
# — the browser's JSON — keeps them)
serde_json = { version = "1", features = ["preserve_order"] }
# TIMER, DATE$, TIME$: the local time (TIMER is seconds since midnight, as
# RapidQ's on Windows).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# RSQLITE and RMYSQL (shared with the web runtime: one SQLite everywhere)
rapidr-db = { workspace = true, optional = true, features = ["mysql"] }
# RHTTP and QDOWNLOAD's https (network.rs). Its TLS is the operating
# system's, through native-tls (MIT OR Apache-2.0): Security.framework on
# macOS, SChannel on Windows, the system's OpenSSL 3 on Linux (libssl.so.3,
# linked dynamically, never shipped; libssl-dev to build). No cryptography is
# compiled into a program, and the certificates are the system's.
ureq = { version = "2", optional = true, default-features = false, features = ["gzip", "native-tls"] }
# RPLOT's charts: drawn by the UI kernel's renderer (rapidr-ui-render's
# chart.rs), the one every runtime uses — no chart library of the desktop's own.
rapidr-ui-render = { workspace = true, optional = true }
# Sound (sound.rs): rodio (MIT OR Apache-2.0) plays it and decodes WAV
# (hound), Ogg Vorbis (lewton) and FLAC (claxon); MP3 is nanomp3's (MIT OR
# Apache-2.0, pure Rust, a port of the public-domain minimp3), not rodio's
# default symphonia (MPL-2.0).
rodio = { version = "0.19", optional = true, default-features = false, features = ["wav", "vorbis", "flac"] }
nanomp3 = { version = "0.2", optional = true }
# QMIDI's MIDI output (media.rs): MIT; ALSA on Linux (rodio's already),
# CoreMIDI on macOS, winmm on Windows.
midir = { version = "0.11", optional = true }
libloading = { version = "0.8", optional = true }
arboard = { version = "3", optional = true, default-features = false }
# QCOMPORT's serial ports (serial.rs): BSD-2-Clause OR Apache-2.0; libc on
# Unix, windows-sys on Windows — no system package to build.
serial2 = "0.2"
# The UI kernel, the program glue every host shares and the winit /
# headless host (`gui`).
rapidr-ui-kernel = { workspace = true, optional = true }
rapidr-studio = { workspace = true, optional = true }
rapidr-session = { workspace = true, optional = true }
rapidr-ui-app = { workspace = true, optional = true }
rapidr-ui-host-winit = { workspace = true, optional = true }

# Windows: a crash inside a DLL a program called ends it with a message,
# 64-bit pointers checked, 32-bit resource DLLs opened as data (ffi.rs), the
# console shown escape sequences (terminal.rs), QCOMPORT's ListPorts
# (serial_list.rs: SetupAPI's ports with their USB IDs) — Microsoft's
# windows-sys (MIT OR Apache-2.0), the version serial2 uses.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Console", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Registry"] }

[target.'cfg(unix)'.dependencies]
# INKEY$: the terminal read a key at a time (terminal.rs); QDXJOYSTICK's
# evdev gamepads on Linux (joystick/evdev.rs).
libc = "0.2"

# QDXJOYSTICK's gamepads on Windows (Windows.Gaming.Input) and macOS (IOKit),
# with SDL's controller mappings (MIT OR Apache-2.0; the mappings zlib).
# Not on Linux: its backend builds against libudev (joystick/evdev.rs reads
# the kernel's devices itself).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
gilrs = { version = "0.11", optional = true }

[features]
default = ["database", "network", "gui", "datascience", "audio", "ffi", "gamepad"]
database = ["dep:rapidr-db"]
network = ["dep:ureq"]
# The desktop host: the UI kernel, the host-neutral program glue
# (rapidr-ui-app) and the winit host (docs/desktop-host-plan.md), reached
# through `src/ui`; the system clipboard.
gui = ["dep:rapidr-ui-kernel", "dep:rapidr-ui-app", "dep:rapidr-ui-host-winit", "dep:arboard"]
# RNUM, RDATAFRAME, RPLOT: the shared model is rapidr-value's
# (datascience/), the charts drawn by the kernel's renderer.
datascience = ["dep:rapidr-ui-render", "dep:rapidr-ui-kernel"]
audio = ["dep:rodio", "dep:nanomp3", "dep:midir"]
gamepad = ["dep:gilrs"]
ffi = ["dep:libloading"]
# RapidR Studio's components (RPROJECT, RLANGUAGESERVICE, RPROGRAMSESSION:
# rapidr-studio) — the `rapidr` CLI's runtime, not programs' own runners.
studio = ["dep:rapidr-studio", "dep:rapidr-session"]
