[package]
name = "rapidr-dap"
description = "`rapidr dap`: the Debug Adapter Protocol over stdio, mapped onto the program session protocol (docs/ide-plan.md, I6)"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true

# Our own DAP types from the protocol's JSON schema (the `dap` crate is an
# alpha: docs/ide-plan.md §6.6). Synchronous: threads, no async runtime.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rapidr-session.workspace = true
rapidr-preprocessor.workspace = true
