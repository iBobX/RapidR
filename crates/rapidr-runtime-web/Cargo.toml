[package]
name = "rapidr-runtime-web"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true

[dependencies]
rapidr-value = { workspace = true }
# Which names are components and their methods (object_web.rs): the language registry's
rapidr-lang = { workspace = true }
# The program's windows: the UI kernel draws them on the page, as on the
# desktop (docs/web-host-plan.md) — its program glue and the web host.
rapidr-ui-kernel = { workspace = true }
rapidr-ui-app = { workspace = true }
rapidr-ui-host-web = { path = "../rapidr-ui-host-web", default-features = false }
# RSQLITE: SQLite itself, compiled to wasm (shared with the desktop runtime)
rapidr-db = { workspace = true }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"

[dependencies.web-sys]
version = "0.3.106"
features = [
    # Core DOM
    "Window",
    "Document",
    # A form moved to a screen with another scale (OnScaleChanged)
    "MediaQueryList",
    # Caret placement when a grid cell is edited
    "Selection",
    "Range",
    "Element",
    "HtmlElement",
    "Attr",
    "NamedNodeMap",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "HtmlOptionElement",
    "HtmlButtonElement",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "HtmlAudioElement",
    "HtmlVideoElement",
    "HtmlMediaElement",
    "HtmlIFrameElement",
    "HtmlDivElement",
    "HtmlTableElement",
    "HtmlTableRowElement",
    "HtmlTableCellElement",
    "HtmlTableSectionElement",
    "HtmlCollection",
    "HtmlOptionsCollection",
    "HtmlProgressElement",
    "Node",
    "NodeList",
    "Text",
    "CssStyleDeclaration",
    "DomTokenList",
    "DomRect",

    # Events
    "ErrorEvent",
    "Event",
    "EventTarget",
    "MouseEvent", "WheelEvent",
    "KeyboardEvent",
    "InputEvent",
    "HashChangeEvent",
    "CustomEvent",
    "AddEventListenerOptions",

    # Canvas 2D
    "CanvasRenderingContext2d",
    "ImageData",
    "TextMetrics",

    # Network
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    # QDOWNLOAD's transfer, its progress as it comes (io_web.rs)
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "XmlHttpRequest",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "BinaryType",
    "Blob",

    # Storage
    "Storage",
    "StorageEvent",

    # Notifications & Geolocation
    "Notification",
    "NotificationOptions",
    "NotificationPermission",
    "Geolocation",
    "Position",
    "Coordinates",
    "PositionError",
    "PositionOptions",
    "Navigator",
    # (the DirectX lane's: QDXJOYSTICK's gamepads)
    "Gamepad",
    "GamepadButton",

    # File I/O bridge (RFILESTREAM, dialogs, downloads)
    "File",
    "FileList",
    "FileReader",
    "ProgressEvent",
    "BlobPropertyBag",
    "HtmlAnchorElement",

    # Timers & misc
    "Performance",
    "console",
    "Location",
    "History",
    "Url",

    # Networking (RHttp) and audio (BEEP/SOUND) without js_sys::eval
    "XmlHttpRequest",
    "AudioContext",
    "BaseAudioContext",
    "AudioNode",
    "AudioDestinationNode",
    "AudioScheduledSourceNode",
    "OscillatorNode",
    "AudioParam",
    # (QDXSOUND: a WAV's frames played by Web Audio)
    "AudioBuffer",
    "AudioBufferSourceNode",
    "GainNode",
]
