[package]
name = "rapidr-runtime-web"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true

[dependencies]
rapidr-value = { workspace = true }
rapidr-rrcss = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    # Core DOM
    "Window",
    "Document",
    # Caret placement when a grid cell is edited
    "Selection",
    "Range",
    "Element",
    "HtmlElement",
    "Attr",
    "NamedNodeMap",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "HtmlOptionElement",
    "HtmlButtonElement",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "HtmlAudioElement",
    "HtmlVideoElement",
    "HtmlIFrameElement",
    "HtmlDivElement",
    "HtmlTableElement",
    "HtmlTableRowElement",
    "HtmlTableCellElement",
    "HtmlTableSectionElement",
    "HtmlCollection",
    "HtmlOptionsCollection",
    "HtmlProgressElement",
    "Node",
    "NodeList",
    "Text",
    "CssStyleDeclaration",
    "DomTokenList",
    "DomRect",

    # Events
    "ErrorEvent",
    "Event",
    "EventTarget",
    "MouseEvent", "WheelEvent",
    "KeyboardEvent",
    "InputEvent",
    "HashChangeEvent",
    "CustomEvent",
    "AddEventListenerOptions",

    # Canvas 2D
    "CanvasRenderingContext2d",
    "ImageData",
    "TextMetrics",

    # Network
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "BinaryType",
    "Blob",

    # Storage
    "Storage",
    "StorageEvent",

    # Notifications & Geolocation
    "Notification",
    "NotificationOptions",
    "NotificationPermission",
    "Geolocation",
    "Position",
    "Coordinates",
    "PositionError",
    "PositionOptions",
    "Navigator",

    # File I/O bridge (RFILESTREAM, dialogs, downloads)
    "File",
    "FileList",
    "FileReader",
    "ProgressEvent",
    "BlobPropertyBag",
    "HtmlAnchorElement",

    # Timers & misc
    "Performance",
    "console",
    "Location",
    "History",
    "Url",

    # Networking (RHttp) and audio (BEEP/SOUND) without js_sys::eval
    "XmlHttpRequest",
    "AudioContext",
    "BaseAudioContext",
    "AudioNode",
    "AudioDestinationNode",
    "AudioScheduledSourceNode",
    "OscillatorNode",
    "AudioParam",
]
