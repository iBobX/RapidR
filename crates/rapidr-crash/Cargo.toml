[package]
name = "rapidr-crash"
description = "RapidR's own crash and hang reports: written on this computer only (no telemetry), readable, scrubbed — the panic hook, fatal signals (a stack overflow), RapidR Studio's hang watchdog, where the RapidR program was (file, line, SUB, event)"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true

# Nearly a leaf crate (only rapidr-testmode, a leaf): the VM, its hosts, the UI hosts and
# Studio all reach it. No crates.io dependency but libc on Unix, already in
# the tree (MIT OR Apache-2.0).
[dependencies]
# (SEC-24: the test hooks act only in development builds or with a signed
# test-mode token — docs/security/test-mode.md)
rapidr-testmode.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
