[package]
name = "rapidr-ui-host-winit"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
description = "RapidR's desktop host for the UI kernel: winit windows pumped from an ordinary loop, vello on the GPU or vello_cpu, AccessKit, a headless host for tests"

# Desktop only, and never runtime-core: the host's callbacks can't call
# program code because nothing here can reach it (docs/desktop-host-plan.md
# §1.1). It only routes input into the kernel and returns HostEvents.
[dependencies]
rapidr-value = { workspace = true }
rapidr-ui-kernel = { workspace = true }
# (Stage W3) The forms' kernel sides, stacking, modal routing and the
# HostCmd / HostEvent queues (`Desktop`), shared with the web host —
# host-neutral, GUI-free, never the runtime.
rapidr-ui-app = { workspace = true }
# The drawing, shared with the web host: vello on the GPU, vello_cpu for
# captures and where wgpu finds no GPU, with the PNG decoder for colour
# bitmap glyphs among the system's fonts.
rapidr-ui-render = { workspace = true, features = ["gpu", "png"] }
# Windows and input (Apache-2.0). 0.30: what accesskit_winit 0.34 supports.
winit = "0.30"
# The windows' GPU surfaces and devices (vello's util, its wgpu 30; MIT OR
# Apache-2.0): rapidr-ui-render's vello, so the versions are the same.
vello = "0.11"
# The CPU renderer's frames shown in a window (MIT OR Apache-2.0).
softbuffer = "0.4"
# Screen readers (MIT OR Apache-2.0; the winit adapter Apache-2.0).
accesskit = "0.25"
accesskit_winit = "0.34"
pollster = "0.4"
# The system's Open / Save dialogs, async (MIT): a sheet on macOS, made
# inside a pump and polled from runtime-core's step (dialogs.rs). Its
# default features: the XDG portal on Linux (no GTK).
rfd = "0.17"

# Platform answers winit has no API for (platform.rs): the mouse anywhere
# on the screen and the work area, a message box's beep. Already in the
# lock through muda, rfd, softbuffer (objc2 0.6: MIT), winit (windows-sys
# 0.52, x11-dl: MIT OR Apache-2.0 / MIT).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSThread", "NSString", "NSUserDefaults", "NSData"] }
# (timers during native menu tracking, tracking.rs: NSApplication's stop and
# its menu's cancelTracking; a run-loop timer in the common modes through
# core-foundation-sys — MIT OR Apache-2.0, already in the lock through winit)
# (kernel themes, platform.rs: the appearance and Increase Contrast for
# `$THEME auto` — NSWorkspace, NSAccessibility)
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSScreen", "NSGraphics", "NSApplication", "NSResponder", "NSMenu", "NSGraphicsContext", "NSWorkspace", "NSAccessibility", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSImage", "objc2-core-foundation"] }
core-foundation-sys = "0.8"
# (the system tray, tray.rs: a status item's picture as a PNG; MIT OR
# Apache-2.0, already in the lock through vello_cpu)
png = "0.18"
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_UI_Accessibility", "Win32_System_Registry", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "android")))'.dependencies]
x11-dl = "2.21"
# (the system tray, tray.rs: StatusNotifierItem on the session bus — pure
# Rust, no system package; MIT, already in the lock through rfd's portal)
zbus = "5"

# The system's menus (MIT OR Apache-2.0): macOS' menu bar, macOS' and
# Windows' context menus (menu.rs). Not on Linux, where muda needs GTK: the
# kernel draws every menu there (and its default GTK feature stays off).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.21", default-features = false }

[dev-dependencies]
# (the tests read a tree back as the platform adapters do: its text, lines
# and selection from the text runs; MIT OR Apache-2.0, already in the lock
# through accesskit_winit)
accesskit_consumer = "0.39"
