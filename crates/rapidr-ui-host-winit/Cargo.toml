[package]
name = "rapidr-ui-host-winit"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
description = "RapidR's desktop host for the UI kernel: winit windows pumped from an ordinary loop, vello on the GPU or vello_cpu, AccessKit, a headless host for tests"

# Desktop only, and never runtime-core: the host's callbacks can't call
# program code because nothing here can reach it (docs/desktop-host-plan.md
# §1.1). It only routes input into the kernel and returns HostEvents.
[dependencies]
rapidr-value = { workspace = true }
rapidr-ui-kernel = { workspace = true }
# Text layouts the kernel makes (MIT OR Apache-2.0): the kernel's parley,
# its fonts shared with vello through linebender_resource_handle.
parley = { version = "0.11", default-features = false, features = ["std"] }
# Windows and input (Apache-2.0). 0.30: what accesskit_winit 0.34 supports.
winit = "0.30"
# GPU vector drawing on wgpu 30 (MIT OR Apache-2.0); re-exports wgpu and
# peniko / kurbo, so their versions follow vello's.
vello = "0.11"
# The CPU renderer (captures, and where wgpu finds no GPU): vello's
# sparse-strips rasterizer on the same peniko / kurbo / skrifa (Apache-2.0
# OR MIT); its frames shown in a window by softbuffer (MIT OR Apache-2.0).
vello_cpu = "0.3"
# (its glyph crate, for FontEmbolden, which vello_cpu doesn't re-export)
glifo = "0.4"
softbuffer = "0.4"
# Screen readers (MIT OR Apache-2.0; the winit adapter Apache-2.0).
accesskit = "0.25"
accesskit_winit = "0.34"
pollster = "0.4"
# The system's Open / Save dialogs, async (MIT): a sheet on macOS, made
# inside a pump and polled from runtime-core's step (dialogs.rs). Its
# default features: the XDG portal on Linux (no GTK).
rfd = "0.17"

# Platform answers winit has no API for (platform.rs): the mouse anywhere
# on the screen and the work area, a message box's beep. Already in the
# lock through muda, rfd, softbuffer (objc2 0.6: MIT), winit (windows-sys
# 0.52, x11-dl: MIT OR Apache-2.0 / MIT).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSThread"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSScreen", "NSGraphics"] }
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug"] }
[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "android")))'.dependencies]
x11-dl = "2.21"

# The system's menus (MIT OR Apache-2.0): macOS' menu bar, macOS' and
# Windows' context menus (menu.rs). Not on Linux, where muda needs GTK: the
# kernel draws every menu there (and its default GTK feature stays off).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.21", default-features = false }
