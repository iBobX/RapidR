<!doctype html>
<!--
  RapidR Studio on the web (docs/ide-plan.md I1 / L-WEB): the same shell as
  the desktop's (ide/studio.rr, compiled to studio.rrbc), run by the web
  runtime and drawn by the UI kernel on a canvas. Built into
  target/studio-web/ by tools/build_studio_web.sh; serve that folder.

    ?open=examples/gui/hello_form.rr   a file to open
    ?theme=rapidr-dark                 a theme (default: RapidR, as the system)
    ?do=run.start                      commands run once it's up
    ?window=normal                     a 1280 x 800 window, not the whole page
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self' data: blob:; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'">
<title>RapidR Studio</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- Built with RapidR (MIT). Third-party software notices and licences: runtime/THIRD-PARTY-NOTICES.txt -->
<link rel="license" href="runtime/THIRD-PARTY-NOTICES.txt">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #202020; }
  @media (prefers-color-scheme: light) { html, body { background: #e5e5e5; } }
  /* the program under development, in its sandboxed frame, over the documents */
  #studio-run { position: fixed; left: 50%; top: 50%; width: min(880px, 90vw); height: min(620px, 80vh); transform: translate(-50%, -50%); z-index: 20; }
  #studio-run iframe { width: 100%; height: 100%; border: 0; background: transparent; }
  #studio-status { position: fixed; left: 16px; bottom: 12px; font: 12px system-ui, sans-serif; color: #888; pointer-events: none; }
  /* Studio quit (File > Exit): the page says so, and opens it again */
  #studio-closed { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font: 14px system-ui, sans-serif; color: #e6e6e6; }
  #studio-closed.shown { display: flex; }
  #studio-closed div { text-align: center; }
  #studio-closed img { width: 96px; height: 96px; }
  #studio-closed h1 { font-size: 20px; font-weight: 600; margin: 16px 0 6px; }
  #studio-closed p { margin: 0 0 20px; color: #9a9a9a; }
  #studio-closed button { font: inherit; padding: 8px 18px; border-radius: 6px; border: 0; background: #2f5bff; color: #fff; cursor: pointer; }
  #studio-closed button:focus-visible { outline: 2px solid #19c6e6; outline-offset: 2px; }
  @media (prefers-color-scheme: light) { #studio-closed { color: #1f1f1f; } #studio-closed p { color: #5f5f5f; } }
</style>
<script type="module" src="studio.js"></script>
</head>
<body>
<div id="studio-status">Loading RapidR Studio…</div>
<div id="studio-closed" role="dialog" aria-labelledby="studio-closed-title">
  <div>
    <img src="ide/assets/rapidr-studio.svg" alt="">
    <h1 id="studio-closed-title">RapidR Studio has closed</h1>
    <p>Reload the page to open it again.</p>
    <button id="studio-reopen" type="button">Open RapidR Studio</button>
  </div>
</div>
</body>
</html>
