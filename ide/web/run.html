<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RapidR program</title>
  <style>
    /* the program's desktop: the page, as big as its windows reach, which
       this frame scrolls itself (the scroll bars below, the wheel over a
       window's title bar) — the browser's own would take room the
       program's Screen and a maximized window have */
    html { overflow: hidden; }
    html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; background: transparent; }
    .rr-desk-bar { position: fixed; z-index: 2147483000; box-sizing: border-box; background: rgba(128, 128, 128, 0.16); display: none; touch-action: none; }
    .rr-desk-bar.v { right: 0; top: 0; width: 12px; }
    .rr-desk-bar.h { left: 0; bottom: 0; height: 12px; }
    .rr-desk-bar .thumb { position: absolute; box-sizing: border-box; border-radius: 6px; background: rgba(110, 110, 110, 0.72); border: 1px solid rgba(255, 255, 255, 0.55); }
    .rr-desk-bar.v .thumb { left: 2px; width: 8px; }
    .rr-desk-bar.h .thumb { top: 2px; height: 8px; }
    .rr-desk-bar:hover .thumb, .rr-desk-bar .thumb.held { background: rgba(90, 90, 90, 0.9); }
  </style>
  <script type="module">
    // The program under development, sandboxed (SEC-02/03, see ROADMAP.md):
    // RapidR Studio's web page (ide/web/studio.js) runs it here for its
    // RPROGRAMSESSION.
    //
    // Studio loads this page in an iframe *without* `allow-same-origin`, so it
    // runs in an opaque origin: user programs cannot read the IDE's storage
    // (API keys, projects) or DOM, and the IDE cannot reach in either.
    //
    // Protocol:
    //   1. We post `{ __rapidr_hello }` to our parent.
    //   2. The parent answers once with `{ __rapidr_boot }` plus a private
    //      MessagePort. We accept that single message only from `parent`.
    //   3. Everything afterwards flows over the port; window messages are
    //      ignored, so no other window can drive or impersonate the runtime.
    //   4. Debugging, the program runs under RapidR's program session
    //      protocol (rapidr-session): `{ __rapidr_session: json }` both ways
    //      — the IDE's requests in, the program's events out (its console
    //      output among them).
    //
    // The runtime JS/wasm arrive inside the boot message because an
    // opaque-origin document cannot fetch same-server modules without CORS.

    let port = null;
    const pending = [];
    const send = (msg) => (port ? port.postMessage(msg) : pending.push(msg));
    // (the fallback fonts' chunks, asked of the IDE: this frame's origin is
    // opaque, so it can't fetch them itself — crates/rapidr-runtime-web's
    // fonts_web.rs)
    const fontWaiters = new Map();
    let fontAsks = 0;
    window.RAPIDR_FONT_FETCH = (file) => new Promise((resolve, reject) => {
      const id = ++fontAsks;
      fontWaiters.set(id, { resolve, reject });
      send({ __rapidr_font: { id, file } });
    });

    const fileWaiters = new Map();
    let fileAsks = 0;
    const askFiles = (msg) => new Promise((resolve, reject) => {
      const id = ++fileAsks;
      fileWaiters.set(id, { resolve, reject });
      send({ __rapidr_files: { id, ...msg } });
    });

    const text = (args) => args.map((a) => {
      if (typeof a === "string") return a;
      try { return JSON.stringify(a); } catch { return String(a); }
    }).join(" ");
    // Under a session, what the program prints is the session's output.
    let sessionMode = false;
    const sessionEvent = (event) => send({ __rapidr_session: JSON.stringify(event) });
    for (const level of ["log", "info", "warn", "error"]) {
      const orig = console[level].bind(console);
      console[level] = (...args) => {
        orig(...args);
        if (sessionMode) {
          const stream = level === "log" || level === "info" ? "stdout" : "stderr";
          sessionEvent({ type: "output", stream, text: text(args) + "\n" });
        } else {
          send({ __rapidr_console: { level, text: text(args) } });
        }
      };
    }
    window.addEventListener("error", (e) => {
      send({ __rapidr_console: { level: "error", text: `${e.message || "error"} (${e.filename || "?"}:${e.lineno || 0})` } });
    });
    window.addEventListener("unhandledrejection", (e) => {
      send({ __rapidr_console: { level: "error", text: "Unhandled promise rejection: " + (e.reason?.message || e.reason) } });
    });

    // Opaque origins have no Web Storage. Provide Storage-compatible shims:
    // localStorage is seeded from, and written back to, a per-project
    // namespace the IDE keeps; sessionStorage lives for this run only.
    function makeStorage(initial, onChange) {
      const map = new Map(Object.entries(initial || {}));
      const api = {
        get length() { return map.size; },
        key: (i) => [...map.keys()][i] ?? null,
        getItem: (k) => (map.has(String(k)) ? map.get(String(k)) : null),
        setItem: (k, v) => { map.set(String(k), String(v)); onChange?.("set", String(k), String(v)); },
        removeItem: (k) => { map.delete(String(k)); onChange?.("remove", String(k)); },
        clear: () => { map.clear(); onChange?.("clear"); },
      };
      return api;
    }
    function installStorage(snapshot) {
      const local = makeStorage(snapshot, (op, key, value) => send({ __rapidr_storage: { op, key, value } }));
      const session = makeStorage({});
      Object.defineProperty(window, "localStorage", { value: local, configurable: true });
      Object.defineProperty(window, "sessionStorage", { value: session, configurable: true });
    }

    async function boot(data, bootPort) {
      port = bootPort;
      for (const msg of pending.splice(0)) port.postMessage(msg);
      port.onmessage = (e) => {
        if (typeof e.data?.__rapidr_session === "string" && sessionMode) {
          try { window.__rapidr_rt.session_request(e.data.__rapidr_session); }
          catch (err) { sessionEvent({ type: "output", stream: "stderr", text: "[session] " + err + "\n" }); }
        }
        if (e.data?.__rapidr_files_reply) {
          const { id, ok, value, error } = e.data.__rapidr_files_reply;
          const w = fileWaiters.get(id);
          fileWaiters.delete(id);
          if (w) ok ? w.resolve(value) : w.reject(Object.assign(new Error(error?.message || "failed"), { name: error?.name || "Error" }));
        }
        if (e.data?.__rapidr_font_reply) {
          const { id, bytes } = e.data.__rapidr_font_reply;
          const w = fontWaiters.get(id);
          fontWaiters.delete(id);
          if (w) bytes ? w.resolve(bytes) : w.reject(new Error("no such font"));
        }
      };

      // (the program's Open / Save dialogs: this frame's opaque origin may
      // not show the browser's file pickers, so Studio's page shows them —
      // studio.js frameFiles; crates/rapidr-runtime-web/src/file_picker_web.rs)
      if (data.filePickers) {
        window.RAPIDR_FILE_HOST = {
          open: (opts) => askFiles({ op: "open", opts }),
          save: (opts) => askFiles({ op: "save", opts }),
          write: (token, bytes) => askFiles({ op: "write", token, bytes }),
        };
      }
      window.__rapidr_assets = data.assets || {};
      // (the frame an RWEBVIEW's Html runs in, beside the runtime: its own
      // sandboxed, opaque-origin frame — crates/rapidr-runtime-web's
      // overlay_web.rs, docs/security-audit.md SEC-15)
      window.RAPIDR_WEBVIEW_FRAME = new URL("runtime/rapidr-webview.html", location.href).href;
      // (the program's command line — COMMAND$(n), CommandCount — is its
      // own, never this frame's query string, which is the IDE's)
      window.RAPIDR_ARGS = Array.isArray(data.args) ? data.args.map(String) : [];
      // (its own path — Application.ExeName, a message's caption: its
      // Title — the program's, not this frame's run.html)
      if (typeof data.session?.program === "string") window.RAPIDR_EXE_PATH = data.session.program;
      installStorage(data.storage);

      const url = URL.createObjectURL(new Blob([data.runtimeJs], { type: "text/javascript" }));
      const rt = await import(url);
      URL.revokeObjectURL(url);
      // (for tests and tools: read a property the way the program does)
      window.__rapidr_rt = rt;
      await rt.default({ module_or_path: data.runtimeWasm });
      // (Studio's "Preview in classic": the look of a program that names none)
      if (data.theme && rt.rapidr_set_theme) rt.rapidr_set_theme(data.theme);
      send({ __rapidr_status: "preview ready — running" });

      if (data.run) {
        try { rt.rapidr_run_bc(data.run); }
        catch (err) { send({ __rapidr_console: { level: "error", text: "[run error] " + err } }); }
      } else if (data.session) {
        // (the IDE sets the breakpoints, then `start`s it)
        sessionMode = true;
        try { rt.session_open(data.session.bytes, data.session.program || "program", (json) => send({ __rapidr_session: json })); }
        catch (err) {
          sessionEvent({ type: "output", stream: "stderr", text: "[session] " + err + "\n" });
          sessionEvent({ type: "exited", code: 1 });
        }
      }
    }

    // ---- the program's windows float over the whole of Studio ----
    // This frame covers Studio's viewport; Studio clips it (clip-path, which
    // also decides where clicks land) to the program's windows, so they move
    // anywhere on the page and Studio takes every click outside them. The
    // windows' rectangles go to Studio as they change; while a mouse button
    // is held in here (a window dragged or resized) Studio shows the whole
    // frame, so nothing is cut while it moves. Only rectangles leave the
    // frame — never its content — and Studio keeps them inside its page.
    let lastRects = "";
    let rectsSoon = false;

    // ---- the program's desktop scrolls: no window is ever cut off ----
    // A window past the page's right or bottom edge (bigger than the page,
    // or dragged there) makes the desktop that much bigger: a scroll bar
    // shows along that edge while it's needed — thin, over what's beneath,
    // as an MDI client's or the system's overlay scroll bars — and the
    // wheel over a window's title bar (or a scroll bar) scrolls it; the
    // keyboard's focus moved to something out of view brings it into view.
    // (The web host keeps windows right of and below the page's corner:
    // their title bars can't be lost — crates/rapidr-ui-host-web, on_desktop.)
    const bars = {};
    function makeBar(dir) {
      const track = document.createElement("div");
      track.className = "rr-desk-bar " + dir;
      track.setAttribute("aria-hidden", "true");
      const thumb = document.createElement("div");
      thumb.className = "thumb";
      track.appendChild(thumb);
      document.documentElement.appendChild(track);
      const vertical = dir === "v";
      let grab = null;
      track.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.target === thumb) {
          thumb.setPointerCapture(e.pointerId);
          thumb.classList.add("held");
          grab = { at: vertical ? e.clientY : e.clientX, from: vertical ? scrollY : scrollX };
        } else {
          // (the track beside the thumb: a page that way)
          const r = thumb.getBoundingClientRect();
          const before = vertical ? e.clientY < r.top : e.clientX < r.left;
          const page = (vertical ? innerHeight : innerWidth) * 0.9 * (before ? -1 : 1);
          vertical ? scrollBy(0, page) : scrollBy(page, 0);
        }
      });
      thumb.addEventListener("pointermove", (e) => {
        if (!grab) return;
        const b = bars[dir];
        const moved = (vertical ? e.clientY : e.clientX) - grab.at;
        const to = grab.from + moved * (b.content / b.length);
        vertical ? scrollTo(scrollX, to) : scrollTo(to, scrollY);
      });
      for (const up of ["pointerup", "pointercancel"]) thumb.addEventListener(up, () => { grab = null; thumb.classList.remove("held"); });
      return { track, thumb, content: 1, length: 1 };
    }
    function desktopSize() {
      // (as far as the windows reach)
      let w = 0, h = 0;
      for (const win of document.querySelectorAll(".rr-kwin")) {
        if (getComputedStyle(win).display === "none") continue;
        const r = win.getBoundingClientRect();
        w = Math.max(w, Math.ceil(r.right + scrollX));
        h = Math.max(h, Math.ceil(r.bottom + scrollY));
      }
      return { w, h };
    }
    let spacer = null;
    const BAR = 12;
    function layoutDesktop() {
      const reach = desktopSize();
      // (a bar takes its strip of the page: what's under it scrolls past it)
      let needV = reach.h > innerHeight, needH = reach.w > innerWidth;
      for (let i = 0; i < 2; i++) {
        needV = reach.h > innerHeight - (needH ? BAR : 0);
        needH = reach.w > innerWidth - (needV ? BAR : 0);
      }
      // (at least the page)
      const size = { w: Math.max(innerWidth, reach.w + (needV ? BAR : 0)), h: Math.max(innerHeight, reach.h + (needH ? BAR : 0)) };
      // (the page as big as the desktop: scrollTo reaches all of it)
      if (!spacer) {
        spacer = document.createElement("div");
        spacer.setAttribute("aria-hidden", "true");
        spacer.style.cssText = "position:absolute;left:0;top:0;width:1px;height:1px;pointer-events:none;visibility:hidden";
        document.body.appendChild(spacer);
      }
      spacer.style.width = size.w + "px";
      spacer.style.height = size.h + "px";
      // (back inside when the desktop shrank)
      const maxX = Math.max(0, size.w - innerWidth), maxY = Math.max(0, size.h - innerHeight);
      if (scrollX > maxX || scrollY > maxY) scrollTo(Math.min(scrollX, maxX), Math.min(scrollY, maxY));
      for (const [dir, need, content, view, pos] of [["v", needV, size.h, innerHeight, scrollY], ["h", needH, size.w, innerWidth, scrollX]]) {
        if (!need && !bars[dir]) continue;
        const b = bars[dir] || (bars[dir] = makeBar(dir));
        b.track.style.display = need ? "block" : "none";
        if (!need) continue;
        // (the two bars leave the corner to each other)
        const length = view - (needV && needH ? BAR : 0);
        b.content = content;
        b.length = length;
        if (dir === "v") b.track.style.height = length + "px";
        else b.track.style.width = length + "px";
        const thumbLen = Math.max(24, Math.round((length * view) / content));
        const at = Math.round(((length - thumbLen) * pos) / Math.max(1, content - view));
        if (dir === "v") Object.assign(b.thumb.style, { top: at + "px", height: thumbLen + "px" });
        else Object.assign(b.thumb.style, { left: at + "px", width: thumbLen + "px" });
      }
      // (for the tests: the desktop's size and scroll)
      window.RAPIDR_DESKTOP = { w: size.w, h: size.h, x: scrollX, y: scrollY };
    }
    // (the wheel nothing in a window took — over a title bar, a frame, a
    // scroll bar: the program's own areas take theirs — scrolls the desktop)
    window.addEventListener("wheel", (e) => {
      if (e.defaultPrevented) return;
      const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1;
      const dx = e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX, dy = e.shiftKey && !e.deltaX ? 0 : e.deltaY;
      if (document.documentElement.scrollHeight > innerHeight || document.documentElement.scrollWidth > innerWidth) {
        e.preventDefault();
        scrollBy(dx * k, dy * k);
      }
    }, { passive: false });
    // (the focus moved out of view by the user's keys — Tab, an arrow —:
    // shown; a program's own first focus leaves the desktop at its top,
    // the window's title bar seen)
    let keyedAt = -1e9;
    window.addEventListener("keydown", () => { keyedAt = performance.now(); }, true);
    document.addEventListener("focusin", (e) => {
      const el = e.target;
      if (performance.now() - keyedAt > 1000 || !(el instanceof Element) || !el.closest(".rr-kwin")) return;
      const r = el.getBoundingClientRect();
      const dx = r.right > innerWidth ? Math.min(r.right - innerWidth + 12, r.left) : r.left < 0 ? r.left : 0;
      const dy = r.bottom > innerHeight ? Math.min(r.bottom - innerHeight + 12, r.top) : r.top < 0 ? r.top : 0;
      if (dx || dy) scrollBy(dx, dy);
    });
    window.addEventListener("scroll", () => rectsChanged(), { passive: true });

    function windowRects() {
      const out = [];
      for (const w of document.querySelectorAll(".rr-kwin")) {
        if (getComputedStyle(w).display === "none") continue;
        // (the window, its frame canvas with the shadow, its grips, an open
        // menu's or list's popup reaching past it)
        for (const el of [w, ...w.querySelectorAll(":scope > canvas, :scope > .rr-kgrip")]) {
          if (el !== w && getComputedStyle(el).display === "none") continue;
          const r = el.getBoundingClientRect();
          if (r.width < 1 || r.height < 1) continue;
          const x = Math.floor(r.left), y = Math.floor(r.top);
          out.push([x, y, Math.ceil(r.right) - x, Math.ceil(r.bottom) - y]);
        }
      }
      // (the desktop's scroll bars, while shown)
      for (const b of Object.values(bars)) {
        if (b.track.style.display === "none") continue;
        const r = b.track.getBoundingClientRect();
        out.push([Math.floor(r.left), Math.floor(r.top), Math.ceil(r.width), Math.ceil(r.height)]);
      }
      return out;
    }
    function sendRects() {
      rectsSoon = false;
      layoutDesktop();
      const rects = windowRects();
      const key = JSON.stringify(rects);
      if (key === lastRects) return;
      lastRects = key;
      send({ __rapidr_windows: { rects } });
    }
    function rectsChanged() {
      if (rectsSoon) return;
      rectsSoon = true;
      requestAnimationFrame(sendRects);
    }
    // (changes to the windows; the scroll bars' and the spacer's own, which
    // the rectangles' turn makes, don't count — they'd loop)
    const ours = (n) => n === spacer || (n instanceof Element && !!n.closest(".rr-desk-bar"));
    new MutationObserver((records) => {
      if (records.some((r) => !ours(r.target))) rectsChanged();
    }).observe(document.documentElement, { subtree: true, childList: true, attributes: true, attributeFilter: ["style", "class", "width", "height"] });
    window.addEventListener("resize", rectsChanged);
    window.addEventListener("pointerdown", () => send({ __rapidr_windows: { held: true } }), true);
    for (const up of ["pointerup", "pointercancel"]) {
      window.addEventListener(up, () => { send({ __rapidr_windows: { held: false } }); rectsChanged(); }, true);
    }

    let booted = false;
    window.addEventListener("message", (e) => {
      if (booted || e.source !== parent || !e.data?.__rapidr_boot || !e.ports[0]) return;
      booted = true;
      boot(e.data.__rapidr_boot, e.ports[0]).catch((err) => {
        send({ __rapidr_console: { level: "error", text: "[preview boot error] " + err } });
        if (sessionMode) sessionEvent({ type: "exited", code: 1 });
      });
    });
    // Nothing sensitive is sent here, and an opaque origin can't name its
    // parent's origin as a target, so "*" is required and safe.
    parent.postMessage({ __rapidr_hello: true }, "*");
  </script>
</head>
<body>
</body>
</html>
