<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RapidR program preview</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; }
  </style>
  <script type="module">
    // Sandboxed program runtime (SEC-02/03, see ROADMAP.md).
    //
    // The IDE loads this page in an iframe *without* `allow-same-origin`, so it
    // runs in an opaque origin: user programs cannot read the IDE's storage
    // (API keys, projects) or DOM, and the IDE cannot reach in either.
    //
    // Protocol:
    //   1. We post `{ __rapidr_hello }` to our parent.
    //   2. The parent answers once with `{ __rapidr_boot }` plus a private
    //      MessagePort. We accept that single message only from `parent`.
    //   3. Everything afterwards flows over the port; window messages are
    //      ignored, so no other window can drive or impersonate the runtime.
    //
    // The runtime JS/wasm arrive inside the boot message because an
    // opaque-origin document cannot fetch same-server modules without CORS.

    let port = null;
    const pending = [];
    const send = (msg) => (port ? port.postMessage(msg) : pending.push(msg));
    // (the fallback fonts' chunks, asked of the IDE: this frame's origin is
    // opaque, so it can't fetch them itself — crates/rapidr-runtime-web's
    // fonts_web.rs)
    const fontWaiters = new Map();
    let fontAsks = 0;
    window.RAPIDR_FONT_FETCH = (file) => new Promise((resolve, reject) => {
      const id = ++fontAsks;
      fontWaiters.set(id, { resolve, reject });
      send({ __rapidr_font: { id, file } });
    });

    // (RDATAFRAME's engine, a wasm module of its own the runtime loads before
    // a program with data frames runs — asked of the IDE too:
    // crates/rapidr-runtime-web's frame_web.rs)
    let frameWaiter = null;
    window.RAPIDR_FRAME_LOAD = () => new Promise((resolve, reject) => {
      frameWaiter = { resolve, reject };
      send({ __rapidr_frame: true });
    }).then(async ({ js, wasm }) => {
      const url = URL.createObjectURL(new Blob([js], { type: "text/javascript" }));
      const m = await import(url);
      URL.revokeObjectURL(url);
      await m.default({ module_or_path: wasm });
      return m;
    });

    const text = (args) => args.map((a) => {
      if (typeof a === "string") return a;
      try { return JSON.stringify(a); } catch { return String(a); }
    }).join(" ");
    for (const level of ["log", "info", "warn", "error"]) {
      const orig = console[level].bind(console);
      console[level] = (...args) => {
        orig(...args);
        send({ __rapidr_console: { level, text: text(args) } });
      };
    }
    window.addEventListener("error", (e) => {
      send({ __rapidr_console: { level: "error", text: `${e.message || "error"} (${e.filename || "?"}:${e.lineno || 0})` } });
    });
    window.addEventListener("unhandledrejection", (e) => {
      send({ __rapidr_console: { level: "error", text: "Unhandled promise rejection: " + (e.reason?.message || e.reason) } });
    });

    // Opaque origins have no Web Storage. Provide Storage-compatible shims:
    // localStorage is seeded from, and written back to, a per-project
    // namespace the IDE keeps; sessionStorage lives for this run only.
    function makeStorage(initial, onChange) {
      const map = new Map(Object.entries(initial || {}));
      const api = {
        get length() { return map.size; },
        key: (i) => [...map.keys()][i] ?? null,
        getItem: (k) => (map.has(String(k)) ? map.get(String(k)) : null),
        setItem: (k, v) => { map.set(String(k), String(v)); onChange?.("set", String(k), String(v)); },
        removeItem: (k) => { map.delete(String(k)); onChange?.("remove", String(k)); },
        clear: () => { map.clear(); onChange?.("clear"); },
      };
      return api;
    }
    function installStorage(snapshot) {
      const local = makeStorage(snapshot, (op, key, value) => send({ __rapidr_storage: { op, key, value } }));
      const session = makeStorage({});
      Object.defineProperty(window, "localStorage", { value: local, configurable: true });
      Object.defineProperty(window, "sessionStorage", { value: session, configurable: true });
    }

    let debugSession = null;
    function freeDebugSession() {
      if (debugSession) { debugSession.free(); debugSession = null; }
    }

    function handleDebugResult(status) {
      if (status === "paused") {
        send({
          __rapidr_debug_paused: {
            line: debugSession.get_current_line(),
            stack: JSON.parse(debugSession.get_stack_trace()),
            vars: JSON.parse(debugSession.get_variables()),
          },
        });
      } else if (status === "waiting") {
        send({ __rapidr_debug_running: true });
      } else if (status === "halted") {
        send({ __rapidr_debug_halted: true });
        freeDebugSession();
      }
    }
    // Called from wasm when a breakpoint is hit inside an event handler.
    window.__rapidr_handle_debug_result = handleDebugResult;

    function onDebugCommand(cmd) {
      if (!debugSession) return;
      try {
        if (cmd.type === "resume") handleDebugResult(debugSession.resume());
        else if (cmd.type === "stepInto") handleDebugResult(debugSession.step_into());
        else if (cmd.type === "stepOver") handleDebugResult(debugSession.step_over());
        else if (cmd.type === "stepOut") handleDebugResult(debugSession.step_out());
        else if (cmd.type === "setBreakpoints") debugSession.set_breakpoints(cmd.lines);
        else if (cmd.type === "getProperties") {
          const props = debugSession.get_component_properties(cmd.id);
          send({ __rapidr_debug_properties: { id: cmd.id, properties: JSON.parse(props) } });
        } else if (cmd.type === "stop") {
          freeDebugSession();
          send({ __rapidr_debug_halted: true });
        }
      } catch (err) {
        send({ __rapidr_console: { level: "error", text: "[debug cmd error] " + err } });
        send({ __rapidr_debug_halted: true });
        freeDebugSession();
      }
    }

    async function boot(data, bootPort) {
      port = bootPort;
      for (const msg of pending.splice(0)) port.postMessage(msg);
      port.onmessage = (e) => {
        if (e.data?.__rapidr_debug_cmd) onDebugCommand(e.data.__rapidr_debug_cmd);
        if (e.data?.__rapidr_font_reply) {
          const { id, bytes } = e.data.__rapidr_font_reply;
          const w = fontWaiters.get(id);
          fontWaiters.delete(id);
          if (w) bytes ? w.resolve(bytes) : w.reject(new Error("no such font"));
        }
        if (e.data?.__rapidr_frame_reply) {
          const { js, wasm } = e.data.__rapidr_frame_reply;
          const w = frameWaiter;
          frameWaiter = null;
          if (w) js && wasm ? w.resolve({ js, wasm }) : w.reject(new Error("the IDE has no data-frame module (runtime/rapidrframe.js)"));
        }
      };

      window.__rapidr_assets = data.assets || {};
      installStorage(data.storage);

      const url = URL.createObjectURL(new Blob([data.runtimeJs], { type: "text/javascript" }));
      const rt = await import(url);
      URL.revokeObjectURL(url);
      // (for tests and tools: read a property the way the program does)
      window.__rapidr_rt = rt;
      await rt.default({ module_or_path: data.runtimeWasm });
      send({ __rapidr_status: "preview ready — running" });

      if (data.run) {
        try { rt.rapidr_run_bc(data.run); }
        catch (err) { send({ __rapidr_console: { level: "error", text: "[run error] " + err } }); }
      } else if (data.debug) {
        try {
          debugSession = new rt.DebugSession(data.debug);
          if (data.breakpoints) debugSession.set_breakpoints(data.breakpoints);
          handleDebugResult(debugSession.start());
        } catch (err) {
          send({ __rapidr_console: { level: "error", text: "[debug init error] " + err } });
          send({ __rapidr_debug_halted: true });
        }
      }
    }

    let booted = false;
    window.addEventListener("message", (e) => {
      if (booted || e.source !== parent || !e.data?.__rapidr_boot || !e.ports[0]) return;
      booted = true;
      boot(e.data.__rapidr_boot, e.ports[0]).catch((err) => {
        send({ __rapidr_console: { level: "error", text: "[preview boot error] " + err } });
        send({ __rapidr_debug_halted: true });
      });
    });
    // Nothing sensitive is sent here, and an opaque origin can't name its
    // parent's origin as a target, so "*" is required and safe.
    parent.postMessage({ __rapidr_hello: true }, "*");
  </script>
</head>
<body>
</body>
</html>
