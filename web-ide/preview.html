<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RapidR program preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Roboto:wght@400;500;700&family=Montserrat:wght@400;500;700&family=Nunito:wght@400;500;700&family=Playfair+Display:wght@400;700&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; }
  </style>
  <script type="module">
    import init, { rapidr_run_bc, DebugSession } from "./runtime/rapidrintr.js?v=2.7.0";

    // Forward console output to the parent IDE.
    const origLog = console.log.bind(console);
    console.log = (...args) => {
      origLog(...args);
      parent.postMessage({ __rapidr_log: args.map(String).join(" ") }, "*");
    };

    let debugSession = null;

    function handleDebugResult(status) {
      if (status === "paused") {
        const line = debugSession.get_current_line();
        const stackStr = debugSession.get_stack_trace();
        const varsStr = debugSession.get_variables();
        parent.postMessage({
          __rapidr_debug_paused: {
            line,
            stack: JSON.parse(stackStr),
            vars: JSON.parse(varsStr)
          }
        }, "*");
      } else if (status === "waiting") {
        parent.postMessage({ __rapidr_debug_running: true }, "*");
      } else if (status === "halted") {
        parent.postMessage({ __rapidr_debug_halted: true }, "*");
        if (debugSession) {
          debugSession.free();
          debugSession = null;
        }
      }
    }
    window.__rapidr_handle_debug_result = handleDebugResult;

    // Listen BEFORE init returns so the parent's postMessage isn't
    // dropped by the race with top-level await.
    window.addEventListener("message", (e) => {
      if (!e.data) return;

      if (e.data.__rapidr_run) {
        if (debugSession) {
          debugSession.free();
          debugSession = null;
        }
        try { rapidr_run_bc(e.data.__rapidr_run); }
        catch (err) {
          parent.postMessage({ __rapidr_log: "[run error] " + err }, "*");
        }
      }

      else if (e.data.__rapidr_debug) {
        if (debugSession) {
          debugSession.free();
          debugSession = null;
        }
        try {
          debugSession = new DebugSession(e.data.__rapidr_debug);
          if (e.data.breakpoints) {
            debugSession.set_breakpoints(e.data.breakpoints);
          }
          const res = debugSession.start();
          handleDebugResult(res);
        } catch (err) {
          parent.postMessage({ __rapidr_log: "[debug init error] " + err }, "*");
          parent.postMessage({ __rapidr_debug_halted: true }, "*");
        }
      }

      else if (e.data.__rapidr_debug_cmd && debugSession) {
        const cmd = e.data.__rapidr_debug_cmd;
        try {
          if (cmd.type === "resume") {
            handleDebugResult(debugSession.resume());
          } else if (cmd.type === "stepInto") {
            handleDebugResult(debugSession.step_into());
          } else if (cmd.type === "stepOver") {
            handleDebugResult(debugSession.step_over());
          } else if (cmd.type === "stepOut") {
            handleDebugResult(debugSession.step_out());
          } else if (cmd.type === "setBreakpoints") {
            debugSession.set_breakpoints(cmd.lines);
          } else if (cmd.type === "getProperties") {
            const props = debugSession.get_component_properties(cmd.id);
            parent.postMessage({ __rapidr_debug_properties: { id: cmd.id, properties: JSON.parse(props) } }, "*");
          } else if (cmd.type === "stop") {
            debugSession.free();
            debugSession = null;
            parent.postMessage({ __rapidr_debug_halted: true }, "*");
          }
        } catch (err) {
          parent.postMessage({ __rapidr_log: "[debug cmd error] " + err }, "*");
          parent.postMessage({ __rapidr_debug_halted: true }, "*");
          debugSession.free();
          debugSession = null;
        }
      }
    });

    await init();
    // Tell the parent we're ready to receive bytecode. The parent
    // waits for this signal before posting `__rapidr_run`.
    const isDesign = new URLSearchParams(location.search).get("role") === "design";
    parent.postMessage({
      __rapidr_preview_ready: !isDesign,
      __rapidr_design_ready:  isDesign,
      // Only the real preview pane should drive the parent status bar.
      __rapidr_status: isDesign ? undefined : "preview ready — waiting for bytecode",
    }, "*");
  </script>
</head>
<body>
</body>
</html>
