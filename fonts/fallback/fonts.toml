# The fallback fonts: what the UI kernel draws a character with when the
# built-in Liberation fonts (crates/rapidr-value/fonts) lack it — symbols
# (✓ …), Chinese, Japanese and Korean (docs/web-host-plan.md §3.7, Stage W7).
# All are Noto fonts under the SIL Open Font License 1.1 (OFL.txt here), from
# the Noto project's official GitHub release assets, pinned by version and
# SHA-256. None declares a Reserved Font Name (their OFL.txt and the CJK
# LICENSE have no "Reserved Font Name" line), so the subsets keep the fonts'
# own names.
#
# `committed` fonts are in this directory (unmodified, ~0.8 MB): a source
# build without the network still covers symbols. The others are fetched by
# `python3 tools/fonts.py fetch` into target/fonts-src (cached there) and
# split by `python3 tools/fonts.py build <dir>` into chunks a page loads on
# demand. An installed RapidR ships the chunks; it never downloads.

[[font]]
family = "Noto Sans"
file = "NotoSans-Regular.otf"
committed = true
release = "https://github.com/notofonts/latin-greek-cyrillic/releases/download/NotoSans-v2.015/NotoSans-v2.015.zip"
release_sha256 = "0c34df072a3fa7efbb7cbf34950e1f971a4447cffe365d3a359e2d4089b958f5"
member = "NotoSans/unhinted/otf/NotoSans-Regular.otf"

