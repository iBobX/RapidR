# RapidR's icon inventory: what has an icon, and which one.
#
# Components are not listed by hand: build.py reads every component type
# from the code (`COMPONENT_TYPES` in crates/rapidr-ast/src/lib.rs) and
# gives each the component icon of its name without the R
# (RBUTTON -> components/button); `[component-aliases]` names the
# exceptions. When the language registry (crates/rapidr-lang, docs/ide-plan.md
# I0) lands, build.py reads its components instead (each one's `icon`).
# `[planned-components]` are the IDE plan's new components
# (docs/ide-components.md), drawn ahead so they have icons the day they land.
#
# Commands are the IDE's (docs/ide-plan.md §4, I1–I6): the command table the
# menus, toolbar, palette and keyboard will share. Every command, file kind,
# project-tree kind, symbol kind and toolbox group here must name an icon
# that exists, and every component type must have one: build.py fails, and
# so does crates/rapidr-icons' test, naming what's missing.

[component-aliases]
# type = icon (components/<icon>)
RPROGRESS = "progressbar"

[planned-components]
# The IDE's public components (docs/ide-components.md §3) and the linked data
# components of stage I7 (§4), RAI (Phase 5).
RDOCKMANAGER = "dockmanager"
RFORMDESIGNER = "formdesigner"
RPROPERTYINSPECTOR = "propertyinspector"
