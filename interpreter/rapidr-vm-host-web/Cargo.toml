[package]
name = "rapidr-vm-host-web"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rapidr-value = { workspace = true }
rapidr-bytecode = { workspace = true }
rapidr-vm = { workspace = true }
rapidr-runtime-web = { workspace = true }
# Full compile pipeline (source → .rrbc) so the same wasm powers the
# in-browser IDE without needing a second cdylib.
rapidr-lexer = { workspace = true }
rapidr-parser = { workspace = true }
rapidr-preprocessor = { workspace = true }
rapidr-bcgen = { workspace = true }
# The program's end of RapidR Studio's session protocol (the preview frame)
rapidr-session = { workspace = true, features = ["program"] }
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"

[dependencies.web-sys]
version = "0.3.106"
features = ["Window", "Document", "console", "MessageChannel", "MessagePort", "MessageEvent"]
