[package]
name = "rapidr-runner-stub"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Binary name is the user-facing artifact: `rapidrintr-runner`.
[[bin]]
name = "rapidrintr-runner"
path = "src/main.rs"

# Windows' windowed runner (no console window): src/windowed.rs
[[bin]]
name = "rapidrintr-runnerw"
path = "src/windowed.rs"

[dependencies]
# (SEC-24: the test hooks act only in development builds or with a signed
# test-mode token — docs/security/test-mode.md)
rapidr-testmode.workspace = true
# (the desktop host: the UI kernel)
rapidr-vm-host-native = { workspace = true, features = ["gui"] }

[features]
# Local development builds only: the GUI test hooks act without a test-mode
# token (SEC-24). Never in a release build (tools/release/, tools/studio_app.sh
# release; tests/security/test_mode_release.mjs checks).
dev-hooks = ["rapidr-testmode/dev-hooks"]
