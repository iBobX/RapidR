[package]
name = "rapidr-runner-stub"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Binary name is the user-facing artifact: `rapidrintr-runner`.
[[bin]]
name = "rapidrintr-runner"
path = "src/main.rs"

# Windows' windowed runner (no console window): src/windowed.rs
[[bin]]
name = "rapidrintr-runnerw"
path = "src/windowed.rs"

[dependencies]
# (the desktop host: the UI kernel)
rapidr-vm-host-native = { workspace = true, features = ["gui"] }
