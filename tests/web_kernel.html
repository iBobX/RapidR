<!doctype html>
<!--
  The web runtime (target/web, tools/build_web_artifacts.sh), the UI kernel
  its GUI host (docs/web-host-plan.md): what tests/web_gui_run.mjs runs the
  GUI fixtures in, and the page the kernel host's other browser tests load.
  The page only loads the runtime; the test compiles a fixture, gives it the
  test hooks' environment (rapidr_set_test_env) if it plays a case's
  events, and runs it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RapidR web runtime</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #3a6ea5; }
</style>
<script type="module">
  // (the fallback fonts beside the runtime: crates/rapidr-runtime-web's fonts_web.rs)
  window.RAPIDR_FONTS = new URL("../target/web/fonts/", location.href).href;
  // (RDATAFRAME's engine, loaded before a program with data frames runs:
  // crates/rapidr-runtime-web's frame_web.rs)
  window.RAPIDR_FRAME = new URL("../target/web/rapidrframe.js", location.href).href;
  const rt = await import("../target/web/rapidrintr.js");
  await rt.default();
  window.rr = rt;
  window.rrReady = true;
</script>
</head>
<body></body>
</html>
