# cargo-deny configuration — supply-chain checks for RapidR (ROADMAP SEC-09).
#
#   cargo install --locked cargo-deny
#   cargo deny check              # advisories, bans, licenses, sources
#
# Every exception below must say why it is acceptable and when to revisit it.

[graph]
all-features = false

[advisories]
# Vulnerabilities and unsound crates always fail. Unmaintained crates fail
# unless listed here with a justification.
unmaintained = "all"
ignore = [
    # proc-macro-error2: compile-time only, pulled in by mysql-common-derive
    # (mysql 25). Never runs in shipped apps. Revisit on the next mysql upgrade.
    { id = "RUSTSEC-2026-0173", reason = "build-time proc-macro via mysql-common-derive; not in shipped code" },
    # ttf-parser 0.25 is unmaintained (informational, no vulnerability):
    # rapidr-value reads the built-in Liberation fonts with it
    # (objects/text.rs), winit's Wayland title bars through ab_glyph.
    # skrifa, already in the tree through parley and vello, is the way off.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, no known vulnerability; rapidr-value's font reader (objects/text.rs)" },
]

[licenses]
# RapidR is MIT. Everything that can reach a user's program must be open
# source AND allow commercial, closed-source use with no more than a notice:
# no copyleft of any strength (GPL, LGPL, AGPL, MPL, EPL, CDDL, …), no
# source-available terms (SSPL, BUSL), no data licences (CDLA), no
# advertising clauses. A licence not listed here fails `cargo deny check
# licenses` (tools/regress.sh legal) — for the whole workspace: RapidR's
# own tools and its build and dev dependencies are held to it too.
# What goes into a program (each desktop target, the web) is checked again,
# kind by kind, by the CLI's notice generator against exactly this list
# (crates/rapidr-cli/src/notices.rs, ALLOWED; a unit test keeps them equal)
# and by tools/check_notices.py on its own. LEGAL.md and docs/licensing.md
# say what each one asks of whoever ships a program.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "Unicode-3.0",
    # (no crate needs it today; allowed, as public-domain dedication)
    "CC0-1.0",
]
confidence-threshold = 0.9
# Warn about an allowlist entry nothing uses any more, so the list stays the
# real one.
unused-allowed-license = "warn"

[[licenses.clarify]]
# polars-arrow-format ships only a LICENSE file (Apache-2.0).
crate = "polars-arrow-format"
expression = "Apache-2.0"
license-files = []

[bans]
# Duplicate versions are common in a tree this size (polars, wgpu, wasm-bindgen);
# report them without failing. Wildcard version requirements are denied.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# What RapidR replaced so that no program carries copyleft, cryptographic or
# data-licensed code (docs/licensing.md); notices.rs' BANNED says the same
# for each kind of output.
deny = [
    { name = "ring", reason = "cryptography compiled in: TLS is the system's (native-tls)" },
    { name = "rustls", reason = "TLS compiled in: TLS is the system's (native-tls)" },
    { name = "aws-lc-rs", reason = "cryptography compiled in: TLS is the system's (native-tls)" },
    { name = "aws-lc-sys", reason = "cryptography compiled in: TLS is the system's (native-tls)" },
    { name = "openssl-src", reason = "OpenSSL compiled in: Linux uses the system's libssl.so.3" },
    { name = "webpki-roots", reason = "CDLA-licensed certificate data: the system's certificates are used" },
    { name = "symphonia", reason = "MPL-2.0: MP3 is decoded by nanomp3" },
    { name = "symphonia-core", reason = "MPL-2.0: MP3 is decoded by nanomp3" },
    { name = "font-kit", reason = "pulls MPL-2.0 crates and FreeType: charts draw their text with ab_glyph" },
    { name = "dwrote", reason = "MPL-2.0" },
    { name = "option-ext", reason = "MPL-2.0" },
    { name = "freetype-sys", reason = "FreeType's licence asks for credit in the documentation" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
